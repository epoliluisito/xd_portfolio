<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E1B2B">
<title>Circolo Italia Bologna — Free Kick Challenge</title>
<style>
  :root{
    --navy:#1A2F48; --navy-deep:#0E1B2B; --red:#A41F28; --red-bright:#C4262F;
    --bone:#F2EFE9; --white:#fff;
    --serif:'Cinzel','Optima','Palatino Linotype',Palatino,Georgia,serif;
    --sans:'Inter','Helvetica Neue',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#05080E;font-family:var(--sans)}
  body{display:flex;align-items:center;justify-content:center}

  /* On a phone the game fills the screen, whatever that phone's aspect ratio
     happens to be — hard-coding 9:19.5 left bars on most real devices.
     Only wide screens get letterboxed into a phone-shaped frame. */
  #app{
    position:relative;overflow:hidden;background:#000;
    width:100vw;height:100dvh;
    box-shadow:0 0 80px rgba(0,0,0,.8);
  }
  @supports not (height: 100dvh){ #app{ height:100vh } }
  @media (min-aspect-ratio: 3/4){
    #app{ width:min(100vw, calc(100dvh * 9 / 19.5)); height:100dvh; }
  }
  #stage{position:absolute;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}

  .layer{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column}
  .layer.on{pointer-events:auto}
  .hidden{display:none !important}

  /* ---------- HUD ---------- */
  #hud{justify-content:flex-start;padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
  /* Scrim so the HUD stays legible against a bright stand or floodlight. */
  #hud::before{content:'';position:absolute;left:0;right:0;top:0;height:210px;pointer-events:none;
    background:linear-gradient(180deg,rgba(5,10,18,.82),rgba(5,10,18,.45) 45%,transparent)}
  #hud::after{content:'';position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none;
    background:linear-gradient(0deg,rgba(5,10,18,.55),transparent)}
  #hud>*{position:relative}
  .hudbar{display:flex;align-items:center;gap:10px}
  .hudlogo{height:26px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
  .hudlogo.rev{filter:brightness(0) invert(1) drop-shadow(0 1px 3px rgba(0,0,0,.7))}
  .hudtot{margin-left:auto;text-align:right;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7)}
  .hudtot small{display:block;font-size:9px;letter-spacing:.16em;opacity:.75}
  .hudtot b{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1}
  .pips{display:flex;gap:5px;margin-top:10px}
  .pip{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.28)}
  .pip.done{background:var(--red-bright)}
  .pip.now{background:#fff}
  .scen{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff;
       background:rgba(14,27,43,.72);border:1px solid rgba(255,255,255,.18);
       padding:3px 7px;border-radius:99px;backdrop-filter:blur(6px)}
  .hint{margin-top:auto;margin-bottom:calc(env(safe-area-inset-bottom) + 96px);
        text-align:center;color:#fff;font-size:12px;letter-spacing:.08em;
        text-shadow:0 2px 10px rgba(0,0,0,.8);opacity:.9;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}


  /* ---------- power / curve meters ---------- */
  #meters{pointer-events:none}
  .mlabel{position:absolute;font-size:10px;font-weight:700;letter-spacing:.20em;color:#fff;opacity:.95;
          text-shadow:0 2px 6px rgba(0,0,0,.9)}
  .pmeter,.cmeter{position:absolute;opacity:0;transform:scale(.94);
                  transition:opacity .16s ease,transform .16s ease}
  .pmeter.on,.cmeter.on{opacity:1;transform:none}

  .pmeter{right:16px;bottom:20%;width:30px;height:40%}
  .pmeter .mlabel{top:-18px;right:0}
  .pmeter .track{position:absolute;inset:0;border-radius:15px;overflow:hidden;
    background:rgba(8,14,24,.80);border:2px solid rgba(255,255,255,.75);
    box-shadow:0 6px 22px rgba(0,0,0,.5)}
  .pmeter .ideal{position:absolute;left:0;right:0;bottom:63%;height:12%;
    background:rgba(126,240,126,.30);
    border-top:2px solid rgba(150,255,150,.95);border-bottom:2px solid rgba(150,255,150,.95);
    box-shadow:0 0 12px rgba(120,255,120,.45)}
  .pmeter .fill{position:absolute;left:0;right:0;bottom:0;height:0;
    background:linear-gradient(0deg,#8E1620,#C4262F 55%,#F0A24A);opacity:.88}
  .pmeter .mk{position:absolute;left:-3px;right:-3px;height:4px;bottom:0;background:#fff;
    border-radius:2px;box-shadow:0 0 10px rgba(255,255,255,.9)}
  .pmeter .lock{position:absolute;left:-5px;right:-5px;height:3px;background:#F5D67B;
    border-radius:2px;box-shadow:0 0 10px rgba(245,214,123,.9)}

  .cmeter{left:12%;right:12%;bottom:14%;height:26px}
  .cmeter .mlabel{top:-17px;left:0}
  .cmeter .track{position:absolute;inset:0;border-radius:13px;
    background:linear-gradient(90deg,rgba(196,38,47,.85),rgba(8,14,24,.92) 42%,rgba(8,14,24,.92) 58%,rgba(196,38,47,.85));
    border:2px solid rgba(255,255,255,.75);box-shadow:0 6px 26px rgba(0,0,0,.7)}
  .cmeter .mid{position:absolute;left:50%;top:3px;bottom:3px;width:2px;
    background:rgba(255,255,255,.7);transform:translateX(-1px)}
  .cmeter .mk{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;left:50%;
    background:#fff;border-radius:3px;box-shadow:0 0 10px rgba(255,255,255,.9)}
  .cmeter .cl,.cmeter .cr{position:absolute;top:30px;font-size:10px;color:#fff;opacity:.85;
    text-shadow:0 2px 6px rgba(0,0,0,.9)}
  .cmeter .cl{left:0} .cmeter .cr{right:0}

  /* ---------- aim pad: makes the drag mapping visible ---------- */
  .aimpad{position:absolute;left:16px;bottom:15%;width:92px;opacity:0;
          transform:scale(.94);transition:opacity .16s ease,transform .16s ease}
  .aimpad.on{opacity:1;transform:none}
  .aimpad .mlabel{top:-17px;left:2px}
  .aimpad .pad{position:relative;width:92px;height:92px;border-radius:50%;
    background:rgba(8,14,24,.72);border:2px solid rgba(255,255,255,.6);
    box-shadow:0 6px 22px rgba(0,0,0,.6)}
  .aimpad .pad i{position:absolute;background:rgba(255,255,255,.28)}
  .aimpad .pad .hz{left:8%;right:8%;top:50%;height:1px}
  .aimpad .pad .vt{top:8%;bottom:8%;left:50%;width:1px}
  .aimpad .puck{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;
    left:50%;top:50%;border-radius:50%;background:var(--red-bright);
    border:2px solid #fff;box-shadow:0 0 10px rgba(196,38,47,.9)}
  .aimpad .bend{position:relative;margin-top:8px;height:8px;border-radius:4px;
    background:rgba(8,14,24,.72);border:1.5px solid rgba(255,255,255,.5);overflow:hidden}
  .aimpad .bend .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.5)}
  .aimpad .bfill{position:absolute;top:0;bottom:0;left:50%;width:0;background:#F0A24A}
  .aimpad .blabel{display:block;margin-top:3px;font-size:8px;letter-spacing:.18em;
    color:#fff;opacity:.8;text-shadow:0 2px 6px rgba(0,0,0,.9)}

  /* ---------- generic panel ---------- */
  .veil{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,rgba(14,27,43,.55),rgba(5,8,14,.92))}
  .panel{position:relative;margin:auto;width:86%;max-width:340px;text-align:center;color:#fff}
  .kicker{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#C9D3DE;opacity:.85}
  .big{font-family:var(--serif);font-weight:600;letter-spacing:.02em;line-height:1}
  .rule{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);margin:14px 0}

  .btn{pointer-events:auto;display:inline-block;border:0;cursor:pointer;font-family:var(--sans);
       font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
       color:#fff;background:var(--red);padding:15px 30px;border-radius:99px;
       box-shadow:0 8px 26px rgba(164,31,40,.45);transition:transform .12s ease}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.45);box-shadow:none}

  /* ---------- splash ---------- */
  #splash .logo{width:60%;max-width:200px;margin:0 auto 26px;display:block}
  #splash h1{font-family:var(--serif);font-size:29px;font-weight:600;margin:0;line-height:1.12;letter-spacing:.02em}
  #splash h1 em{font-style:normal;color:var(--red-bright);display:block}
  #splash p{font-size:12.5px;line-height:1.65;color:#C9D3DE;margin:16px 0 26px}

  /* ---------- shot card ---------- */
  #card .verdict{font-family:var(--serif);font-size:38px;font-weight:700;letter-spacing:.04em}
  #card .pts{font-family:var(--serif);font-size:60px;font-weight:600;line-height:.95;margin-top:2px}
  #card .rows{margin:16px auto 0;text-align:left;max-width:230px}
  #card .row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;
             border-bottom:1px solid rgba(255,255,255,.10);color:#DCE3EA}
  #card .row b{font-weight:700;color:#fff}
  #card .row.perfect{color:#F5D67B}
  .cardwrap{animation:pop .32s cubic-bezier(.2,1.3,.4,1)}
  @keyframes pop{from{opacity:0;transform:scale(.86) translateY(14px)}to{opacity:1;transform:none}}

  /* ---------- final + leaderboard ---------- */
  #final .total{font-family:var(--serif);font-size:64px;font-weight:600;line-height:1;margin:4px 0 2px}
  #final .pos{font-size:15px;color:#C9D3DE;margin-bottom:6px}
  #final .pos b{color:#fff;font-size:22px;font-family:var(--serif)}
  .msg{font-size:12.5px;line-height:1.6;color:#DCE3EA;background:rgba(26,47,72,.5);
       border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;margin:14px 0}
  .msg.win{border-color:rgba(245,214,123,.5);color:#F7E6B5}
  input.name{pointer-events:auto;width:100%;text-align:center;font-family:var(--serif);
       font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:#fff;
       background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);
       border-radius:10px;padding:12px;margin:6px 0 14px;outline:none}
  input.name:focus{border-color:var(--red-bright)}
  .board{margin:10px 0 16px;max-height:44vh;overflow:auto}
  .brow{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;border-radius:8px}
  .brow+.brow{margin-top:2px}
  .brow .rk{width:22px;text-align:right;font-family:var(--serif);opacity:.7}
  .brow .nm{flex:1;text-align:left;letter-spacing:.08em}
  .brow .sc{font-family:var(--serif);font-weight:600}
  .brow.me{background:linear-gradient(90deg,rgba(164,31,40,.55),rgba(164,31,40,.15));
           box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
  .brow.top{color:#F5D67B}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>

  <div id="hud" class="layer hidden">
    <div class="hudbar">
      <img class="hudlogo rev" id="hudLogo" alt="Circolo Italia Bologna">
      <div class="hudtot"><small>PUNTEGGIO</small><b id="hudTotal">0</b></div>
    </div>
    <div class="pips" id="pips"></div>
    <div class="scen" id="scenTags"></div>
    <div class="hint" id="hint">Trascina per mirare</div>
  </div>

  <div id="meters" class="layer hidden">
    <div class="pmeter" id="pmeter">
      <span class="mlabel">POTENZA</span>
      <div class="track">
        <div class="fill" id="pfill"></div>
        <div class="ideal"></div>
        <div class="mk" id="pmk"></div>
        <div class="lock hidden" id="plock"></div>
      </div>
    </div>
    <div class="aimpad" id="aimpad">
      <span class="mlabel">MIRA</span>
      <div class="pad">
        <i class="hz"></i><i class="vt"></i>
        <div class="puck" id="aimpuck"></div>
      </div>
      <div class="bend"><i class="mid"></i><div class="bfill" id="aimbend"></div></div>
      <span class="blabel">EFFETTO</span>
    </div>
  </div>

  <div id="splash" class="layer on">
    <div class="veil"></div>
    <div class="panel">
      <img class="logo" id="splashLogo" alt="Circolo Italia Bologna">
      <h1>FREE KICK<em>CHALLENGE</em></h1>
      <div class="rule"></div>
      <p>5 calci di punizione.<br>Nessun retry. Ogni tiro conta.<br>Entra nella <b>Top 10</b>.</p>
      <button class="btn" id="btnStart">Nuova Partita</button>
    </div>
  </div>

  <div id="card" class="layer hidden">
    <div class="panel cardwrap" id="cardBody"></div>
  </div>

  <div id="final" class="layer hidden">
    <div class="veil"></div>
    <div class="panel" id="finalBody"></div>
  </div>
</div>
