# GitHub Pages (Jekyll) build configuration.
# Everything listed here is excluded from the DEPLOYED site artifact only —
# the files stay in the repository untouched. This keeps the Pages artifact
# under the hard 1 GB deployment limit.
#
# Verified unreferenced (repo-wide grep across all html/js/css) before listing:
# era_ora uses its own local copies of moon_ground / metal_elevator_door /
# smartphone.glb, and each nimble build ships its own nimble_thickness.png.

exclude:
  # dev/test snapshots
  - projects/nimble/test/
  - projects/nimble/safe_nimble/
  - projects/ai_studio/safe_versions/
  - projects/ai_studio/index_02.html
  # unused heavy assets (referenced by nothing that ships)
  - projects/ai_studio/nimble_thickness.png
  - projects/ai_studio/assets/moon_HDR/
  - projects/ai_studio/assets/moon_ground/
  - projects/ai_studio/assets/metal_elevator_door/
  - projects/ai_studio/assets/lunar_transparency.webp
  - projects/ai_studio/assets/smartphone.glb
  - projects/era_ora/rooms/aya.dev/assets/moon_HDR/
  - projects/era_ora/rooms/lia_room/assets/moon_HDR/
