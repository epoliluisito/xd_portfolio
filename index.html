<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XD — Enrico Poli</title>

  <style>
    :root{
      --nav: hsl(0, 0%, 65%);
      --nav-active: hsl(0, 0%, 100%);
      --bg: #000;
      --max: 1200px;

      /* tuned to sit a touch lower than previous version */
      --hdr-pad-top: 27.5px;
      --hdr-pad-x: 24px;

      /* nav tuning to match Squarespace a bit closer */
      --nav-size: 8.8px;
      --nav-track: 1.11px;
      --nav-gap: 13px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:#fff;
      overflow:hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
    }

    .site-header{
      position:fixed;
      top:0; left:0; right:0;
      z-index:9999;
      padding: var(--hdr-pad-top) calc(var(--hdr-pad-x) + env(safe-area-inset-right, 0px)) 12px calc(var(--hdr-pad-x) + env(safe-area-inset-left, 0px));
      background: transparent;
      pointer-events:none;
    }

    .hdr-container{
      max-width: var(--max);
      margin: 0 auto;
      pointer-events:none;
    }

    .site-header__row{
      display:flex;
      align-items:flex-start;
      justify-content:flex-end; /* menu only */
      pointer-events:none;
    }

    .nav{
      display:flex;
      align-items:center;
      gap: var(--nav-gap);
      pointer-events:auto;
    }

    .nav a{
      font-family: "Futura PT","futura-pt","Futura","Avenir Next","Avenir",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      font-weight: 400;
      font-size: var(--nav-size);
      letter-spacing: var(--nav-track);
      text-transform: uppercase;
      line-height: 1.6;
      color: var(--nav);
      text-decoration:none;
      white-space:nowrap;
      transition: color .18s ease;
    }
    .nav a:hover{ color: var(--nav-active); }
    .nav a.is-active{ color: var(--nav-active); }

    /* Mobile */
    .nav-toggle{
      display:none;
      pointer-events:auto;
      font-family: "Futura PT","futura-pt","Futura","Avenir Next","Avenir",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      font-size: var(--nav-size);
      letter-spacing: var(--nav-track);
      text-transform: uppercase;
      color: var(--nav-active);
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.25);
      padding: 8px 10px;
      border-radius: 999px;
      cursor:pointer;
    }

    .nav-panel{
      position:fixed;
      top:0; right:0;
      height:100vh;
      width:min(320px, 86vw);
      padding: 72px 22px 22px;
      background: rgba(0,0,0,.92);
      backdrop-filter: blur(10px);
      transform: translateX(110%);
      transition: transform .22s ease;
      z-index: 10000;
      border-left: 1px solid rgba(255,255,255,.08);
    }
    .nav-panel.is-open{ transform: translateX(0); }
    .nav-panel a{
      display:block;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
      font-family: "Futura PT","futura-pt","Futura","Avenir Next","Avenir",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      font-weight: 400;
      font-size: 12px;
      letter-spacing: var(--nav-track);
      text-transform: uppercase;
      color: var(--nav);
      text-decoration:none;
    }
    .nav-panel a.is-active{ color: var(--nav-active); }

    .nav-panel__close{
      position:fixed;
      top: 18px;
      right: 18px;
      z-index:10001;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.25);
      color: var(--nav-active);
      padding: 8px 10px;
      border-radius: 999px;
      cursor:pointer;
      font-family: "Futura PT","futura-pt","Futura","Avenir Next","Avenir",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      font-size: var(--nav-size);
      letter-spacing: var(--nav-track);
      text-transform: uppercase;
    }

    @media (max-width: 860px){
      .nav{ display:none; }
      .nav-toggle{ display:inline-flex; align-items:center; }
      :root{ --hdr-pad-x: 20px; --hdr-pad-top: 22px; }
    }
  

    /* XD hero */
    .hero{
      min-height: 100svh;
      display:flex;
      align-items: center;
      padding-top: 0;
      position: relative;
      z-index: 1;
    }
    .hero-container{
      width: min(var(--max), calc(100% - 2*var(--hdr-pad-x)));
      margin: 0 auto;
      padding: 0 var(--hdr-pad-x);
    }
    .hero-kicker{
      font-family: "Futura PT", Futura, "Futura Std", "Futura PT Book", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-size: var(--nav-size);
      letter-spacing: var(--nav-track);
      text-transform: uppercase;
      color: var(--nav);
      margin-bottom: 14px;
    }
    .hero-title{
      margin: 0;
      font-family: "Josefin Sans", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: clamp(34px, 5.2vw, 72px);
      letter-spacing: .04em;
      color: #fff;
      line-height: 1.0;
    }
    .hero-sub{
      margin: 12px 0 18px;
      font-family: "Raleway", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 200;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: none;
      color: rgba(255,255,255,.55);
      max-width: 54ch;
    }
    .cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      text-decoration:none;
      color: rgba(255,255,255,.92);
      font-family: "Futura PT", Futura, "Futura Std", "Futura PT Book", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: rgba(255,255,255,.04);
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
    }
    .cta:hover{ background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.30); transform: translateY(-1px); }
    .cta:active{ transform: translateY(0px); }

  </style>
</head>

<body>
  <header class="site-header" role="banner" aria-label="Site header">
    <div class="hdr-container">
      <div class="site-header__row">
        <nav class="nav" aria-label="Primary navigation">
          <a href="/" data-key="xd">XD</a>
          <a href="https://www.enricopoli.com/films" data-key="films">FILMS</a>
          <a href="https://www.enricopoli.com/_-dream-log" data-key="dreamlog">_ DREAM LOG</a>
          <a href="https://www.enricopoli.com/journal" data-key="journal">JOURNAL</a>
          <a href="https://www.enricopoli.com/about" data-key="about">ABOUT</a>
        </nav>

        <button class="nav-toggle" id="navToggle" type="button" aria-label="Open menu" aria-expanded="false">
          MENU
        </button>
      </div>
    </div>
  </header>
  <main class="hero" role="main" aria-label="XD landing">
    <div class="hero-container">
      <div class="hero-kicker">XD</div>
      <h1 class="hero-title">Experience Design</h1>
      <p class="hero-sub">Explore the interactive case study.</p>
      <a class="cta" href="/_pages/shadows_in_the_valley.html">Open: Ombre nella Valle</a>
    </div>
  </main>


  <aside class="nav-panel" id="navPanel" aria-hidden="true">
    <button class="nav-panel__close" id="navClose" type="button">CLOSE</button>
    <a href="/" data-key="xd">XD</a>
    <a href="https://www.enricopoli.com/films" data-key="films">FILMS</a>
    <a href="https://www.enricopoli.com/_-dream-log" data-key="dreamlog">_ DREAM LOG</a>
    <a href="https://www.enricopoli.com/journal" data-key="journal">JOURNAL</a>
    <a href="https://www.enricopoli.com/about" data-key="about">ABOUT</a>
  </aside>

  <script>
    (function(){
      // Active state: XD
      document.querySelectorAll('[data-key="xd"]').forEach(a => a.classList.add('is-active'));

      // Mobile panel
      const t = document.getElementById('navToggle');
      const p = document.getElementById('navPanel');
      const c = document.getElementById('navClose');

      function open(){
        p.classList.add('is-open');
        p.setAttribute('aria-hidden','false');
        t.setAttribute('aria-expanded','true');
      }
      function close(){
        p.classList.remove('is-open');
        p.setAttribute('aria-hidden','true');
        t.setAttribute('aria-expanded','false');
      }
      t && t.addEventListener('click', ()=> (p.classList.contains('is-open') ? close() : open()));
      c && c.addEventListener('click', close);
      document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') close(); });
    })();
  </script>
</body>
</html>
