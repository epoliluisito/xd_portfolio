<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R&D Alignment Diagnostic · Enrico Poli</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #111418;
    --border: rgba(255,255,255,0.08);
    --text: #e8eaed;
    --muted: rgba(232,234,237,0.45);
    --accent: #ff9500;
    --accent-dim: rgba(255,149,0,0.08);
    --danger: #ff453a;
    --success: #30d158;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 24px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  .container {
    width: 100%;
    max-width: 620px;
    position: relative;
  }

  /* ── HEADER ── */
  .header {
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .eyebrow::before {
    content: '';
    display: block;
    width: 24px;
    height: 1px;
    background: var(--accent);
  }

  h1 {
    font-size: clamp(22px, 4vw, 28px);
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.25;
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.65;
  }

  /* ── PROGRESS ── */
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.1s forwards;
  }

  .progress-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .progress-bar {
    height: 2px;
    background: var(--border);
    margin-bottom: 28px;
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.1s forwards;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.45s cubic-bezier(0.4,0,0.2,1);
  }

  /* ── QUESTION CARD ── */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 32px;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.5s ease 0.2s forwards;
    position: relative;
    overflow: hidden;
  }

  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0.4;
  }

  .q-number {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.15em;
    margin-bottom: 16px;
  }

  .q-text {
    font-size: 17px;
    font-weight: 500;
    line-height: 1.4;
    letter-spacing: -0.015em;
    margin-bottom: 6px;
  }

  .q-hint {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 24px;
  }

  .options { display: grid; gap: 8px; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    background: transparent;
    color: var(--text);
    text-align: left;
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.4;
    width: 100%;
  }

  .option:hover { border-color: rgba(255,149,0,0.35); background: var(--accent-dim); }
  .option.selected { border-color: var(--accent); background: var(--accent-dim); }

  .opt-key {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    padding-top: 2px;
    min-width: 18px;
    transition: color 0.15s;
  }

  .option.selected .opt-key { color: var(--accent); }

  .opt-label { font-weight: 500; margin-bottom: 2px; }
  .opt-sub { font-size: 12px; color: var(--muted); }

  /* ── NAV ── */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0;
    animation: fadeUp 0.5s ease 0.3s forwards;
  }

  .btn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 11px 22px;
    border-radius: 3px;
    border: 1px solid;
    cursor: pointer;
    transition: all 0.15s ease;
    background: transparent;
  }

  .btn-primary { border-color: var(--accent); color: var(--accent); }
  .btn-primary:hover:not(:disabled) { background: var(--accent); color: #000; }
  .btn-primary:disabled { opacity: 0.25; cursor: not-allowed; }

  .btn-ghost { border-color: var(--border); color: var(--muted); }
  .btn-ghost:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

  /* ── RESULT ── */
  .result { opacity: 0; animation: fadeUp 0.7s ease forwards; }

  .result-eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--danger);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .result-eyebrow::before {
    content: '';
    display: block;
    width: 24px;
    height: 1px;
    background: var(--danger);
  }

  .result h1 { margin-bottom: 32px; }

  /* Cost card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px 32px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }

  .card-accent::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--danger), transparent);
    opacity: 0.6;
  }

  .card-green::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--success), transparent);
    opacity: 0.5;
  }

  .card-orange::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0.5;
  }

  .card-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .cost-number {
    font-family: var(--mono);
    font-size: clamp(38px, 9vw, 54px);
    font-weight: 500;
    color: var(--danger);
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 8px;
  }

  .cost-note {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    font-style: italic;
  }

  /* Comparison rows */
  .comp-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .comp-row:first-child { padding-top: 0; }
  .comp-row:last-child { border-bottom: none; padding-bottom: 0; }

  .comp-desc { flex: 1; padding-right: 24px; }
  .comp-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
  .comp-sub { font-size: 11px; color: var(--muted); }
  .comp-val { font-family: var(--mono); font-size: 16px; font-weight: 500; white-space: nowrap; }
  .comp-val.red { color: var(--danger); }
  .comp-val.green { color: var(--success); }

  /* The key insight — this is the pivot */
  .insight-card {
    background: rgba(255,149,0,0.04);
    border: 1px solid rgba(255,149,0,0.18);
    border-radius: 4px;
    padding: 28px 32px;
    margin-bottom: 12px;
  }

  .insight-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--accent);
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  .insight-text {
    font-size: 15px;
    line-height: 1.75;
    color: rgba(232,234,237,0.85);
  }

  .insight-text strong { color: var(--accent); font-weight: 600; }

  /* The demonstration moment */
  .demo-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px 32px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }

  .demo-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0.3), transparent);
    opacity: 0.4;
  }

  .demo-intro {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .demo-statement {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.6;
    letter-spacing: -0.01em;
    margin-bottom: 16px;
    color: var(--text);
  }

  .demo-sub {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.65;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    margin-top: 4px;
  }

  .demo-sub strong { color: var(--text); font-weight: 500; }

  /* Who is Enrico */
  .who-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px 32px;
    margin-bottom: 12px;
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  .who-initial {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 500;
    color: var(--accent);
    line-height: 1;
    min-width: 36px;
    padding-top: 2px;
  }

  .who-text { flex: 1; }

  .who-name {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }

  .who-role {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .who-bio {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.65;
  }

  .who-bio strong { color: var(--text); font-weight: 500; }

  /* CTA */
  .cta-card {
    background: var(--surface);
    border: 1px solid rgba(255,149,0,0.25);
    border-radius: 4px;
    padding: 28px 32px;
    margin-bottom: 24px;
  }

  .cta-text {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .cta-sub {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 20px;
  }

  .btn-cta {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 13px 28px;
    border-radius: 3px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #000;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s ease;
    text-decoration: none;
  }

  .btn-cta:hover { background: transparent; color: var(--accent); }

  .restart {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    cursor: pointer;
    background: none;
    border: none;
    display: block;
    text-align: center;
    width: 100%;
    padding: 12px;
    transition: color 0.15s;
  }

  .restart:hover { color: var(--text); }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hidden { display: none; }

  @media (max-width: 480px) {
    body { padding: 32px 16px; }
    .card, .insight-card, .demo-card, .who-card, .cta-card { padding: 22px 20px; }
    .who-card { flex-direction: column; gap: 12px; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- QUIZ -->
  <div id="quizScreen">
    <div class="header">
      <div class="eyebrow">R&D Alignment Diagnostic</div>
      <h1>How much is misalignment costing your R&D?</h1>
      <p class="subtitle">5 questions. 3 minutes. A number that puts the problem in perspective.</p>
    </div>

    <div class="progress-meta">
      <span class="progress-label" id="progressLabel">Question 1 of 5</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:20%"></div>
    </div>

    <div class="question-card" id="questionCard">
      <div class="q-number" id="qNum">01 / 05</div>
      <div class="q-text" id="qText"></div>
      <div class="q-hint" id="qHint"></div>
      <div class="options" id="qOptions"></div>
    </div>

    <div class="nav">
      <button class="btn btn-ghost" id="btnBack" onclick="goBack()">← Back</button>
      <button class="btn btn-primary" id="btnNext" onclick="goNext()" disabled>Continue →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="resultScreen" class="hidden result"></div>

</div>
<script>
const questions = [
  {
    text: "How many stakeholders needed to align on requirements for this R&D project?",
    hint: "Count internal teams, external clients, and decision-makers whose sign-off was needed at any point.",
    options: [
      { label: "2–3 stakeholders", sub: "Small, focused group", sm: 1.0 },
      { label: "4–6 stakeholders", sub: "Multiple internal and external parties", sm: 1.7 },
      { label: "7 or more", sub: "Complex multi-client or cross-divisional project", sm: 2.6 }
    ]
  },
  {
    text: "How many times did the core requirements change after development began?",
    hint: "Each change that forced your team to revise direction, rebuild prototypes, or restart testing.",
    options: [
      { label: "1–2 times", sub: "Mostly stable brief", rm: 1.0 },
      { label: "3–5 times", sub: "Significant course corrections", rm: 1.9 },
      { label: "6 or more", sub: "Requirements were never truly fixed", rm: 3.2 }
    ]
  },
  {
    text: "For how many months was your team working with undefined or shifting requirements?",
    hint: "The period before alignment was reached and real development could begin.",
    options: [
      { label: "1–3 months", sub: "Short pre-development phase", months: 2 },
      { label: "4–8 months", sub: "Extended uncertainty period", months: 6 },
      { label: "9 months or more", sub: "Multi-year requirements phase", months: 13 }
    ]
  },
  {
    text: "How many engineers or specialists were active during this phase?",
    hint: "People consuming time and budget while requirements were still being defined.",
    options: [
      { label: "1–5 people", sub: "Small team", eng: 3 },
      { label: "6–15 people", sub: "Mid-size R&D team", eng: 10 },
      { label: "16 or more", sub: "Large dedicated team", eng: 22 }
    ]
  },
  {
    text: "Estimated fully-loaded monthly cost per person (salary + overhead)?",
    hint: "Include benefits, tools, space, and management overhead. €8–12K is standard for European industrial R&D.",
    options: [
      { label: "Under €8,000 / month", sub: "Per person", cost: 6000 },
      { label: "€8,000–€12,000 / month", sub: "Per person — typical industrial R&D", cost: 10000 },
      { label: "Over €12,000 / month", sub: "Per person — senior specialists", cost: 15000 }
    ]
  }
];

let answers = [], current = 0;

function render() {
  const q = questions[current];
  document.getElementById('qNum').textContent = `0${current+1} / 05`;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('qHint').textContent = q.hint;
  document.getElementById('progressLabel').textContent = `Question ${current+1} of 5`;
  document.getElementById('progressFill').style.width = `${((current+1)/5)*100}%`;

  const wrap = document.getElementById('qOptions');
  wrap.innerHTML = '';
  q.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'option' + (answers[current]===i ? ' selected' : '');
    b.innerHTML = `<span class="opt-key">${String.fromCharCode(65+i)}</span>
      <span><div class="opt-label">${opt.label}</div><div class="opt-sub">${opt.sub}</div></span>`;
    b.onclick = () => pick(i);
    wrap.appendChild(b);
  });

  document.getElementById('btnNext').disabled = answers[current] === undefined;
  document.getElementById('btnBack').style.visibility = current===0 ? 'hidden' : 'visible';

  const card = document.getElementById('questionCard');
  card.style.animation = 'none';
  void card.offsetHeight;
  card.style.animation = 'fadeUp 0.4s ease forwards';
  card.style.opacity = '0';
}

function pick(i) {
  answers[current] = i;
  document.querySelectorAll('.option').forEach((el,idx) => el.classList.toggle('selected', idx===i));
  document.getElementById('btnNext').disabled = false;
}

function goNext() {
  if (answers[current]===undefined) return;
  if (current < 4) { current++; render(); }
  else showResult();
}

function goBack() { if (current>0) { current--; render(); } }

function fmt(n) {
  if (n>=1000000) return '€'+(n/1000000).toFixed(1)+'M';
  if (n>=1000)    return '€'+Math.round(n/1000)+'K';
  return '€'+n;
}

function showResult() {
  const sm    = questions[0].options[answers[0]].sm;
  const rm    = questions[1].options[answers[1]].rm;
  const months= questions[2].options[answers[2]].months;
  const eng   = questions[3].options[answers[3]].eng;
  const cost  = questions[4].options[answers[4]].cost;

  // Total burn during misaligned phase
  const totalBurn = eng * months * cost;

  // Misalignment overhead — conservative 35% of burn, scaled by complexity
  const wastedCost = Math.round(totalBurn * 0.35 * sm * rm * 0.4);

  // Concept validation = ~8–10% of wasted cost (front-loaded, fast)
  const validationCost = Math.round(wastedCost * 0.09);
  const saving = wastedCost - validationCost;
  const roi = Math.round(saving / validationCost);

  // Severity text
  let severity, headline;
  if (wastedCost < 80000) {
    severity = "Moderate misalignment risk";
    headline = "The numbers are manageable — but they compound.";
  } else if (wastedCost < 400000) {
    severity = "Significant misalignment risk";
    headline = "This is a structural problem, not a one-off.";
  } else {
    severity = "Critical misalignment risk";
    headline = "This is the pattern that kills R&D projects.";
  }

  document.getElementById('quizScreen').classList.add('hidden');
  const rs = document.getElementById('resultScreen');
  rs.classList.remove('hidden');

  rs.innerHTML = `
    <div style="margin-bottom:40px;">
      <div class="result-eyebrow">${severity}</div>
      <h1>${headline}</h1>
    </div>

    <div class="card card-accent">
      <div class="card-label">Estimated R&D budget consumed by misalignment</div>
      <div class="cost-number">${fmt(wastedCost)}</div>
      <div class="cost-note">Order-of-magnitude estimate based on your inputs. The real number may be higher or lower — but the structure of the problem is consistent regardless of scale.</div>
    </div>

    <div class="card card-green">
      <div class="comp-row">
        <div class="comp-desc">
          <div class="comp-title">Cost of misaligned R&D phase</div>
          <div class="comp-sub">Engineers working before requirements were stable</div>
        </div>
        <div class="comp-val red">${fmt(wastedCost)}</div>
      </div>
      <div class="comp-row">
        <div class="comp-desc">
          <div class="comp-title">Cost of upfront concept validation</div>
          <div class="comp-sub">Forcing stakeholder alignment before engineering begins</div>
        </div>
        <div class="comp-val green">${fmt(validationCost)}</div>
      </div>
      <div class="comp-row">
        <div class="comp-desc">
          <div class="comp-title">Estimated saving</div>
          <div class="comp-sub">${roi}× return on the concept validation investment</div>
        </div>
        <div class="comp-val green">${fmt(saving)}</div>
      </div>
    </div>

    <div class="insight-card">
      <div class="insight-label">What this actually means</div>
      <div class="insight-text">
        The problem is rarely technical. Engineers know how to build things. 
        What they can't do alone is force a room full of clients with incompatible requirements 
        to make a decision before the project starts.<br><br>
        <strong>That's a sensemaking problem.</strong> Someone needs to translate the complexity 
        into a form stakeholders can actually respond to — before the engineering clock starts running.
      </div>
    </div>

    <div class="demo-card">
      <div class="demo-intro">What just happened in this diagnostic</div>
      <div class="demo-statement">
        You answered 5 questions. A diffuse, expensive problem became a structure you can act on.
      </div>
      <div class="demo-sub">
        That is the work. Not this tool specifically — but <strong>the thinking behind it</strong>: 
        taking a complex situation with too many variables and too many stakeholders, 
        and reducing it to a form where a decision becomes possible.<br><br>
        This is what I do for R&D teams before engineering begins. 
        Not as a consultant who writes reports. As a <strong>thinking partner 
        who builds the conditions for alignment</strong> — through concept prototypes, 
        scenario frameworks, and structured facilitation that forces the hard decisions early, 
        when they're still cheap.
      </div>
    </div>

    <div class="who-card">
      <div class="who-initial">EP</div>
      <div class="who-text">
        <div class="who-name">Enrico Poli</div>
