<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON BLOODSHED</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { height:100%; background:#05010a; overflow:hidden;
    font-family:'Courier New', monospace; color:#e8f7ff;
    overscroll-behavior:none; touch-action:none; }
  #wrap { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #game { background:#05010a; box-shadow:0 0 60px #ff00aa55, 0 0 120px #00eaff33;
    max-width:100%; max-height:100%; }
  #hint { position:fixed; bottom:6px; left:50%; transform:translateX(-50%);
    font-size:12px; color:#5af0ff99; letter-spacing:1px; pointer-events:none; white-space:nowrap; }

  /* ---- Rotate-to-landscape prompt (shown only in portrait on touch devices) ---- */
  #rotate { position:fixed; inset:0; z-index:50; display:none;
    background:#05010a; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; }
  #rotate.show { display:flex; }
  #rotate .phone { width:70px; height:120px; border:4px solid #00eaff; border-radius:14px;
    box-shadow:0 0 24px #00eaff88; animation:tilt 1.8s ease-in-out infinite; margin-bottom:30px; }
  @keyframes tilt { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-90deg)} }
  #rotate h1 { font-size:24px; color:#ff2bd6; text-shadow:0 0 14px #ff00aa; letter-spacing:2px; }
  #rotate p { margin-top:12px; color:#9bdcff; font-size:15px; }

  /* ---- Touch controls ---- */
  #touch { position:fixed; inset:0; z-index:30; display:none; pointer-events:none; }
  #touch.show { display:block; }
  .tbtn { position:fixed; pointer-events:auto; display:flex; align-items:center; justify-content:center;
    font-family:'Courier New',monospace; font-weight:bold; color:#eaffff;
    border-radius:50%; background:rgba(20,4,40,0.45); border:2px solid rgba(0,234,255,0.55);
    backdrop-filter:blur(2px); box-shadow:0 0 12px rgba(0,234,255,0.25); transition:transform .05s; }
  .tbtn.pressed { transform:scale(0.9); background:rgba(255,43,214,0.4); border-color:#ffe14a; }
  .tbtn small { font-size:10px; opacity:.7; position:absolute; bottom:6px; }
  /* D-pad bottom-left */
  #dpad { position:fixed; left:18px; bottom:18px; width:168px; height:168px; pointer-events:none; }
  #dpad .tbtn { position:absolute; width:54px; height:54px; font-size:24px; }
  #d-up   { left:57px; top:0; }
  #d-down { left:57px; bottom:0; }
  #d-left { left:0; top:57px; }
  #d-right{ right:0; top:57px; }
  /* Action buttons bottom-right */
  #b-A { right:104px; bottom:30px; width:60px; height:60px; font-size:18px; border-color:#ff2e7e; }
  #b-B { right:36px;  bottom:78px; width:60px; height:60px; font-size:18px; border-color:#ff7a1a; }
  #b-C { right:168px; bottom:60px; width:58px; height:58px; font-size:14px; border-color:#39ff14; }
  #b-D { right:104px; bottom:100px; width:60px; height:60px; font-size:18px; border-color:#00eaff; }
  #b-S { right:30px;  bottom:158px; width:54px; height:54px; font-size:13px; border-color:#ffe14a; color:#ffe14a; }
  @media (max-height:430px){
    #dpad{ width:148px; height:148px; }
    #dpad .tbtn{ width:48px; height:48px; }
    #d-up,#d-down{ left:50px; } #d-left,#d-right{ top:50px; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="hint">MOVE: WASD / Arrows &nbsp;•&nbsp; A: J (light) &nbsp;•&nbsp; B: K (heavy) &nbsp;•&nbsp; C: Space (jump) &nbsp;•&nbsp; D: L (special) &nbsp;•&nbsp; SUPER: U &nbsp;•&nbsp; ROLL: double-tap dir</div>

<!-- Rotate prompt -->
<div id="rotate">
  <div class="phone"></div>
  <h1>RUOTA IL DISPOSITIVO</h1>
  <p>NEON BLOODSHED si gioca in orizzontale.<br>Gira lo schermo in modalità landscape.</p>
</div>

<!-- Touch controls -->
<div id="touch">
  <div id="dpad">
    <div class="tbtn" id="d-up"    data-k="up">▲</div>
    <div class="tbtn" id="d-down"  data-k="down">▼</div>
    <div class="tbtn" id="d-left"  data-k="left">◀</div>
    <div class="tbtn" id="d-right" data-k="right">▶</div>
  </div>
  <div class="tbtn" id="b-C" data-k="jump">JUMP</div>
  <div class="tbtn" id="b-D" data-k="special">D</div>
  <div class="tbtn" id="b-A" data-k="light">A</div>
  <div class="tbtn" id="b-B" data-k="heavy">B</div>
  <div class="tbtn" id="b-S" data-k="super">SUP</div>
</div>
<script>
"use strict";
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

/* ---------- Belt-scroller world: floor band where actors can stand (depth) ---------- */
const FLOOR_TOP = 360, FLOOR_BOT = 510; // y range of the belt (feet)

/* ---------- Input ---------- */
const keys = {};
const pressed = {}; // edge-trigger
const lastTap = {}; // for double-tap roll

// Shared press/release logic for keyboard AND touch
function inputDown(k){
  if(!keys[k]){ pressed[k]=true;
    if(k==='left'||k==='right'){
      const t=performance.now();
      if(lastTap[k] && t-lastTap[k]<260) pressed['roll_'+k]=true;
      lastTap[k]=t;
    }
  }
  keys[k]=true;
}
function inputUp(k){ keys[k]=false; }

addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  inputDown(norm(e.key));
});
addEventListener('keyup', e=>{ inputUp(norm(e.key)); });

/* ---------- Touch controls + orientation ---------- */
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
function wireTouch(){
  document.querySelectorAll('.tbtn').forEach(btn=>{
    const k = btn.getAttribute('data-k');
    const down = e=>{ e.preventDefault(); btn.classList.add('pressed'); inputDown(k);
      if(k==='light') pressed['enter']=true; }; // A also confirms menus
    const up = e=>{ e.preventDefault(); btn.classList.remove('pressed'); inputUp(k); };
    btn.addEventListener('touchstart', down, {passive:false});
    btn.addEventListener('touchend', up, {passive:false});
    btn.addEventListener('touchcancel', up, {passive:false});
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', e=>{ btn.classList.remove('pressed'); inputUp(k); });
  });
  // Tap anywhere on canvas advances menu screens (title / select / game over)
  const tapMenu = e=>{
    if(state==='TITLE'||state==='CHARSELECT'||state==='GAMEOVER'){ e.preventDefault(); pressed['enter']=true; }
  };
  cv.addEventListener('touchstart', tapMenu, {passive:false});
}
function checkOrientation(){
  const portrait = window.innerHeight > window.innerWidth;
  const rot = document.getElementById('rotate');
  const tc = document.getElementById('touch');
  if(isTouch && portrait){ rot.classList.add('show'); tc.classList.remove('show'); }
  else { rot.classList.remove('show'); tc.classList.toggle('show', isTouch); }
}
addEventListener('resize', checkOrientation);
addEventListener('orientationchange', ()=>setTimeout(checkOrientation,200));
wireTouch();
checkOrientation();
if(isTouch){ const hn=document.getElementById('hint'); if(hn) hn.style.display='none'; }
function norm(key){
  switch(key){
    case 'ArrowLeft': case 'a': case 'A': return 'left';
    case 'ArrowRight': case 'd': case 'D': return 'right';
    case 'ArrowUp': case 'w': case 'W': return 'up';
    case 'ArrowDown': case 's': case 'S': return 'down';
    case ' ': return 'jump';
    case 'j': case 'J': return 'light';
    case 'k': case 'K': return 'heavy';
    case 'l': case 'L': return 'special';
    case 'u': case 'U': return 'super';
    case 'Enter': return 'enter';
    case 'Escape': return 'esc';
    default: return key;
  }
}
function consume(k){ if(pressed[k]){ pressed[k]=false; return true; } return false; }
function clearPressed(){ for(const k in pressed) pressed[k]=false; }

/* ---------- Utilities ---------- */
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------- Characters ---------- */
const CHARS = [
  { id:'ghost', name:'JONNY "GHOST"', sub:'EX-KILLER', color:'#ff2e7e', accent:'#fff', weapon:'#ff5cc8',
    str:1.35, speed:1.0, vita:'MEDIA', baseHp:100, reach:78, desc:'Monokatana Termica. Preciso, danni critici.' },
  { id:'mia', name:'MIA-9', sub:'CYBORG', color:'#00eaff', accent:'#d8ffff', weapon:'#9bffff',
    str:0.95, speed:1.45, vita:'MEDIA', baseHp:92, reach:64, desc:'Lame retrattili. Combo aeree infinite, rapidissima.' },
  { id:'krok', name:'KROK', sub:'CYBER-COCCODRILLO', color:'#9dff3c', accent:'#eaffce', weapon:'#caff7a',
    str:1.55, speed:0.72, vita:'ALTA', baseHp:150, reach:70, desc:'Mascella idraulica. Grappler, lento ma inarrestabile.' },
];

/* ---------- Upgrade pool (Glitch Upgrades) ---------- */
const UPGRADES = [
  {id:'force', cat:'STAT', name:'+ FORZA', desc:'+25% danno a tutti gli attacchi.'},
  {id:'speed', cat:'STAT', name:'+ VELOCITÀ', desc:'+20% velocità movimento e attacco.'},
  {id:'armor', cat:'STAT', name:'CORAZZA NANO', desc:'-30% danni subiti.'},
  {id:'heal',  cat:'STAT', name:'+1 VITA MAX', desc:'Ripristina 1 segmento di Vita Massima.'},
  {id:'roll',  cat:'MOVE', name:'CYBER ROLL', desc:'Doppio-tap direzione = capriola con i-frames.'},
  {id:'parry', cat:'MOVE', name:'PARRY TEMP.', desc:'Parata perfetta stordisce e ricarica 1 Super.'},
  {id:'invinc',cat:'STATO',name:'INVINCIBILITÀ 30s', desc:'Aura dorata: immune a tutto per 30 secondi.'},
  {id:'timestop',cat:'STATO',name:'BLOCCO TEMPO', desc:'La Super congela i nemici per 5 secondi.'},
  {id:'giant', cat:'STATO',name:'OVERCLOCK GIGANTE 30s', desc:'Diventi enorme: raggio immenso, one-shot.'},
  {id:'shadow',cat:'CLONI',name:'OMBRA DA COMBATTIMENTO', desc:"Un'ombra replica i tuoi colpi: combo raddoppiate."},
  {id:'minion',cat:'CLONI',name:'CYBER-MINION', desc:'Drone laser che stordisce i nemici deboli.'},
];

/* ---------- Levels ---------- */
const LEVELS = [
  { name:'NEON SLUMS', sub:'I BASSIFONDI', sky:['#1a0030','#3a0a4a'], neon:'#39ff14', fog:'#2b0040',
    rain:true, waves:[3,4], bossId:'marek' },
  { name:'THE CYBER-STRIP', sub:'DISTRETTO DEL PIACERE', sky:['#2a0036','#5a0a66'], neon:'#ff2bd6', fog:'#3a0050',
    strobe:true, waves:[4,5], bossId:'sinfonia' },
  { name:'NEXUS CORE', sub:'CUORE DELLA MEGA-CORP', sky:['#2a0008','#5a0010'], neon:'#ff2a2a', fog:'#330006',
    blood:true, waves:[5,6], bossId:'kurosawa' },
];

/* ===================================================================== */
/*  GAME STATE                                                            */
/* ===================================================================== */
let state = 'TITLE';
let selChar = 0, selIndex = 0;
let G = null;           // run object
let particles = [];
let floaters = [];      // damage/score text
let shake = 0;
let hitstop = 0;
let camX = 0;           // belt scroll
let bgScroll = 0;
let flash = 0, flashCol='#fff';
let glitch = 0;
let time = 0;
let upgradeChoices = [];
let bannerT = 0, bannerTxt='', bannerSub='';

/* ---------- Run / Player ---------- */
function newRun(charIdx){
  const c = CHARS[charIdx];
  G = {
    char:c, charIdx,
    maxSeg:10,            // CyberDegeneration: starts at 10
    hp:c.baseHp, hpMax:c.baseHp,
    super:0, superMax:3,
    px: 160, py: 460, pz:0, // pz vertical jump offset
    vx:0, vy:0, vz:0,
    facing:1, onGround:true,
    atkTimer:0, atkType:null, atkHit:false, atkFrames:0, atkDur:0,
    combo:0, comboTimer:0,
    hurtTimer:0, invuln:0, dead:false,
    rollTimer:0, rolling:false,
    upgrades:{}, // id->level
    level:0, wave:0, waveEnemies:0, levelClear:false,
    score:0, kills:0,
    // timed states
    invincT:0, giantT:0,
    // helpers
    shadowQueue:[], minionT:0, minionX:0, minionY:0,
  };
  // apply upgrade counts default 0
  startLevel(0);
}

function startLevel(li){
  G.level = li; G.wave=0; G.levelClear=false;
  G.px=160; G.py=460; camX=0; bgScroll=0;
  spawnWave();
  bannerT=180; bannerTxt='LIVELLO '+(li+1); bannerSub=LEVELS[li].name;
}

/* ---------- Enemies ---------- */
let enemies = [];
function spawnWave(){
  const lv = LEVELS[G.level];
  const wavesInLevel = lv.waves.length;
  if(G.wave >= wavesInLevel){ spawnBoss(); return; }
  const count = lv.waves[G.wave];
  for(let i=0;i<count;i++){
    const side = Math.random()<0.5?-1:1;
    const ex = side<0 ? camX-60-i*70 : camX+W+60+i*70;
    enemies.push(makeGrunt(ex, rand(FLOOR_TOP+10,FLOOR_BOT-10)));
  }
  G.waveEnemies = count;
}
function makeGrunt(x,y){
  const tier = ri(0, Math.min(2, G.level+1));
  const hp = 26 + G.level*10 + tier*8;
  return { type:'grunt', x, y, z:0, vz:0, vx:0, vy:0, w:34, h:74,
    hp, hpMax:hp, facing:-1, atk:0, atkHit:false, hurt:0, stun:0, dead:false,
    deathT:0, color: tier===0?'#7a4dff': tier===1?'#ff6a3d':'#ff2a6a',
    tier, think:rand(0,40), knock:0, frozen:0, gib:false };
}

/* ---------- Bosses ---------- */
function spawnBoss(){
  const lv = LEVELS[G.level];
  enemies = []; // clear remaining
  bannerT=160; bannerTxt='WARNING'; bannerSub='BOSS APPROACHING';
  const b = makeBoss(lv.bossId);
  enemies.push(b);
  G.bossActive = true;
}
function makeBoss(id){
  if(id==='marek') return { type:'boss', id, name:'MAREK IL DEMOLITORE',
    x:camX+W-140, y:430, z:0, vz:0, vx:0, vy:0, w:90, h:140,
    hp:600, hpMax:600, facing:-1, phase:1, state:'idle', t:90, atk:0, atkHit:false,
    stun:0, hurt:0, dead:false, deathT:0, color:'#ff7a1a', shock:[], charging:false };
  if(id==='sinfonia') return { type:'boss', id, name:'SINFONIA MISTICA',
    x:camX+W-160, y:300, z:0, w:64, h:120, vx:0, vy:0, vz:0,
    hp:560, hpMax:560, facing:-1, phase:1, state:'float', t:120, atk:0, atkHit:false,
    stun:0, hurt:0, dead:false, deathT:0, color:'#ff5cd8', fans:[], clones:[], realClone:0, float:0 };
  if(id==='kurosawa') return { type:'boss', id, name:'A.D. KUROSAWA',
    x:camX+W-180, y:380, z:0, w:130, h:150, vx:0, vy:0, vz:0,
    hp:820, hpMax:820, facing:-1, phase:1, state:'idle', t:140, atk:0, atkHit:false,
    stun:0, hurt:0, dead:false, deathT:0, color:'#ffd23c', laser:null, legs:0, exposed:0, legSeq:[] };
}

/* ===================================================================== */
/*  PARTICLES & FX                                                        */
/* ===================================================================== */
function blood(x,y,n,col){
  col = col||'#ff1a4a';
  for(let i=0;i<n;i++){
    particles.push({x,y,vx:rand(-5,5),vy:rand(-7,2),g:0.4,life:rand(20,46),
      col, sz:rand(2,6), t:'blood'});
  }
}
function gibs(x,y,col){
  for(let i=0;i<22;i++){
    particles.push({x,y,vx:rand(-8,8),vy:rand(-11,1),g:0.5,life:rand(30,70),
      col: i%3? '#ff1a4a':col, sz:rand(3,9), t:'gib'});
  }
  for(let i=0;i<10;i++) particles.push({x,y,vx:rand(-3,3),vy:rand(-5,0),g:0.1,life:rand(20,40),col:'#fff',sz:rand(2,4),t:'spark'});
}
function sparks(x,y,col){
  for(let i=0;i<8;i++) particles.push({x,y,vx:rand(-4,4),vy:rand(-4,2),g:0.2,life:rand(10,22),col:col||'#fff14a',sz:rand(1,3),t:'spark'});
}
function floatText(x,y,txt,col){ floaters.push({x,y,txt,col:col||'#fff',life:50,vy:-1.1}); }

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--;
    if(p.t!=='spark' && p.y>FLOOR_BOT){ p.y=FLOOR_BOT; p.vy*=-0.3; p.vx*=0.6; }
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i]; f.y+=f.vy; f.life--; if(f.life<=0) floaters.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = p.t==='spark'? clamp(p.life/22,0,1):1;
    ctx.fillStyle=p.col;
    const sx=p.x-camX;
    if(p.t==='gib'){ ctx.fillRect(sx-p.sz/2, p.y-p.sz/2, p.sz, p.sz); }
    else { ctx.fillRect(sx, p.y, p.sz, p.sz); }
  }
  ctx.globalAlpha=1;
  for(const f of floaters){
    ctx.globalAlpha=clamp(f.life/50,0,1);
    ctx.font='bold 18px Courier New'; ctx.textAlign='center';
    ctx.fillStyle='#000'; ctx.fillText(f.txt, f.x-camX+1, f.y+1);
    ctx.fillStyle=f.col; ctx.fillText(f.txt, f.x-camX, f.y);
  }
  ctx.globalAlpha=1; ctx.textAlign='left';
}

/* ===================================================================== */
/*  BACKGROUNDS (cell-shaded neon, procedural)                            */
/* ===================================================================== */
function drawBackground(){
  const lv = LEVELS[G.level];
  // sky gradient
  const g=ctx.createLinearGradient(0,0,0,FLOOR_TOP+40);
  g.addColorStop(0,lv.sky[0]); g.addColorStop(1,lv.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,FLOOR_TOP+60);

  const par = (f)=>-(camX*f % W);
  // far skyline
  drawSkyline(par(0.15), lv);
  drawSkyline(par(0.15)+W, lv);
  // mid neon buildings
  drawBuildings(par(0.4), lv);
  drawBuildings(par(0.4)+W, lv);

  // strobe / blood ambiance
  if(lv.strobe && Math.floor(time/6)%2===0){ ctx.fillStyle='rgba(255,80,220,0.05)'; ctx.fillRect(0,0,W,FLOOR_TOP); }
  if(lv.blood){ ctx.fillStyle='rgba(120,0,0,0.10)'; ctx.fillRect(0,0,W,FLOOR_TOP); }

  // floor belt
  const fg=ctx.createLinearGradient(0,FLOOR_TOP,0,H);
  fg.addColorStop(0, shade(lv.sky[1],-20)); fg.addColorStop(1,'#070010');
  ctx.fillStyle=fg; ctx.fillRect(0,FLOOR_TOP,W,H-FLOOR_TOP);
  // neon floor grid
  ctx.strokeStyle=lv.neon+'55'; ctx.lineWidth=1;
  for(let i=0;i<14;i++){
    const yy=FLOOR_TOP+ i*(H-FLOOR_TOP)/13;
    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke();
  }
  const gx = -(camX*1.0)%80;
  for(let x=gx-80;x<W+80;x+=80){
    ctx.beginPath();
    ctx.moveTo(x, FLOOR_TOP);
    ctx.lineTo((x-W/2)*2.2+W/2, H);
    ctx.stroke();
  }
  ctx.strokeStyle=lv.neon; ctx.lineWidth=2; ctx.globalAlpha=0.7;
  ctx.beginPath(); ctx.moveTo(0,FLOOR_TOP); ctx.lineTo(W,FLOOR_TOP); ctx.stroke();
  ctx.globalAlpha=1;

  // rain
  if(lv.rain){
    ctx.strokeStyle='rgba(120,255,200,0.25)'; ctx.lineWidth=1;
    for(let i=0;i<60;i++){
      const rx=(i*97 + time*9)%W, ry=(i*53 + time*16)%FLOOR_TOP;
      ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-3,ry+12); ctx.stroke();
    }
  }
}
function drawSkyline(ox,lv){
  ctx.fillStyle=shade(lv.sky[0],-10);
  for(let i=0;i<10;i++){
    const x=ox+i*100+ (i*37%40);
    const h=80+ (i*53%120);
    ctx.fillRect(x, FLOOR_TOP-h, 70, h);
  }
}
function drawBuildings(ox,lv){
  for(let i=0;i<7;i++){
    const x=ox+i*150+20;
    const h=120+ (i*71%160);
    const y=FLOOR_TOP-h;
    ctx.fillStyle=shade(lv.sky[1],-26);
    ctx.fillRect(x,y,110,h);
    ctx.strokeStyle=lv.neon+'88'; ctx.lineWidth=2;
    ctx.strokeRect(x+0.5,y+0.5,110,h);
    // windows neon
    for(let wy=y+10; wy<FLOOR_TOP-8; wy+=20){
      for(let wx=x+8; wx<x+100; wx+=20){
        if((Math.floor(wx+wy+i*13))%5===0){
          ctx.fillStyle = (wx+wy)%3? lv.neon : '#00eaff';
          ctx.globalAlpha=0.5+0.3*Math.sin(time*0.05+wx);
          ctx.fillRect(wx,wy,8,10);
          ctx.globalAlpha=1;
        }
      }
    }
    // holographic billboard (flicker)
    if(i%3===0 && (Math.floor(time/4)%7)){
      ctx.fillStyle=(i%2?'#ff2bd6':'#00eaff')+'33';
      ctx.fillRect(x+12,y+18,86,40);
      ctx.fillStyle=(i%2?'#ff2bd6':'#00eaff');
      ctx.font='bold 16px Courier New';
      ctx.fillText('零', x+30, y+48);
      ctx.font='9px Courier New';
      ctx.fillText('CYBER', x+18, y+66);
    }
  }
}
function shade(hex,amt){
  let c=hex.replace('#',''); if(c.length===3)c=c.split('').map(x=>x+x).join('');
  let r=clamp(parseInt(c.substr(0,2),16)+amt,0,255);
  let g=clamp(parseInt(c.substr(2,2),16)+amt,0,255);
  let b=clamp(parseInt(c.substr(4,2),16)+amt,0,255);
  return `rgb(${r},${g},${b})`;
}

/* ===================================================================== */
/*  PLAYER LOGIC                                                          */
/* ===================================================================== */
function up(id){ return G.upgrades[id]||0; }
function strMul(){ return G.char.str * (1+0.25*up('force')) * (G.giantT>0?3:1); }
function spdMul(){ return G.char.speed * (1+0.20*up('speed')); }
function dmgTakenMul(){ return Math.pow(0.7, up('armor')); }

function updatePlayer(){
  if(G.dead) return;
  const sp = 3.0*spdMul();
  // timers
  if(G.hurtTimer>0)G.hurtTimer--;
  if(G.invuln>0)G.invuln--;
  if(G.comboTimer>0)G.comboTimer--; else G.combo=0;
  if(G.invincT>0)G.invincT--;
  if(G.giantT>0)G.giantT--;
  if(G.minionT>0)G.minionT--;

  // ROLL (Cyber Roll upgrade)
  if(up('roll')>0 && !G.rolling && G.onGround){
    if(consume('roll_left')){ G.rolling=true; G.rollTimer=22; G.facing=-1; G.invuln=22; }
    else if(consume('roll_right')){ G.rolling=true; G.rollTimer=22; G.facing=1; G.invuln=22; }
  }
  if(G.rolling){
    G.rollTimer--;
    G.px += G.facing*7;
    if(G.rollTimer<=0)G.rolling=false;
  }

  // movement (only if not mid-attack/roll)
  let mvx=0,mvy=0;
  if(!G.rolling && G.atkTimer<=0){
    if(keys.left){mvx=-1;G.facing=-1;}
    if(keys.right){mvx=1;G.facing=1;}
    if(keys.up)mvy=-1;
    if(keys.down)mvy=1;
  }
  G.px += mvx*sp;
  if(G.onGround) G.py += mvy*sp*0.7;
  G.py=clamp(G.py,FLOOR_TOP,FLOOR_BOT);
  G.px=clamp(G.px, camX+20, camX+W-20);
  if(!G.bossActive) G.px=Math.max(G.px, camX+20);

  // jump
  if(G.onGround && (consume('jump'))){ G.vz=-9.5; G.onGround=false; }
  if(!G.onGround){
    G.pz+=G.vz; G.vz+=0.55;
    if(G.pz>=0){ G.pz=0; G.onGround=true; G.vz=0; }
  }

  // attacks
  if(G.atkTimer>0){
    G.atkTimer--;
    handleAttackHit();
  } else {
    if(consume('light')) startAttack('light');
    else if(consume('heavy')) startAttack('heavy');
    else if(consume('special')) startAttack('special');
  }
  // SUPER
  if(consume('super') && G.super>=1) doSuper();

  // camera follow / scroll lock
  const targetCam = clamp(G.px - W*0.42, camX, 1e9);
  if(!G.bossActive){
    camX = Math.max(camX, clamp(G.px - W*0.42, 0, 1e9));
  }
  bgScroll=camX;

  // wave progression
  if(enemies.length===0 && !G.bossActive){
    G.wave++;
    if(G.wave < LEVELS[G.level].waves.length + 1){ // +1 triggers boss inside spawnWave
      spawnWave();
    }
  }

  // minion
  if(up('minion')>0) updateMinion();
  // shadow clone
  if(up('shadow')>0) updateShadow();
}

function startAttack(type){
  let dur, reach;
  if(type==='light'){ dur=16; G.combo++; G.comboTimer=46; }
  else if(type==='heavy'){ dur=26; G.combo++; G.comboTimer=46; }
  else { // special / D
    if(G.super>=1 || up('roll')===0){ /* allow */ }
    dur=30; G.combo++; G.comboTimer=46;
  }
  G.atkType=type; G.atkTimer=dur; G.atkDur=dur; G.atkHit=false;
  // record for shadow
  if(up('shadow')>0) G.shadowQueue.push({type, t:30, px:G.px, py:G.py, facing:G.facing});
}

function attackReach(){ return (G.char.reach + (G.atkType==='heavy'?16:G.atkType==='special'?26:0)) * (G.giantT>0?2.4:1); }
function attackDamage(){
  let base = G.atkType==='light'?9 : G.atkType==='heavy'?17 : 22;
  base += G.combo*1.2;
  return base*strMul();
}
function handleAttackHit(){
  // active frames in the middle of the attack
  const f = G.atkDur - G.atkTimer;
  if(f<3 || f>G.atkDur*0.7) return;
  if(G.atkHit && G.atkType!=='special') return;
  const reach=attackReach();
  const hx = G.px + G.facing*reach*0.5;
  const launch = (G.atkType==='heavy' && keys.up); // up+B launches
  for(const e of enemies){
    if(e.dead) continue;
    const ex=e.x, ey=e.y;
    if(Math.abs(ey-G.py)<46 && Math.abs(ex-hx)<reach*0.6 + e.w*0.5 &&
       Math.sign(ex-G.px)===G.facing){
      hitEnemy(e, attackDamage(), launch);
      G.atkHit=true;
      gainSuper(2.2);
      if(G.atkType!=='special') break;
    }
  }
}

function hitEnemy(e, dmg, launch){
  if(e.frozen>0 && false){}
  let d=dmg;
  if(G.giantT>0) d=99999; // overclock one-shot
  e.hp-=d;
  e.hurt=8; e.stun=Math.max(e.stun, e.type==='boss'?3:12);
  e.knock=(G.facing)* (G.atkType==='heavy'?9:5) * (e.type==='boss'?0.25:1);
  e.x+=e.knock;
  if(launch && e.type!=='boss'){ e.vz=-8; e.z=Math.min(e.z,-1); }
  blood(e.x-camX+camX, e.y-e.h*0.5, G.atkType==='heavy'?10:6, '#ff1a4a');
  sparks(e.x, e.y-e.h*0.5, e.color);
  hitstop = G.atkType==='heavy'?6: G.atkType==='special'?8:3;
  shake=Math.max(shake, G.atkType==='heavy'?7:4);
  flash=Math.max(flash,4);
  G.score+=Math.floor(d);
  floatText(e.x, e.y-e.h-6, Math.floor(d), G.atkType==='special'?'#ffe14a':'#fff');
  if(e.hp<=0 && !e.dead) killEnemy(e, G.atkType!=='light' || G.combo>4);
}

function killEnemy(e, fatality){
  e.dead=true; e.deathT=30; G.kills++; G.score+=120;
  if(e.type==='boss'){ bossDefeated(e); return; }
  gainSuper(6);
  if(fatality){
    e.gib=true;
    gibs(e.x, e.y-e.h*0.5, e.color);
    shake=Math.max(shake,9); flash=6; flashCol='#ff1a4a';
    floatText(e.x, e.y-e.h, 'FATALITY', '#ff2a6a');
  } else {
    blood(e.x, e.y-e.h*0.4, 14, '#ff1a4a');
  }
}

function gainSuper(amt){
  G.super=clamp(G.super + amt/100*1, 0, G.superMax);
}

function takeDamage(dmg, fromX){
  if(G.invuln>0||G.rolling||G.invincT>0||G.dead) return;
  const d = dmg*dmgTakenMul();
  G.hp-=d; G.hurtTimer=18; G.invuln=40;
  G.facing = fromX>G.px? 1:-1; // face attacker
  G.px -= Math.sign(G.px-fromX)*-6; // small knock toward
  G.px += (G.px<fromX?-1:1)*10;
  gainSuper(3);
  blood(G.px, G.py-40, 8, '#ff3a6a');
  shake=Math.max(shake,6); flash=Math.max(flash,5); flashCol='#ff2a6a';
  if(G.hp<=0) playerDeath();
}

function playerDeath(){
  G.dead=true; G.hp=0;
  shake=12; glitch=40; flash=8; flashCol='#ff00aa';
  blood(G.px,G.py-40,30,'#ff1a4a');
  // schedule the CyberDegeneration screen
  setTimeout(()=>{}, 0);
  G.deathDelay=46;
}

/* ---------- Super move ---------- */
function doSuper(){
  const stocks = Math.floor(G.super);
  if(stocks<1) return;
  const ult = stocks>=3;
  G.super -= ult?3:1;
  hitstop=14; shake=14; flash=8; flashCol=ult?'#ffe14a':G.char.color;
  glitch=ult?26:14;
  const reach = ult? 360:200;
  // time stop upgrade
  if(up('timestop')>0){ for(const e of enemies) e.frozen=300; }
  for(const e of enemies){
    if(e.dead) continue;
    if(Math.abs(e.y-G.py)<140 && Math.abs(e.x-G.px)<reach){
      const dmg=(ult?160:70)*strMul();
      hitEnemy(e,dmg,true);
      e.x += Math.sign(e.x-G.px)*30;
    }
  }
  floatText(G.px, G.py-110, ult?'CYBER-EXECUTION':'OKUGI', '#ffe14a');
  // big slash particles
  for(let i=0;i<30;i++) particles.push({x:G.px+rand(-reach,reach),y:G.py-rand(0,90),vx:rand(-6,6),vy:rand(-8,2),g:0.3,life:rand(16,34),col:G.char.weapon,sz:rand(2,6),t:'spark'});
}

/* ---------- Shadow clone ---------- */
function updateShadow(){
  for(let i=G.shadowQueue.length-1;i>=0;i--){
    const s=G.shadowQueue[i]; s.t--;
    if(s.t===0){
      // replicate hit at shadow position
      const reach=G.char.reach;
      const hx=s.px - 46*s.facing + s.facing*reach*0.5;
      for(const e of enemies){
        if(e.dead)continue;
        if(Math.abs(e.y-s.py)<46 && Math.abs(e.x-hx)<reach*0.6+e.w*0.5){
          hitEnemy(e, attackDamageFor(s.type)*0.6, false);
        }
      }
      G.shadowQueue.splice(i,1);
    }
  }
}
function attackDamageFor(type){ let b=type==='light'?9:type==='heavy'?17:22; return b*strMul(); }

/* ---------- Minion drone ---------- */
let minionShots=[];
function updateMinion(){
  G.minionX = G.px - G.facing*40;
  G.minionY = G.py - 90 + Math.sin(time*0.1)*8;
  if(G.minionT<=0){
    // find nearest enemy
    let best=null,bd=1e9;
    for(const e of enemies){ if(e.dead)continue; const dd=dist(e.x,e.y,G.minionX,G.minionY); if(dd<bd){bd=dd;best=e;} }
    if(best){
      const ang=Math.atan2(best.y-best.h*0.5-G.minionY, best.x-G.minionX);
      minionShots.push({x:G.minionX,y:G.minionY,vx:Math.cos(ang)*8,vy:Math.sin(ang)*8,life:60});
      G.minionT=36;
    }
  }
}
function updateMinionShots(){
  for(let i=minionShots.length-1;i>=0;i--){
    const s=minionShots[i]; s.x+=s.vx; s.y+=s.vy; s.life--;
    let hit=false;
    for(const e of enemies){ if(e.dead)continue;
      if(dist(s.x,s.y,e.x,e.y-e.h*0.5)<e.w*0.6){ hitEnemy(e,5,false); e.stun=Math.max(e.stun,20); hit=true; break; }
    }
    if(hit||s.life<=0) minionShots.splice(i,1);
  }
}

/* ===================================================================== */
/*  ENEMY LOGIC                                                           */
/* ===================================================================== */
function updateEnemies(){
  for(const e of enemies){
    if(e.dead){ e.deathT--; continue; }
    if(e.hurt>0)e.hurt--;
    if(e.frozen>0){ e.frozen--; continue; }
    if(e.stun>0){ e.stun--; e.x+=e.knock; e.knock*=0.8;
      if(e.vz!==undefined){ e.z+=e.vz; e.vz+=0.6; if(e.z>=0){e.z=0;e.vz=0;} }
      continue; }
    if(e.type==='boss') updateBoss(e); else updateGrunt(e);
  }
  // remove finished deaths
  enemies = enemies.filter(e=> !(e.dead && e.deathT<=0));
}

function updateGrunt(e){
  if(e.knock){ e.x+=e.knock; e.knock*=0.85; if(Math.abs(e.knock)<0.5)e.knock=0; }
  if(e.vz){ e.z+=e.vz; e.vz+=0.6; if(e.z>=0){e.z=0;e.vz=0;} }
  const dx=G.px-e.x, dy=G.py-e.y;
  e.facing = dx>0?1:-1;
  const adist=Math.abs(dx), advy=Math.abs(dy);
  e.think--;
  const sp=(0.9+G.level*0.18)*(e.tier*0.15+1);
  if(adist>54 || advy>22){
    if(adist>54) e.x += e.facing*sp;
    if(advy>10) e.y += Math.sign(dy)*sp*0.7;
    e.y=clamp(e.y,FLOOR_TOP,FLOOR_BOT);
    e.atk=0;
  } else {
    // attack
    if(e.atk<=0 && e.think<0){ e.atk=34; e.atkHit=false; e.think=ri(30,90); }
  }
  if(e.atk>0){
    e.atk--;
    if(e.atk<22 && e.atk>10 && !e.atkHit){
      if(Math.abs(G.px-e.x)<58 && Math.abs(G.py-e.y)<40 && G.pz>-30){
        takeDamage(8+G.level*2, e.x); e.atkHit=true;
      }
    }
  }
}

/* ---------- BOSS AI ---------- */
function updateBoss(b){
  if(b.knock){ b.x+=b.knock; b.knock*=0.9; }
  if(b.hp < b.hpMax*0.5 && b.phase===1){ b.phase=2; b.t=60; bannerT=90; bannerTxt='FASE 2'; bannerSub=''; flash=6; }
  if(b.id==='marek') bossMarek(b);
  else if(b.id==='sinfonia') bossSinfonia(b);
  else if(b.id==='kurosawa') bossKurosawa(b);
}

function bossMarek(b){
  b.t--;
  const dx=G.px-b.x;
  b.facing=dx>0?1:-1;
  if(b.state==='idle'){
    // track slowly
    b.x += Math.sign(dx)*0.6;
    b.y += Math.sign(G.py-b.y)*0.5; b.y=clamp(b.y,FLOOR_TOP,FLOOR_BOT);
    if(b.t<=0){ b.state='windup'; b.t=40; }
  } else if(b.state==='windup'){
    if(b.t<=0){ b.state='charge'; b.t=40; b.chargeDir=Math.sign(dx)||1; b.atkHit=false; }
  } else if(b.state==='charge'){
    b.x += b.chargeDir*9;
    if(Math.abs(G.px-b.x)<70 && Math.abs(G.py-b.y)<48 && !b.atkHit && G.pz>-30){
      takeDamage(18, b.x); b.atkHit=true;
    }
    // hit wall (screen edge) -> stun
    if(b.x<camX+70 || b.x>camX+W-70 || b.t<=0){
      b.state='stun'; b.stun=90; b.t=0; shake=10; sparks(b.x,b.y-40,'#ffae00');
    }
    b.t--;
  } else if(b.state==='stun'){
    if(b.stun<=0){ b.state='idle'; b.t=ri(60,110); }
  }
  // phase 2: shockwaves
  if(b.phase===2){
    if(b.t2===undefined)b.t2=0;
    b.t2--;
    if(b.t2<=0 && b.state==='idle'){
      b.t2=150;
      // slam
      shake=12; flash=5;
      for(let k=-1;k<=1;k+=2){
        b.shock.push({x:b.x, y:b.y, dir:k, life:80, r:0});
      }
    }
  }
  // update shockwaves
  for(let i=b.shock.length-1;i>=0;i--){
    const s=b.shock[i]; s.x+=s.dir*6; s.r+=2; s.life--;
    if(Math.abs(G.px-s.x)<26 && Math.abs(G.py-s.y)<60 && G.pz>-40){ takeDamage(14,s.x); s.life=0; }
    if(s.life<=0)b.shock.splice(i,1);
  }
}

function bossSinfonia(b){
  b.t--;
  b.float+=0.06;
  const dx=G.px-b.x;
  b.facing=dx>0?1:-1;
  // hover
  b.y = 320 + Math.sin(b.float)*14;
  if(b.phase===1){
    // keep distance, throw fans
    if(Math.abs(dx)<260) b.x += -Math.sign(dx)*1.4; else b.x += Math.sign(dx)*0.8;
    b.x=clamp(b.x,camX+90,camX+W-60);
    if(b.t<=0){
      b.t=70;
      // mirrored laser fans bounce
      for(let a=0;a<2;a++){
        b.fans.push({x:b.x,y:b.y, vx:(dx>0?1:-1)*5*(a?0.7:1), vy:rand(-2,2), life:160, bounce:2});
      }
    }
  } else {
    // phase 2: split into clones
    if(b.clones.length===0){
      b.clones=[];
      b.realClone=ri(0,2);
      for(let i=0;i<3;i++) b.clones.push({x:camX+180+i*260, y:300, glitch: i===b.realClone, ox:rand(0,6)});
      b.cloneT=240;
    }
    b.cloneT--;
    for(const c of b.clones){ c.y=300+Math.sin(b.float+c.ox)*16; }
    // clones shoot occasionally
    if(b.t<=0){ b.t=90;
      for(const c of b.clones){
        const ang=Math.atan2(G.py-c.y, G.px-c.x);
        b.fans.push({x:c.x,y:c.y,vx:Math.cos(ang)*4,vy:Math.sin(ang)*4,life:150,bounce:1});
      }
    }
    if(b.cloneT<=0){ b.clones=[]; } // reshuffle
    // main body hidden during clones; damage redirect handled in draw/hit
  }
  // fans update
  for(let i=b.fans.length-1;i>=0;i--){
    const f=b.fans[i]; f.x+=f.vx; f.y+=f.vy; f.life--;
    if((f.y<FLOOR_TOP-40||f.y>FLOOR_BOT)&&f.bounce>0){f.vy*=-1;f.bounce--;}
    if((f.x<camX+10||f.x>camX+W-10)&&f.bounce>0){f.vx*=-1;f.bounce--;}
    if(Math.abs(G.px-f.x)<20 && Math.abs(G.py-f.y)<30 && G.pz>-30){ takeDamage(12,f.x); f.life=0; }
    if(f.life<=0)b.fans.splice(i,1);
  }
}

function bossKurosawa(b){
  b.t--;
  const dx=G.px-b.x;
  b.facing=dx>0?1:-1;
  // slow reposition
  b.x += Math.sign(dx)*0.4;
  b.x=clamp(b.x,camX+120,camX+W-120);
  if(b.state==='idle'){
    if(b.t<=0){
      b.state = Math.random()<0.5?'laser':'legs';
      b.t = b.state==='laser'?140:170;
      if(b.state==='laser'){ b.laser={x:G.px, lock:60, fire:0}; }
      if(b.state==='legs'){ b.legSeq=['L','R','C']; b.legStep=0; b.legT=30; }
    }
  } else if(b.state==='laser'){
    if(b.laser.lock>0){ b.laser.lock--; b.laser.x += (G.px-b.laser.x)*0.04; }
    else if(b.laser.fire<24){
      b.laser.fire++;
      if(b.laser.fire===1){ shake=10; flash=6; flashCol='#ff2a2a'; }
      if(Math.abs(G.px-b.laser.x)<26 && G.pz>-50){ takeDamage(22,b.laser.x); }
    } else { b.state='idle'; b.t=ri(40,80); b.laser=null; }
  } else if(b.state==='legs'){
    b.legT--;
    if(b.legT<=0 && b.legStep<3){
      const pos=b.legSeq[b.legStep];
      const lx = pos==='L'? camX+W*0.3 : pos==='R'? camX+W*0.7 : G.px;
      b.curLeg={x:lx, t:18};
      shake=8;
      if(Math.abs(G.px-lx)<60 && G.pz>-30) takeDamage(16,lx);
      // expose core after sequence near body
      b.legStep++; b.legT=34;
    }
    if(b.curLeg){ b.curLeg.t--; if(b.curLeg.t<=0)b.curLeg=null; }
    if(b.legStep>=3 && !b.curLeg){
      b.state='exposed'; b.exposed=120;
    }
  } else if(b.state==='exposed'){
    b.exposed--;
    if(b.exposed<=0){ b.state='idle'; b.t=ri(50,90); }
  }
}

/* ---------- boss hit redirection (Sinfonia clones) ---------- */
function bossDefeated(b){
  G.bossActive=false;
  shake=20; flash=10; flashCol='#fff'; glitch=30;
  gibs(b.x,b.y-b.h*0.5,b.color); gibs(b.x,b.y-b.h*0.3,'#ff1a4a');
  floatText(b.x,b.y-b.h,'TERMINATED','#ff2a6a');
  G.score+=5000;
  setTimeout(()=>{},0);
  // advance after short delay
  G.bossDeathT=80;
}

/* ===================================================================== */
/*  DRAWING ACTORS                                                        */
/* ===================================================================== */
function drawShadowOval(x,y,w){
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x-camX,y,w,w*0.3,0,0,7); ctx.fill();
}

function drawPlayer(){
  const c=G.char;
  const x=G.px-camX, baseY=G.py, y=baseY+G.pz;
  const giant=G.giantT>0?2.2:1;
  drawShadowOval(G.px, baseY, 22*giant);
  ctx.save();
  // flicker on hurt
  if(G.hurtTimer>0 && Math.floor(time/2)%2===0) ctx.globalAlpha=0.4;
  // invincibility aura
  if(G.invincT>0){ ctx.shadowColor='#ffd23c'; ctx.shadowBlur=24;
    ctx.fillStyle='rgba(255,210,60,0.18)'; ctx.beginPath(); ctx.ellipse(x,y-50,40*giant,60*giant,0,0,7); ctx.fill(); }
  drawHumanoid(x,y,c.color,c.accent,c.weapon, G.facing, giant, G.atkTimer>0?G.atkType:null, G.atkTimer, G.atkDur, false, G.rolling);
  ctx.restore();

  if(up('shadow')>0){

// generic humanoid: stylized neon fighter
function drawHumanoid(x,y,col,acc,weap,facing,scale,atkType,atkT,atkDur,ghost,rolling){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(facing*scale, scale);
  const ink='#0a0010';
  if(rolling){ ctx.rotate((1-atkT)); }
  // legs
  ctx.fillStyle=shade(col,-40);
  ctx.strokeStyle=ink; ctx.lineWidth=2/scale;
  rr(-12,-34,9,34,3); ctx.fill(); ctx.stroke();
  rr(3,-34,9,34,3); ctx.fill(); ctx.stroke();
  // torso
  ctx.fillStyle=col;
  rr(-13,-78,26,46,6); ctx.fill(); ctx.stroke();
  // chest light
  ctx.fillStyle=acc; rr(-5,-70,10,8,2); ctx.fill();
  // head
  ctx.fillStyle=shade(col,20);
  rr(-10,-100,20,22,7); ctx.fill(); ctx.stroke();
  // visor
  ctx.fillStyle=ghost?'#00eaff':weap; ctx.shadowColor=weap; ctx.shadowBlur=8/scale;
  rr(-7,-94,16,5,2); ctx.fill(); ctx.shadowBlur=0;
  // arm + weapon depending on attack
  ctx.strokeStyle=ink; ctx.lineWidth=3/scale;
  let armAng=0.2, swing=0;
  if(atkType && atkDur>0){
    const p=1-atkT/atkDur;
    swing = Math.sin(p*Math.PI);
  }
  ctx.save();
  ctx.translate(8,-66);
  if(atkType==='heavy'||atkType==='special'){ ctx.rotate(-1.4+swing*2.4); }
  else if(atkType==='light'){ ctx.rotate(-0.2+swing*1.6); }
  else ctx.rotate(0.3);
  // arm
  ctx.strokeStyle=shade(col,10); ctx.lineWidth=7/scale;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(16,2); ctx.stroke();
  // weapon (blade / claw)
  if(atkType){
    ctx.strokeStyle=weap; ctx.shadowColor=weap; ctx.shadowBlur=14/scale;
    ctx.lineWidth=(atkType==='light'?3:5)/scale;
    ctx.beginPath(); ctx.moveTo(16,2); ctx.lineTo(16+ (atkType==='light'?34:54),2); ctx.stroke();
    // slash arc
    ctx.globalAlpha=0.5; ctx.lineWidth=2/scale;
    ctx.beginPath(); ctx.arc(16,2, atkType==='light'?34:54, -0.6,0.6); ctx.stroke();
    ctx.globalAlpha=1; ctx.shadowBlur=0;
  } else {
    ctx.strokeStyle=weap; ctx.lineWidth=3/scale;
    ctx.beginPath(); ctx.moveTo(16,2); ctx.lineTo(30,2); ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

function drawGrunt(e){

    // falling corpse fade
    ctx.globalAlpha=clamp(e.deathT/30,0,1);
    drawShadowOval(e.x,e.y,16);
    ctx.save(); ctx.translate(e.x-camX,e.y); ctx.rotate(0.4*(1-e.deathT/30)*e.facing);
    ctx.fillStyle=shade(e.color,-10); rr(-12,-60,24,60,6); ctx.fill(); ctx.restore();
    ctx.globalAlpha=1; return;
  }
  drawShadowOval(e.x,e.y,16);
  const x=e.x-camX, y=e.y+(e.z||0);
  ctx.save(); ctx.translate(x,y); ctx.scale(e.facing,1);
  if(e.hurt>0 && Math.floor(time/2)%2===0) ctx.globalAlpha=0.6;
  const ink='#0a0010';
  ctx.strokeStyle=ink; ctx.lineWidth=2;
  // legs
  ctx.fillStyle=shade(e.color,-40); rr(-11,-30,8,30,3); ctx.fill(); ctx.stroke(); rr(3,-30,8,30,3); ctx.fill(); ctx.stroke();
  // body
  ctx.fillStyle=e.color; rr(-12,-66,24,40,5); ctx.fill(); ctx.stroke();
  // head
  ctx.fillStyle=shade(e.color,18); rr(-9,-86,18,20,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ff2a2a'; rr(-6,-80,12,4,1); ctx.fill();

function drawBoss(b){
  if(b.dead){
    ctx.globalAlpha=clamp(b.deathT/30,0,1);

  drawShadowOval(b.x, b.y, b.w*0.5);
  const x=b.x-camX, y=b.y;

}

      const c=b.clones[i];

      ctx.save(); ctx.globalAlpha = real? 1 : 0.8;

function drawKurosawa(b,x,y){
  ctx.save(); ctx.translate(x,y);
  // spider legs
  ctx.strokeStyle=shade(b.color,-20); ctx.lineWidth=6;
  for(let i=-3;i<=3;i++){ if(i===0)continue;
    const lx=i*22, sign=i<0?-1:1;
    ctx.beginPath(); ctx.moveTo(sign*20,-60);
    ctx.lineTo(lx*1.6,-90+Math.abs(i)*6);
    ctx.lineTo(lx*2.0, 0); ctx.stroke();
  }
  ctx.scale(b.facing,1);
  const ink='#0a0010'; ctx.strokeStyle=ink; ctx.lineWidth=3;
  // golden mech body
  ctx.fillStyle=b.color; ctx.shadowColor=b.color; ctx.shadowBlur=14;
  rr(-50,-110,100,70,12); ctx.fill(); ctx.shadowBlur=0; ctx.stroke();
  ctx.fillStyle=shade(b.color,-30); rr(-50,-110,100,70,12); ctx.globalAlpha=0; ctx.globalAlpha=1;
  // brain dome
  ctx.fillStyle='rgba(180,255,240,0.6)';
  ctx.beginPath(); ctx.ellipse(0,-120,30,26,0,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ff7ab0'; ctx.beginPath(); ctx.ellipse(0,-118,18,14,0,0,7); ctx.fill();
  ctx.strokeStyle='#c0457a'; ctx.lineWidth=1.5;
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(0,-118,6+i*3,0.4,2.6); ctx.stroke(); }
  // exposed core when vulnerable
  if(b.state==='exposed'){
    ctx.fillStyle='#ff2a2a'; ctx.shadowColor='#ff2a2a'; ctx.shadowBlur=20+10*Math.sin(time*0.5);
    ctx.beginPath(); ctx.arc(0,-70,16,0,7); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-70,6,0,7); ctx.fill();
  }
  ctx.restore();
  // laser warning + beam
  if(b.id==='kurosawa' && b.laser){
    if(b.laser.lock>0){
      ctx.strokeStyle='#ff2a2a'; ctx.lineWidth=2; ctx.globalAlpha=0.4+0.4*Math.sin(time*0.6);
      const lx=b.laser.x-camX;
      ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx,H); ctx.stroke();
      ctx.beginPath(); ctx.arc(lx,G.py,18,0,7); ctx.stroke();
      ctx.globalAlpha=1;
    } else if(b.laser.fire<24){
      const lx=b.laser.x-camX;
      ctx.fillStyle='rgba(255,60,60,0.85)'; ctx.shadowColor='#ff2a2a'; ctx.shadowBlur=30;
      ctx.fillRect(lx-16,0,32,H); ctx.shadowBlur=0;
      ctx.fillStyle='#fff'; ctx.fillRect(lx-5,0,10,H);
    }
  }
  // kurosawa legs slam
  if(b.id==='kurosawa' && b.curLeg){
    const lx=b.curLeg.x-camX;
    ctx.strokeStyle=shade(b.color,-10); ctx.lineWidth=10;
    ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx,FLOOR_BOT); ctx.stroke();
    sparks(b.curLeg.x,FLOOR_BOT,'#ffd23c');
  }
}

function drawHUD(){

    const x=18+i*(segW+3), y=28;
    if(i<segs){
      ctx.fillStyle = i<3? '#ff2a4a':'#39ff14';
      ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=6;
      ctx.fillRect(x,y,segW,10); ctx.shadowBlur=0;
    } else {
      ctx.fillStyle='#2a0014'; ctx.fillRect(x,y,segW,10);
      ctx.strokeStyle='#5a1030'; ctx.strokeRect(x+0.5,y+0.5,segW,10);
    }
  }
  // current HP bar
  ctx.fillStyle='#220'; ctx.fillRect(18,42,segW*10+27,8);
  const hpw=(segW*10+27)*clamp(G.hp/G.hpMax,0,1);
  const hg=ctx.createLinearGradient(18,0,18+hpw,0); hg.addColorStop(0,'#ff0044'); hg.addColorStop(1,'#ff8a00');
  ctx.fillStyle=hg; ctx.fillRect(18,42,hpw,8);

  // super meter
  ctx.fillStyle='#5af0ff'; ctx.fillText('OKUGI', 18, 72);
  for(let i=0;i<3;i++){
    const x=72+i*44, y=62;
    ctx.strokeStyle='#00eaff'; ctx.lineWidth=1.5; ctx.strokeRect(x,y,40,10);
    const fill=clamp(G.super-i,0,1);
    if(fill>0){ ctx.fillStyle = fill>=1?'#ffe14a':'#00eaff';
      if(fill>=1){ctx.shadowColor='#ffe14a';ctx.shadowBlur=8;}
      ctx.fillRect(x,y,40*fill,10); ctx.shadowBlur=0; }
  }

  // char name + score
  ctx.textAlign='right';
  ctx.fillStyle=G.char.color; ctx.font='bold 14px Courier New';
  ctx.fillText(G.char.name, W-18, 22);
  ctx.fillStyle='#fff'; ctx.font='12px Courier New';
  ctx.fillText('SCORE '+G.score, W-18, 40);
  ctx.fillStyle='#5af0ff'; ctx.fillText(LEVELS[G.level].name, W-18, 56);
  ctx.textAlign='left';

  // combo
  if(G.combo>2){
    ctx.save();
    ctx.font='bold 30px Courier New'; ctx.textAlign='center';
    const cy=140+ (3-Math.min(3,G.comboTimer/15))*2;
    ctx.fillStyle='#ffe14a'; ctx.shadowColor='#ff2a6a'; ctx.shadowBlur=10;
    ctx.fillText(G.combo+' HIT', W/2, 130);
    ctx.shadowBlur=0; ctx.textAlign='left'; ctx.restore();
  }

  // active timed buffs
  let by=92; ctx.font='11px Courier New';
  if(G.invincT>0){ ctx.fillStyle='#ffd23c'; ctx.fillText('INVINCIBILE '+Math.ceil(G.invincT/60)+'s',18,by); by+=14; }
  if(G.giantT>0){ ctx.fillStyle='#9dff3c'; ctx.fillText('OVERCLOCK GIGANTE '+Math.ceil(G.giantT/60)+'s',18,by); by+=14; }

  // boss health
  const boss=enemies.find(e=>e.type==='boss');
  if(boss && !boss.dead){
    ctx.fillStyle='#ff2a6a'; ctx.font='bold 13px Courier New'; ctx.textAlign='center';
    ctx.fillText(boss.name, W/2, H-46);
    ctx.fillStyle='#330010'; ctx.fillRect(W/2-220,H-40,440,14);
    const bw=440*clamp(boss.hp/boss.hpMax,0,1);
    const bg=ctx.createLinearGradient(W/2-220,0,W/2+220,0); bg.addColorStop(0,'#ff0044');bg.addColorStop(1,'#ffae00');
    ctx.fillStyle=bg; ctx.fillRect(W/2-220,H-40,bw,14);
    ctx.strokeStyle='#ff2a6a'; ctx.strokeRect(W/2-220.5,H-40.5,440,14);
    ctx.textAlign='left';
  }
  ctx.restore();
}

function wrapText(text,x,y,maxW,lh){
  const words=text.split(' '); let line='', yy=y;
  for(const w of words){
    if(ctx.measureText(line+w).width>maxW){ ctx.fillText(line,x,yy); line=w+' '; yy+=lh; }
    else line+=w+' ';
  }
  ctx.fillText(line,x,yy);
}

    if(sel){ctx.shadowColor='#ffe14a';ctx.shadowBlur=18;}
    rr(x,y,cw,h,10); ctx.stroke(); ctx.shadowBlur=0;
    ctx.fillStyle='#7fd6ff'; ctx.font='11px Courier New';
    ctx.fillText('['+u.cat+']', x+cw/2, y+34);
    ctx.fillStyle=sel?'#ffe14a':'#fff'; ctx.font='bold 18px Courier New';
    wrapText(u.name, x+cw/2, y+70, cw-30, 22);
    ctx.fillStyle='#cfeaff'; ctx.font='13px Courier New';
    wrapText(u.desc, x+cw/2, y+140, cw-40, 18);
    if(G.upgrades[u.id]) { ctx.fillStyle='#9dff3c'; ctx.font='11px Courier New'; ctx.fillText('POSSEDUTO Lv.'+G.upgrades[u.id], x+cw/2, y+h-20); }
    ctx.fillStyle=sel?'#ffe14a':'#5af0ff'; ctx.font='12px Courier New';
    ctx.fillText('('+(i+1)+')', x+cw/2, y+h-40);
  }
  ctx.fillStyle='#fff'; ctx.font='14px Courier New';
  ctx.fillText('◀ ▶ scegli  •  INVIO/1-2-3 conferma — poi RINASCI', W/2, H-30);
  ctx.textAlign='left';
}

function drawGameOver(win){
  ctx.fillStyle= win? 'rgba(0,10,20,0.85)':'rgba(20,0,6,0.88)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='bold 60px Courier New';
  if(win){ ctx.fillStyle='#39ff14'; ctx.shadowColor='#39ff14'; ctx.shadowBlur=20;
    ctx.fillText('RUN COMPLETATA', W/2, 180); }
  else { ctx.fillStyle='#ff2a4a'; ctx.shadowColor='#ff0044'; ctx.shadowBlur=20;
    ctx.fillText('NUCLEO COLLASSATO', W/2, 180); }
  ctx.shadowBlur=0;
  ctx.font='18px Courier New'; ctx.fillStyle='#9bdcff';
  ctx.fillText(win?'Hai distrutto Kurosawa. Sei sopravvissuto al filo del rasoio.'
                  :'Game Over. La CyberDegenerazione ti ha consumato.', W/2, 230);
  ctx.fillStyle='#fff'; ctx.font='20px Courier New';
  ctx.fillText('SCORE FINALE: '+G.score, W/2, 290);
  ctx.fillStyle='#ffe14a'; ctx.font='15px Courier New';
  ctx.fillText('Uccisioni: '+G.kills+'   •   Vita Massima residua: '+G.maxSeg, W/2, 320);
  ctx.font='bold 18px Courier New';
  ctx.fillStyle=Math.floor(time/20)%2?'#fff':'#5af0ff';
  ctx.fillText('▶ INVIO per tornare al menu', W/2, 400);
  ctx.textAlign='left';
}

function drawBanner(){
  if(bannerT<=0) return;
  const a=clamp(bannerT/30,0,1)*clamp((180-bannerT)/20,0,1);
  ctx.save(); ctx.globalAlpha=Math.min(1,a+0.2); ctx.textAlign='center';
  ctx.font='bold 44px Courier New';
  ctx.fillStyle = bannerTxt==='WARNING'? '#ff2a4a':'#fff';
  ctx.shadowColor='#ff00aa'; ctx.shadowBlur=16;
  ctx.fillText(bannerTxt, W/2, H/2-10);
  ctx.font='bold 22px Courier New'; ctx.fillStyle='#5af0ff'; ctx.shadowBlur=8;
  ctx.fillText(bannerSub, W/2, H/2+24);
  ctx.restore(); ctx.textAlign='left';
}

/* ===================================================================== */
/*  CYBER-DEGENERATION TRIGGER                                            */
/* ===================================================================== */
function triggerDegeneration(){
  G.maxSeg -= 1;
  if(G.maxSeg<=0){ state='GAMEOVER'; G.win=false; return; }
  // build 3 random choices
  upgradeChoices=[];
  const pool=UPGRADES.slice();
  // remove heal if at full? still allow. shuffle
  for(let i=pool.length-1;i>0;i--){ const j=ri(0,i); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  upgradeChoices=pool.slice(0,3);
  selIndex=0;
  state='UPGRADE';
  glitch=20;
  clearPressed();
}
function applyUpgrade(u){
  G.upgrades[u.id]=(G.upgrades[u.id]||0)+1;
  if(u.id==='heal'){ G.maxSeg=Math.min(10,G.maxSeg+1); }
  if(u.id==='invinc'){ G.invincT=30*60; }
  if(u.id==='giant'){ G.giantT=30*60; }
  // resurrect: new hpMax scales with remaining segments
  G.hpMax = Math.round(G.char.baseHp * (0.55 + 0.45*G.maxSeg/10));
  G.hp = G.hpMax;
  G.dead=false; G.invuln=70; G.hurtTimer=0;
  // knockback explosion on enemies
  shake=14; flash=8; flashCol=G.char.color; glitch=18;
  for(const e of enemies){ if(e.dead)continue;
    if(dist(e.x,e.y,G.px,G.py)<200){ e.x+=Math.sign(e.x-G.px)*70; e.stun=Math.max(e.stun,40);
      e.hp-=20*strMul(); if(e.hp<=0)killEnemy(e,false); }
  }
  for(let i=0;i<40;i++) particles.push({x:G.px,y:G.py-30,vx:rand(-9,9),vy:rand(-10,2),g:0.3,life:rand(20,40),col:G.char.color,sz:rand(2,6),t:'spark'});
  state='PLAYING';
  clearPressed();
}

/* ===================================================================== */
/*  MAIN LOOP                                                             */
/* ===================================================================== */
function update(){
  time++;
  if(bannerT>0)bannerT--;
  if(shake>0)shake*=0.86;
  if(flash>0)flash--;
  if(glitch>0)glitch--;

  if(state==='TITLE'){ if(consume('enter')){ state='CHARSELECT'; selChar=0; } return; }
  if(state==='CHARSELECT'){
    if(consume('left'))selChar=(selChar+2)%3;
    if(consume('right'))selChar=(selChar+1)%3;
    if(consume('enter')){ newRun(selChar); state='PLAYING'; clearPressed(); }
    return;
  }
  if(state==='GAMEOVER'){ if(consume('enter')){ state='TITLE'; clearPressed(); } return; }
  if(state==='UPGRADE'){
    if(consume('left'))selIndex=(selIndex+2)%3;
    if(consume('right'))selIndex=(selIndex+1)%3;
    if(consume('1'))selIndex=0;
    if(consume('2'))selIndex=1;
    if(consume('3'))selIndex=2;
    if(consume('enter')||consume('light')) applyUpgrade(upgradeChoices[selIndex]);
    return;
  }

  if(state==='PLAYING'){
    if(hitstop>0){ hitstop--; updateParticles(); return; }
    // death sequence
    if(G.dead){
      updateParticles(); updateEnemies();
      if(G.deathDelay>0){ G.deathDelay--; if(G.deathDelay===0) triggerDegeneration(); }
      return;
    }
    updatePlayer();
    updateEnemies();
    updateParticles();
    updateMinionShots();
    // boss death -> advance level
    if(G.bossDeathT!==undefined){
      G.bossDeathT--;
      if(G.bossDeathT<=0){
        G.bossDeathT=undefined;
        if(G.level>=2){ state='GAMEOVER'; G.win=true; }
        else { startLevel(G.level+1); }
      }
    }
  }
}

function render(){
  ctx.save();
  // screenshake
  if(shake>0.5) ctx.translate(rand(-shake,shake), rand(-shake,shake));

  if(state==='TITLE'){ drawTitle(); ctx.restore(); return; }
  if(state==='CHARSELECT'){ drawCharSelect(); ctx.restore(); return; }

  // world
  drawBackground();

  // draw actors sorted by y (depth)
  const actors=[...enemies];
  const drawList=actors.map(e=>({y:e.y,fn:()=> e.type==='boss'?drawBoss(e):drawGrunt(e)}));
  drawList.push({y:G.py, fn:drawPlayer});
  drawList.sort((a,b)=>a.y-b.y);
  for(const d of drawList) d.fn();

  // minion shots
  for(const s of minionShots){ ctx.fillStyle='#00eaff'; ctx.shadowColor='#00eaff'; ctx.shadowBlur=8;
    ctx.fillRect(s.x-camX-3,s.y-1,6,2); ctx.shadowBlur=0; }

  drawParticles();
  drawHUD();
  drawBanner();

  // glitch scanlines on degeneration / death
  if(glitch>0){
    for(let i=0;i<glitch;i++){
      const y=rand(0,H), h=rand(2,8);
      ctx.globalAlpha=0.5; ctx.fillStyle= i%2?'#ff00aa':'#00eaff';
      ctx.fillRect(0,y, W, h*0.4);
    }
    ctx.globalAlpha=1;
  }

  if(state==='UPGRADE') drawUpgradeScreen();
  if(state==='GAMEOVER') drawGameOver(G.win);

  ctx.restore();

  // flash overlay (not shaken)
  if(flash>0){ ctx.globalAlpha=clamp(flash/16,0,0.6); ctx.fillStyle=flashCol; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.8);
  vg.addColorStop(0,'transparent'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
