<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALERIO: NEON STRIKER</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { height:100%; background:#05010a; overflow:hidden;
    font-family:'Courier New', monospace; color:#e8f7ff;
    overscroll-behavior:none; touch-action:none; }
  #wrap { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #game { background:#05010a; box-shadow:0 0 60px #ff6a0055, 0 0 120px #ff00aa33;
    max-width:100%; max-height:100%; image-rendering: pixelated; }
  #hint { position:fixed; bottom:6px; left:50%; transform:translateX(-50%);
    font-size:12px; color:#ffb05a99; letter-spacing:1px; pointer-events:none; white-space:nowrap; }

  #rotate { position:fixed; inset:0; z-index:50; display:none;
    background:#05010a; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; }
  #rotate.show { display:flex; }
  #rotate .phone { width:70px; height:120px; border:4px solid #ff6a00; border-radius:14px;
    box-shadow:0 0 24px #ff6a0088; animation:tilt 1.8s ease-in-out infinite; margin-bottom:30px; }
  @keyframes tilt { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-90deg)} }
  #rotate h1 { font-size:24px; color:#ff6a00; text-shadow:0 0 14px #ff6a00; letter-spacing:2px; }
  #rotate p { margin-top:12px; color:#ffca9b; font-size:15px; }

  #touch { position:fixed; inset:0; z-index:30; display:none; pointer-events:none; }
  #touch.show { display:block; }
  .tbtn { position:fixed; pointer-events:auto; display:flex; align-items:center; justify-content:center;
    font-family:'Courier New',monospace; font-weight:bold; color:#eaffff;
    border-radius:50%; background:rgba(40,10,4,0.45); border:2px solid rgba(255,106,0,0.55);
    backdrop-filter:blur(2px); box-shadow:0 0 12px rgba(255,106,0,0.25); transition:transform .05s; }
  .tbtn.pressed { transform:scale(0.9); background:rgba(255,106,0,0.4); border-color:#ffe14a; }
  .tbtn small { font-size:10px; opacity:.7; position:absolute; bottom:6px; }
  #dpad { position:fixed; left:18px; bottom:18px; width:168px; height:168px; pointer-events:none; }
  #dpad .tbtn { position:absolute; width:54px; height:54px; font-size:24px; }
  #d-up   { left:57px; top:0; }
  #d-down { left:57px; bottom:0; }
  #d-left { left:0; top:57px; }
  #d-right{ right:0; top:57px; }
  #b-A { right:104px; bottom:30px; width:60px; height:60px; font-size:18px; border-color:#ff2e7e; }
  #b-B { right:36px;  bottom:78px; width:60px; height:60px; font-size:18px; border-color:#ff7a1a; }
  #b-C { right:168px; bottom:60px; width:58px; height:58px; font-size:14px; border-color:#39ff14; }
  #b-D { right:104px; bottom:100px; width:60px; height:60px; font-size:18px; border-color:#00eaff; }
  #b-S { right:30px;  bottom:158px; width:54px; height:54px; font-size:13px; border-color:#ffe14a; color:#ffe14a; }
  @media (max-height:430px){
    #dpad{ width:148px; height:148px; }
    #dpad .tbtn{ width:48px; height:48px; }
    #d-up,#d-down{ left:50px; } #d-left,#d-right{ top:50px; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="hint">MOVE: WASD / Arrows &nbsp;•&nbsp; A: PUGNO &nbsp;•&nbsp; B: CALCIO &nbsp;•&nbsp; C: SALTO &nbsp;•&nbsp; D: SPECIALE &nbsp;•&nbsp; SUPER: U</div>

<div id="rotate">
  <div class="phone"></div>
  <h1>RUOTA IL DISPOSITIVO</h1>
  <p>VALERIO: NEON STRIKER si gioca in orizzontale.</p>
</div>

<div id="touch">
  <div id="dpad">
    <div class="tbtn" id="d-up"    data-k="up">▲</div>
    <div class="tbtn" id="d-down"  data-k="down">▼</div>
    <div class="tbtn" id="d-left"  data-k="left">◀</div>
    <div class="tbtn" id="d-right" data-k="right">▶</div>
  </div>
  <div class="tbtn" id="b-C" data-k="jump">JUMP</div>
  <div class="tbtn" id="b-D" data-k="special">D</div>
  <div class="tbtn" id="b-A" data-k="light">A</div>
  <div class="tbtn" id="b-B" data-k="heavy">B</div>
  <div class="tbtn" id="b-S" data-k="super">SUP</div>
</div>
<script>
"use strict";
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// --- LOAD VALERIO SPRITE ---
const valerioImg = new Image();
valerioImg.src = 'valerio_sprite.png'; 

/* ---------- Belt-scroller world ---------- */
const FLOOR_TOP = 360, FLOOR_BOT = 510;

/* ---------- Input ---------- */
const keys = {}; const pressed = {}; const lastTap = {};
function inputDown(k){
  if(!keys[k]){ pressed[k]=true;
    if(k==='left'||k==='right'){
      const t=performance.now();
      if(lastTap[k] && t-lastTap[k]<260) pressed['roll_'+k]=true;
      lastTap[k]=t;
    }
  }
  keys[k]=true;
}
function inputUp(k){ keys[k]=false; }
addEventListener('keydown', e=>{ if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault(); inputDown(norm(e.key)); });
addEventListener('keyup', e=>{ inputUp(norm(e.key)); });

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
function wireTouch(){
  document.querySelectorAll('.tbtn').forEach(btn=>{
    const k = btn.getAttribute('data-k');
    const down = e=>{ e.preventDefault(); btn.classList.add('pressed'); inputDown(k);
      if(k==='light') pressed['enter']=true; };
    const up = e=>{ e.preventDefault(); btn.classList.remove('pressed'); inputUp(k); };
    btn.addEventListener('touchstart', down, {passive:false});
    btn.addEventListener('touchend', up, {passive:false});
    btn.addEventListener('touchcancel', up, {passive:false});
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', e=>{ btn.classList.remove('pressed'); inputUp(k); });
  });
  const tapMenu = e=>{ if(state==='TITLE'||state==='CHARSELECT'||state==='GAMEOVER'){ e.preventDefault(); pressed['enter']=true; } };
  cv.addEventListener('touchstart', tapMenu, {passive:false});
}
function checkOrientation(){
  const portrait = window.innerHeight > window.innerWidth;
  const rot = document.getElementById('rotate');
  const tc = document.getElementById('touch');
  if(isTouch && portrait){ rot.classList.add('show'); tc.classList.remove('show'); }
  else { rot.classList.remove('show'); tc.classList.toggle('show', isTouch); }
}
addEventListener('resize', checkOrientation);
addEventListener('orientationchange', ()=>setTimeout(checkOrientation,200));
wireTouch(); checkOrientation();
if(isTouch){ const hn=document.getElementById('hint'); if(hn) hn.style.display='none'; }
function norm(key){
  switch(key){
    case 'ArrowLeft': case 'a': case 'A': return 'left';
    case 'ArrowRight': case 'd': case 'D': return 'right';
    case 'ArrowUp': case 'w': case 'W': return 'up';
    case 'ArrowDown': case 's': case 'S': return 'down';
    case ' ': return 'jump';
    case 'j': case 'J': return 'light';
    case 'k': case 'K': return 'heavy';
    case 'l': case 'L': return 'special';
    case 'u': case 'U': return 'super';
    case 'Enter': return 'enter';
    case 'Escape': return 'esc';
    default: return key;
  }
}
function consume(k){ if(pressed[k]){ pressed[k]=false; return true; } return false; }
function clearPressed(){ for(const k in pressed) pressed[k]=false; }

const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------- Characters ---------- */
const CHARS = [
  { id:'valerio_1', name:'VALERIO "IL BOMBER"', sub:'EQUILIBRATO', color:'#ff6a00', accent:'#fff', weapon:'#ff8c00',
    str:1.2, speed:1.1, vita:'MEDIA', baseHp:110, reach:74, desc:'Bilanciato. Calci devastanti e rapidità letale.' },
  { id:'valerio_2', name:'VALERIO "FULMINE"', sub:'VELOCISTA', color:'#ff9900', accent:'#fff', weapon:'#ffaa00',
    str:0.95, speed:1.45, vita:'MEDIA', baseHp:90, reach:68, desc:'Combo infinite. Si muove come un fulmine in campo.' },
  { id:'valerio_3', name:'VALERIO "ROCCIA"', sub:'DIFENSORE', color:'#cc4400', accent:'#fff', weapon:'#cc3300',
    str:1.5, speed:0.8, vita:'ALTA', baseHp:150, reach:80, desc:'Un carro armato. Lento ma inarrestabile.' },
];

/* ---------- Upgrades ---------- */
const UPGRADES = [
  {id:'force', cat:'STAT', name:'+ FORZA', desc:'+25% danno a tutti gli attacchi.'},
  {id:'speed', cat:'STAT', name:'+ VELOCITÀ', desc:'+20% velocità movimento e attacco.'},
  {id:'armor', cat:'STAT', name:'CORAZZA', desc:'-30% danni subiti.'},
  {id:'heal',  cat:'STAT', name:'+1 VITA MAX', desc:'Ripristina 1 segmento di Vita Massima.'},
  {id:'roll',  cat:'MOVE', name:'SCIVOLATA', desc:'Doppio-tap direzione = Scatto invincibile.'},
  {id:'invinc',cat:'STATO',name:'STELLA 30s', desc:'Aura dorata: immune a tutto per 30 secondi.'},
  {id:'timestop',cat:'STATO',name:'CARTELLINO ROSSO', desc:'La Super congela i nemici per 5 secondi.'},
  {id:'giant', cat:'STATO',name:'GIGANTE 30s', desc:'Diventi enorme: raggio immenso, one-shot.'},
  {id:'shadow',cat:'CLONI',name:'OMBRA', desc:"Un'ombra replica i tuoi colpi: combo raddoppiate."},
];

/* ---------- Levels ---------- */
const LEVELS = [
  { name:'NEON SLUMS', sub:'I BASSIFONDI', sky:['#1a0030','#3a0a4a'], neon:'#39ff14', fog:'#2b0040', rain:true, waves:[3,4], bossId:'marek' },
  { name:'THE CYBER-STRIP', sub:'DISTRETTO DEL PIACERE', sky:['#2a0036','#5a0a66'], neon:'#ff2bd6', fog:'#3a0050', strobe:true, waves:[4,5], bossId:'sinfonia' },
  { name:'NEXUS CORE', sub:'CUORE DELLA MEGA-CORP', sky:['#2a0008','#5a0010'], neon:'#ff2a2a', fog:'#330006', blood:true, waves:[5,6], bossId:'kurosawa' },
];

let state = 'TITLE', selChar = 0, selIndex = 0;
let G = null, particles = [], floaters = [], shake = 0, hitstop = 0;
let camX = 0, bgScroll = 0, flash = 0, flashCol='#fff', glitch = 0, time = 0;
let upgradeChoices = [], bannerT = 0, bannerTxt='', bannerSub='';

function newRun(charIdx){
  const c = CHARS[charIdx];
  G = {
    char:c, charIdx, maxSeg:10, hp:c.baseHp, hpMax:c.baseHp, super:0, superMax:3,
    px: 160, py: 460, pz:0, vx:0, vy:0, vz:0, facing:1, onGround:true,
    atkTimer:0, atkType:null, atkHit:false, atkFrames:0, atkDur:0, combo:0, comboTimer:0,
    hurtTimer:0, invuln:0, dead:false, rollTimer:0, rolling:false, upgrades:{},
    level:0, wave:0, waveEnemies:0, levelClear:false, score:0, kills:0,
    invincT:0, giantT:0, shadowQueue:[], minionT:0, minionX:0, minionY:0,
    showGo:false, nextWaveCamX:0
  };
  startLevel(0);
}

function startLevel(li){
  G.level = li; G.wave=0; G.levelClear=false; G.px=160; G.py=460; camX=0; bgScroll=0;
  enemies = []; G.bossActive = false;
  G.nextWaveCamX = 0; // Trigger the first wave immediately
  bannerT=180; bannerTxt='LIVELLO '+(li+1); bannerSub=LEVELS[li].name;
}

let enemies = [];
function spawnWave(){
  const lv = LEVELS[G.level];
  if(G.wave >= lv.waves.length){ spawnBoss(); return; }
  const count = lv.waves[G.wave];
  for(let i=0;i<count;i++){
    const side = Math.random()<0.5?-1:1;
    // Spawn just out of bounds since the camera is locked
    enemies.push(makeGrunt(side<0 ? camX-40-i*40 : camX+W+40+i*40, rand(FLOOR_TOP+10,FLOOR_BOT-10)));
  }
  G.waveEnemies = count;
}
function makeGrunt(x,y){
  const tier = ri(0, Math.min(2, G.level+1)); const hp = 26 + G.level*10 + tier*8;
  return { type:'grunt', x, y, z:0, vz:0, vx:0, vy:0, w:38, h:84, hp, hpMax:hp, facing:-1, atk:0, atkHit:false, hurt:0, stun:0, dead:false, deathT:0, color: tier===0?'#7a4dff': tier===1?'#ff6a3d':'#ff2a6a', tier, think:rand(0,40), knock:0, frozen:0, gib:false };
}
function spawnBoss(){
  enemies = []; bannerT=160; bannerTxt='WARNING'; bannerSub='BOSS APPROACHING';
  enemies.push(makeBoss(LEVELS[G.level].bossId)); G.bossActive = true;
}
function makeBoss(id){
  if(id==='marek') return { type:'boss', id, name:'MAREK IL DEMOLITORE', x:camX+W-140, y:430, z:0, vz:0, vx:0, vy:0, w:90, h:140, hp:600, hpMax:600, facing:-1, phase:1, state:'idle', t:90, atk:0, atkHit:false, stun:0, hurt:0, dead:false, deathT:0, color:'#ff7a1a', shock:[], charging:false };
  if(id==='sinfonia') return { type:'boss', id, name:'SINFONIA MISTICA', x:camX+W-160, y:300, z:0, w:64, h:120, vx:0, vy:0, vz:0, hp:560, hpMax:560, facing:-1, phase:1, state:'float', t:120, atk:0, atkHit:false, stun:0, hurt:0, dead:false, deathT:0, color:'#ff5cd8', fans:[], clones:[], realClone:0, float:0 };
  if(id==='kurosawa') return { type:'boss', id, name:'A.D. KUROSAWA', x:camX+W-180, y:380, z:0, w:130, h:150, vx:0, vy:0, vz:0, hp:820, hpMax:820, facing:-1, phase:1, state:'idle', t:140, atk:0, atkHit:false, stun:0, hurt:0, dead:false, deathT:0, color:'#ffd23c', laser:null, legs:0, exposed:0, legSeq:[] };
}

function blood(x,y,n,col){ for(let i=0;i<n;i++) particles.push({x,y,vx:rand(-5,5),vy:rand(-7,2),g:0.4,life:rand(20,46),col:col||'#ff1a4a',sz:rand(2,6),t:'blood'}); }
function gibs(x,y,col){
  for(let i=0;i<22;i++) particles.push({x,y,vx:rand(-8,8),vy:rand(-11,1),g:0.5,life:rand(30,70),col:i%3?'#ff1a4a':col,sz:rand(3,9),t:'gib'});
  for(let i=0;i<10;i++) particles.push({x,y,vx:rand(-3,3),vy:rand(-5,0),g:0.1,life:rand(20,40),col:'#fff',sz:rand(2,4),t:'spark'});
}
function sparks(x,y,col){ for(let i=0;i<8;i++) particles.push({x,y,vx:rand(-4,4),vy:rand(-4,2),g:0.2,life:rand(10,22),col:col||'#fff14a',sz:rand(1,3),t:'spark'}); }
function floatText(x,y,txt,col){ floaters.push({x,y,txt,col:col||'#fff',life:50,vy:-1.1}); }
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; if(p.t!=='spark' && p.y>FLOOR_BOT){ p.y=FLOOR_BOT; p.vy*=-0.3; p.vx*=0.6; } if(p.life<=0) particles.splice(i,1); }
  for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.y+=f.vy; f.life--; if(f.life<=0) floaters.splice(i,1); }
}
function drawParticles(){
  for(const p of particles){ ctx.globalAlpha = p.t==='spark'? clamp(p.life/22,0,1):1; ctx.fillStyle=p.col; const sx=p.x-camX; if(p.t==='gib') ctx.fillRect(sx-p.sz/2, p.y-p.sz/2, p.sz, p.sz); else ctx.fillRect(sx, p.y, p.sz, p.sz); }
  ctx.globalAlpha=1;
  for(const f of floaters){ ctx.globalAlpha=clamp(f.life/50,0,1); ctx.font='bold 18px Courier New'; ctx.textAlign='center'; ctx.fillStyle='#000'; ctx.fillText(f.txt, f.x-camX+1, f.y+1); ctx.fillStyle=f.col; ctx.fillText(f.txt, f.x-camX, f.y); }
  ctx.globalAlpha=1; ctx.textAlign='left';
}

function drawBackground(){
  const lv = LEVELS[G.level];
  const g=ctx.createLinearGradient(0,0,0,FLOOR_TOP+40); g.addColorStop(0,lv.sky[0]); g.addColorStop(1,lv.sky[1]); ctx.fillStyle=g; ctx.fillRect(0,0,W,FLOOR_TOP+60);
  const par = (f)=>-(camX*f % W);
  drawSkyline(par(0.15), lv); drawSkyline(par(0.15)+W, lv);
  drawBuildings(par(0.4), lv); drawBuildings(par(0.4)+W, lv);
  if(lv.strobe && Math.floor(time/6)%2===0){ ctx.fillStyle='rgba(255,80,220,0.05)'; ctx.fillRect(0,0,W,FLOOR_TOP); }
  if(lv.blood){ ctx.fillStyle='rgba(120,0,0,0.10)'; ctx.fillRect(0,0,W,FLOOR_TOP); }
  const fg=ctx.createLinearGradient(0,FLOOR_TOP,0,H); fg.addColorStop(0, shade(lv.sky[1],-20)); fg.addColorStop(1,'#070010'); ctx.fillStyle=fg; ctx.fillRect(0,FLOOR_TOP,W,H-FLOOR_TOP);
  ctx.strokeStyle=lv.neon+'55'; ctx.lineWidth=1;
  for(let i=0;i<14;i++){ const yy=FLOOR_TOP+ i*(H-FLOOR_TOP)/13; ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke(); }
  const gx = -(camX*1.0)%80;
  for(let x=gx-80;x<W+80;x+=80){ ctx.beginPath(); ctx.moveTo(x, FLOOR_TOP); ctx.lineTo((x-W/2)*2.2+W/2, H); ctx.stroke(); }
  ctx.strokeStyle=lv.neon; ctx.lineWidth=2; ctx.globalAlpha=0.7; ctx.beginPath(); ctx.moveTo(0,FLOOR_TOP); ctx.lineTo(W,FLOOR_TOP); ctx.stroke(); ctx.globalAlpha=1;
  if(lv.rain){ ctx.strokeStyle='rgba(120,255,200,0.25)'; ctx.lineWidth=1; for(let i=0;i<60;i++){ const rx=(i*97 + time*9)%W, ry=(i*53 + time*16)%FLOOR_TOP; ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-3,ry+12); ctx.stroke(); } }
}
function drawSkyline(ox,lv){ ctx.fillStyle=shade(lv.sky[0],-10); for(let i=0;i<10;i++){ const x=ox+i*100+ (i*37%40), h=80+ (i*53%120); ctx.fillRect(x, FLOOR_TOP-h, 70, h); } }
function drawBuildings(ox,lv){
  for(let i=0;i<7;i++){
    const x=ox+i*150+20, h=120+ (i*71%160), y=FLOOR_TOP-h;
    ctx.fillStyle=shade(lv.sky[1],-26); ctx.fillRect(x,y,110,h);
    ctx.strokeStyle=lv.neon+'88'; ctx.lineWidth=2; ctx.strokeRect(x+0.5,y+0.5,110,h);
    for(let wy=y+10; wy<FLOOR_TOP-8; wy+=20){
      for(let wx=x+8; wx<x+100; wx+=20){
        if((Math.floor(wx+wy+i*13))%5===0){ ctx.fillStyle = (wx+wy)%3? lv.neon : '#00eaff'; ctx.globalAlpha=0.5+0.3*Math.sin(time*0.05+wx); ctx.fillRect(wx,wy,8,10); ctx.globalAlpha=1; }
      }
    }
  }
}
function shade(hex,amt){
  let c=hex.replace('#',''); if(c.length===3)c=c.split('').map(x=>x+x).join('');
  return `rgb(${clamp(parseInt(c.substr(0,2),16)+amt,0,255)},${clamp(parseInt(c.substr(2,2),16)+amt,0,255)},${clamp(parseInt(c.substr(4,2),16)+amt,0,255)})`;
}

function up(id){ return G.upgrades[id]||0; }
function strMul(){ return G.char.str * (1+0.25*up('force')) * (G.giantT>0?3:1); }
function spdMul(){ return G.char.speed * (1+0.20*up('speed')); }
function dmgTakenMul(){ return Math.pow(0.7, up('armor')); }

function updatePlayer(){
  if(G.dead) return;
  const sp = 3.5*spdMul();
  if(G.hurtTimer>0)G.hurtTimer--; if(G.invuln>0)G.invuln--;
  if(G.comboTimer>0)G.comboTimer--; else G.combo=0;
  if(G.invincT>0)G.invincT--; if(G.giantT>0)G.giantT--; if(G.minionT>0)G.minionT--;

  if(up('roll')>0 && !G.rolling && G.onGround){
    if(consume('roll_left')){ G.rolling=true; G.rollTimer=22; G.facing=-1; G.invuln=22; }
    else if(consume('roll_right')){ G.rolling=true; G.rollTimer=22; G.facing=1; G.invuln=22; }
  }
  if(G.rolling){ G.rollTimer--; G.px += G.facing*8; if(G.rollTimer<=0)G.rolling=false; }

  let mvx=0,mvy=0;
  if(!G.rolling && G.atkTimer<=0){
    if(keys.left){mvx=-1;G.facing=-1;} if(keys.right){mvx=1;G.facing=1;}
    if(keys.up)mvy=-1; if(keys.down)mvy=1;
  }
  G.px += mvx*sp; if(G.onGround) G.py += mvy*sp*0.7;
  G.py=clamp(G.py,FLOOR_TOP,FLOOR_BOT); 

  if(G.onGround && consume('jump')){ G.vz=-9.5; G.onGround=false; }
  if(!G.onGround){ G.pz+=G.vz; G.vz+=0.55; if(G.pz>=0){ G.pz=0; G.onGround=true; G.vz=0; } }

  if(G.atkTimer>0){ G.atkTimer--; handleAttackHit(); }
  else {
    if(consume('light')) startAttack('light');
    else if(consume('heavy')) startAttack('heavy');
    else if(consume('special')) startAttack('special');
  }
  if(consume('super') && G.super>=1) doSuper();

  // --- WAVE PROGRESSION & CAMERA LOCKING LOGIC ---
  if(enemies.length === 0 && !G.bossActive) {
      if(G.wave <= LEVELS[G.level].waves.length) {
          if(camX >= G.nextWaveCamX) {
              if(G.wave < LEVELS[G.level].waves.length) spawnWave();
              else spawnBoss();
              G.wave++;
              G.nextWaveCamX = camX + W * 0.8; // Set trigger point for the wave *after* this one
          } else {
              G.showGo = true; // Signal the player to walk right
          }
      }
  } else {
      G.showGo = false;
  }

  // If there are enemies alive, or a boss is active, LOCK the camera
  let lockCam = (enemies.length > 0 || G.bossActive);
  
  if(!lockCam) {
      camX = Math.max(camX, G.px - W*0.42); // Allow camera to advance with player
  }
  bgScroll = camX;

  // Lock player boundaries
  G.px = Math.max(G.px, camX + 20); // Cannot walk off left
  if(lockCam) {
      G.px = Math.min(G.px, camX + W - 20); // Cannot walk off right if screen is locked
  }

  if(up('shadow')>0) updateShadow();
}

function startAttack(type){
  let dur;
  if(type==='light'){ dur=16; G.combo++; G.comboTimer=46; }
  else if(type==='heavy'){ dur=26; G.combo++; G.comboTimer=46; }
  else { dur=30; G.combo++; G.comboTimer=46; }
  G.atkType=type; G.atkTimer=dur; G.atkDur=dur; G.atkHit=false;
  if(up('shadow')>0) G.shadowQueue.push({type, t:30, px:G.px, py:G.py, facing:G.facing});
}

function attackReach(){ return (G.char.reach + (G.atkType==='heavy'?16:G.atkType==='special'?26:0)) * (G.giantT>0?2.4:1); }
function attackDamage(){ let base = G.atkType==='light'?10 : G.atkType==='heavy'?18 : 24; base += G.combo*1.2; return base*strMul(); }
function handleAttackHit(){
  const f = G.atkDur - G.atkTimer; if(f<3 || f>G.atkDur*0.7) return;
  if(G.atkHit && G.atkType!=='special') return;
  const reach=attackReach(), hx = G.px + G.facing*reach*0.5, launch = (G.atkType==='heavy' && keys.up);
  for(const e of enemies){
    if(e.dead) continue;
    if(Math.abs(e.y-G.py)<46 && Math.abs(e.x-hx)<reach*0.6 + e.w*0.5 && Math.sign(e.x-G.px)===G.facing){
      hitEnemy(e, attackDamage(), launch); G.atkHit=true; gainSuper(2.5);
      if(G.atkType!=='special') break;
    }
  }
}

function hitEnemy(e, dmg, launch){
  let d = G.giantT>0 ? 99999 : dmg;
  e.hp-=d; e.hurt=8; e.stun=Math.max(e.stun, e.type==='boss'?3:12);
  e.knock=(G.facing)* (G.atkType==='heavy'?9:5) * (e.type==='boss'?0.25:1); e.x+=e.knock;
  if(launch && e.type!=='boss'){ e.vz=-8; e.z=Math.min(e.z,-1); }
  blood(e.x-camX+camX, e.y-e.h*0.5, G.atkType==='heavy'?10:6, '#ff1a4a'); sparks(e.x, e.y-e.h*0.5, e.color);
  hitstop = G.atkType==='heavy'?6: G.atkType==='special'?8:3; shake=Math.max(shake, G.atkType==='heavy'?7:4); flash=Math.max(flash,4);
  G.score+=Math.floor(d); floatText(e.x, e.y-e.h-6, Math.floor(d), G.atkType==='special'?'#ff6a00':'#fff');

function killEnemy(e, fatality){

  gainSuper(8);
  if(fatality){ e.gib=true; gibs(e.x, e.y-e.h*0.5, e.color); shake=Math.max(shake,9); flash=6; flashCol='#ff1a4a'; floatText(e.x, e.y-e.h, 'GOAL!', '#ff6a00'); }

function gainSuper(amt){ G.super=clamp(G.super + amt/100*1, 0, G.superMax); }
function takeDamage(dmg, fromX){

  G.hp -= dmg*dmgTakenMul(); G.hurtTimer=18; G.invuln=40; G.facing = fromX>G.px? 1:-1;

function doSuper(){
  const stocks = Math.floor(G.super); if(stocks<1) return; const ult = stocks>=3;

function updateShadow(){
  for(let i=G.shadowQueue.length-1;i>=0;i--){
    const s=G.shadowQueue[i]; s.t--;

function updateEnemies(){

    if(e.hurt>0)e.hurt--; if(e.frozen>0){ e.frozen--; continue; }
    if(e.stun>0){ e.stun--; e.x+=e.knock; e.knock*=0.8; if(e.vz!==undefined){ e.z+=e.vz; e.vz+=0.6; if(e.z>=0){e.z=0;e.vz=0;} } continue; }

function updateGrunt(e){

    if(b.x<camX+70 || b.x>camX+W-70 || b.t<=0){ b.state='stun'; b.stun=90; b.t=0; shake=10; sparks(b.x,b.y-40,'#ffae00'); } b.t--; }
  else if(b.state==='stun'){ if(b.stun<=0){ b.state='idle'; b.t=ri(60,110); } }
  if(b.phase===2){ if(b.t2===undefined)b.t2=0; b.t2--; if(b.t2<=0 && b.state==='idle'){ b.t2=150; shake=12; flash=5; for(let k=-1;k<=1;k+=2) b.shock.push({x:b.x, y:b.y, dir:k, life:80, r:0}); } }
  for(let i=b.shock.length-1;i>=0;i--){ const s=b.shock[i]; s.x+=s.dir*6; s.r+=2; s.life--; if(Math.abs(G.px-s.x)<26 && Math.abs(G.py-s.y)<60 && G.pz>-40){ takeDamage(14,s.x); s.life=0; } if(s.life<=0)b.shock.splice(i,1); }

function bossSinfonia(b){

  if(b.phase===1){ if(Math.abs(dx)<260) b.x += -Math.sign(dx)*1.4; else b.x += Math.sign(dx)*0.8; b.x=clamp(b.x,camX+90,camX+W-60);
    if(b.t<=0){ b.t=70; for(let a=0;a<2;a++) b.fans.push({x:b.x,y:b.y, vx:(dx>0?1:-1)*5*(a?0.7:1), vy:rand(-2,2), life:160, bounce:2}); }
  } else {

    b.cloneT--; for(const c of b.clones){ c.y=300+Math.sin(b.float+c.ox)*16; }

    if(b.cloneT<=0) b.clones=[];
  }
  for(let i=b.fans.length-1;i>=0;i--){ const f=b.fans[i]; f.x+=f.vx; f.y+=f.vy; f.life--; if((f.y<FLOOR_TOP-40||f.y>FLOOR_BOT)&&f.bounce>0){f.vy*=-1;f.bounce--;} if((f.x<camX+10||f.x>camX+W-10)&&f.bounce>0){f.vx*=-1;f.bounce--;} if(Math.abs(G.px-f.x)<20 && Math.abs(G.py-f.y)<30 && G.pz>-30){ takeDamage(12,f.x); f.life=0; } if(f.life<=0)b.fans.splice(i,1); }

function bossKurosawa(b){

  if(b.state==='idle'){ if(b.t<=0){ b.state = Math.random()<0.5?'laser':'legs'; b.t = b.state==='laser'?140:170; if(b.state==='laser'){ b.laser={x:G.px, lock:60, fire:0}; } if(b.state==='legs'){ b.legSeq=['L','R','C']; b.legStep=0; b.legT=30; } } }

function drawPlayerSprite(x, y, scale, giant, alpha, facingOverride, overrideState) {
  if(!valerioImg.complete || valerioImg.naturalWidth === 0) return; 
  
  ctx.save();
  ctx.translate(x, y);
  
  const facing = facingOverride !== undefined ? facingOverride : (G ? G.facing : 1);
  ctx.scale(facing * giant, giant);
  if(alpha !== undefined) ctx.globalAlpha = alpha;

  let fRow = 0, fCol = 2; 
  
  // Uniform 12x3 sprite sheet grid configuration
  const cols = 12; 
  const rows = 3;

  const isDead = overrideState === 'dead' || (G && G.dead);
  const isHurt = overrideState === 'hurt' || (G && G.hurtTimer > 0);
  const isAtk = overrideState === 'atk' || (G && G.atkTimer > 0);
  const isRolling = overrideState === 'roll' || (G && G.rolling);
  const isJump = overrideState === 'jump' || (G && !G.onGround);
  const isWalk = overrideState === 'walk' || (G && (keys.left || keys.right || keys.up || keys.down));

  if (isDead || isHurt) {
      fRow = 2; fCol = 6; // Hits accurate recoil frame with impact sparks
  } else if (isAtk) {
      fRow = 2; 
      const atkType = G ? G.atkType : 'light'; 
      const p = (G && G.atkDur > 0) ? (1 - G.atkTimer / G.atkDur) : ((Math.floor(time/5)%3)/3);
      
      if (atkType === 'light') {
          fCol = Math.min(2, Math.floor(p * 3)); // Columns 0, 1, 2 (Punches)
      } else if (atkType === 'heavy') {
          fCol = 3 + Math.min(1, Math.floor(p * 2)); // Columns 3, 4 (Kicks)
      } else {
          fCol = 5; // Column 5 (Palm Strike Open-hand Pose) for Special Attack
      }
  } else if (isRolling) {
      fRow = 1; fCol = 6 + (Math.floor(time / 4) % 5); // Columns 6 to 10 (Fast Dash Run Cycle)
  } else if (isJump) {
      fRow = 1; fCol = 8; // Mid-stride dynamic leap pose for air movement
  } else if (isWalk) {
      fRow = 0; fCol = 4 + (Math.floor(time / 6) % 6); // Columns 4 to 9 (Standard Jog Loop)
  } else {
      fRow = 0; fCol = 2; // Column 2 (Perfect Profile Standing Idle)
  }

  const fw = valerioImg.naturalWidth / cols;
  const fh = valerioImg.naturalHeight / rows;

  const targetHeight = 150 * scale; 
  const spriteScale = targetHeight / fh;
  ctx.scale(spriteScale, spriteScale);
  
  const crop = 1.5;

  ctx.drawImage(
    valerioImg, 
    fCol * fw + crop, fRow * fh + crop, 
    fw - crop*2, fh - crop*2, 
    -fw/2, -fh * 0.90, 
    fw, fh
  );
  
  ctx.restore();
}

function drawSinfonia(b,x,y){
  if(b.phase===2 && b.clones.length){
    for(let i=0;i<b.clones.length;i++){ const c=b.clones[i], real=c.glitch; ctx.save(); ctx.globalAlpha = real? 1 : 0.8; if(real && Math.floor(time/3)%2===0) ctx.translate(rand(-3,3),0); drawGeisha(c.x-camX, c.y, b, real?'#ff5cd8':'#aa8cff'); ctx.restore(); }
  } else { drawGeisha(x,y,b,b.color); }
  for(const f of b.fans){ ctx.save(); ctx.translate(f.x-camX,f.y); ctx.rotate(time*0.3); ctx.fillStyle='#ff2bd6'; ctx.shadowColor='#ff2bd6'; ctx.shadowBlur=10; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,14,-0.6,0.6); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0; ctx.restore(); }
}
function drawGeisha(x,y,b,col){
  ctx.save(); ctx.translate(x,y); ctx.scale(b.facing,1); if(b.hurt>0&&Math.floor(time/2)%2===0)ctx.globalAlpha=0.6;
  const ink='#0a0010'; ctx.strokeStyle=ink; ctx.lineWidth=2.5; ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(-26,-10); ctx.lineTo(-16,-90); ctx.lineTo(16,-90); ctx.lineTo(26,-10); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle=shade(col,30); rr(-12,-118,24,26,8); ctx.fill(); ctx.stroke(); ctx.fillStyle='#fff'; ctx.fillRect(-16,-122,32,4); ctx.fillStyle='#ff2a6a'; rr(-7,-110,14,5,2); ctx.fill();
  ctx.fillStyle='#00eaff'; ctx.globalAlpha=0.5+0.3*Math.sin(time*0.2); ctx.beginPath(); ctx.ellipse(0,-6,20,8,0,0,7); ctx.fill(); ctx.globalAlpha=1; ctx.restore();
}
function drawKurosawa(b,x,y){
  ctx.save(); ctx.translate(x,y); ctx.strokeStyle=shade(b.color,-20); ctx.lineWidth=6;
  for(let i=-3;i<=3;i++){ if(i===0)continue; const lx=i*22, sign=i<0?-1:1; ctx.beginPath(); ctx.moveTo(sign*20,-60); ctx.lineTo(lx*1.6,-90+Math.abs(i)*6); ctx.lineTo(lx*2.0, 0); ctx.stroke(); }
  ctx.scale(b.facing,1); const ink='#0a0010'; ctx.strokeStyle=ink; ctx.lineWidth=3;
  ctx.fillStyle=b.color; ctx.shadowColor=b.color; ctx.shadowBlur=14; rr(-50,-110,100,70,12); ctx.fill(); ctx.shadowBlur=0; ctx.stroke();
  ctx.fillStyle='rgba(180,255,240,0.6)'; ctx.beginPath(); ctx.ellipse(0,-120,30,26,0,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ff7ab0'; ctx.beginPath(); ctx.ellipse(0,-118,18,14,0,0,7); ctx.fill(); ctx.strokeStyle='#c0457a'; ctx.lineWidth=1.5;
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(0,-118,6+i*3,0.4,2.6); ctx.stroke(); }
  if(b.state==='exposed'){ ctx.fillStyle='#ff2a2a'; ctx.shadowColor='#ff2a2a'; ctx.shadowBlur=20+10*Math.sin(time*0.5); ctx.beginPath(); ctx.arc(0,-70,16,0,7); ctx.fill(); ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-70,6,0,7); ctx.fill(); }
  ctx.restore();
  if(b.id==='kurosawa' && b.laser){
    if(b.laser.lock>0){ ctx.strokeStyle='#ff2a2a'; ctx.lineWidth=2; ctx.globalAlpha=0.4+0.4*Math.sin(time*0.6); const lx=b.laser.x-camX; ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx,H); ctx.stroke(); ctx.beginPath(); ctx.arc(lx,G.py,18,0,7); ctx.stroke(); ctx.globalAlpha=1; }
    else if(b.laser.fire<24){ const lx=b.laser.x-camX; ctx.fillStyle='rgba(255,60,60,0.85)'; ctx.shadowColor='#ff2a2a'; ctx.shadowBlur=30; ctx.fillRect(lx-16,0,32,H); ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.fillRect(lx-5,0,10,H); }
  }
  if(b.id==='kurosawa' && b.curLeg){ const lx=b.curLeg.x-camX; ctx.strokeStyle=shade(b.color,-10); ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx,FLOOR_BOT); ctx.stroke(); sparks(b.curLeg.x,FLOOR_BOT,'#ffd23c'); }
}

function drawHUD(){
  const segs=G.maxSeg, segW = Math.min(34, (W*0.4)/10); ctx.save();
  ctx.font='bold 12px Courier New'; ctx.fillStyle='#ffca9b'; ctx.fillText('STAMINA  '+G.maxSeg+'/10', 18, 22);
  for(let i=0;i<10;i++){
    const x=18+i*(segW+3), y=28;
    if(i<segs){ ctx.fillStyle = i<3? '#ff2a4a':'#ff6a00'; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=6; ctx.fillRect(x,y,segW,10); ctx.shadowBlur=0; }
    else { ctx.fillStyle='#2a1000'; ctx.fillRect(x,y,segW,10); ctx.strokeStyle='#5a3010'; ctx.strokeRect(x+0.5,y+0.5,segW,10); }
  }
  ctx.fillStyle='#220'; ctx.fillRect(18,42,segW*10+27,8);
  const hpw=(segW*10+27)*clamp(G.hp/G.hpMax,0,1);
  const hg=ctx.createLinearGradient(18,0,18+hpw,0); hg.addColorStop(0,'#ff0044'); hg.addColorStop(1,'#ffaa00');
  ctx.fillStyle=hg; ctx.fillRect(18,42,hpw,8);

  ctx.fillStyle='#ffca9b'; ctx.fillText('SUPER', 18, 72);
  for(let i=0;i<3;i++){
    const x=72+i*44, y=62; ctx.strokeStyle='#ff6a00'; ctx.lineWidth=1.5; ctx.strokeRect(x,y,40,10);
    const fill=clamp(G.super-i,0,1);
    if(fill>0){ ctx.fillStyle = fill>=1?'#ffe14a':'#ff6a00'; if(fill>=1){ctx.shadowColor='#ffe14a';ctx.shadowBlur=8;} ctx.fillRect(x,y,40*fill,10); ctx.shadowBlur=0; }
  }

  ctx.textAlign='right'; ctx.fillStyle=G.char.color; ctx.font='bold 14px Courier New'; ctx.fillText(G.char.name, W-18, 22);
  ctx.fillStyle='#fff'; ctx.font='12px Courier New'; ctx.fillText('SCORE '+G.score, W-18, 40);
  ctx.fillStyle='#ffca9b'; ctx.fillText(LEVELS[G.level].name, W-18, 56); ctx.textAlign='left';

  if(G.combo>2){ ctx.save(); ctx.font='bold 30px Courier New'; ctx.textAlign='center'; const cy=140+ (3-Math.min(3,G.comboTimer/15))*2; ctx.fillStyle='#ffe14a'; ctx.shadowColor='#ff2a6a'; ctx.shadowBlur=10; ctx.fillText(G.combo+' HIT', W/2, 130); ctx.shadowBlur=0; ctx.textAlign='left'; ctx.restore(); }
  let by=92; ctx.font='11px Courier New';
  if(G.invincT>0){ ctx.fillStyle='#ffd23c'; ctx.fillText('INVINCIBILE '+Math.ceil(G.invincT/60)+'s',18,by); by+=14; }
  if(G.giantT>0){ ctx.fillStyle='#ffaa00'; ctx.fillText('GIGANTE '+Math.ceil(G.giantT/60)+'s',18,by); by+=14; }

  const boss=enemies.find(e=>e.type==='boss');
  if(boss && !boss.dead){
    ctx.fillStyle='#ff2a6a'; ctx.font='bold 13px Courier New'; ctx.textAlign='center'; ctx.fillText(boss.name, W/2, H-46);
    ctx.fillStyle='#330010'; ctx.fillRect(W/2-220,H-40,440,14);
    const bw=440*clamp(boss.hp/boss.hpMax,0,1); const bg=ctx.createLinearGradient(W/2-220,0,W/2+220,0); bg.addColorStop(0,'#ff0044');bg.addColorStop(1,'#ffae00');
    ctx.fillStyle=bg; ctx.fillRect(W/2-220,H-40,bw,14); ctx.strokeStyle='#ff2a6a'; ctx.strokeRect(W/2-220.5,H-40.5,440,14); ctx.textAlign='left';
  } 
  
  // DRAW THE 'GO' ARROW IF READY TO PROCEED
  if (G.showGo && Math.floor(time/15)%2===0) {
      ctx.fillStyle='#39ff14'; ctx.shadowColor='#39ff14'; ctx.shadowBlur=12; 
      ctx.font='bold 36px Courier New'; ctx.textAlign='right'; 
      ctx.fillText('GO ▶', W-30, H/2); ctx.shadowBlur=0; ctx.textAlign='left';
  }

  ctx.restore();
}

function drawTitle(){
  ctx.fillStyle='#05010a'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#ff6a0022'; ctx.lineWidth=1; const gy=(time*1.5)%40;
  for(let y=gy;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(x,H*0.6);ctx.stroke();}
  ctx.textAlign='center';
  const t1='VALERIO:', t2='NEON STRIKER';
  ctx.font='bold 78px Courier New';
  for(const off of [[-3,'#ffaa00'],[3,'#ff2bd6'],[0,'#fff']]){ ctx.fillStyle=off[1]; ctx.fillText(t1, W/2+off[0]+ (off[0]?rand(-1,1):0), 160); }
  ctx.font='bold 68px Courier New';
  for(const off of [[-3,'#ff2bd6'],[3,'#ffaa00'],[0,'#ff6a00']]){ ctx.fillStyle=off[1]; ctx.fillText(t2, W/2+off[0], 230); }
  ctx.font='italic 15px Courier New'; ctx.fillStyle='#ffca9b'; ctx.fillText('"Il pallone è rotondo. Le ginocchia dei nemici, no."', W/2, 280);
  ctx.font='bold 20px Courier New'; ctx.fillStyle= Math.floor(time/20)%2? '#ffe14a':'#fff'; ctx.fillText('▶  PREMI INVIO PER SCENDERE IN CAMPO', W/2, 360);
  ctx.font='12px Courier New'; ctx.fillStyle='#ffca9b99';
  ctx.fillText('Beat \'em up roguelite • 3 livelli • 3 stili di gioco • CyberDegenerazione', W/2, 410);
  ctx.fillText('Muovi WASD/Frecce — A:Pugno  B:Calcio  C/Spazio:Salto  D:Speciale  U:Super', W/2, 432);
  ctx.fillText('Combo: A→A→B  •  Su+B alza in volo  •  Doppio-tap = Scatto (se sbloccato)', W/2, 452);
  ctx.textAlign='left';
}

function drawCharSelect(){
  ctx.fillStyle='#05010a'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.font='bold 30px Courier New'; ctx.fillStyle='#fff';
  ctx.fillText('SELEZIONA LO STILE', W/2, 60);
  const cw=280, gap=20, total=cw*3+gap*2, startX=(W-total)/2;
  for(let i=0;i<3;i++){
    const c=CHARS[i], x=startX+i*(cw+gap), y=110, h=360, sel=i===selChar;
    ctx.save(); ctx.globalAlpha=sel?1:0.6; ctx.fillStyle=sel? shade(c.color,-60):'#120800';
    rr(x,y,cw,h,10); ctx.fill(); ctx.strokeStyle=c.color; ctx.lineWidth=sel?4:2;
    if(sel){ctx.shadowColor=c.color;ctx.shadowBlur=20;} rr(x,y,cw,h,10); ctx.stroke(); ctx.shadowBlur=0;
    
    let state = sel && Math.floor(time/14)%2 ? 'atk' : 'idle';
    drawPlayerSprite(x+cw/2, y+170, 1.3, 1, 1, 1, state);

    ctx.globalAlpha=1; ctx.fillStyle=c.color; ctx.font='bold 18px Courier New'; ctx.fillText(c.name, x+cw/2, y+220);
    ctx.fillStyle='#ffca9b'; ctx.font='12px Courier New'; ctx.fillText(c.sub, x+cw/2, y+238);
    ctx.font='12px Courier New'; ctx.textAlign='left';
    const stat=(label,val,sy)=>{ ctx.fillStyle='#ffbd7f'; ctx.fillText(label,x+20,sy); ctx.fillStyle='#ffe14a'; ctx.fillText('★'.repeat(val)+'☆'.repeat(5-val), x+110, sy); };
    const forceS=Math.round(c.str*3.3), spdS=Math.round(c.speed*3.3);
    stat('POTENZA', clamp(forceS,1,5), y+270); stat('VELOCITÀ', clamp(spdS,1,5), y+290);
    ctx.fillStyle='#ffbd7f'; ctx.fillText('RESISTENZA', x+20, y+310); ctx.fillStyle='#fff'; ctx.fillText(c.vita, x+110,y+310);
    ctx.fillStyle='#ffebcf'; ctx.font='11px Courier New'; ctx.textAlign='center'; wrapText(c.desc, x+cw/2, y+334, cw-30, 14);
    ctx.restore(); ctx.textAlign='center';
  }
  ctx.fillStyle='#fff'; ctx.font='14px Courier New'; ctx.fillText('◀ ▶ / A D per scegliere  •  INVIO per confermare', W/2, H-26); ctx.textAlign='left';
}
function wrapText(text,x,y,maxW,lh){
  const words=text.split(' '); let line='', yy=y;
  for(const w of words){ if(ctx.measureText(line+w).width>maxW){ ctx.fillText(line,x,yy); line=w+' '; yy+=lh; } else line+=w+' '; }
  ctx.fillText(line,x,yy);
}

function drawUpgradeScreen(){
  ctx.fillStyle='rgba(20,5,0,0.85)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.font='bold 34px Courier New'; ctx.fillStyle='#ff2a6a'; ctx.shadowColor='#ff00aa'; ctx.shadowBlur=14; ctx.fillText('INFORTUNIO SUL CAMPO', W/2, 70); ctx.shadowBlur=0;
  ctx.font='15px Courier New'; ctx.fillStyle='#ffca9b'; ctx.fillText('Stamina Max scesa a '+G.maxSeg+'/10. Scegli il tuo potenziamento.', W/2, 100);
  const cw=270, gap=24, total=cw*3+gap*2, sx=(W-total)/2;
  for(let i=0;i<3;i++){
    const u=upgradeChoices[i], x=sx+i*(cw+gap), y=150, h=260, sel=i===selIndex;
    ctx.fillStyle=sel?'#301000':'#180800'; rr(x,y,cw,h,10); ctx.fill();
    ctx.strokeStyle=sel?'#ffe14a':'#ff6a00'; ctx.lineWidth=sel?4:2;
    if(sel){ctx.shadowColor='#ffe14a';ctx.shadowBlur=18;} rr(x,y,cw,h,10); ctx.stroke(); ctx.shadowBlur=0;
    ctx.fillStyle='#ffbd7f'; ctx.font='11px Courier New'; ctx.fillText('['+u.cat+']', x+cw/2, y+34);
    ctx.fillStyle=sel?'#ffe14a':'#fff'; ctx.font='bold 18px Courier New'; wrapText(u.name, x+cw/2, y+70, cw-30, 22);
    ctx.fillStyle='#ffebcf'; ctx.font='13px Courier New'; wrapText(u.desc, x+cw/2, y+140, cw-40, 18);
    if(G.upgrades[u.id]) { ctx.fillStyle='#ffaa00'; ctx.font='11px Courier New'; ctx.fillText('POSSEDUTO Lv.'+G.upgrades[u.id], x+cw/2, y+h-20); }
    ctx.fillStyle=sel?'#ffe14a':'#ffaa00'; ctx.font='12px Courier New'; ctx.fillText('('+(i+1)+')', x+cw/2, y+h-40);
  }
  ctx.fillStyle='#fff'; ctx.font='14px Courier New'; ctx.fillText('◀ ▶ scegli  •  INVIO/1-2-3 conferma — poi TORNA IN CAMPO', W/2, H-30); ctx.textAlign='left';
}

function drawGameOver(win){
  ctx.fillStyle= win? 'rgba(0,10,20,0.85)':'rgba(20,0,6,0.88)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.font='bold 60px Courier New';
  if(win){ ctx.fillStyle='#39ff14'; ctx.shadowColor='#39ff14'; ctx.shadowBlur=20; ctx.fillText('CAMPIONE DEL MONDO', W/2, 180); }
  else { ctx.fillStyle='#ff2a4a'; ctx.shadowColor='#ff0044'; ctx.shadowBlur=20; ctx.fillText('CARTELLINO ROSSO', W/2, 180); }
  ctx.shadowBlur=0; ctx.font='18px Courier New'; ctx.fillStyle='#ffca9b';
  ctx.fillText(win?'Hai espugnato Kurosawa. Sei la leggenda assoluta.':'Game Over. L\'età e gli infortuni ti hanno fermato.', W/2, 230);
  ctx.fillStyle='#fff'; ctx.font='20px Courier New'; ctx.fillText('SCORE FINALE: '+G.score, W/2, 290);
  ctx.fillStyle='#ffe14a'; ctx.font='15px Courier New'; ctx.fillText('Avversari stesi: '+G.kills+'   •   Stamina residua: '+G.maxSeg, W/2, 320);
  ctx.font='bold 18px Courier New'; ctx.fillStyle=Math.floor(time/20)%2?'#fff':'#ffaa00'; ctx.fillText('▶ INVIO per tornare al menu', W/2, 400); ctx.textAlign='left';
}

function drawBanner(){
  if(bannerT<=0) return; const a=clamp(bannerT/30,0,1)*clamp((180-bannerT)/20,0,1);
  ctx.save(); ctx.globalAlpha=Math.min(1,a+0.2); ctx.textAlign='center'; ctx.font='bold 44px Courier New';
  ctx.fillStyle = bannerTxt==='WARNING'? '#ff2a4a':'#fff'; ctx.shadowColor='#ff00aa'; ctx.shadowBlur=16; ctx.fillText(bannerTxt, W/2, H/2-10);
  ctx.font='bold 22px Courier New'; ctx.fillStyle='#ffaa00'; ctx.shadowBlur=8; ctx.fillText(bannerSub, W/2, H/2+24); ctx.restore(); ctx.textAlign='left';
}

function triggerDegeneration(){
  G.maxSeg -= 1; if(G.maxSeg<=0){ state='GAMEOVER'; G.win=false; return; }
  upgradeChoices=[]; const pool=UPGRADES.slice();
  for(let i=pool.length-1;i>0;i--){ const j=ri(0,i); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  upgradeChoices=pool.slice(0,3); selIndex=0; state='UPGRADE'; glitch=20; clearPressed();
}
function applyUpgrade(u){
  G.upgrades[u.id]=(G.upgrades[u.id]||0)+1;
  if(u.id==='heal'){ G.maxSeg=Math.min(10,G.maxSeg+1); } if(u.id==='invinc'){ G.invincT=30*60; } if(u.id==='giant'){ G.giantT=30*60; }
  G.hpMax = Math.round(G.char.baseHp * (0.55 + 0.45*G.maxSeg/10)); G.hp = G.hpMax; G.dead=false; G.invuln=70; G.hurtTimer=0;
  shake=14; flash=8; flashCol=G.char.color; glitch=18;
  for(const e of enemies){ if(e.dead)continue; if(dist(e.x,e.y,G.px,G.py)<200){ e.x+=Math.sign(e.x-G.px)*70; e.stun=Math.max(e.stun,40); e.hp-=20*strMul(); if(e.hp<=0)killEnemy(e,false); } }
  for(let i=0;i<40;i++) particles.push({x:G.px,y:G.py-30,vx:rand(-9,9),vy:rand(-10,2),g:0.3,life:rand(20,40),col:G.char.color,sz:rand(2,6),t:'spark'});
  state='PLAYING'; clearPressed();
}

function update(){
  time++; if(bannerT>0)bannerT--; if(shake>0)shake*=0.86; if(flash>0)flash--; if(glitch>0)glitch--;
  if(state==='TITLE'){ if(consume('enter')){ state='CHARSELECT'; selChar=0; } return; }
  if(state==='CHARSELECT'){ if(consume('left'))selChar=(selChar+2)%3; if(consume('right'))selChar=(selChar+1)%3; if(consume('enter')){ newRun(selChar); state='PLAYING'; clearPressed(); } return; }
  if(state==='GAMEOVER'){ if(consume('enter')){ state='TITLE'; clearPressed(); } return; }
  if(state==='UPGRADE'){
    if(consume('left'))selIndex=(selIndex+2)%3; if(consume('right'))selIndex=(selIndex+1)%3;
    if(consume('1'))selIndex=0; if(consume('2'))selIndex=1; if(consume('3'))selIndex=2;
    if(consume('enter')||consume('light')) applyUpgrade(upgradeChoices[selIndex]); return;
  }
  if(state==='PLAYING'){
    if(hitstop>0){ hitstop--; updateParticles(); return; }
    if(G.dead){ updateParticles(); updateEnemies(); if(G.deathDelay>0){ G.deathDelay--; if(G.deathDelay===0) triggerDegeneration(); } return; }
    updatePlayer(); updateEnemies(); updateParticles();
    if(G.bossDeathT!==undefined){ G.bossDeathT--; if(G.bossDeathT<=0){ G.bossDeathT=undefined; if(G.level>=2){ state='GAMEOVER'; G.win=true; } else { startLevel(G.level+1); } } }
  }
}

function render(){
  ctx.save(); if(shake>0.5) ctx.translate(rand(-shake,shake), rand(-shake,shake));
  if(state==='TITLE'){ drawTitle(); ctx.restore(); return; } if(state==='CHARSELECT'){ drawCharSelect(); ctx.restore(); return; }
  drawBackground();
  const actors=[...enemies]; const drawList=actors.map(e=>({y:e.y,fn:()=> e.type==='boss'?drawBoss(e):drawGrunt(e)})); drawList.push({y:G.py, fn:drawPlayer});
  drawList.sort((a,b)=>a.y-b.y); for(const d of drawList) d.fn();
  drawParticles(); drawHUD(); drawBanner();
  if(glitch>0){ for(let i=0;i<glitch;i++){ ctx.globalAlpha=0.5; ctx.fillStyle= i%2?'#ff00aa':'#ffaa00'; ctx.fillRect(0,rand(0,H), W, rand(2,8)*0.4); } ctx.globalAlpha=1; }
  if(state==='UPGRADE') drawUpgradeScreen(); if(state==='GAMEOVER') drawGameOver(G.win);
  ctx.restore();
  if(flash>0){ ctx.globalAlpha=clamp(flash/16,0,0.6); ctx.fillStyle=flashCol; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.8); vg.addColorStop(0,'transparent'); vg.addColorStop(1,'rgba(0,0,0,0.55)'); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}
function loop(){ update(); render(); requestAnimationFrame(loop); }
loop();
</script>
