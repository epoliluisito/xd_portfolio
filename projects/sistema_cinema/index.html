<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Cinema Italia — 2026</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;background:#0c0b09">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

// ─── STYLES ──────────────────────────────────────────────────────────────────
const G = () => (
  <style>{`
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Jost:wght@200;300;400;500;600&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0c0b09;--s1:#161410;--s2:#1e1b16;
      --b1:#2c2820;--b2:#3e3830;--b3:#524c44;
      --t1:#ede8e0;--t2:#a8a098;--t3:#68625a;--t4:#3a3530;
      --gold:#c8a86c;--gold2:#8a6e3c;--gold3:#4a3c20;
      --red:#b03028;--red2:#6a1c14;
      --green:#4a8060;--blue:#4a6890;--purple:#7a50a0;
      --amber:#c87c30;
      --serif:'Cormorant Garamond',Georgia,serif;
      --sans:'Jost',sans-serif;
    }
    body{background:var(--bg);color:var(--t1);font-family:var(--sans);min-height:100vh}
    @keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    @keyframes in{from{opacity:0}to{opacity:1}}
    @keyframes glow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 12px 2px rgba(200,168,108,.18)}}
    .au{animation:up .65s ease both}
    .ai{animation:in .5s ease both}
    .tile-glow{animation:glow 2s ease-in-out infinite}
    input[type=text]{background:transparent;border:none;border-bottom:1px solid var(--b2);color:var(--t1);font-family:var(--serif);font-size:22px;font-style:italic;padding:10px 0;width:100%;outline:none;transition:border-color .3s}
    input[type=text]:focus{border-bottom-color:var(--gold)}
    input[type=text]::placeholder{color:var(--t4);font-style:italic}
    .chip{border:1px solid var(--b2);border-radius:3px;color:var(--t3);cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:300;letter-spacing:.04em;padding:9px 15px;transition:all .2s;background:transparent;text-align:left}
    .chip:hover{border-color:var(--b3);color:var(--t2)}
    .chip.on{background:var(--s2);border-color:var(--gold);color:var(--gold)}
    .btn{background:var(--gold);border:none;border-radius:3px;color:var(--bg);cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.15em;padding:14px 36px;text-transform:uppercase;transition:all .3s}
    .btn:hover{background:#dfc07c}
    .btn:disabled{background:var(--b1);color:var(--t4);cursor:default}
    .btn-g{background:var(--green);border:none;border-radius:3px;color:#fff;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.15em;padding:14px 36px;text-transform:uppercase;transition:all .3s}
    .btn-g:hover{background:#5a9070}
    .btn-o{background:transparent;border:1px solid var(--b2);border-radius:3px;color:var(--t3);cursor:pointer;font-family:var(--sans);font-size:12px;letter-spacing:.12em;padding:11px 24px;text-transform:uppercase;transition:all .2s}
    .btn-o:hover{border-color:var(--b3);color:var(--t2)}
    .lbl{color:var(--t4);font-family:var(--sans);font-size:11px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;margin-bottom:14px;display:block}
    .screen{min-height:100vh;display:flex;flex-direction:column}
    .center{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 40px}
    .wrap{max-width:540px;width:100%}
    /* Responsive pitch container */
    .pitch-wrap{max-width:min(960px, 92vw);margin:0 auto;width:100%;padding:40px clamp(24px, 4vw, 64px)}
    @media(min-width:1100px){.pitch-wrap{padding-top:48px}}
    /* Two-column layout for wide screens */
    .pitch-2col{display:grid;grid-template-columns:1fr 1fr;gap:32px}
    @media(max-width:800px){.pitch-2col{grid-template-columns:1fr}}
  `}</style>
);

// ─── SHARED UI ────────────────────────────────────────────────────────────────
const Progress = ({ step, total }) => (
  <div style={{ display: "flex", gap: 4, padding: "22px 40px 0" }}>
    {Array.from({ length: total }).map((_, i) => (
      <div key={i} style={{ flex: 1, height: 2, borderRadius: 1, background: i < step ? "var(--gold)" : "var(--b1)", transition: "background .4s" }} />
    ))}
  </div>
);

const Landmark = ({ n, label }) => (
  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 32 }}>
    <div style={{ width: 28, height: 28, borderRadius: "50%", border: "1px solid var(--gold2)", color: "var(--gold)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "var(--sans)", fontSize: 13, fontWeight: 500, flexShrink: 0 }}>{n}</div>
    <span style={{ fontFamily: "var(--sans)", fontSize: 13, letterSpacing: ".28em", textTransform: "uppercase", color: "var(--t4)" }}>{label}</span>
  </div>
);

const EndButtons = ({ onRestart, onPitch }) => (
  <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center", marginTop: 8 }}>
    <button className="btn" onClick={onPitch}>Vedi la proposta →</button>
    <button className="btn-o" onClick={onRestart}>Torna all'inizio</button>
    <button className="btn-o" onClick={() => { try { window.close(); } catch(e){} setTimeout(() => alert("Puoi chiudere questa scheda / finestra."), 100); }}>Chiudi</button>
  </div>
);

// ─── SCREEN 0: INTRO ─────────────────────────────────────────────────────────
const S0_Intro = ({ onStart }) => {
  const [v, setV] = useState(false);
  useEffect(() => { setTimeout(() => setV(true), 120); }, []);
  return (
    <div className="screen" style={{ background: "var(--bg)", justifyContent: "center", alignItems: "center", padding: "60px 40px", position: "relative", overflow: "hidden" }}>
      <div style={{ position: "absolute", inset: 0, opacity: .025, backgroundImage: "repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.5) 3px,rgba(255,255,255,.5) 4px)", pointerEvents: "none" }} />
      <div style={{ maxWidth: 580, textAlign: "center", opacity: v ? 1 : 0, transform: v ? "none" : "translateY(20px)", transition: "all 1s ease" }}>
        <div style={{ fontFamily: "var(--sans)", fontSize: 13, letterSpacing: ".3em", color: "var(--t4)", textTransform: "uppercase", marginBottom: 36 }}>Sistema Cinema Italia · Simulazione 2026</div>
        <h1 style={{ fontFamily: "var(--serif)", fontSize: "clamp(38px,6vw,58px)", fontWeight: 300, lineHeight: 1.15, color: "var(--t1)", marginBottom: 28 }}>
          Il tuo film può succedere.<br /><em style={{ color: "var(--gold)" }}>Vediamo se — e come.</em>
        </h1>
        <p style={{ fontFamily: "var(--sans)", fontSize: 14, fontWeight: 300, color: "var(--t2)", lineHeight: 1.85, marginBottom: 18, maxWidth: 440, margin: "0 auto 18px" }}>
          Questa è una simulazione — non un prodotto finito. È una dimostrazione concreta di cosa succederebbe se il sistema del cinema italiano fosse mappato, reso leggibile, e messo nelle mani dell'autore fin dall'inizio.
        </p>
        <p style={{ fontFamily: "var(--sans)", fontSize: 13, fontWeight: 300, color: "var(--t3)", lineHeight: 1.8, marginBottom: 52, fontStyle: "italic" }}>
          I dati sono reali. Gli ostacoli sono documentati. Le possibilità esistono — ma sono quasi sempre invisibili a chi non conosce già il sistema dall'interno.
        </p>
        <button className="btn" onClick={onStart}>Cominciamo →</button>
        <div style={{ marginTop: 40, paddingTop: 24, borderTop: "1px solid var(--b1)", fontFamily: "var(--sans)", fontSize: 13, color: "var(--t4)" }}>
          Due percorsi disponibili: <span style={{ color: "var(--gold)" }}>Ho una sceneggiatura</span> · <span style={{ color: "var(--green)" }}>Ho un'idea</span>
        </div>
      </div>
    </div>
  );
};

// ─── SCREEN 1: CHI SEI ───────────────────────────────────────────────────────
const S1_ChiSei = ({ d, setD, onNext }) => {
  const [v, setV] = useState(false);
  useEffect(() => { setTimeout(() => setV(true), 80); }, []);
  const ruoli = [
    { id: "autore_regista", label: "Autore / Regista" },
    { id: "autore", label: "Autore (cerca un regista)" },
    { id: "autore_produttore", label: "Autore / Produttore" },
    { id: "regista", label: "Regista (non autore)" },
    { id: "produttore", label: "Produttore" },
  ];
  const ok = d.nome?.trim() && d.ruolo;
  return (
    <div className="screen" style={{ background: "var(--bg)" }}>
      <Progress step={1} total={6} />
      <div className="center">
        <div className="wrap" style={{ opacity: v ? 1 : 0, transform: v ? "none" : "translateY(18px)", transition: "all .65s ease" }}>
          <Landmark n="1" label="Chi sei" />
          <h2 style={{ fontFamily: "var(--serif)", fontSize: 38, fontWeight: 300, lineHeight: 1.25, marginBottom: 12 }}>Prima di tutto,<br /><em>presentiamoci.</em></h2>
          <p style={{ fontFamily: "var(--sans)", fontSize: 13, color: "var(--t3)", lineHeight: 1.75, marginBottom: 44, fontWeight: 300 }}>Non ti giudichiamo. Mappiamo.</p>
          <div style={{ marginBottom: 36 }}>
            <span className="lbl">Il tuo nome</span>
            <input type="text" placeholder="Come ti chiami?" value={d.nome || ""} onChange={e => setD({ ...d, nome: e.target.value })} onKeyDown={e => e.key === "Enter" && ok && onNext()} />
          </div>
          <div style={{ marginBottom: 48 }}>
            <span className="lbl">Il tuo ruolo in questo progetto</span>
            <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
              {ruoli.map(r => <button key={r.id} className={`chip ${d.ruolo === r.id ? "on" : ""}`} onClick={() => setD({ ...d, ruolo: r.id })}>{r.label}</button>)}
            </div>
          </div>
          <button className="btn" disabled={!ok} onClick={onNext}>Continua →</button>
        </div>
      </div>
    </div>
  );
};

// ─── SCREEN 2: IL PROGETTO (FORK) ────────────────────────────────────────────
const S2_Progetto = ({ d, setD, onSceneggiatura, onIdea }) => {
  const [v, setV] = useState(false);
  useEffect(() => { setTimeout(() => setV(true), 80); }, []);
  const stadi = [
    { id: "sceneggiatura", label: "Ho una sceneggiatura — cerco finanziamento", path: "screen" },
    { id: "sviluppo", label: "Sviluppo avanzato — ho già un produttore", path: "screen" },
    { id: "idea", label: "Ho un'idea o un soggetto — voglio svilupparla", path: "idea" },
    { id: "trattamento", label: "Ho un trattamento — sono in fase di sviluppo", path: "idea" },
  ];
  const selected = stadi.find(s => s.id === d.stadio);
  const canGoScreen = d.titolo?.trim() && (d.stadio === "sceneggiatura" || d.stadio === "sviluppo");
  const canGoIdea = d.titolo?.trim() && (d.stadio === "idea" || d.stadio === "trattamento");

  return (
    <div className="screen" style={{ background: "var(--bg)" }}>
      <Progress step={2} total={6} />
      <div className="center">
        <div className="wrap" style={{ opacity: v ? 1 : 0, transform: v ? "none" : "translateY(18px)", transition: "all .65s ease" }}>
          <Landmark n="2" label="Il progetto" />
          <h2 style={{ fontFamily: "var(--serif)", fontSize: 38, fontWeight: 300, lineHeight: 1.25, marginBottom: 12 }}>Parlami del film.<br /><em style={{ color: "var(--gold)" }}>Dove sei nel processo?</em></h2>
          <p style={{ fontFamily: "var(--sans)", fontSize: 13, color: "var(--t3)", lineHeight: 1.75, marginBottom: 44, fontWeight: 300 }}>Il titolo e lo stadio di sviluppo aprono due percorsi diversi — entrambi reali, entrambi navigabili.</p>
          <div style={{ marginBottom: 36 }}>
            <span className="lbl">Titolo del progetto</span>
            <input type="text" placeholder="Anche provvisorio" value={d.titolo || ""} onChange={e => setD({ ...d, titolo: e.target.value })} />
          </div>
          <div style={{ marginBottom: 44 }}>
            <span className="lbl">A che punto sei?</span>
            <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
              {stadi.map(s => (
                <button key={s.id} className={`chip ${d.stadio === s.id ? "on" : ""}`}
                  style={{ borderLeft: s.path === "idea" ? "2px solid var(--green)" : s.path === "screen" ? "2px solid var(--gold)" : undefined }}
                  onClick={() => setD({ ...d, stadio: s.id })}>
                  {s.label}
                </button>
              ))}
            </div>
            {selected && (
              <div style={{ marginTop: 10, fontSize: 13, color: selected.path === "idea" ? "var(--green)" : "var(--gold)", fontStyle: "italic" }}>
                {selected.path === "idea" ? "→ Percorso: sviluppo dell'idea" : "→ Percorso: mappa di finanziamento"}
              </div>
            )}
          </div>
          {canGoScreen && <button className="btn" onClick={onSceneggiatura}>Mappa di finanziamento →</button>}
          {canGoIdea && <button className="btn-g" onClick={onIdea}>Sviluppo dell'idea →</button>}
        </div>
      </div>
    </div>
  );
};

// ══════════════════════════════════════════════════════════════════
// PERCORSO A — SCENEGGIATURA
// ══════════════════════════════════════════════════════════════════

// ─── GENERI ──────────────────────────────────────────────────────
const GENERI_FICTION = [
  { id: "drama", label: "Drama" }, { id: "commedia", label: "Commedia" },
  { id: "thriller", label: "Thriller / Crime" }, { id: "horror", label: "Horror" },
  { id: "fantasy_sc", label: "Fantasy / Sci-Fi" }, { id: "storico", label: "Storico / Epico" },
  { id: "biografico", label: "Biografico" }, { id: "politico", label: "Politico / Sociale" },
  { id: "romantico", label: "Romantico" }, { id: "avventura", label: "Avventura / Azione" },
  { id: "sperimentale", label: "Sperimentale / Essay film" }, { id: "autobiografico", label: "Autobiografico / Personale" },
];
const GENERI_DOC = [
  { id: "doc_osservativo", label: "Osservativo" }, { id: "doc_partecipativo", label: "Partecipativo / Immersivo" },
  { id: "doc_inchiesta", label: "Inchiesta / Investigativo" }, { id: "doc_biografico", label: "Biografico / Ritratto" },
  { id: "doc_storico", label: "Storico / Archivio" }, { id: "doc_sociale", label: "Sociale / Politico" },
  { id: "doc_ambientale", label: "Ambientale / Scientifico" }, { id: "doc_musicale", label: "Musicale / Concerto" },
  { id: "doc_viaggio", label: "Viaggio / Antropologico" }, { id: "doc_essay", label: "Essay film / Riflessivo" },
  { id: "doc_animato", label: "Documentario animato" },
];
const GENERI_ANIM = [
  { id: "anim_famiglia", label: "Famiglia / Bambini" }, { id: "anim_adulti", label: "Adulti / Autoriale" },
  { id: "anim_fantasy", label: "Fantasy / Avventura" }, { id: "anim_doc", label: "Documentario animato" },
  { id: "anim_sperimentale", label: "Sperimentale / Arte" },
];

// ─── SCREEN 3A: L'OPERA ──────────────────────────────────────────
const S3_Opera = ({ d, setD, onNext }) => {
  const [v, setV] = useState(false);
  useEffect(() => { setTimeout(() => setV(true), 80); }, []);
  const formati = [
    { id: "lungometraggio", label: "Lungometraggio Fiction" }, { id: "documentario", label: "Documentario" },
    { id: "animazione", label: "Animazione" }, { id: "cortometraggio", label: "Cortometraggio" },
    { id: "serie", label: "Serie TV / Streaming" }, { id: "ibrido", label: "Opera Ibrida / Sperimentale" },
  ];
  const budget = [
    { id: "micro", label: "Micro — sotto €200k" }, { id: "basso", label: "Basso — €200k–€800k" },
    { id: "medio", label: "Medio — €800k–€2,5M" }, { id: "alto", label: "Alto — oltre €2,5M" },
  ];
  const territori = [
    { id: "italiano", label: "Mercato italiano" }, { id: "europeo", label: "Co-produzione europea" },
    { id: "internazionale", label: "Ambizione internazionale" },
  ];
  const generiList = d.formato === "documentario" ? GENERI_DOC : d.formato === "animazione" ? GENERI_ANIM : GENERI_FICTION;
  const generi = d.generi || [];
  const toggleGenere = id => { const next = generi.includes(id) ? generi.filter(x => x !== id) : [...generi, id]; setD({ ...d, generi: next }); };
  const setFormato = id => setD({ ...d, formato: id, generi: [] });
  const ok = d.formato && generi.length > 0 && d.budget && d.territorio;
  return (
    <div className="screen" style={{ background: "var(--bg)" }}>
      <Progress step={3} total={6} />
      <div className="center">
        <div className="wrap" style={{ opacity: v ? 1 : 0, transform: v ? "none" : "translateY(18px)", transition: "all .65s ease" }}>
          <Landmark n="3" label="L'opera" />
          <h2 style={{ fontFamily: "var(--serif)", fontSize: 38, fontWeight: 300, lineHeight: 1.25, marginBottom: 12 }}>Non la storia.<br /><em>Il perimetro in cui esiste.</em></h2>
          <p style={{ fontFamily: "var(--sans)", fontSize: 13, color: "var(--t3)", lineHeight: 1.75, marginBottom: 44, fontWeight: 300 }}>Formato, genere, scala e ambizione territoriale definiscono quali strumenti esistono — e quali si escludono.</p>
          <div style={{ marginBottom: 28 }}>
            <span className="lbl">Formato</span>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
              {formati.map(f => <button key={f.id} className={`chip ${d.formato === f.id ? "on" : ""}`} onClick={() => setFormato(f.id)}>{f.label}</button>)}
            </div>
          </div>
          {d.formato && (
            <div style={{ marginBottom: 28, animation: "up .4s ease both" }}>
              <span className="lbl">{d.formato === "documentario" ? "Tipologia documentario" : "Genere"} <span style={{ fontSize: 13, marginLeft: 8, color: "var(--t4)", textTransform: "none", letterSpacing: 0 }}>— più di uno possibile</span></span>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
                {generiList.map(g => <button key={g.id} className={`chip ${generi.includes(g.id) ? "on" : ""}`} onClick={() => toggleGenere(g.id)}>{g.label}</button>)}
              </div>
            </div>
          )}
          <div style={{ marginBottom: 28 }}>
            <span className="lbl">Fascia di budget</span>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
              {budget.map(b => <button key={b.id} className={`chip ${d.budget === b.id ? "on" : ""}`} onClick={() => setD({ ...d, budget: b.id })}>{b.label}</button>)}
            </div>
          </div>
          <div style={{ marginBottom: 48 }}>
            <span className="lbl">Ambizione territoriale</span>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
              {territori.map(t => <button key={t.id} className={`chip ${d.territorio === t.id ? "on" : ""}`} onClick={() => setD({ ...d, territorio: t.id })}>{t.label}</button>)}
            </div>
          </div>
          <button className="btn" disabled={!ok} onClick={onNext}>Continua →</button>
        </div>
      </div>
    </div>
  );
};

// ─── SCREEN 4A: IL CONTESTO ──────────────────────────────────────
const S4_Contesto = ({ d, setD, onNext }) => {
  const [v, setV] = useState(false);
  useEffect(() => { setTimeout(() => setV(true), 80); }, []);
  const ok = d.esperienza && d.produzione && d.regione;
  return (
    <div className="screen" style={{ background: "var(--bg)" }}>
      <Progress step={4} total={6} />
      <div className="center">
        <div className="wrap" style={{ opacity: v ? 1 : 0, transform: v ? "none" : "translateY(18px)", transition: "all .65s ease" }}>
          <Landmark n="4" label="Il tuo contesto" />
          <h2 style={{ fontFamily: "var(--serif)", fontSize: 38, fontWeight: 300, lineHeight: 1.25, marginBottom: 12 }}>Non ti giudichiamo.<br /><em>Mappiamo.</em></h2>
          <p style={{ fontFamily: "var(--sans)", fontSize: 13, color: "var(--t3)", lineHeight: 1.75, marginBottom: 44, fontWeight: 300 }}>Queste informazioni cambiano radicalmente quali porte si aprono — non la qualità del tuo film, ma la struttura del sistema intorno a te.</p>
          <div style={{ marginBottom: 28 }}>
            <span className="lbl">Film prodotti in precedenza</span>
            <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
              {[{ id: "primo", label: "Nessuno — questo è il mio primo" }, { id: "secondo_terzo", label: "Uno o due — sono alla seconda o terza opera" }, { id: "filmografia", label: "Tre o più — ho una filmografia" }].map(e => <button key={e.id} className={`chip ${d.esperienza === e.id ? "on" : ""}`} onClick={() => setD({ ...d, esperienza: e.id })}>{e.label}</button>)}
            </div>
          </div>
          <div style={{ marginBottom: 28 }}>
            <span className="lbl">Casa di produzione già coinvolta?</span>
            <div style={{ display: "flex", gap: 7 }}>
              {["Sì", "In trattativa", "No"].map(val => <button key={val} className={`chip ${d.produzione === val ? "on" : ""}`} onClick={() => setD({ ...d, produzione: val })}>{val}</button>)}
            </div>
          </div>
          <div style={{ marginBottom: 48 }}>
            <span className="lbl">Sei in una regione con film commission attiva?</span>
            <p style={{ fontSize: 13, color: "var(--t4)", marginBottom: 10, lineHeight: 1.6 }}>Es. Emilia-Romagna, Lazio, Piemonte, Toscana, FVG, Campania, Alto Adige</p>
            <div style={{ display: "flex", gap: 7 }}>
              {["Sì", "Non so", "No"].map(val => <button key={val} className={`chip ${d.regione === val ? "on" : ""}`} onClick={() => setD({ ...d, regione: val })}>{val}</button>)}
            </div>
          </div>
          <button className="btn" disabled={!ok} onClick={onNext}>Mostrami il panorama →</button>
        </div>
      </div>
    </div>
  );
};

// ─── SCREEN 5A: TRANSIZIONE ──────────────────────────────────────
const S5_Trans = ({ titolo, onDone }) => {
  const [step, setStep] = useState(0);
  const msgs = ["Leggendo il tuo profilo...", "Mappando i fondi disponibili...", "Identificando connessioni e conflitti...", "Costruendo la tua mappa..."];
  useEffect(() => {
    let i = 1;
    const t = setInterval(() => { setStep(i); i++; if (i >= msgs.length) { clearInterval(t); setTimeout(onDone, 900); } }, 750);
    return () => clearInterval(t);
  }, []);
  return (
    <div className="screen" style={{ background: "var(--bg)", alignItems: "center", justifyContent: "center" }}>
      <div style={{ textAlign: "center" }}>
        <div style={{ fontFamily: "var(--serif)", fontSize: 30, fontStyle: "italic", color: "var(--t2)", marginBottom: 48 }}>"{titolo}"</div>
        <div style={{ display: "inline-flex", flexDirection: "column", gap: 14 }}>
          {msgs.map((m, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, opacity: i <= step ? 1 : .2, transition: "opacity .5s" }}>
              <span style={{ color: i < step ? "var(--gold)" : "var(--t3)", fontSize: 13 }}>{i < step ? "✓" : i === step ? "→" : "·"}</span>
              <span style={{ fontFamily: "var(--sans)", fontSize: 13, color: i <= step ? "var(--t2)" : "var(--t4)", letterSpacing: ".06em" }}>{m}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

function getFontiVisibili(opera, contesto) { return FONTI.filter(f => f.visible_per(opera, contesto)); }

// ─── SCREEN 6A: IL PIANO ─────────────────────────────────────────
const S6_Piano = ({ profilo, onNext }) => {
  const { progetto, opera, contesto } = profilo;
  const [v, setV] = useState(false);
  const [selected, setSelected] = useState(new Set());
  const [expanded, setExpanded] = useState(null);
  const [done, setDone] = useState(false);
  useEffect(() => { setTimeout(() => setV(true), 100); }, []);
  const fonti = getFontiVisibili(opera, contesto);
  const escluse = new Set();
  selected.forEach(id => { const f = FONTI.find(x => x.id === id); if (f) f.esclude.forEach(e => escluse.add(e)); });
  const connesse = new Set();
  selected.forEach(id => { const f = FONTI.find(x => x.id === id); if (f) f.connette.forEach(c => { if (!selected.has(c)) connesse.add(c); }); });
  const totalePct = Math.min(100, [...selected].reduce((sum, id) => { const f = FONTI.find(x => x.id === id); return sum + (f ? f.contribuzione : 0); }, 0));
  const coperto = totalePct >= 88;
  useEffect(() => { if (coperto && !done) setTimeout(() => setDone(true), 400); }, [coperto]);
  const toggleFonte = (id) => {
    if (escluse.has(id) && !selected.has(id)) return;
    setSelected(prev => { const next = new Set(prev); if (next.has(id)) { next.delete(id); if (expanded === id) setExpanded(null); } else { next.add(id); setExpanded(id); } return next; });
  };
  const budgetLabel = { micro: "< €200k", basso: "€200k–€800k", medio: "€800k–€2,5M", alto: "> €2,5M" };
  return (
    <div className="screen" style={{ background: "var(--bg)" }}>
      <Progress step={5} total={6} />
      <div style={{ flex: 1, maxWidth: 820, margin: "0 auto", width: "100%", padding: "40px 40px", opacity: v ? 1 : 0, transition: "opacity .65s" }}>
        <div style={{ marginBottom: 28 }}>
          <Landmark n="5" label="Come può succedere" />
          <h2 style={{ fontFamily: "var(--serif)", fontSize: 36, fontWeight: 300, lineHeight: 1.2, marginBottom: 10 }}>
            <em style={{ color: "var(--gold)" }}>"{progetto?.titolo || "il tuo film"}"</em><br />può essere finanziato.
          </h2>
          <p style={{ fontFamily: "var(--sans)", fontSize: 13, color: "var(--t3)", lineHeight: 1.8, maxWidth: 580, fontWeight: 300 }}>
            Queste sono le fonti accessibili al tuo profilo. Selezionale per vedere come si connettono — e come si escludono.
          </p>
        </div>
        {/* Budget bar */}
        <div style={{ background: "var(--s1)", border: `1px solid ${coperto ? "var(--gold)" : "var(--b2)"}`, borderRadius: 6, padding: "16px 20px", marginBottom: 28, transition: "border-color .4s" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <span style={{ fontFamily: "var(--sans)", fontSize: 13, letterSpacing: ".24em", textTransform: "uppercase", color: "var(--t4)" }}>Copertura stimata · Budget {budgetLabel[opera?.budget]}</span>
            <span style={{ fontFamily: "var(--serif)", fontSize: 18, fontStyle: "italic", color: coperto ? "var(--gold)" : "var(--t2)" }}>{totalePct}%</span>
          </div>
          <div style={{ height: 6, background: "var(--b1)", borderRadius: 3, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${totalePct}%`, background: coperto ? "linear-gradient(90deg,var(--green),var(--gold))" : "linear-gradient(90deg,var(--blue),var(--green))", borderRadius: 3, transition: "width .5s ease, background .4s" }} />
          </div>
          {coperto && <div className="au" style={{ marginTop: 10, fontFamily: "var(--sans)", fontSize: 13, color: "var(--gold)", letterSpacing: ".12em" }}>✓ &nbsp;Questo piano può coprire il budget</div>}
          {!coperto && selected.size === 0 && <div style={{ marginTop: 8, fontFamily: "var(--sans)", fontSize: 13, color: "var(--t4)", fontStyle: "italic" }}>Inizia selezionando una fonte per vedere come si connette alle altre</div>}
        </div>
        {/* Griglia fonti */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(340px, 1fr))", gap: 10, marginBottom: 28 }}>
          {fonti.map(fonte => {
            const isSel = selected.has(fonte.id);
            const isEsc = escluse.has(fonte.id) && !isSel;
            const isConn = connesse.has(fonte.id);
            const isExp = expanded === fonte.id;
            const tc = TIPO_COLOR[fonte.tipo];
            const sc = STATO_COLOR[fonte.gravita];
            return (
              <div key={fonte.id} onClick={() => toggleFonte(fonte.id)} className={isConn && !isSel ? "tile-glow" : ""}
                style={{ border: `1px solid ${isSel ? "var(--gold)" : isConn ? "rgba(200,168,108,.35)" : "var(--b1)"}`, borderRadius: 5, background: isSel ? "var(--s2)" : "var(--s1)", cursor: isEsc ? "not-allowed" : "pointer", opacity: isEsc ? .35 : 1, transition: "all .25s", overflow: "hidden" }}>
                <div style={{ padding: "14px 16px 12px", borderBottom: isExp ? "1px solid var(--b1)" : "none" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
                    <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                      <span style={{ fontSize: 13, letterSpacing: ".18em", textTransform: "uppercase", padding: "2px 7px", borderRadius: 2, background: `${tc.bg}28`, color: tc.bg }}>{tc.label}</span>
                      {isConn && !isSel && <span style={{ fontSize: 13, color: "var(--gold)", letterSpacing: ".1em" }}>↔ si connette</span>}
                      {isEsc && <span style={{ fontSize: 13, color: "var(--red)", letterSpacing: ".1em" }}>✕ non compatibile</span>}
                    </div>
                    <div style={{ width: 16, height: 16, borderRadius: "50%", border: `1.5px solid ${isSel ? "var(--gold)" : "var(--b2)"}`, background: isSel ? "var(--gold)" : "transparent", flexShrink: 0, marginTop: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>
                      {isSel && <span style={{ fontSize: 13, color: "var(--bg)" }}>✓</span>}
                    </div>
                  </div>
                  <div style={{ fontFamily: "var(--sans)", fontSize: 13, color: isSel ? "var(--t1)" : "var(--t2)", marginBottom: 4, fontWeight: 400 }}>{fonte.nome}</div>
                  <div style={{ fontFamily: "var(--sans)", fontSize: 13, color: "var(--t4)", lineHeight: 1.5 }}>{fonte.desc_breve}</div>
                </div>
                {isExp && (
                  <div style={{ padding: "14px 16px 16px" }}>
                    <div style={{ marginBottom: 10 }}>
                      <div style={{ fontSize: 13, letterSpacing: ".2em", textTransform: "uppercase", color: "var(--t4)", marginBottom: 5 }}>Apporto tipico</div>
                      <div style={{ fontFamily: "var(--serif)", fontSize: 13, fontStyle: "italic", color: "var(--t2)" }}>{fonte.importo}</div>
                    </div>
                    <p style={{ fontSize: 13.5, color: "var(--t3)", lineHeight: 1.8, fontWeight: 300, marginBottom: 12 }}>{fonte.descrizione}</p>
                    <div style={{ borderLeft: `2px solid ${sc.c}`, paddingLeft: 12 }}>
                      <div style={{ fontSize: 13, letterSpacing: ".18em", textTransform: "uppercase", color: sc.c, marginBottom: 4 }}>{sc.label} · oggi</div>
                      <p style={{ fontSize: 13, color: "var(--t3)", lineHeight: 1.75, fontWeight: 300 }}>{fonte.stato}</p>
                    </div>
                    {fonte.connette.length > 0 && <div style={{ marginTop: 10, fontSize: 13, color: "var(--t4)", fontStyle: "italic" }}>Si connette con: {fonte.connette.map(id => FONTI.find(x => x.id === id)?.nome).filter(Boolean).join(" · ")}</div>}
                    {fonte.esclude.length > 0 && <div style={{ marginTop: 4, fontSize: 13, color: "#b03028", opacity: .7 }}>Esclude: {fonte.esclude.map(id => FONTI.find(x => x.id === id)?.nome).filter(Boolean).join(" · ")}</div>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
        {/* Legenda */}
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginBottom: 28 }}>
          {Object.entries(TIPO_COLOR).map(([k, v]) => (
            <div key={k} style={{ display: "flex", alignItems: "center", gap: 5 }}>
              <div style={{ width: 8, height: 8, borderRadius: 2, background: v.bg }} />
              <span style={{ fontSize: 13, color: "var(--t4)", letterSpacing: ".1em" }}>{v.label}</span>
            </div>
          ))}
        </div>
        {done && (
          <div className="au" style={{ background: "var(--s1)", border: "1px solid var(--gold)", borderRadius: 6, padding: "28px 32px", marginBottom: 16 }}>
            <div style={{ fontFamily: "var(--serif)", fontSize: 22, fontStyle: "italic", color: "var(--t1)", marginBottom: 10 }}>Hai trovato un piano che può funzionare.</div>
            <p style={{ fontSize: 13, color: "var(--t3)", lineHeight: 1.85, fontWeight: 300, marginBottom: 20 }}>
              {[...selected].map(id => FONTI.find(x => x.id === id)?.nome).filter(Boolean).join(" + ")}. Questi strumenti, nell'ordine giusto, possono portare il tuo film in produzione.
            </p>
            <button className="btn" onClick={() => onNext([...selected])}>Vai alla sintesi →</button>
          </div>
        )}
      </div>
    </div>
  );
};

              ["Titolo", <em>"{progetto?.titolo}"</em>],
              ["Formato", formatoLabel[opera?.formato]],
              ["Genere", Array.isArray(opera?.generi) ? opera.generi.map(g => g.replace(/^(doc_|anim_)/,"").replace(/_/g," ")).join(", ") : "—"],
              ["Budget", budgetLabel[opera?.budget]],
              ["Territorio", opera?.territorio],
              ["Esperienza", { primo: "Prima opera", secondo_terzo: "Seconda / Terza", filmografia: "Filmografia" }[contesto?.esperienza]],
            ].map(([k, val], i) => (
              <div key={i}>
                <div style={{ fontSize: 13, letterSpacing: ".2em", color: "var(--t4)", textTransform: "uppercase", marginBottom: 2 }}>{k}</div>
                <div style={{ fontSize: 13, color: "var(--t2)", fontFamily: typeof val === "object" ? "var(--serif)" : "var(--sans)", fontStyle: typeof val === "object" ? "italic" : "normal" }}>{val}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Consapevolezza — non prescrizione */}
        <div style={{ marginBottom: 24 }}>
          <span className="lbl">Cosa significa questo piano — in termini reali</span>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {pianoPick.includes("contributi_selettivi") && (
              <div style={{ padding: "14px 18px", background: "var(--s1)", borderLeft: "2px solid var(--green)", borderRadius: "0 4px 4px 0" }}>
                <div style={{ fontSize: 13, letterSpacing: ".14em", textTransform: "uppercase", color: "var(--green)", marginBottom: 5 }}>Contributi Selettivi MiC</div>
                <p style={{ fontSize: 13, color: "var(--t3)", lineHeight: 1.8, fontWeight: 300 }}>Valutati due volte l'anno da una commissione. I tempi medi dall'application all'erogazione: 8–14 mesi. Non sono garantiti — la selectivity rate è intorno al 15–20% dei progetti presentati. Il tuo profilo (prima opera, livello di ambizione del progetto) incide molto sulla probabilità reale.</p>
              </div>
            )}
            {pianoPick.includes("tax_credit_interno") && (
              <div style={{ padding: "14px 18px", background: "var(--s1)", borderLeft: "2px solid var(--amber)", borderRadius: "0 4px 4px 0" }}>
                <div style={{ fontSize: 13, letterSpacing: ".14em", textTransform: "uppercase", color: "var(--amber)", marginBottom: 5 }}>Tax Credit Interno (40%)</div>
                <p style={{ fontSize: 13, color: "var(--t3)", lineHeight: 1.8, fontWeight: 300 }}>Dal 2025 non è più automatico: richiede eleggibilità culturale approvata dal MiC + contratto con uno dei 20 distributori top di lista. I tempi di approvazione: 3–6 mesi dalla domanda. Il 32% dei budget cinematografici italiani nel 2023 veniva da tax credit. È lo strumento più usato — ma anche il più lento da sbloccare.</p>
              </div>
            )}
            {pianoPick.includes("mg_distributore") && (
              <div style={{ padding: "14px 18px", background: "var(--s1)", borderLeft: "2px solid var(--amber)", borderRadius: "0 4px 4px 0" }}>
                <div style={{ fontSize: 13, letterSpacing: ".14em", textTransform: "uppercase", color: "var(--amber)", marginBottom: 5 }}>Minimum Guarantee Distributore</div>
                <p style={{ fontSize: 13, color: "var(--t3)", lineHeight: 1.8, fontWeight: 300 }}>Si negozia prima della produzione — o non si negozia. Un distributore che si impegna in pre-produzione paga meno ma garantisce più stabilità. Un distributore che entra dopo vede il film e paga di più, ma quella certezza non la dai al budget. La MG sblocca il tax credit esterno. Le due cose sono collegate.</p>
              </div>
            )}
            {pianoPick.includes("creative_europe") && (
              <div style={{ padding: "14px 18px", background: "var(--s1)", borderLeft: "2px solid var(--blue)", borderRadius: "0 4px 4px 0" }}>
                <div style={{ fontSize: 13, letterSpacing: ".14em", textTransform: "uppercase", color: "var(--blue)", marginBottom: 5 }}>Creative Europe MEDIA</div>
                <p style={{ fontSize: 13, color: "var(--t3)", lineHeight: 1.8, fontWeight: 300 }}>Le call principali aprono una/due volte l'anno. Il dossier richiede: sinossi, dossier creativo, piano di sviluppo, CV produttore, piano budget. La selectivity rate europea è bassa — ma un'applicazione ben costruita ha più probabilità di un'applicazione italiana mal presentata. Il documento che scrivi per MEDIA vale per tutte le altre domande europee.</p>
              </div>
            )}
            {pianoPick.includes("eurimages") && (
              <div style={{ padding: "14px 18px", background: "var(--s1)", borderLeft: "2px solid var(--blue)", borderRadius: "0 4px 4px 0" }}>
                <div style={{ fontSize: 13, letterSpacing: ".14em", textTransform: "uppercase", color: "var(--blue)", marginBottom: 5 }}>Eurimages</div>
                <p style={{ fontSize: 13, color: "var(--t3)", lineHeight: 1.8, fontWeight: 300 }}>Richiede un partner di coproduzione in almeno un altro paese europeo. Non è un fondo a cui ci si "iscrive" — è il risultato di un accordo di coproduzione già strutturato. Prima viene il partner, poi viene Eurimages. Se non hai ancora un coproduttore europeo identificato, questo fondo è più lontano di quanto appare sul piano.</p>
              </div>
            )}
            {pianoPick.includes("film_commission") && (
              <div style={{ padding: "14px 18px", background: "var(--s1)", borderLeft: "2px solid #8a6e3c", borderRadius: "0 4px 4px 0" }}>
                <div style={{ fontSize: 13, letterSpacing: ".14em", textTransform: "uppercase", color: "#8a6e3c", marginBottom: 5 }}>Film Commission Regionale</div>
                <p style={{ fontSize: 13, color: "var(--t3)", lineHeight: 1.8, fontWeight: 300 }}>La condizione è che una percentuale delle spese di produzione (solitamente 100–150% del contributo ricevuto) venga spesa nel territorio della regione. Questo può essere un vincolo creativo reale — influenza location, cast, crew locali. A volte si gestisce, a volte cambia il film.</p>
              </div>
            )}
            <div style={{ padding: "14px 18px", background: "var(--s2)", border: "1px solid var(--b1)", borderRadius: 4 }}>
              <p style={{ fontSize: 13, color: "var(--t3)", lineHeight: 1.8, fontWeight: 300, fontStyle: "italic" }}>
                Conoscere questi meccanismi prima della trattativa non ti toglie scelte — te ne aggiunge. Puoi scegliere consapevolmente di perseguire un piano complesso. Puoi scegliere di semplificare il film per renderlo più fattibile. Puoi scegliere di aspettare il momento giusto. Ma almeno lo scegli tu.
              </p>
            </div>
          </div>
        </div>

        {/* Preview produttori — se non ha produttore */}
        {senzaProduttore && (
          <div style={{ marginBottom: 24, border: "1px solid var(--b2)", borderRadius: 6, overflow: "hidden" }}>
            <div style={{ background: "var(--s2)", padding: "14px 20px", borderBottom: "1px solid var(--b1)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontSize: 13, letterSpacing: ".22em", textTransform: "uppercase", color: "var(--t4)", marginBottom: 3 }}>Funzione disponibile nel sistema completo</div>
                <div style={{ fontSize: 14, color: "var(--t2)" }}>Panorama produttori italiani</div>
              </div>
              <div style={{ fontSize: 13, color: "var(--t4)", border: "1px solid var(--b2)", borderRadius: 3, padding: "4px 10px", letterSpacing: ".1em" }}>COMING SOON</div>
            </div>
            <div style={{ padding: "16px 20px" }}>
              <p style={{ fontSize: 13, color: "var(--t3)", lineHeight: 1.8, fontWeight: 300, marginBottom: 14 }}>
                Non hai un produttore. Nel sistema completo questa sezione ti permetterebbe di esplorare il panorama delle case di produzione italiane — filtrate per genere, per tipo di progetto che sviluppano, per approccio (chi lavora su idee vs chi vuole solo sceneggiature finite), per track record e apertura alle opere prime.
              </p>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                {[
                  { nome: "Vivo Film", note: "Opere prime · sviluppo da idea", attivo: true },
                  { nome: "Tempesta Film", note: "Sviluppo · opera d'autore", attivo: true },
                  { nome: "BiBi Film", note: "Storica · aperta allo sviluppo", attivo: true },
                  { nome: "Indigo Film", note: "Portfolio misto · internazionale", attivo: true },
                  { nome: "Wildside", note: "Materiale più avanzato preferito", attivo: false },
                  { nome: "Colorado Film", note: "Commedia · mercato italiano", attivo: false },
                ].map((p, i) => (
                  <div key={i} style={{ padding: "10px 12px", background: "var(--s2)", borderRadius: 3, border: "1px solid var(--b1)", opacity: p.attivo ? 1 : .45 }}>
                    <div style={{ fontSize: 13, color: "var(--t1)", marginBottom: 2 }}>{p.nome}</div>
                    <div style={{ fontSize: 13, color: "var(--t4)" }}>{p.note}</div>
                    {!p.attivo && <div style={{ fontSize: 13, color: "var(--t4)", marginTop: 3, opacity: .5 }}>— dati bloccati</div>}
                  </div>
                ))}
              </div>
              <p style={{ marginTop: 12, fontSize: 13, color: "var(--t4)", fontStyle: "italic" }}>
                Il sistema completo includerebbe anche: tipi di contratti d'opzione tipici, storico dei film prodotti, approccio al primo contatto, disponibilità al co-sviluppo.
              </p>
            </div>
          </div>
        )}

        <div style={{ borderTop: "1px solid var(--b1)", margin: "36px 0" }} />
        <div style={{ fontFamily: "var(--serif)", fontSize: 22, fontStyle: "italic", color: "var(--t1)", marginBottom: 16 }}>La simulazione è conclusa.</div>
        <p style={{ fontSize: 13, color: "var(--t3)", lineHeight: 1.8, marginBottom: 28, fontWeight: 300, maxWidth: 480 }}>
          Quello che hai visto funziona su logiche approssimate. Il sistema reale — con dati aggiornati, AI addestrata sul corpus normativo italiano, e connessioni live ai bandi aperti — è quello che stiamo costruendo.
        </p>
        <EndButtons onRestart={onRestart} onPitch={onPitch} />
      </div>
    </div>
  );
};

// ─── SCREEN 3B: L'IDEA ───────────────────────────────────────────
const SI_A = ({ d, setD, chi, onNext }) => {
  const [v, setV] = useState(false);
  useEffect(() => { setTimeout(() => setV(true), 80); }, []);
  const formati = [
    { id: "lungometraggio", label: "Lungometraggio" }, { id: "documentario", label: "Documentario" },
    { id: "serie", label: "Serie" }, { id: "cortometraggio", label: "Cortometraggio" },
    { id: "animazione", label: "Animazione" },
  ];
  const generiList = d.formato === "documentario" ? GENERI_DOC : d.formato === "animazione" ? GENERI_ANIM : GENERI_FICTION;
  const generi = d.generi || [];
  const toggleGenere = id => { const next = generi.includes(id) ? generi.filter(x => x !== id) : [...generi, id]; setD({ ...d, generi: next }); };
  const setFormato = id => setD({ ...d, formato: id, generi: [] });
  const territori = [
    { id: "italiano", label: "Italiano" }, { id: "europeo", label: "Co-produzione europea" }, { id: "internazionale", label: "Internazionale" },
  ];
  const ok = d.formato && generi.length > 0 && d.territorio;
  return (
    <div className="screen" style={{ background: "var(--bg)" }}>
      <Progress step={3} total={5} />
      <div className="center">
        <div className="wrap" style={{ opacity: v ? 1 : 0, transform: v ? "none" : "translateY(18px)", transition: "all .65s ease" }}>
          <Landmark n="3" label="L'idea" />
          <h2 style={{ fontFamily: "var(--serif)", fontSize: 38, fontWeight: 300, lineHeight: 1.25, marginBottom: 12 }}>
            Che tipo di film<br /><em style={{ color: "var(--green)" }}>hai in mente?</em>
          </h2>
          <p style={{ fontFamily: "var(--sans)", fontSize: 13, color: "var(--t3)", lineHeight: 1.75, marginBottom: 44, fontWeight: 300 }}>
            Anche se l'idea è ancora fluida, il formato previsto e il genere cambiano radicalmente cosa esiste per svilupparla.
          </p>
          <div style={{ marginBottom: 28 }}>
            <span className="lbl">Formato previsto</span>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
              {formati.map(f => <button key={f.id} className={`chip ${d.formato === f.id ? "on" : ""}`} onClick={() => setFormato(f.id)}>{f.label}</button>)}
            </div>
          </div>
          {d.formato && (
            <div style={{ marginBottom: 28, animation: "up .4s ease both" }}>
              <span className="lbl">{d.formato === "documentario" ? "Tipologia" : "Genere"} <span style={{ fontSize: 13, marginLeft: 8, color: "var(--t4)", textTransform: "none", letterSpacing: 0 }}>— più di uno possibile</span></span>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
                {generiList.map(g => <button key={g.id} className={`chip ${generi.includes(g.id) ? "on" : ""}`} onClick={() => toggleGenere(g.id)}>{g.label}</button>)}
              </div>
            </div>
          )}
          <div style={{ marginBottom: 48 }}>
            <span className="lbl">Ambizione</span>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
              {territori.map(t => <button key={t.id} className={`chip ${d.territorio === t.id ? "on" : ""}`} onClick={() => setD({ ...d, territorio: t.id })}>{t.label}</button>)}
            </div>
          </div>
          <button className="btn" disabled={!ok} onClick={onNext}>Continua →</button>
        </div>
      </div>
    </div>
  );
};

// ─── SCREEN 4B: MAPPA SVILUPPO ───────────────────────────────────
const SI_B = ({ d, chi, onNext }) => {
  const [v, setV] = useState(false);
  const [selected, setSelected] = useState(new Set());
  const [expanded, setExpanded] = useState(null);
  useEffect(() => { setTimeout(() => setV(true), 100); }, []);

  const TIPO_SV_COLOR = {
    pubblico: { bg: "#4a8060", label: "Pubblico" },
    europeo: { bg: "#4a6890", label: "Europeo" },
    privato: { bg: "#8a6e3c", label: "Privato" },
    regionale: { bg: "#6a5a3a", label: "Regionale" },
  };
  const STATO_SV_COLOR = {
    ok: { c: "#4a8060", label: "Accessibile" },
    attenzione: { c: "#c87c30", label: "Da valutare" },
  };

  const toggle = (id) => {
    setSelected(prev => { const next = new Set(prev); if (next.has(id)) { next.delete(id); if (expanded === id) setExpanded(null); } else { next.add(id); setExpanded(id); } return next; });
  };
  const connesse = new Set();
  selected.forEach(id => { const f = FONTI_SVILUPPO.find(x => x.id === id); if (f) f.connette.forEach(c => { if (!selected.has(c)) connesse.add(c); }); });

  return (
    <div className="screen" style={{ background: "var(--bg)" }}>
      <Progress step={4} total={5} />
      <div style={{ flex: 1, maxWidth: 820, margin: "0 auto", width: "100%", padding: "40px 40px", opacity: v ? 1 : 0, transition: "opacity .65s" }}>
        <div style={{ marginBottom: 28 }}>
          <Landmark n="4" label="Gli strumenti per sviluppare" />
          <h2 style={{ fontFamily: "var(--serif)", fontSize: 36, fontWeight: 300, lineHeight: 1.2, marginBottom: 10 }}>
            Cosa esiste<br /><em style={{ color: "var(--green)" }}>per portare l'idea avanti.</em>
          </h2>
          <p style={{ fontFamily: "var(--sans)", fontSize: 13, color: "var(--t3)", lineHeight: 1.8, maxWidth: 580, fontWeight: 300 }}>
            Non tutti questi strumenti si usano insieme — e non tutti sono adatti a ogni profilo. Selezionali per capire come si connettono e cosa richiedono.
          </p>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(340px, 1fr))", gap: 10, marginBottom: 32 }}>
          {FONTI_SVILUPPO.map(fonte => {
            const isSel = selected.has(fonte.id);
            const isConn = connesse.has(fonte.id);
            const isExp = expanded === fonte.id;
            const tc = TIPO_SV_COLOR[fonte.tipo] || TIPO_SV_COLOR.europeo;
            const sc = STATO_SV_COLOR[fonte.gravita] || STATO_SV_COLOR.ok;
            return (
              <div key={fonte.id} onClick={() => toggle(fonte.id)} className={isConn && !isSel ? "tile-glow" : ""}
                style={{ border: `1px solid ${isSel ? "var(--green)" : isConn ? "rgba(74,128,96,.35)" : "var(--b1)"}`, borderRadius: 5, background: isSel ? "var(--s2)" : "var(--s1)", cursor: "pointer", transition: "all .25s", overflow: "hidden" }}>
                <div style={{ padding: "14px 16px 12px", borderBottom: isExp ? "1px solid var(--b1)" : "none" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>

            <div key={i} style={{ display: "grid", gridTemplateColumns: s.wk ? "80px 1fr" : "1fr", gap: "0 16px", padding: "18px 0", borderBottom: i < fase.steps.length - 1 ? "1px solid var(--b1)" : "none" }}>
              {s.wk && <div style={{ fontSize: "12px", color: fase.color, letterSpacing: ".12em", fontWeight: 500, paddingTop: "2px" }}>Sett. {s.wk}</div>}
              <div>
                <div style={{ fontSize: "15px", color: "var(--t2)", marginBottom: "6px" }}>{s.t}</div>
                <div style={{ fontSize: "14px", color: "var(--t3)", lineHeight: 1.8 }}>{s.d}</div>
              </div>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: "10px", justifyContent: step > 1 ? "space-between" : "flex-end", marginTop: "36px" }}>
          {step > 1 && <button className="btn-o" onClick={() => goStep(step - 1)}>← Fase precedente</button>}
          {step < FASI.length
            ? <button className="btn-o" onClick={() => goStep(step + 1)}>Fase successiva →</button>
            : <button className="btn" onClick={onNext}>Chi lo finanzia →</button>
          }
        </div>
      </div>
    </div>
  );
};

// APP
// ══════════════════════════════════════════════════════════════════
function App() {
  const [screen, setScreen] = useState("landing");
  const [chi, setChi] = useState({});
  const [progetto, setProgetto] = useState({});
  const [opera, setOpera] = useState({});
  const [idea, setIdea] = useState({});
  const [contesto, setContesto] = useState({});
  const [pianoPick, setPianoPick] = useState([]);
  const [sviluppoPick, setSviluppoPick] = useState([]);

  const go = s => { window.scrollTo({ top: 0, behavior: "smooth" }); setTimeout(() => setScreen(s), 80); };

  const restart = () => {
    setChi({}); setProgetto({}); setOpera({}); setIdea({});
    setContesto({}); setPianoPick([]); setSviluppoPick([]);
    go("landing");
  };

  return (
    <>
      <G />
      {screen === "landing" && (
        <S0_Landing
          onSimulation={() => go("s0")}
          onPitch={() => go("pitch")}
        />
      )}
      {screen === "s0" && <S0_Intro onStart={() => go("s1")} />}
      {screen === "s1" && <S1_ChiSei d={chi} setD={setChi} onNext={() => go("s2")} />}
      {screen === "s2" && (
        <S2_Progetto
          d={progetto} setD={setProgetto}
          onSceneggiatura={() => go("s3a")}
          onIdea={() => go("si_a")}
        />
      )}

      {/* ── PERCORSO A: SCENEGGIATURA ── */}
      {screen === "s3a" && <S3_Opera d={opera} setD={setOpera} onNext={() => go("s4a")} />}
      {screen === "s4a" && <S4_Contesto d={contesto} setD={setContesto} onNext={() => go("s5a_trans")} />}
      {screen === "s5a_trans" && <S5_Trans titolo={progetto.titolo || "Il tuo film"} onDone={() => go("s6a")} />}
      {screen === "s6a" && (
        <S6_Piano
          profilo={{ chi, progetto, opera, contesto }}
          onNext={picks => { setPianoPick(picks); go("s7a"); }}
        />
      )}
      {screen === "s7a" && (
        <S7_EndCard
          profilo={{ chi, progetto, opera, contesto }}
          pianoPick={pianoPick}
          onRestart={restart}
          onPitch={() => go("pitch")}
        />
      )}

      {/* ── PERCORSO B: IDEA ── */}
      {screen === "si_a" && <SI_A d={idea} setD={setIdea} chi={chi} onNext={() => go("si_b")} />}
      {screen === "si_b" && <SI_B d={idea} chi={chi} onNext={picks => { setSviluppoPick(picks); go("si_c"); }} />}
      {screen === "si_c" && (
        <SI_C
          d={idea} chi={chi} sviluppoPick={sviluppoPick}
          onNext={() => go("si_end")}
        />
      )}
      {screen === "si_end" && (
        <SI_End
          chi={chi} progetto={progetto} idea={idea}
          sviluppoPick={sviluppoPick}
          onRestart={restart}
          onPitch={() => go("pitch")}
        />
      )}

      {/* ── PITCH SECTION — 5 schermi ── */}
      {screen === "pitch"  && <S_Bridge onNext={() => go("p1")} onBack={() => go("landing")} />}
      {screen === "p1"     && <S_P1 onNext={() => go("p2")} onBack={() => go("pitch")} />}
      {screen === "p2"     && <S_P2 onNext={() => go("p3")} onBack={() => go("p1")} />}
      {screen === "p3"     && <S_P3 onNext={() => go("p4")} onBack={() => go("p2")} />}
      {screen === "p4"     && <S_P4 onNext={() => go("p5")} onBack={() => go("p3")} />}
      {screen === "p5"     && <S_P5 onRestart={restart} onBack={() => go("p4")} onSimulation={() => go("s0")} />}
    </>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
