<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Retro Art Gallery - Grand Exhibition</title>
<link href="data:," rel="icon"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    overflow: hidden; 
    background: #030305; 
    font-family: 'DM Mono', monospace; 
    color: #fff; 
    user-select: none;
    -webkit-user-select: none;
  }
  
  /* Canvas Wrapper & CRT Screen Styling */
  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  canvas { 
    display: block; 
    max-width: 100%; 
    max-height: 100%;
    aspect-ratio: 16/9;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* Retro Scanline CRT Overlay */
  #crt-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    background-size: 100% 4px, 6px 100%;
    opacity: 0.85;
    z-index: 5;
  }
  
  /* ---- UI Overlays ---- */
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  
  /* User Guide Panel */
  #guide-panel {
    position: absolute; top: 20px; left: 20px;
    background: rgba(4,6,10,0.85); border: 2px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px); padding: 18px; width: 260px;
  }
  #guide-panel h3 { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; margin-bottom: 14px; color: #e8c547; font-weight: 400; }
  .ctrl-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .ctrl-key { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); font-size: 9px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; }
  .ctrl-desc { color: rgba(255,255,255,0.6); font-size: 10px; letter-spacing: 0.1em; line-height: 1.4; }

  /* Map Panel */
  #map-panel {
    position: absolute; top: 20px; right: 20px;
    background: rgba(4,6,10,0.85); border: 2px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px); padding: 18px; width: 220px; text-align: center;
  }
  #map-panel h3 { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 12px; font-weight: 400; }
  #minimap-info { font-size: 10px; color: #e8c547; text-transform: uppercase; margin-top: 8px; font-weight: bold; }

  /* Proximity Prompt */
  #proximity-prompt {
    position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
    color: #e8c547; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
    background: rgba(6,8,16,0.95); border: 2px solid #e8c547;
    padding: 12px 24px; backdrop-filter: blur(12px); border-radius: 4px;
    opacity: 0; transition: opacity 0.3s ease;
    z-index: 100;
  }
  #proximity-prompt.visible { opacity: 1; }

  /* Loading / Entry Screen */
  #loading {
    position: fixed; inset: 0; background: #030408; z-index: 300;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s ease; pointer-events: all;
  }
  #loading h1 { font-size: 14px; letter-spacing: 0.4em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 20px; font-weight: 400; text-align: center; }
  #load-bar { width: 240px; height: 1px; background: rgba(255,255,255,0.1); position: relative; margin-bottom: 30px; }
  #load-fill { position: absolute; top: 0; left: 0; height: 100%; background: #e8c547; width: 0%; transition: width 0.3s; }
  #enter-btn {
    display: none; background: transparent; border: 1px solid rgba(232,197,71,0.5);
    color: rgba(232,197,71,0.9); font-family: inherit; font-size: 11px; letter-spacing: 0.3em;
    padding: 12px 32px; cursor: pointer; text-transform: uppercase; transition: all 0.3s;
  }
  #enter-btn:hover { background: rgba(232,197,71,0.1); border-color: #e8c547; color: #e8c547; }

  /* Video Overlay Modal (2-Column Retro Layout) */
  #overlay {
    position: fixed; inset: 0; background: rgba(2,3,6,0.96); backdrop-filter: blur(14px);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
  }
  #overlay.visible { opacity: 1; pointer-events: all; }
  #overlay-panel {
    width: 1100px; max-width: 95vw; max-height: 90vh; background: #080a0e;
    border: 2px solid rgba(255,255,255,0.1); padding: 40px; display: flex; flex-direction: row; gap: 40px;
    box-shadow: 0 40px 100px rgba(0,0,0,0.9); overflow-y: auto; position: relative; border-radius: 12px;
  }
  #overlay-close {
    position: absolute; top: 20px; right: 20px; background: transparent; border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.6); font-family: inherit; font-size: 10px; letter-spacing: 0.2em; padding: 6px 12px; cursor: pointer; z-index: 10;
  }
  #overlay-close:hover { color: #fff; border-color: #fff; }
  
  #overlay-info {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
  }
  #overlay-brand { color: #e8c547; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 12px; }
  #overlay-title { font-size: 28px; font-weight: 400; margin-bottom: 24px; letter-spacing: 0.05em; line-height: 1.2; }
  #overlay-desc { color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
  
  #overlay-video-container { 
    flex: 2; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(255,255,255,0.05);
  }
  #overlay-video { width: 100%; height: auto; max-height: 100%; object-fit: contain; }

  /* Mobile On-Screen Controls */
  #mobile-controls {
    position: fixed; bottom: 20px; left: 0; right: 0; height: 130px;
    display: none; justify-content: space-between; align-items: center;
    padding: 0 40px; pointer-events: none; z-index: 150;
  }
  .mobile-dpad {
    display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 4px;
    pointer-events: auto;
  }
  .dpad-btn {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 14px; font-family: inherit; display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 6px; user-select: none; -webkit-user-select: none;
  }
  .dpad-btn:active { background: rgba(232,197,71,0.3); border-color: #e8c547; }
  #mobile-action-group {
    display: flex; gap: 16px; pointer-events: auto;
  }
  .action-btn {
    width: 60px; height: 60px; border-radius: 50%; background: rgba(232,197,71,0.2);
    border: 2px solid #e8c547; color: #e8c547; font-family: inherit; font-size: 18px; font-weight: bold;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .action-btn:active { background: rgba(232,197,71,0.5); }

  @media (max-width: 900px) {
    #overlay-panel { flex-direction: column; padding: 24px; gap: 24px; }
    #overlay-info, #overlay-video-container { width: 100%; flex: auto; }
    #guide-panel { display: none; }
    #mobile-controls { display: flex; }
  }
</style>
</head>
<body>

<div id="loading">
  <h1 id="load-text">Waking Pixel Art Gallery...</h1>
  <div id="load-bar"><div id="load-fill"></div></div>
  <button id="enter-btn">Enter Exhibition</button>
</div>

<div id="game-container">
  <canvas id="gameCanvas" width="1280" height="720"></canvas>
  <div id="crt-overlay"></div>
</div>

<div id="ui">
  <!-- Controls Panel -->
  <div id="guide-panel">
    <h3>Gallery Guide</h3>
    <div class="ctrl-row"><span class="ctrl-key">W A S D</span><span class="ctrl-desc">Walk Around</span></div>
    <div class="ctrl-row"><span class="ctrl-key">← ↑ → ↓</span><span class="ctrl-desc">Walk Alternative</span></div>
    <div class="ctrl-row"><span class="ctrl-key">E</span><span class="ctrl-desc">Interact with Screen</span></div>
    <div class="ctrl-row"><span class="ctrl-key">ESC</span><span class="ctrl-desc">Exit Video Screen</span></div>
  </div>

  <!-- Map HUD -->
  <div id="map-panel">
    <h3>Exhibition Wings</h3>
    <canvas id="minimap-canvas" width="180" height="24"></canvas>
    <div id="minimap-info">ENTRANCE WING</div>
  </div>

  <!-- Proximity Alert Prompt -->
  <div id="proximity-prompt">Press [ E ] to Interact</div>
</div>

<!-- Immersive Overlay Viewer -->
<div id="overlay">
  <div id="overlay-panel">
    <button id="overlay-close">ESC / CLOSE</button>
    <div id="overlay-info">
      <div id="overlay-brand">BRAND</div>
      <h2 id="overlay-title">FILM TITLE</h2>
      <div id="overlay-desc">Description panel goes here.</div>
    </div>
    <div id="overlay-video-container">
      <video id="overlay-video" controls controlsList="nodownload"></video>
    </div>
  </div>
</div>

<!-- Mobile Touch Virtual Pad Overlay -->
<div id="mobile-controls">
  <div class="mobile-dpad">
    <div></div>
    <button class="dpad-btn" id="btn-up">▲</button>
    <div></div>
    <button class="dpad-btn" id="btn-left">◀</button>
    <div></div>
    <button class="dpad-btn" id="btn-right">▶</button>
    <div></div>
    <button class="dpad-btn" id="btn-down">▼</button>
    <div></div>
  </div>
  <div id="mobile-action-group">
    <button class="action-btn" id="btn-e">E</button>
  </div>
</div>

<script type="module">
// Ensure custom retro Google Fonts are ready
await document.fonts.ready;

// ---- SPATIAL ENVIRONMENT & SCREEN POSITIONS ----
const ROOM_WIDTH = 1800; 
const WORLD_WIDTH = ROOM_WIDTH * 4; 
const MIN_Y = 415; 
const MAX_Y = 680;

const VIDEOS = [
  // Room 1: Fashion & Action (0 to 1800)
  { id: 'nike', file: 'traditional/nike_air_force_one.mp4', brand: 'Nike', title: 'Air Force One', desc: 'Step into the legacy of a classic court icon.\n\nAn energetic pixel-art visual tribute to the timeless sneaker culture.', x: 350, room: 1 },
  { id: 'dreamer', file: 'traditional/note_for_a_dreamer_fashion_film.mp4', brand: 'Note for a Dreamer', title: 'Fashion Film', desc: 'A dreamy exploration of light, high fashion, and raw texture.\n\nA beauty piece curated for contemporary visionaries.', x: 850, room: 1 },
  { id: 'aussie', file: 'traditional/aussie_launch_event.mp4', brand: 'Aussie', title: 'Launch Event', desc: 'Unleashing retro-themed haircare energy.\n\nExperience the dynamic, high-octane launch sequence.', x: 1350, room: 1 },
  
  // Room 2: Living & Comfort (1800 to 3600)
  { id: 'natuzzi', file: 'traditional/natuzzi_italia_the_pursuit_of_harmony.mp4', brand: 'Natuzzi Italia', title: 'Pursuit of Harmony', desc: 'Mediterranean warmth and balance.\n\nA journey across modern furniture design and delicate design accents.', x: 2150, room: 2 },
  { id: 'arredissima', file: 'traditional/arredissima_issima.mp4', brand: 'Arredissima', title: 'Issima', desc: 'Italian artisan furniture custom-tailored for spaces.\n\nTransforming houses into personal, dynamic environments.', x: 2650, room: 2 },
  { id: 'pilgrims', file: 'traditional/pigrims_choice_cheese_things_change.mp4', brand: 'Pilgrim\'s Choice', title: 'Cheese - Things Change', desc: 'A witty visual interpretation showing that while things change, premium quality tastes remain timeless.', x: 3150, room: 2 },
  
  // Room 3: Beauty & Care (3600 to 5400)
  { id: 'garnier', file: 'traditional/garnier_just_like_us.mp4', brand: 'Garnier', title: 'Just Like Us', desc: 'Organic ingredients curated for universal skin health.\n\nA dynamic splash animation celebrating authentic personal beauty.', x: 3950, room: 3 },
  { id: 'braun', file: 'traditional/braun_humans_florian.mp4', brand: 'Braun', title: 'Humans - Florian', desc: 'Precision mechanical craftsmanship meets daily design routine.\n\nA cinematic look into product creation and artistic lifestyle.', x: 4450, room: 3 },
  { id: 'head_shoulders', file: 'traditional/head_and_shoulders_buffon.mp4', brand: 'Head & Shoulders', title: 'Buffon Campaign', desc: 'Stay calm under championship spotlight pressure.\n\nFeaturing football legend Gianluigi Buffon showing performance confidence.', x: 4950, room: 3 },

  // Room 4: Cinematic Concept (5400 to 7200)
  { id: 'black_drag', file: 'traditional/black_drag_magic.mp4', brand: 'Black Drag Magic', title: 'Magic', desc: 'Surreal visual art celebrating expressive style and choreography.\n\nExplore a universe of creative costuming.', x: 5750, room: 4 },
  { id: 'vicks', file: 'traditional/vicks_treno_per_milano.mov', brand: 'Vicks', title: 'Treno per Milano', desc: 'Warm relief on a retro cold-day commute to Milan.\n\nKeeping your family travels moving smoothly.', x: 6450, room: 4 }
];

// Room Style Configs
const ROOM_THEMES = {
  1: { wall: '#151622', panel: '#0f1018', banner: '#e8c547', name: 'Entrance & Fashion Wing' },
  2: { wall: '#102219', panel: '#0b1611', banner: '#50e3c2', name: 'Living & Lifestyle Pavilion' },
  3: { wall: '#1e1c2a', panel: '#15131e', banner: '#b8e986', name: 'Personal Care & Design' },
  4: { wall: '#251515', panel: '#1a0e0e', banner: '#ff5a5f', name: 'Cinematic Concept Wing' }
};

// ---- PRELOAD ASSETS SYSTEM ----
let loadedCount = 0;
const totalAssets = 4; 
let isReady = false;
let audioUnlocked = false;

// Decoupled Multi-spritesheet registry
// Both greg_walk AND tim_walk contain exactly 8 frames (8 columns) in their respective sheets!
const characters = {
  greg_idle: { img: new Image(), src: 'characters/greg_idle.png', ready: false, cols: 1 },
  greg_walk: { img: new Image(), src: 'characters/greg_walk.png', ready: false, cols: 8 },
  tim_idle: { img: new Image(), src: 'characters/tim_idle.png', ready: false, cols: 1 },
  tim_walk: { img: new Image(), src: 'characters/tim_walk.png', ready: false, cols: 8 } // CORRECTED: Tim has exactly 8 frames
};

function onAssetLoaded() {
  loadedCount++;
  const progress = (loadedCount / totalAssets) * 100;
  document.getElementById('load-fill').style.width = progress + '%';
  if (loadedCount >= totalAssets) {
    isReady = true;
    document.getElementById('load-text').textContent = 'Exhibition Ready.';
    const btn = document.getElementById('enter-btn');
    btn.style.display = 'block';
    btn.addEventListener('click', () => {
      audioUnlocked = true;
      VIDEOS.forEach(v => v.video.play().catch(e => console.warn("Autoplay deferred", e)));
      document.getElementById('loading').style.opacity = '0';
      setTimeout(() => document.getElementById('loading').style.display = 'none', 800);
    });
  }
}

// Load separate idle and walking PNG sheets
Object.keys(characters).forEach(key => {
  characters[key].img.onload = () => {
    characters[key].ready = true;
    onAssetLoaded();
  };
  characters[key].img.onerror = () => {
    console.error(`Missing asset characters/${key}.png`);
    onAssetLoaded(); 
  };
  characters[key].img.src = characters[key].src;
});

// Setup video instances
VIDEOS.forEach(v => {
  const vid = document.createElement('video');
  vid.src = v.file;
  vid.muted = true;
  vid.loop = true;
  vid.playsInline = true;
  vid.preload = 'metadata';
  vid.volume = 0;
  v.video = vid;
});

// ---- CORE CANVAS SETUP ----
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---- SPRITE STRUCTS ----
class Entity {
  constructor(type, x, y, isPlayer = false) {
    this.type = type; 
    this.x = x;
    this.y = y;
    this.isPlayer = isPlayer;
    
    this.vx = 0;
    this.vy = 0;
    this.speed = 260; 
    
    this.state = 'idle'; 
    this.currentFrame = 0;
    this.frameTimer = 0;
    this.frameInterval = 0.12; 
    this.facing = 1; 
  }

  update(dt) {
    const currentSheetKey = `${this.type}_${this.state}`;
    const meta = characters[currentSheetKey];
    if (!meta || !meta.ready) return;

    this.frameTimer += dt;
    if (this.frameTimer >= this.frameInterval) {
      this.frameTimer = 0;
      this.currentFrame = (this.currentFrame + 1) % meta.cols;
    }

    if (Math.abs(this.vx) > 0.1) {
      this.facing = this.vx > 0 ? -1 : 1;
    }
  }

  draw(ctx, cameraX) {
    const currentSheetKey = `${this.type}_${this.state}`;
    const meta = characters[currentSheetKey];
    if (!meta || !meta.ready) return;

    const img = meta.img;
    
    // Calculate precise frame width (fW) based on the corrected column count
    const fW = img.width / meta.cols;
    const fH = img.height;

    // PREVENT SUBPIXEL SCALE BLEEDING:
    // Crop exactly 6px safety margin on both left and right sides to completely
    // eliminate shoe-tip pixel bleeding on both characters. 
    // Snap all slicing bounds using Math.round to force perfect integer positioning.
    const cropMargin = 6;
    const frameStartX = Math.round(this.currentFrame * fW);
    
    const sourceX = frameStartX + cropMargin;
    const sourceY = 0;
    const sourceW = Math.round(fW) - (cropMargin * 2);
    const sourceH = fH;

    const aspect = sourceW / sourceH;

    // Dynamic depth scale
    const scaleFactor = 0.75 + ((this.y - MIN_Y) / (MAX_Y - MIN_Y)) * 0.45;
    
    // Fixed reference height: 175px scaled dynamically
    const baseHeight = 175; 
    const drawH = baseHeight * scaleFactor;
    const drawW = drawH * aspect;

    ctx.save();
    ctx.translate(this.x - cameraX, this.y);
    ctx.scale(this.facing, 1);

    ctx.drawImage(
      img,
      sourceX, sourceY, sourceW, sourceH,
      -drawW / 2, -drawH + 8, drawW, drawH
    );
    ctx.restore();
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(this.x - cameraX, this.y + 6, 24 * scaleFactor, 7 * scaleFactor, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Instantiate players
const greg = new Entity('greg', 250, 520, true);
const tim = new Entity('tim', 550, 540, false);

// ---- COLLISION DETECTION ----
const benches = [
  { x: 1100, y: 560, w: 200, h: 50 },
  { x: 2900, y: 560, w: 200, h: 50 },
  { x: 4700, y: 560, w: 200, h: 50 },
  { x: 6100, y: 560, w: 200, h: 50 }
];

function checkWallCollision(targetX, targetY) {
  if (targetX < 40 || targetX > WORLD_WIDTH - 40) return true;
  if (targetY < MIN_Y || targetY > MAX_Y) return true;
  
  for (let b of benches) {
    if (targetX + 20 > b.x - b.w/2 && targetX - 20 < b.x + b.w/2 &&
        targetY + 14 > b.y - b.h/2 && targetY - 14 < b.y + b.h/2) {
      return true;
    }
  }
  return false;
}

// ---- TIM (AI GUIDE) PATHING WAYPOINTS ----
const timWaypoints = [
  { x: 350, wait: 6000 },
  { x: 1350, wait: 5000 },
  { x: 2150, wait: 7000 },
  { x: 3150, wait: 6000 },
  { x: 4450, wait: 8000 },
  { x: 5750, wait: 7000 },
  { x: 6450, wait: 10000 },
  { x: 3950, wait: 6000 },
  { x: 2650, wait: 6000 },
  { x: 850, wait: 8000 }
];
let currentWaypointIndex = 0;
let timWaitTimer = 0;

function updateTimAI(dt) {
  if (timWaitTimer > 0) {
    timWaitTimer -= dt * 1000;
    tim.state = 'idle';
    tim.vx = 0;
    tim.vy = 0;
    if (timWaitTimer <= 0) {
      currentWaypointIndex = (currentWaypointIndex + 1) % timWaypoints.length;
    }
    return;
  }

  const wp = timWaypoints[currentWaypointIndex];
  const diffX = wp.x - tim.x;
  
  if (Math.abs(diffX) < 10) {
    timWaitTimer = wp.wait;
  } else {
    tim.state = 'walk';
    tim.vx = Math.sign(diffX) * 140; 
    tim.x += tim.vx * dt;
    
    const targetY = 480 + (wp.x % 120);
    tim.y += (targetY - tim.y) * 0.05;
  }
}

// ---- KEY CONTROLS SYSTEM ----
const keys = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'e') triggerInteraction();
  if (e.key === 'Escape') closeOverlay();
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// Setup Mobile Control Elements
const setupMobileControl = (id, keyName) => {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
};
setupMobileControl('btn-up', 'w');
setupMobileControl('btn-left', 'a');
setupMobileControl('btn-right', 'd');
setupMobileControl('btn-down', 's');
document.getElementById('btn-e').addEventListener('touchstart', (e) => {
  e.preventDefault();
  triggerInteraction();
});

// ---- INTERACTIVE OVERLAYS ----
let activeScreen = null;
let isOverlayOpen = false;

function triggerInteraction() {
  if (isOverlayOpen) return;
  if (activeScreen) {
    isOverlayOpen = true;
    VIDEOS.forEach(v => v.video.volume = 0);

    const overlay = document.getElementById('overlay');
    const overlayVid = document.getElementById('overlay-video');

    document.getElementById('overlay-brand').textContent = activeScreen.brand;
    document.getElementById('overlay-title').textContent = activeScreen.title;
    document.getElementById('overlay-desc').textContent = activeScreen.desc;
    
    overlayVid.src = activeScreen.file;
    overlayVid.volume = 1;
    overlayVid.play();

    overlay.classList.add('visible');
  }
}

function closeOverlay() {
  isOverlayOpen = false;
  document.getElementById('overlay').classList.remove('visible');
  const overlayVid = document.getElementById('overlay-video');
  overlayVid.pause();
  overlayVid.src = '';
}
document.getElementById('overlay-close').addEventListener('click', closeOverlay);

// ---- PROCEDURAL PIXEL ART GRAPHICS RENDER ----
function drawEnvironment(ctx, cameraX) {
  const visibleRoomStart = Math.floor(cameraX / ROOM_WIDTH) + 1;
  const visibleRoomEnd = Math.floor((cameraX + canvas.width) / ROOM_WIDTH) + 1;

  for (let r = visibleRoomStart; r <= visibleRoomEnd; r++) {
    const roomTheme = ROOM_THEMES[r];
    if (!roomTheme) continue;

    const startX = (r - 1) * ROOM_WIDTH - cameraX;

    // 1. Draw Walls
    ctx.fillStyle = roomTheme.wall;
    ctx.fillRect(startX, 0, ROOM_WIDTH, 400);

    // Decorative baseboards
    ctx.fillStyle = roomTheme.panel;
    ctx.fillRect(startX, 375, ROOM_WIDTH, 25);

    // Dark split separator line
    ctx.fillStyle = '#050508';
    ctx.fillRect(startX, 396, ROOM_WIDTH, 4);

    // 2. Draw Floorboards
    ctx.fillStyle = '#1c171d';
    ctx.fillRect(startX, 400, ROOM_WIDTH, 320);

    // Render floor planks
    ctx.strokeStyle = '#141014';
    ctx.lineWidth = 2;
    for (let y = 420; y < 720; y += 24) {
      ctx.beginPath();
      ctx.moveTo(startX, y);
      ctx.lineTo(startX + ROOM_WIDTH, y);
      ctx.stroke();
    }

    // 3. Columns separating the wings
    ctx.fillStyle = '#08080d';
    ctx.fillRect(startX, 0, 24, 720);
    ctx.fillStyle = '#1a1a26';
    ctx.fillRect(startX + 24, 0, 6, 720);
  }

  // Draw benches 
  benches.forEach(b => {
    ctx.fillStyle = '#22140a'; 
    ctx.fillRect(b.x - b.w/2 + 14 - cameraX, b.y, 10, 20);
    ctx.fillRect(b.x + b.w/2 - 24 - cameraX, b.y, 10, 20);

    ctx.fillStyle = '#3c2513'; 
    ctx.fillRect(b.x - b.w/2 - cameraX, b.y - 18, b.w, 18);
    ctx.fillStyle = '#9e6234'; 
    ctx.fillRect(b.x - b.w/2 - cameraX, b.y - 18, b.w, 4);
  });
}

function drawScreens(ctx, cameraX) {
  VIDEOS.forEach(v => {
    const screenW = 280; 
    const screenH = 158;
    const sx = v.x - screenW / 2 - cameraX;
    const sy = 160;

    // Hanging Spotlight Cone
    ctx.fillStyle = 'rgba(232, 197, 71, 0.05)';
    ctx.beginPath();
    ctx.moveTo(v.x - cameraX - 10, 0);
    ctx.lineTo(v.x - cameraX + 10, 0);
    ctx.lineTo(v.x - cameraX + 180, 400);
    ctx.lineTo(v.x - cameraX - 180, 400);
    ctx.closePath();
    ctx.fill();

    // Spotlight glow on backwall
    const spotlightGrad = ctx.createRadialGradient(v.x - cameraX, sy + 60, 2, v.x - cameraX, sy + 80, 240);
    spotlightGrad.addColorStop(0, 'rgba(232, 197, 71, 0.22)');
    spotlightGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = spotlightGrad;
    ctx.fillRect(v.x - 300 - cameraX, 0, 600, 400);

    // Screen frame borders
    ctx.fillStyle = '#110a05';
    ctx.fillRect(sx - 12, sy - 12, screenW + 24, screenH + 24);
    ctx.fillStyle = '#23180f';
    ctx.fillRect(sx - 8, sy - 8, screenW + 16, screenH + 16);

    // Status light indicator
    ctx.fillStyle = (activeScreen === v) ? '#00ff66' : '#ff3333';
    ctx.beginPath();
    ctx.arc(v.x - cameraX, sy + screenH + 8, 3, 0, Math.PI * 2);
    ctx.fill();

    // Draw video stream onto TV screen
    if (v.video && v.video.readyState >= 2) {
      ctx.drawImage(v.video, sx, sy, screenW, screenH);
    } else {
      ctx.fillStyle = '#06060a';
      ctx.fillRect(sx, sy, screenW, screenH);
      ctx.fillStyle = '#e8c547';
      ctx.font = "10px 'DM Mono'";
      ctx.fillText("LOADING DATA...", sx + 75, sy + 84);
    }

    // Placard plate
    const placardX = v.x + screenW/2 + 25 - cameraX;
    const placardY = sy + 40;
    ctx.fillStyle = '#eaeaea';
    ctx.fillRect(placardX, placardY, 40, 55);
    ctx.fillStyle = '#9c9c9c';
    ctx.strokeRect(placardX, placardY, 40, 55);

    ctx.fillStyle = '#111';
    ctx.fillRect(placardX + 5, placardY + 5, 30, 4);
    ctx.fillStyle = '#777';
    ctx.fillRect(placardX + 5, placardY + 16, 24, 3);
    ctx.fillRect(placardX + 5, placardY + 24, 30, 3);
    ctx.fillRect(placardX + 5, placardY + 32, 18, 3);
  });
}

// ---- DYNAMIC HUD MINIMAP ----
const miniCanvas = document.getElementById('minimap-canvas');
const miniCtx = miniCanvas.getContext('2d');
miniCtx.imageSmoothingEnabled = false;

function drawMinimap() {
  const mw = miniCanvas.width;
  const mh = miniCanvas.height;
  miniCtx.clearRect(0, 0, mw, mh);

  miniCtx.fillStyle = '#101216';
  miniCtx.fillRect(0, 0, mw, mh);
  miniCtx.strokeStyle = 'rgba(255,255,255,0.1)';
  miniCtx.strokeRect(0, 0, mw, mh);

  miniCtx.strokeStyle = 'rgba(255,255,255,0.2)';
  for (let r = 1; r < 4; r++) {
    const rx = (r * ROOM_WIDTH / WORLD_WIDTH) * mw;
    miniCtx.beginPath();
    miniCtx.moveTo(rx, 0);
    miniCtx.lineTo(rx, mh);
    miniCtx.stroke();
  }

  miniCtx.fillStyle = '#e8c547';
  VIDEOS.forEach(v => {
    const mx = (v.x / WORLD_WIDTH) * mw;
    miniCtx.fillRect(mx - 1, 4, 2, 4);
  });

  const gregX = (greg.x / WORLD_WIDTH) * mw;
  miniCtx.fillStyle = '#00ffcc'; 
  miniCtx.fillRect(gregX - 2, mh / 2 - 3, 4, 6);

  const timX = (tim.x / WORLD_WIDTH) * mw;
  miniCtx.fillStyle = '#ff6666'; 
  miniCtx.fillRect(timX - 2, mh / 2 - 3, 3, 5);

  const currentRoom = Math.min(4, Math.max(1, Math.floor(greg.x / ROOM_WIDTH) + 1));
  document.getElementById('minimap-info').textContent = ROOM_THEMES[currentRoom].name;
}

// ---- MAIN LOOP ----
let lastTime = 0;
let cameraX = 0;

function gameLoop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.1); 
  lastTime = time;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (isReady && !isOverlayOpen) {
    // 1. Process player input
    greg.vx = 0;
    greg.vy = 0;
    greg.state = 'idle';

    if (keys['w'] || keys['arrowup']) { greg.vy = -greg.speed; greg.state = 'walk'; }
    if (keys['s'] || keys['arrowdown']) { greg.vy = greg.speed; greg.state = 'walk'; }
    if (keys['a'] || keys['arrowleft']) { greg.vx = -greg.speed; greg.state = 'walk'; }
    if (keys['d'] || keys['arrowright']) { greg.vx = greg.speed; greg.state = 'walk'; }

    const nextX = greg.x + greg.vx * dt;
    const nextY = greg.y + greg.vy * dt;

    if (!checkWallCollision(nextX, greg.y)) greg.x = nextX;
    if (!checkWallCollision(greg.x, nextY)) greg.y = nextY;

    // AI waypoint routine
    updateTimAI(dt);

    greg.update(dt);
    tim.update(dt);

    // Smooth horizontal camera tracking
    const targetCamX = greg.x - canvas.width / 2;
    cameraX += (targetCamX - cameraX) * 0.08;
    cameraX = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, cameraX));

    // Dynamic proximities
    let closestScreen = null;
    let minDistance = Infinity;

    VIDEOS.forEach(v => {
      const distance = Math.hypot(greg.x - v.x, greg.y - 400);
      
      // Proximity spatial sound fade
      if (audioUnlocked) {
        const volumeFadeRadius = 550; 
        if (distance < volumeFadeRadius) {
          const attenuation = 1.0 - (distance / volumeFadeRadius);
          v.video.volume = Math.pow(attenuation, 1.8); 
          if (v.video.paused) v.video.play().catch(() => {});
        } else {
          v.video.volume = 0;
        }
      }

      if (distance < minDistance) {
        minDistance = distance;
        closestScreen = v;
      }
    });

    const activeRange = 140;
    if (minDistance < activeRange) {
      activeScreen = closestScreen;
      const prompt = document.getElementById('proximity-prompt');
      prompt.textContent = `Press [ E ] to view ${activeScreen.title}`;
      prompt.classList.add('visible');
    } else {
      activeScreen = null;
      document.getElementById('proximity-prompt').classList.remove('visible');
    }
  }

  // Draw background environment and screens
  drawEnvironment(ctx, cameraX);
  drawScreens(ctx, cameraX);

  // Depth rendering sorting check
  if (greg.y <= tim.y) {
    greg.draw(ctx, cameraX);
    tim.draw(ctx, cameraX);
  } else {
    tim.draw(ctx, cameraX);
    greg.draw(ctx, cameraX);
  }

  drawMinimap();

  requestAnimationFrame(gameLoop);
}

// Layout scale ratio fitting helper
function handleResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const aspect = 16 / 9;

  if (w / h > aspect) {
    canvas.style.width = `${h * aspect}px`;
    canvas.style.height = `${h}px`;
  } else {
    canvas.style.width = `${w}px`;
    canvas.style.height = `${w / aspect}px`;
  }
}
window.addEventListener('resize', handleResize);
handleResize();

requestAnimationFrame(gameLoop);
</script>
