function lerpAngle(start, end, amt) {
  let delta = end - start;
  while (delta > Math.PI) delta -= Math.PI * 2;
  while (delta < -Math.PI) delta += Math.PI * 2;
  return start + delta * amt;
}

// ---- Canvas Text Generation Helpers ----
function wrapText(context, text, x, y, maxWidth, lineHeight) {
  const paragraphs = text.split('\n');
  let currentY = y;
  for(let p = 0; p < paragraphs.length; p++) {
      const words = paragraphs[p].split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          const metrics = context.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) {
              context.fillText(line, x, currentY);
              line = words[n] + ' ';
              currentY += lineHeight;
          } else {
              line = testLine;
          }
      }
      context.fillText(line, x, currentY);
      currentY += lineHeight;
  }
}

function createRoomTitleTexture(title) {
  const canvas = document.createElement('canvas');
  canvas.width = 2048; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fontSize = 110; 
  ctx.font = `400 ${fontSize}px 'DM Mono', monospace`;
  
  if ('letterSpacing' in ctx) {
    ctx.letterSpacing = '20px';
    ctx.fillText(title.toUpperCase(), 1024, 256);
  } else {
    ctx.fillText(title.toUpperCase().split('').join(' '), 1024, 256);
  }
  
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createGalleryLabelTexture(brand, title, desc) {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 1024;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = 'rgba(12, 12, 12, 0.7)';
  ctx.fillRect(0, 0, 1024, 1024);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, 1020, 1020);

  ctx.fillStyle = '#e8c547';
  ctx.font = `500 32px 'DM Mono', monospace`;
  ctx.fillText(brand.toUpperCase(), 80, 80);

  ctx.fillStyle = '#ffffff';
  ctx.font = `400 56px 'DM Mono', monospace`;
  wrapText(ctx, title, 80, 160, 860, 68);

  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = `300 28px 'DM Mono', monospace`;
  wrapText(ctx, desc, 80, 360, 860, 42);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createRetroSignTexture(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, 1024, 256);
  
  ctx.strokeStyle = 'rgba(232, 197, 71, 0.85)';
  ctx.lineWidth = 12;
  ctx.shadowColor = 'rgba(232, 197, 71, 1)';
  ctx.shadowBlur = 24;
  ctx.strokeRect(16, 16, 992, 224);
  
  ctx.textAlign = 'center'; 
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
  ctx.shadowBlur = 15;
  ctx.font = `400 48px 'DM Mono', monospace`;
  
  if ('letterSpacing' in ctx) {
    ctx.letterSpacing = '10px';
    ctx.fillText(text.toUpperCase(), 512, 128);
  } else {
    ctx.fillText(text.toUpperCase().split('').join(' '), 512, 128);
  }
  
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ---- Preloader State ----
let loadedAssets = 0;
const totalAssets = VIDEOS.length + 2; 
let audioUnlocked = false;
let isReady = false;

function registerAssetLoaded() {
  if (isReady) return; 
  loadedAssets++;
  const progress = (loadedAssets / totalAssets) * 100;
  document.getElementById('load-fill').style.width = Math.min(progress, 100) + '%';
  
  if (loadedAssets >= totalAssets) {
    isReady = true;
    document.getElementById('load-text').textContent = 'Gallery Ready.';
    const btn = document.getElementById('enter-btn');
    btn.style.display = 'block';
    
    btn.addEventListener('click', () => {
      audioUnlocked = true;
      screens.forEach(s => {
        s.video.play().catch(e => console.warn('Autoplay blocked:', e));
      });
      document.getElementById('loading').style.opacity = '0';
      setTimeout(() => document.getElementById('loading').style.display = 'none', 800);
      
      setTimeout(() => {
        if (timState === 'intro_wait') timState = 'walking';
      }, 2000);
    });
  }
}

    console.warn("Forcing load completion due to timeout.");

// ---- Setup Scene ----

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0; 
const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

document.body.appendChild(renderer.domElement);

scene.fog = new THREE.FogExp2(0x000000, 0.012);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 150);

const ambient = new THREE.AmbientLight(0xffffff, 1.0); 
scene.add(ambient);
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x112233, 1.0); 
scene.add(hemiLight);

const texLoader = new THREE.TextureLoader();

const concreteRough = texLoader.load('concrete_texture/concrete_roughness.webp');

  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(20, 20); 
  tex.anisotropy = maxAnisotropy; 
});

});

// ---- Video Screens ----
const screens = [];
VIDEOS.forEach(v => {
  const vidEl = document.createElement('video');
  vidEl.src = v.file;
  vidEl.crossOrigin = 'anonymous';
  vidEl.loop = true;
  vidEl.playsInline = true;
  vidEl.muted = false; 
  vidEl.volume = 0; 
  vidEl.preload = 'auto';
  
  let isVideoRegistered = false;
  const loadHandler = () => {
    if(!isVideoRegistered) {
      isVideoRegistered = true;
      registerAssetLoaded();
    }
  };
  vidEl.addEventListener('loadedmetadata', loadHandler);
  vidEl.addEventListener('error', loadHandler);

  const videoTex = new THREE.VideoTexture(vidEl);
  videoTex.colorSpace = THREE.SRGBColorSpace;
  videoTex.anisotropy = maxAnisotropy;
  
  const vScale = v.scale || 1.0;
  const vAspect = v.aspect || 1.7777;
  const width = 6.4 * vScale;
  const height = (6.4 / vAspect) * vScale;

  const screenGeo = new THREE.PlaneGeometry(width, height);
  const screenMat = new THREE.MeshBasicMaterial({ color: 0xffffff, map: videoTex, toneMapped: false });
  
  const frameDepth = 0.12;
  const frameGeo = new THREE.BoxGeometry(width + 0.2, height + 0.2, frameDepth);
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7, metalness: 0.6 });

  const group = new THREE.Group();
  const frameMesh = new THREE.Mesh(frameGeo, frameMat);
  frameMesh.position.set(0, 0, frameDepth / 2); 
  frameMesh.castShadow = true;
  group.add(frameMesh);

  const screenMesh = new THREE.Mesh(screenGeo, screenMat);
  screenMesh.position.set(0, 0, frameDepth + 0.005); 
  group.add(screenMesh);

  const labelTex = createGalleryLabelTexture(v.brand, v.title, v.desc);
  labelTex.anisotropy = maxAnisotropy;
  const labelGeo = new THREE.PlaneGeometry(2.4, 2.4); 
  const labelMat = new THREE.MeshBasicMaterial({ map: labelTex, transparent: true, alphaTest: 0.05 });
  const labelMesh = new THREE.Mesh(labelGeo, labelMat);
  
  labelMesh.position.set((width / 2) + 1.6, 0, frameDepth + 0.01); 
  group.add(labelMesh);

  const offset = 0.02;
  let px = v.x, pz = v.z;
  if(v.rot === 0) pz += offset;
  if(v.rot === Math.PI) pz -= offset;
  if(v.rot === Math.PI/2) px += offset;
  if(v.rot === -Math.PI/2) px -= offset;

  group.position.set(px, 3.5, pz);
  group.rotation.y = v.rot;
  scene.add(group);

  const normal = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), v.rot);
  
  const glowLight = new THREE.PointLight(0xfff0dd, 0.8, 12, 2);
  glowLight.position.set(v.x + normal.x * 2.0, 3.5, v.z + normal.z * 2.0);
  scene.add(glowLight);

  const spot = new THREE.SpotLight(0xffeedd, 15.0, 20, Math.PI/5, 0.6, 1.5);
  spot.position.set(v.x + normal.x * 3.0, 7.5, v.z + normal.z * 3.0);
  spot.target = group;
  spot.castShadow = true;
  spot.shadow.mapSize.width = 1024;
  spot.shadow.mapSize.height = 1024;
  spot.shadow.bias = -0.001; 
  scene.add(spot);

  screens.push({ mesh: group, data: v, video: vidEl, normal: normal });
});

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

let character, mixer, idleAction, walkAction;
let currentWeight = 0; 
gltfLoader.load('greg.glb', (gltf) => {
  character = gltf.scene;
  character.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
  
  character.position.set(0, 0, -10);
  character.rotation.y = Math.PI; 
  scene.add(character);
  
  if (gltf.animations && gltf.animations.length) {
    mixer = new THREE.AnimationMixer(character);
    const idle = gltf.animations.find(a => a.name.toLowerCase().includes('idle')) || gltf.animations[0];
    const walk = gltf.animations.find(a => a.name.toLowerCase().includes('walk')) || gltf.animations[1];
    
    if (idle) {
      idleAction = mixer.clipAction(idle);
      idleAction.play();
      idleAction.setEffectiveWeight(1);
    }
    if (walk) {
      walkAction = mixer.clipAction(walk);
      walkAction.play();
      walkAction.setEffectiveWeight(0);
    }
  }
  registerAssetLoaded();
}, undefined, (err) => { console.error('Error loading greg:', err); registerAssetLoaded(); });

// ---- Controls & Movement ----
const keys = { w:false, a:false, s:false, d:false, arrowup:false, arrowdown:false, arrowleft:false, arrowright:false };
let pointerLocked = false, isOverlayOpen = false;
let walkYaw = Math.PI, walkPitch = -0.1; 

window.addEventListener('keydown', e => {
  if(isOverlayOpen) {
    if(e.key === 'Escape') {
      closeOverlay();
      document.getElementById('confirm-overlay').classList.remove('visible');
    }
    return;
  }
  const k = e.key.toLowerCase();
  if(keys.hasOwnProperty(k)) keys[k] = true;
  if(e.key === 'e') triggerInteraction();
});

window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if(keys.hasOwnProperty(k)) keys[k] = false;
});

renderer.domElement.addEventListener('click', () => {
  if(!pointerLocked && !isOverlayOpen && audioUnlocked) {
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = !!document.pointerLockElement;
});

document.addEventListener('mousemove', e => {
  if(!pointerLocked || isOverlayOpen) return;
  walkYaw -= e.movementX * 0.003;
  walkPitch -= e.movementY * 0.003;
  walkPitch = Math.max(-0.4, Math.min(0.5, walkPitch));
});

// ---- Level Transition Logic ----
function startLevelTransition() {
  const loadingScreen = document.getElementById('loading');
  const loadText = document.getElementById('load-text');
  const loadFill = document.getElementById('load-fill');
  
  document.getElementById('enter-btn').style.display = 'none';
  loadText.textContent = "TRAVELLING TO TRADITIONAL PRODUCTION...";
  
  loadFill.style.transition = 'none';
  loadFill.style.width = '0%';
  
  loadingScreen.style.display = 'flex';
  loadingScreen.style.opacity = '1';
  loadingScreen.style.pointerEvents = 'all';
  
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      loadFill.style.transition = 'width 2s cubic-bezier(0.4, 0, 0.2, 1)';
      loadFill.style.width = '100%';
      
      setTimeout(() => {
        window.location.href = './2d/';
      }, 2100);
    });
  });
}

// ---- Interaction Logic ----
let activeInteractable = null; 
let activeScreen = null;
const promptEl = document.getElementById('proximity-prompt');
const overlayVid = document.getElementById('overlay-video');

function triggerInteraction() {
  if(isOverlayOpen) return;
  
  if (activeInteractable === 'exit_door') {
    isOverlayOpen = true;
    document.exitPointerLock();
    document.getElementById('confirm-overlay').classList.add('visible');

  } else if (activeInteractable === 'door') {
    doorState = 'opening';
    promptEl.classList.remove('visible');
    activeInteractable = null;
    
    buttonMat.color.setHex(0x00cc00);
    buttonMat.emissive.setHex(0x005500);
    btnLight.color.setHex(0x00ff00);

  } else if (activeInteractable === 'video' && activeScreen) {
    isOverlayOpen = true;
    document.exitPointerLock();
    
    const data = activeScreen.data;
    document.getElementById('overlay-brand').textContent = data.brand;
    document.getElementById('overlay-title').textContent = data.title;
    document.getElementById('overlay-desc').textContent = data.desc;
    
    screens.forEach(s => s.video.volume = 0);
    
    overlayVid.src = data.file;
    overlayVid.volume = 1;
    overlayVid.play(); 
    
    document.getElementById('overlay').classList.add('visible');
  }
}

function closeOverlay() {
  isOverlayOpen = false;
  document.getElementById('overlay').classList.remove('visible');
  overlayVid.pause();
  overlayVid.src = ""; 
}
document.getElementById('overlay-close').addEventListener('click', closeOverlay);

// ---- Map System ----
const mapCtx = document.getElementById('map-canvas').getContext('2d');
function drawMap() {
  if(!character) return;
  
  const cw = 160, ch = 160;
  mapCtx.clearRect(0, 0, cw, ch);
  
  const scale = 1.6; 
  const offsetX = cw / 2;
  const offsetY = ch - 20; 

  mapCtx.fillStyle = 'rgba(255,255,255,0.2)';
  WALLS.forEach(w => {
    const cx = offsetX + w.x * scale;
    const cy = offsetY - w.z * scale; 
    mapCtx.fillRect(cx - (w.w*scale)/2, cy - (w.d*scale)/2, w.w*scale, w.d*scale);
  });
  
  mapCtx.fillStyle = doorState === 'open' ? 'rgba(0,255,0,0.5)' : 'rgba(255,100,100,0.8)';
  mapCtx.fillRect(offsetX + (doorL.position.x - 2.75) * scale, offsetY - (doorL.position.z + 0.4) * scale, 5.5 * scale, 0.8 * scale);
  mapCtx.fillRect(offsetX + (doorR.position.x - 2.75) * scale, offsetY - (doorR.position.z + 0.4) * scale, 5.5 * scale, 0.8 * scale);

  // Far Exit Door
  mapCtx.fillStyle = 'rgba(100,200,255,0.8)';
  mapCtx.fillRect(offsetX + (exitDoor.position.x - 1.5) * scale, offsetY - (exitDoor.position.z + 0.2) * scale, 3 * scale, 0.4 * scale);

  mapCtx.fillStyle = 'rgba(232,197,71,0.8)';
  screens.forEach(s => {
    const mx = offsetX + s.data.x * scale;
    const mz = offsetY - s.data.z * scale;
    mapCtx.beginPath(); mapCtx.arc(mx, mz, 2.5, 0, Math.PI*2); mapCtx.fill();
  });
  
  mapCtx.fillStyle = '#fff';
  const px = offsetX + character.position.x * scale;
  const pz = offsetY - character.position.z * scale;
  mapCtx.beginPath(); mapCtx.arc(px, pz, 3.5, 0, Math.PI*2); mapCtx.fill();

  if (tim) {
    mapCtx.fillStyle = '#ff6666';
    const tx = offsetX + tim.position.x * scale;
    const tz = offsetY - tim.position.z * scale;
    mapCtx.beginPath(); mapCtx.arc(tx, tz, 2.5, 0, Math.PI*2); mapCtx.fill();
  }
}

// ---- Collision System ----
function checkCollision(pos, radius) {
  for(let i=0; i<WALLS.length; i++) {
    const w = WALLS[i];
    // Exclude lintels/overhead walls from floor-level collision checks
    if(w.y && w.y > 4) continue;
    
    const hw = w.w / 2;
    const hd = w.d / 2;
    if (pos.x + radius > w.x - hw && pos.x - radius < w.x + hw &&
        pos.z + radius > w.z - hd && pos.z - radius < w.z + hd) {
      return true;
    }
  }

  // Entrance door check
  if (doorState !== 'open') {
    let hw = 5.5 / 2; let hd = 0.8 / 2;
    let dxL = doorL.position.x; let dzL = doorL.position.z;
    if (pos.x + radius > dxL - hw && pos.x - radius < dxL + hw && pos.z + radius > dzL - hd && pos.z - radius < dzL + hd) return true;
    
    let dxR = doorR.position.x; let dzR = doorR.position.z;
    if (pos.x + radius > dxR - hw && pos.x - radius < dxR + hw && pos.z + radius > dzR - hd && pos.z - radius < dzR + hd) return true;
  }

  // Exit door check
  let hwE = 3 / 2; let hdE = 0.4 / 2;
  let dxE = exitDoor.position.x; let dzE = exitDoor.position.z;
  if (pos.x + radius > dxE - hwE && pos.x - radius < dxE + hwE && pos.z + radius > dzE - hdE && pos.z - radius < dzE + hdE) return true;

  if (tim) {
    const distToTim = Math.hypot(pos.x - tim.position.x, pos.z - tim.position.z);
    if (distToTim < radius + 0.3) return true; 
  }

  return false;
}

// ---- Line of Sight Check ----
function checkLineOfSight(p1, p2) {
  const steps = 20;
  for(let i = 1; i < steps; i++) {
    const t = i / steps;
    const px = p1.x + (p2.x - p1.x) * t;
    const pz = p1.z + (p2.z - p1.z) * t;
    
    if (checkCollision({x: px, z: pz}, 0.05)) {
      return false; 
    }
  }
  return true;
}

// ---- Render Loop ----
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (mixer) mixer.update(dt);
  if (timMixer) {
    const isTimMoving = (timState === 'walking');
    timCurrentWeight = THREE.MathUtils.lerp(timCurrentWeight, isTimMoving ? 1 : 0, 0.15);
    if(timIdleAction) timIdleAction.setEffectiveWeight(1 - timCurrentWeight);
    if(timWalkAction) timWalkAction.setEffectiveWeight(timCurrentWeight);
    timMixer.update(dt);
  }

  if (doorState === 'opening') {
    doorL.position.x -= 3 * dt;
    doorR.position.x += 3 * dt;
    if (doorL.position.x <= -8.25) { 
      doorState = 'open';
    }
  }

  if (timState === 'walking') {
    const target = timWaypoints[currentWaypoint];
    const dx = target.x - tim.position.x;
    const dz = target.z - tim.position.z;
    const dist = Math.hypot(dx, dz);
    
    if (dist < 0.2) {
      if (target.action === 'open_door' && doorState === 'closed') {
        doorState = 'opening';
        buttonMat.color.setHex(0x00cc00);
        buttonMat.emissive.setHex(0x005500);
        btnLight.color.setHex(0x00ff00);
      }
      
      if (target.wait > 0) {
        timState = 'waiting';
        waitTimer = target.wait;
      } else {
        currentWaypoint++;
        if (currentWaypoint >= timWaypoints.length) timState = 'idle';
      }
    } else {
      const moveSpeed = 2.5;
      tim.position.x += (dx / dist) * moveSpeed * dt;
      tim.position.z += (dz / dist) * moveSpeed * dt;
      
      const targetRot = Math.atan2(dx, dz);
      tim.rotation.y = lerpAngle(tim.rotation.y, targetRot, 0.1);
    }
  } else if (timState === 'waiting') {
    waitTimer -= dt;
    if (waitTimer <= 0) {
      currentWaypoint++;
      if (currentWaypoint >= timWaypoints.length) timState = 'idle';
      else timState = 'walking';
    }
  }

  if (character && audioUnlocked && !isOverlayOpen) {
    const moving = keys.w || keys.a || keys.s || keys.d || keys.arrowup || keys.arrowdown || keys.arrowleft || keys.arrowright;
    
    currentWeight = THREE.MathUtils.lerp(currentWeight, moving ? 1 : 0, 0.15);
    if(idleAction) idleAction.setEffectiveWeight(1 - currentWeight);
    if(walkAction) walkAction.setEffectiveWeight(currentWeight);

    let targetRot = Math.atan2(-Math.sin(walkYaw), -Math.cos(walkYaw));

    if (moving) {
      const dir = new THREE.Vector3(-Math.sin(walkYaw), 0, -Math.cos(walkYaw)).normalize();
      const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
      const move = new THREE.Vector3();
      
      if (keys.w || keys.arrowup) move.add(dir);
      if (keys.s || keys.arrowdown) move.sub(dir);
      if (keys.d || keys.arrowright) move.add(right);
      if (keys.a || keys.arrowleft) move.sub(right);
      
      if (move.lengthSq() > 0) {
        move.normalize();
        const speed = 4.5 * dt;
        
        targetRot = Math.atan2(move.x, move.z);

        const nextX = character.position.x + move.x * speed;
        const nextZ = character.position.z + move.z * speed;
        const radius = 0.5; 

        if (!checkCollision({x: nextX, z: character.position.z}, radius)) {
          character.position.x = nextX;
        }
        if (!checkCollision({x: character.position.x, z: nextZ}, radius)) {
          character.position.z = nextZ;
        }
      }
    }
    
    character.rotation.y = lerpAngle(character.rotation.y, targetRot, 0.2);

    const camDist = 5.0;
    const camHeight = 2.0;
    const cp = character.position;
    const tPos = new THREE.Vector3(
      cp.x + Math.sin(walkYaw) * Math.cos(walkPitch) * camDist,
      cp.y - Math.sin(walkPitch) * camDist + camHeight,
      cp.z + Math.cos(walkYaw) * Math.cos(walkPitch) * camDist
    );
    
    if(checkCollision({x: tPos.x, z: tPos.z}, 0.2)) {
      tPos.lerp(cp, 0.6); 
    }
    
    camera.position.lerp(tPos, 0.25); 
    camera.lookAt(cp.x, cp.y + 1.4, cp.z);

    // ---- Proximity, Visibility & Spatial Audio ----
    let distToPanel = camera.position.distanceTo(panelMesh.position);
    let showPanelPrompt = (distToPanel < 3.5 && doorState === 'closed');
    
    let distToExit = camera.position.distanceTo(exitDoor.position);
    let showExitPrompt = (distToExit < 4.0);

    let bestScore = -Infinity;
    let closestScreen = null;
    
    const MAX_AUDIO_DIST = 14.0; 
    const MIN_AUDIO_DIST = 4.0; 
    
    const camForward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);

    screens.forEach(s => {
      const dist = camera.position.distanceTo(s.mesh.position);
      const dirToScreen = s.mesh.position.clone().sub(camera.position).normalize();
      const camGazeDot = camForward.dot(dirToScreen); 
      
      const dirToCam = camera.position.clone().sub(s.mesh.position).normalize();
      const isFacingFront = s.normal.dot(dirToCam) > 0.15; 
      
      const hasLOS = checkLineOfSight(camera.position, s.mesh.position);
      
      if (s.video.paused) s.video.play().catch(()=>{});

      if (isFacingFront && hasLOS && dist < MAX_AUDIO_DIST) {
        let distVol = 1.0 - ((dist - MIN_AUDIO_DIST) / (MAX_AUDIO_DIST - MIN_AUDIO_DIST));
        distVol = Math.max(0, Math.min(1, distVol));
        let gazeVol = Math.max(0.15, (camGazeDot + 0.5) / 1.5); 
        s.video.volume = distVol * gazeVol;
      } else {
        s.video.volume = 0; 
      }

      if (isFacingFront && hasLOS && dist < 10 && camGazeDot > 0.75) {
        const score = (camGazeDot * 20) - dist; 
        if (score > bestScore) {
          bestScore = score;
          closestScreen = s;
        }
      }
    });

    if (showPanelPrompt) {
      activeInteractable = 'door';
      promptEl.textContent = "Press [ E ] to Open Door";
      promptEl.classList.add('visible');
      activeScreen = null;
    } else if (showExitPrompt) {
      activeInteractable = 'exit_door';
      promptEl.textContent = "Press [ E ] to Enter Traditional Production";
      promptEl.classList.add('visible');
      activeScreen = null;
    } else {
      activeInteractable = closestScreen ? 'video' : null;
      activeScreen = closestScreen;
      
      if(activeInteractable === 'video') {
        promptEl.textContent = `Press [ E ] to view ${activeScreen.data.title}`;
        promptEl.classList.add('visible');
      } else {
        promptEl.classList.remove('visible');
      }
    }
    
    drawMap();
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
