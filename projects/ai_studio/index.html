<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Virtual Art Gallery - Multi-Room</title>
<link href="data:," rel="icon"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #060810; font-family: 'DM Mono', monospace; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  
  /* ---- UI Overlays ---- */
  #ui { position: fixed; inset: 0; pointer-events: none; }
  
  /* User Guide */
  #guide-panel {
    position: absolute; top: 20px; left: 20px;
    background: rgba(6,8,16,0.82); border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(16px); padding: 18px; width: 260px;
  }
  #guide-panel h3 { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; margin-bottom: 14px; color: rgba(232,197,71,0.8); font-weight: 400; }
  .ctrl-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .ctrl-key { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); font-size: 9px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; }
  .ctrl-desc { color: rgba(255,255,255,0.6); font-size: 10px; letter-spacing: 0.1em; line-height: 1.4; }

  /* Map */
  #map-panel {
    position: absolute; top: 20px; right: 20px;
    background: rgba(6,8,16,0.82); border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(16px); padding: 18px; text-align: center;
  }
  #map-panel h3 { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 14px; font-weight: 400; }
  #map-canvas { border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.5); width: 160px; height: 160px; }

  /* Proximity Prompt */
  #proximity-prompt {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    color: rgba(232,197,71,0.9); font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
    background: rgba(6,8,16,0.85); border: 1px solid rgba(232,197,71,0.4);
    padding: 12px 24px; backdrop-filter: blur(12px); border-radius: 4px;
    opacity: 0; transition: opacity 0.4s ease;
  }
  #proximity-prompt.visible { opacity: 1; }

  /* Loading Screen */
  #loading {
    position: fixed; inset: 0; background: #060810; z-index: 300;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s ease;
  }
  #loading h1 { font-size: 14px; letter-spacing: 0.4em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 20px; font-weight: 400; text-align: center; }
  #load-bar { width: 240px; height: 1px; background: rgba(255,255,255,0.1); position: relative; }
  #load-fill { position: absolute; top: 0; left: 0; height: 100%; background: #e8c547; width: 0%; transition: width 0.3s; }

  /* Video Overlay */
  #overlay {
    position: fixed; inset: 0; background: rgba(4,6,12,0.95); backdrop-filter: blur(14px);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
  }
  #overlay.visible { opacity: 1; pointer-events: all; }
  #overlay-panel {
    width: 900px; max-width: 90vw; max-height: 90vh; background: rgba(10,12,20,0.95);
    border: 1px solid rgba(255,255,255,0.1); padding: 40px; display: flex; flex-direction: column;
    box-shadow: 0 40px 100px rgba(0,0,0,0.8); overflow-y: auto; position: relative;
  }
  #overlay-close {
    position: absolute; top: 20px; right: 20px; background: transparent; border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.6); font-family: inherit; font-size: 10px; letter-spacing: 0.2em; padding: 6px 12px; cursor: pointer;
  }
  #overlay-close:hover { color: #fff; border-color: #fff; }
  #overlay-brand { color: #e8c547; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 8px; }
  #overlay-title { font-size: 22px; font-weight: 400; margin-bottom: 24px; letter-spacing: 0.05em; }
  #overlay-video-container { width: 100%; background: #000; margin-bottom: 24px; aspect-ratio: 16/9; }
  #overlay-video { width: 100%; height: 100%; object-fit: contain; }
  #overlay-desc { color: rgba(255,255,255,0.6); font-size: 13px; line-height: 1.8; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="loading">
  <h1 id="load-text">Waking the Gallery...</h1>
  <div id="load-bar"><div id="load-fill"></div></div>
</div>

<div id="ui">
  <div id="guide-panel">
    <h3>Gallery Guide</h3>
    <div class="ctrl-row"><span class="ctrl-key">W A S D</span><span class="ctrl-desc">Walk</span></div>
    <div class="ctrl-row"><span class="ctrl-key">Mouse</span><span class="ctrl-desc">Look Around</span></div>
    <div class="ctrl-row"><span class="ctrl-key">Click</span><span class="ctrl-desc">Lock Camera</span></div>
    <div class="ctrl-row"><span class="ctrl-key">ESC</span><span class="ctrl-desc">Unlock Camera</span></div>
    <div class="ctrl-row"><span class="ctrl-key">E</span><span class="ctrl-desc">Interact with Screen</span></div>
  </div>

  <div id="map-panel">
    <h3>Location</h3>
    <canvas id="map-canvas" width="160" height="160"></canvas>
  </div>

  <div id="proximity-prompt">Press [ E ] to View Film</div>
</div>

<div id="overlay">
  <div id="overlay-panel">
    <button id="overlay-close">ESC / CLOSE</button>
    <div id="overlay-brand">BRAND</div>
    <h2 id="overlay-title">FILM TITLE</h2>
    <div id="overlay-video-container">
      <video id="overlay-video" controls controlsList="nodownload"></video>
    </div>
    <div id="overlay-desc">Film description and context goes here.</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// ---- Configuration & Data ----
// Adjusted for a long central corridor. Corridor is X: -4 to 4, Z: -10 to 46.
const VIDEOS = [
  // NIVEA: Large Room 1 (X: -24 to -4, Z: 0 to 20)
  { id: 'nivea_1', brand: 'NIVEA', title: 'Disney Collaboration', file: 'nivea_disney.mp4', x: -23.5, z: 5, rot: Math.PI/2 },
  { id: 'nivea_2', brand: 'NIVEA', title: 'Father\'s Day (Caucasian)', file: 'nivea_fathers_day_caucasian.mp4', x: -23.5, z: 15, rot: Math.PI/2 },
  { id: 'nivea_3', brand: 'NIVEA', title: 'Father\'s Day (Thai)', file: 'nivea_fathers_day_thai.mp4', x: -14, z: 0.5, rot: 0 },
  { id: 'nivea_4', brand: 'NIVEA MEN', title: 'Deep Tennis', file: 'nivea_men_deep_tennis.mp4', x: -14, z: 19.5, rot: Math.PI },
  
  // ALWAYS: Medium Room 2 (X: 4 to 16, Z: 0 to 12)
  { id: 'always_1', brand: 'ALWAYS', title: 'Get Unnoticed', file: 'always_get_unnoticed.mp4', x: 15.5, z: 3, rot: -Math.PI/2 },
  { id: 'always_2', brand: 'ALWAYS', title: 'Snap Poof Gone', file: 'always_snap_poof_gone.mp4', x: 15.5, z: 9, rot: -Math.PI/2 },
  
  // KELLOGGS: Small Room 3 (X: 4 to 16, Z: 16 to 24)
  { id: 'kellogs', brand: 'KELLOGGS', title: 'Tresor', file: 'kellogs_tresor.mp4', x: 15.5, z: 20, rot: -Math.PI/2 },
  
  // LLOYDS: Small Room 4 (X: -16 to -4, Z: 24 to 32)
  { id: 'lloyds', brand: 'LLOYDS', title: 'DOOH', file: 'lloyds_dooh.mp4', x: -15.5, z: 28, rot: Math.PI/2 },
  
  // TWILIO: Small Room 5 (X: 4 to 16, Z: 28 to 36)
  { id: 'twilio', brand: 'TWILIO', title: 'Clarity Builder Germany', file: 'twilio_clarity_builder_germany.mp4', x: 15.5, z: 32, rot: -Math.PI/2 },
  
  // STEREOCLIP: Small Room 6 (X: -16 to -4, Z: 36 to 44)
  { id: 'stereo', brand: 'STEREOCLIP', title: 'Music Video', file: 'stereoclip_music_video.mp4', x: -15.5, z: 40, rot: Math.PI/2 }
];

// Floorplan Walls
const WALLS = [
  // Boundaries
  { x: 0, z: -10, w: 48, d: 1 }, // Back (North)
  { x: 0, z: 46, w: 48, d: 1 },  // Front (South)
  { x: -24, z: 18, w: 1, d: 56 }, // Far Left Edge
  { x: 16, z: 18, w: 1, d: 56 },  // Far Right Edge

  // Nivea Room (-24 to -4, 0 to 20)
  { x: -14, z: 0, w: 20, d: 1 },
  { x: -14, z: 20, w: 20, d: 1 },
  { x: -4, z: 3, w: 1, d: 6 }, // Doorway between Z=6 and 14
  { x: -4, z: 17, w: 1, d: 6 },

  // Always Room (4 to 16, 0 to 12)
  { x: 10, z: 0, w: 12, d: 1 },
  { x: 10, z: 12, w: 12, d: 1 },
  { x: 4, z: 1.5, w: 1, d: 3 }, // Doorway between Z=3 and 9
  { x: 4, z: 10.5, w: 1, d: 3 },

  // Kelloggs Room (4 to 16, 16 to 24)
  { x: 10, z: 16, w: 12, d: 1 },
  { x: 10, z: 24, w: 12, d: 1 },
  { x: 4, z: 17, w: 1, d: 2 }, // Doorway between Z=18 and 22
  { x: 4, z: 23, w: 1, d: 2 },

  // Lloyds Room (-16 to -4, 24 to 32)
  { x: -10, z: 24, w: 12, d: 1 },
  { x: -10, z: 32, w: 12, d: 1 },
  { x: -4, z: 25, w: 1, d: 2 },
  { x: -4, z: 31, w: 1, d: 2 },

  // Twilio Room (4 to 16, 28 to 36)
  { x: 10, z: 28, w: 12, d: 1 },
  { x: 10, z: 36, w: 12, d: 1 },
  { x: 4, z: 29, w: 1, d: 2 },
  { x: 4, z: 35, w: 1, d: 2 },

  // Stereoclip Room (-16 to -4, 36 to 44)
  { x: -10, z: 36, w: 12, d: 1 },
  { x: -10, z: 44, w: 12, d: 1 },
  { x: -4, z: 37, w: 1, d: 2 },
  { x: -4, z: 43, w: 1, d: 2 }
];

// ---- Preloader State ----
let loadedAssets = 0;
const totalAssets = VIDEOS.length + 1; // +1 for the GLB character

function registerAssetLoaded() {
  loadedAssets++;
  const progress = (loadedAssets / totalAssets) * 100;
  document.getElementById('load-fill').style.width = progress + '%';
  
  if (loadedAssets === totalAssets) {
    document.getElementById('load-text').textContent = 'Welcome.';
    setTimeout(() => {
      document.getElementById('loading').style.opacity = '0';
      setTimeout(() => document.getElementById('loading').style.display = 'none', 800);
    }, 500);
  }
}

// ---- Setup Scene ----
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0; 
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060810);
scene.fog = new THREE.FogExp2(0x060810, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 150);

// ---- Bright & Soft Base Lighting ----
// Significantly boosted from last version to make walls highly visible
const ambient = new THREE.AmbientLight(0xffffff, 1.5); 
scene.add(ambient);
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444455, 1.0); 
scene.add(hemiLight);

// ---- Architecture & Textures ----
const texLoader = new THREE.TextureLoader();

const concreteBase = texLoader.load('concrete_texture/concrete_basecolor.webp', undefined, undefined, () => console.warn('Base texture missing'));
const concreteNorm = texLoader.load('concrete_texture/concrete_normal.webp');
const concreteRough = texLoader.load('concrete_texture/concrete_roughness.webp');

[concreteBase, concreteNorm, concreteRough].forEach(tex => {
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(12, 12);
});

// Much lighter materials so the architecture stands out
const wallMat = new THREE.MeshStandardMaterial({
  map: concreteBase, normalMap: concreteNorm, roughnessMap: concreteRough,
  color: 0x999999, roughness: 0.9, metalness: 0.1
});

const floorMat = new THREE.MeshStandardMaterial({
  map: concreteBase, normalMap: concreteNorm, roughnessMap: concreteRough,
  color: 0x777777, roughness: 0.7, metalness: 0.2
});

// Large Floor
const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), floorMat);
floor.position.set(0, 0, 18);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Generate Geometry Walls
WALLS.forEach(w => {
  // Lowered the walls to 4.5 so the camera doesn't feel quite as trapped
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w.w, 4.5, w.d), wallMat);
  wall.position.set(w.x, 2.25, w.z);
  wall.castShadow = true;
  wall.receiveShadow = true;
  scene.add(wall);
});

// ---- Video Screens ----
const screens = [];
VIDEOS.forEach(v => {
  const vidEl = document.createElement('video');
  vidEl.src = v.file;
  vidEl.crossOrigin = 'anonymous';
  vidEl.loop = true;
  vidEl.muted = true;
  vidEl.playsInline = true;
  
  vidEl.onloadeddata = () => {
    vidEl.play();
    registerAssetLoaded();
  };
  vidEl.onerror = () => {
    console.warn(`Could not load preview video: ${v.file}`);
    registerAssetLoaded();
  };

  const videoTex = new THREE.VideoTexture(vidEl);
  videoTex.colorSpace = THREE.SRGBColorSpace;
  
  const screenGeo = new THREE.PlaneGeometry(3.2, 1.8);
  const screenMat = new THREE.MeshStandardMaterial({ 
    color: 0x000000, 
    map: videoTex,
    emissiveMap: videoTex,
    emissive: 0xffffff,
    emissiveIntensity: 1.0,
    roughness: 0.2 
  });
  const screenMesh = new THREE.Mesh(screenGeo, screenMat);
  
  const offset = 0.52;
  let px = v.x, pz = v.z;
  if(v.rot === 0) pz += offset;
  if(v.rot === Math.PI) pz -= offset;
  if(v.rot === Math.PI/2) px += offset;
  if(v.rot === -Math.PI/2) px -= offset;

  screenMesh.position.set(px, 2.2, pz);
  screenMesh.rotation.y = v.rot;
  scene.add(screenMesh);

  // Soft glowing cast light for atmosphere
  const normal = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), v.rot);
  const glowLight = new THREE.PointLight(0xfff0dd, 0.8, 10);
  glowLight.position.set(px + normal.x * 1.5, 2.2, pz + normal.z * 1.5);
  scene.add(glowLight);

  screens.push({ mesh: screenMesh, data: v });
});

// ---- Character Setup with DRACOLoader ----
let character, mixer, idleAction, walkAction;

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

gltfLoader.load('clarity_builder.glb', 
  (gltf) => {
    character = gltf.scene;
    character.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
    
    // Spawn in the central corridor
    character.position.set(0, 0, -5);
    scene.add(character);
    
    if (gltf.animations && gltf.animations.length) {
      mixer = new THREE.AnimationMixer(character);
      const idle = gltf.animations.find(a => a.name.toLowerCase().includes('idle')) || gltf.animations[0];
      const walk = gltf.animations.find(a => a.name.toLowerCase().includes('walk')) || gltf.animations[1];
      
      if (idle) {
        idleAction = mixer.clipAction(idle);
        idleAction.play();
        idleAction.setEffectiveWeight(1);
      }
      if (walk) {
        walkAction = mixer.clipAction(walk);
        walkAction.play();
        walkAction.setEffectiveWeight(0);
      }
    }
    registerAssetLoaded();
  },
  undefined,
  (err) => { 
    console.error('Error loading character:', err); 
    registerAssetLoaded(); 
  }
);

// ---- Controls & Movement ----
const keys = { w:false, a:false, s:false, d:false, arrowup:false, arrowdown:false, arrowleft:false, arrowright:false };
let pointerLocked = false, isOverlayOpen = false;
let walkYaw = Math.PI, walkPitch = -0.2;

window.addEventListener('keydown', e => {
  if(isOverlayOpen) {
    if(e.key === 'Escape') closeOverlay();
    return;
  }
  const k = e.key.toLowerCase();
  if(keys.hasOwnProperty(k)) keys[k] = true;
  if(e.key === 'e' || e.key === 'E') triggerInteraction();
});

window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if(keys.hasOwnProperty(k)) keys[k] = false;
});

renderer.domElement.addEventListener('click', () => {
  if(!pointerLocked && !isOverlayOpen && loadedAssets === totalAssets) {
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = !!document.pointerLockElement;
});

document.addEventListener('mousemove', e => {
  if(!pointerLocked || isOverlayOpen) return;
  walkYaw -= e.movementX * 0.003;
  walkPitch -= e.movementY * 0.003;
  walkPitch = Math.max(-0.6, Math.min(0.5, walkPitch));
});

// ---- Interaction Logic ----
let activeScreen = null;
const promptEl = document.getElementById('proximity-prompt');

function triggerInteraction() {
  if(!activeScreen || isOverlayOpen) return;
  isOverlayOpen = true;
  document.exitPointerLock();
  
  const data = activeScreen.data;
  document.getElementById('overlay-brand').textContent = data.brand;
  document.getElementById('overlay-title').textContent = data.title;
  document.getElementById('overlay-desc').textContent = `Now viewing the ${data.brand} film: ${data.title}. Use the controls below to play, toggle volume, or expand to full screen.`;
  
  const vid = document.getElementById('overlay-video');
  vid.src = data.file;
  vid.play(); 
  
  document.getElementById('overlay').classList.add('visible');
}

function closeOverlay() {
  isOverlayOpen = false;
  document.getElementById('overlay').classList.remove('visible');
  const vid = document.getElementById('overlay-video');
  vid.pause();
  vid.src = ""; 
}
document.getElementById('overlay-close').addEventListener('click', closeOverlay);

// ---- Map System ----
const mapCtx = document.getElementById('map-canvas').getContext('2d');
function drawMap() {
  if(!character) return;
  
  const cw = 160, ch = 160;
  mapCtx.clearRect(0, 0, cw, ch);
  
  const scale = 2.0;
  const offsetX = cw/2;
  const offsetZ = ch/2 - 30;

  // Draw walls
  mapCtx.fillStyle = 'rgba(255,255,255,0.2)';
  WALLS.forEach(w => {
    const mx = offsetX + (w.x - w.w/2) * scale;
    const mz = offsetZ + (w.z - w.d/2) * scale;
    mapCtx.fillRect(mx, mz, w.w * scale, w.d * scale);
  });
  
  // Draw screens
  mapCtx.fillStyle = 'rgba(232,197,71,0.8)';
  screens.forEach(s => {
    const mx = offsetX + s.data.x * scale;
    const mz = offsetZ + s.data.z * scale;
    mapCtx.beginPath(); mapCtx.arc(mx, mz, 2, 0, Math.PI*2); mapCtx.fill();
  });
  
  // Draw player
  mapCtx.fillStyle = '#fff';
  const px = offsetX + character.position.x * scale;
  const pz = offsetZ + character.position.z * scale;
  mapCtx.beginPath(); mapCtx.arc(px, pz, 3, 0, Math.PI*2); mapCtx.fill();
}

// ---- Collision System ----
function checkCollision(pos, radius) {
  for(let i=0; i<WALLS.length; i++) {
    const w = WALLS[i];
    const hw = w.w / 2;
    const hd = w.d / 2;
    
    if (pos.x + radius > w.x - hw && pos.x - radius < w.x + hw &&
        pos.z + radius > w.z - hd && pos.z - radius < w.z + hd) {
      return true;
    }
  }
  return false;
}

// ---- Render Loop ----
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (character && !isOverlayOpen && loadedAssets === totalAssets) {
    // Movement Logic
    const moving = keys.w || keys.a || keys.s || keys.d || keys.arrowup || keys.arrowdown || keys.arrowleft || keys.arrowright;
    
    // Animation Blending
    if (mixer) {
      if (moving && walkAction && idleAction) { 
        walkAction.weight = THREE.MathUtils.lerp(walkAction.weight, 1, 0.15);
        idleAction.weight = THREE.MathUtils.lerp(idleAction.weight, 0, 0.15);
      } else if (!moving && walkAction && idleAction) { 
        walkAction.weight = THREE.MathUtils.lerp(walkAction.weight, 0, 0.15);
        idleAction.weight = THREE.MathUtils.lerp(idleAction.weight, 1, 0.15);
      }
      mixer.update(dt);
    }

    if (moving) {
      const dir = new THREE.Vector3(-Math.sin(walkYaw), 0, -Math.cos(walkYaw)).normalize();
      const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
      const move = new THREE.Vector3();
      
      if (keys.w || keys.arrowup) move.add(dir);
      if (keys.s || keys.arrowdown) move.sub(dir);
      if (keys.d || keys.arrowright) move.add(right);
      if (keys.a || keys.arrowleft) move.sub(right);
      
      if (move.lengthSq() > 0) {
        move.normalize();
        const speed = 4.0 * dt;
        
        const nextX = character.position.x + move.x * speed;
        const nextZ = character.position.z + move.z * speed;
        const radius = 0.5;

        if (!checkCollision({x: nextX, z: character.position.z}, radius)) {
          character.position.x = nextX;
        }
        if (!checkCollision({x: character.position.x, z: nextZ}, radius)) {
          character.position.z = nextZ;
        }
        
        character.rotation.y = THREE.MathUtils.lerp(character.rotation.y, Math.atan2(move.x, move.z), 0.15);
      }
    }

    // Camera follow (Third Person)
    const camDist = 4.5;
    const camHeight = 2.2;
    const cp = character.position;
    const tPos = new THREE.Vector3(
      cp.x + Math.sin(walkYaw) * Math.cos(walkPitch) * camDist,
      cp.y - Math.sin(walkPitch) * camDist + camHeight,
      cp.z + Math.cos(walkYaw) * Math.cos(walkPitch) * camDist
    );
    
    camera.position.lerp(tPos, 0.15);
    camera.lookAt(cp.x, cp.y + 1.4, cp.z);

    // Proximity checking for Interaction
    let closest = null;
    let minDist = 3.5;
    screens.forEach(s => {
      const d = character.position.distanceTo(s.mesh.position);
      if(d < minDist) { minDist = d; closest = s; }
    });

    if(closest !== activeScreen) {
      activeScreen = closest;
      if(activeScreen) promptEl.classList.add('visible');
      else promptEl.classList.remove('visible');
    }
    
    drawMap();
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
