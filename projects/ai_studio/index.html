<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Virtual Art Gallery - Expanded</title>
<link href="data:," rel="icon"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'DM Mono', monospace; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  
  #ui { position: fixed; inset: 0; pointer-events: none; }
  
  #guide-panel {
    position: absolute; top: 20px; left: 20px;
    background: rgba(4,6,10,0.85); border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px); padding: 18px; width: 260px;
  }
  #guide-panel h3 { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; margin-bottom: 14px; color: rgba(232,197,71,0.8); font-weight: 400; }
  .ctrl-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .ctrl-key { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); font-size: 9px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; }
  .ctrl-desc { color: rgba(255,255,255,0.6); font-size: 10px; letter-spacing: 0.1em; line-height: 1.4; }

  #map-panel {
    position: absolute; top: 20px; right: 20px;
    background: rgba(4,6,10,0.85); border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px); padding: 18px; text-align: center;
  }
  #map-panel h3 { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 14px; font-weight: 400; }
  #map-canvas { border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.5); width: 160px; height: 160px; }

  #proximity-prompt {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    color: rgba(232,197,71,0.9); font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
    background: rgba(6,8,16,0.95); border: 1px solid rgba(232,197,71,0.4);
    padding: 12px 24px; backdrop-filter: blur(12px); border-radius: 4px;
    opacity: 0; transition: opacity 0.4s ease;
  }
  #proximity-prompt.visible { opacity: 1; }

  #loading {
    position: fixed; inset: 0; background: #030408; z-index: 300;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s ease; pointer-events: all;
  }
  #loading h1 { font-size: 14px; letter-spacing: 0.4em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 20px; font-weight: 400; text-align: center; }
  #load-bar { width: 240px; height: 1px; background: rgba(255,255,255,0.1); position: relative; margin-bottom: 30px; }
  #load-fill { position: absolute; top: 0; left: 0; height: 100%; background: #e8c547; width: 0%; transition: width 0.3s; }
  #enter-btn {
    display: none; background: transparent; border: 1px solid rgba(232,197,71,0.5);
    color: rgba(232,197,71,0.9); font-family: inherit; font-size: 11px; letter-spacing: 0.3em;
    padding: 12px 32px; cursor: pointer; text-transform: uppercase; transition: all 0.3s;
  }
  #enter-btn:hover { background: rgba(232,197,71,0.1); border-color: #e8c547; color: #e8c547; }

  #overlay {
    position: fixed; inset: 0; background: rgba(2,3,6,0.95); backdrop-filter: blur(14px);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
  }
  #overlay.visible { opacity: 1; pointer-events: all; }
  #overlay-panel {
    width: 900px; max-width: 90vw; max-height: 90vh; background: rgba(8,10,14,0.98);
    border: 1px solid rgba(255,255,255,0.1); padding: 40px; display: flex; flex-direction: column;
    box-shadow: 0 40px 100px rgba(0,0,0,0.9); overflow-y: auto; position: relative;
  }
  #overlay-close {
    position: absolute; top: 20px; right: 20px; background: transparent; border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.6); font-family: inherit; font-size: 10px; letter-spacing: 0.2em; padding: 6px 12px; cursor: pointer;
  }
  #overlay-close:hover { color: #fff; border-color: #fff; }
  #overlay-brand { color: #e8c547; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 8px; }
  #overlay-title { font-size: 22px; font-weight: 400; margin-bottom: 24px; letter-spacing: 0.05em; }
  #overlay-video-container { width: 100%; background: #000; margin-bottom: 24px; aspect-ratio: 16/9; }
  #overlay-video { width: 100%; height: 100%; object-fit: contain; }
  #overlay-desc { color: rgba(255,255,255,0.5); font-size: 13px; line-height: 1.8; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/"
  }

<body>

<div id="loading">
  <h1 id="load-text">Waking the Gallery...</h1>
  <div id="load-bar"><div id="load-fill"></div></div>
  <button id="enter-btn">Enter Gallery</button>
</div>

<div id="ui">
  <div id="guide-panel">
    <h3>Gallery Guide</h3>
    <div class="ctrl-row"><span class="ctrl-key">W A S D</span><span class="ctrl-desc">Walk</span></div>
    <div class="ctrl-row"><span class="ctrl-key">Mouse</span><span class="ctrl-desc">Look Around</span></div>
    <div class="ctrl-row"><span class="ctrl-key">Click</span><span class="ctrl-desc">Lock Camera</span></div>
    <div class="ctrl-row"><span class="ctrl-key">ESC</span><span class="ctrl-desc">Unlock Camera</span></div>
    <div class="ctrl-row"><span class="ctrl-key">E</span><span class="ctrl-desc">Interact with Screen</span></div>
  </div>

  <div id="map-panel">
    <h3>Location</h3>
    <canvas id="map-canvas" width="160" height="160"></canvas>
  </div>

  <div id="proximity-prompt">Press [ E ] to View Film</div>
</div>

<div id="overlay">
  <div id="overlay-panel">
    <button id="overlay-close">ESC / CLOSE</button>
    <div id="overlay-brand">BRAND</div>
    <h2 id="overlay-title">FILM TITLE</h2>
    <div id="overlay-video-container">
      <video id="overlay-video" controls controlsList="nodownload"></video>
    </div>
    <div id="overlay-desc">Film description and context goes here.</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

function lerpAngle(start, end, amt) {
  let delta = end - start;
  while (delta > Math.PI) delta -= Math.PI * 2;
  while (delta < -Math.PI) delta += Math.PI * 2;
  return start + delta * amt;
}

// ---- EXACT COORDINATES FOR 100% FLUSH MOUNTING ----
// Screen offset from wall face
const OFF = 0.02;

// Outer walls (Inner faces): West: -20, East: 20, North: -10, South: 60
// Corridor: -5 to 5.
// Left Partition 1: Z face N=14.5, S=15.5
// Left Partition 2: Z face N=34.5, S=35.5
// Right Partition 1: Z face N=9.5, S=10.5
// Right Partition 2: Z face N=24.5, S=25.5

const VIDEOS = [
  // NIVEA (Left 1): Z from -10 to 14.5
  { id: 'nivea_1', brand: 'NIVEA', title: 'Disney Collaboration', file: 'nivea_disney.mp4', x: -20+OFF, z: -2, rot: Math.PI/2 },
  { id: 'nivea_2', brand: 'NIVEA', title: 'Father\'s Day (Caucasian)', file: 'nivea_fathers_day_caucasian.mp4', x: -20+OFF, z: 8, rot: Math.PI/2 },
  { id: 'nivea_3', brand: 'NIVEA', title: 'Father\'s Day (Thai)', file: 'nivea_fathers_day_thai.mp4', x: -12.5, z: -10+OFF, rot: 0 },
  { id: 'nivea_4', brand: 'NIVEA MEN', title: 'Deep Tennis', file: 'nivea_men_deep_tennis.mp4', x: -12.5, z: 14.5-OFF, rot: Math.PI },
  
  // ALWAYS (Right 1): Z from -10 to 9.5
  { id: 'always_1', brand: 'ALWAYS', title: 'Get Unnoticed', file: 'always_get_unnoticed.mp4', x: 20-OFF, z: -2, rot: -Math.PI/2 },
  { id: 'always_2', brand: 'ALWAYS', title: 'Snap Poof Gone', file: 'always_snap_poof_gone.mp4', x: 20-OFF, z: 6, rot: -Math.PI/2 },
  
  // KELLOGGS (Right 2): Z from 10.5 to 24.5
  { id: 'kellogs', brand: 'KELLOGGS', title: 'Tresor', file: 'kellogs_tresor.mp4', x: 20-OFF, z: 17.5, rot: -Math.PI/2 },
  
  // LLOYDS (Left 2): Z from 15.5 to 34.5
  { id: 'lloyds', brand: 'LLOYDS', title: 'DOOH', file: 'lloyds_dooh.mp4', x: -20+OFF, z: 25, rot: Math.PI/2 },
  
  // TWILIO (Right 3): Z from 25.5 to 60
  { id: 'twilio', brand: 'TWILIO', title: 'Clarity Builder Germany', file: 'twilio_clarity_builder_germany.mp4', x: 20-OFF, z: 42, rot: -Math.PI/2 },
  
  // STEREOCLIP (Left 3): Z from 35.5 to 60
  { id: 'stereo', brand: 'STEREOCLIP', title: 'Music Video', file: 'stereoclip_music_video.mp4', x: -20+OFF, z: 47, rot: Math.PI/2 }
];

const WALLS = [
  // Outer Boundaries
  {x: 0, z: -10.5, w: 42, d: 1}, // North
  {x: 0, z: 60.5, w: 42, d: 1}, // South
  {x: -20.5, z: 25, w: 1, d: 72}, // West
  {x: 20.5, z: 25, w: 1, d: 72},  // East

  // Left Room Partitions (X from -20 to -5, width 15, center -12.5)
  {x: -12.5, z: 15, w: 15, d: 1},
  {x: -12.5, z: 35, w: 15, d: 1},

  // Right Room Partitions (X from 5 to 20, width 15, center 12.5)
  {x: 12.5, z: 10, w: 15, d: 1},
  {x: 12.5, z: 25, w: 15, d: 1},

  // Corridor Pillars / Archways to clearly define rooms without closing them off
  {x: -5, z: 15, w: 1, d: 4},
  {x: -5, z: 35, w: 1, d: 4},
  {x: 5, z: 10, w: 1, d: 4},
  {x: 5, z: 25, w: 1, d: 4},
];

let loadedAssets = 0;
const totalAssets = VIDEOS.length + 1; 
let audioUnlocked = false;

function registerAssetLoaded() {
  loadedAssets++;
  const progress = (loadedAssets / totalAssets) * 100;
  document.getElementById('load-fill').style.width = progress + '%';
  
  if (loadedAssets === totalAssets) {
    document.getElementById('load-text').textContent = 'Gallery Ready.';
    const btn = document.getElementById('enter-btn');
    btn.style.display = 'block';
    
    btn.addEventListener('click', () => {
      audioUnlocked = true;
      screens.forEach(s => {
        s.video.play().catch(e => console.warn('Autoplay blocked:', e));
      });
      document.getElementById('loading').style.opacity = '0';
      setTimeout(() => document.getElementById('loading').style.display = 'none', 800);
    });
  }
}

// ---- Setup Scene ----
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0; 

document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 150);

const ambient = new THREE.AmbientLight(0xffffff, 1.0); 
scene.add(ambient);
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x112233, 1.0); 
scene.add(hemiLight);

const texLoader = new THREE.TextureLoader();
const concreteBase = texLoader.load('concrete_texture/concrete_basecolor.webp', undefined, undefined, () => console.warn('Base texture missing'));
const concreteNorm = texLoader.load('concrete_texture/concrete_normal.webp');
const concreteRough = texLoader.load('concrete_texture/concrete_roughness.webp');

concreteBase.colorSpace = THREE.SRGBColorSpace;

[concreteBase, concreteNorm, concreteRough].forEach(tex => {
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(20, 20); 
});

const wallMat = new THREE.MeshStandardMaterial({
  map: concreteBase, normalMap: concreteNorm, roughnessMap: concreteRough,
  color: 0x999999, roughness: 0.8, metalness: 0.1
});

const floorMat = new THREE.MeshStandardMaterial({
  map: concreteBase, normalMap: concreteNorm, roughnessMap: concreteRough,
  color: 0x666666, roughness: 0.6, metalness: 0.15 
});

const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), floorMat);
floor.position.set(0, 0, 25);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Ceilings and Walls are 8 meters tall now
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), wallMat);
ceiling.position.set(0, 8.0, 25);
ceiling.rotation.x = Math.PI / 2;
scene.add(ceiling);

const WALL_HEIGHT = 8.0;
WALLS.forEach(w => {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w.w, WALL_HEIGHT, w.d), wallMat);
  wall.position.set(w.x, WALL_HEIGHT/2, w.z);
  wall.castShadow = true;
  wall.receiveShadow = true;
  scene.add(wall);
});

// ---- Video Screens ----
const screens = [];
VIDEOS.forEach(v => {
  const vidEl = document.createElement('video');
  vidEl.src = v.file;
  vidEl.crossOrigin = 'anonymous';
  vidEl.loop = true;
  vidEl.playsInline = true;
  vidEl.muted = false; 
  vidEl.volume = 0; 
  
  vidEl.onloadeddata = () => {
    vidEl.play().catch(()=>{}); 
    registerAssetLoaded();
  };
  vidEl.onerror = () => {
    registerAssetLoaded();
  };

  const videoTex = new THREE.VideoTexture(vidEl);
  videoTex.colorSpace = THREE.SRGBColorSpace;
  
  // Massive 6.4 x 3.6 screens (16:9)
  const screenGeo = new THREE.PlaneGeometry(6.4, 3.6);
  
  const screenMat = new THREE.MeshBasicMaterial({ 
    color: 0xffffff, 
    map: videoTex,
    toneMapped: false // Prevents washed out colors
  });
  const screenMesh = new THREE.Mesh(screenGeo, screenMat);
  
  screenMesh.position.set(v.x, 3.5, v.z);
  screenMesh.rotation.y = v.rot;
  scene.add(screenMesh);

  // Soft glowing cast light bouncing off the concrete
  const normal = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), v.rot);
  const glowLight = new THREE.PointLight(0xfff0dd, 0.8, 12, 2);
  glowLight.position.set(v.x + normal.x * 1.5, 3.5, v.z + normal.z * 1.5);
  scene.add(glowLight);

  // Spot light from above
  const spot = new THREE.SpotLight(0xffeedd, 8.0, 20, Math.PI/4, 0.5, 1.5);
  spot.position.set(v.x + normal.x * 2.0, 7.5, v.z + normal.z * 2.0);
  spot.target = screenMesh;
  scene.add(spot);

  screens.push({ mesh: screenMesh, data: v, video: vidEl });
});

// ---- Character Setup with DRACOLoader ----
let character, mixer, idleAction, walkAction;
let currentWeight = 0; 

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

gltfLoader.load('clarity_builder.glb', 
  (gltf) => {
    character = gltf.scene;
    character.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
    
    character.position.set(0, 0, 0);
    character.rotation.y = 0;
    scene.add(character);
    
    if (gltf.animations && gltf.animations.length) {
      mixer = new THREE.AnimationMixer(character);
      const idle = gltf.animations.find(a => a.name.toLowerCase().includes('idle')) || gltf.animations[0];
      const walk = gltf.animations.find(a => a.name.toLowerCase().includes('walk')) || gltf.animations[1];
      
      if (idle) {
        idleAction = mixer.clipAction(idle);
        idleAction.play();
        idleAction.setEffectiveWeight(1);
      }
      if (walk) {
        walkAction = mixer.clipAction(walk);
        walkAction.play();
        walkAction.setEffectiveWeight(0);
      }
    }
    registerAssetLoaded();
  },
  undefined,
  (err) => { 
    console.error('Error loading character:', err); 
    registerAssetLoaded(); 
  }
);

// ---- Controls & Movement ----
const keys = { w:false, a:false, s:false, d:false, arrowup:false, arrowdown:false, arrowleft:false, arrowright:false };
let pointerLocked = false, isOverlayOpen = false;
let walkYaw = Math.PI, walkPitch = -0.1;

window.addEventListener('keydown', e => {
  if(isOverlayOpen) {
    if(e.key === 'Escape') closeOverlay();
    return;
  }
  const k = e.key.toLowerCase();
  if(keys.hasOwnProperty(k)) keys[k] = true;
  if(e.key === 'e' || e.key === 'E') triggerInteraction();
});

window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if(keys.hasOwnProperty(k)) keys[k] = false;
});

renderer.domElement.addEventListener('click', () => {
  if(!pointerLocked && !isOverlayOpen && audioUnlocked) {
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = !!document.pointerLockElement;
});

document.addEventListener('mousemove', e => {
  if(!pointerLocked || isOverlayOpen) return;
  walkYaw -= e.movementX * 0.003;
  walkPitch -= e.movementY * 0.003;
  walkPitch = Math.max(-0.4, Math.min(0.5, walkPitch));
});

// ---- Interaction & Overlay Logic ----
let activeScreen = null;
const promptEl = document.getElementById('proximity-prompt');
const overlayVid = document.getElementById('overlay-video');

function triggerInteraction() {
  if(!activeScreen || isOverlayOpen) return;
  isOverlayOpen = true;
  document.exitPointerLock();
  
  const data = activeScreen.data;
  document.getElementById('overlay-brand').textContent = data.brand;
  document.getElementById('overlay-title').textContent = data.title;
  document.getElementById('overlay-desc').textContent = `Now viewing the ${data.brand} film: ${data.title}. Use the controls below to expand to full screen.`;
  
  screens.forEach(s => s.video.volume = 0);
  
  overlayVid.src = data.file;
  overlayVid.volume = 1;
  overlayVid.play(); 
  
  document.getElementById('overlay').classList.add('visible');
}

function closeOverlay() {
  isOverlayOpen = false;
  document.getElementById('overlay').classList.remove('visible');
  overlayVid.pause();
  overlayVid.src = ""; 
}
document.getElementById('overlay-close').addEventListener('click', closeOverlay);

// ---- Map System ----
const mapCtx = document.getElementById('map-canvas').getContext('2d');
function drawMap() {
  if(!character) return;
  
  const cw = 160, ch = 160;
  mapCtx.clearRect(0, 0, cw, ch);
  
  const scale = 2.0; 
  const offsetX = cw/2;
  const offsetZ = ch/2 - 25 * scale;

  mapCtx.fillStyle = 'rgba(255,255,255,0.2)';
  WALLS.forEach(w => {
    const mx = offsetX + (w.x - w.w/2) * scale;
    const mz = offsetZ + (w.z - w.d/2) * scale;
    mapCtx.fillRect(mx, mz, w.w * scale, w.d * scale);
  });
  
  mapCtx.fillStyle = 'rgba(232,197,71,0.8)';
  screens.forEach(s => {
    const mx = offsetX + s.data.x * scale;
    const mz = offsetZ + s.data.z * scale;
    mapCtx.beginPath(); mapCtx.arc(mx, mz, 2, 0, Math.PI*2); mapCtx.fill();
  });
  
  mapCtx.fillStyle = '#fff';
  const px = offsetX + character.position.x * scale;
  const pz = offsetZ + character.position.z * scale;
  mapCtx.beginPath(); mapCtx.arc(px, pz, 3, 0, Math.PI*2); mapCtx.fill();
}

// ---- Collision System ----
function checkCollision(pos, radius) {
  for(let i=0; i<WALLS.length; i++) {
    const w = WALLS[i];
    const hw = w.w / 2;
    const hd = w.d / 2;
    
    if (pos.x + radius > w.x - hw && pos.x - radius < w.x + hw &&
        pos.z + radius > w.z - hd && pos.z - radius < w.z + hd) {
      return true;
    }
  }
  return false;
}

// ---- Render Loop ----
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (character && audioUnlocked && !isOverlayOpen) {
    const moving = keys.w || keys.a || keys.s || keys.d || keys.arrowup || keys.arrowdown || keys.arrowleft || keys.arrowright;
    
    if (mixer) {
      currentWeight = THREE.MathUtils.lerp(currentWeight, moving ? 1 : 0, 0.15);
      if(idleAction) idleAction.setEffectiveWeight(1 - currentWeight);
      if(walkAction) walkAction.setEffectiveWeight(currentWeight);
      mixer.update(dt);
    }

    let targetRot = Math.atan2(-Math.sin(walkYaw), -Math.cos(walkYaw));

    if (moving) {
      const dir = new THREE.Vector3(-Math.sin(walkYaw), 0, -Math.cos(walkYaw)).normalize();
      const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
      const move = new THREE.Vector3();
      
      if (keys.w || keys.arrowup) move.add(dir);
      if (keys.s || keys.arrowdown) move.sub(dir);
      if (keys.d || keys.arrowright) move.add(right);
      if (keys.a || keys.arrowleft) move.sub(right);
      
      if (move.lengthSq() > 0) {
        move.normalize();
        const speed = 4.5 * dt;
        
        targetRot = Math.atan2(move.x, move.z);

        const nextX = character.position.x + move.x * speed;
        const nextZ = character.position.z + move.z * speed;
        const radius = 0.4; 

        if (!checkCollision({x: nextX, z: character.position.z}, radius)) {
          character.position.x = nextX;
        }
        if (!checkCollision({x: character.position.x, z: nextZ}, radius)) {
          character.position.z = nextZ;
        }
      }
    }
    
    character.rotation.y = lerpAngle(character.rotation.y, targetRot, 0.2);

    const camDist = 5.0;
    const camHeight = 2.0;
    const cp = character.position;
    const tPos = new THREE.Vector3(
      cp.x + Math.sin(walkYaw) * Math.cos(walkPitch) * camDist,
      cp.y - Math.sin(walkPitch) * camDist + camHeight,
      cp.z + Math.cos(walkYaw) * Math.cos(walkPitch) * camDist
    );
    
    if(checkCollision({x: tPos.x, z: tPos.z}, 0.2)) {
      tPos.lerp(cp, 0.6); 
    }
    
    camera.position.lerp(tPos, 0.25); 
    camera.lookAt(cp.x, cp.y + 1.4, cp.z);

    let closest = null;
    let minDist = 4.5; 
    
    const MAX_AUDIO_DIST = 15.0; 
    const MIN_AUDIO_DIST = 5.0; 

    screens.forEach(s => {
      const d = character.position.distanceTo(s.mesh.position);
      
      if (s.video.paused) s.video.play().catch(()=>{});

      if(d < minDist) { minDist = d; closest = s; }

      if (d < MAX_AUDIO_DIST) {
        let vol = 1.0 - ((d - MIN_AUDIO_DIST) / (MAX_AUDIO_DIST - MIN_AUDIO_DIST));
        s.video.volume = Math.max(0, Math.min(1, vol));
      } else {
        s.video.volume = 0;
      }
    });

    if(closest !== activeScreen) {
      activeScreen = closest;
      if(activeScreen) promptEl.classList.add('visible');
      else promptEl.classList.remove('visible');
    }
    
    drawMap();
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
