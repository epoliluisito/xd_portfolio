<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Enrico Poli — Sensemaker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#000; color:#fff;
  font-family:'Cormorant Garamond',serif;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

/* ── INTRO ── */
#intro {
  position:fixed; inset:0; z-index:900;
  background:#000;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:20px;
  transition:opacity 2s ease;
}
#intro.out { opacity:0; pointer-events:none; }
#i1 { font-weight:300; font-size:clamp(28px,7vw,52px); letter-spacing:.16em; color:rgba(255,255,255,.9); opacity:0; transition:opacity 1.6s ease; }
#i2 { font-family:'Courier Prime',monospace; font-size:clamp(9px,1.8vw,11px); letter-spacing:.28em; text-transform:uppercase; color:rgba(255,255,255,.2); opacity:0; transition:opacity 1.6s ease; }

/* ── VIEWPORT ── */
#vp {
  position:fixed; inset:0; z-index:1;
  overflow:hidden; cursor:grab;
  opacity:0; pointer-events:none;
  transition:opacity 1.4s ease;
}
#vp.on { opacity:1; pointer-events:all; }
#vp.dragging { cursor:grabbing; }

#world {
  position:absolute; top:0; left:0;
  width:6000px; height:5000px;
  transform-origin:0 0;
}
#wsvg {
  position:absolute; inset:0; width:100%; height:100%;
  pointer-events:none; overflow:visible;
}

/* ── WORLD NODES ── */
.wn { position:absolute; transform:translate(-50%,-50%); pointer-events:none; }

/* Signal dot */
#sig-dot {
  width:50px; height:50px; border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  cursor:pointer; pointer-events:all;
  animation:breathe 4s ease-in-out infinite;
  transition:width .7s ease, height .7s ease, border-color .5s ease;
}
#sig-dot:hover { border-color:rgba(255,255,255,.4); }
#sig-dot.small { width:7px; height:7px; border-color:rgba(255,255,255,.22); animation:none; cursor:default; }

#sig-hint {
  position:absolute; left:50%; top:calc(50% + 38px); transform:translateX(-50%);
  font-family:'Courier Prime',monospace; font-size:9px;
  letter-spacing:.26em; text-transform:uppercase;
  color:rgba(255,255,255,.14); white-space:nowrap;
  animation:blink 3.5s ease-in-out infinite; transition:opacity .4s;
}
#sig-hint.hide { opacity:0; }
#sig-label {
  position:absolute; left:50%; top:calc(50% + 64px); transform:translateX(-50%);
  font-family:'Cormorant Garamond',serif; font-style:italic;
  font-size:21px; color:rgba(255,255,255,.42); letter-spacing:.07em; white-space:nowrap;
  opacity:0; transition:opacity .9s ease;
}
#sig-label.on { opacity:1; }
#sig-title {
  position:absolute; left:50%; top:calc(50% + 20px); transform:translateX(-50%);
  font-family:'Courier Prime',monospace; font-size:9px;
  letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.22); white-space:nowrap;
  opacity:0; transition:opacity .6s ease;
}
#sig-title.on { opacity:1; }

/* Explanation block */
#exp-block {
  width:460px; text-align:center;
  opacity:0; pointer-events:none; transition:opacity 1.4s ease;
}
#exp-block.on  { opacity:1; pointer-events:all; }
#exp-block.off { opacity:0; pointer-events:none; transition:opacity .5s ease; }
.exp-tag { font-family:'Courier Prime',monospace; font-size:9px; letter-spacing:.26em; text-transform:uppercase; color:rgba(255,255,255,.18); margin-bottom:22px; }
.exp-body { font-family:'Cormorant Garamond',serif; font-size:18px; font-weight:300; font-style:italic; line-height:1.9; color:rgba(255,255,255,.48); }
.exp-body b { font-weight:400; font-style:normal; color:rgba(255,255,255,.78); }

/* Matrix block */
#mat-block { text-align:center; opacity:0; pointer-events:none; transition:opacity .8s ease; }
#mat-block.on  { opacity:1; pointer-events:all; }
#mat-block.off { opacity:0; pointer-events:none; transition:opacity .5s ease; }

#mchars { font-family:'Courier Prime',monospace; font-size:clamp(32px,5vw,52px); letter-spacing:.32em; display:flex; justify-content:center; margin-right:-.32em; cursor:pointer; }
.mc { display:inline-block; min-width:.64em; text-align:center; color:rgba(255,255,255,.1); transition:color .25s; }
.mc.on { color:rgba(255,255,255,.84); }
#m-hint { font-family:'Courier Prime',monospace; font-size:9px; letter-spacing:.26em; text-transform:uppercase; color:rgba(255,255,255,.16); margin-top:16px; animation:blink 3.2s ease-in-out infinite; transition:opacity .4s; }
#m-hint.hide { opacity:0; }
#m-exp { width:420px; margin:26px auto 0; font-family:'Cormorant Garamond',serif; font-size:17px; font-style:italic; font-weight:300; line-height:1.85; color:rgba(255,255,255,0); transition:color 1.6s ease; }
#m-exp.on { color:rgba(255,255,255,.4); }

/* INTENT columns */
.icol { position:absolute; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; text-align:center; }
.icol-ltr { font-family:'Courier Prime',monospace; font-size:clamp(32px,5vw,52px); letter-spacing:.32em; color:rgba(255,255,255,.84); }
.icol-name { font-family:'Courier Prime',monospace; font-size:8px; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.26); margin-top:7px; white-space:nowrap; }
.icol-stem { width:1px; height:0; background:rgba(255,255,255,.1); margin-top:10px; transition:height 1.2s cubic-bezier(.4,0,.2,1); }
.icol-dims { display:flex; flex-direction:column; align-items:center; }
.dim-wrap { display:flex; flex-direction:column; align-items:center; }
.dim-name { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:13px; color:rgba(255,255,255,.3); white-space:nowrap; padding:4px 8px; opacity:0; transition:opacity 1.2s ease; }
.dim-name.show { opacity:1; }
.dim-stem { width:1px; height:0; background:rgba(255,255,255,.06); transition:height 0.9s cubic-bezier(.4,0,.2,1); }
.sub-row { display:flex; gap:5px; justify-content:center; flex-wrap:wrap; max-width:120px; }
.sub-tag { font-family:'Courier Prime',monospace; font-size:7px; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.14); padding:2px 4px; opacity:0; transition:opacity 1.1s ease; }
.sub-tag.show { opacity:1; }

/* Output nodes */
.onode { position:absolute; transform:translate(-50%, -6px); display:flex; flex-direction:column; align-items:center; text-align:center; width:120px; opacity:0; transition:opacity 1.8s ease, transform 1.8s cubic-bezier(.4,0,.2,1); }
.onode.show { opacity:1; transform:translate(-50%, 0); }
.onode-dot { width:7px; height:7px; border-radius:50%; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.05); flex-shrink:0; }
.onode-lbl { font-family:'Courier Prime',monospace; font-size:8px; letter-spacing:.11em; text-transform:uppercase; color:rgba(255,255,255,.28); margin-top:8px; line-height:1.6; }

/* Action buttons */
.abtn { font-family:'Courier Prime',monospace; font-size:9px; letter-spacing:.26em; text-transform:uppercase; color:rgba(255,255,255,.2); cursor:pointer; padding:18px 0; display:block; text-align:center; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .6s ease, color .3s; }
.abtn.on { opacity:1; pointer-events:all; animation:btn-pulse 3s ease-in-out infinite; }
.abtn:hover { color:rgba(255,255,255,.8); }

/* World sort panel — positioned in world space, just below subfields */
#world-panel { position:absolute; transform:translateX(-50%); text-align:center; width:640px; pointer-events:none; opacity:0; transition:opacity 1.4s ease; }
#world-panel.on { opacity:1; pointer-events:auto; }
#wp-q { font-family:'Courier Prime',monospace; font-size:9px; letter-spacing:.24em; text-transform:uppercase; color:rgba(255,255,255,.18); margin-bottom:14px; }
#wp-opts { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.sopt { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:16px; color:rgba(255,255,255,.36); cursor:pointer; padding:8px 14px; border:1px solid rgba(255,255,255,.1); transition:all .3s; pointer-events:all; }
.sopt:hover { color:rgba(255,255,255,.72); border-color:rgba(255,255,255,.26); }
.sopt.chosen { color:rgba(255,255,255,.86); border-color:rgba(255,255,255,.42); }
#btn-syn { display:block; margin:16px auto 0; font-family:'Courier Prime',monospace; font-size:9px; letter-spacing:.26em; text-transform:uppercase; color:rgba(255,255,255,.2); cursor:pointer; padding:8px 0; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .6s, color .3s; }
#btn-syn.on { opacity:1; pointer-events:all; animation:btn-pulse 3s ease-in-out infinite; }
#btn-syn:hover { color:rgba(255,255,255,.8); }

/* Byline */
#byline { position:fixed; bottom:18px; right:20px; z-index:700; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:11px; letter-spacing:.08em; color:rgba(255,255,255,.1); pointer-events:none; opacity:0; transition:opacity 1.2s; }
#byline.on { opacity:1; }

@keyframes breathe {
  0%,100% { border-color:rgba(255,255,255,.13); box-shadow:0 0 0 0 rgba(255,255,255,.02); }
  50%      { border-color:rgba(255,255,255,.3);  box-shadow:0 0 0 12px rgba(255,255,255,.01), 0 0 28px rgba(255,255,255,.05); }
}
@keyframes blink { 0%,100%{opacity:.14} 50%{opacity:.52} }
@keyframes btn-pulse { 0%,100%{opacity:.22} 50%{opacity:.68} }
</style>
</head>
<body>

<div id="intro">
  <div id="i1">Sensemaking</div>
  <div id="i2">a narrative systems practice</div>
</div>

<div id="vp">
  <div id="world"><svg id="wsvg"></svg></div>
</div>

<div id="byline">Enrico Poli</div>

<script>
// ══════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════
const INTENT = [
  { L:'I', W:'Identity',  dims:[
    { n:'voice',        s:['authorship','register','grain'] },
    { n:'visual field', s:['palette','form','texture'] },
    { n:'positioning',  s:['difference','resonance'] },
  ]},
  { L:'N', W:'Narrative', dims:[
    { n:'arc',      s:['opening','crisis','resolution'] },
    { n:'tension',  s:['conflict','stakes','desire'] },
    { n:'tone',     s:['register','temperature','pace'] },
  ]},
  { L:'T', W:'Territory', dims:[
    { n:'context',  s:['situation','field','adjacents'] },
    { n:'culture',  s:['codes','references','taboos'] },
    { n:'timing',   s:['window','saturation','readiness'] },
  ]},
  { L:'E', W:'Emotion',   dims:[
    { n:'desire',     s:['longing','projection'] },
    { n:'memory',     s:['anchor','trigger','trace'] },
    { n:'sensation',  s:['body','atmosphere','threshold'] },
  ]},
  { L:'N', W:'Need',      dims:[
    { n:'problem',   s:['stated','latent','systemic'] },
    { n:'audience',  s:['who','why them','readiness'] },
    { n:'urgency',   s:['pressure','stakes'] },
  ]},
  { L:'T', W:'Time',      dims:[
    { n:'moment',       s:['now','inflection'] },
    { n:'sequence',     s:['before','during','after'] },
    { n:'ephemerality', s:['duration','trace','decay'] },
  ]},
];

const CROSS = [
  [0,1],[1,2],[2,3],[3,4],[4,5],
  [0,2],[1,3],[2,4],[3,5],
  [0,3],[1,4],[2,5],
  [0,4],[1,5],[0,5],
  [0,3],[2,5],[1,4],[0,2],[3,5],
];

const OUTPUTS = [
  'Visual Identity\nSystem','Narrative\nFramework','Experience\nArchitecture',
  'Brand\nStrategy','Creative Brief\n& Direction','Film &\nScreenplay','Digital\nSystem',
];

const WEIGHTS = {
  decide:[1,.3,.5,.3,1,.5], feel:[.3,1,.3,1,.3,.5],
  act:[.5,.5,1,.3,.5,1],    system:[1,1,.5,.5,.5,.5],
};

// ══════════════════════════════════════════════
// WORLD COORDINATES
// ══════════════════════════════════════════════
const WCX=2500, Y_SIG=300, Y_EXP=650, Y_LINE_END=840, Y_MAT=940,
      Y_INT=Y_MAT, Y_PANEL=Y_MAT+220, Y_SYS_BOT=Y_MAT+360, Y_SYN_LS=Y_SYS_BOT;
// Spread: ±300px — readable, clearly separated
const INT_XS=[-300,-180,-60,60,180,300].map(x=>WCX+x);

// ══════════════════════════════════════════════
// CAMERA
// ══════════════════════════════════════════════
let camX=WCX, camY=Y_SIG, camS=1;
const world=document.getElementById('world');

function applyCamera(anim, dur){
  const tx=window.innerWidth/2-camX*camS, ty=window.innerHeight/2-camY*camS;
  world.style.transition=anim?`transform ${dur||1.6}s cubic-bezier(.4,0,.2,1)`:'none';
  world.style.transform=`translate(${tx}px,${ty}px) scale(${camS})`;
}
function cam(x,y,s,delay,dur){
  setTimeout(()=>{ camX=x; camY=y; if(s!=null)camS=s; applyCamera(true,dur); },delay||0);
}

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════
const $=id=>document.getElementById(id);
const vw=()=>window.innerWidth, vh=()=>window.innerHeight;

function node(id,x,y,html){
  const d=document.createElement('div');
  d.className='wn'; if(id)d.id=id;
  d.style.left=x+'px'; d.style.top=y+'px';
  if(html)d.innerHTML=html;
  world.appendChild(d); return d;
}

function line(x1,y1,x2,y2,op,dur){
  const svg=$('wsvg'), len=Math.hypot(x2-x1,y2-y1);
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',x1);l.setAttribute('y1',y1);
  l.setAttribute('x2',x2);l.setAttribute('y2',y2);
  l.setAttribute('stroke',`rgba(255,255,255,${op||.09})`);
  l.setAttribute('stroke-width','0.9');
  l.setAttribute('stroke-dasharray',len);
  l.setAttribute('stroke-dashoffset',len);
  svg.appendChild(l);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    l.style.transition=`stroke-dashoffset ${dur||1}s cubic-bezier(.4,0,.2,1)`;
    l.setAttribute('stroke-dashoffset','0');
  }));
  return l;
}

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let phase='intro', sortChoice=null;
let scramTimers=[], scramDone=false;

// ══════════════════════════════════════════════
// INTRO
// ══════════════════════════════════════════════
setTimeout(()=>$('i1').style.opacity=1, 700);
setTimeout(()=>$('i2').style.opacity=1, 2100);
setTimeout(()=>{
  $('intro').classList.add('out');
  setTimeout(()=>{
    $('intro').style.display='none';
    camS=Math.min(vw()/600, vh()/500, 1.4);
    camX=WCX; camY=Y_SIG;
    applyCamera(false);
    $('vp').classList.add('on');
    $('byline').classList.add('on');
    buildNodes();
    phase='idle';
  },2000);
},4800);

// ══════════════════════════════════════════════
// BUILD ALL NODES UPFRONT
// ══════════════════════════════════════════════
function buildNodes(){
  // Signal node
  node('sig-wrap',WCX,Y_SIG,`
    <div id="sig-dot"></div>
    <div id="sig-hint">tap</div>
    <div id="sig-label">a weak signal.</div>
    <div id="sig-title">weak signal</div>`);
  $('sig-dot').addEventListener('click',onDotTap);

  // Explanation
  node('exp-wrap',WCX,Y_EXP,`
    <div id="exp-block">
      <div class="exp-tag">01 — receive</div>
      <div class="exp-body">
        A weak signal is not yet a brief.<br/>
        It arrives as <b>potential</b> — compressed, undefined,<br/>
        holding within it everything it could become.<br/><br/>
        It may come from a client, a cultural moment,<br/>
        an internal impulse to make something.<br/><br/>
        My first task is to look behind it.
      </div>
      <div id="btn-decode" class="abtn" style="margin-top:36px;">decode →</div>
    </div>`);
  $('btn-decode').addEventListener('click',onDecode);

  // Matrix
  node('mat-wrap',WCX,Y_MAT,`
    <div id="mat-block">
      <div id="mchars">
        <span class="mc" id="mc0">—</span><span class="mc" id="mc1">—</span>
        <span class="mc" id="mc2">—</span><span class="mc" id="mc3">—</span>
        <span class="mc" id="mc4">—</span><span class="mc" id="mc5">—</span>
      </div>
      <div id="m-hint">tap to decode</div>
      <div id="m-exp">
        Intent is the place to start from.<br/>
        Not the ask — but the reason behind the ask.<br/>
        Not the output — but what the output must ultimately do.
      </div>
      <div id="btn-amplify" class="abtn" style="margin-top:30px;">amplify →</div>
    </div>`);
  $('mchars').addEventListener('click',onMatrixTap);
  $('m-hint').addEventListener('click',onMatrixTap);
  $('btn-amplify').addEventListener('click',onAmplify);
}

// ══════════════════════════════════════════════
// STAGE 1: dot tap
// ══════════════════════════════════════════════
function onDotTap(){
  if(phase!=='idle')return;
  phase='explain';
  $('sig-hint').classList.add('hide');
  setTimeout(()=>$('sig-label').classList.add('on'),150);
  setTimeout(()=>{
    $('exp-block').classList.add('on');
    cam(WCX, Y_EXP-100, null);
  },350);
  setTimeout(()=>$('btn-decode').classList.add('on'),1200);
}

// ══════════════════════════════════════════════
// STAGE 2: decode → line → matrix
// ══════════════════════════════════════════════
function onDecode(e){
  e.stopPropagation();
  if(phase!=='explain')return;
  phase='decode';
  $('exp-block').classList.add('off');
  setTimeout(()=>{
    $('sig-label').style.transition='opacity .4s';
    $('sig-label').style.opacity='0';
    $('sig-dot').classList.add('small');
    setTimeout(()=>$('sig-title').classList.add('on'),400);
  },400);
  // Line — impulse of the collapse — draws downward
  setTimeout(()=>{
    line(WCX,Y_SIG+4,WCX,Y_LINE_END,.15,1.5);
    cam(WCX,(Y_SIG+Y_MAT)/2,null,200);
  },750);
  // Matrix at end of line
  setTimeout(()=>{
    $('mat-block').classList.add('on');
    startScramble();
    cam(WCX,Y_MAT,null,200);
  },2600);
}

// ══════════════════════════════════════════════
// SCRAMBLE
// ══════════════════════════════════════════════
const CHARS='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ#+-=|~<>{}';
const TGT='INTENT';

function startScramble(){
  scramTimers.forEach(clearInterval); scramTimers=[];
  for(let i=0;i<6;i++){
    const el=$('mc'+i);
    scramTimers.push(setInterval(()=>{ el.textContent=CHARS[Math.random()*CHARS.length|0]; },70));
  }
}

function onMatrixTap(){
  if(scramDone||phase!=='decode')return;
  scramDone=true; phase='intent';
  $('m-hint').classList.add('hide');
  scramTimers.forEach(clearInterval); scramTimers=[];
  TGT.split('').forEach((ch,i)=>{
    let t=setInterval(()=>{ $('mc'+i).textContent=CHARS[Math.random()*CHARS.length|0]; },55);
    setTimeout(()=>{
      clearInterval(t);
      const el=$('mc'+i); el.textContent=ch; el.classList.add('on');
      if(i===5){
        setTimeout(()=>$('m-exp').classList.add('on'),400);
        setTimeout(()=>$('btn-amplify').classList.add('on'),1900);
      }
    },180+i*190);
  });
}

// ══════════════════════════════════════════════
// STAGE 3: amplify → INTENT systems
// ══════════════════════════════════════════════
function onAmplify(e){
  e.stopPropagation();
  if(phase!=='intent')return;
  phase='spread';

  // FLIP: measure exact world position of each mc letter's top-center
  const positions=[];
  for(let i=0;i<6;i++){
    const r=$('mc'+i).getBoundingClientRect();
    positions.push({
      x: (r.left+r.width/2 - vw()/2)/camS + camX,
      y: (r.top             - vh()/2)/camS + camY,
    });
  }
  buildIntentSystems(positions);
}

function buildIntentSystems(positions){
  // Place each icol exactly on top of its mc letter using measured world coordinates.
  // icol uses translateX(-50%) so left=horizontal-center, top=top-edge.
  // opacity:1 immediately — no fade, they're covering the mc letters at pixel-exact position.
  INTENT.forEach((d,i)=>{
    const col=document.createElement('div');
    col.className='icol'; col.id='icol-'+i;
    col.style.left=positions[i].x+'px';
    col.style.top =positions[i].y+'px';
    col.style.opacity='1';
    col.innerHTML=`
      <div class="icol-ltr">${d.L}</div>
      <div class="icol-name">${d.W}</div>
      <div class="icol-stem" id="istem-${i}"></div>
      <div class="icol-dims" id="idims-${i}">
        ${d.dims.map((dim,j)=>`
          <div class="dim-wrap">
            <div class="dim-name" id="dname-${i}-${j}">${dim.n}</div>
            <div class="dim-stem" id="dstem-${i}-${j}"></div>
            <div class="sub-row">${dim.s.map((s,k)=>`<div class="sub-tag" id="sub-${i}-${j}-${k}">${s}</div>`).join('')}</div>
          </div>`).join('')}
      </div>`;
    world.appendChild(col);
  });

  // Double rAF: icols are now painted at mc positions.
  // Hide mc, spread horizontally. Camera does NOT move.
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
    $('mat-block').classList.add('off');
    INTENT.forEach((_,i)=>{
      const col=$('icol-'+i);
      col.style.transition='left 1.2s cubic-bezier(.4,0,.2,1)';
      col.style.left=INT_XS[i]+'px';
    });
    setTimeout(growSystem, 1400);
  });});
}

function growSystem(){
  // Stems
  INTENT.forEach((_,i)=>{
    setTimeout(()=>{ const s=$('istem-'+i); if(s)s.style.height='26px'; },i*50);
  });
  const t0=INTENT.length*50+200;

  // Dim names + subs staggered
  INTENT.forEach((d,i)=>{
    d.dims.forEach((dim,j)=>{
      setTimeout(()=>{
        const dn=$(`dname-${i}-${j}`); if(dn)dn.classList.add('show');
        setTimeout(()=>{
          const ds=$(`dstem-${i}-${j}`); if(ds)ds.style.height='10px';
          dim.s.forEach((_,k)=>setTimeout(()=>{ const sub=$(`sub-${i}-${j}-${k}`); if(sub)sub.classList.add('show'); },k*60));
        },140);
      },t0+(i*3+j)*60);
    });
  });
  const totalDim=t0+(INTENT.length*3)*60+300;

  // After dims: create world panel, then ONE camera move
  setTimeout(()=>{
    const panel=document.createElement('div');
    panel.id='world-panel';
    panel.style.left=WCX+'px';
    panel.style.top=Y_PANEL+'px';
    panel.innerHTML=`
      <div id="wp-q">what must this system enable?</div>
      <div id="wp-opts">
        <div class="sopt" data-choice="decide">a decision</div>
        <div class="sopt" data-choice="feel">a feeling</div>
        <div class="sopt" data-choice="act">collective action</div>
        <div class="sopt" data-choice="system">a lasting system</div>
      </div>
      <div id="btn-syn">synthesis →</div>`;
    world.appendChild(panel);
    panel.querySelectorAll('.sopt').forEach(el=>{
      el.addEventListener('click',()=>pickSort(el,el.dataset.choice));
    });
    $('btn-syn').addEventListener('click',onSynthesis);
    requestAnimationFrame(()=>requestAnimationFrame(()=>panel.classList.add('on')));

    // ONE camera move: frame letters + subfields + panel together
    const contentTop=Y_MAT;
    const contentBot=Y_PANEL+90;
    const contentH=contentBot-contentTop;
    const contentW=INT_XS[5]-INT_XS[0]+300;
    const s2=Math.min(vw()/contentW*.84, vh()/contentH*.84);
    cam(WCX, (contentTop+contentBot)/2, s2, 200);
    phase='sorted';
  }, totalDim);
}

// ══════════════════════════════════════════════
// SORT
// ══════════════════════════════════════════════
function pickSort(el,choice){
  document.querySelectorAll('.sopt').forEach(o=>o.classList.remove('chosen'));
  el.classList.add('chosen'); sortChoice=choice;
  const w=WEIGHTS[choice];
  INTENT.forEach((d,i)=>{
    const wt=w[i], col=$('icol-'+i); if(!col)return;
    col.style.transition='opacity .9s ease';
    col.style.opacity=(.06+wt*.94).toFixed(2);
    d.dims.forEach((dim,j)=>{
      const dn=$(`dname-${i}-${j}`);
      if(dn){dn.style.transition='opacity .7s'; dn.style.opacity=wt>.5?wt:.08;}
      dim.s.forEach((_,k)=>{
        const s=$(`sub-${i}-${j}-${k}`);
        if(s){s.style.transition='opacity .7s'; s.style.opacity=wt>.5?(wt*.55).toFixed(2):.03;}
      });
    });
  });
  $('btn-syn').classList.add('on');
}

// ══════════════════════════════════════════════
// SYNTHESIS
// ══════════════════════════════════════════════
function onSynthesis(){
  if(!sortChoice||phase!=='sorted')return;
  phase='synthesis';

  // ── 1. Panel and button fade out slowly, origin circle fades in ──
  const wp=$('world-panel');
  if(wp){ wp.style.transition='opacity 1s ease'; wp.style.opacity='0'; }
  $('btn-syn').classList.remove('on');

  // ── geometry ──
  const OX  = WCX;
  const OY  = Y_PANEL;
  const N0Y = Y_PANEL + 220;
  const CY  = Y_MAT - 20;
  const RX  = 520;
  const RY  = 320;

  const origin = document.createElement('div');
  origin.style.cssText=`position:absolute;width:8px;height:8px;border-radius:50%;
    background:rgba(255,255,255,.5);transform:translate(-50%,-50%);
    opacity:0;transition:opacity 1.2s ease;`;
  origin.style.left = OX+'px';
  origin.style.top  = OY+'px';
  document.getElementById('world').appendChild(origin);
  setTimeout(()=>origin.style.opacity='1', 900);

  // 6 arc nodes spanning top half of ellipse: angles from lower-right to lower-left
  // angle 0 = right, going counter-clockwise (upward on right, down on left)
  const arcNodes = Array.from({length:6},(_,i)=>{
    const a = -(Math.PI * 0.18) + (Math.PI * 1.36 / 5) * i;
    return { x: WCX + RX * Math.cos(a), y: CY - RY * Math.sin(a) };
  });
  // arcNodes[0] = lower-right, arcNodes[5] = lower-left
  // arcNodes[2-3] = near top

  // all positions: pos[0]=(OX,N0Y), pos[1..6]=arcNodes
  const pos = [{x:OX, y:N0Y}, ...arcNodes];

  function spawnNode(i, label){
    const n = document.createElement('div');
    n.className='onode';
    n.style.left = pos[i].x+'px';
    n.style.top  = (pos[i].y - 3)+'px';
    n.innerHTML = `<div class="onode-dot"></div><div class="onode-lbl">${label.replace('\n','<br/>')}</div>`;
    document.getElementById('world').appendChild(n);
    requestAnimationFrame(()=>requestAnimationFrame(()=>n.classList.add('show')));
  }

  // draw a line, return the time it finishes
  function seg(from, to, startMs, durMs){
    setTimeout(()=>line(from.x,from.y,to.x,to.y,.07,durMs/1000), startMs);
    return startMs + durMs;
  }

  // ── 2. Camera follows origin down toward node 0 ──
  cam(OX, N0Y, null, 1200, 2.2);

  // ── 3. Line descends from origin to node 0 ──
  const LINE_DUR = 1800;
  setTimeout(()=>line(OX, OY, OX, N0Y, .14, LINE_DUR/1000), 1200);

  // ── 4. Node 0 appears where line ends ──
  const T0 = 1200 + LINE_DUR + 300;
  setTimeout(()=>spawnNode(0, OUTPUTS[0]), T0);

  // ── 5. Camera pullback: frames all 7 nodes — top arc + node 0 at bottom ──
  const SEG = 1600; // ms per segment — slower, more cinematic

  // Bounding box of all node positions
  const allX = pos.map(p=>p.x), allY = pos.map(p=>p.y);
  const minX = Math.min(...allX), maxX = Math.max(...allX);
  const minY = Math.min(...allY), maxY = Math.max(...allY);
  const padX = 160, padY = 120;
  const frameW = (maxX - minX) + padX*2;
  const frameH = (maxY - minY) + padY*2;
  const frameCX = (minX + maxX) / 2;
  const frameCY = (minY + maxY) / 2;
  const finalS = Math.min(vw()/frameW*.9, vh()/frameH*.9);
  cam(frameCX, frameCY, finalS, T0+400, (3*SEG + 2400)/1000);

  // ── 6. Right branch: node0 → arc[0] → arc[1] → arc[2] ──
  const BS = T0 + 300;
  let tr = BS;
  tr = seg(pos[0], pos[1], tr, SEG); setTimeout(()=>spawnNode(1, OUTPUTS[1]), tr);
  tr = seg(pos[1], pos[2], tr, SEG); setTimeout(()=>spawnNode(2, OUTPUTS[2]), tr);
  tr = seg(pos[2], pos[3], tr, SEG); setTimeout(()=>spawnNode(3, OUTPUTS[3]), tr);

  // ── 7. Left branch: node0 → arc[5] → arc[4] → arc[3] ──
  let tl = BS;
  tl = seg(pos[0], pos[6], tl, SEG); setTimeout(()=>spawnNode(6, OUTPUTS[6]), tl);
  tl = seg(pos[6], pos[5], tl, SEG); setTimeout(()=>spawnNode(5, OUTPUTS[5]), tl);
  tl = seg(pos[5], pos[4], tl, SEG); setTimeout(()=>spawnNode(4, OUTPUTS[4]), tl);

  // ── 8. Closing segment: right tip → left tip ──
  setTimeout(()=>line(pos[3].x,pos[3].y,pos[4].x,pos[4].y,.07,SEG/1000), tr + 300);
}

// ══════════════════════════════════════════════
// DRAG — mousedown on vp, track on document
// No pointer capture. Native clicks work on all children.
// ══════════════════════════════════════════════
const vp=$('vp');
let dragging=false, wasDragging=false;
let dsx=0,dsy=0,dcx=0,dcy=0;

vp.addEventListener('mousedown',e=>{
  dragging=true; wasDragging=false;
  dsx=e.clientX; dsy=e.clientY; dcx=camX; dcy=camY;
  world.style.transition='none';
});
document.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const dx=e.clientX-dsx, dy=e.clientY-dsy;
  if(Math.abs(dx)>5||Math.abs(dy)>5){ wasDragging=true; vp.classList.add('dragging'); }
  if(wasDragging){ camX=dcx-dx*0.7/camS; camY=dcy-dy*0.7/camS; applyCamera(false); }
});
document.addEventListener('mouseup',()=>{
  dragging=false; vp.classList.remove('dragging');
  setTimeout(()=>{ wasDragging=false; },40);
});
// Suppress click after drag
vp.addEventListener('click',e=>{ if(wasDragging){e.stopPropagation();e.preventDefault();} },true);

// Touch drag
let td=false,tm=false,tdsx=0,tdsy=0,tdcx=0,tdcy=0;
let pinch=false,pd0=0,ps0=1;
vp.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    pinch=true; td=false;
    pd0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    ps0=camS; return;
  }
  td=true; tm=false;
  tdsx=e.touches[0].clientX; tdsy=e.touches[0].clientY; tdcx=camX; tdcy=camY;
  world.style.transition='none';
},{passive:true});
vp.addEventListener('touchmove',e=>{
  if(pinch&&e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    camS=Math.max(.06,Math.min(3,ps0*(d/pd0))); applyCamera(false); return;
  }
  if(!td||e.touches.length!==1)return;
  const dx=e.touches[0].clientX-tdsx, dy=e.touches[0].clientY-tdsy;
  if(Math.abs(dx)>5||Math.abs(dy)>5)tm=true;
  if(tm){ camX=tdcx-dx/camS; camY=tdcy-dy/camS; applyCamera(false); }
},{passive:true});
vp.addEventListener('touchend',()=>{ if(pinch){pinch=false;return;} td=false; },{passive:true});

// Wheel zoom — very fine increments for precise control
vp.addEventListener('wheel',e=>{
  e.preventDefault();
  const ticks = e.deltaY / 100;
  const f = Math.pow(0.998, ticks);
  const wx=(e.clientX-vw()/2)/camS+camX, wy=(e.clientY-vh()/2)/camS+camY;
  camS=Math.max(.08,Math.min(3,camS*f));
  camX=wx-(e.clientX-vw()/2)/camS; camY=wy-(e.clientY-vh()/2)/camS;
  applyCamera(false);
},{passive:false});

window.addEventListener('resize',()=>applyCamera(false));
</script>
</body>
