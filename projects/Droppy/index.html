<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nimble — green glass mascot</title>
<style>
  html,body{margin:0;height:100%;background:#10131a;overflow:hidden;font-family:system-ui,sans-serif}
  #info{position:fixed;top:10px;left:12px;color:#8aa;font-size:12px;opacity:.7}
</style>
<!-- Three.js via importmap. Pin a version so this keeps working. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.esm.js"
  }
}
</script>
</head>
<body>
<div id="info">drag to orbit · scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import GUI from 'lil-gui';

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10131a);

// Environment map — THIS is what produces the reflections on the glass.
// RoomEnvironment is a cheap procedural studio; swap for an HDR (RGBELoader) for production.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0.9, 1.0, 2.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;

// A little ground + a couple of colored blocks so refraction has something to bend.
scene.add(new THREE.Mesh(
  new THREE.CircleGeometry(6, 48).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({ color: 0x20242e, roughness: 0.9 })
));
for (const [x,c] of [[-1.2,0xff5544],[1.2,0x4488ff]]) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.4),
            new THREE.MeshStandardMaterial({ color:c, roughness:0.4 }));
  b.position.set(x, 0.2, -0.6); scene.add(b);
}
scene.add(new THREE.DirectionalLight(0xffffff, 1.2).translateY(3).translateZ(2));

// ---------- glass parameters (tune live in the panel) ----------
const params = {
  transmission: 1.0,      // 1 = fully see-through glass
  ior: 1.45,              // dish soap / glass ~1.45
  roughness: 0.08,        // low = crisp; raise for frosted
  thickness: 0.6,         // overall depth; multiplied by the baked thickness map
  attenuationDistance: 0.6,
  attenuationColor: '#27c24a',  // the GREEN lives here (volumetric absorption), not in base color
  clearcoat: 1.0,         // wet, candy shell highlight
  clearcoatRoughness: 0.08,
  envMapIntensity: 1.4,   // strength of reflections
  keepFace: true          // keep Meshy's base-color map so eyes/mouth stay colored
};

// ---------- load asset ----------
let mixer, glassMat;
const thicknessTex = new THREE.TextureLoader().load('./nimble_thickness.png', t => {
  t.flipY = false;                 // glTF UV convention
  t.colorSpace = THREE.NoColorSpace;
});

new GLTFLoader().load('./nimble_run.glb', (gltf) => {
  const root = gltf.scene;
  scene.add(root);

  root.traverse(o => {
    if (!o.isMesh) return;
    const src = o.material; // what Meshy baked (has map + normalMap)

    glassMat = new THREE.MeshPhysicalMaterial({
      // keep surface detail + (optionally) the face coloring from the bake
      map: params.keepFace ? src.map : null,
      normalMap: src.normalMap || null,
      // glass
      metalness: 0.0,
      roughness: params.roughness,
      transmission: params.transmission,
      ior: params.ior,
      thickness: params.thickness,
      thicknessMap: thicknessTex,
      attenuationColor: new THREE.Color(params.attenuationColor),
      attenuationDistance: params.attenuationDistance,
      clearcoat: params.clearcoat,
      clearcoatRoughness: params.clearcoatRoughness,
      envMapIntensity: params.envMapIntensity,
      transparent: true
    });
    if (glassMat.map) glassMat.map.colorSpace = THREE.SRGBColorSpace;
    o.material = glassMat;
    o.frustumCulled = false;
  });

  // play the run cycle
  if (gltf.animations.length) {
    mixer = new THREE.AnimationMixer(root);
    mixer.clipAction(gltf.animations[0]).play();
  }
  buildGUI();
}, undefined, e => console.error('GLB load failed', e));

// ---------- live tuning panel ----------
function buildGUI(){
  const gui = new GUI();
  const apply = () => {
    glassMat.transmission = params.transmission;
    glassMat.ior = params.ior;
    glassMat.roughness = params.roughness;
    glassMat.thickness = params.thickness;
    glassMat.attenuationDistance = params.attenuationDistance;
    glassMat.attenuationColor.set(params.attenuationColor);
    glassMat.clearcoat = params.clearcoat;
    glassMat.clearcoatRoughness = params.clearcoatRoughness;
    glassMat.envMapIntensity = params.envMapIntensity;
    glassMat.map = params.keepFace ? glassMat.userData.faceMap || glassMat.map : null;
    glassMat.needsUpdate = true;
  };
  glassMat.userData.faceMap = glassMat.map;
  gui.add(params,'transmission',0,1,0.01).onChange(apply);
  gui.add(params,'ior',1,2,0.01).onChange(apply);
  gui.add(params,'roughness',0,0.6,0.01).onChange(apply);
  gui.add(params,'thickness',0,3,0.01).onChange(apply);
  gui.add(params,'attenuationDistance',0.05,3,0.01).onChange(apply);
  gui.addColor(params,'attenuationColor').onChange(apply);
  gui.add(params,'clearcoat',0,1,0.01).onChange(apply);
  gui.add(params,'clearcoatRoughness',0,0.6,0.01).onChange(apply);
  gui.add(params,'envMapIntensity',0,3,0.01).onChange(apply);
  gui.add(params,'keepFace').onChange(apply);
}

// ---------- loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  if (mixer) mixer.update(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
