<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEBIKES · Classifica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --eco:#3ddc6f; --cyan:#1ce0c4; --gold:#ffd23f; --turbo:#ff5a4d;
         --panel:#142019; --line:#2f5c3f; --pix:'Press Start 2P','Courier New',monospace; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#11271b,#060c09);
    color:#eafff2;font-family:var(--pix);overflow:hidden;}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.4vmin;gap:1.8vmin;}
  .logo{font-size:clamp(22px,5vmin,54px);color:var(--eco);text-shadow:.35vmin .35vmin 0 #0a3a1d;letter-spacing:2px;}
  .logo span{color:var(--cyan);text-shadow:.35vmin .35vmin 0 #073f39;}
  .sub{font-size:clamp(9px,1.7vmin,17px);color:var(--gold);letter-spacing:3px;}
  .date{font-size:clamp(8px,1.3vmin,13px);color:#7fb89a;}
  /* stato del concorso: conto alla rovescia / chiuso */
  #status{width:min(92vw,900px);padding:1.4vmin 2vmin;border:.35vmin solid var(--line);background:#0c150f;
    text-align:center;font-size:clamp(9px,1.8vmin,18px);line-height:1.8;color:#cdeede;}
  #status.open b{color:var(--gold);font-size:1.25em;}
  #status.closed{border-color:var(--gold);color:var(--gold);}
  #status.before{color:#9fd9b8;}
  #board{width:min(92vw,900px);background:var(--panel);border:.45vmin solid var(--line);
    box-shadow:0 0 0 .6vmin rgba(61,220,111,.15);padding:2vmin 3vmin;}
  .row{display:flex;align-items:center;gap:2vmin;padding:.95vmin .6vmin;
    font-size:clamp(10px,2.25vmin,24px);line-height:1.4;border-bottom:1px solid #1d2e24;}
  .row:last-child{border-bottom:none;}
  .pos{width:8%;text-align:right;color:var(--gold);flex:none;}
  .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#eafff2;}
  .sc{flex:none;color:var(--cyan);}
  .row.pro .nm,.row.pro .sc,.row.pro .pos{color:#5f8d74;}
  .row.pro .nm::after{content:'PRO';font-size:.45em;color:#5f8d74;border:1px solid #3e6a50;padding:.1em .4em;margin-left:.8em;vertical-align:middle;}
  .row.r1:not(.pro) .pos,.row.r1:not(.pro) .nm,.row.r1:not(.pro) .sc{color:var(--gold);}
  .row.r1:not(.pro){font-size:clamp(12px,2.9vmin,31px);}
  .row.r1:not(.pro) .nm::before{content:'👑 ';}
  .row.lead:not(.r1) .nm::after{content:'1° GIOCATORE';font-size:.42em;color:var(--gold);border:1px solid var(--gold);padding:.1em .4em;margin-left:.8em;vertical-align:middle;}
  .empty{font-size:clamp(10px,2vmin,20px);color:#7fb89a;text-align:center;line-height:2.2;padding:4vmin 0;}
  .cta{font-size:clamp(8px,1.5vmin,15px);color:#cdeede;line-height:2;text-align:center;}
  .cta b{color:var(--gold);}
  .err{font-size:clamp(8px,1.4vmin,13px);color:var(--turbo);min-height:2vmin;}
  .blink{animation:bl 1.4s steps(2) infinite;} @keyframes bl{50%{opacity:.4}}
  /* vincitore */
  #winner{display:none;width:min(92vw,900px);border:.5vmin solid var(--gold);background:#1b1a0c;padding:2vmin;text-align:center;
    box-shadow:0 0 3vmin rgba(255,210,63,.35);}
  #winner .wt{font-size:clamp(10px,1.9vmin,19px);color:var(--gold);letter-spacing:3px;}
  #winner .wn{font-size:clamp(18px,4.4vmin,48px);color:#fff;margin:1.2vmin 0;text-shadow:.3vmin .3vmin 0 #7a5e00;}
  #winner .ws{font-size:clamp(10px,2vmin,20px);color:var(--gold);}
  #winner .wx{font-size:clamp(8px,1.3vmin,13px);color:#cdeede;margin-top:1vmin;line-height:1.8;}
  /* comandi operatore (discreti, in basso a destra) */
  #ops{position:fixed;right:1.2vmin;bottom:1.2vmin;display:flex;gap:.8vmin;opacity:.35;transition:opacity .2s;}
  #ops:hover{opacity:1;}
  #ops button{font-family:var(--pix);font-size:clamp(7px,1.1vmin,11px);padding:.9vmin 1.2vmin;background:#0c150f;color:#9fd9b8;
    border:2px solid var(--line);cursor:pointer;}
  #ops button.primary{border-color:var(--gold);color:var(--gold);}
  #ops button:disabled{opacity:.5;cursor:default;}
  #toast{position:fixed;left:50%;bottom:6vmin;transform:translateX(-50%);background:#0c150f;border:2px solid var(--gold);color:#eafff2;
    padding:1.4vmin 2vmin;font-size:clamp(8px,1.4vmin,14px);line-height:1.8;display:none;max-width:80vw;text-align:center;}
</style>
</head>
<body>
<div id="wrap">
  <div class="logo">Be<span>Bikes</span></div>
  <div class="sub" id="sub">E-BIKE CHALLENGE · CLASSIFICA DI OGGI</div>
  <div class="date" id="today"></div>
  <div id="status"></div>
  <div id="winner"><div class="wt">🏆 VINCE IL CASCO BEBIKES</div><div class="wn" id="wName"></div><div class="ws" id="wScore"></div><div class="wx" id="wNote"></div></div>
  <div id="board"><div class="empty blink">IN ATTESA DEI PRIMI PUNTEGGI…</div></div>
  <div class="cta" id="cta">Gioca, registrati ed entra in classifica: il <b>primo giocatore</b> vince un <b>casco BeBikes</b>!<br>
    <span style="color:#7fb89a">I punteggi PRO sono riferimenti da battere e non partecipano al premio.</span></div>
  <div class="err" id="err"></div>
</div>
<div id="ops">
  <button id="btnLive" title="Alterna classifica ufficiale / live">LIVE</button>
  <button id="btnClose" class="primary" title="Chiude la giornata e avvisa il vincitore (serve il PIN)">🔒 CHIUDI GIORNATA</button>
</div>
<div id="toast"></div>
<script>
"use strict";
/* Stessa config del gioco: URL + anon key del progetto Supabase */
const LB_CONFIG={
  URL:'https://bbeciqfzgnpylnfbakgb.supabase.co',
  KEY:'sb_publishable_xWNWQBQJWFf_UXw0NAAStg_0TzT8Guj'
};
const REFRESH_MS=8000;
const $=id=>document.getElementById(id);
let showLive=false, contest=null, winner=null;

$('today').textContent=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Rome'}).toUpperCase();

async function api(path,body){
  const r=await fetch(LB_CONFIG.URL+path,{method:'POST',
    headers:{'apikey':LB_CONFIG.KEY,'Authorization':'Bearer '+LB_CONFIG.KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body||{})});
  const t=await r.text(); let j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
  if(!r.ok){ const e=new Error('HTTP '+r.status); e.status=r.status; e.body=j; throw e; }
  return j;
}
function toast(msg,ms){ const t=$('toast'); t.innerHTML=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',ms||6000); }

/* Conto alla rovescia calcolato sull'orario del SERVER (contest.now), non su quello del PC del monitor */
let serverOffsetMs=0;   // differenza tra orologio del PC e orologio del server
function syncClock(c){
  if(!c||!c.now) return;
  const [h,m]=c.now.split(':').map(Number);
  const local=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Rome'}));
  const srv=new Date(local); srv.setHours(h,m,0,0);
  const diff=srv-local; if(Math.abs(diff)>90*1000) serverOffsetMs=diff; else serverOffsetMs=0;
}
function nowRome(){ return new Date(new Date(Date.now()+serverOffsetMs).toLocaleString('en-US',{timeZone:'Europe/Rome'})); }
function renderStatus(){
  const s=$('status'); if(!contest){ s.className=''; s.textContent=''; return; }
  if(!contest.contest_day){ s.className='before'; s.textContent='OGGI NESSUN CONCORSO · CLASSIFICA DI PROVA'; return; }
  const [ch,cm]=contest.close_at.split(':').map(Number), [oh,om]=contest.open_at.split(':').map(Number);
  const n=nowRome(); const close=new Date(n); close.setHours(ch,cm,0,0); const open=new Date(n); open.setHours(oh,om,0,0);
  if(n<open){ s.className='before'; s.textContent='IL CONCORSO APRE ALLE '+contest.open_at+' · CHIUDE ALLE '+contest.close_at; return; }
  if(n<close){
    const sec=Math.max(0,Math.floor((close-n)/1000)), hh=Math.floor(sec/3600), mm=Math.floor(sec%3600/60), ss=sec%60;
    s.className='open';
    s.innerHTML='CLASSIFICA APERTA · CHIUDE ALLE '+contest.close_at+' · MANCANO <b>'+(hh?hh+'h ':'')+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'</b>';
    return;
  }
  s.className='closed'; s.textContent='CLASSIFICA UFFICIALE CHIUSA ALLE '+contest.close_at+(winner?'':' · IN ATTESA DELLA PROCLAMAZIONE');
}
setInterval(renderStatus,1000);

function renderBoard(rows){
  const board=$('board');
  if(!rows||!rows.length){ board.innerHTML='<div class="empty blink">IN ATTESA DEI PRIMI PUNTEGGI…</div>'; return; }
  board.innerHTML='';
  const firstReal=rows.find(r=>!r.pro);
  rows.forEach(x=>{
    const d=document.createElement('div');
    d.className='row'+(x.pos===1?' r1':'')+(x.pro?' pro':'')+(firstReal&&x===firstReal?' lead':'');
    d.innerHTML='<span class="pos">'+x.pos+'.</span><span class="nm"></span><span class="sc">'+x.score.toLocaleString('it-IT')+' g</span>';
    d.querySelector('.nm').textContent=x.display;
    board.appendChild(d);
  });
}
function renderWinner(){
  const w=$('winner');
  if(!winner){ w.style.display='none'; return; }
  w.style.display='block';
  if(winner.no_winner){ $('wName').textContent='NESSUN VINCITORE'; $('wScore').textContent=''; $('wNote').textContent='Nessun giocatore registrato nella fascia del concorso.'; return; }
  $('wName').textContent=winner.display; $('wScore').textContent=winner.score.toLocaleString('it-IT')+' g di CO₂';
  $('wNote').textContent='Il vincitore è stato avvisato via email · ritiro del casco allo stand mostrando l\'email';
}

async function load(){
  const err=$('err');
  if(!/^https:\/\/.+supabase\.co$/.test(LB_CONFIG.URL)||LB_CONFIG.KEY.length<20){ err.textContent='CONFIGURA URL E CHIAVE SUPABASE IN QUESTO FILE'; return; }
  try{
    const [c,rows,w]=await Promise.all([
      api('/rest/v1/rpc/get_contest_status'),
      api('/rest/v1/rpc/get_leaderboard',{p_official:!showLive}),
      api('/rest/v1/rpc/get_winner').catch(()=>null)
    ]);
    contest=c; winner=w; syncClock(c);
    // dopo la chiusura il monitor mostra di default la classifica UFFICIALE (congelata);
    // LIVE la si sceglie a mano col pulsante
    $('sub').textContent='E-BIKE CHALLENGE · '+(showLive?'CLASSIFICA LIVE DI OGGI':(c&&c.contest_day?'CLASSIFICA UFFICIALE DI OGGI':'CLASSIFICA DI OGGI'));
    $('btnLive').textContent=showLive?'UFFICIALE':'LIVE';
    renderBoard(rows); renderWinner(); renderStatus(); err.textContent='';
  }catch(e){ err.textContent='AGGIORNAMENTO NON RIUSCITO — RIPROVO… ('+(e.status||'rete')+')'; }
}
$('btnLive').addEventListener('click',()=>{ showLive=!showLive; load(); });

/* Pulsante CHIUDI GIORNATA: chiede il PIN e chiama la funzione close-day.
   È sicuro premerlo più volte: il server sceglie il vincitore una volta sola e non manda due email.
   Prima dell'orario di chiusura il server rifiuta (not_yet). */
$('btnClose').addEventListener('click',async()=>{
  const pin=prompt('PIN operatore per chiudere la giornata e avvisare il vincitore:');
  if(pin===null||!pin.trim()) return;
  const b=$('btnClose'); b.disabled=true; const old=b.textContent; b.textContent='CHIUSURA…';
  try{
    // La chiusura la fa il DATABASE (funzione SQL protetta dal PIN): niente Edge Functions.
    const r=await api('/rest/v1/rpc/close_day_button',{p_pin:pin.trim()});
    if(r&&r.ok){
      if(r.winner) toast((r.already?'Giornata già chiusa.':'Giornata chiusa!')+'<br>🏆 <b>'+r.winner.display+'</b> — '+r.winner.score.toLocaleString('it-IT')+' g<br>'+(r.winner.email_sent?'Email al vincitore inviata ✅':'⚠️ Email NON inviata: ripremere, o scrivergli a mano'),9000);
      else toast('Giornata chiusa: nessun giocatore registrato nella fascia del concorso.',8000);
    } else {
      const m={pin:'PIN errato.',not_yet:'Troppo presto: la classifica chiude alle '+(r&&r.close_at||'—')+'. Il database non permette di chiudere prima.',non_contest_day:'Oggi non è un giorno di concorso.'};
      toast('⚠️ '+(m[r&&r.error]||('Errore: '+(r&&r.error))),8000);
    }
  }catch(e){
    toast('⚠️ '+(e.status===403?'PIN errato.':'Chiamata non riuscita ('+(e.status||'rete')+'). Riprovare.'),8000);
  }finally{ b.disabled=false; b.textContent=old; load(); }
});

load(); setInterval(load,REFRESH_MS);
</script>
</body>
</html>
