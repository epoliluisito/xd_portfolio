<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarity Builder</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { overflow:hidden; background:#060810; font-family:'DM Mono',monospace; }
canvas { display:block; }
#ui { position:fixed; inset:0; pointer-events:none; }

#top-left {
  position:absolute; top:20px; left:20px;
  display:flex; flex-direction:column; gap:8px;
  pointer-events:all;
}
#mode-toggle {
  display:flex; gap:0;
  background:rgba(6,8,16,0.85); border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(14px); overflow:hidden;
}
.mode-opt {
  color:rgba(255,255,255,0.3); font-family:'DM Mono',monospace; font-size:9px;
  letter-spacing:0.18em; text-transform:uppercase;
  padding:9px 14px; cursor:pointer; transition:all 0.2s; border:none; background:transparent;
  position:relative;
}
.mode-opt + .mode-opt::before {
  content:''; position:absolute; left:0; top:20%; height:60%; width:1px;
  background:rgba(255,255,255,0.1);
}
.mode-opt.active { color:#e8c547; background:rgba(232,197,71,0.08); }
.mode-opt:hover:not(.active) { color:rgba(255,255,255,0.6); background:rgba(255,255,255,0.04); }
#hint { display:none; } /* replaced by side panel */

#controls-panel {
  position:absolute; top:50%; right:20px; transform:translateY(-50%);
  background:rgba(6,8,16,0.82); border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(14px); padding:16px 18px; width:190px;
  pointer-events:none;
}
#controls-panel h3 {
  color:rgba(232,197,71,0.7); font-size:8px; letter-spacing:0.25em;
  text-transform:uppercase; margin-bottom:12px; font-weight:400;
}
.ctrl-row {
  display:flex; align-items:flex-start; gap:10px; margin-bottom:9px;
}
.ctrl-key {
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
  color:rgba(255,255,255,0.7); font-family:'DM Mono',monospace;
  font-size:8px; letter-spacing:0.05em; padding:3px 6px;
  white-space:nowrap; flex-shrink:0; min-width:54px; text-align:center;
}
.ctrl-desc {
  color:rgba(255,255,255,0.3); font-size:8px; letter-spacing:0.1em;
  text-transform:uppercase; line-height:1.5;
}
.ctrl-divider {
  height:1px; background:rgba(255,255,255,0.07); margin:10px 0;
}
#drag-hint {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  color:rgba(232,197,71,0.7); font-size:9px; letter-spacing:0.25em; text-transform:uppercase;
  background:rgba(6,8,16,0.75); border:1px solid rgba(232,197,71,0.3);
  padding:8px 16px; pointer-events:none; display:none; backdrop-filter:blur(10px);
}
#drag-hint.visible { display:block; }
#hover-tooltip {
  position:fixed; pointer-events:none; display:none;
  background:rgba(6,8,16,0.88); border:1px solid rgba(232,197,71,0.35);
  color:rgba(232,197,71,0.85); font-size:8px; letter-spacing:0.18em;
  text-transform:uppercase; padding:5px 10px; backdrop-filter:blur(10px);
  transform:translate(12px,-50%); white-space:nowrap;
}
#hover-tooltip.visible { display:block; }
#pointer-hint {
  color:rgba(232,197,71,0.5); font-size:8px; letter-spacing:0.15em; text-transform:uppercase;
  padding-left:2px; display:none;
}
#pointer-hint.visible { display:block; }

#top-right {
  position:absolute; top:20px; right:20px; text-align:right;
  color:rgba(255,255,255,0.2); font-size:8px; letter-spacing:0.2em;
  text-transform:uppercase; line-height:2.2; pointer-events:none;
}
#top-right span { color:rgba(232,197,71,0.5); }
#time-display { color:rgba(255,255,255,0.5); font-size:10px; }

#bottom-bar {
  position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:10px; pointer-events:all;
  white-space:nowrap;
}
.bar-label { color:rgba(255,255,255,0.2); font-size:8px; letter-spacing:0.2em; text-transform:uppercase; }
.bar-divider { width:1px; height:22px; background:rgba(255,255,255,0.1); flex-shrink:0; }

.lens-btn, .icon-btn {
  background:rgba(6,8,16,0.85); border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.4); font-family:'DM Mono',monospace;
  font-size:9px; letter-spacing:0.1em; padding:7px 12px;
  cursor:pointer; backdrop-filter:blur(14px); transition:all 0.2s; text-transform:uppercase;
  flex-shrink:0;
}
.lens-btn:hover, .icon-btn:hover { border-color:rgba(255,255,255,0.3); color:#fff; }
.lens-btn.active, .icon-btn.active { border-color:#e8c547; color:#e8c547; background:rgba(232,197,71,0.08); }

#time-wrap { display:flex; align-items:center; gap:8px; }
#time-slider {
  -webkit-appearance:none; width:120px; height:2px;
  background:rgba(255,255,255,0.1); outline:none; cursor:pointer; flex-shrink:0;
}
#time-slider::-webkit-slider-thumb {
  -webkit-appearance:none; width:10px; height:10px;
  background:#e8c547; cursor:pointer;
}

#dpad { position:absolute; bottom:88px; right:24px; display:none; pointer-events:all; }
#dpad.visible { display:block; }
.dpad-grid { display:grid; grid-template-columns:repeat(3,46px); grid-template-rows:repeat(3,46px); gap:3px; }
.dpad-btn {
  background:rgba(6,8,16,0.85); border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.65); font-size:16px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; backdrop-filter:blur(14px); user-select:none; transition:all 0.1s;
  -webkit-tap-highlight-color:transparent;
}
.dpad-btn:active, .dpad-btn.pressed { background:rgba(232,197,71,0.15); border-color:rgba(232,197,71,0.5); color:#e8c547; }
.dpad-empty { background:transparent; border:none; pointer-events:none; }
.dpad-center {
  background:rgba(232,197,71,0.05); border:1px solid rgba(232,197,71,0.12);
  pointer-events:none; display:flex; align-items:center; justify-content:center;
  color:rgba(232,197,71,0.25); font-size:7px;
}

#loading {
  position:fixed; inset:0; background:#060810;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  z-index:100; transition:opacity 0.6s;
}
#loading h1 { color:rgba(255,255,255,0.6); font-size:11px; letter-spacing:0.35em; text-transform:uppercase; font-weight:400; }
#loading p  { color:rgba(232,197,71,0.45); font-size:8px; letter-spacing:0.25em; text-transform:uppercase; }
#load-bar   { width:160px; height:1px; background:rgba(255,255,255,0.07); position:relative; overflow:hidden; }
#load-fill  { position:absolute; top:0; left:0; height:100%; background:#e8c547; width:0%; transition:width 0.3s; }
#load-msg   { color:rgba(255,255,255,0.18); font-size:8px; letter-spacing:0.2em; text-transform:uppercase; }
</style>
</head>
<body>

<div id="loading">
  <h1>Clarity Builder</h1>
  <p>Berlin &middot; Kreuzberg</p>
  <div id="load-bar"><div id="load-fill"></div></div>
  <div id="load-msg">Building city...</div>
</div>
<div id="drag-hint">Drag to reposition</div>
<div id="hover-tooltip">Click &amp; drag to reposition</div>

<div id="ui">
  <div id="top-left">
    <div id="mode-toggle">
      <button class="mode-opt active" id="opt-camera">Camera</button>
      <button class="mode-opt" id="opt-walk">Walk</button>
    </div>
    <div id="hint"></div>
    <div id="pointer-hint"></div>
  </div>

  <div id="top-right">
    Clarity Builder<br><span>Berlin &middot; Kreuzberg</span><br>
    <div id="time-display">09:36</div>
  </div>

  <div id="bottom-bar">
    <span class="bar-label">Lens</span>
    <button class="lens-btn" data-fov="74">24mm</button>
    <button class="lens-btn active" data-fov="54">35mm</button>
    <button class="lens-btn" data-fov="40">50mm</button>
    <button class="lens-btn" data-fov="24">85mm</button>
    <button class="lens-btn" data-fov="15">135mm</button>
    <div class="bar-divider"></div>
    <div id="time-wrap">
      <span class="bar-label">Time</span>
      <input type="range" id="time-slider" min="0" max="1" step="0.001" value="0.4">
    </div>
    <div class="bar-divider"></div>
    <button class="icon-btn active" id="lights-btn">Lights ON</button>
    <div class="bar-divider"></div>
    <button class="icon-btn active" id="quality-btn">High</button>
  </div>

  <div id="dpad">
    <div class="dpad-grid">
      <div class="dpad-empty"></div>
      <div class="dpad-btn" id="btn-forward">&#8593;</div>
      <div class="dpad-empty"></div>
      <div class="dpad-btn" id="btn-left">&#8592;</div>
      <div class="dpad-center">CB</div>
      <div class="dpad-btn" id="btn-right">&#8594;</div>
      <div class="dpad-empty"></div>
      <div class="dpad-btn" id="btn-back">&#8595;</div>
      <div class="dpad-empty"></div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }  from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }     from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }    from 'three/addons/loaders/DRACOLoader.js';
import * as BGU           from 'three/addons/utils/BufferGeometryUtils.js';

// ---- Renderer ---------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ---- Scene ------------------------------------------------------------------
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x8ab0d8, 80, 200);

// ---- Camera -----------------------------------------------------------------
// Start behind and above character, looking at it
const camera = new THREE.PerspectiveCamera(54, window.innerWidth/window.innerHeight, 0.1, 400);
camera.position.set(0, 3, 8);

// ---- Orbit ------------------------------------------------------------------
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 1.0, 0);
orbit.enableDamping = true;
orbit.dampingFactor = 0.06;
orbit.minDistance = 1.5;
orbit.maxDistance = 80;
orbit.maxPolarAngle = Math.PI / 2 - 0.02;
orbit.update();

// ---- Lights -----------------------------------------------------------------
// Ambient -- always-on base fill so nothing is pitch black
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

// Hemisphere sky/ground light
const hemi = new THREE.HemisphereLight(0x88bbee, 0x334422, 0.6);
scene.add(hemi);

// Sun directional
const sun = new THREE.DirectionalLight(0xffd580, 1.8);
sun.position.set(-60, 40, -30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
// Large frustum so the whole city is lit
sun.shadow.camera.left   = -120;
sun.shadow.camera.right  =  120;
sun.shadow.camera.top    =  120;
sun.shadow.camera.bottom = -120;
sun.shadow.camera.near   = 1;
sun.shadow.camera.far    = 300;
sun.shadow.bias = -0.0005;
scene.add(sun);

// Street lights group -- point lights
const streetLightGroup = new THREE.Group();
scene.add(streetLightGroup);
let streetLightsOn = true;

// ---- Time of day ------------------------------------------------------------
// t: 0=midnight, 0.25=dawn, 0.5=noon, 0.75=dusk, 1=midnight
function applyTime(t) {
  var elevation = Math.sin((t - 0.25) * Math.PI * 2); // -1..1
  var azimuth   = (t - 0.25) * Math.PI * 2;

  // Sun position
  sun.position.set(
    Math.cos(azimuth) * 100,
    elevation * 80,
    Math.sin(azimuth) * 60
  );

  var dayF   = Math.max(0, elevation);        // 0 at horizon, 1 at peak
  var horizF = Math.max(0, 1 - Math.abs(elevation) * 4);
  var isDawn = t > 0.18 && t < 0.33;
  var isDusk = t > 0.67 && t < 0.82;
  var isNight = elevation < -0.08;

  // Sun colour and intensity
  if (isNight) {
    sun.color.setHex(0x112244);
    sun.intensity = 0.05;
  } else if (isDawn || isDusk) {
    sun.color.setHex(0xff7733);
    sun.intensity = 0.4 + horizF * 1.2;
  } else {
    sun.color.setHex(0xfff5d0);
    sun.intensity = 0.6 + dayF * 1.4;
  }
  sun.castShadow = sun.intensity > 0.3;

  // Ambient -- keep a floor so city is never black
  if (isNight) {
    ambient.color.setHex(0x05080f);
    ambient.intensity = 0.15;
  } else if (isDawn || isDusk) {
    ambient.color.setHex(0x604030);
    ambient.intensity = 0.3 + dayF * 0.3;
  } else {
    ambient.color.setHex(0x9aaabb);
    ambient.intensity = 0.4 + dayF * 0.4;
  }

  // Hemisphere
  if (isNight) {
    hemi.color.setHex(0x01020a);
    hemi.groundColor.setHex(0x040508);
    hemi.intensity = 0.1;
  } else if (isDawn || isDusk) {
    hemi.color.setHex(0x3a1828);
    hemi.groundColor.setHex(0x201810);
    hemi.intensity = 0.4;
  } else {
    hemi.color.setHex(0x5588cc);
    hemi.groundColor.setHex(0x223322);
    hemi.intensity = 0.4 + dayF * 0.4;
  }

  // Sky / fog colour
  var fogR, fogG, fogB;
  if (isNight) {
    fogR=0.01; fogG=0.01; fogB=0.04;
  } else if (isDawn) {
    fogR=0.20; fogG=0.12; fogB=0.22;
  } else if (isDusk) {
    fogR=0.30; fogG=0.12; fogB=0.08;
  } else {
    var dF = Math.min(dayF, 1);
    fogR = 0.20 + dF*0.35;
    fogG = 0.30 + dF*0.40;
    fogB = 0.40 + dF*0.45;
  }
  var fogCol = new THREE.Color(fogR, fogG, fogB);
  scene.background = fogCol;
  scene.fog.color.copy(fogCol);

  // Exposure
  renderer.toneMappingExposure = isNight ? 0.5 : 0.85 + dayF * 0.35;

  // Street lights: always on when toggle is active
  streetLightGroup.visible = streetLightsOn;
  document.getElementById('lights-btn').style.opacity = '1';

  // Clock
  var h = Math.floor(t * 24);
  var m = Math.floor((t * 24 - h) * 60);
  document.getElementById('time-display').textContent =
    String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

// ---- City -------------------------------------------------------------------
var GRID = 5, BLOCK = 28, ROAD = 8, CELL = BLOCK + ROAD;
var HALF = GRID * CELL / 2;
function rnd(a,b){ return a + Math.random()*(b-a); }
function rndI(a,b){ return Math.floor(rnd(a,b+0.99)); }

// Ground
var groundGeos = [], roadGeos = [];
var base = new THREE.PlaneGeometry(GRID*CELL+40, GRID*CELL+40);
base.rotateX(-Math.PI/2);
groundGeos.push(base);

for (var i=0; i<=GRID; i++) {
  var p = i*CELL - HALF;
  var rh = new THREE.PlaneGeometry(GRID*CELL+ROAD, ROAD); rh.rotateX(-Math.PI/2); rh.translate(0,0.01,p); roadGeos.push(rh);
  var rv = new THREE.PlaneGeometry(ROAD, GRID*CELL+ROAD); rv.rotateX(-Math.PI/2); rv.translate(p,0.01,0); roadGeos.push(rv);
}

var groundMesh = new THREE.Mesh(BGU.mergeGeometries(groundGeos), new THREE.MeshLambertMaterial({color:0x555558}));
groundMesh.receiveShadow = true; scene.add(groundMesh);

var roadMesh = new THREE.Mesh(BGU.mergeGeometries(roadGeos), new THREE.MeshLambertMaterial({color:0x3a3a3c}));
roadMesh.receiveShadow = true; scene.add(roadMesh);

// Pavement -- instanced
var dummy = new THREE.Object3D();
var paveInst = new THREE.InstancedMesh(new THREE.BoxGeometry(BLOCK,0.1,BLOCK), new THREE.MeshLambertMaterial({color:0x484848}), GRID*GRID);
paveInst.receiveShadow = true;
var pi2 = 0;
for (var gx=0; gx<GRID; gx++) for (var gz=0; gz<GRID; gz++) {
  dummy.position.set(gx*CELL-HALF+ROAD+BLOCK/2, 0.05, gz*CELL-HALF+ROAD+BLOCK/2);
  dummy.scale.set(1,1,1); dummy.updateMatrix();
  paveInst.setMatrixAt(pi2++, dummy.matrix);
}
scene.add(paveInst);

// Buildings -- instanced per colour
var buildingBoxes = []; // AABB colliders for each building {minX,maxX,minZ,maxZ}
var palColors = [0x8a8e9a,0x9a9ea8,0x7a7e8a,0xa0a4ae,0x888c98,0x9498a2];
var batches = palColors.map(function(c){ return {mat:new THREE.MeshLambertMaterial({color:c}), mats:[]}; });
var unitBox = new THREE.BoxGeometry(1,1,1);

for (var gx=0; gx<GRID; gx++) for (var gz=0; gz<GRID; gz++) {
  var bx2 = gx*CELL-HALF+ROAD, bz2 = gz*CELL-HALF+ROAD;
  var nb = rndI(2,5);
  for (var b=0; b<nb; b++) {
    var bw=rnd(4,9), bd=rnd(4,9), bh=rnd(4,22);
    var px=bx2+rnd(0.5,BLOCK-bw-0.5), pz3=bz2+rnd(0.5,BLOCK-bd-0.5);
    var bi=rndI(0,batches.length-1);
    dummy.position.set(px+bw/2, bh/2, pz3+bd/2);
    dummy.scale.set(bw,bh,bd); dummy.updateMatrix();
    batches[bi].mats.push(dummy.matrix.clone());
    // Store flat AABB collider for this building
    buildingBoxes.push({minX:px, maxX:px+bw, minZ:pz3, maxZ:pz3+bd});
  }
}
batches.forEach(function(batch) {
  if (!batch.mats.length) return;
  var inst = new THREE.InstancedMesh(unitBox, batch.mat, batch.mats.length);
  inst.castShadow = true; inst.receiveShadow = true;
  batch.mats.forEach(function(m,i){ inst.setMatrixAt(i,m); });
  inst.instanceMatrix.needsUpdate = true;
  scene.add(inst);
});

// Poles (merged, visual only)
var poleGeos = [];
for (var gx=0; gx<=GRID; gx++) for (var gz=0; gz<=GRID; gz++) {
  var px2=gx*CELL-HALF, pz4=gz*CELL-HALF;
  var pg = new THREE.CylinderGeometry(0.06,0.06,4.5,5);
  pg.translate(px2,2.25,pz4); poleGeos.push(pg);
}
scene.add(new THREE.Mesh(BGU.mergeGeometries(poleGeos), new THREE.MeshLambertMaterial({color:0x2a2a35})));

// Street point lights -- placed at intersections
var slPositions = [
  [-HALF*0.5, 4.5, -HALF*0.5],
  [ HALF*0.5, 4.5, -HALF*0.5],
  [-HALF*0.5, 4.5,  HALF*0.5],
  [ HALF*0.5, 4.5,  HALF*0.5],
  [0, 4.5, 0]
];
slPositions.forEach(function(pos) {
  var pl = new THREE.PointLight(0xff9944, 4.0, 35, 1.5);
  pl.position.set(pos[0], pos[1], pos[2]);
  streetLightGroup.add(pl);
});
// Start hidden (daytime)
streetLightGroup.visible = false;

// ---- Character --------------------------------------------------------------
var character = null;
var mixer = null;
var idleAction = null, walkAction = null;
var isWalking = false;
var animState = 'idle'; // 'idle' or 'walk'

var loadFill = document.getElementById('load-fill');
var loadMsg  = document.getElementById('load-msg');

var draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
var gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(draco);

loadFill.style.width = '40%';
loadMsg.textContent = 'Loading character...';

gltfLoader.load('clarity_builder.glb',
  function(g) {
    character = g.scene;
    character.traverse(function(c){ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });

    // Spawn character at nearest road intersection (guaranteed clear of buildings)
    // Roads are at i*CELL-HALF: -90,-54,-18,18,54,90
    // Nearest intersection to camera origin: (-18, 0, -18)
    scene.add(character);
    character.position.set(-18, 0, -18);

    // Push character out of any building at spawn (safety check)
    (function resolveSpawnCollision() {
      var CHAR_R = 0.45;
      for (var iter=0; iter<10; iter++) {
        var moved = false;
        for (var ci=0; ci<buildingBoxes.length; ci++) {
          var bb = buildingBoxes[ci];
          var cx3 = character.position.x, cz3 = character.position.z;
          var ex3 = Math.max(bb.minX, Math.min(cx3, bb.maxX));
          var ez3 = Math.max(bb.minZ, Math.min(cz3, bb.maxZ));
          var dx3 = cx3-ex3, dz3 = cz3-ez3;
          var dd3 = Math.sqrt(dx3*dx3+dz3*dz3);
          if (dd3 < CHAR_R) {
            if (dd3 < 0.0001) { character.position.x += CHAR_R; }
            else { var p3=(CHAR_R-dd3)/dd3; character.position.x+=dx3*p3; character.position.z+=dz3*p3; }
            moved = true;
          }
        }
        if (!moved) break;
      }
    })();

    // Animations -- state machine: idle or walk, crossfade between
    if (g.animations && g.animations.length > 0) {
      mixer = new THREE.AnimationMixer(character);
      var clips = g.animations;

      var idleClip = null, walkClip = null;
      clips.forEach(function(c) {
        var n = c.name.toLowerCase();
        if (n.indexOf('idle') >= 0) idleClip = c;
        else if (n.indexOf('walk') >= 0) walkClip = c;
      });
      if (!idleClip) idleClip = clips[0];
      if (!walkClip && clips.length > 1) walkClip = clips[1];

      if (idleClip) {
        idleAction = mixer.clipAction(idleClip);
        idleAction.setLoop(THREE.LoopRepeat);
        idleAction.clampWhenFinished = false;
        idleAction.play(); // only idle plays at start
      }
      if (walkClip) {
        walkAction = mixer.clipAction(walkClip);
        walkAction.setLoop(THREE.LoopRepeat);
        walkAction.clampWhenFinished = false;
        // walkAction starts stopped -- will be faded in when needed
      }
    }

    // Point orbit at chest height and position camera to see character
    var b2 = new THREE.Box3().setFromObject(character);
    var charH = b2.max.y - b2.min.y;
    var chestH = charH * 0.55;
    orbit.target.set(character.position.x, chestH, character.position.z);
    // Place camera in front at a good angle
    camera.position.set(character.position.x, chestH + 1.5, character.position.z + 6);
    orbit.update();

    finishLoading();
  },
  function(prog) {
    if (prog.total) loadFill.style.width = (40 + prog.loaded/prog.total*55) + '%';
  },
  function() {
    // Fallback placeholder
    var geo = new THREE.CapsuleGeometry(0.35, 1.3, 4, 8);
    character = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({color:0xe8c547}));
    character.position.y = 0.65;
    character.castShadow = true;
    scene.add(character);
    finishLoading();
  }
);

function finishLoading() {
  loadFill.style.width = '100%';
  setTimeout(function() {
    var el = document.getElementById('loading');
    el.style.opacity = '0';
    setTimeout(function(){ el.style.display='none'; }, 600);
  }, 300);
  streetLightGroup.visible = streetLightsOn;
}

// ---- Pointer lock (walk mouse-look) ----------------------------------------
var walkYaw   = Math.PI; // start facing camera
var walkPitch = -0.3;    // slight downward angle
var WALK_CAM_DIST = 7;
var WALK_CAM_HEIGHT = 1.8;
var pointerLocked = false;

document.addEventListener('pointerlockchange', function() {
  pointerLocked = !!document.pointerLockElement;
  document.getElementById('pointer-hint').classList.toggle('visible', mode==='walk' && !pointerLocked);
});

renderer.domElement.addEventListener('click', function() {
  if (mode === 'walk' && !pointerLocked) {
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener('mousemove', function(e) {
  if (!pointerLocked || mode !== 'walk') return;
  walkYaw   -= e.movementX * 0.003;
  walkPitch -= e.movementY * 0.003;
  walkPitch  = Math.max(-0.6, Math.min(0.5, walkPitch));
});

// ---- Mode -------------------------------------------------------------------
var mode = 'camera';
var hintEl       = document.getElementById('hint');
var pointerHint  = document.getElementById('pointer-hint');
var dpad         = document.getElementById('dpad');
var optCamera    = document.getElementById('opt-camera');
var optWalk      = document.getElementById('opt-walk');

function setMode(m) {
  mode = m;
  orbit.enabled = (m === 'camera');
  if (m === 'camera') {
    optCamera.classList.add('active');
    optWalk.classList.remove('active');
    document.getElementById('panel-camera').style.display = 'block';
    document.getElementById('panel-walk').style.display = 'none';
    dpad.classList.remove('visible');
    if (document.pointerLockElement) document.exitPointerLock();
    // Restore orbit target to character
    if (character) {
      var b = new THREE.Box3().setFromObject(character);
      orbit.target.set(character.position.x, (b.max.y-b.min.y)*0.5 + character.position.y, character.position.z);
      orbit.update();
    }
  } else {
    optWalk.classList.add('active');
    optCamera.classList.remove('active');
    document.getElementById('panel-camera').style.display = 'none';
    document.getElementById('panel-walk').style.display = 'block';
    dpad.classList.add('visible');
    // Init yaw to face away from current camera
    if (character) {
      var dx = character.position.x - camera.position.x;
      var dz = character.position.z - camera.position.z;
      walkYaw = Math.atan2(dx, dz);
    }
  }
}
optCamera.addEventListener('click', function(){ setMode('camera'); });
optWalk.addEventListener('click',   function(){ setMode('walk');   });

// ---- Lenses -----------------------------------------------------------------
document.querySelectorAll('.lens-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.lens-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    camera.fov = parseFloat(btn.dataset.fov);
    camera.updateProjectionMatrix();
  });
});

// ---- Time slider ------------------------------------------------------------
document.getElementById('time-slider').addEventListener('input', function(e) {
  applyTime(parseFloat(e.target.value));
});

// ---- Street lights toggle ---------------------------------------------------
document.getElementById('lights-btn').addEventListener('click', function() {
  streetLightsOn = !streetLightsOn;
  this.textContent = streetLightsOn ? 'Lights ON' : 'Lights OFF';
  this.classList.toggle('active', streetLightsOn);
  // Re-evaluate visibility for current time
  applyTime(parseFloat(document.getElementById('time-slider').value));
});

// ---- Quality toggle ---------------------------------------------------------
var hq = true;
document.getElementById('quality-btn').addEventListener('click', function() {
  hq = !hq;
  renderer.setPixelRatio(hq ? Math.min(window.devicePixelRatio,2) : 1);
  renderer.shadowMap.enabled = hq;
  this.textContent = hq ? 'High' : 'Low';
  this.classList.toggle('active', hq);
});

// ---- Keys -------------------------------------------------------------------
var keys = {forward:false, back:false, left:false, right:false, camUp:false, camDown:false, camLeft:false, camRight:false};
window.addEventListener('keydown', function(e) {
  if (e.key==='w'||e.key==='W') keys.forward=true;
  if (e.key==='s'||e.key==='S') keys.back=true;
  if (e.key==='a'||e.key==='A') keys.left=true;
  if (e.key==='d'||e.key==='D') keys.right=true;
  if (e.key==='ArrowUp')    keys.camUp=true;
  if (e.key==='ArrowDown')  keys.camDown=true;
  if (e.key==='ArrowLeft')  keys.camLeft=true;
  if (e.key==='ArrowRight') keys.camRight=true;
  if (e.key==='c'||e.key==='C') setMode(mode==='camera'?'walk':'camera');
  if (e.key==='Escape' && mode==='walk') setMode('camera');
});
window.addEventListener('keyup', function(e) {
  if (e.key==='w'||e.key==='W') keys.forward=false;
  if (e.key==='s'||e.key==='S') keys.back=false;
  if (e.key==='a'||e.key==='A') keys.left=false;
  if (e.key==='d'||e.key==='D') keys.right=false;
  if (e.key==='ArrowUp')    keys.camUp=false;
  if (e.key==='ArrowDown')  keys.camDown=false;
  if (e.key==='ArrowLeft')  keys.camLeft=false;
  if (e.key==='ArrowRight') keys.camRight=false;
});

function dBtn(id, key) {
  var el = document.getElementById(id);
  ['pointerdown','touchstart'].forEach(function(ev) {
    el.addEventListener(ev, function(e){ e.preventDefault(); keys[key]=true; el.classList.add('pressed'); }, {passive:false});
  });
  ['pointerup','touchend','pointerleave'].forEach(function(ev) {
    el.addEventListener(ev, function(){ keys[key]=false; el.classList.remove('pressed'); });
  });
}
dBtn('btn-forward','forward'); dBtn('btn-back','back');
dBtn('btn-left','left');       dBtn('btn-right','right');

// ---- Character drag (camera mode) ------------------------------------------
var raycaster   = new THREE.Raycaster();
var mouse2d     = new THREE.Vector2();
var groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
var dragHint    = document.getElementById('drag-hint');
var isDragging  = false;
var dragOffset  = new THREE.Vector3(); // offset from character origin to hit point

renderer.domElement.addEventListener('pointermove', function(e) {
  if (mode !== 'camera') return;
  mouse2d.set(
    (e.clientX / window.innerWidth)  * 2 - 1,
   -(e.clientY / window.innerHeight) * 2 + 1
  );

  if (isDragging && character) {
    // Project mouse onto ground plane and move character
    raycaster.setFromCamera(mouse2d, camera);
    var hit = new THREE.Vector3();
    raycaster.ray.intersectPlane(groundPlane, hit);
    if (hit) {
      character.position.x = hit.x - dragOffset.x;
      character.position.z = hit.z - dragOffset.z;
      // Keep feet on ground
      var b = new THREE.Box3().setFromObject(character);
      character.position.y = -b.min.y + character.position.y;
    }
    return;
  }

  // Hover detection -- change cursor and show tooltip when over character
  if (character) {
    raycaster.setFromCamera(mouse2d, camera);
    var hits = raycaster.intersectObject(character, true);
    var tooltip = document.getElementById('hover-tooltip');
    if (hits.length) {
      renderer.domElement.style.cursor = 'grab';
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top  = e.clientY + 'px';
      tooltip.classList.add('visible');
    } else {
      renderer.domElement.style.cursor = 'default';
      tooltip.classList.remove('visible');
    }
  }
});

renderer.domElement.addEventListener('pointerdown', function(e) {
  if (mode !== 'camera' || !character) return;
  mouse2d.set(
    (e.clientX / window.innerWidth)  * 2 - 1,
   -(e.clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(mouse2d, camera);
  var hits = raycaster.intersectObject(character, true);
  if (hits.length > 0) {
    isDragging = true;
    orbit.enabled = false;
    renderer.domElement.style.cursor = 'grabbing';
    dragHint.classList.add('visible');
    document.getElementById('hover-tooltip').classList.remove('visible');
    // Store offset so character doesn't jump to cursor centre
    var groundHit = new THREE.Vector3();
    raycaster.ray.intersectPlane(groundPlane, groundHit);
    dragOffset.set(
      groundHit.x - character.position.x,
      0,
      groundHit.z - character.position.z
    );
    e.stopPropagation();
  }
});

window.addEventListener('pointerup', function() {
  if (isDragging) {
    isDragging = false;
    if (mode === 'camera') orbit.enabled = true;
    renderer.domElement.style.cursor = 'default';
    dragHint.classList.remove('visible');
    // Re-centre orbit on new character position
    if (character) {
      var b = new THREE.Box3().setFromObject(character);
      var charH = b.max.y - b.min.y;
      orbit.target.set(character.position.x, charH*0.5 + character.position.y, character.position.z);
      orbit.update();
    }
  }
});

// ---- Loop -------------------------------------------------------------------
var clock = new THREE.Clock();
var cDir   = new THREE.Vector3();
var cRight = new THREE.Vector3();
var move   = new THREE.Vector3();
var ideal  = new THREE.Vector3();
var lookAt = new THREE.Vector3();
var UP     = new THREE.Vector3(0,1,0);

(function loop() {
  requestAnimationFrame(loop);
  var dt = Math.min(clock.getDelta(), 0.05);

  // Animation state machine -- clean fade between idle and walk
  if (mixer) {
    var shouldWalk = mode === 'walk' && (keys.forward || keys.back || keys.left || keys.right);
    var newState = shouldWalk ? 'walk' : 'idle';
    if (newState !== animState) {
      animState = newState;
      if (newState === 'walk' && idleAction && walkAction) {
        idleAction.fadeOut(0.2);
        walkAction.reset().fadeIn(0.2).play();
      } else if (newState === 'idle' && idleAction && walkAction) {
        walkAction.fadeOut(0.2);
        idleAction.reset().fadeIn(0.2).play();
      }
    }
    mixer.update(dt);

    // Continuous grounding: every frame, find lowest foot bone world Y
    // and snap character to floor. Works regardless of skeleton structure.
    var footNames = ['foot','toe','ankle'];
    var lowestFootY = Infinity;
    character.updateMatrixWorld(true);
    character.traverse(function(node) {
      if (node.isBone) {
        var n = node.name.toLowerCase();
        for (var fi=0; fi<footNames.length; fi++) {
          if (n.indexOf(footNames[fi]) >= 0) {
            var wp2 = new THREE.Vector3();
            node.getWorldPosition(wp2);
            if (wp2.y < lowestFootY) lowestFootY = wp2.y;
            break;
          }
        }
      }
    });
    if (lowestFootY < Infinity) {
      character.position.y -= (lowestFootY - 0.08); // 0.08 = ankle-to-sole gap
    }
  }

  // Character movement
  if (mode === 'walk' && character) {
    var moving2 = keys.forward || keys.back || keys.left || keys.right;
    if (moving2) {
      cDir.set(-Math.sin(walkYaw), 0, -Math.cos(walkYaw)).normalize();
      cRight.crossVectors(cDir, UP).normalize();
      move.set(0,0,0);
      if (keys.forward) move.add(cDir);
      if (keys.back)    move.sub(cDir);
      if (keys.right)   move.add(cRight);
      if (keys.left)    move.sub(cRight);
      if (move.lengthSq() > 0) {
        move.normalize();
        character.position.addScaledVector(move, 5.5 * dt);
        var targetY = Math.atan2(move.x, move.z);
        character.rotation.y = THREE.MathUtils.lerp(character.rotation.y, targetY, 0.12);
      }

      // Collision resolution -- push character out of building AABBs
      var CHAR_R = 0.45;
      var cx2 = character.position.x;
      var cz2 = character.position.z;
      for (var ci = 0; ci < buildingBoxes.length; ci++) {
        var bb = buildingBoxes[ci];
        // Expand box by char radius for circle-AABB test
        var ex = Math.max(bb.minX, Math.min(cx2, bb.maxX));
        var ez = Math.max(bb.minZ, Math.min(cz2, bb.maxZ));
        var ddx = cx2 - ex, ddz = cz2 - ez;
        var dd = Math.sqrt(ddx*ddx + ddz*ddz);
        if (dd < CHAR_R) {
          // Push character out along shortest separation vector
          if (dd < 0.0001) {
            // Exactly on edge -- push out on X
            character.position.x = bb.maxX + CHAR_R;
          } else {
            var push = (CHAR_R - dd) / dd;
            character.position.x += ddx * push;
            character.position.z += ddz * push;
          }
        }
      }
    }

    // Follow camera with mouse-look orbit
    var cp = character.position;
    var sinY = Math.sin(walkYaw),   cosY = Math.cos(walkYaw);
    var sinP = Math.sin(walkPitch), cosP = Math.cos(walkPitch);
    var camOffX = sinY * cosP * WALK_CAM_DIST;
    var camOffY = -sinP * WALK_CAM_DIST + WALK_CAM_HEIGHT;
    var camOffZ = cosY * cosP * WALK_CAM_DIST;
    var targetPos = new THREE.Vector3(cp.x + camOffX, cp.y + camOffY, cp.z + camOffZ);
    camera.position.lerp(targetPos, 0.12);
    lookAt.set(cp.x, cp.y + 1.4, cp.z);
    camera.lookAt(lookAt);
  }

  // Arrow keys: vertical camera pan in camera mode
  if (mode === 'camera') {
    var panSpeed = 5 * dt;
    if (keys.camUp)    { orbit.target.y += panSpeed; camera.position.y += panSpeed; }
    if (keys.camDown)  { orbit.target.y -= panSpeed; camera.position.y -= panSpeed; orbit.target.y = Math.max(0.1, orbit.target.y); }
    if (keys.camLeft || keys.camRight) {
      // Pan left/right: shift target and camera along the camera's right axis
      var camRightVec = new THREE.Vector3();
      camRightVec.crossVectors(camera.getWorldDirection(new THREE.Vector3()), camera.up).normalize();
      var lr = keys.camLeft ? -panSpeed : panSpeed;
      orbit.target.addScaledVector(camRightVec, lr);
      camera.position.addScaledVector(camRightVec, lr);
    }
    orbit.update();
  }
  renderer.render(scene, camera);
})();

// ---- Resize -----------------------------------------------------------------
window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Apply initial time
applyTime(0.4);
</script>
</body>
