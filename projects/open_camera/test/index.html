<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarity Builder</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #060810; font-family: 'DM Mono', monospace; }
canvas { display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; }

#top-left {
  position: absolute; top: 20px; left: 20px;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: all;
}
#mode-btn {
  background: rgba(6,8,16,0.85); border: 1px solid rgba(255,255,255,0.15);
  color: #fff; font-family: 'DM Mono', monospace; font-size: 10px;
  letter-spacing: 0.18em; text-transform: uppercase;
  padding: 9px 16px; cursor: pointer; backdrop-filter: blur(14px); transition: all 0.2s;
}
#mode-btn:hover { background: rgba(255,255,255,0.06); }
#mode-btn.walk  { border-color: #e8c547; color: #e8c547; }
#hint { color: rgba(255,255,255,0.22); font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; padding-left: 2px; }

#top-right {
  position: absolute; top: 20px; right: 20px; text-align: right;
  color: rgba(255,255,255,0.2); font-size: 8px; letter-spacing: 0.2em;
  text-transform: uppercase; line-height: 2.2; pointer-events: none;
}
#top-right span { color: rgba(232,197,71,0.5); }
#time-display { color: rgba(255,255,255,0.5); font-size: 10px; }

#bottom-bar {
  position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; pointer-events: all;
}
.bar-label { color: rgba(255,255,255,0.2); font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; }
.bar-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.1); }

.lens-btn, .icon-btn {
  background: rgba(6,8,16,0.85); border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.4); font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 0.1em; padding: 7px 12px;
  cursor: pointer; backdrop-filter: blur(14px); transition: all 0.2s; text-transform: uppercase;
}
.lens-btn:hover, .icon-btn:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
.lens-btn.active, .icon-btn.active { border-color: #e8c547; color: #e8c547; background: rgba(232,197,71,0.08); }

#time-wrap { display: flex; align-items: center; gap: 8px; }
#time-slider {
  -webkit-appearance: none; width: 120px; height: 2px;
  background: rgba(255,255,255,0.1); outline: none; cursor: pointer;
}
#time-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 10px; height: 10px;
  background: #e8c547; cursor: pointer;
}

#dpad { position: absolute; bottom: 88px; right: 24px; display: none; pointer-events: all; }
#dpad.visible { display: block; }
.dpad-grid { display: grid; grid-template-columns: repeat(3,46px); grid-template-rows: repeat(3,46px); gap: 3px; }
.dpad-btn {
  background: rgba(6,8,16,0.85); border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.65); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; backdrop-filter: blur(14px); user-select: none; transition: all 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.dpad-btn:active, .dpad-btn.pressed { background: rgba(232,197,71,0.15); border-color: rgba(232,197,71,0.5); color: #e8c547; }
.dpad-empty { background: transparent; border: none; pointer-events: none; }
.dpad-center { background: rgba(232,197,71,0.05); border: 1px solid rgba(232,197,71,0.12); pointer-events: none; display: flex; align-items: center; justify-content: center; color: rgba(232,197,71,0.25); font-size: 7px; }

#loading {
  position: fixed; inset: 0; background: #060810;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  z-index: 100; transition: opacity 0.6s;
}
#loading h1 { color: rgba(255,255,255,0.6); font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase; }
#loading p  { color: rgba(232,197,71,0.45); font-size: 8px; letter-spacing: 0.25em; text-transform: uppercase; }
#load-bar   { width: 160px; height: 1px; background: rgba(255,255,255,0.07); position: relative; overflow: hidden; }
#load-fill  { position: absolute; top:0; left:0; height:100%; background:#e8c547; width:0%; transition: width 0.3s; }
#load-msg   { color: rgba(255,255,255,0.18); font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; }
</style>
</head>
<body>

<div id="loading">
  <h1>Clarity Builder</h1>
  <p>Berlin · Kreuzberg</p>
  <div id="load-bar"><div id="load-fill"></div></div>
  <div id="load-msg">Building city...</div>
</div>

<div id="ui">
  <div id="top-left">
    <button id="mode-btn">⊙&nbsp;&nbsp;Camera Mode</button>
    <div id="hint">Drag to orbit &nbsp;·&nbsp; Scroll to zoom</div>
  </div>

  <div id="top-right">
    Clarity Builder<br><span>Berlin · Kreuzberg</span><br>
    <div id="time-display">06:00</div>
  </div>

  <div id="bottom-bar">
    <span class="bar-label">Lens</span>
    <button class="lens-btn" data-fov="74">24mm</button>
    <button class="lens-btn active" data-fov="54">35mm</button>
    <button class="lens-btn" data-fov="40">50mm</button>
    <button class="lens-btn" data-fov="24">85mm</button>
    <button class="lens-btn" data-fov="15">135mm</button>
    <div class="bar-divider"></div>
    <div id="time-wrap">
      <span class="bar-label">Time</span>
      <input type="range" id="time-slider" min="0" max="1" step="0.001" value="0.25">
    </div>
    <div class="bar-divider"></div>
    <button class="icon-btn active" id="lights-btn">⚡ Lights</button>
    <div class="bar-divider"></div>
    <button class="icon-btn active" id="quality-btn">◈ High</button>
  </div>

  <div id="dpad">
    <div class="dpad-grid">
      <div class="dpad-empty"></div><div class="dpad-btn" id="btn-forward">↑</div><div class="dpad-empty"></div>
      <div class="dpad-btn" id="btn-left">←</div><div class="dpad-center">CB</div><div class="dpad-btn" id="btn-right">→</div>
      <div class="dpad-empty"></div><div class="dpad-btn" id="btn-back">↓</div><div class="dpad-empty"></div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }       from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }          from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }         from 'three/addons/loaders/DRACOLoader.js';
import { BufferGeometryUtils } from 'three/addons/utils/BufferGeometryUtils.js';

// \u2500\u2500 Renderer \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// \u2500\u2500 Scene \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x080c18, 60, 180);

// \u2500\u2500 Camera \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 6, 14);

// \u2500\u2500 Orbit \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 1.2, 0);
orbit.enableDamping = true; orbit.dampingFactor = 0.06;
orbit.minDistance = 1.5; orbit.maxDistance = 80;
orbit.maxPolarAngle = Math.PI / 2 - 0.02;
orbit.update();

// \u2500\u2500 Lighting \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const ambient  = new THREE.AmbientLight(0xffffff, 0.1);
const sun      = new THREE.DirectionalLight(0xffffff, 1.0);
const skyLight = new THREE.HemisphereLight(0x88bbee, 0x111118, 0.4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 200;
sun.shadow.camera.left = sun.shadow.camera.bottom = -80;
sun.shadow.camera.right = sun.shadow.camera.top = 80;
sun.shadow.bias = -0.001;
scene.add(ambient, sun, skyLight);

const streetLightGroup = new THREE.Group();
scene.add(streetLightGroup);
let streetLightsOn = true;

// \u2500\u2500 Time of day \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
// t: 0=midnight, 0.25=dawn, 0.5=noon, 0.75=dusk, 1=midnight
const C = {
  skyNight:   new THREE.Color(0x01020a),
  skyDawn:    new THREE.Color(0x2a1030),
  skyMorning: new THREE.Color(0x90b8e8),
  skyNoon:    new THREE.Color(0x88c0f0),
  skyDusk:    new THREE.Color(0x3a1008),
  fogNight:   new THREE.Color(0x010208),
  fogDawn:    new THREE.Color(0x18101e),
  fogDay:     new THREE.Color(0xb0c8e0),
  fogDusk:    new THREE.Color(0x380e06),
  sunDawn:    new THREE.Color(0xff5522),
  sunDay:     new THREE.Color(0xfff5d0),
  sunNoon:    new THREE.Color(0xfffef8),
};

const lightsBtn = document.getElementById('lights-btn');

function applyTime(t) {
  // Sun arc
  const elevation = Math.sin((t - 0.25) * Math.PI * 2); // -1 to 1
  const azimuth   = (t - 0.25) * Math.PI * 2;
  sun.position.set(Math.cos(azimuth) * 80, elevation * 70, Math.sin(azimuth) * 40);

  const dayF    = Math.max(0, elevation);       // 0 at horizon, 1 at noon
  const horizF  = Math.max(0, 1 - Math.abs(elevation) * 5); // peak at horizon
  const isDawn  = t > 0.18 && t < 0.33;
  const isDusk  = t > 0.67 && t < 0.82;
  const isNight = elevation < -0.1;

  // Sun color & intensity
  const sunColor = isDawn || isDusk
    ? C.sunDawn.clone().lerp(C.sunDay, dayF * 2)
    : C.sunDay.clone().lerp(C.sunNoon, dayF);
  sun.color.copy(sunColor);
  sun.intensity = Math.max(0, dayF * 2.2) + horizF * 0.9;
  sun.castShadow = sun.intensity > 0.25;

  // Ambient
  ambient.intensity = isNight ? 0.04 : 0.08 + dayF * 0.45;
  ambient.color.set(isNight ? 0x05090f : isDawn || isDusk ? 0x503828 : 0x8899aa);

  // Sky hemi
  skyLight.intensity = isNight ? 0.06 : 0.1 + dayF * 0.55;
  skyLight.color.set(
    isNight ? 0x01020a : isDawn ? 0x3a1a3a : isDusk ? 0x401808 : new THREE.Color().lerpColors(new THREE.Color(0x3a70aa), new THREE.Color(0x88c0f0), dayF)
  );
  skyLight.groundColor.set(isNight ? 0x040508 : 0x182030);

  // Sky background & fog
  const fogCol = isNight ? C.fogNight
    : isDawn  ? C.fogDawn
    : isDusk  ? C.fogDusk
    : new THREE.Color().lerpColors(C.fogDawn, C.fogDay, dayF);
  scene.background = fogCol.clone();
  scene.fog.color.copy(fogCol);

  // Exposure
  renderer.toneMappingExposure = isNight ? 0.45 : 0.72 + dayF * 0.32;

  // Street lights
  const needLights = elevation < 0.2;
  streetLightGroup.visible = needLights && streetLightsOn;
  lightsBtn.style.opacity = needLights ? '1' : '0.35';

  // Clock display
  const h = Math.floor(t * 24);
  const m = Math.floor((t * 24 - h) * 60);
  document.getElementById('time-display').textContent =
    String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

// \u2500\u2500 City (all merged / instanced for performance) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const GRID = 5, BLOCK = 28, ROAD = 8, CELL = BLOCK + ROAD, HALF = GRID * CELL / 2;
const rnd  = (a,b) => a + Math.random() * (b-a);
const rndI = (a,b) => Math.floor(rnd(a, b+0.99));

// Ground + roads merged per material
const groundGeos = [], roadGeos = [];
const base = new THREE.PlaneGeometry(GRID*CELL+40, GRID*CELL+40);
base.rotateX(-Math.PI/2); groundGeos.push(base);

for (let i = 0; i <= GRID; i++) {
  const p = i * CELL - HALF;
  const rh = new THREE.PlaneGeometry(GRID*CELL+ROAD, ROAD); rh.rotateX(-Math.PI/2); rh.translate(0,0.01,p); roadGeos.push(rh);
  const rv = new THREE.PlaneGeometry(ROAD, GRID*CELL+ROAD); rv.rotateX(-Math.PI/2); rv.translate(p,0.01,0); roadGeos.push(rv);
}

scene.add(Object.assign(
  new THREE.Mesh(BufferGeometryUtils.mergeGeometries(groundGeos), new THREE.MeshLambertMaterial({ color: 0x111318 })),
  { receiveShadow: true }
));
scene.add(Object.assign(
  new THREE.Mesh(BufferGeometryUtils.mergeGeometries(roadGeos), new THREE.MeshLambertMaterial({ color: 0x0a0c10 })),
  { receiveShadow: true }
));

// Pavement \u2014 instanced
const paveInst = new THREE.InstancedMesh(new THREE.BoxGeometry(BLOCK,0.1,BLOCK), new THREE.MeshLambertMaterial({ color:0x181a22 }), GRID*GRID);
paveInst.receiveShadow = true;
const dummy = new THREE.Object3D();
let pi = 0;
for (let gx=0; gx<GRID; gx++) for (let gz=0; gz<GRID; gz++) {
  dummy.position.set(gx*CELL-HALF+ROAD+BLOCK/2, 0.05, gz*CELL-HALF+ROAD+BLOCK/2);
  dummy.scale.set(1,1,1); dummy.updateMatrix();
  paveInst.setMatrixAt(pi++, dummy.matrix);
}
scene.add(paveInst);

// Buildings \u2014 instanced per colour
const palColors = [0x1e2130,0x252838,0x1a1e2a,0x2a2d3e,0x1c2035,0x23263a];
const batches = palColors.map(c => ({ mat: new THREE.MeshLambertMaterial({color:c}), mats:[] }));
const unitBox = new THREE.BoxGeometry(1,1,1);

for (let gx=0; gx<GRID; gx++) for (let gz=0; gz<GRID; gz++) {
  const bx = gx*CELL-HALF+ROAD, bz = gz*CELL-HALF+ROAD;
  for (let b=0; b<rndI(2,5); b++) {
    const bw=rnd(4,9), bd=rnd(4,9), bh=rnd(4,22);
    const px=bx+rnd(0.5,BLOCK-bw-0.5), pz2=bz+rnd(0.5,BLOCK-bd-0.5);
    const bi = rndI(0, batches.length-1);
    dummy.position.set(px+bw/2, bh/2, pz2+bd/2);
    dummy.scale.set(bw,bh,bd); dummy.updateMatrix();
    batches[bi].mats.push(dummy.matrix.clone());
  }
}
batches.forEach(batch => {
  if (!batch.mats.length) return;
  const inst = new THREE.InstancedMesh(unitBox, batch.mat, batch.mats.length);
  inst.castShadow = true; inst.receiveShadow = true;
  batch.mats.forEach((m,i) => inst.setMatrixAt(i,m));
  inst.instanceMatrix.needsUpdate = true;
  scene.add(inst);
});

// Street lights \u2014 few point lights only
[[-HALF*0.5,-HALF*0.5],[HALF*0.5,-HALF*0.5],[-HALF*0.5,HALF*0.5],[HALF*0.5,HALF*0.5],[0,0]].forEach(([x,z]) => {
  const pl = new THREE.PointLight(0xff9944, 3.5, 32, 1.5);
  pl.position.set(x, 4.5, z);
  streetLightGroup.add(pl);
});

// Merged poles (visual only, no per-pole lights)
const poleGeos = [];
for (let gx=0; gx<=GRID; gx++) for (let gz=0; gz<=GRID; gz++) {
  const px=gx*CELL-HALF, pz2=gz*CELL-HALF;
  const pg = new THREE.CylinderGeometry(0.06,0.06,4.5,5);
  pg.translate(px,2.25,pz2); poleGeos.push(pg);
}
scene.add(new THREE.Mesh(BufferGeometryUtils.mergeGeometries(poleGeos), new THREE.MeshLambertMaterial({color:0x2a2a35})));

// \u2500\u2500 Character \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
let character=null, mixer=null, idleAction=null, walkAction=null, isWalking=false;
const loadFill=document.getElementById('load-fill'), loadMsg=document.getElementById('load-msg');

const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const gltfLoader = new GLTFLoader(); gltfLoader.setDRACOLoader(draco);
loadFill.style.width='40%'; loadMsg.textContent='Loading character...';

gltfLoader.load('clarity_builder.glb', g => {
  character = g.scene;
  character.traverse(c => { if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
  const box = new THREE.Box3().setFromObject(character);
  character.position.y = -box.min.y;
  scene.add(character);
  if (g.animations.length) {
    mixer = new THREE.AnimationMixer(character);
    const idle = g.animations.find(a=>a.name.toLowerCase().includes('idle'))||g.animations[0];
    const walk = g.animations.find(a=>a.name.toLowerCase().includes('walk'));
    if (idle){ idleAction=mixer.clipAction(idle); idleAction.play(); }
    if (walk){ walkAction=mixer.clipAction(walk); walkAction.setEffectiveWeight(0); walkAction.play(); }
  }
  const b2=new THREE.Box3().setFromObject(character);
  orbit.target.set(0,(b2.max.y-b2.min.y)*0.5,0); orbit.update();
  done();
}, p=>{ if(p.total) loadFill.style.width=(40+p.loaded/p.total*55)+'%'; },
()=>{
  character=new THREE.Mesh(new THREE.CapsuleGeometry(0.35,1.3,4,8), new THREE.MeshLambertMaterial({color:0xe8c547}));
  character.position.y=0.65; character.castShadow=true; scene.add(character); done();
});

function done() {
  loadFill.style.width='100%';
  setTimeout(()=>{ const el=document.getElementById('loading'); el.style.opacity='0'; setTimeout(()=>el.style.display='none',600); },250);
  applyTime(parseFloat(document.getElementById('time-slider').value));
}

// \u2500\u2500 Mode \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
let mode='camera';
const modeBtn=document.getElementById('mode-btn'), hintEl=document.getElementById('hint'), dpad=document.getElementById('dpad');
function setMode(m){
  mode=m; orbit.enabled=m==='camera';
  if(m==='camera'){ modeBtn.textContent='\u2299\u00a0\u00a0Camera Mode'; modeBtn.classList.remove('walk'); hintEl.textContent='Drag to orbit \u00a0\u00B7\u00a0 Scroll to zoom'; dpad.classList.remove('visible'); }
  else { modeBtn.textContent='\u25C8\u00a0\u00a0Walk Mode'; modeBtn.classList.add('walk'); hintEl.textContent='WASD or D-pad \u00a0\u00B7\u00a0 C to switch'; dpad.classList.add('visible'); }
}
modeBtn.addEventListener('click',()=>setMode(mode==='camera'?'walk':'camera'));

// \u2500\u2500 Lenses \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
document.querySelectorAll('.lens-btn').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.lens-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); camera.fov=parseFloat(btn.dataset.fov); camera.updateProjectionMatrix();
}));

// \u2500\u2500 Time slider \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
document.getElementById('time-slider').addEventListener('input',e=>applyTime(parseFloat(e.target.value)));

// \u2500\u2500 Street lights \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
lightsBtn.addEventListener('click',()=>{
  streetLightsOn=!streetLightsOn; lightsBtn.classList.toggle('active',streetLightsOn);
  applyTime(parseFloat(document.getElementById('time-slider').value));
});

// \u2500\u2500 Quality \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
let hq=true; const qualBtn=document.getElementById('quality-btn');
qualBtn.addEventListener('click',()=>{
  hq=!hq;
  renderer.setPixelRatio(hq?Math.min(window.devicePixelRatio,2):1);
  renderer.shadowMap.enabled=hq; sun.castShadow=hq&&sun.intensity>0.25;
  qualBtn.textContent=hq?'\u25C8 High':'\u25EB Low'; qualBtn.classList.toggle('active',hq);
});

// \u2500\u2500 Keys \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const keys={forward:false,back:false,left:false,right:false};
window.addEventListener('keydown',e=>{
  if(['w','W','ArrowUp'].includes(e.key))    keys.forward=true;
  if(['s','S','ArrowDown'].includes(e.key))  keys.back=true;
  if(['a','A','ArrowLeft'].includes(e.key))  keys.left=true;
  if(['d','D','ArrowRight'].includes(e.key)) keys.right=true;
  if(['c','C'].includes(e.key)) setMode(mode==='camera'?'walk':'camera');
});
window.addEventListener('keyup',e=>{
  if(['w','W','ArrowUp'].includes(e.key))    keys.forward=false;
  if(['s','S','ArrowDown'].includes(e.key))  keys.back=false;
  if(['a','A','ArrowLeft'].includes(e.key))  keys.left=false;
  if(['d','D','ArrowRight'].includes(e.key)) keys.right=false;
});
function dBtn(id,key){
  const el=document.getElementById(id);
  ['pointerdown','touchstart'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[key]=true;el.classList.add('pressed');},{passive:false}));
  ['pointerup','touchend','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>{keys[key]=false;el.classList.remove('pressed');}));
}
dBtn('btn-forward','forward'); dBtn('btn-back','back'); dBtn('btn-left','left'); dBtn('btn-right','right');

// \u2500\u2500 Anim blend \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function setWalking(w){
  if(!mixer||!idleAction||!walkAction||w===isWalking) return;
  isWalking=w;
  if(w){ idleAction.crossFadeTo(walkAction,0.2,true); walkAction.setEffectiveWeight(1); }
  else { walkAction.crossFadeTo(idleAction,0.2,true); idleAction.setEffectiveWeight(1); }
}

// \u2500\u2500 Resize \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
window.addEventListener('resize',()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });

// \u2500\u2500 Loop \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const clock=new THREE.Clock();
const _cDir=new THREE.Vector3(), _cRight=new THREE.Vector3(), _move=new THREE.Vector3();
const _ideal=new THREE.Vector3(), _look=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0);

(function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  if(mixer) mixer.update(dt);
  if(mode==='walk'&&character){
    const moving=keys.forward||keys.back||keys.left||keys.right;
    setWalking(moving);
    if(moving){
      camera.getWorldDirection(_cDir); _cDir.y=0; _cDir.normalize();
      _cRight.crossVectors(_cDir,_up).normalize();
      _move.set(0,0,0);
      if(keys.forward) _move.add(_cDir); if(keys.back) _move.sub(_cDir);
      if(keys.right) _move.add(_cRight); if(keys.left) _move.sub(_cRight);
      if(_move.lengthSq()>0){
        _move.normalize();
        character.position.addScaledVector(_move,5.5*dt);
        character.rotation.y=THREE.MathUtils.lerp(character.rotation.y,Math.atan2(_move.x,_move.z),0.12);
      }
    }
    const cp=character.position;
    const fwd=new THREE.Vector3(Math.sin(character.rotation.y),0,Math.cos(character.rotation.y));
    _ideal.copy(cp).sub(fwd.multiplyScalar(7)).add(new THREE.Vector3(0,4.5,0));
    camera.position.lerp(_ideal,0.06);
    _look.copy(cp).add(new THREE.Vector3(0,1.4,0));
    orbit.target.lerp(_look,0.08);
  }
  orbit.update();
  renderer.render(scene,camera);
})();
</script>
</body>
