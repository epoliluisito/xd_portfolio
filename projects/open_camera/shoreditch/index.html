<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Environment - Third Person</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: sans-serif;
            background-color: #87CEEB; /* Sky blue background */
        }
        /* The UI overlay before you click into the game */
        #ui-container {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            z-index: 10;
        }
        #ui-container h1 { font-size: 40px; margin-bottom: 10px; }
        #ui-container p { font-size: 18px; }
    </style>
</head>
<body>

    <!-- UI Overlay for Pointer Lock -->
    <div id="ui-container">
        <h1>Click to Play</h1>
        <p><b>WASD / Arrows</b> to move | <b>Mouse</b> to look around</p>
        <p style="font-size: 14px; margin-top:20px; color:#ccc;">Press ESC to show mouse cursor</p>
    </div>

    <!-- Import Three.js and Loaders directly from unpkg -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js'; // <-- Added Draco

        // ==========================================
        // 1. SCENE SETUP
        // ==========================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 200, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(100, 200, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // ==========================================
        // 2. LOADERS & DRACO DECODER SETUP
        // ==========================================
        
        // Setup Draco to decompress your optimized GLB files
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/');

        // Attach Draco to the standard GLTF Loader
        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        const collidableObjects = []; // For ground detection
        
        // --- SCALE ADJUSTMENTS ---
        // If your character is a giant, change CHARACTER_SCALE to 0.01
        const WORLD_SCALE = 1.0; 
        const CHARACTER_SCALE = 1.0; 

        // Player Variables
        const playerPivot = new THREE.Object3D(); // Handles Left/Right turning
        const cameraPivot = new THREE.Object3D(); // Handles Up/Down looking
        scene.add(playerPivot);
        playerPivot.add(cameraPivot);
        cameraPivot.add(camera);

        // POSITION CAMERA: (X, Y, Z) - Pulled back 6 meters, up 2 meters
        camera.position.set(0, 2, 6); 
        cameraPivot.position.set(0, 1.5, 0); 

        let characterMixer;
        let walkAction;

        // Load the Character
        loader.load('./clarity_builder.glb', (gltf) => {
            const character = gltf.scene;
            character.scale.set(CHARACTER_SCALE, CHARACTER_SCALE, CHARACTER_SCALE);
            
            // Make character cast shadows
            character.traverse((child) => {
                if (child.isMesh) child.castShadow = true;
            });

            // Ensure character faces away from the camera
            character.rotation.y = Math.PI;
            playerPivot.add(character);
            playerPivot.position.set(0, 5, 0); // Start slightly up in the air

            // Setup Animations 
            if (gltf.animations.length > 0) {
                characterMixer = new THREE.AnimationMixer(character);
                walkAction = characterMixer.clipAction(gltf.animations[0]); 
                walkAction.play();
                walkAction.paused = true; // Start paused until player moves
            }
        }, undefined, (error) => console.error("Error loading character:", error));

        // Load the World
        loader.load('./shoreditch_z19.glb', (gltf) => {
            const world = gltf.scene;
            world.scale.set(WORLD_SCALE, WORLD_SCALE, WORLD_SCALE);
            
            world.traverse((child) => {
                if (child.isMesh) {
                    child.receiveShadow = true;
                    collidableObjects.push(child); // Add to ground collision
                }
            });
            scene.add(world);
        }, undefined, (error) => console.error("Error loading world:", error));

        // ==========================================
        // 3. POINTER LOCK & MOUSE CONTROLS
        // ==========================================
        const uiContainer = document.getElementById('ui-container');
        let isLocked = false;

        uiContainer.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === document.body;
            uiContainer.style.display = isLocked ? 'none' : 'flex';
        });

        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        document.addEventListener('mousemove', (event) => {
            if (!isLocked) return;

            const sensitivity = 0.002;

            euler.setFromQuaternion(cameraPivot.quaternion);
            
            // Look up/down (Pitch)
            euler.x -= event.movementY * sensitivity;
            euler.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, euler.x)); // Clamp neck
            cameraPivot.quaternion.setFromEuler(euler);

            // Look left/right (Yaw)
            playerPivot.rotation.y -= event.movementX * sensitivity;
        });

        // ==========================================
        // 4. MOVEMENT & KEYBOARD
        // ==========================================
        const keys = { w: false, a: false, s: false, d: false };

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'arrowup') keys.w = true;
            if (key === 'a' || key === 'arrowleft') keys.a = true;
            if (key === 's' || key === 'arrowdown') keys.s = true;
            if (key === 'd' || key === 'arrowright') keys.d = true;
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'arrowup') keys.w = false;
            if (key === 'a' || key === 'arrowleft') keys.a = false;
            if (key === 's' || key === 'arrowdown') keys.s = false;
            if (key === 'd' || key === 'arrowright') keys.d = false;
        });

        // ==========================================
        // 5. ANIMATION & PHYSICS LOOP
        // ==========================================
        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const downVector = new THREE.Vector3(0, -1, 0);
        const playerSpeed = 5.0; // Meters per second

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Handle Character Animation update
            if (characterMixer) characterMixer.update(delta);

            // Check if user is pressing movement keys
            const isMoving = keys.w || keys.a || keys.s || keys.d;
            
            // Play or Pause animation
            if (walkAction) {
                if (isMoving && walkAction.paused) walkAction.paused = false;
                else if (!isMoving && !walkAction.paused) walkAction.paused = true;
            }

            // Move the player
            if (isMoving && isLocked) {
                const moveZ = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
                const moveX = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
                
                const direction = new THREE.Vector3(moveX, 0, moveZ).normalize();
                direction.applyQuaternion(playerPivot.quaternion); 
                playerPivot.position.addScaledVector(direction, playerSpeed * delta);
            }

            // Snap Player to Ground
            if (collidableObjects.length > 0) {
                const rayOrigin = playerPivot.position.clone();
                rayOrigin.y += 2.0; // Cast ray from 2 meters above feet
                raycaster.set(rayOrigin, downVector);
                
                const intersects = raycaster.intersectObjects(collidableObjects, false);
                if (intersects.length > 0) {
                    playerPivot.position.y = intersects[0].point.y; // Snap to ground height
                }
            }

            renderer.render(scene, camera);
        }

        // Handle Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
