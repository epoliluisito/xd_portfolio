<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOREDITCH — The Memory Builder</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; }
  #canvas-holder { position:fixed; inset:0; }
  canvas { display:block; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #brand {
    position:absolute; top:22px; left:26px; color:#fff;
    text-shadow:0 1px 8px rgba(0,0,0,.6);
  }
  #brand h1 { font-size:15px; letter-spacing:.34em; font-weight:700; }
  #brand p  { font-size:10px; letter-spacing:.22em; opacity:.65; margin-top:4px; font-weight:400; }

  #timeCtl {
    position:absolute; top:20px; right:24px; pointer-events:auto;
    display:flex; align-items:center; gap:10px;
    background:rgba(10,12,16,.55); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14); border-radius:999px;
    padding:8px 10px 8px 18px;
  }
  #timeLabel { color:#fff; font-size:11px; letter-spacing:.28em; text-transform:uppercase; min-width:88px; text-align:center; }
  #timeBtn {
    background:rgba(255,255,255,.92); color:#0a0c10; border:none; border-radius:999px;
    width:30px; height:30px; font-size:15px; cursor:pointer; line-height:1;
    transition:transform .15s ease;
  }
  #timeBtn:hover { transform:scale(1.08); }

  #keys {
    position:absolute; bottom:22px; left:26px; color:rgba(255,255,255,.78);
    font-size:10.5px; letter-spacing:.16em; text-shadow:0 1px 6px rgba(0,0,0,.7); line-height:1.9;
  }
  #keys b { color:#fff; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.22);
    border-radius:4px; padding:1px 6px; margin-right:4px; font-weight:600; }

  #locTag {
    position:absolute; bottom:24px; right:26px; color:rgba(255,255,255,.6);
    font-size:10px; letter-spacing:.3em; text-shadow:0 1px 6px rgba(0,0,0,.7); text-align:right;
  }

  /* ---------- START / LOADING ---------- */
  #overlay {
    position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(ellipse at 50% 60%, #11151d 0%, #05070b 70%);
    transition:opacity .8s ease; cursor:pointer;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #overlay h2 { color:#fff; font-size:22px; letter-spacing:.5em; font-weight:700; text-indent:.5em; }
  #overlay .sub { color:rgba(255,255,255,.5); font-size:11px; letter-spacing:.3em; }
  #loadBar { width:240px; height:2px; background:rgba(255,255,255,.12); border-radius:2px; overflow:hidden; }
  #loadFill { width:0%; height:100%; background:#fff; transition:width .3s ease; }
  #startMsg { color:#fff; font-size:12px; letter-spacing:.26em; opacity:0;
    border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:12px 32px;
    transition:opacity .5s ease; }
  #startMsg.ready { opacity:1; animation:pulse 2.2s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.18)} 50%{box-shadow:0 0 0 12px rgba(255,255,255,0)} }
  #glbWarn { color:#e8a13d; font-size:10px; letter-spacing:.14em; max-width:420px; text-align:center; line-height:1.8; display:none; }
</style>
</head>
<body>
<div id="canvas-holder"></div>

<div id="hud">
  <div id="brand"><h1>SHOREDITCH</h1><p>THE MEMORY BUILDER &middot; E1 / EC2A</p></div>

    <span id="timeLabel">DAY</span>
    <button id="timeBtn" title="Change time of day">&#9788;</button>
  </div>

    <span><b>W A S D</b> / <b>&#8593;&#8595;&#8592;&#8594;</b> move</span><br>
    <span><b>SHIFT</b> run &nbsp;&nbsp; <b>MOUSE</b> look &nbsp;&nbsp; <b>ESC</b> release cursor</span>
  </div>

</div>

<div id="overlay">
  <h2>SHOREDITCH</h2>
  <div class="sub">LONDON &middot; E1</div>
  <div id="loadBar"><div id="loadFill"></div></div>
  <div id="startMsg">CLICK TO ENTER</div>
  <div id="glbWarn"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* =====================================================================
   SHOREDITCH WALKABLE — single-file build
   Layout (metres, world XZ):
     Shoreditch High Street : N–S road, x = 0, width 13
     Bethnal Green Road     : E–W road, z = 0, width 11
     Redchurch Street       : E–W road, z = 78, width 8
     Brick Lane             : N–S road, x = 84, width 7
     Overground viaduct     : E–W brick viaduct crossing at z = -52
     Boxpark                : black containers, west side, z 8..60
===================================================================== */

const TAU = Math.PI*2;
const rand = (a,b)=>a+Math.random()*(b-a);
const randi = (a,b)=>Math.floor(rand(a,b+1));
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('canvas-holder').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 900);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// collision boxes (AABB, XZ only)
const colliders = [];
function addCollider(cx, cz, w, d, pad=0.35){
  colliders.push({ minX:cx-w/2-pad, maxX:cx+w/2+pad, minZ:cz-d/2-pad, maxZ:cz+d/2+pad });
}

/* =====================================================================
   PROCEDURAL TEXTURE FACTORY — everything painted on canvas
===================================================================== */
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function tex(canvas, repX=1, repY=1, srgb=true){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX,repY);
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// --- London stock brick (yellow/brown) & red Victorian brick ---
function brickCanvas(base, mortar, jitter=18, sootAmount=0.15){
  const c = makeCanvas(512,512), x = c.getContext('2d');
  x.fillStyle = mortar; x.fillRect(0,0,512,512);
  const bw=64, bh=21.3, g=3;
  for(let row=0; row<24; row++){
    const off = (row%2)*bw/2;
    for(let col=-1; col<9; col++){
      const r = base[0]+rand(-jitter,jitter), gr = base[1]+rand(-jitter,jitter), b = base[2]+rand(-jitter,jitter);
      x.fillStyle = `rgb(${r|0},${gr|0},${b|0})`;
      x.fillRect(col*bw+off+g/2, row*bh+g/2, bw-g, bh-g);
      if(Math.random()<0.18){ // weathered brick
        x.fillStyle = `rgba(40,32,28,${rand(.1,.35)})`;
        x.fillRect(col*bw+off+g/2, row*bh+g/2, bw-g, bh-g);
      }
    }
  }
  // soot streaks / grime
  x.globalAlpha = sootAmount;
  for(let i=0;i<26;i++){
    const gx = rand(0,512);
    const grad = x.createLinearGradient(gx,0,gx,512);
    grad.addColorStop(0,'rgba(20,16,14,.9)'); grad.addColorStop(1,'rgba(20,16,14,0)');
    x.fillStyle = grad; x.fillRect(gx-rand(6,26),0,rand(12,52),512);
  }
  x.globalAlpha = 1;
  return c;
}
const stockBrick = brickCanvas([176,148,108], '#8d8270', 22, .22);   // London stock
const redBrick   = brickCanvas([146,72,56],  '#9a8d7c', 16, .18);    // Victorian red
const darkBrick  = brickCanvas([88,70,62],   '#6e655c', 14, .3);     // sooted viaduct brick
const paintedBrickW = brickCanvas([228,224,214], '#b9b4a8', 8, .1);  // white-painted brick
const paintedBrickK = brickCanvas([38,38,42],  '#2c2c30', 6, .08);   // black-painted brick

// --- asphalt with patches ---
function asphaltCanvas(){
  const c = makeCanvas(512,512), x=c.getContext('2d');
  x.fillStyle='#2a2a2c'; x.fillRect(0,0,512,512);
  for(let i=0;i<14000;i++){
    const v=randi(28,62); x.fillStyle=`rgba(${v},${v},${v+2},.5)`;
    x.fillRect(rand(0,512),rand(0,512),rand(1,2.5),rand(1,2.5));
  }
  for(let i=0;i<10;i++){ // tar patches & cracks
    x.strokeStyle='rgba(12,12,14,.55)'; x.lineWidth=rand(2,5); x.beginPath();
    let px=rand(0,512), py=rand(0,512); x.moveTo(px,py);
    for(let s=0;s<6;s++){ px+=rand(-60,60); py+=rand(-60,60); x.lineTo(px,py); }
    x.stroke();
  }
  return c;
}
const asphalt = asphaltCanvas();

// --- pavement: London concrete slabs ---
function pavingCanvas(){
  const c=makeCanvas(512,512), x=c.getContext('2d');
  x.fillStyle='#76736c'; x.fillRect(0,0,512,512);
  const s=128;
  for(let i=0;i<4;i++) for(let j=0;j<4;j++){
    const v=randi(108,132); x.fillStyle=`rgb(${v},${v-2},${v-7})`;
    x.fillRect(i*s+3,j*s+3,s-6,s-6);
    x.fillStyle=`rgba(60,58,52,${rand(.05,.22)})`;
    x.fillRect(i*s+3,j*s+3,s-6,s-6);
  }
  for(let i=0;i<3000;i++){ const v=randi(80,140);
    x.fillStyle=`rgba(${v},${v},${v},.35)`; x.fillRect(rand(0,512),rand(0,512),1.5,1.5); }
  // chewing gum — peak Shoreditch realism
  for(let i=0;i<40;i++){ x.fillStyle=`rgba(${randi(50,80)},${randi(48,76)},${randi(46,70)},.8)`;
    x.beginPath(); x.arc(rand(0,512),rand(0,512),rand(2,4),0,TAU); x.fill(); }
  return c;
}
const paving = pavingCanvas();

// --- graffiti / street-art mural generator ---
const SPRAY = ['#ff3b6b','#27d3f5','#ffd23f','#9b5bff','#3bf08a','#ff7a1a','#ffffff','#1ad1ff','#ff2e9a'];
function muralCanvas(w=512,h=512){
  const c=makeCanvas(w,h), x=c.getContext('2d');
  // base wall colour
  x.fillStyle = pick(['#1c1d22','#26282e','#3a2f2c','#14161a']);
  x.fillRect(0,0,w,h);
  // huge colour fields
  for(let i=0;i<randi(3,5);i++){
    x.fillStyle = pick(SPRAY); x.globalAlpha = rand(.55,.9);
    x.beginPath();
    x.ellipse(rand(0,w),rand(0,h),rand(w*.18,w*.45),rand(h*.15,h*.4),rand(0,TAU),0,TAU);
    x.fill();
  }
  x.globalAlpha = 1;
  // bold wildstyle strokes
  for(let i=0;i<randi(8,14);i++){
    x.strokeStyle = pick(SPRAY); x.lineWidth = rand(8,26); x.lineCap='round'; x.beginPath();
    let px=rand(0,w), py=rand(0,h); x.moveTo(px,py);
    for(let s=0;s<randi(2,5);s++){
      x.quadraticCurveTo(px+rand(-150,150),py+rand(-150,150),px+=rand(-200,200),py+=rand(-160,160));
    }
    x.stroke();
  }
  // black outline pass
  for(let i=0;i<randi(4,7);i++){
    x.strokeStyle = 'rgba(8,8,10,.85)'; x.lineWidth = rand(4,9); x.beginPath();
    let px=rand(0,w), py=rand(0,h); x.moveTo(px,py);
    for(let s=0;s<3;s++) x.lineTo(px+=rand(-180,180), py+=rand(-140,140));
    x.stroke();
  }
  // drips
  for(let i=0;i<60;i++){
    x.fillStyle = pick(SPRAY); x.globalAlpha=rand(.25,.7);
    const dx=rand(0,w), dy=rand(0,h);
    x.fillRect(dx,dy,rand(1.5,3),rand(8,50));
  }
  x.globalAlpha=1;
  // tags
  x.font = `italic 700 ${randi(28,44)}px Helvetica`;
  for(let i=0;i<randi(3,6);i++){
    x.fillStyle = pick(SPRAY);
    x.save(); x.translate(rand(0,w),rand(0,h)); x.rotate(rand(-.25,.25));
    x.fillText(pick(['NOVA','EAST','SMOKE','RUE','VANTA','ECHO','73','BRICK','KER']),0,0);
    x.restore();
  }
  return c;
}

/* =====================================================================
   FACADE GENERATOR — windows baked into brick texture + emissive map
===================================================================== */
function facadeMaps(floors, bays, brickSrc, opts={}){
  const W=512, H=512;
  const day = makeCanvas(W,H), dx = day.getContext('2d');
  const nite = makeCanvas(W,H), nx = nite.getContext('2d');
  dx.drawImage(brickSrc,0,0,W,H);
  nx.fillStyle='#000'; nx.fillRect(0,0,W,H);

  const shopfront = opts.shopfront !== false;
  const groundH = shopfront ? H*0.24 : 0;
  const upperH = H - groundH;                    // canvas Y grows downward; ground floor at bottom
  const fH = upperH / floors;
  const bayW = W / bays;
  const winW = bayW*0.46, winH = fH*0.58;
  const sashStyle = opts.sash !== false;

  for(let f=0; f<floors; f++){
    for(let b=0; b<bays; b++){
      if(Math.random()<(opts.skip||0.04)) continue;
      const wx = b*bayW + (bayW-winW)/2;
      const wy = f*fH + (fH-winH)/2;
      // stone lintel + sill
      dx.fillStyle = opts.lintel||'#b8ad98';
      dx.fillRect(wx-4, wy-7, winW+8, 6);
      dx.fillRect(wx-5, wy+winH+1, winW+10, 5);
      // frame
      dx.fillStyle = opts.frame||'#dcd8cf';
      dx.fillRect(wx-2, wy-2, winW+4, winH+4);
      // glass — sky reflection gradient
      const g = dx.createLinearGradient(wx,wy,wx,wy+winH);
      g.addColorStop(0,'#5b6e80'); g.addColorStop(.5,'#34414f'); g.addColorStop(1,'#222b35');
      dx.fillStyle = g; dx.fillRect(wx,wy,winW,winH);
      if(sashStyle){
        dx.fillStyle = opts.frame||'#dcd8cf';
        dx.fillRect(wx, wy+winH/2-1.5, winW, 3);
        dx.fillRect(wx+winW/2-1.5, wy, 3, winH);
      }
      // lit at night? warm interior
      if(Math.random() < (opts.litChance ?? 0.42)){
        const warm = pick(['#ffb45e','#ffc97e','#ffd9a0','#f0e6c8']);
        nx.fillStyle = warm; nx.fillRect(wx+1,wy+1,winW-2,winH-2);
        if(Math.random()<.5){ nx.fillStyle='rgba(0,0,0,.55)';      // curtains / furniture
          nx.fillRect(wx+1, wy+winH*rand(.3,.6), winW-2, winH*.4); }
      }
    }
  }

  if(shopfront){
    const sy = upperH;
    // fascia
    const fascia = pick(['#15161a','#27343d','#3d2430','#1d2b24','#2e2118']);
    dx.fillStyle = fascia; dx.fillRect(0, sy, W, H*0.07);
    dx.fillStyle = pick(['#e8e3d6','#ffd23f','#ff7a1a','#7fd6c2','#e8e3d6']);
    dx.font='700 26px Helvetica'; dx.textAlign='center'; dx.letterSpacing='6px';
    const name = pick(['ALBION','CURATED','PRESS & CO','ATELIER','OCRA','FLAT IRON','KIOSK','MONO','LABOUR & WAIT','VINYL']);
    dx.fillText(name, W/2, sy+H*0.05);
    dx.textAlign='left';
    // glazing
    const gy = sy + H*0.07;
    dx.fillStyle = '#11161c'; dx.fillRect(0,gy,W,H-gy);
    const panes = 4;
    for(let p=0;p<panes;p++){
      const px = p*(W/panes)+8;
      const g2 = dx.createLinearGradient(px,gy,px,H);
      g2.addColorStop(0,'#37434f'); g2.addColorStop(1,'#1a2129');
      dx.fillStyle=g2; dx.fillRect(px,gy+8,(W/panes)-16,H-gy-16);
      // shop glow at night
      nx.fillStyle = 'rgba(255,190,110,.95)';
      nx.fillRect(px,gy+8,(W/panes)-16,H-gy-16);
    }
  }
  const map = tex(day,1,1);
  const emi = tex(nite,1,1);
  return { map, emi };
}

/* =====================================================================
   MATERIAL LIBRARY
===================================================================== */
const MAT = {
  asphalt: new THREE.MeshStandardMaterial({ map:tex(asphalt,30,30), roughness:.94, metalness:.02 }),
  paving:  new THREE.MeshStandardMaterial({ map:tex(paving,40,40), roughness:.9 }),
  kerb:    new THREE.MeshStandardMaterial({ color:0x9a968c, roughness:.85 }),
  roof:    new THREE.MeshStandardMaterial({ color:0x3a3d42, roughness:.95 }),
  darkBrick:new THREE.MeshStandardMaterial({ map:tex(darkBrick,6,3), roughness:.92 }),
  steel:   new THREE.MeshStandardMaterial({ color:0x44525c, roughness:.5, metalness:.7 }),
  rustSteel:new THREE.MeshStandardMaterial({ color:0x6e4a38, roughness:.7, metalness:.45 }),
  blackMetal:new THREE.MeshStandardMaterial({ color:0x16181c, roughness:.55, metalness:.5 }),
  phoneRed:new THREE.MeshStandardMaterial({ color:0xb01f24, roughness:.45, metalness:.1 }),
  white:   new THREE.MeshStandardMaterial({ color:0xe7e4dc, roughness:.8 }),
  glassDark:new THREE.MeshStandardMaterial({ color:0x141c24, roughness:.15, metalness:.6 }),
};
// materials whose emissiveIntensity tracks the lighting state
const glowMats = [];      // {mat, max}
function regGlow(mat, max=1){ glowMats.push({mat,max}); return mat; }

/* =====================================================================
   GROUND, ROADS, PAVEMENTS
===================================================================== */
const cityRoot = new THREE.Group(); scene.add(cityRoot);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(520,520), MAT.paving);
ground.rotation.x = -Math.PI/2; ground.position.y = 0; ground.receiveShadow = true;
cityRoot.add(ground);

function roadStrip(cx,cz,w,len,alongZ=true){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(alongZ?w:len, alongZ?len:w), MAT.asphalt);
  m.rotation.x=-Math.PI/2; m.position.set(cx,0.02,cz); m.receiveShadow=true;
  cityRoot.add(m);
  // kerbs
  const kGeo = new THREE.BoxGeometry(alongZ?0.3:len, 0.14, alongZ?len:0.3);
  [-1,1].forEach(s=>{
    const k = new THREE.Mesh(kGeo, MAT.kerb);
    if(alongZ) k.position.set(cx+s*(w/2+0.15),0.07,cz);
    else k.position.set(cx,0.07,cz+s*(w/2+0.15));
    k.receiveShadow=k.castShadow=true; cityRoot.add(k);
  });
  // centre line — double yellow near kerbs (London) + dashed white centre
  const lineC = makeCanvas(64,512), lx=lineC.getContext('2d');
  lx.clearRect(0,0,64,512);
  lx.fillStyle='#cfc9b8'; for(let i=0;i<8;i++) lx.fillRect(28,i*64+10,8,36);
  const lt = tex(lineC, 1, len/14); lt.colorSpace=THREE.SRGBColorSpace;
  const lm = new THREE.Mesh(new THREE.PlaneGeometry(1.4, len),
    new THREE.MeshBasicMaterial({ map:lt, transparent:true, opacity:.5, depthWrite:false }));
  lm.rotation.set(-Math.PI/2, 0, alongZ?0:Math.PI/2);
  lm.position.set(cx,0.035,cz);
  cityRoot.add(lm);
  // double yellows
  const yMat = new THREE.MeshBasicMaterial({ color:0xc8a428, transparent:true, opacity:.55 });
  [-1,1].forEach(s=>{
    [0,0.28].forEach(off=>{
      const y = new THREE.Mesh(new THREE.PlaneGeometry(alongZ?0.09:len, alongZ?len:0.09), yMat);
      y.rotation.x=-Math.PI/2;
      if(alongZ) y.position.set(cx+s*(w/2-0.5-off),0.03,cz);
      else y.position.set(cx,0.03,cz+s*(w/2-0.5-off));
      cityRoot.add(y);
    });
  });
}
roadStrip(0,   0, 13, 460, true );   // Shoreditch High Street
roadStrip(84,  0,  7, 460, true );   // Brick Lane
roadStrip(0,   0, 11, 460, false);   // Bethnal Green Road
roadStrip(0,  78,  8, 460, false);   // Redchurch Street

/* =====================================================================
   BUILDINGS — facades baked per building, Shoreditch block plan
===================================================================== */
function building(cx, cz, w, h, d, brickSrc, opts={}){
  const floors = Math.max(2, Math.round(h/3.1) - (opts.shopfront!==false?1:0));
  const bays = Math.max(2, Math.round(w/3));
  const {map, emi} = facadeMaps(floors, bays, brickSrc, opts);
  const faceMat = new THREE.MeshStandardMaterial({
    map, emissiveMap:emi, emissive:0xffffff, emissiveIntensity:0, roughness:.88
  });
  regGlow(faceMat, opts.glowMax ?? 1.0);
  // side faces: plain brick (or mural)
  const sideMat = new THREE.MeshStandardMaterial({ map:tex(brickSrc, Math.max(1,d/7), Math.max(1,h/7)), roughness:.9 });
  const mats = [sideMat, sideMat, MAT.roof, MAT.roof, faceMat, faceMat]; // +x,-x,+y,-y,+z,-z
  const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mats);
  b.position.set(cx, h/2, cz);
  b.castShadow = b.receiveShadow = true;
  cityRoot.add(b);
  addCollider(cx,cz,w,d);
  // parapet
  const p = new THREE.Mesh(new THREE.BoxGeometry(w+0.3,0.6,d+0.3), sideMat);
  p.position.set(cx,h+0.3,cz); p.castShadow=true; cityRoot.add(p);
  // chimney pots — very London roofline
  if(Math.random()<.7){
    const ch = new THREE.Mesh(new THREE.BoxGeometry(1.2,rand(1.2,2),1.2), sideMat);
    ch.position.set(cx+rand(-w/3,w/3), h+0.9, cz+rand(-d/3,d/3));
    ch.castShadow=true; cityRoot.add(ch);
    for(let i=0;i<3;i++){
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(.12,.16,.55,8),
        new THREE.MeshStandardMaterial({color:0x8a5a40, roughness:.9}));
      pot.position.set(ch.position.x-0.35+i*0.35, ch.position.y+ (ch.geometry.parameters.height/2)+0.27, ch.position.z);
      cityRoot.add(pot);
    }
  }
  // mural on a side wall sometimes
  if(opts.mural){
    const mw = Math.min(d*0.92, 16), mh = Math.min(h*0.8, 12);
    const mp = new THREE.Mesh(new THREE.PlaneGeometry(mw,mh),
      new THREE.MeshStandardMaterial({ map:tex(muralCanvas(),1,1), roughness:.85 }));
    const side = opts.mural; // 'left' (-x) or 'right'(+x)
    mp.position.set(cx + (side==='right'? w/2+0.06 : -w/2-0.06), mh/2+1.2, cz);
    mp.rotation.y = side==='right' ? Math.PI/2 : -Math.PI/2;
    cityRoot.add(mp);
  }
  return b;
}

// ---- block plan: buildings face the streets, varied heights ----
// West side of Shoreditch High St (facing +x → rotate? facades on ±z; we orient by placing depth along x)
// Simpler: our facade is on ±z faces; for N–S streets we need facades on ±x.
// Trick: build with w↔d swapped and rotate group 90°.
function buildingFacingX(cx,cz,w,h,d,brick,opts={}){
  const g = new THREE.Group();
  const floors = Math.max(2, Math.round(h/3.1) - (opts.shopfront!==false?1:0));
  const bays = Math.max(2, Math.round(d/3));
  const {map,emi} = facadeMaps(floors,bays,brick,opts);
  const faceMat = new THREE.MeshStandardMaterial({ map, emissiveMap:emi, emissive:0xffffff, emissiveIntensity:0, roughness:.88 });
  regGlow(faceMat, opts.glowMax ?? 1.0);
  const sideMat = new THREE.MeshStandardMaterial({ map:tex(brick, Math.max(1,w/7), Math.max(1,h/7)), roughness:.9 });
  const mats = [faceMat, faceMat, MAT.roof, MAT.roof, sideMat, sideMat];
  const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mats);
  b.position.set(cx,h/2,cz); b.castShadow=b.receiveShadow=true;
  g.add(b);
  const p = new THREE.Mesh(new THREE.BoxGeometry(w+0.3,0.6,d+0.3), sideMat);
  p.position.set(cx,h+0.3,cz); g.add(p);
  if(opts.mural){
    const mw = Math.min(w*0.92,16), mh=Math.min(h*0.8,12);
    const mp = new THREE.Mesh(new THREE.PlaneGeometry(mw,mh),
      new THREE.MeshStandardMaterial({ map:tex(muralCanvas(),1,1), roughness:.85 }));
    mp.position.set(cx, mh/2+1.2, cz + (opts.mural==='front'? d/2+0.06 : -d/2-0.06));
    if(opts.mural!=='front') mp.rotation.y=Math.PI;
    g.add(mp);
  }
  cityRoot.add(g);
  addCollider(cx,cz,w,d);
  return g;
}

(function viaduct(){
  const z = -52, H = 8.5, W = 9;

  function archWall(len){
    const c = makeCanvas(1024,256), x=c.getContext('2d');
    x.drawImage(darkBrick,0,0,512,256); x.drawImage(darkBrick,512,0,512,256);
    const aw=170, ah=190;
    for(let i=0;i<6;i++){
      const ax=i*aw+20;
      x.fillStyle='#0b0c0e';
      x.beginPath();
      x.moveTo(ax, 256); x.lineTo(ax, 256-ah+aw/2*0.9);
      x.arc(ax+ (aw-40)/2, 256-ah+ (aw-40)/2*0.9, (aw-40)/2, Math.PI, 0);

scene.add(new THREE.Points(starGeo, starMat));

// light rig
const hemi = new THREE.HemisphereLight(0xbfd5ee, 0x3a3630, 0.6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-90; sun.shadow.camera.right=90;
sun.shadow.camera.top=90; sun.shadow.camera.bottom=-90;
sun.shadow.camera.far=400; sun.shadow.bias=-0.0004;
scene.add(sun); scene.add(sun.target);
scene.fog = new THREE.FogExp2(0xcfd8df, 0.004);

// sun/moon disc
const discMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0, fog:false });
const disc = new THREE.Mesh(new THREE.CircleGeometry(22,24), discMat);
scene.add(disc);

/* =====================================================================
   TIME-OF-DAY STATES
===================================================================== */
function st(name,icon, skyTop,skyHor, az,el, sunCol,sunInt, hemiInt, fogCol,fogD, expo, lampsOn, glow, stars, discCol,discOp){
  return { name, icon, skyTop:new THREE.Color(skyTop), skyHor:new THREE.Color(skyHor),
    az, el, sunCol:new THREE.Color(sunCol), sunInt, hemiInt,
    fogCol:new THREE.Color(fogCol), fogD, expo, lampsOn, glow, stars,
    discCol:new THREE.Color(discCol), discOp };
}
const STATES = [
  st('NIGHT','\u263D',   0x05070f,0x141a26, 0.8,0.55, 0xaabbdd,0.06, 0.10, 0x0a0e16,0.0065, 0.85, 1, 1.0, 0.9, 0xdfe8ff,0.85),
  st('DAWN','\u263C',    0x1c2b4d,0xd87f5a, 1.45,0.06, 0xff9a5c,0.45, 0.22, 0x4a3f4a,0.0055, 0.95, 1, 0.7, 0.25, 0xffb070,0.9),
  st('MORNING','\u263C', 0x6fa3d8,0xe8e2ce, 1.3,0.30, 0xfff0d0,1.25, 0.55, 0xd8d4c4,0.0042, 1.05, 0, 0.0, 0, 0xfff6e0,0.7),
  st('DAY','\u2600',     0x3b6fb5,0xcfd8df, 0.9,0.78, 0xffffff,1.85, 0.72, 0xcfd8df,0.0032, 1.12, 0, 0.0, 0, 0xffffff,0.55),
  st('AFTERNOON','\u2600',0x4a7cb8,0xd9d3bd, -0.9,0.55, 0xfff2d8,1.6, 0.62, 0xd6cfb8,0.0038, 1.08, 0, 0.0, 0, 0xfff2d0,0.6),
  st('SUNSET','\u263C',  0x33406e,0xf08a4b, -1.4,0.07, 0xff7a33,0.85, 0.3, 0xc08060,0.005, 1.0, 1, 0.45, 0.1, 0xff8c3a,0.95),
  st('EVENING','\u263D', 0x101a33,0x4a3a55, -1.5,-0.04, 0x9988bb,0.12, 0.16, 0x1c1a28,0.0058, 0.92, 1, 0.95, 0.6, 0xe8e0ff,0.5),
  st('DUSK','\u263D',    0x0a1020,0x232a40, 0.7,-0.02, 0x8899cc,0.07, 0.12, 0x10141f,0.0062, 0.88, 1, 1.0, 0.8, 0xdfe8ff,0.7),
];
let stateIdx = 3;             // start in full daylight
let blend = 1;                // 0..1 transition progress
let fromS = STATES[3], toS = STATES[3];

function applyBlend(a,b,t){
  const L=(p,q)=>p+(q-p)*t;
  skyUni.topColor.value.lerpColors(a.skyTop,b.skyTop,t);
  skyUni.horizonColor.value.lerpColors(a.skyHor,b.skyHor,t);
  scene.fog.color.lerpColors(a.fogCol,b.fogCol,t);
  scene.fog.density = L(a.fogD,b.fogD);
  renderer.toneMappingExposure = L(a.expo,b.expo);
  sun.color.lerpColors(a.sunCol,b.sunCol,t);
  sun.intensity = L(a.sunInt,b.sunInt);
  hemi.intensity = L(a.hemiInt,b.hemiInt);
  const az=L(a.az,b.az), el=Math.max(L(a.el,b.el), -0.1);
  const r=300;
  sun.position.set(Math.cos(az)*Math.cos(el)*r, Math.sin(Math.max(el,0.02))*r, Math.sin(az)*Math.cos(el)*r);
  disc.position.copy(sun.position).normalize().multiplyScalar(720);
  disc.lookAt(0,disc.position.y*0.0,0); disc.lookAt(camera.position);
  discMat.color.lerpColors(a.discCol,b.discCol,t);
  discMat.opacity = L(a.discOp,b.discOp) * (sun.position.y>-30?1:0);
  starMat.opacity = L(a.stars,b.stars);
  const glow = L(a.glow,b.glow), lamps=L(a.lampsOn,b.lampsOn);
  glowMats.forEach(({mat,max})=> mat.emissiveIntensity = glow*max);
  lampHeads.forEach(m=> m.emissiveIntensity = lamps*3.2);
  lampLights.forEach(pl=> pl.intensity = lamps*55);
}
const timeLabel = document.getElementById('timeLabel');
const timeBtn = document.getElementById('timeBtn');
function setTimeState(i){
  fromS = STATES[stateIdx]; stateIdx = i % STATES.length; toS = STATES[stateIdx];
  blend = 0;
  timeLabel.textContent = toS.name;
  timeBtn.innerHTML = toS.icon;
}
timeBtn.addEventListener('click', e=>{ e.stopPropagation(); setTimeState(stateIdx+1); });
timeLabel.textContent = STATES[stateIdx].name; timeBtn.innerHTML = STATES[stateIdx].icon;
applyBlend(STATES[3],STATES[3],1);

/* =====================================================================
   CHARACTER — clarity_builder.glb, third-person controller
===================================================================== */
const player = {
  obj: new THREE.Group(),
  vel: new THREE.Vector3(),
  yaw: Math.PI,                // facing
  camYaw: Math.PI, camPitch: -0.12,
  speedWalk: 3.1, speedRun: 6.4,
  mixer: null, actions: {}, current: null,
  radius: 0.45,
};
player.obj.position.set(0, 0, 30);   // spawn on Shoreditch High St, looking north
scene.add(player.obj);

const loadFill = document.getElementById('loadFill');
const glbWarn = document.getElementById('glbWarn');
const startMsg = document.getElementById('startMsg');

function markReady(){
  loadFill.style.width='100%';
  startMsg.classList.add('ready');
}

new GLTFLoader().load('https://raw.githubusercontent.com/epoliluisito/xd_portfolio/main/projects/open_camera/shoreditch/clarity_builder.glb',
  gltf=>{
    const model = gltf.scene;
    // normalise to ~1.8m tall, feet at y=0
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const s = 1.8 / Math.max(size.y, 0.001);
    model.scale.setScalar(s);
    box.setFromObject(model);
    model.position.y -= box.min.y;
    model.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; }});
    player.obj.add(model);
    if(gltf.animations.length){
      player.mixer = new THREE.AnimationMixer(model);
      const find = re => gltf.animations.find(a=>re.test(a.name));
      const idleClip = find(/idle|stand|breath/i) || gltf.animations[0];
      const walkClip = find(/walk/i) || gltf.animations[Math.min(1,gltf.animations.length-1)];
      const runClip  = find(/run|sprint|jog/i) || walkClip;
      player.actions.idle = player.mixer.clipAction(idleClip);
      player.actions.walk = player.mixer.clipAction(walkClip);
      player.actions.run  = player.mixer.clipAction(runClip);
      Object.values(player.actions).forEach(a=>{ a.enabled=true; a.setLoop(THREE.LoopRepeat); });
      player.actions.idle.play(); player.current='idle';
    }
    markReady();
  },
  xhr=>{ if(xhr.total) loadFill.style.width = (xhr.loaded/xhr.total*90)+'%'; },
  err=>{
    console.warn('clarity_builder.glb not found — using stand-in.', err);
    glbWarn.style.display='block';
    glbWarn.innerHTML = 'clarity_builder.glb not found next to index.html.<br>'+
      'Using a stand-in figure. Note: browsers block local GLB loading over file:// — '+
      'serve the folder (e.g. <b>python3 -m http.server</b>) and open via localhost.';
    // stand-in mannequin
    const m = new THREE.MeshStandardMaterial({ color:0xd8d2c4, roughness:.6 });
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(.26,.95,6,12), m);
    body.position.y=0.95; body.castShadow=true; player.obj.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(.17,12,10), m);
    head.position.y=1.72; head.castShadow=true; player.obj.add(head);
    markReady();
  }
);

function fadeTo(name, dur=0.22){
  if(!player.mixer || player.current===name || !player.actions[name]) return;
  const from = player.actions[player.current], to = player.actions[name];
  to.reset().play();
  if(from) from.crossFadeTo(to, dur, false);
  player.current = name;
}

/* ---------- input ---------- */
const keys = {};
addEventListener('keydown', e=>{ keys[e.code]=true; });
addEventListener('keyup',   e=>{ keys[e.code]=false; });

const overlay = document.getElementById('overlay');
let started = false;
overlay.addEventListener('click', ()=>{
  if(!startMsg.classList.contains('ready')) return;
  started = true;
  overlay.classList.add('hidden');
  renderer.domElement.requestPointerLock();
});
renderer.domElement.addEventListener('click', ()=>{
  if(started && document.pointerLockElement !== renderer.domElement)
    renderer.domElement.requestPointerLock();
});
addEventListener('mousemove', e=>{
  if(document.pointerLockElement !== renderer.domElement) return;
  player.camYaw   -= e.movementX * 0.0024;
  player.camPitch -= e.movementY * 0.0022;
  player.camPitch = Math.max(-0.95, Math.min(0.5, player.camPitch));
});

/* ---------- collision (XZ AABB slide) ---------- */
function collide(pos){
  for(const c of colliders){
    if(pos.x>c.minX-player.radius && pos.x<c.maxX+player.radius &&
       pos.z>c.minZ-player.radius && pos.z<c.maxZ+player.radius){
      // push out along smallest penetration axis
      const dxL = pos.x-(c.minX-player.radius), dxR=(c.maxX+player.radius)-pos.x;
      const dzT = pos.z-(c.minZ-player.radius), dzB=(c.maxZ+player.radius)-pos.z;
      const m = Math.min(dxL,dxR,dzT,dzB);
      if(m===dxL) pos.x=c.minX-player.radius;
      else if(m===dxR) pos.x=c.maxX+player.radius;
      else if(m===dzT) pos.z=c.minZ-player.radius;
      else pos.z=c.maxZ+player.radius;
    }
  }
  // world bounds
  pos.x = Math.max(-150, Math.min(150, pos.x));
  pos.z = Math.max(-130, Math.min(150, pos.z));
}

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3();
const camPos = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // time-of-day transition
  if(blend < 1){
    blend = Math.min(1, blend + dt/2.2);
    applyBlend(fromS, toS, blend*blend*(3-2*blend));
  }

  // movement input relative to camera yaw
  let ix=0, iz=0;
  if(keys.KeyW||keys.ArrowUp) iz+=1;
  if(keys.KeyS||keys.ArrowDown) iz-=1;
  if(keys.KeyA||keys.ArrowLeft) ix+=1;
  if(keys.KeyD||keys.ArrowRight) ix-=1;
  const moving = (ix||iz) && started;
  const running = moving && (keys.ShiftLeft||keys.ShiftRight);
  const speed = running ? player.speedRun : player.speedWalk;

  if(moving){
    const ang = Math.atan2(ix,iz) + player.camYaw;
    const tx = Math.sin(ang), tz = Math.cos(ang);
    player.vel.x += (tx*speed - player.vel.x)*Math.min(1,dt*10);
    player.vel.z += (tz*speed - player.vel.z)*Math.min(1,dt*10);
    // face movement direction smoothly
    let target = Math.atan2(player.vel.x, player.vel.z);
    let dy = target - player.yaw;
    while(dy> Math.PI) dy-=TAU; while(dy<-Math.PI) dy+=TAU;
    player.yaw += dy*Math.min(1,dt*12);
  } else {
    player.vel.x += (0-player.vel.x)*Math.min(1,dt*12);
    player.vel.z += (0-player.vel.z)*Math.min(1,dt*12);
  }
  const next = player.obj.position.clone();
  next.x += player.vel.x*dt; next.z += player.vel.z*dt;
  collide(next);
  player.obj.position.copy(next);
  player.obj.rotation.y = player.yaw;

  // animation state
  const spd = Math.hypot(player.vel.x, player.vel.z);
  if(player.mixer){
    if(spd>4.2) fadeTo('run');
    else if(spd>0.35) fadeTo('walk');
    else fadeTo('idle');
    player.mixer.update(dt);
  } else if(player.obj.children.length){
    // stand-in bob
    player.obj.children.forEach(ch=> ch.position.y = (ch.geometry?.type==='CapsuleGeometry'?0.95:1.72)
      + (spd>0.3 ? Math.sin(performance.now()*0.012)*0.04 : 0));
  }

  // third-person camera: orbit behind, soft follow
  const dist = 4.6, height = 1.9;
  camTarget.set(player.obj.position.x, player.obj.position.y+1.45, player.obj.position.z);
  camPos.set(
    camTarget.x - Math.sin(player.camYaw)*Math.cos(player.camPitch)*dist,
    camTarget.y - Math.sin(player.camPitch)*dist + (height-1.45),
    camTarget.z - Math.cos(player.camYaw)*Math.cos(player.camPitch)*dist
  );
  if(camPos.y<0.4) camPos.y=0.4;
  camera.position.lerp(camPos, Math.min(1, dt*9));
  camera.lookAt(camTarget);

  // sun shadow follows player
  sun.target.position.copy(player.obj.position);
  const sd = sun.position.clone().normalize().multiplyScalar(220);
  sun.position.copy(player.obj.position).add(sd);

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
