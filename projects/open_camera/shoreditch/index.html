<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOREDITCH — The Memory Builder</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; }
  #canvas-holder { position:fixed; inset:0; }
  canvas { display:block; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #brand {
    position:absolute; top:22px; left:26px; color:#fff;
    text-shadow:0 1px 8px rgba(0,0,0,.6);
  }
  #brand h1 { font-size:15px; letter-spacing:.34em; font-weight:700; }
  #brand p  { font-size:10px; letter-spacing:.22em; opacity:.65; margin-top:4px; font-weight:400; }

  #timeCtl {
    position:absolute; top:20px; right:24px; pointer-events:auto;
    display:flex; align-items:center; gap:10px;
    background:rgba(10,12,16,.55); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14); border-radius:999px;
    padding:8px 10px 8px 18px;
  }
  #timeLabel { color:#fff; font-size:11px; letter-spacing:.28em; text-transform:uppercase; min-width:88px; text-align:center; }
  #timeBtn {
    background:rgba(255,255,255,.92); color:#0a0c10; border:none; border-radius:999px;
    width:30px; height:30px; font-size:15px; cursor:pointer; line-height:1;
    transition:transform .15s ease;
  }
  #timeBtn:hover { transform:scale(1.08); }

  #keys {
    position:absolute; bottom:22px; left:26px; color:rgba(255,255,255,.78);
    font-size:10.5px; letter-spacing:.16em; text-shadow:0 1px 6px rgba(0,0,0,.7); line-height:1.9;
  }
  #keys b { color:#fff; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.22);
    border-radius:4px; padding:1px 6px; margin-right:4px; font-weight:600; }

  #locTag {
    position:absolute; bottom:24px; right:26px; color:rgba(255,255,255,.6);
    font-size:10px; letter-spacing:.3em; text-shadow:0 1px 6px rgba(0,0,0,.7); text-align:right;
  }

  /* ---------- START / LOADING ---------- */
  #overlay {
    position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(ellipse at 50% 60%, #11151d 0%, #05070b 70%);
    transition:opacity .8s ease; cursor:pointer;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #overlay h2 { color:#fff; font-size:22px; letter-spacing:.5em; font-weight:700; text-indent:.5em; }
  #overlay .sub { color:rgba(255,255,255,.5); font-size:11px; letter-spacing:.3em; }
  #loadBar { width:240px; height:2px; background:rgba(255,255,255,.12); border-radius:2px; overflow:hidden; }
  #loadFill { width:0%; height:100%; background:#fff; transition:width .3s ease; }
  #startMsg { color:#fff; font-size:12px; letter-spacing:.26em; opacity:0;
    border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:12px 32px;
    transition:opacity .5s ease; }
  #startMsg.ready { opacity:1; animation:pulse 2.2s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.18)} 50%{box-shadow:0 0 0 12px rgba(255,255,255,0)} }
  #glbWarn { color:#e8a13d; font-size:10px; letter-spacing:.14em; max-width:420px; text-align:center; line-height:1.8; display:none; }
</style>
</head>

/* =====================================================================
   PROCEDURAL TEXTURE FACTORY — everything painted on canvas
===================================================================== */
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function tex(canvas, repX=1, repY=1, srgb=true){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX,repY);
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// --- London stock brick (yellow/brown) & red Victorian brick ---
function brickCanvas(base, mortar, jitter=18, sootAmount=0.15){
  const c = makeCanvas(512,512), x = c.getContext('2d');
  x.fillStyle = mortar; x.fillRect(0,0,512,512);
  const bw=64, bh=21.3, g=3;
  for(let row=0; row<24; row++){
    const off = (row%2)*bw/2;
    for(let col=-1; col<9; col++){
      const r = base[0]+rand(-jitter,jitter), gr = base[1]+rand(-jitter,jitter), b = base[2]+rand(-jitter,jitter);
      x.fillStyle = `rgb(${r|0},${gr|0},${b|0})`;
      x.fillRect(col*bw+off+g/2, row*bh+g/2, bw-g, bh-g);
      if(Math.random()<0.18){ // weathered brick
        x.fillStyle = `rgba(40,32,28,${rand(.1,.35)})`;
        x.fillRect(col*bw+off+g/2, row*bh+g/2, bw-g, bh-g);
      }
    }
  }
  // soot streaks / grime
  x.globalAlpha = sootAmount;
  for(let i=0;i<26;i++){
    const gx = rand(0,512);
    const grad = x.createLinearGradient(gx,0,gx,512);
    grad.addColorStop(0,'rgba(20,16,14,.9)'); grad.addColorStop(1,'rgba(20,16,14,0)');
    x.fillStyle = grad; x.fillRect(gx-rand(6,26),0,rand(12,52),512);
  }
  x.globalAlpha = 1;
  return c;
}

// --- asphalt with patches ---
function asphaltCanvas(){
  const c = makeCanvas(512,512), x=c.getContext('2d');
  x.fillStyle='#2a2a2c'; x.fillRect(0,0,512,512);
  for(let i=0;i<14000;i++){
    const v=randi(28,62); x.fillStyle=`rgba(${v},${v},${v+2},.5)`;
    x.fillRect(rand(0,512),rand(0,512),rand(1,2.5),rand(1,2.5));
  }
  for(let i=0;i<10;i++){ // tar patches & cracks
    x.strokeStyle='rgba(12,12,14,.55)'; x.lineWidth=rand(2,5); x.beginPath();
    let px=rand(0,512), py=rand(0,512); x.moveTo(px,py);
    for(let s=0;s<6;s++){ px+=rand(-60,60); py+=rand(-60,60); x.lineTo(px,py); }
    x.stroke();
  }
  return c;
}

// --- pavement: London concrete slabs ---
function pavingCanvas(){
  const c=makeCanvas(512,512), x=c.getContext('2d');
  x.fillStyle='#76736c'; x.fillRect(0,0,512,512);
  const s=128;
  for(let i=0;i<4;i++) for(let j=0;j<4;j++){
    const v=randi(108,132); x.fillStyle=`rgb(${v},${v-2},${v-7})`;
    x.fillRect(i*s+3,j*s+3,s-6,s-6);
    x.fillStyle=`rgba(60,58,52,${rand(.05,.22)})`;
    x.fillRect(i*s+3,j*s+3,s-6,s-6);
  }
  for(let i=0;i<3000;i++){ const v=randi(80,140);
    x.fillStyle=`rgba(${v},${v},${v},.35)`; x.fillRect(rand(0,512),rand(0,512),1.5,1.5); }
  // chewing gum — peak Shoreditch realism
  for(let i=0;i<40;i++){ x.fillStyle=`rgba(${randi(50,80)},${randi(48,76)},${randi(46,70)},.8)`;
    x.beginPath(); x.arc(rand(0,512),rand(0,512),rand(2,4),0,TAU); x.fill(); }

}

// --- graffiti / street-art mural generator ---
const SPRAY = ['#ff3b6b','#27d3f5','#ffd23f','#9b5bff','#3bf08a','#ff7a1a','#ffffff','#1ad1ff','#ff2e9a'];
function muralCanvas(w=512,h=512){
  const c=makeCanvas(w,h), x=c.getContext('2d');
  // base wall colour
  x.fillStyle = pick(['#1c1d22','#26282e','#3a2f2c','#14161a']);
  x.fillRect(0,0,w,h);
  // huge colour fields
  for(let i=0;i<randi(3,5);i++){
    x.fillStyle = pick(SPRAY); x.globalAlpha = rand(.55,.9);
    x.beginPath();
    x.ellipse(rand(0,w),rand(0,h),rand(w*.18,w*.45),rand(h*.15,h*.4),rand(0,TAU),0,TAU);
    x.fill();
  }
  x.globalAlpha = 1;
  // bold wildstyle strokes
  for(let i=0;i<randi(8,14);i++){
    x.strokeStyle = pick(SPRAY); x.lineWidth = rand(8,26); x.lineCap='round'; x.beginPath();
    let px=rand(0,w), py=rand(0,h); x.moveTo(px,py);
    for(let s=0;s<randi(2,5);s++){
      x.quadraticCurveTo(px+rand(-150,150),py+rand(-150,150),px+=rand(-200,200),py+=rand(-160,160));
    }
    x.stroke();
  }
  // black outline pass
  for(let i=0;i<randi(4,7);i++){
    x.strokeStyle = 'rgba(8,8,10,.85)'; x.lineWidth = rand(4,9); x.beginPath();
    let px=rand(0,w), py=rand(0,h); x.moveTo(px,py);
    for(let s=0;s<3;s++) x.lineTo(px+=rand(-180,180), py+=rand(-140,140));
    x.stroke();
  }
  // drips
  for(let i=0;i<60;i++){
    x.fillStyle = pick(SPRAY); x.globalAlpha=rand(.25,.7);
    const dx=rand(0,w), dy=rand(0,h);
    x.fillRect(dx,dy,rand(1.5,3),rand(8,50));
  }
  x.globalAlpha=1;
  // tags
  x.font = `italic 700 ${randi(28,44)}px Helvetica`;
  for(let i=0;i<randi(3,6);i++){
    x.fillStyle = pick(SPRAY);
    x.save(); x.translate(rand(0,w),rand(0,h)); x.rotate(rand(-.25,.25));
    x.fillText(pick(['NOVA','EAST','SMOKE','RUE','VANTA','ECHO','73','BRICK','KER']),0,0);
    x.restore();
  }
  return c;
}

/* =====================================================================
   COLLISION — edge grid (real footprints are polygons, not boxes)
===================================================================== */
const CELL = 12, grid = new Map();
function cellKey(ix,iz){ return ix+'|'+iz; }
function addEdge(ax,az,bx,bz){
  const x0=Math.floor((Math.min(ax,bx)-1)/CELL), x1=Math.floor((Math.max(ax,bx)+1)/CELL);
  const z0=Math.floor((Math.min(az,bz)-1)/CELL), z1=Math.floor((Math.max(az,bz)+1)/CELL);
  for(let ix=x0;ix<=x1;ix++) for(let iz=z0;iz<=z1;iz++){
    const k=cellKey(ix,iz);
    if(!grid.has(k)) grid.set(k,[]);
    grid.get(k).push([ax,az,bx,bz]);
  }
}
function addBoxEdges(cx,cz,w,d){
  const x0=cx-w/2,x1=cx+w/2,z0=cz-d/2,z1=cz+d/2;
  addEdge(x0,z0,x1,z0); addEdge(x1,z0,x1,z1); addEdge(x1,z1,x0,z1); addEdge(x0,z1,x0,z0);
}

/* =====================================================================
   GEOMETRY BUCKETS — everything merged by material, few draw calls
===================================================================== */
const buckets = new Map();
function bucket(key, mat, tw=1, th=1){
  if(!buckets.has(key)) buckets.set(key,{ mat, tw, th, pos:[], nor:[], uv:[], idx:[] });
  return buckets.get(key);
}
function pushQuad(bk, ax,az,bx,bz, y0,y1, nx,nz){
  const i = bk.pos.length/3;
  const len = Math.hypot(bx-ax,bz-az), u1 = len/bk.tw, v1=(y1-y0)/bk.th;
  bk.pos.push(ax,y0,az, bx,y0,bz, bx,y1,bz, ax,y1,az);
  for(let k=0;k<4;k++) bk.nor.push(nx,0,nz);
  bk.uv.push(0,0, u1,0, u1,v1, 0,v1);
  bk.idx.push(i,i+1,i+2, i,i+2,i+3);
}
function pushPolyCap(bk, ring, y){
  const v2 = ring.map(p=>new THREE.Vector2(p[0],p[1]));
  const tris = THREE.ShapeUtils.triangulateShape(v2, []);
  const i0 = bk.pos.length/3;
  ring.forEach(p=>{ bk.pos.push(p[0],y,p[1]); bk.nor.push(0,1,0); bk.uv.push(p[0]/9,p[1]/9); });
  tris.forEach(t=> bk.idx.push(i0+t[0], i0+t[1], i0+t[2]));
}
function flushBuckets(){
  buckets.forEach(bk=>{
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(bk.pos,3));
    g.setAttribute('normal',   new THREE.Float32BufferAttribute(bk.nor,3));
    g.setAttribute('uv',       new THREE.Float32BufferAttribute(bk.uv,2));
    g.setIndex(bk.idx);
    const m = new THREE.Mesh(g, bk.mat);
    m.castShadow = m.receiveShadow = true;
    cityRoot.add(m);
  });
}

/* =====================================================================

===================================================================== */
function facadeTile(brickSrc, lit=0.42, frame='#dcd8cf', lintel='#b8ad98'){
  const W=512, H=384, cw=W/4, ch=H/3;
  const day=makeCanvas(W,H), dx=day.getContext('2d');
  const nite=makeCanvas(W,H), nx=nite.getContext('2d');
  dx.drawImage(brickSrc,0,0,W,H);
  nx.fillStyle='#000'; nx.fillRect(0,0,W,H);
  for(let r=0;r<3;r++) for(let c=0;c<4;c++){
    if(Math.random()<.06) continue;
    const winW=cw*.44, winH=ch*.6;
    const wx=c*cw+(cw-winW)/2, wy=r*ch+(ch-winH)/2;
    dx.fillStyle=lintel; dx.fillRect(wx-4,wy-7,winW+8,6); dx.fillRect(wx-5,wy+winH+1,winW+10,5);
    dx.fillStyle=frame;  dx.fillRect(wx-2,wy-2,winW+4,winH+4);
    const g=dx.createLinearGradient(wx,wy,wx,wy+winH);
    g.addColorStop(0,'#5b6e80'); g.addColorStop(.5,'#34414f'); g.addColorStop(1,'#222b35');
    dx.fillStyle=g; dx.fillRect(wx,wy,winW,winH);
    dx.fillStyle=frame; dx.fillRect(wx,wy+winH/2-1.5,winW,3); dx.fillRect(wx+winW/2-1.5,wy,3,winH);
    if(Math.random()<lit){
      nx.fillStyle=pick(['#ffb45e','#ffc97e','#ffd9a0','#f0e6c8']);
      nx.fillRect(wx+1,wy+1,winW-2,winH-2);
      if(Math.random()<.5){ nx.fillStyle='rgba(0,0,0,.55)'; nx.fillRect(wx+1,wy+winH*rand(.3,.6),winW-2,winH*.4); }
    }
  }
  return { map:tex(day,1,1), emi:tex(nite,1,1) };
}

/* =====================================================================
   CITY BUILD FROM OSM SURVEY DATA
===================================================================== */
const RETAIL = new Set(['Shoreditch High Street','Bethnal Green Road','Redchurch Street','Brick Lane',
  'Boundary Street','Calvert Avenue','Rivington Street','Old Street','Hackney Road','Great Eastern Street',
  'Sclater Street','Commercial Street','Curtain Road','Kingsland Road']);
const MURAL_ST = new Set(['Brick Lane','Redchurch Street','Sclater Street','Rivington Street','New Inn Yard','Chance Street','Whitby Street']);
const ROAD_W = { primary:11, secondary:9.5, tertiary:8.5, residential:7, unclassified:7, living_street:6, pedestrian:4.5, service:4 };
const SPAWN = { x:-129.7, z:113.5, yaw:2.214 };
const retailSegs = [];   // {ax,az,bx,bz,name,w}
const muralSegs  = [];
let muralCount = 0;

function d2segSq(px,pz, ax,az,bx,bz){
  const dx=bx-ax, dz=bz-az, L=dx*dx+dz*dz;
  const t = L===0?0:Math.max(0,Math.min(1,((px-ax)*dx+(pz-az)*dz)/L));
  const qx=ax+dx*t, qz=az+dz*t;
  return (px-qx)*(px-qx)+(pz-qz)*(pz-qz);
}
function nearSegs(segs, x,z, r){
  const r2=r*r;
  for(const s of segs) if(d2segSq(x,z,s.ax,s.az,s.bx,s.bz)<r2) return s;
  return null;
}

function buildRoads(roads){
  const rb = bucket('roads', MAT.asphalt, 8, 8);
  roads.forEach((r,ri)=>{
    const w = ROAD_W[r.t]||6, y = 0.02 + (ri%9)*0.0035;
    for(let i=0;i<r.p.length-1;i++){
      const [ax,az]=r.p[i], [bx,bz]=r.p[i+1];
      const dx=bx-ax, dz=bz-az, L=Math.hypot(dx,dz); if(L<0.3) continue;
      const nx=-dz/L*w/2, nz=dx/L*w/2;
      // flat ribbon quad (normal up)
      const i0=rb.pos.length/3;
      rb.pos.push(ax+nx,y,az+nz, bx+nx,y,bz+nz, bx-nx,y,bz-nz, ax-nx,y,az-nz);
      for(let k2=0;k2<4;k2++) rb.nor.push(0,1,0);
      rb.uv.push(0,0, L/8,0, L/8,w/8, 0,w/8);
      rb.idx.push(i0,i0+1,i0+2, i0,i0+2,i0+3);
      if(RETAIL.has(r.n)) retailSegs.push({ax,az,bx,bz,name:r.n,w});
      if(MURAL_ST.has(r.n)) muralSegs.push({ax,az,bx,bz,name:r.n,w});
    }
  });
}

function signedArea(ring){
  let s=0;
  for(let i=0;i<ring.length;i++){
    const [x1,z1]=ring[i], [x2,z2]=ring[(i+1)%ring.length];
    s += x1*z2 - x2*z1;
  }
  return s/2;
}

function buildBuildings(bs){
  const roofB = bucket('roof', MAT.roof, 9, 9);
  const farB  = bucket('far',  MAT.far, 4, 4);
  bs.forEach((b, bi)=>{
    let ring = b.p.slice();
    if(ring.length>1 && ring[0][0]===ring[ring.length-1][0] && ring[0][1]===ring[ring.length-1][1]) ring.pop();
    if(ring.length<3) return;
    const A = signedArea(ring);
    if(Math.abs(A)<15) return;
    if(A<0) ring.reverse();                       // CCW: outward normal = (dz,-dx)
    let cx=0,cz=0; ring.forEach(p=>{cx+=p[0];cz+=p[1];}); cx/=ring.length; cz/=ring.length;
    const d0 = Math.hypot(cx-SPAWN.x, cz-SPAWN.z);
    const area = Math.abs(A);
    const h = b.h ? Math.min(Math.max(b.h,4),60)
                  : (area<80 ? rand(6,9.5) : rand(9,16));
    const far = d0>210;
    const fam = FAMS[(bi*7+ring.length)%FAMS.length];
    const retail = !far && nearSegs(retailSegs, cx, cz, 16+Math.sqrt(area)/3);
    const groundH = retail ? 3.4 : 0;
    const wallB = far ? farB : bucket(fam.key, fam.mat, 12.8, 9.3);
    const shop = retail ? SHOPS[bi%2] : null;
    const shopB = shop ? bucket(shop.key, shop.mat, 6, 3.4) : null;

    for(let i=0;i<ring.length;i++){
      const [ax,az]=ring[i], [bx,bz]=ring[(i+1)%ring.length];
      const dx=bx-ax, dz=bz-az, L=Math.hypot(dx,dz); if(L<0.2) continue;
      const nx=dz/L, nz=-dx/L;                    // outward
      if(groundH>0) pushQuad(shopB, ax,az,bx,bz, 0, groundH, nx,nz);
      pushQuad(wallB, ax,az,bx,bz, groundH, h, nx,nz);
      if(d0<240) addEdge(ax,az,bx,bz);
      // murals on long blank-ish walls in the street-art core
      if(!far && muralCount<16 && L>9 && h>7 && Math.random()<.18 && nearSegs(muralSegs, (ax+bx)/2,(az+bz)/2, 22)){
        muralCount++;
        const mw=Math.min(L*.86, 15), mh=Math.min(h*.7, 10);
        const mcx=(ax+bx)/2+nx*.07, mcz=(az+bz)/2+nz*.07;
        const mp=new THREE.Mesh(new THREE.PlaneGeometry(mw,mh),
          new THREE.MeshStandardMaterial({ map:tex(muralCanvas(),1,1), roughness:.85 }));
        mp.position.set(mcx, mh/2+ (groundH||1), mcz);
        mp.rotation.y = Math.atan2(nx,nz);
        cityRoot.add(mp);
      }
    }
    pushPolyCap(roofB, ring, h);
  });
}

function lampPost(x,z, withLight){
  const g=new THREE.Group();
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,5.6,7), MAT.blackMetal);
  pole.position.y=2.8; pole.castShadow=true; g.add(pole);
  const headMat=regGlow(new THREE.MeshStandardMaterial({ color:0x222018, emissive:0xffc878, emissiveIntensity:0, roughness:.4 }),3.2);
  lampHeads.push(headMat);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.22,9,7), headMat);
  head.position.y=5.45; g.add(head);
  if(withLight){
    const pl=new THREE.PointLight(0xffb868,0,26,1.8);
    pl.position.y=5.2; g.add(pl); lampLights.push(pl);
  }
  g.position.set(x,0,z); cityRoot.add(g);
  addBoxEdges(x,z,.4,.4);
}
function buildLamps(){
  let acc=0, side=1, n=0, lit=0;
  for(const s of retailSegs){
    const L=Math.hypot(s.bx-s.ax, s.bz-s.az);
    let t=(26-acc)%26; if(t<0) t+=26;
    while(t<L && n<90){
      const px=s.ax+(s.bx-s.ax)*t/L, pz=s.az+(s.bz-s.az)*t/L;
      const nx=-(s.bz-s.az)/L, nz=(s.bx-s.ax)/L;
      const off=s.w/2+1.1;
      const lx=px+nx*off*side, lz=pz+nz*off*side;
      const useLight = lit<8 && Math.hypot(lx-SPAWN.x,lz-SPAWN.z)<80;
      if(useLight) lit++;
      lampPost(lx,lz,useLight);
      side=-side; n++; t+=26;
    }
    acc=(acc+L)%26;
  }
}
function buildSigns(roads){
  const byName=new Map();
  roads.forEach(r=>{ if(!r.n||!RETAIL.has(r.n)) return;
    let L=0; for(let i=0;i<r.p.length-1;i++) L+=Math.hypot(r.p[i+1][0]-r.p[i][0], r.p[i+1][1]-r.p[i][1]);
    const e=byName.get(r.n)||{L:0,segs:[]}; e.L+=L; e.segs.push(r); byName.set(r.n,e);
  });
  let n=0;
  [...byName.entries()].sort((a,b)=>b[1].L-a[1].L).slice(0,9).forEach(([name,e])=>{
    const r=e.segs[Math.floor(e.segs.length/2)];
    const i=Math.floor((r.p.length-1)/2);
    const [ax,az]=r.p[i],[bx,bz]=r.p[i+1];
    const L=Math.hypot(bx-ax,bz-az); if(L<1) return;
    const mx=(ax+bx)/2, mz=(az+bz)/2;
    const nx=-(bz-az)/L, nz=(bx-ax)/L;
    const w=(ROAD_W[r.t]||7)/2+1.0;
    const c=makeCanvas(512,96), sx=c.getContext('2d');
    sx.fillStyle='#f2efe6'; sx.fillRect(0,0,512,96);
    sx.strokeStyle='#101010'; sx.lineWidth=6; sx.strokeRect(4,4,504,88);
    sx.fillStyle='#101010'; sx.font='700 38px Helvetica'; sx.textAlign='center';
    sx.fillText(name.toUpperCase(), 256, 60);
    const g=new THREE.Group();
    const post=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,2.6,6), MAT.blackMetal);
    post.position.y=1.3; g.add(post);
    const plate=new THREE.Mesh(new THREE.PlaneGeometry(3.2,.6),
      new THREE.MeshStandardMaterial({ map:tex(c), roughness:.6, side:THREE.DoubleSide }));
    plate.position.y=2.5; g.add(plate);
    g.position.set(mx+nx*w, 0, mz+nz*w);
    g.rotation.y=Math.atan2(bx-ax, bz-az);
    cityRoot.add(g); addBoxEdges(g.position.x, g.position.z, .3,.3); n++;
  });
}
function doubleDecker(x,z,ry){
  const red=new THREE.MeshStandardMaterial({ color:0xa8121e, roughness:.4, metalness:.15 });

function roadSpot(roads, name, frac, lateral){
  const segs=[];
  roads.forEach(r=>{ if(r.n!==name) return;
    for(let i=0;i<r.p.length-1;i++) segs.push([...r.p[i],...r.p[i+1]]); });
  let total=0; segs.forEach(s=>total+=Math.hypot(s[2]-s[0],s[3]-s[1]));
  let target=total*frac;
  for(const [ax,az,bx,bz] of segs){
    const L=Math.hypot(bx-ax,bz-az);
    if(target<=L){
      const t=target/L, px=ax+(bx-ax)*t, pz=az+(bz-az)*t;
      const nx=-(bz-az)/L, nz=(bx-ax)/L;
      return { x:px+nx*lateral, z:pz+nz*lateral, ang:Math.atan2(bx-ax,bz-az) };
    }
    target-=L;
  }
  return null;
}

  st('DUSK','\u263D',    0x0a1020,0x232a40, 0.7,-0.02, 0x8899cc,0.07, 0.12, 0x10141f,0.0062, 0.88, 1, 1.0, 0.8, 0xdfe8ff,0.7),
];

function applyBlend(a,b,t){
  const L=(p,q)=>p+(q-p)*t;
  skyUni.topColor.value.lerpColors(a.skyTop,b.skyTop,t);
  skyUni.horizonColor.value.lerpColors(a.skyHor,b.skyHor,t);
  scene.fog.color.lerpColors(a.fogCol,b.fogCol,t);
  scene.fog.density = L(a.fogD,b.fogD);
  renderer.toneMappingExposure = L(a.expo,b.expo);
  sun.color.lerpColors(a.sunCol,b.sunCol,t);
  sun.intensity = L(a.sunInt,b.sunInt);
  hemi.intensity = L(a.hemiInt,b.hemiInt);
  const az=L(a.az,b.az), el=Math.max(L(a.el,b.el), -0.1);
  const r=300;
  sun.position.set(Math.cos(az)*Math.cos(el)*r, Math.sin(Math.max(el,0.02))*r, Math.sin(az)*Math.cos(el)*r);
  disc.position.copy(sun.position).normalize().multiplyScalar(720);
  disc.lookAt(0,disc.position.y*0.0,0); disc.lookAt(camera.position);
  discMat.color.lerpColors(a.discCol,b.discCol,t);
  discMat.opacity = L(a.discOp,b.discOp) * (sun.position.y>-30?1:0);
  starMat.opacity = L(a.stars,b.stars);
  const glow = L(a.glow,b.glow), lamps=L(a.lampsOn,b.lampsOn);
  glowMats.forEach(({mat,max})=> mat.emissiveIntensity = glow*max);
  lampHeads.forEach(m=> m.emissiveIntensity = lamps*3.2);
  lampLights.forEach(pl=> pl.intensity = lamps*55);
}

/* ---------- collision (XZ AABB slide) ---------- */
function collide(pos){
  const r = player.radius;
  for(let pass=0; pass<2; pass++){
    const ix=Math.floor(pos.x/CELL), iz=Math.floor(pos.z/CELL);
    for(let gx=ix-1; gx<=ix+1; gx++) for(let gz=iz-1; gz<=iz+1; gz++){
      const edges = grid.get(cellKey(gx,gz)); if(!edges) continue;
      for(const [ax,az,bx,bz] of edges){
        const dx=bx-ax, dz=bz-az, L2=dx*dx+dz*dz;
        const t = L2===0?0:Math.max(0,Math.min(1,((pos.x-ax)*dx+(pos.z-az)*dz)/L2));
        const qx=ax+dx*t, qz=az+dz*t;
        let ox=pos.x-qx, oz=pos.z-qz;
        const d=Math.hypot(ox,oz);
        if(d<r && d>1e-6){ pos.x=qx+ox/d*r; pos.z=qz+oz/d*r; }
        else if(d<=1e-6){ pos.x=qx+ (dz===0&&dx===0?r:( -dz/Math.sqrt(L2||1))*r); pos.z=qz+((dx)/Math.sqrt(L2||1))*r; }
      }
    }
  }
  pos.x = Math.max(-460, Math.min(460, pos.x));
  pos.z = Math.max(-420, Math.min(460, pos.z));
}

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3();
const camPos = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // time-of-day transition
  if(blend < 1){
    blend = Math.min(1, blend + dt/2.2);
    applyBlend(fromS, toS, blend*blend*(3-2*blend));
  }

  // movement input relative to camera yaw
  let ix=0, iz=0;
  if(keys.KeyW||keys.ArrowUp) iz+=1;
  if(keys.KeyS||keys.ArrowDown) iz-=1;
  if(keys.KeyA||keys.ArrowLeft) ix+=1;
  if(keys.KeyD||keys.ArrowRight) ix-=1;
  const moving = (ix||iz) && started;
  const running = moving && (keys.ShiftLeft||keys.ShiftRight);
  const speed = running ? player.speedRun : player.speedWalk;

  if(moving){
    const ang = Math.atan2(ix,iz) + player.camYaw;
    const tx = Math.sin(ang), tz = Math.cos(ang);
    player.vel.x += (tx*speed - player.vel.x)*Math.min(1,dt*10);
    player.vel.z += (tz*speed - player.vel.z)*Math.min(1,dt*10);
    // face movement direction smoothly
    let target = Math.atan2(player.vel.x, player.vel.z);
    let dy = target - player.yaw;
    while(dy> Math.PI) dy-=TAU; while(dy<-Math.PI) dy+=TAU;
    player.yaw += dy*Math.min(1,dt*12);
  } else {
    player.vel.x += (0-player.vel.x)*Math.min(1,dt*12);
    player.vel.z += (0-player.vel.z)*Math.min(1,dt*12);
  }
  const next = player.obj.position.clone();
  next.x += player.vel.x*dt; next.z += player.vel.z*dt;
  collide(next);
  player.obj.position.copy(next);
  player.obj.rotation.y = player.yaw;

  // animation state
  const spd = Math.hypot(player.vel.x, player.vel.z);
  if(player.mixer){
    if(spd>4.2) fadeTo('run');
    else if(spd>0.35) fadeTo('walk');
    else fadeTo('idle');
    player.mixer.update(dt);
  } else if(player.obj.children.length){
    // stand-in bob
    player.obj.children.forEach(ch=> ch.position.y = (ch.geometry?.type==='CapsuleGeometry'?0.95:1.72)
      + (spd>0.3 ? Math.sin(performance.now()*0.012)*0.04 : 0));
  }

  // third-person camera: orbit behind, soft follow
  const dist = 4.6, height = 1.9;
  camTarget.set(player.obj.position.x, player.obj.position.y+1.45, player.obj.position.z);
  camPos.set(
    camTarget.x - Math.sin(player.camYaw)*Math.cos(player.camPitch)*dist,
    camTarget.y - Math.sin(player.camPitch)*dist + (height-1.45),
    camTarget.z - Math.cos(player.camYaw)*Math.cos(player.camPitch)*dist
  );
  if(camPos.y<0.4) camPos.y=0.4;
  camera.position.lerp(camPos, Math.min(1, dt*9));
  camera.lookAt(camTarget);

  // sun shadow follows player
  sun.target.position.copy(player.obj.position);
  const sd = sun.position.clone().normalize().multiplyScalar(220);
  sun.position.copy(player.obj.position).add(sd);

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
