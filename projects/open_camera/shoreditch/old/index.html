<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarity Builder · London</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#e8eef7;--dim:#8da0bd;--line:rgba(150,180,220,.18);--glass:rgba(14,20,34,.62);--accent:#ffb061}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#05080f;color:var(--ink);font-family:'Bricolage Grotesque',sans-serif}
  #app{position:fixed;inset:0}canvas{display:block}
  .hud{position:fixed;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--glass);border:1px solid var(--line);border-radius:14px}
  #panel{left:18px;bottom:18px;padding:16px 18px;width:330px}
  #panel .lbl{font-family:'Space Mono';font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  #timeName{font-weight:800;font-size:19px;margin:3px 0 12px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;outline:none;background:linear-gradient(90deg,#0a0e1a,#e8956b,#cfe0f0,#bcd9f0,#e0b080,#ff7040,#4a3a66,#0a0e1a)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--accent);cursor:pointer;box-shadow:0 0 12px rgba(255,176,97,.6)}
  .ticks{display:flex;justify-content:space-between;margin-top:7px}.ticks span{font-family:'Space Mono';font-size:8.5px;color:var(--dim);opacity:.7}
  .row{display:flex;align-items:center;justify-content:space-between;margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}
  .row .t{font-size:13px;font-weight:600}.row .s{font-family:'Space Mono';font-size:9px;color:var(--dim);margin-top:2px}
  .toggle{position:relative;width:46px;height:25px;border-radius:25px;background:rgba(255,255,255,.1);border:1px solid var(--line);cursor:pointer;transition:.25s;flex:none}
  .toggle.on{background:linear-gradient(90deg,#ffb061,#ff7d3a)}.toggle .k{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.25s}.toggle.on .k{left:23px}
  #help{right:18px;top:18px;padding:13px 16px;width:220px}
  #help h2{font-family:'Space Mono';font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  #help .k{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:12px}
  #help kbd{font-family:'Space Mono';font-size:10px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:5px;padding:2px 7px;min-width:22px;text-align:center}
  #help .hint{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:10.5px;color:var(--dim);line-height:1.6}
  #lockmsg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;text-align:center;pointer-events:none;transition:opacity .4s}
  #lockmsg .big{font-weight:800;font-size:22px}#lockmsg .sub{font-family:'Space Mono';font-size:11px;color:var(--dim);margin-top:6px}
  .gone{opacity:0!important;pointer-events:none}
  #status{position:fixed;left:18px;top:18px;z-index:20;font-family:'Space Mono';font-size:10.5px;color:var(--dim);background:var(--glass);border:1px solid var(--line);padding:8px 12px;border-radius:8px;line-height:1.7;min-width:150px}
  #status b{color:var(--ink)}.ok{color:#7fe0a0}.bad{color:#ff8a6a}
</style>
</head>
<body>
<div id="app"></div>
<div id="status">booting…</div>
<div id="lockmsg"><div class="big">Click to explore</div><div class="sub">mouse looks · esc releases</div></div>
<div id="help" class="hud">
  <h2>Controls</h2>
  <div class="k"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <span>move</span></div>
  <div class="k"><kbd>↑↓←→</kbd> <span>move</span></div>
  <div class="k"><kbd>⇧</kbd> <span>sprint</span></div>
  <div class="k"><kbd>mouse</kbd> <span>look</span></div>
  <div class="hint">Click the scene to capture the mouse. Esc releases it.</div>
</div>
<div id="panel" class="hud">
  <div class="lbl">Time of day</div>
  <div id="timeName">Afternoon</div>
  <input id="time" type="range" min="0" max="1" step="0.001" value="0.43">
  <div class="ticks"><span>Night</span><span>Dawn</span><span>Morn</span><span>Noon</span><span>Eve</span><span>Set</span><span>Dusk</span><span>Night</span></div>
  <div class="row"><div><div class="t">Night lights</div><div class="s">streetlamps &amp; glow</div></div><div id="nl" class="toggle"><div class="k"></div></div></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const WORLD_URL='./london_bankside.glb', CHAR_URL='./clarity_builder.glb';
const S=document.getElementById('status');
const log=(html)=>S.innerHTML=html;
let wOK='…', cOK='…';
const draw=()=>log(`<b>Clarity Builder · London</b><br>world: <span class="${wOK===true?'ok':wOK===false?'bad':''}">${wOK===true?'loaded':wOK===false?'FAILED':'loading…'}</span><br>character: <span class="${cOK===true?'ok':cOK===false?'bad':''}">${cOK===true?'loaded':cOK===false?'placeholder':'loading…'}</span><br><span id="fps"></span>`);
draw();

// ---- renderer / scene / camera ----
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x9bb4d0,0.00016);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,0.1,14000);
camera.position.set(40,30,40); camera.lookAt(0,5,0);

// ---- sky ----
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
  uniforms:{top:{value:new THREE.Color(0x357bd8)},bottom:{value:new THREE.Color(0xbcd9f0)},exponent:{value:0.7}},
  vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 top;uniform vec3 bottom;uniform float exponent;varying vec3 vP;void main(){float h=normalize(vP).y;float t=pow(clamp(h*.5+.5,0.,1.),exponent);gl_FragColor=vec4(mix(bottom,top,t),1.);}`});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(7000,32,16),skyMat));

// ---- lights + visible sun ----
const sun=new THREE.DirectionalLight(0xfff6e8,3.2);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1; sun.shadow.camera.far=700;
{const c=sun.shadow.camera,H=70;c.left=-H;c.right=H;c.top=H;c.bottom=-H;} sun.shadow.bias=-0.0004;
scene.add(sun,sun.target);
const hemi=new THREE.HemisphereLight(0xbcd9f0,0x35506b,1.0); scene.add(hemi);
const amb=new THREE.AmbientLight(0xffffff,0.18); scene.add(amb);
const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(90,20,20),new THREE.MeshBasicMaterial({color:0xfff2d0,fog:false})); scene.add(sunDisc);
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const grd=g.createRadialGradient(64,64,0,64,64,64);grd.addColorStop(0,'rgba(255,240,200,.9)');grd.addColorStop(.3,'rgba(255,210,150,.5)');grd.addColorStop(1,'rgba(255,200,150,0)');g.fillStyle=grd;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);})();
const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,depthWrite:false,fog:false,blending:THREE.AdditiveBlending})); sunGlow.scale.set(900,900,1); scene.add(sunGlow);

// ---- time of day ----
const KF=[
 {n:'Night',e:-16,a:75,s:0x24344e,i:0.0,t:0x070b16,b:0x141d30,h:0.18,m:0.10,f:0x0a1020,x:0.72},
 {n:'Dawn',e:4,a:82,s:0xff9c5e,i:1.3,t:0x2c3c60,b:0xe89068,h:0.45,m:0.16,f:0xc88a6a,x:0.62},
 {n:'Morning',e:32,a:112,s:0xffe4b8,i:2.7,t:0x4076c0,b:0xd0e2f2,h:0.85,m:0.20,f:0xcfe0f0,x:0.78},
 {n:'Afternoon',e:72,a:178,s:0xfff7ea,i:3.3,t:0x357bd8,b:0xbcd9f0,h:1.05,m:0.22,f:0xcfe6f5,x:0.80},
 {n:'Evening',e:26,a:248,s:0xffce96,i:2.2,t:0x3a5a8c,b:0xe2b582,h:0.62,m:0.18,f:0xdcb98f,x:0.66},
 {n:'Sunset',e:2,a:276,s:0xff6633,i:1.5,t:0x2a2a58,b:0xff7038,h:0.38,m:0.16,f:0xd56a40,x:0.55},
 {n:'Dusk',e:-9,a:286,s:0x6a4f86,i:0.25,t:0x12162c,b:0x453a64,h:0.22,m:0.13,f:0x2a2440,x:0.60},
 {n:'Night',e:-16,a:292,s:0x24344e,i:0.0,t:0x070b16,b:0x141d30,h:0.18,m:0.10,f:0x0a1020,x:0.72}];
const lerp=(a,b,t)=>a+(b-a)*t; const ca=new THREE.Color(),cb=new THREE.Color();
const cl=(a,b,t)=>ca.setHex(a).lerp(cb.setHex(b),t).clone();
const sunDir=new THREE.Vector3(0,1,0);
function applyTime(v){
  const seg=v*(KF.length-1);let i=Math.min(KF.length-2,Math.floor(seg));const f=seg-i;const A=KF[i],B=KF[i+1];
  const e=lerp(A.e,B.e,f)*Math.PI/180,a=lerp(A.a,B.a,f)*Math.PI/180;
  sunDir.set(Math.cos(e)*Math.cos(a),Math.sin(e),Math.cos(e)*Math.sin(a));
  sun.intensity=lerp(A.i,B.i,f); sun.color.copy(cl(A.s,B.s,f));
  hemi.intensity=lerp(A.h,B.h,f); hemi.color.copy(cl(A.t,B.t,f));
  amb.intensity=lerp(A.m,B.m,f);
  skyMat.uniforms.top.value.copy(cl(A.t,B.t,f)); skyMat.uniforms.bottom.value.copy(cl(A.b,B.b,f)); skyMat.uniforms.exponent.value=lerp(A.x,B.x,f);
  scene.fog.color.copy(cl(A.f,B.f,f));
  renderer.toneMappingExposure=lerp(0.85,1.05,Math.max(0,sunDir.y));
  const above=sunDir.y>0.01; sunDisc.visible=above; sunGlow.visible=above; sunDisc.material.color.copy(sun.color);
  sunDisc.position.copy(sunDir).multiplyScalar(4500); sunGlow.position.copy(sunDisc.position);
  document.getElementById('timeName').textContent=KF[Math.round(seg)].n;
}
document.getElementById('time').addEventListener('input',e=>applyTime(+e.target.value));

// ---- loaders ----
const loader=new GLTFLoader();
const draco=new DRACOLoader(); draco.setDecoderPath('https://unpkg.com/three@0.161.0/examples/jsm/libs/draco/'); loader.setDRACOLoader(draco);

const groundMeshes=[], collideMeshes=[];
const dRay=new THREE.Raycaster(); dRay.far=500;
const sRay=new THREE.Raycaster();
const worldCenter=new THREE.Vector3();
let player=null, ready=false, mixer=null, idleA=null, walkA=null, curAnim=null;

function gh(x,z,from){ dRay.set(new THREE.Vector3(x,from,z),new THREE.Vector3(0,-1,0)); const h=dRay.intersectObjects(groundMeshes,false); return h.length?h[0].point.y:null; }

loader.load(WORLD_URL,gltf=>{
  const w=gltf.scene; scene.add(w); w.updateMatrixWorld(true);
  const box=new THREE.Box3();
  w.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; if(o.material)o.material.side=THREE.FrontSide;
    o.geometry.computeBoundingBox(); const b=o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
    groundMeshes.push(o); const dx=b.max.x-b.min.x,dz=b.max.z-b.min.z,h=b.max.y-b.min.y;
    if(h>6 && dx<260 && dz<260) collideMeshes.push(o); }});
  box.setFromObject(w); worldCenter.set((box.min.x+box.max.x)/2,0,(box.min.z+box.max.z)/2);
  wOK=true; draw();
  spawnPlayer();           // capsule placeholder right away → controls live immediately
  buildNightLights(box);
  loadCharacter();
}, e=>{ if(e.total){wOK=`${Math.round(e.loaded/e.total*100)}%`;draw();} },
   err=>{ console.error(err); wOK=false; draw(); });

const capsule=()=>{ const g=new THREE.Group();
  const m=new THREE.Mesh(new THREE.CapsuleGeometry(0.35,1.1,6,12),new THREE.MeshStandardMaterial({color:0xff8a3d,roughness:.6}));
  m.position.y=0.9; m.castShadow=true; g.add(m); return g; };

function spawnPlayer(){
  player=new THREE.Group();
  const sx=worldCenter.x, sz=worldCenter.z;
  const y=gh(sx,sz,300); player.position.set(sx, y!=null?y:2, sz);
  player.add(capsule());
  scene.add(player);
  // camera starts behind player
  yaw=Math.PI; pitch=0.32;
  ready=true;
}

function loadCharacter(){
  loader.load(CHAR_URL,gltf=>{
    const m=gltf.scene;
    let skin=null; m.traverse(o=>{ if(o.isSkinnedMesh && !skin) skin=o; if(o.name && o.name.toLowerCase().includes('icosphere')) o.visible=false; });
    // scale by the human's true height (~1.85m) → 1.8m
    const ref=skin||m; const b=new THREE.Box3().setFromObject(ref); const sz=new THREE.Vector3(); b.getSize(sz);
    const sc=1.8/Math.max(sz.y,0.001); m.scale.setScalar(sc);
    m.updateMatrixWorld(true);
    const b2=new THREE.Box3().setFromObject(skin||m); m.position.y-=b2.min.y;   // feet to ground
    m.traverse(o=>{ if(o.isMesh){o.castShadow=true; o.receiveShadow=true;} });
    // swap capsule → real model
    while(player.children.length) player.remove(player.children[0]);
    player.add(m);
    // animations
    if(gltf.animations && gltf.animations.length){
      mixer=new THREE.AnimationMixer(m);
      for(const c of gltf.animations){ const n=c.name.toLowerCase(); if(n.includes('walk'))walkA=mixer.clipAction(c); else if(n.includes('idle'))idleA=mixer.clipAction(c); }
      if(!idleA) idleA=mixer.clipAction(gltf.animations[0]);
      if(idleA){ idleA.play(); curAnim=idleA; }
    }
    cOK=true; draw();
  }, undefined, err=>{ console.error(err); cOK=false; draw(); });   // keep capsule on failure
}

function setAnim(a){ if(!a||a===curAnim||!mixer) return; a.reset().fadeIn(0.2).play(); if(curAnim)curAnim.fadeOut(0.2); curAnim=a; }

// ---- night lights ----
const nightGroup=new THREE.Group(); nightGroup.visible=false; scene.add(nightGroup);
function buildNightLights(box){
  const bg=new THREE.SphereGeometry(0.5,8,8), bm=new THREE.MeshBasicMaterial({color:0xffd58a});
  const N=4;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const x=lerp(box.min.x+30,box.max.x-30,(i+.5)/N), z=lerp(box.min.z+30,box.max.z-30,(j+.5)/N);
    let y=gh(x,z,300); y=(y!=null?y:4)+7;
    const pl=new THREE.PointLight(0xffb866,0,60,2); pl.position.set(x,y,z); pl.userData.base=22; nightGroup.add(pl);
    const bb=new THREE.Mesh(bg,bm); bb.position.set(x,y,z); nightGroup.add(bb);
  }
}
let nightOn=false; const nl=document.getElementById('nl');
nl.addEventListener('click',()=>{ nightOn=!nightOn; nl.classList.toggle('on',nightOn); nightGroup.visible=nightOn;
  nightGroup.children.forEach(c=>{ if(c.isPointLight)c.intensity=nightOn?c.userData.base:0; }); });

// ---- input ----
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
let yaw=Math.PI,pitch=0.32,locked=false;
const lockMsg=document.getElementById('lockmsg');
renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement; lockMsg.classList.toggle('gone',locked);});
addEventListener('mousemove',e=>{ if(!locked)return; yaw-=e.movementX*0.0025; pitch=Math.max(-0.2,Math.min(1.1,pitch-e.movementY*0.0025)); });

// ---- loop ----
const clock=new THREE.Clock();
const fwd=new THREE.Vector3(),rt=new THREE.Vector3(),mv=new THREE.Vector3(),camPos=new THREE.Vector3(),camTgt=new THREE.Vector3();
const camDist=6,headH=1.5; let fa=0,fn=0;

function blocked(dirx,dirz,dist){
  if(dist===0||collideMeshes.length===0) return false;
  sRay.set(new THREE.Vector3(player.position.x,player.position.y+1.0,player.position.z), new THREE.Vector3(dirx,0,dirz).normalize());
  sRay.far=Math.abs(dist)+0.6;
  const h=sRay.intersectObjects(collideMeshes,false);
  return h.length>0;
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  if(mixer) mixer.update(dt);
  if(ready&&player){
    fwd.set(-Math.sin(yaw),0,-Math.cos(yaw)).normalize();
    rt.set(fwd.z,0,-fwd.x);
    let f=0,r=0;
    if(keys.KeyW||keys.ArrowUp)f++; if(keys.KeyS||keys.ArrowDown)f--;
    if(keys.KeyD||keys.ArrowRight)r++; if(keys.KeyA||keys.ArrowLeft)r--;
    mv.set(0,0,0).addScaledVector(fwd,f).addScaledVector(rt,r);
    const moving=mv.lengthSq()>0;
    if(moving){
      mv.normalize();
      const sp=(keys.ShiftLeft||keys.ShiftRight?9:4.5)*dt;
      const mx=mv.x*sp, mz=mv.z*sp;
      if(!blocked(Math.sign(mx)||0,0,mx)) player.position.x+=mx;
      if(!blocked(0,Math.sign(mz)||0,mz)) player.position.z+=mz;
      const ang=Math.atan2(mv.x,mv.z); let d=ang-player.rotation.y;
      while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
      player.rotation.y+=d*Math.min(1,dt*10);
      setAnim(walkA);
    } else setAnim(idleA);
    const gy=gh(player.position.x,player.position.z,player.position.y+50);
    if(gy!=null) player.position.y+=(gy-player.position.y)*Math.min(1,dt*12);
    // third-person camera
    camTgt.copy(player.position); camTgt.y+=headH;
    const cp=Math.cos(pitch);
    camPos.set(camTgt.x+camDist*Math.sin(yaw)*cp, camTgt.y+camDist*Math.sin(pitch)+0.4, camTgt.z+camDist*Math.cos(yaw)*cp);
    const cg=gh(camPos.x,camPos.z,camPos.y+30); if(cg!=null&&camPos.y<cg+0.6)camPos.y=cg+0.6;
    camera.position.lerp(camPos,0.5); camera.lookAt(camTgt);
    sun.position.copy(player.position).addScaledVector(sunDir,300); sun.target.position.copy(player.position);
  }
  renderer.render(scene,camera);
  fa+=dt;fn++; if(fa>=0.5){const el=document.getElementById('fps'); if(el)el.textContent=Math.round(fn/fa)+' fps'; fa=0;fn=0;}
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
applyTime(0.43); animate();
</script>
</body>
</html>
