<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERA ORA > BEYOND THE BOOK</title>
    <style>
        /* CSS Reset and Variables */
        :root {
            --bg-color: #050505;
            --text-color: #e0e0e0;
            --link-color: #ffffff;
            --border-color: #555555;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            /* Contemporary sans-serif system font stack */
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 640px;
            padding: 40px;
            line-height: 1.7;
            font-size: 1.15rem;
            font-weight: 300;
        }

        p {
            margin-bottom: 2rem;
        }

        p:last-child {
            margin-bottom: 0;
        }

        /* Subtle emphasis for the title */
        .title {
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        /* Minimal link styling */
        a {
            color: var(--link-color);
            text-decoration: none;
            border-bottom: 1px solid var(--border-color);
            transition: border-color 0.3s ease;
            padding-bottom: 2px;
        }

        a:hover {
            border-bottom-color: var(--link-color);
        }

        .footer {
            margin-top: 4rem;
            font-size: 0.95rem;
            color: #888888;
        }

        .footer a {
            color: #888888;
            border-bottom-color: #333333;
        }

        .footer a:hover {
            color: #ffffff;
            border-bottom-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <p>Thanks for checking out <span class="title">ROOM 1 of ERA ORA &gt; BEYOND THE BOOK</span>.</p>
        
        <p>If you’d like to hear more about the experience, please <a href="mailto:epoli.uk@gmail.com">get in touch</a>.</p>
        
        <p>And if you enjoyed it, please leave a comment on the LinkedIn post to help me reach out to more people.</p>
        
        <p class="footer">
            More about my work on my website:
            <a href="https://www.enricopoli.com" target="_blank" rel="noopener noreferrer">www.enricopoli.com</a>
        </p>
    </div>

</body>
</html>
