<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Fabric</title>
<style>
  * { margin:0; padding:0; }
  body { background:#000206; overflow:hidden; }

  #cursor {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:3px; height:3px;
    border-radius:50%;
    background:rgba(0,200,255,0.35);
    pointer-events:none;
    transition:all 0.25s cubic-bezier(0.2,0,0,1);
    z-index:10;
    opacity:0;
  }
  body.started #cursor{ opacity:1; }

  #cursor.observing {
    width:10px; height:10px;
    background:rgba(255,255,255,0.7);
    box-shadow:0 0 16px rgba(0,210,255,0.5);
  }

  #enter {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#000206;
    font-family:monospace; font-size:10px;
    letter-spacing:6px; color:rgba(0,180,220,0.4);
    cursor:pointer;
    transition:opacity 1.4s;
  }

  #veil {
    position:fixed; inset:0; background:#000206;
    pointer-events:none; z-index:5;
    opacity: 1;
    transition: opacity 3.5s ease;
  }

  /* ── USER GUIDE (return) ─────────────────────────────────────────────── */
  #userGuide {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 30;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(10, 18, 28, 0.38);
    border: 1px solid rgba(160, 210, 255, 0.10);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: monospace;
    font-size: 10px;
    letter-spacing: 1.6px;
    color: rgba(200, 235, 255, 0.72);
    opacity: 0;
    pointer-events: none;
    transition: opacity 350ms ease;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #userGuide.visible { opacity: 1; }
  #userGuide .kbd {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 6px;
    border: 1px solid rgba(200, 235, 255, 0.22);
    background: rgba(0, 0, 0, 0.22);
    color: rgba(220, 245, 255, 0.90);
    margin-right: 6px;
  }

</style>
</head>
<body>
<div id="veil"></div>
<div id="cursor"></div>
<div id="userGuide"><span class="kbd">ESC</span> Return</div>
<div id="enter">ENTER</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   THE FABRIC
   The grid is spacetime. You warp it by existing in it.
   Quantum objects are points in superposition — probability clouds.
   Look at one: it collapses. A shockwave propagates through the lattice.
   If it had an entangled twin, that twin collapses too — instantly,
   regardless of distance. The lattice carries that news as a ripple.
   No words. Just the physics, felt.
═══════════════════════════════════════════════════════════════ */

const STEP = 90;
const HALF = 12;  // render grid extends ±HALF*STEP (floating origin makes it feel endless)
const RANGE = HALF * STEP;

// Massive world boundary (tesseract galaxy)
const WORLD_HALF = STEP * 2200; // ~198,000 units: reaching the edge should take a long time
const SHIFT_THRESHOLD = STEP * (HALF-2);

let scene, camera, renderer;
let world, galaxyGroup;
let playerWorld = new THREE.Vector3(0,0,0);
let originOffset = new THREE.Vector3(0,0,0);
let lastT = performance.now();
let audioCtx, masterFilter, masterGain;
let droneOscs = [];
let started = false;
let enterTime = 0;
const keys = {};
const pitchYaw = { x:0, y:0 };

// Grid state
const gridLines = [];  // { line, axis, ov: original Float32Array }

// Ripple system — events that deform the grid
const ripples = [];    // { pos, t, maxT, strength, color }

// Quantum objects
const quanta = [];     // each has cloud, dot, halo, pos, state, partner...

let clock = 0;

const raycaster = new THREE.Raycaster();
const screenMid = new THREE.Vector2(0, 0);

// ─── EXIT / RETURN (keep contract with parent) ───────────────────────────────
let returnArmed = false;
function showReturnGuide(on) {
  const g = document.getElementById('userGuide');
  if (!g) return;
  g.classList.toggle('visible', !!on);
}
function exitToCapsule() {
  if (returnArmed) return;
  returnArmed = true;
  const veil = document.getElementById('veil');
  if (veil) {
    veil.style.transition = 'opacity 450ms ease';
    veil.style.opacity = '1';
  }
  try { document.exitPointerLock?.(); } catch(_) {}
  setTimeout(() => {
    try { window.parent && window.parent.postMessage({ type: 'EXIT_FABRIC' }, '*'); } catch(_) {}
  }, 350);
}


// ─── INIT ────────────────────────────────────────────────────────────────────

function snapToLattice(v, step=STEP){
  v.x = Math.round(v.x/step)*step;
  v.y = Math.round(v.y/step)*step;
  v.z = Math.round(v.z/step)*step;
  return v;
}

function updateFloatingOrigin(){
  // Keep render-space values near origin while world-space position grows.
  const camRender = new THREE.Vector3(
    playerWorld.x - originOffset.x,
    playerWorld.y - originOffset.y,
    playerWorld.z - originOffset.z
  );

  // Shift origin when the render-space camera drifts too far from (0,0,0).
  if (camRender.length() > SHIFT_THRESHOLD) {
    // Shift origin to the nearest lattice node to avoid jitter.
    const newOff = snapToLattice(playerWorld.clone(), STEP);
    originOffset.copy(newOff);
    world.position.set(-originOffset.x, -originOffset.y, -originOffset.z);

    // Recompute render-space camera after shifting origin.
    camRender.set(
      playerWorld.x - originOffset.x,
      playerWorld.y - originOffset.y,
      playerWorld.z - originOffset.z
    );
  }

  // IMPORTANT: apply render-space position to the actual camera.
  camera.position.copy(camRender);
}


function buildGalaxyGrids(){
  // Simple wire tesseracts in the distance. Render-space positions; we reposition when outside.
  const edge = new THREE.EdgesGeometry(new THREE.BoxGeometry(STEP*HALF*1.2, STEP*HALF*1.2, STEP*HALF*1.2));
  const mat = new THREE.LineBasicMaterial({ color: 0x1aa6c9, transparent:true, opacity:0.18 });
  const placements = [
    new THREE.Vector3( 4200,  900, -5200),
    new THREE.Vector3(-5600, -700, -6100),
    new THREE.Vector3( 6400, -900,  4800),
    new THREE.Vector3(-4800, 1200,  5600),
  ];
  placements.forEach((p,i)=>{
    const g = new THREE.LineSegments(edge, mat.clone());
    g.position.copy(p);
    g.rotation.set(0.15*i, 0.28*i, 0.07*i);
    g.scale.setScalar(1.0 + i*0.18);
    galaxyGroup.add(g);
  });
}

function updateGalaxy(){
  const outside =
    Math.abs(playerWorld.x) > WORLD_HALF ||
    Math.abs(playerWorld.y) > WORLD_HALF ||
    Math.abs(playerWorld.z) > WORLD_HALF;

  galaxyGroup.visible = outside;

  if (world.userData._outside === outside) return;
  world.userData._outside = outside;

  const fade = outside ? 0.35 : 1.0;

  world.traverse(obj=>{
    const mat = obj.material;
    if (!mat) return;
    const apply = (m)=>{
      if (!m) return;
      if (m.opacityBase == null) m.opacityBase = m.opacity;
      if (m.transparent) m.opacity = m.opacityBase * fade;
    };
    if (Array.isArray(mat)) mat.forEach(apply);
    else apply(mat);
  });
}
function init() {
  scene = new THREE.Scene();
  world = new THREE.Group();
  scene.add(world);

  // Distant 'other grids' (galaxies) — only shown once you exit the main tesseract
  galaxyGroup = new THREE.Group();
  galaxyGroup.visible = false;
  scene.add(galaxyGroup);
  buildGalaxyGrids();
  world.add(poiGroup);
  scene.fog = new THREE.FogExp2(0x000206, 0.0013);
  scene.background = new THREE.Color(0x000206);

  camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.5, 2800);
  camera.position.set(0, 0, 0);

  // Start inside the main tesseract (render-space camera is offset forward)
  playerWorld.set(0, 0, 240);
  camera.position.set(0, 0, 240);


  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  buildGrid();
  buildStars();
  buildQuanta();

  // Keyboard: do NOT blanket-prevent defaults (it breaks DevTools shortcuts).
  // Only prevent defaults for movement keys while pointer-locked & started.
  const MOVE_KEYS = new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','ShiftLeft','ShiftRight']);

  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;

    // ESC should always return once started (do not require pointer lock).
    if (e.code === 'Escape') {
      if (started) {
        e.preventDefault();
        exitToCapsule();
      }
      return;
    }

    // Never interfere with browser / devtools shortcuts
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!started) return;
    if (document.pointerLockElement !== renderer?.domElement) return;

    if (MOVE_KEYS.has(e.code)) e.preventDefault();
  }, { passive:false });

  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('resize',    onResize);

  document.addEventListener('pointerlockchange', ()=>{
    if (document.pointerLockElement !== renderer?.domElement) {
      // clear movement state when unlocking
      for (const k in keys) keys[k] = false;
    }
  });

  document.getElementById('enter').addEventListener('click', enter);

  animate();
}

// ─── THE GRID ────────────────────────────────────────────────────────────────
function buildGrid() {
  // Two layers: a crisp thin layer + a very dim broad glow layer
  // creates the depth of field illusion
  function addLine(ax, ay, az, bx, by, bz) {
    const ov = new Float32Array([ax,ay,az, bx,by,bz]);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(ov.slice(), 3));

    const mat = new THREE.LineBasicMaterial({
      color: 0x00c8ff,
      transparent: true,
      opacity: 0.11,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const line = new THREE.Line(geo, mat);
    world.add(line);
    gridLines.push({ line, ov });
  }

  // Axis-aligned lines in all three directions
  for (let a = -HALF; a <= HALF; a++) {
    for (let b = -HALF; b <= HALF; b++) {
      // Z-running (most dramatic when flying forward)
      addLine( a*STEP, b*STEP, -RANGE,   a*STEP, b*STEP,  RANGE);
      // X-running
      addLine(-RANGE,  a*STEP, b*STEP,   RANGE,  a*STEP, b*STEP);
      // Y-running
      addLine( a*STEP,-RANGE,  b*STEP,   a*STEP, RANGE,  b*STEP);
    }
  }

  // Node glows at intersections — a sparse subset
  const nodeGeo = new THREE.BufferGeometry();
  const nodeVerts = [];
  const step2 = STEP * 2;
  for (let x = -HALF; x <= HALF; x+=2)
    for (let y = -HALF; y <= HALF; y+=2)
      for (let z = -HALF; z <= HALF; z+=2)
        nodeVerts.push(x*STEP, y*STEP, z*STEP);
  nodeGeo.setAttribute('position', new THREE.Float32BufferAttribute(nodeVerts, 3));
  scene.add(new THREE.Points(nodeGeo, new THREE.PointsMaterial({
    color: 0x00d4ff, size: 1.4, transparent: true, opacity: 0.18,
    blending: THREE.AdditiveBlending, depthWrite: false
  })));
}

// ─── STARS ───────────────────────────────────────────────────────────────────
function buildStars() {
  const v = [];
  for (let i=0;i<12000;i++)
    v.push((Math.random()-.5)*5000, (Math.random()-.5)*5000, (Math.random()-.5)*5000);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0x1a2a3a, size: 0.7, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending
  })));
}

// ─── QUANTUM OBJECTS ─────────────────────────────────────────────────────────
function buildQuanta() {
  const positions = [];
  // Generate well-spaced positions
  for (let i = 0; i < 28; i++) {
    let pos, ok;
    let attempts = 0;
    do {
      pos = new THREE.Vector3(
        (Math.random()-.5)*1100,
        (Math.random()-.5)*1100,
        (Math.random()-.5)*1100
      );
      ok = positions.every(p => p.distanceTo(pos) > 180);
      attempts++;
    } while (!ok && attempts < 50);
    positions.push(pos);
  }

  // 7 entangled pairs (14 quanta) + 14 solo
  for (let i = 0; i < 7; i++) {
    const a = makeQuantum(positions[i*2],     false); // cyan
    const b = makeQuantum(positions[i*2+1],   true);  // violet

    a.partner = b;
    b.partner = a;

    // Entanglement thread — barely visible until collapsed
    const tGeo = new THREE.BufferGeometry().setFromPoints([positions[i*2], positions[i*2+1]]);
    const tMat = new THREE.LineBasicMaterial({
      color: 0x8822cc, transparent: true, opacity: 0.028,
      blending: THREE.AdditiveBlending
    });
    const thread = new THREE.Line(tGeo, tMat);
    world.add(thread);
    a.thread = b.thread = thread;
    a.threadMat = b.threadMat = tMat;

    quanta.push(a, b);
  }
  for (let i = 14; i < 28; i++) {
    quanta.push(makeQuantum(positions[i], false));
  }
}

function makeQuantum(pos, isB) {
  const hue   = isB ? 0.77 : 0.52; // violet vs cyan
  const color = new THREE.Color().setHSL(hue, 1.0, 0.55);
  const cHex  = color.getHex();

  // Superposition cloud — many ghost points orbiting the probability centre
  const ghostVerts = new Float32Array(90 * 3);
  for (let i = 0; i < 90; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2*Math.random()-1);
    const r     = 5 + Math.random() * 22;
    ghostVerts[i*3  ] = pos.x + r*Math.sin(phi)*Math.cos(theta);
    ghostVerts[i*3+1] = pos.y + r*Math.sin(phi)*Math.sin(theta);
    ghostVerts[i*3+2] = pos.z + r*Math.cos(phi);
  }
  const cloudGeo = new THREE.BufferGeometry();
  cloudGeo.setAttribute('position', new THREE.BufferAttribute(ghostVerts.slice(), 3));
  const cloud = new THREE.Points(cloudGeo, new THREE.PointsMaterial({
    color: cHex, size:1.9, transparent:true, opacity:0.52,
    blending: THREE.AdditiveBlending, depthWrite:false
  }));
  world.add(cloud);

  // Collapsed core — single bright point
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(2.2, 8, 8),
    new THREE.MeshBasicMaterial({ color: isB ? 0xddaaff : 0xffffff, transparent:true, opacity:0, blending:THREE.AdditiveBlending })
  );
  dot.position.copy(pos);
  world.add(dot);

  // Collapsed halo — wire sphere that expands and pulses
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(9, 10, 10),
    new THREE.MeshBasicMaterial({ color: cHex, wireframe:true, transparent:true, opacity:0, blending:THREE.AdditiveBlending })
  );
  halo.position.copy(pos);
  world.add(halo);

  return {
    cloud, dot, halo,
    pos: pos.clone(),
    state: 0,        // 0=superposition  1=collapsing  2=done
    p: 0,            // collapse progress 0→1
    partner: null,
    thread: null,
    threadMat: null,
    isB,
    cHex,
    ghostOrig: ghostVerts.slice()
  };
}

// ─── RIPPLE SYSTEM ───────────────────────────────────────────────────────────
function addRipple(pos, strength) {
  ripples.push({ pos: pos.clone(), t:0, strength });
}

// ─── GRID UPDATE ─────────────────────────────────────────────────────────────
function updateGrid() {
  // Advance ripple times
  for (let i = ripples.length-1; i >= 0; i--) {
    ripples[i].t += 0.018;
    if (ripples[i].t > 3.5) ripples.splice(i,1);
  }

  const camPos = camera.position;

  gridLines.forEach(({ line, ov }) => {
    const attr = line.geometry.attributes.position;
    let anyChange = false;

    for (let i = 0; i < 2; i++) {
      const ox = ov[i*3], oy = ov[i*3+1], oz = ov[i*3+2];
      let dx=0, dy=0, dz=0;

      // ── Observer gravity: the camera warps the fabric around itself
      const cx = ox - camPos.x, cy = oy - camPos.y, cz = oz - camPos.z;
      const camDist = Math.sqrt(cx*cx + cy*cy + cz*cz);
      if (camDist < 320 && camDist > 0.5) {
        const t = 1 - camDist/320;
        const pull = t*t * 55;
        dx -= (cx/camDist)*pull;
        dy -= (cy/camDist)*pull;
        dz -= (cz/camDist)*pull;
      }

      // ── Collapse ripples: expanding spherical waves in the lattice
      ripples.forEach(r => {
        const rx = ox - r.pos.x, ry = oy - r.pos.y, rz = oz - r.pos.z;
        const dist = Math.sqrt(rx*rx + ry*ry + rz*rz);
        if (dist < 1) return;

        const waveFront = r.t * 280;       // wave speed
        const σ = 55;                       // wave width
        const envelope = Math.exp(-((dist-waveFront)**2) / (σ*σ));
        const wave = Math.sin((dist - waveFront) * 0.07) * envelope;
        const amp = r.strength * wave * Math.exp(-r.t * 0.4);

        // Push outward (compression wave)
        dx += (rx/dist) * amp;
        dy += (ry/dist) * amp;
        dz += (rz/dist) * amp;
      });

      attr.setXYZ(i, ox+dx, oy+dy, oz+dz);
      if (Math.abs(dx)+Math.abs(dy)+Math.abs(dz) > 0.01) anyChange = true;
    }
    attr.needsUpdate = true;

    // Dynamic brightness: lines nearer to camera glow more
    const mx = (attr.getX(0)+attr.getX(1))*0.5;
    const my = (attr.getY(0)+attr.getY(1))*0.5;
    const mz = (attr.getZ(0)+attr.getZ(1))*0.5;
    const d = camPos.distanceTo(new THREE.Vector3(mx,my,mz));
    // Proximity boost — closest lines almost white-bright
    const prox = Math.max(0, 1 - d/380);
    line.material.opacity = 0.07 + prox * 0.38;
    // Color temperature: cool far, warm-white near
    if (prox > 0.5) {
      line.material.color.setRGB(0.6 + prox*0.4, 0.85 + prox*0.15, 1.0);
    } else {
      line.material.color.set(0x00c8ff);
    }
  });
}

// ─── QUANTUM UPDATE ───────────────────────────────────────────────────────────
function updateQuanta() {
  // Observation: look at superposition cloud → collapse it
  if (started) {
    raycaster.setFromCamera(screenMid, camera);
    const clouds = quanta.map(q => q.cloud);
    const hits = raycaster.intersectObjects(clouds);
    const cursor = document.getElementById('cursor');

    if (hits.length && hits[0].distance < 600) {
      const q = quanta.find(o => o.cloud === hits[0].object);
      if (q && q.state === 0) {
        cursor.classList.add('observing');
        collapse(q);
      } else {
        cursor.classList.remove('observing');
      }
    } else {
      cursor.classList.remove('observing');
    }
  }

  quanta.forEach(q => {
    if (q.state === 1) {
      q.p = Math.min(1, q.p + 0.045);
      if (q.p >= 1) q.state = 2;
    }

    const p = q.p;
    const cloudAttr = q.cloud.geometry.attributes.position;

    if (q.state === 0) {
      // Breathe: superposition cloud oscillates — probability is alive
      for (let i = 0; i < 90; i++) {
        const og = q.ghostOrig;
        const ox = og[i*3], oy = og[i*3+1], oz = og[i*3+2];
        // Different frequency per particle: they don't all move together — this IS the uncertainty
        const phase = clock * 1.6 + i * 0.53;
        const spread = 1 + 0.18*Math.sin(phase) + 0.06*Math.sin(phase*1.7 + i);
        cloudAttr.setXYZ(i,
          q.pos.x + (ox - q.pos.x)*spread,
          q.pos.y + (oy - q.pos.y)*spread,
          q.pos.z + (oz - q.pos.z)*spread
        );
      }
      q.cloud.material.opacity = 0.38 + 0.14*Math.sin(clock*1.4);
    } else {
      // Collapsing: all ghosts rush to the single point
      for (let i = 0; i < 90; i++) {
        const og = q.ghostOrig;
        cloudAttr.setXYZ(i,
          THREE.MathUtils.lerp(og[i*3],   q.pos.x, p * (1 + 0.3*Math.sin(i))),
          THREE.MathUtils.lerp(og[i*3+1], q.pos.y, p * (1 + 0.3*Math.sin(i+1))),
          THREE.MathUtils.lerp(og[i*3+2], q.pos.z, p * (1 + 0.3*Math.sin(i+2)))
        );
      }
      q.cloud.material.opacity = Math.max(0, (1-p)*0.52);
    }
    cloudAttr.needsUpdate = true;

    // Collapsed states — dot and halo emerge
    q.dot.material.opacity = p * (0.75 + 0.25*Math.sin(clock*3));
    q.halo.material.opacity = p * (0.12 + 0.08*Math.sin(clock*2.2));
    q.halo.scale.setScalar(1 + p*0.5 + 0.04*Math.sin(clock*3.5));

    // Entanglement thread: glows when either is collapsed
    if (q.threadMat) {
      const active = q.state > 0 || (q.partner && q.partner.state > 0);
      q.threadMat.opacity = active
        ? 0.028 + 0.04 * Math.sin(clock * 6)
        : 0.028;
    }
  });
}

function collapse(q) {
  if (q.state > 0) return;
  q.state = 1;

  // Shockwave through the lattice from collapse point
  addRipple(q.pos, 85);
  playCollapse(q.isB, false);

  // Entangled partner collapses nonlocally — a second ripple appears
  // at the partner's location after a tiny delay (lightspeed irrelevant here)
  if (q.partner && q.partner.state === 0) {
    const partner = q.partner;
    setTimeout(() => {
      if (partner.state > 0) return;
      partner.state = 1;
      addRipple(partner.pos, 55);
      playCollapse(partner.isB, true);
    }, 350 + Math.random()*200);
  }
}

// ─── AUDIO ───────────────────────────────────────────────────────────────────
function startAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();

  const master = audioCtx.createGain();
  master.gain.value = 0.16;
  master.connect(audioCtx.destination);

  masterFilter = audioCtx.createBiquadFilter();
  masterFilter.type = 'lowpass';
  masterFilter.frequency.value = 900;
  masterFilter.connect(master);

  masterGain = masterFilter;

  // Drone: layered harmonics — the hum of spacetime
  [40, 80, 120, 161, 240].forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = i < 2 ? 'sine' : 'triangle';
    osc.frequency.value = f;
    const g = audioCtx.createGain();
    g.gain.value = [0.35, 0.18, 0.07, 0.04, 0.025][i];
    osc.connect(g);
    g.connect(masterFilter);
    osc.start();
    droneOscs.push(osc);
  });

  // Very slow LFO: the universe breathes
  const lfo = audioCtx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.06;
  const lfoG = audioCtx.createGain();
  lfoG.gain.value = 0.025;
  lfo.connect(lfoG);
  lfoG.connect(master.gain);
  lfo.start();
  setupPoiAudioBeds();
}

function playCollapse(isB, isRemote) {
  if (!audioCtx) return;
  const freq = isB ? 528 : 1047; // F5 vs C6 interval — a perfect fourth
  const dur  = isRemote ? 0.7 : 0.25;
  const vol  = isRemote ? 0.25 : 0.45;

  const env = audioCtx.createGain();
  env.gain.setValueAtTime(0, audioCtx.currentTime);
  env.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.008);
  env.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);

  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq;
  // Slight pitch glide downward — the wave function settling
  osc.frequency.exponentialRampToValueAtTime(freq * 0.92, audioCtx.currentTime + dur);

  const reverb = audioCtx.createConvolver ? createSimpleReverb() : null;
  osc.connect(env);
  env.connect(reverb || audioCtx.destination);
  if (reverb) reverb.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur + 0.05);

  // Snap transient
  const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate*0.04), audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++)
    d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 3);
  const snap = audioCtx.createBufferSource();
  snap.buffer = buf;
  const sg = audioCtx.createGain();
  sg.gain.value = isRemote ? 0.04 : 0.08;
  snap.connect(sg);
  sg.connect(audioCtx.destination);
  snap.start();
}

function createSimpleReverb() {
  const convolver = audioCtx.createConvolver();
  const len = audioCtx.sampleRate * 2;
  const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++)
      d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 1.8);
  }
  convolver.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.value = 0.22;
  convolver.connect(g);
  return g;
}

// ─── INPUT ───────────────────────────────────────────────────────────────────
function onMouseMove(e) {
  if (!started) return;
  pitchYaw.y -= e.movementX * 0.0016;
  pitchYaw.x -= e.movementY * 0.0016;
  pitchYaw.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitchYaw.x));
}

function enter() {
  if (started) return;
  started = true;
  
document.body.classList.add("started");

enterTime = clock;
const el = document.getElementById('enter');
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 1500);
  startAudio();
  // fade in scene after ENTER
  veil.style.opacity = "0";
  const ug = document.getElementById("userGuide");
  if (ug) ug.style.opacity = "1";
  renderer.domElement.requestPointerLock?.();
}


// ─── OPEN WORLD POIs (discoverable life chunks) ─────────────────────────
const poiGroup = new THREE.Group();

const GRID_STEP = 22;                    // lattice snap size for POI geometry
const POI_STREAM_RADIUS = 1100;          // keep POIs within this radius
const POI_SPAWN_RADIUS_MIN = 420;        // don't spawn right on top of player
const POI_TARGET_MAX = 12;               // max active POIs
const POI_WARMUP_SECONDS = 3.5;          // ramp up after ENTER
const POI_SPAWN_COOLDOWN = 0.55;         // seconds between spawns (avoid bursts)

let poiActive = [];
let poiSpawnTimer = 0;
let poiSeed = 1337;

// audio layers per POI type (subtle "horizon")
let cityBed = null, seaBed = null, catBed = null;

function seededRand() {
  // simple LCG
  poiSeed = (poiSeed * 1664525 + 1013904223) >>> 0;
  return poiSeed / 4294967296;
}
function snap(n, step=GRID_STEP){ return Math.round(n/step)*step; }
function snapV(v, step=GRID_STEP){ return new THREE.Vector3(snap(v.x,step), snap(v.y,step), snap(v.z,step)); }

function easeInOut(t){ return t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }
function smoothstep(a,b,x){
  const t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}

function makeBeacon(anchor, matOpacity=0.08){
  const g = new THREE.BufferGeometry();
  const y0 = anchor.y - 240, y1 = anchor.y + 520;
  const arr = new Float32Array([anchor.x, y0, anchor.z, anchor.x, y1, anchor.z]);
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const m = new THREE.LineBasicMaterial({ color: 0x00c8ff, transparent:true, opacity:matOpacity });
  const line = new THREE.Line(g,m);
  line.frustumCulled = false;
  return line;
}

function buildCity(anchor){
  const segs = [];
  const base = snapV(anchor);
  const blocks = 18 + Math.floor(seededRand()*14);
  for(let i=0;i<blocks;i++){
    const ox = snap((seededRand()*2-1)*260);
    const oz = snap((seededRand()*2-1)*260);
    const w  = snap(22 + seededRand()*66);
    const d  = snap(22 + seededRand()*66);
    const h  = snap(88 + seededRand()*420);
    const x0 = base.x + ox - w/2, x1 = base.x + ox + w/2;
    const z0 = base.z + oz - d/2, z1 = base.z + oz + d/2;
    const y0 = base.y - snap(44), y1 = base.y - snap(44) + h;

    // 4 verticals
    segs.push(x0,y0,z0, x0,y1,z0);
    segs.push(x1,y0,z0, x1,y1,z0);
    segs.push(x0,y0,z1, x0,y1,z1);
    segs.push(x1,y0,z1, x1,y1,z1);

    // top rectangle
    segs.push(x0,y1,z0, x1,y1,z0);
    segs.push(x1,y1,z0, x1,y1,z1);
    segs.push(x1,y1,z1, x0,y1,z1);
    segs.push(x0,y1,z1, x0,y1,z0);

    // a few window strokes
    if(seededRand()<0.7){
      const wx = snap(x0 + (seededRand()*0.8+0.1)*(x1-x0));
      const wz = snap(z0 + (seededRand()*0.8+0.1)*(z1-z0));
      const wy0 = snap(y0 + (seededRand()*0.3+0.1)*(y1-y0));
      const wy1 = snap(wy0 + (seededRand()*0.2+0.08)*(y1-y0));
      segs.push(wx,wy0,wz, wx,wy1,wz);
    }
  }
  return new Float32Array(segs);
}

function buildCathedral(anchor){
  // nave with repeating arches + rose window glyph
  const segs = [];
  const base = snapV(anchor);
  const length = 520;
  const step = 52;
  const arches = Math.floor(length/step);
  const span = 210;
  const height = 260;

  const zStart = base.z - length/2;

  for(let i=0;i<=arches;i++){
    const z = snap(zStart + i*step);
    const xL = snap(base.x - span/2);
    const xR = snap(base.x + span/2);
    const y0 = snap(base.y - 44);
    const yT = snap(y0 + height);

    // pillars
    segs.push(xL,y0,z, xL,yT,z);
    segs.push(xR,y0,z, xR,yT,z);

    // arch (polyline approximated with segments)
    const parts = 10;
    for(let k=0;k<parts;k++){
      const t0 = k/parts, t1 = (k+1)/parts;
      const a0 = Math.PI * t0;
      const a1 = Math.PI * t1;
      const px0 = snap(base.x + Math.cos(a0)*span/2);
      const py0 = snap(y0 + Math.sin(a0)*height);
      const px1 = snap(base.x + Math.cos(a1)*span/2);
      const py1 = snap(y0 + Math.sin(a1)*height);
      segs.push(px0,py0,z, px1,py1,z);
    }
  }

  // roof ridge line
  segs.push(base.x, snap(base.y+240), snap(zStart), base.x, snap(base.y+240), snap(zStart+arches*step));

  // rose window at "front"
  const zF = snap(zStart);
  const r = 88;
  const cy = snap(base.y + 150);
  const parts = 14;
  for(let k=0;k<parts;k++){
    const a0 = (k/parts)*Math.PI*2;
    const a1 = ((k+1)/parts)*Math.PI*2;
    segs.push(
      snap(base.x + Math.cos(a0)*r), snap(cy + Math.sin(a0)*r), zF,
      snap(base.x + Math.cos(a1)*r), snap(cy + Math.sin(a1)*r), zF
    );
  }
  // cross spokes
  segs.push(base.x-r, cy, zF, base.x+r, cy, zF);
  segs.push(base.x, cy-r, zF, base.x, cy+r, zF);

  return new Float32Array(segs);
}

function buildSea(anchor){
  // wave field: stacked polylines
  const segs = [];
  const base = snapV(anchor);
  const w = 620, d = 540;
  const lines = 10;
  const parts = 24;
  for(let i=0;i<lines;i++){
    const z = snap(base.z - d/2 + (i/(lines-1))*d);
    for(let k=0;k<parts;k++){
      const x0 = snap(base.x - w/2 + (k/parts)*w);
      const x1 = snap(base.x - w/2 + ((k+1)/parts)*w);
      const y = snap(base.y - 88);
      segs.push(x0,y,z, x1,y,z);
    }
  }
  return new Float32Array(segs);
}

function createPOI(type, anchor){
  const group = new THREE.Group();
  group.position.set(0,0,0);
  group.frustumCulled = false;

  let arr;
  if(type==='city') arr = buildCity(anchor);
  else if(type==='cathedral') arr = buildCathedral(anchor);
  else arr = buildSea(anchor);

  // geometry with dynamic positions for assemble/dissolve
  const geom = new THREE.BufferGeometry();
  const dyn = new Float32Array(arr.length);
  dyn.set(arr);
  geom.setAttribute('position', new THREE.BufferAttribute(dyn,3));
  geom.computeBoundingSphere();

  const mat = new THREE.LineBasicMaterial({
    color: 0x00c8ff,
    transparent:true,
    opacity:0.0,
    linewidth:1
  });
  const lines = new THREE.LineSegments(geom, mat);
  lines.frustumCulled = false;
  group.add(lines);

  const beacon = makeBeacon(snapV(anchor), 0.06);
  group.add(beacon);

  const now = clock;
  const assemble = 2.4 + seededRand()*0.9;
  const live = 7.0 + seededRand()*5.0;
  const dissolve = 2.4 + seededRand()*0.9;

  const poi = {
    type, anchor: snapV(anchor),
    group, lines, beacon,
    baseArr: arr, dynArr: dyn,
    born: now,
    assemble, live, dissolve,
    dead:false,
    lastDist: 99999
  };

  poiGroup.add(group);
  return poi;
}

function pickPOIType(){
  const r = seededRand();
  if(r < 0.42) return 'city';
  if(r < 0.72) return 'cathedral';
  return 'sea';
}

function trySpawnPOI(){
  if(!started) return;
  if(poiActive.length >= POI_TARGET_MAX) return;
  if(poiSpawnTimer > 0) return;

  // warm-up: start small to avoid "everything at once"
  const sinceEnter = clock - enterTime;
  const maxNow = Math.max(1, Math.floor(1 + smoothstep(0, POI_WARMUP_SECONDS, sinceEnter) * (POI_TARGET_MAX-1)));
  if(poiActive.length >= maxNow) return;

  // choose a point in a ring around player, biased forward
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const right = new THREE.Vector3().crossVectors(dir, camera.up).normalize();
  const fwd = dir.clone().multiplyScalar(1.0);

  const r = POI_SPAWN_RADIUS_MIN + seededRand()*(POI_STREAM_RADIUS-POI_SPAWN_RADIUS_MIN);
  const a = (seededRand()*2-1) * 0.9; // forward bias
  const b = (seededRand()*2-1) * 0.9;

  const candidate = playerWorld.clone()
    .addScaledVector(fwd, r*(0.9 + 0.35*a))
    .addScaledVector(right, r*(0.35*b))
    .add(new THREE.Vector3(0, (seededRand()*2-1)*140, 0));

  const anchor = snapV(candidate);

  // avoid clustering
  for(const p of poiActive){
    if(p.anchor.distanceTo(anchor) < 360) return;
  }

  const type = pickPOIType();
  const poi = createPOI(type, anchor);
  poiActive.push(poi);

  // soft one-shot sound cue on assemble (if audio is active)
  if(audioCtx) playPoiSpawn(type);

  poiSpawnTimer = POI_SPAWN_COOLDOWN;
}

function updatePOIs(){
  if(!started) return;

  // decrement spawn timer
  poiSpawnTimer = Math.max(0, poiSpawnTimer - 0.013);

  // keep spawning gradually as you move/explore
  trySpawnPOI();

  // update active POIs
  for(const p of poiActive){
    const age = clock - p.born;
    const total = p.assemble + p.live + p.dissolve;

    // distance + beacon visibility
    const dist = p.anchor.distanceTo(camera.position);
    p.lastDist = dist;

    // lifecycle
    let opacity = 0;
    let morph = 0; // 0 = collapsed to anchor, 1 = fully formed

    if(age < p.assemble){
      const t = easeInOut(age / p.assemble);
      opacity = 0.02 + 0.22*t;
      morph = t;
    } else if(age < p.assemble + p.live){
      opacity = 0.24;
      morph = 1;
    } else if(age < total){
      const t = (age - p.assemble - p.live) / p.dissolve;
      const u = 1 - easeInOut(t);
      opacity = 0.02 + 0.22*u;
      morph = u;
    } else {
      p.dead = true;
      opacity = 0;
      morph = 0;
    }

    // extra fade with distance (keeps world calm)
    const df = 1 - smoothstep(780, POI_STREAM_RADIUS, dist);
    const finalOpacity = opacity * Math.max(0.15, df);

    p.lines.material.opacity = finalOpacity;
    p.beacon.material.opacity = 0.02 + 0.06*df;

    // animate geometry: embed into grid anchor then expand
    const ax = p.anchor.x, ay = p.anchor.y, az = p.anchor.z;
    const jitter = (1-morph) * 12;

    const base = p.baseArr, dyn = p.dynArr;
    for(let i=0;i<base.length;i+=3){
      const bx = base[i], by = base[i+1], bz = base[i+2];
      const jx = (seededRand()*2-1)*jitter;
      const jy = (seededRand()*2-1)*jitter;
      const jz = (seededRand()*2-1)*jitter;
      dyn[i]   = ax + (bx-ax)*morph + jx;
      dyn[i+1] = ay + (by-ay)*morph + jy;
      dyn[i+2] = az + (bz-az)*morph + jz;
    }
    p.lines.geometry.attributes.position.needsUpdate = true;
  }

  // cull dead / far
  poiActive = poiActive.filter(p => {
    const far = p.lastDist > (POI_STREAM_RADIUS + 260);
    if(p.dead || far){
      poiGroup.remove(p.group);
      // dispose
      p.lines.geometry.dispose();
      p.lines.material.dispose();
      p.beacon.geometry.dispose();
      p.beacon.material.dispose();
      return false;
    }
    return true;
  });

  updatePoiAudioBeds();
}

// ─── POI AUDIO ─────────────────────────────────────────
function makeNoiseNode(){
  const bufferSize = 2 * audioCtx.sampleRate;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * 0.35;
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  src.loop = true;
  return src;
}

function setupPoiAudioBeds(){
  if(!audioCtx) return;

  // City: filtered noise hum
  const cityNoise = makeNoiseNode();
  const cityFilt = audioCtx.createBiquadFilter();
  cityFilt.type = 'lowpass';
  cityFilt.frequency.value = 420;
  const cityGain = audioCtx.createGain();
  cityGain.gain.value = 0.0;
  cityNoise.connect(cityFilt); cityFilt.connect(cityGain); cityGain.connect(masterGain);
  cityNoise.start();
  cityBed = { noise: cityNoise, filt: cityFilt, gain: cityGain };

  // Sea: bandpassed noise "wind/waves"
  const seaNoise = makeNoiseNode();
  const seaFilt = audioCtx.createBiquadFilter();
  seaFilt.type = 'bandpass';
  seaFilt.frequency.value = 280;
  seaFilt.Q.value = 0.9;
  const seaGain = audioCtx.createGain();
  seaGain.gain.value = 0.0;
  seaNoise.connect(seaFilt); seaFilt.connect(seaGain); seaGain.connect(masterGain);
  seaNoise.start();
  seaBed = { noise: seaNoise, filt: seaFilt, gain: seaGain };

  // Cathedral: quiet triad-ish tone
  const o1 = audioCtx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 98;
  const o2 = audioCtx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 147;
  const o3 = audioCtx.createOscillator(); o3.type = 'sine'; o3.frequency.value = 196;
  const catGain = audioCtx.createGain(); catGain.gain.value = 0.0;
  o1.connect(catGain); o2.connect(catGain); o3.connect(catGain);
  catGain.connect(masterGain);
  o1.start(); o2.start(); o3.start();
  catBed = { o1,o2,o3,gain: catGain };
}

function updatePoiAudioBeds(){
  if(!audioCtx || !cityBed || !seaBed || !catBed) return;

  let dCity=99999, dSea=99999, dCat=99999;
  for(const p of poiActive){
    if(p.type==='city') dCity = Math.min(dCity, p.lastDist);
    else if(p.type==='sea') dSea = Math.min(dSea, p.lastDist);
    else if(p.type==='cathedral') dCat = Math.min(dCat, p.lastDist);
  }

  const cityAmt = 1 - smoothstep(380, 980, dCity);
  const seaAmt  = 1 - smoothstep(380, 980, dSea);
  const catAmt  = 1 - smoothstep(380, 980, dCat);

  cityBed.gain.gain.setTargetAtTime(0.014*cityAmt, audioCtx.currentTime, 0.6);
  seaBed.gain.gain.setTargetAtTime(0.012*seaAmt, audioCtx.currentTime, 0.6);
  catBed.gain.gain.setTargetAtTime(0.010*catAmt, audioCtx.currentTime, 0.8);

  // subtle motion modulation
  cityBed.filt.frequency.setTargetAtTime(320 + 520*cityAmt, audioCtx.currentTime, 0.8);
  seaBed.filt.frequency.setTargetAtTime(210 + 180*seaAmt, audioCtx.currentTime, 0.8);
}

function playPoiSpawn(type){
  // short, quiet "discovery ping"
  const t0 = audioCtx.currentTime + 0.01;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'triangle';
  const f = type==='city' ? 220 : (type==='cathedral' ? 330 : 196);
  o.frequency.setValueAtTime(f, t0);
  o.frequency.exponentialRampToValueAtTime(f*1.25, t0+0.12);
  g.gain.setValueAtTime(0.0, t0);
  g.gain.linearRampToValueAtTime(0.015, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.28);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0+0.3);
}
// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
let moving = false;
function update() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  clock += dt;

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const right = new THREE.Vector3().crossVectors(dir, camera.up).normalize();
  moving = false;

  // Slower movement, and arrows mirror WASD.
  const spd = 52 * dt;

  if (keys['KeyW'] || keys['ArrowUp'])    { playerWorld.addScaledVector(dir, spd);    moving=true; }
  if (keys['KeyS'] || keys['ArrowDown'])  { playerWorld.addScaledVector(dir, -spd);   moving=true; }
  if (keys['KeyA'] || keys['ArrowLeft'])  { playerWorld.addScaledVector(right, -spd); moving=true; }
  if (keys['KeyD'] || keys['ArrowRight']) { playerWorld.addScaledVector(right, spd);  moving=true; }
  if (keys['Space'])                      { playerWorld.y += spd; moving=true; }
  if (keys['ShiftLeft']||keys['ShiftRight']) { playerWorld.y -= spd; moving=true; }

  if (started) camera.rotation.set(pitchYaw.x, pitchYaw.y, 0, 'YXZ');

  updateFloatingOrigin();

  updateGrid();
  updateQuanta();
  updatePOIs();
  updateGalaxy();

  // Audio responds to movement — slight pitch shift = doppler feeling
  if (audioCtx && droneOscs.length) {
    const factor = moving ? 1.025 : 1.0;
    droneOscs.forEach((o, i) => {
      o.frequency.setTargetAtTime([40,80,120,161,240][i]*factor, audioCtx.currentTime, 0.6);
    });
    masterFilter.frequency.setTargetAtTime(moving ? 1300 : 750, audioCtx.currentTime, 0.4);
  }
}

function animate() {
  requestAnimationFrame(animate);
  update();
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

init();
</script>
