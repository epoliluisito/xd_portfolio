<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lia Room</title>
  <script src="../../vendor/aframe/aframe-1.5.0.min.js"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }

    /* Flash fix: cover the canvas immediately at the CSS level before JS runs */
    a-scene { background: #000; }

    /* Fade-in overlay: starts opaque black, fades out once scene is ready */
    #fadeIn {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 1;
      pointer-events: none;
      transition: opacity 900ms ease;
      z-index: 9999;
    }
    #fadeIn.done { opacity: 0; }

    /* ── Quit button — matches aya.dev exactly ── */
    #quitShell {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 220;
    }
    #quitBtn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.35);
      color: rgba(255,255,255,0.85);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    #quitBtn:hover { border-color: rgba(255,255,255,0.32); color: rgba(255,255,255,0.95); }

    #quitConfirm {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.62);
      z-index: 230;
    }
    #quitConfirm.show { display: flex; }
    #quitCard {
      width: min(420px, calc(100vw - 48px));
      background: rgba(0,0,0,0.78);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 14px;
      padding: 18px;
      color: rgba(255,255,255,0.92);
      box-shadow: 0 22px 70px rgba(0,0,0,0.62);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #quitCard h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    #quitCard p {
      margin: 0 0 14px 0;
      font-size: 13px;
      opacity: 0.85;
      line-height: 1.35;
    }
    #quitActions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .qbtn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.92);
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .qbtn.primary {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.32);
      color: rgba(255,255,255,0.96);
    }
  </style>

  <script>
    // ── Components ────────────────────────────────────────────────────────────

    // Disable fog on specific meshes (earth sphere)
    AFRAME.registerComponent('no-fog', {
      init: function () {
        const apply = (obj) => {
          if (!obj || !obj.traverse) return;
          obj.traverse((n) => {
            if (!n.material) return;
            const mats = Array.isArray(n.material) ? n.material : [n.material];
            mats.forEach((m) => {
              if (m && Object.prototype.hasOwnProperty.call(m, 'fog')) {
                m.fog = false;
                m.needsUpdate = true;
              }
            });
          });
        };
        apply(this.el.object3D);
        this.el.addEventListener('object3dset', () => apply(this.el.object3D));
      }
    });

    // Improved earth texture sampling
    AFRAME.registerComponent('earth-texture-quality', {
      init: function () {
        const apply = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.traverse((n) => {
            if (!n.isMesh || !n.material) return;
            const mats = Array.isArray(n.material) ? n.material : [n.material];
            mats.forEach((m) => {
              if (m.map) {
                m.map.anisotropy = 4;
                m.map.minFilter = THREE.LinearMipmapLinearFilter;
                m.map.magFilter = THREE.LinearFilter;
                m.map.needsUpdate = true;
              }
              m.needsUpdate = true;
            });
          });
        };
        apply();
        this.el.addEventListener('object3dset', apply);
      }
    });

    // Pitch clamp
    AFRAME.registerComponent('pitch-clamp', {
      schema: { min: { type: 'number', default: -80 }, max: { type: 'number', default: 80 } },
      tick: function () {
        const lc = this.el.components && this.el.components['look-controls'];
        if (!lc || !lc.pitchObject) return;
        const minR = this.data.min * Math.PI / 180;
        const maxR = this.data.max * Math.PI / 180;
        const p = lc.pitchObject.rotation.x;
        if (p < minR) lc.pitchObject.rotation.x = minR;
        if (p > maxR) lc.pitchObject.rotation.x = maxR;
      }
    });

    // IBL: scene-level env map driving all PBR metalness/roughness — must match aya.dev
    // aya.dev uses simple-ibl="intensity: 0.35; color: #e4ebf4" on the a-scene
    AFRAME.registerComponent('simple-ibl', {
      schema: { intensity: { type: 'number', default: 1.25 }, color: { type: 'color', default: '#dfe6ef' } },
      init: function () {
        const sceneObj = this.el.sceneEl.object3D;
        const mkCanvas = () => {
          const cv = document.createElement('canvas'); cv.width = cv.height = 2;
          const ctx = cv.getContext('2d');
          const g = ctx.createLinearGradient(0,0,2,2);
          g.addColorStop(0, this.data.color);
          g.addColorStop(1, '#aeb7c3');
          ctx.fillStyle = g; ctx.fillRect(0,0,2,2);
          return cv;
        };
        const cube = new THREE.CubeTexture([mkCanvas(),mkCanvas(),mkCanvas(),mkCanvas(),mkCanvas(),mkCanvas()]);
        cube.needsUpdate = true;
        sceneObj.environment = cube;
        const applyIntensity = () => {
          sceneObj.traverse(o => {
            if (!o || !o.isMesh) return;
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            mats.forEach(m => {
              if (m && m.isMeshStandardMaterial) { m.envMapIntensity = this.data.intensity; m.needsUpdate = true; }
            });
          });
        };
        applyIntensity();
        this.el.sceneEl.addEventListener('object3dset', applyIntensity);
      }
    });
    AFRAME.registerComponent('rig-walk', {
      schema: { speed: { type: 'number', default: 2.6 }, radius: { type: 'number', default: 0.28 } },
      init: function () {
        this.keys = Object.create(null);
        const MOVE = new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight']);
        this._onKeyDown = (e) => { if (MOVE.has(e.code)) e.preventDefault(); this.keys[e.code] = true; };
        this._onKeyUp   = (e) => { if (MOVE.has(e.code)) e.preventDefault(); this.keys[e.code] = false; };
        this._clearKeys = () => { for (const k in this.keys) this.keys[k] = false; };
        window.addEventListener('keydown', this._onKeyDown, { passive: false });
        window.addEventListener('keyup',   this._onKeyUp,   { passive: false });
        window.addEventListener('blur', this._clearKeys);
        document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement) this._clearKeys(); });
      },
      tick: function (t, dt) {
        const w = !!this.keys['KeyW'] || !!this.keys['ArrowUp'];
        const s = !!this.keys['KeyS'] || !!this.keys['ArrowDown'];
        const a = !!this.keys['KeyA'] || !!this.keys['ArrowLeft'];
        const d = !!this.keys['KeyD'] || !!this.keys['ArrowRight'];
        if (!w && !s && !a && !d) return;
        const dtS = Math.min(0.05, dt / 1000);
        const cam = this.el.querySelector('[camera]');
        if (!cam) return;
        const lc = cam.components && cam.components['look-controls'];
        const yaw = lc && lc.yawObject ? lc.yawObject.rotation.y : 0;
        const totalYaw = yaw + (this.el.object3D.rotation.y || 0);
        let mx = 0, mz = 0;
        if (w) { mx -= Math.sin(totalYaw); mz -= Math.cos(totalYaw); }
        if (s) { mx += Math.sin(totalYaw); mz += Math.cos(totalYaw); }
        if (a) { mx -= Math.cos(totalYaw); mz += Math.sin(totalYaw); }
        if (d) { mx += Math.cos(totalYaw); mz -= Math.sin(totalYaw); }
        const len = Math.sqrt(mx*mx + mz*mz);
        if (len > 0) {
          this.el.object3D.position.x += (mx / len) * this.data.speed * dtS;
          this.el.object3D.position.z += (mz / len) * this.data.speed * dtS;
        }
      },
      remove: function () {
        window.removeEventListener('keydown', this._onKeyDown);
        window.removeEventListener('keyup',   this._onKeyUp);
      }
    });
  </script>
</head>
<body>

<!-- Flash fix: black overlay present before any paint -->
<div id="fadeIn"></div>

<!-- Quit button — matches aya.dev position (bottom-left) and style -->
<div id="quitShell">
  <button id="quitBtn" type="button">QUIT</button>
</div>
<div aria-hidden="true" id="quitConfirm">
  <div aria-label="Quit experience" aria-modal="true" id="quitCard" role="dialog">
    <h3>Quit experience</h3>
    <p>You're about to leave the 3D experience.</p>
    <div id="quitActions">
      <button class="qbtn" id="quitCancel" type="button">Cancel</button>
      <button class="qbtn primary" id="quitConfirmBtn" type="button">Quit</button>
    </div>
  </div>
</div>

<a-scene
  simple-ibl="intensity: 0.35; color: #e4ebf4"
  renderer="antialias: true; colorManagement: true; physicallyCorrectLights: false; powerPreference: high-performance"
  fog="type: none"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
  tabindex="0">

  <a-assets timeout="30000">
    <img id="earthTex"        crossorigin="anonymous" src="./assets/earth_skin.jpg">
    <img id="moonDiffuse"     crossorigin="anonymous" src="./assets/cave_wall/moon_diffuse.webp">
    <img id="moonNormal"      crossorigin="anonymous" src="./assets/cave_wall/moon_normal.webp">
    <img id="moonRough"       crossorigin="anonymous" src="./assets/cave_wall/moon_rough.png">
    <img id="moonAO"          crossorigin="anonymous" src="./assets/cave_wall/moon_ao.png">
    <img id="groundDiffuse"   crossorigin="anonymous" src="./assets/moon_ground/moon_ground_diffuse%20.webp">
    <img id="groundNormal"    crossorigin="anonymous" src="./assets/moon_ground/moon_ground_normal.webp">
    <img id="groundRough"     crossorigin="anonymous" src="./assets/moon_ground/moon_ground_rough.png">
    <img id="groundAO"        crossorigin="anonymous" src="./assets/moon_ground/moon_ground_ao.png">
    <img id="elevMetalColor"  crossorigin="anonymous" src="./assets/metal_elevator_door/metal_elevator_color.webp">
    <img id="elevMetalNormal" crossorigin="anonymous" src="./assets/metal_elevator_door/metal_elevator_normal.webp">
    <img id="elevMetalRough"  crossorigin="anonymous" src="./assets/metal_elevator_door/metal_elevator_rough.png">
    <img id="elevMetalMetal"  crossorigin="anonymous" src="./assets/metal_elevator_door/metal_elevator_Metalness.png">
  </a-assets>

  <!-- ── Sky ──────────────────────────────────────────────────────── -->
  <a-sky color="#020202"></a-sky>

  <!-- ── Lighting — exact match to aya.dev above-ground state ─────── -->

  <!-- Ambient: matches aya.dev global ambient (very subtle, just breaks pure black) -->
  <a-entity light="type: ambient; color: #0b1220; intensity: 0.012"></a-entity>

  <!-- Directional moonlight from earth direction — same values as lia_lunar_light in aya.dev -->
  <a-entity id="lia_earthshine_target" position="0 0 0"></a-entity>
  <a-entity id="lia_lunar_light"
            position="0 35 -220"
            light="type: directional; color: #d9f1ff; intensity: 1.35; castShadow: false; target: #lia_earthshine_target">
  </a-entity>

  <!-- Hemisphere sky fill — same values as lia_lunar_skyfill in aya.dev -->
  <a-entity id="lia_lunar_skyfill"
            position="0 18 0"
            light="type: hemisphere; color: #d9f1ff; groundColor: #0b0b0b; intensity: 0.34">
  </a-entity>

  <!-- ── Earth — same position/material as aya.dev lia_earth ─────── -->
  <a-sphere id="lia_earth"
            radius="11"
            segments-width="256"
            segments-height="256"
            position="0 35 -220"
            rotation="0 180 0"
            material="shader: flat; src: #earthTex; transparent: true; opacity: 0.75"
            earth-texture-quality
            no-fog></a-sphere>

  <!-- ── Lunar ground ─────────────────────────────────────────────── -->
  <a-ring id="lia_lunar_ground"
          radius-inner="1.555"
          radius-outer="60"
          rotation="-90 0 0"
          position="0 0.07 0"
          segments-theta="128"
          material="shader: standard; color: #ffffff; src: #groundDiffuse; normalMap: #groundNormal; aoMap: #groundAO; roughnessMap: #groundRough; metalness: 0; roughness: 1; repeat: 14 14; normalScale: 1 1; side: front"
          shadow="cast:false; receive:true"></a-ring>

  <!-- ── Platform ─────────────────────────────────────────────────── -->
  <a-cylinder id="endchamber_platform"
              radius="1.55"
              height="0.14"
              position="0 0 0"
              material="shader: standard; src: #elevMetalColor; normalMap: #elevMetalNormal; roughnessMap: #elevMetalRough; metalnessMap: #elevMetalMetal; metalness: 1; roughness: 1; normalScale: 0.8 0.8; polygonOffset: true"
              shadow="cast:false; receive:true">

    <a-ring id="endchamber_handrail_top"
            radius-inner="1.42" radius-outer="1.52"
            segments-theta="256"
            position="0 0.58 0"
            rotation="-90 0 0"
            material="shader: standard; color: #cfcfcf; roughness: 0.5; metalness: 0.6"
            theta-start="25" theta-length="310"></a-ring>

    <a-entity id="endchamber_panel"
              position="0 0.44 1.41"
              rotation="0 180 0">
      <a-box id="endchamber_panel_plate"
             width="0.20" height="0.38" depth="0.03"
             material="shader: standard; src: #elevMetalColor; normalMap: #elevMetalNormal; roughnessMap: #elevMetalRough; metalnessMap: #elevMetalMetal; metalness: 1; roughness: 1; normalScale: 0.7 0.7; polygonOffset: true; polygonOffsetFactor: -2; polygonOffsetUnits: -2"></a-box>
      <a-cylinder id="endchamber_panel_button"
                  radius="0.032" height="0.02"
                  position="0 0.02 0.013" rotation="90 0 0"
                  material="shader: standard; color: #cfcfcf; roughness: 0.4; metalness: 0.6; emissive: #ffffff; emissiveIntensity: 0.0"></a-cylinder>
      <a-sphere id="endchamber_panel_light"
                radius="0.012" position="0 0.092 0.013"
                material="shader: standard; color: #0a0a0a; emissive: #d9f1ff; emissiveIntensity: 0.0; roughness: 0.9; metalness: 0.0"></a-sphere>
    </a-entity>
  </a-cylinder>

  <!-- Seam trim ring -->
  <a-entity id="lia_seam_trim" position="0 0.0715 0">
    <a-ring id="lia_seam_flange"
            radius-inner="1.555" radius-outer="1.62"
            segments-theta="128"
            rotation="-90 0 0"
            material="shader: standard; src: #elevMetalColor; normalMap: #elevMetalNormal; roughnessMap: #elevMetalRough; metalnessMap: #elevMetalMetal; metalness: 1; roughness: 1; normalScale: 0.8 0.8; side: double; polygonOffset: true; polygonOffsetFactor: -2; polygonOffsetUnits: -4"
            shadow="cast:false; receive:true"></a-ring>
  </a-entity>

  <!-- Shaft collar (visible when looking down into hole) -->
  <a-cylinder id="lia_shaft_collar"
              radius="1.60"
              height="1.50"
              open-ended="true"
              segments-radial="64"
              position="0 -0.68 0"
              material="shader: standard; color: #cfcfcf; src: #moonDiffuse; normalMap: #moonNormal; roughnessMap: #moonRough; aoMap: #moonAO; metalness: 0; roughness: 1; envMapIntensity: 0; repeat: 8 6; normalScale: 1.25 1.25; side: double"
              shadow="cast:false; receive:true"></a-cylinder>

  <!-- Black cap so shaft doesn't show void -->
  <a-circle id="lia_shaft_cap"
            radius="1.60"
            rotation="-90 0 0"
            position="0 -1.43 0"
            material="shader: flat; color: #000000; side: front"></a-circle>


  <!-- ── TEST: Concrete PBR wall (2m x 5m x 0.3m) placed behind user (10m) ── -->
  <a-box id="test_concrete_wall"
         position="0 2.5 -30"
         width="2"
         height="5"
         depth="0.3"
         material="shader: standard; color: #000000; src: assets/concrete_wall/concrete_basecolor.webp; normalMap: assets/concrete_wall/concrete_normal.webp; roughnessMap: assets/concrete_wall/concrete_roughness.webp; metalness: 0; roughness: 1; normalScale: 1 1"
         shadow="cast:false; receive:true"></a-box>

  <!-- ── Player rig ────────────────────────────────────────────────── -->
  <!-- Spawns on platform top facing -Z (toward earth/away from labyrinth) -->
  <a-entity id="rig"
            position="0 0.07 0"
            rotation="0 180 0"
            rig-walk="speed: 2.6; radius: 0.28">
    <a-entity id="playerCam"
              camera="fov: 60; near: 0.1; far: 500; zoom: 1.08"
              look-controls="pointerLockEnabled: true"
              pitch-clamp="min: -80; max: 80"
              position="0 1.6 0"
              rotation="0 0 0">
      <a-entity cursor="rayOrigin: mouse"></a-entity>
    </a-entity>
  </a-entity>

</a-scene>

<script>
// ── Fade in from black ────────────────────────────────────────────────────────
// Flash fix: overlay is already covering everything via CSS (opacity:1 in <style>).
// We wait for the scene `loaded` event so the first rendered frame is the real scene.
(function () {
  const overlay = document.getElementById('fadeIn');
  if (!overlay) return;

  const fade = () => {
    // Two rAF passes ensure at least one real frame has been drawn before fading
    requestAnimationFrame(() => requestAnimationFrame(() => {
      overlay.classList.add('done');
      setTimeout(() => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 1100);
    }));
  };

  const scene = document.querySelector('a-scene');
  if (scene) {
    if (scene.hasLoaded) fade();
    else scene.addEventListener('loaded', fade, { once: true });
  } else {
    window.addEventListener('load', fade, { once: true });
  }
})();

// ── Quit UI — matches aya.dev ─────────────────────────────────────────────────
(function () {
  const QUIT    = document.getElementById('quitBtn');
  const QC      = document.getElementById('quitConfirm');
  const Q_CANCEL= document.getElementById('quitCancel');
  const Q_OK    = document.getElementById('quitConfirmBtn');

  function openQuitConfirm()  { if (!QC) return; QC.classList.add('show');    QC.setAttribute('aria-hidden','false'); }
  function closeQuitConfirm() { if (!QC) return; QC.classList.remove('show'); QC.setAttribute('aria-hidden','true');  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && QC && QC.classList.contains('show')) closeQuitConfirm();
  }, { passive: true });

  if (QUIT)     QUIT.addEventListener('click', openQuitConfirm);
  if (Q_CANCEL) Q_CANCEL.addEventListener('click', closeQuitConfirm);
  if (QC)       QC.addEventListener('click', (e) => { if (e.target === QC) closeQuitConfirm(); });
  if (Q_OK)     Q_OK.addEventListener('click', () => { window.location.href = 'https://www.enricopoli.com/pagex'; });
})();
</script>

</body>
</html>
