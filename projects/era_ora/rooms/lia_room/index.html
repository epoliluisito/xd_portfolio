<script>

// Disable Three.js fog for a specific entity (and its children).
AFRAME.registerComponent('no-fog', {
  init() {
    const apply = (obj) => {
      if (!obj || !obj.traverse) return;
      obj.traverse((n) => {
        if (!n.material) return;
        const mats = Array.isArray(n.material) ? n.material : [n.material];
        mats.forEach((m) => {
          if (m && Object.prototype.hasOwnProperty.call(m, 'fog')) {
            m.fog = false;
            m.needsUpdate = true;
          }
        });
      });
    };

    apply(this.el.object3D);
    this.el.addEventListener('object3dset', () => apply(this.el.object3D));
  }
});


// Improve Earth texture sampling only on the Earth mesh (anisotropy + filtering).

// Autoplay the first animation clip embedded in a glTF/GLB (e.g., seated Mixamo exports).
AFRAME.registerComponent('autoplay-gltf-anim', {
  init: function () {
    this.mixer = null;
    this.action = null;

    this.el.addEventListener('model-loaded', (e) => {
      const model = e.detail && e.detail.model;
      const clips = (model && model.animations) ? model.animations : [];
      if (!clips || !clips.length) return;

      this.mixer = new THREE.AnimationMixer(model);
      this.action = this.mixer.clipAction(clips[0]);
      this.action.setLoop(THREE.LoopRepeat);
      this.action.play();
    });
  },

  tick: function (time, timeDelta) {
    if (!this.mixer) return;
    this.mixer.update(timeDelta / 1000);
  }
});

// Mixamo / NPC material matte fix (ported from index.html).
AFRAME.registerComponent('mixamo-mat-fix', {
  schema: {
    desat: { type: 'number', default: 0.18 },   // 0..1
    darken: { type: 'number', default: 0.06 },  // 0..1
    matte: { type: 'number', default: 1.0 }     // 0..1 (higher = less specular)
  },
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const obj = this.el.getObject3D('mesh');
      

// Snap NPC meshes so their lowest point sits on the entity's local Y=0 (helps Mixamo-origin models stand on floors)
AFRAME.registerComponent('npc-ground', {
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const obj = this.el.getObject3D('mesh');
      if (!obj || !THREE || !THREE.Box3) return;
      const box = new THREE.Box3().setFromObject(obj);
      if (!isFinite(box.min.y)) return;
      obj.position.y -= box.min.y;
    });
  }
});
if (!obj) return;

      obj.traverse((o) => {
        if (!o.isMesh || !o.material) return;

        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach((m) => {
          if (!m) return;

          // Always render front faces for character meshes (helps with "inside head" artifacts).
          m.side = THREE.FrontSide;

          // Prefer alphaTest cutouts over blending (hair cards / lashes).
          const name = (m.name || '').toLowerCase();
          const hasAlphaMap = !!m.alphaMap;
          const isCutout = hasAlphaMap || name.includes('hair') || name.includes('lash') || name.includes('brow');
          if (isCutout) {
            m.transparent = false;
            m.alphaTest = Math.max(0.35, m.alphaTest || 0.0);
            m.depthWrite = true;
            m.opacity = 1.0;
          } else {
            m.transparent = false;
            m.opacity = 1.0;
            m.alphaTest = 0.0;
            m.depthWrite = true;
          }

          // --- Kill "plastic" look -------------------------------------------------
          const matte = Math.min(1, Math.max(0, this.data.matte));

          // Standard/Physical materials
          if ('roughness' in m) m.roughness = 1.0;                // fully rough
          if ('metalness' in m) m.metalness = 0.0;                // no metal
          if ('envMapIntensity' in m) m.envMapIntensity = 0.0;     // no reflections

          // Remove glossy maps that can re-introduce shine even when roughness is high.
          if (m.roughnessMap) m.roughnessMap = null;
          if (m.metalnessMap) m.metalnessMap = null;
          if (m.specularMap) m.specularMap = null;
          if (m.glossinessMap) m.glossinessMap = null;
          if (m.envMap) m.envMap = null;
          // Tone down normal micro-facets a bit (helps 'plasticky' cloth close-up).
          if (m.normalScale && m.normalScale.set) {
            const nsx = (m.normalScale.x != null) ? m.normalScale.x : 1;
            const nsy = (m.normalScale.y != null) ? m.normalScale.y : 1;
            m.normalScale.set(nsx * 0.35, nsy * 0.35);
          }

          // Physical extras
          if ('clearcoat' in m) m.clearcoat = 0.0;
          if ('clearcoatRoughness' in m) m.clearcoatRoughness = 1.0;
          if ('sheen' in m) m.sheen = 0.0;
          if ('sheenRoughness' in m) m.sheenRoughness = 1.0;
          if ('transmission' in m) m.transmission = 0.0;
          if ('ior' in m) m.ior = 1.0;
          if ('iridescence' in m) m.iridescence = 0.0;
          if ('specularIntensity' in m) m.specularIntensity = 0.0;

          // Phong/Lambert legacy
          if ('shininess' in m) m.shininess = Math.min(m.shininess || 0, 2);
          if (m.specular && m.specular.setRGB) m.specular.setRGB(0.02, 0.02, 0.02);
          if ('reflectivity' in m) m.reflectivity = 0.0;

          // Slight desaturation/darken of material tint (helps even when textures dominate).
          if (m.color) {
            const c = m.color.clone();
            const hsl = {};
            c.getHSL(hsl);
            hsl.s = Math.max(0.0, hsl.s * (1.0 - this.data.desat));
            hsl.l = Math.max(0.0, hsl.l * (1.0 - this.data.darken));
            m.color.setHSL(hsl.h, hsl.s, hsl.l);
          }

          if (m.emissive) m.emissive.multiplyScalar(0.35);

          // Extra safety: ensure "matte" intent wins even if the loader sets odd values.
          if ('roughness' in m) m.roughness = Math.max(m.roughness || 0, 0.9);
          if ('metalness' in m) m.metalness = Math.min(m.metalness || 0, 0.05);
          if ('envMapIntensity' in m) m.envMapIntensity = 0.0;

          // Optional scalar hook (kept for parity; currently matte=1 means max flattening).
          void(matte);

          m.needsUpdate = true;
        });

      });
    });
  }
});

// Automatically apply mixamo-mat-fix to all NPCs now and later (future-proof).
AFRAME.registerComponent('npc-matte-auto', {
  schema: {
    selector: { type: 'string', default: '.npc[gltf-model]' },
    params: { type: 'string', default: 'desat: 0.18; darken: 0.06; matte: 1.0' }
  },
  init: function () {
    const applyOne = (el) => {
      if (!el || !el.setAttribute) return;
      if (el.hasAttribute('mixamo-mat-fix')) return;
      el.setAttribute('mixamo-mat-fix', this.data.params);
    };

    const scan = () => {
      try {
        this.el.querySelectorAll(this.data.selector).forEach(applyOne);
      } catch (e) {}
    };

    // Run once scene is ready.
    if (this.el.hasLoaded) scan();
    else this.el.addEventListener('loaded', scan);

    // Watch for NPCs added later.
    const obs = new MutationObserver((mutations) => {
      for (const mu of mutations) {
        for (const node of mu.addedNodes || []) {
          if (!node || node.nodeType !== 1) continue;
          const el = node;
          try {
            if (el.matches && el.matches(this.data.selector)) applyOne(el);
            if (el.querySelectorAll) el.querySelectorAll(this.data.selector).forEach(applyOne);
          } catch (e) {}
        }
      }
    });
    obs.observe(this.el, { childList: true, subtree: true });
    this._npcMatObs = obs;
  },
  remove: function () {
    if (this._npcMatObs) {
      try { this._npcMatObs.disconnect(); } catch (e) {}
      this._npcMatObs = null;
    }
  }
});



AFRAME.registerComponent('earth-texture-quality', {
  init: function () {
    const el = this.el;

    const applyToMesh = (root) => {
      if (!root) return;

      const renderer = el.sceneEl && el.sceneEl.renderer;
      const maxAniso = (renderer && renderer.capabilities && renderer.capabilities.getMaxAnisotropy)
        ? renderer.capabilities.getMaxAnisotropy()
        : 1;

      root.traverse((obj) => {
        const mat = obj.material;
        if (!mat) return;

        const map = mat.map;
        if (map) {
          try {
            map.anisotropy = Math.max(1, maxAniso);
            map.minFilter = THREE.LinearMipmapLinearFilter;
            map.magFilter = THREE.LinearFilter;
            map.generateMipmaps = true;
            map.needsUpdate = true;
          } catch (e) {}
        }

        mat.needsUpdate = true;
      });
    };

    const run = () => applyToMesh(el.getObject3D('mesh'));

    // Mesh may arrive after init.
    el.addEventListener('object3dset', run);

    // Also run once when scene is ready.
    if (el.sceneEl && el.sceneEl.hasLoaded) {
      setTimeout(run, 0);
    } else if (el.sceneEl) {
      el.sceneEl.addEventListener('loaded', () => setTimeout(run, 0));
    }
  }
});



// Earth 'earthrise' shader: unlit texture + subtle terminator + feathered horizon occlusion mask (bottom cut).
// Keeps Earth readable in a dark scene without relying on scene lights.
AFRAME.registerShader('earth-phase', {
  schema: {
    src:      { type: 'map',    is: 'uniform' },
    fade:     { type: 'number', is: 'uniform', default: 0.82 },   // overall desaturation/brightness lift down
    dark:     { type: 'number', is: 'uniform', default: 0.28 },   // dark-side multiplier
    feather:  { type: 'number', is: 'uniform', default: 0.16 },   // width of the soft edge
    noise:    { type: 'number', is: 'uniform', default: 0.09 },   // edge irregularity
    opacity:  { type: 'number', is: 'uniform', default: 0.88 },   // global alpha

    // Phase direction in view-space-ish (uses normalMatrix*normal). Adjust to rotate the terminator.
    phaseX:   { type: 'number', is: 'uniform', default: -0.12 },
    phaseY:   { type: 'number', is: 'uniform', default:  0.28 },
    phaseZ:   { type: 'number', is: 'uniform', default:  0.95 }
  },

  vertexShader: `
    varying vec2 vUV;
    varying vec3 vN;
    void main() {
      vUV = uv;
      vN  = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,

  fragmentShader: `
    uniform sampler2D src;
    uniform float fade;
    uniform float dark;
    uniform float feather;
    uniform float noise;
    uniform float opacity;
    uniform float phaseX;
    uniform float phaseY;
    uniform float phaseZ;

    varying vec2 vUV;
    varying vec3 vN;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }
    float n2(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
    }

    void main() {
      vec4 tex = texture2D(src, vUV);

      // --- Day/Night shading (subtle), unlit base ---
      vec3 dir = normalize(vec3(phaseX, phaseY, phaseZ));
      float dp = dot(normalize(vN), dir);

      // Add mild irregularity to the terminator (kept subtle; not the "horizon" cut).
      float termNoise = (n2(vUV * 140.0) - 0.5) * (noise * 0.35);
      dp += termNoise;

      float term = smoothstep(-0.20, 0.45, dp);
      float shade = mix(dark, 1.0, term);

      // --- Horizon occlusion mask (Earthrise): UV-space matte ---
// Keeps the cut shape stable regardless of camera viewpoint.
// vUV.y: 0.0 bottom, 1.0 top. We keep only the part above a curved threshold.
// "Smile" curve: threshold is lower at the center and higher toward the edges.

float xU = vUV.x - 0.5;
float arcU = (xU * xU) / 0.25;         // 0 at center, 1 at edges
float baseCutU = 0.34;                 // overall amount of occlusion (higher = less visible Earth)
float arcAmpU  = 0.22;                 // curvature strength ("smile")
float cutU = baseCutU + arcAmpU * arcU;

// Feather in UV units (~10px-ish feel on the disk; scaled from the shader param).
float featherU = max(0.001, feather * 0.06);

// alphaH = 0 below horizon, 1 above horizon, with feathered transition.
float alphaH = smoothstep(cutU - featherU, cutU + featherU, vUV.y);

      vec3 col = tex.rgb * shade * fade;

      // Final alpha: true occlusion by the lunar horizon.
      float a = tex.a * opacity * alphaH;

      gl_FragColor = vec4(col, a);
}
  `
});

/* Boost Earth texture brightness (works even for embedded/base64 textures). */
</script>

<script>
/* -------------------------------------------------------------------------
   Preload guard
   If aya.dev.html is loaded as ?preload=1 inside index.html's hidden iframe:
   - keep all media muted/paused (no audio leakage)
   - expose a flag used later to pause rendering after warmup
--------------------------------------------------------------------------- */
(function () {
  try {
    const isPreload = (new URLSearchParams(window.location.search)).get('preload') === '1';
    window.__AYA_PRELOAD_MODE = !!isPreload;
    if (!isPreload) return;

    const silence = () => {
      document.querySelectorAll('audio,video').forEach((m) => {
        try { m.muted = true; m.volume = 0.0; m.pause(); } catch (e) {}
      });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', silence, { once: true });
    } else {
      silence();
    }

    // Defensive: if anything tries to play, immediately stop it.
    document.addEventListener('play', (e) => {
      const t = e.target;
      if (!t) return;
      if (t.tagName === 'AUDIO' || t.tagName === 'VIDEO') {
        try { t.muted = true; t.volume = 0.0; t.pause(); } catch (err) {}
      }
    }, true);
  } catch (e) {}
})();
</script>
<!-- === SOUL ORB (sphere_dome) — animated milky volumetric shader (GLSL1, Three.js/A-Frame compatible) === -->
<script>
  (function () {
    if (!window.AFRAME) return;

    // Simple value noise / fbm helpers (fast enough for a single orb).
    // GLSL 1.0 compatible (no #version 300 es).
    AFRAME.registerShader('soulorb', {
      schema: {
        time:    {type: 'time', is: 'uniform'},
        seed:    {type: 'number', is: 'uniform', default: Math.random() * 1000.0},
        opacity: {type: 'number', is: 'uniform', default: 0.92},
        scale:   {type: 'number', is: 'uniform', default: 1.55},
        swirl:   {type: 'number', is: 'uniform', default: 0.85}
      },

      vertexShader: [
        'varying vec3 vPos;',
        'varying vec3 vN;',
        'varying vec2 vUv;',
        'void main(){',
        '  vUv = uv;',
        '  vN = normalize(normalMatrix * normal);',
        '  vec4 wp = modelMatrix * vec4(position, 1.0);',
        '  vPos = wp.xyz;',
        '  gl_Position = projectionMatrix * viewMatrix * wp;',
        '}'
      ].join('\n'),

      fragmentShader: [
        'precision highp float;',
        'uniform float time;',
        'uniform float seed;',
        'uniform float opacity;',
        'uniform float scale;',
        'uniform float swirl;',
        'varying vec3 vPos;',
        'varying vec3 vN;',
        'varying vec2 vUv;',

        'float hash(vec3 p){',
        '  p = fract(p * 0.3183099 + vec3(0.1,0.2,0.3));',
        '  p *= 17.0;',
        '  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));',
        '}',

        'float noise(vec3 p){',
        '  vec3 i = floor(p);',
        '  vec3 f = fract(p);',
        '  f = f*f*(3.0-2.0*f);',
        '  float n000 = hash(i + vec3(0.0,0.0,0.0));',
        '  float n100 = hash(i + vec3(1.0,0.0,0.0));',
        '  float n010 = hash(i + vec3(0.0,1.0,0.0));',
        '  float n110 = hash(i + vec3(1.0,1.0,0.0));',
        '  float n001 = hash(i + vec3(0.0,0.0,1.0));',
        '  float n101 = hash(i + vec3(1.0,0.0,1.0));',
        '  float n011 = hash(i + vec3(0.0,1.0,1.0));',
        '  float n111 = hash(i + vec3(1.0,1.0,1.0));',
        '  float nx00 = mix(n000, n100, f.x);',
        '  float nx10 = mix(n010, n110, f.x);',
        '  float nx01 = mix(n001, n101, f.x);',
        '  float nx11 = mix(n011, n111, f.x);',
        '  float nxy0 = mix(nx00, nx10, f.y);',
        '  float nxy1 = mix(nx01, nx11, f.y);',
        '  return mix(nxy0, nxy1, f.z);',
        '}',

        'float fbm(vec3 p){',
        '  float a = 0.5;',
        '  float f = 0.0;',
        '  for(int k=0;k<5;k++){',
        '    f += a * noise(p);',
        '    p *= 2.02;',
        '    a *= 0.5;',
        '  }',
        '  return f;',
        '}',

        'void main(){',
        '  // View direction (world).',
        '  vec3 V = normalize(cameraPosition - vPos);',
        '  float fres = pow(1.0 - max(dot(normalize(vN), V), 0.0), 2.4);',

        '  // Swirly domain warp in world space (keeps it "in the room", not UV-locked).',
        '  float t = time * 0.00022;',
        '  vec3 p = vPos * scale;',
        '  p += vec3(seed * 0.07, seed * 0.11, seed * 0.13);',

        '    fbm(p + vec3(t*2.2, 0.0, 0.0)),',
        '    fbm(p + vec3(0.0, t*1.7, 0.0))',
        '  );',
        '  p += (w - 0.5) * (1.35 * swirl);',

        '  // Milky volume impression: layered density + soft internal glow.',
        '  float d1 = fbm(p * 0.55 + vec3(0.0, t*2.5, 0.0));',
        '  float d2 = fbm(p * 1.10 + vec3(t*1.4, 0.0, t*1.9));',
        '  float d3 = fbm(p * 2.25 + vec3(0.0, t*3.2, t*0.8));',
        '  float density = (d1*0.55 + d2*0.35 + d3*0.20);',

        '  // Center softness: make core milky, edges slightly brighter.',
        '  float core = smoothstep(0.15, 0.85, density);',
        '  float rim = smoothstep(0.35, 0.95, density) * fres;',

<script>
(function(){
  if (!window.AFRAME || !window.THREE) return;

  // Sphere-dome-only: make the dome interior react properly and add animated caustic-like emissive bands.
  AFRAME.registerComponent('sphere-dome-caustics', {
    schema: {
      orb: {type: 'selector'},
      strength: {type: 'number', default: 0.45},
      scale: {type: 'number', default: 0.22},
      speed: {type: 'number', default: 0.12},
      maxDistance: {type: 'number', default: 14.0}
    },
    init: function () {
      this._mesh = null;
      this._compiled = false;
      this._shader = null;
      this._orbPos = new THREE.Vector3();
      this._domeParams = null;
      this._ensureMesh();
    },
    _ensureMesh: function () {
      const el = this.el;
      const tryGet = () => {
        const mesh = el.getObject3D('mesh');
        if (!mesh) { setTimeout(tryGet, 50); return; }
        this._mesh = mesh;
        this._apply();
      };
      tryGet();
    },
    _apply: function () {
      if (!this._mesh || this._compiled) return;

      const mesh = this._mesh;
      const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
      const cloned = mats.map(m => (m && m.isMaterial) ? m.clone() : m);

      // IMPORTANT: keep OUTER as normal front-facing; make INNER visible from inside; wall double.
      if (cloned[0] && cloned[0].isMaterial) cloned[0].side = THREE.FrontSide;
      if (cloned[1] && cloned[1].isMaterial) cloned[1].side = THREE.DoubleSide;
      if (cloned[2] && cloned[2].isMaterial) cloned[2].side = THREE.DoubleSide;

      // Ensure shell is a solid depth occluder (prevents "seeing the shell through the tunnel").
      for (let i = 0; i < cloned.length; i++) {
        const m = cloned[i];
        if (!m || !m.isMaterial) continue;
        m.transparent = false;
        m.opacity = 1.0;
        m.depthWrite = true;
        m.depthTest = true;
      }

      // Inject caustics only on the INNER material (fallback to first).
      const targetIndex = (cloned[1] && cloned[1].isMaterial) ? 1 : 0;
      const mat = cloned[targetIndex];

      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = { value: 0.0 };
        shader.uniforms.uOrbPos = { value: new THREE.Vector3(0,0,0) };
        shader.uniforms.uStrength = { value: this.data.strength };
        shader.uniforms.uScale = { value: this.data.scale };
        shader.uniforms.uSpeed = { value: this.data.speed };
        shader.uniforms.uMaxD = { value: this.data.maxDistance };
        shader.uniforms.uInside = { value: 0.0 };

        // world position varying
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vWorldPos;')
          .replace('#include <begin_vertex>',
                   '#include <begin_vertex>\nvec4 worldPosition = modelMatrix * vec4(position, 1.0);\nvWorldPos = worldPosition.xyz;');

        const inject = `
uniform float uTime;
uniform vec3  uOrbPos;
uniform float uStrength;
uniform float uScale;
uniform float uSpeed;
uniform float uMaxD;
uniform float uInside;
varying vec3 vWorldPos;

float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float noise2(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  vec2 u = f*f*(3.0-2.0*f);
  return mix(a, b, u.x) + (c - a)*u.y*(1.0 - u.x) + (d - b)*u.x*u.y;
}
float fbm(vec2 p){
  float v = 0.0;
  float a = 0.55;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for(int i=0;i<4;i++){
    v += a * noise2(p);
    p = m * p;
    a *= 0.55;
  }
  return v;
}
float causticField(vec2 p){
  float t = uTime * uSpeed;
  vec2 q = p + vec2(t*0.55, t*0.37);
  float w = fbm(q*1.2);
  q += 0.65 * vec2(cos(6.2831*w + t), sin(6.2831*w - t));
  float f = fbm(q*2.6);
  f = 1.0 - abs(2.0*f - 1.0);
  f = pow(max(f, 0.0), 3.2);
  float g = sin((p.x + p.y)*2.2 + t*1.1) * 0.5 + 0.5;
  g = pow(g, 2.5);
  return clamp(f * (0.65 + 0.55*g), 0.0, 1.0);
}
`;

        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\n' + inject)
          .replace('vec3 totalEmissiveRadiance = emissive;',
`vec3 totalEmissiveRadiance = emissive;
  // Caustics projected onto the dome interior (world xz relative to orb).
  float d = distance(vWorldPos, uOrbPos);
  float atten = smoothstep(uMaxD, 2.0, d);
  vec2 p = (vWorldPos.xz - uOrbPos.xz) * uScale;

  float c = causticField(p);

  vec3 warm = vec3(1.00, 0.92, 0.86);
  vec3 cool = vec3(0.30, 0.55, 1.00);
  float fringe = fbm(p*3.6 + uTime*0.03);
  vec3 caustCol = mix(warm, cool, fringe*0.35);

  totalEmissiveRadiance += caustCol * c * atten * uStrength * uInside;`
          );

        this._shader = shader;
      };

      mat.needsUpdate = true;
      mesh.material = cloned;
      this._materials = cloned;
      this._compiled = true;
    },
    tick: function (t) {
      if (!this._compiled) return;

      // Orb position
      const orbEl = this.data.orb;
      if (orbEl && orbEl.object3D) {
        orbEl.object3D.getWorldPosition(this._orbPos);
      }

      // Gate emissive to only when camera is inside this dome volume.
      let inside = 0.0;
      const sceneCam = this.el.sceneEl && this.el.sceneEl.camera;
      if (sceneCam) {
        const camPos = new THREE.Vector3();
        (sceneCam.el ? sceneCam.el.object3D : sceneCam).getWorldPosition(camPos);

        if (!this._domeParams) {
          const td = this.el.getAttribute('thick-dome-shell') || {};
          const r = Number(td.radius || 11.1);
          const s = td.innerScale || {x:1, y:1, z:1};
          this._domeParams = { r, sx: Number(s.x||s[0]||1), sy: Number(s.y||s[1]||1), sz: Number(s.z||s[2]||1) };
        }
        const lp = this.el.object3D.worldToLocal(camPos.clone());
        const p = this._domeParams;
        const nx = lp.x / (p.r * p.sx);
        const ny = lp.y / (p.r * p.sy);
        const nz = lp.z / (p.r * p.sz);
        const nlen = Math.sqrt(nx*nx + ny*ny + nz*nz);
        inside = (nlen < 0.98) ? 1.0 : 0.0;
      }

      if (this._shader && this._shader.uniforms) {
        this._shader.uniforms.uTime.value = t / 1000;
        this._shader.uniforms.uOrbPos.value.copy(this._orbPos);
        this._shader.uniforms.uStrength.value = this.data.strength;
        this._shader.uniforms.uScale.value = this.data.scale;
        this._shader.uniforms.uSpeed.value = this.data.speed;
        this._shader.uniforms.uMaxD.value = this.data.maxDistance;
        this._shader.uniforms.uInside.value = inside;
      }
    }
  });

  // Orb-local moving point lights (finite distance + decay to avoid affecting outside areas).
  AFRAME.registerComponent('orbital-pointlights', {
    schema: {
      radius: {type: 'number', default: 2.4},
      height: {type: 'number', default: 0.35},
      speed:  {type: 'number', default: 0.22},
      distance: {type: 'number', default: 12.5},
      decay: {type: 'number', default: 2.0},
      intensity: {type: 'number', default: 1.15},
      count: {type: 'int', default: 3}
    },
    init: function () {
      this.lights = [];
      const n = Math.max(2, Math.min(4, this.data.count));
      for (let i = 0; i < n; i++) {
        const e = document.createElement('a-entity');
        e.setAttribute('light', {
          type: 'point',
          color: '#ffffff',
          intensity: this.data.intensity,
          distance: this.data.distance,
          decay: this.data.decay
        });
        e.setAttribute('position', '0 0 0');
        this.el.appendChild(e);
        this.lights.push(e);
      }
    },
    tick: function (t) {
      const time = t / 1000;
      const n = this.lights.length;
      if (!n) return;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2.0 + time * this.data.speed;
        const wob = 0.25 * Math.sin(time * 0.9 + i * 1.7);
        const x = Math.cos(a) * (this.data.radius + wob);
        const z = Math.sin(a) * (this.data.radius + wob * 0.6);
        const y = this.data.height + 0.20 * Math.sin(time * 1.3 + i * 2.1);
        this.lights[i].object3D.position.set(x, y, z);
      }
    }
  });
})();
</script>

<script>
/* === NDE Dome spatial ambience (progressive fade to 0 at 40m) === */
AFRAME.registerComponent('nde-dome-audio', {
  schema: { maxDistance: { type: 'number', default: 40 } },
  init: function () {
    this._camEl = null;
    this._vCam = new THREE.Vector3();
    this._vSrc = new THREE.Vector3();

    const scene = this.el.sceneEl;

    const grabCam = () => {
      try { this._camEl = scene && scene.camera && scene.camera.el; } catch (e) {}
    };

    const resumeAudio = async () => {
      try {
        const ctx = (scene && scene.audioListener && scene.audioListener.context) ||
                    (AFRAME.audioContext ? AFRAME.audioContext : null);
        if (ctx && ctx.state === 'suspended') await ctx.resume();
      } catch (e) {}
    };

    this._tryPlay = async () => {
      if (window.__AYA_PRELOAD_MODE) return;
      await resumeAudio();
      const s = this.el.components && this.el.components.sound;
      if (!s) return;
      try {
        if (!s.isPlaying) s.playSound();
      } catch (e) {}
    };

    if (scene && scene.hasLoaded) grabCam();
    else if (scene) scene.addEventListener('loaded', grabCam, { once: true });

    // Try as soon as the sound is loaded, then fall back to user gesture (autoplay policies).
    this.el.addEventListener('sound-loaded', this._tryPlay);
    window.addEventListener('click', this._tryPlay, { passive: true });
    window.addEventListener('touchstart', this._tryPlay, { passive: true });
    window.addEventListener('keydown', this._tryPlay, { passive: true });
  },

  tick: function () {
    const s = this.el.components && this.el.components.sound;
    if (!s) return;

    const camEl = this._camEl || (this.el.sceneEl && this.el.sceneEl.camera && this.el.sceneEl.camera.el);
    if (!camEl || !camEl.object3D) return;

    camEl.object3D.getWorldPosition(this._vCam);
    this.el.object3D.getWorldPosition(this._vSrc);

    const d = this._vCam.distanceTo(this._vSrc);
    const md = Math.max(0.001, this.data.maxDistance);

    // Linear fade: 1.0 at 0m -> 0.0 at md (hard silent beyond).
    let v = 1.0 - (d / md);
    if (v < 0) v = 0;
    if (v > 1) v = 1;

    try { s.setVolume(v); } catch (e) {
      try { this.el.setAttribute('sound', 'volume', v); } catch (err) {}
    }
  },

  remove: function () {
    if (this._tryPlay) {
      this.el.removeEventListener('sound-loaded', this._tryPlay);
      window.removeEventListener('click', this._tryPlay);
      window.removeEventListener('touchstart', this._tryPlay);
      window.removeEventListener('keydown', this._tryPlay);
    }
  }
});

(function(){
  if (!window.AFRAME || !window.THREE) return;

AFRAME.registerComponent('play-gltf-clip', {
    schema: {
      clip: { type: 'string', default: '' },
      loop: { type: 'string', default: 'repeat' }
    },
    init: function () {
      this.mixer = null;
      this.action = null;
      this._onLoaded = (e) => {
        const model = e.detail && e.detail.model;
        if (!model) return;
        const clips = (model.animations && model.animations.length) ? model.animations : [];
        if (!clips.length) return;

        const wanted = (this.data.clip || '').trim();
        let clip = null;
        if (wanted) {
          clip = THREE.AnimationClip.findByName(clips, wanted) || null;
        }
        if (!clip) clip = clips[0];

        // Reset any previous mixer
        this.mixer = new THREE.AnimationMixer(model);
        this.action = this.mixer.clipAction(clip);
        this.action.enabled = true;
        this.action.setLoop(THREE.LoopRepeat);
        this.action.play();
      };
      this.el.addEventListener('model-loaded', this._onLoaded);
    },
    tick: function (t, dt) {
      if (!this.mixer) return;
      this.mixer.update((dt || 0) / 1000);
    },
    remove: function () {
      this.el.removeEventListener('model-loaded', this._onLoaded);
      this.mixer = null;
      this.action = null;
    }
  });



  }
})();

<script>
/* ============================================================
   Capsule v2 (glass + sliding base + inner platform/step)
   - Press O to toggle open/close.
   - Glass halves slide wider than the base halves.
   - Base uses the same material maps as the elevator doors (elevMetal* assets).
   ============================================================ */
(function () {
  if (!window.AFRAME || !window.THREE) return;

  // --- Procedural glass halves (top hemisphere split along X=0) -----------------
  AFRAME.registerComponent('procedural-capsule-glass', {
    schema: {
      side: { type: 'string', default: 'L' },          // L | R
      radius: { type: 'number', default: 1.35 },
      segments: { type: 'int', default: 96 }
    },
    init: function () {
      const d = this.data;
      const r = Math.max(0.25, d.radius);
      const seg = Math.max(24, d.segments|0);

      // Top half (north pole -> equator)
      const gTop = new THREE.SphereGeometry(r, seg, Math.floor(seg*0.5), 0, Math.PI * 2, 0, Math.PI * 0.5);
      const g = clipByX(gTop, d.side === 'L' ? -1 : 1);

      const glassMat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color('#dfeeff'),
        metalness: 0.05,
        roughness: 0.06,
        transmission: 1.0,
        transparent: true,
        opacity: 0.22,
        thickness: 0.25,
        ior: 1.45,
        envMapIntensity: 1.25,
        specularIntensity: 1.0,
        clearcoat: 1.0,
        clearcoatRoughness: 0.06,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      const mesh = new THREE.Mesh(g, glassMat);
      mesh.castShadow = false;
      mesh.receiveShadow = true;
      mesh.renderOrder = 40; // keep glass on top for stable transparency sorting

      this.el.setObject3D('mesh', mesh);

      function clipByX(geom, sign) {
        // sign=-1 keeps x <= 0, sign=+1 keeps x >= 0
        const g0 = geom.index ? geom.toNonIndexed() : geom;
        const pos = g0.attributes.position;
        const nor = g0.attributes.normal;
        const uv  = g0.attributes.uv;

        const outPos = [];
        const outNor = [];
        const outUv  = [];

        const keep = (x) => (sign < 0) ? (x <= 0.000001) : (x >= -0.000001);

        for (let i = 0; i < pos.count; i += 3) {
          const x0 = pos.getX(i+0), x1 = pos.getX(i+1), x2 = pos.getX(i+2);
          const k0 = keep(x0), k1 = keep(x1), k2 = keep(x2);

          // Keep only triangles fully on the chosen side (simple + deterministic; no seam cap).
          if (!(k0 && k1 && k2)) continue;

          for (let j = 0; j < 3; j++) {
            const ii = i + j;
            outPos.push(pos.getX(ii), pos.getY(ii), pos.getZ(ii));
            outNor.push(nor.getX(ii), nor.getY(ii), nor.getZ(ii));
            outUv.push(uv.getX(ii), uv.getY(ii));
          }
        }

        const gOut = new THREE.BufferGeometry();
        gOut.setAttribute('position', new THREE.Float32BufferAttribute(outPos, 3));
        gOut.setAttribute('normal',   new THREE.Float32BufferAttribute(outNor, 3));
        gOut.setAttribute('uv',       new THREE.Float32BufferAttribute(outUv, 2));
        gOut.computeBoundingSphere();
        return gOut;
      }
    },
    remove: function () {
      const m = this.el.getObject3D('mesh');
      if (!m) return;
      try { m.geometry && m.geometry.dispose(); } catch(e) {}
      try { m.material && m.material.dispose(); } catch(e) {}
      this.el.removeObject3D('mesh');
    }
  });

  // Procedural rounded base half (extruded ring segment) -----------------------
  AFRAME.registerComponent('procedural-capsule-base-half', {
  schema: {
    side: { type: 'string', default: 'L' }, // L | R
    radius: { type: 'number', default: 1.35 }, // must match glass radius
    height: { type: 'number', default: 0.12 },
    segments: { type: 'int', default: 96 }
  },
  init: function () {
    const d = this.data;
    const r = Math.max(0.25, d.radius);
    const h = Math.max(0.02, d.height);
    const seg = Math.max(24, d.segments|0);

    // Full disc (cylinder) then clip on X with the *same rule* as the glass halves.
    // This ensures the base split line matches the glass split line visually.
    const gFull = new THREE.CylinderGeometry(r, r, h, seg, 1, false);
    const g = clipByX(gFull, d.side === 'L' ? -1 : 1);

    // Prefer the A-Frame material (so elevator PBR maps apply), otherwise fallback.
    let mat = null;
    const afMat = this.el.components && this.el.components.material && this.el.components.material.material;
    if (afMat) {
      mat = afMat;
      // Make sure the base remains opaque and renders before glass.
      mat.transparent = false;
      mat.opacity = 1.0;
      mat.depthWrite = true;
      mat.side = THREE.DoubleSide;
    } else {
      mat = new THREE.MeshStandardMaterial({ color: new THREE.Color('#8b8f95'), metalness: 1.0, roughness: 1.0, side: THREE.DoubleSide });
    }

    const mesh = new THREE.Mesh(g, mat);
    mesh.castShadow = false;
    mesh.receiveShadow = true;
    mesh.renderOrder = 5;

    this.el.setObject3D('mesh', mesh);

    function clipByX(geom, sign) {
      // sign=-1 keeps x <= 0, sign=+1 keeps x >= 0
      const g0 = geom.index ? geom.toNonIndexed() : geom;
      const pos = g0.attributes.position;
      const nor = g0.attributes.normal;
      const uv  = g0.attributes.uv;

      const outPos = [];
      const outNor = [];
      const outUv  = [];

      const keep = (x) => (sign < 0) ? (x <= 0.000001) : (x >= -0.000001);

      for (let i = 0; i < pos.count; i += 3) {
        const x0 = pos.getX(i+0), x1 = pos.getX(i+1), x2 = pos.getX(i+2);
        const k0 = keep(x0), k1 = keep(x1), k2 = keep(x2);

        // Keep only triangles fully on the chosen side (same deterministic behavior as glass).
        if (!(k0 && k1 && k2)) continue;

        for (let j = 0; j < 3; j++) {
          outPos.push(pos.getX(i+j), pos.getY(i+j), pos.getZ(i+j));
          outNor.push(nor.getX(i+j), nor.getY(i+j), nor.getZ(i+j));
          if (uv) outUv.push(uv.getX(i+j), uv.getY(i+j));
        }
      }

      const out = new THREE.BufferGeometry();
      out.setAttribute('position', new THREE.Float32BufferAttribute(outPos, 3));
      out.setAttribute('normal',   new THREE.Float32BufferAttribute(outNor, 3));
      if (uv) out.setAttribute('uv', new THREE.Float32BufferAttribute(outUv, 2));
      out.computeBoundingBox();
      out.computeBoundingSphere();
      return out;
    }
  }
});

  // --- Toggle: move half-modules left/right with optional glass tuck (Press O) ---
  AFRAME.registerComponent('capsule-split-toggle', {
    schema: {
      leftHalf:  { type: 'selector' },
      rightHalf: { type: 'selector' },
      leftGlass: { type: 'selector' },
      rightGlass:{ type: 'selector' },
      openX:     { type: 'number', default: 0.75 },
      tuckY:     { type: 'number', default: 0.06 },
      dur:       { type: 'int',    default: 650 },
      enabled:  { type: 'boolean', default: true },
      key:      { type: 'string',  default: 'KeyO' }
    },

    init: function () {
      this._open = false;
      this._anim = null;

      this._resolve = this._resolve.bind(this);
      this._onKeyDown = this._onKeyDown.bind(this);

      const scene = this.el.sceneEl;
      if (scene && scene.hasLoaded) this._resolve();
      else if (scene) scene.addEventListener('loaded', this._resolve, { once: true });

      if (this.data.enabled) {
        window.addEventListener('keydown', this._onKeyDown, { passive: false });
      }
    },

    _resolve: function () {
      const d = this.data;

      this._L = d.leftHalf;
      this._R = d.rightHalf;
      this._gL = d.leftGlass;
      this._gR = d.rightGlass;

      if (!this._L || !this._R) {
        console.warn('[capsule-split-toggle] Missing leftHalf/rightHalf selectors.');
        return;
      }

      // Cache closed poses (local positions).
      this._pL0 = this._L.object3D.position.clone();
      this._pR0 = this._R.object3D.position.clone();

      if (this._gL) this._gL0y = this._gL.object3D.position.y;
      if (this._gR) this._gR0y = this._gR.object3D.position.y;
    },

    _onKeyDown: function (e) {
      if (e.repeat) return;
      const d = this.data;
      if (!d.enabled) return;
      const k = (d.key || 'KeyO');
      const match = (e.code === k) || ((k.length === 4 && k.startsWith('Key')) && (e.key && e.key.toLowerCase() === k.slice(3).toLowerCase()));
      if (!match) return;

      // Prevent page scroll / other handlers if any.
      e.preventDefault();

      // If not resolved yet, try now.
      if (!this._L || !this._R) this._resolve();
      if (!this._L || !this._R) return;

      this._open = !this._open;

      // d already defined above
      const now = performance.now();

      const pLfrom = this._L.object3D.position.clone();
      const pRfrom = this._R.object3D.position.clone();

      const pLto = this._pL0.clone().add(new THREE.Vector3(-d.openX, 0, 0));
      const pRto = this._pR0.clone().add(new THREE.Vector3( d.openX, 0, 0));

      const pLclosed = this._pL0.clone();
      const pRclosed = this._pR0.clone();

      this._anim = {
        t0: now,
        dur: Math.max(1, d.dur|0),
        pLfrom, pRfrom,
        pLto: this._open ? pLto : pLclosed,
        pRto: this._open ? pRto : pRclosed
      };

      // Glass tuck (instant start target; eased in tick).
      if (this._gL != null && this._gL0y != null) {
        this._gL_targetY = this._open ? (this._gL0y - d.tuckY) : this._gL0y;
      }
      if (this._gR != null && this._gR0y != null) {
        this._gR_targetY = this._open ? (this._gR0y - d.tuckY) : this._gR0y;
      }
    },

    tick: function () {
      if (!this._anim) return;

      const a = this._anim;
      const t = (performance.now() - a.t0) / a.dur;
      const u = t >= 1 ? 1 : (t <= 0 ? 0 : t);

      // Smoothstep ease.
      const e = u*u*(3 - 2*u);

      this._L.object3D.position.lerpVectors(a.pLfrom, a.pLto, e);
      this._R.object3D.position.lerpVectors(a.pRfrom, a.pRto, e);

      // Glass tuck (y only).
      if (this._gL && this._gL_targetY != null) {
        const y = this._gL.object3D.position.y;
        this._gL.object3D.position.y = y + (this._gL_targetY - y) * (0.25 + 0.75*e);
      }
      if (this._gR && this._gR_targetY != null) {
        const y = this._gR.object3D.position.y;
        this._gR.object3D.position.y = y + (this._gR_targetY - y) * (0.25 + 0.75*e);
      }

      if (u >= 1) this._anim = null;
    },

    remove: function () {
      window.removeEventListener('keydown', this._onKeyDown);
    }
  });

})();
</script>
</head>

<script>
/* ==== Imported glue + components (perfect merge) ==== */
(function () {
  if (!window.AFRAME) return;

  // Guard: ignore duplicate component registrations.
  const _reg = AFRAME.registerComponent.bind(AFRAME);
  AFRAME.registerComponent = function(name, def) {
    if (AFRAME.components && AFRAME.components[name]) {
      console.warn('[merge] component already registered:', name);
      return;
    }
    return _reg(name, def);
  };

  
AFRAME.registerComponent('endchamber-lift', {
  schema: {
    platform:  { type: 'selector' },
    panel:     { type: 'selector' },
    triggerDist:{ type: 'number', default: 3.0 },
    boardDist: { type: 'number', default: 2.1 },
    autopilotDurationMs: { type: 'number', default: 900 },
    nextUrl:   { type: 'string', default: 'end_level_01.html?spawn=end_chamber' }
  },

  init: function () {
    this.rig = document.querySelector('#rig');
    this.cam = document.querySelector('#playerCam');

    this.guide = document.getElementById('userGuide');
    this.guideBody = document.getElementById('userGuideBody');

    this._a = new THREE.Vector3();
    this._b = new THREE.Vector3();
    this._tmp = new THREE.Vector3();

    this.state = {
      step: 0,          // 0 none, 1 near platform, 2 boarded/ready
      autopilot: false,
      owner: 'endchamber-lift',
      originalSpeed: null
    };

    this._onKeyDown = (e) => {
      if (e.repeat) return;
      const isF = (e.code === 'KeyF' || e.key === 'f' || e.key === 'F');
      if (!isF) return;

      // Only respond when our guide is active.
      if (this.state.step !== 1 && this.state.step !== 2) return;

      e.preventDefault();
      e.stopPropagation();

      if (this.state.step === 1) {
        this._boardPlatform();
      } else if (this.state.step === 2) {
        this._activateLift();
      }
    };

    window.addEventListener('keydown', this._onKeyDown, { capture: true });
  },

  remove: function () {
    window.removeEventListener('keydown', this._onKeyDown, { capture: true });
  },

  tick: function () {
    const p = this.data.platform;
    if (!this.rig || !this.cam || !p) return;

    this.cam.object3D.getWorldPosition(this._a);
    p.object3D.getWorldPosition(this._b);

    const d = this._a.distanceTo(this._b);

    // Hysteresis to avoid flicker.
    const on = this.data.triggerDist;
    const off = on + 0.35;

    if (this.state.autopilot) return;

    if (this.state.step === 0 && d <= on) {
      this.state.step = 1;
      this._showGuide('Approach the platform.<br><b>F</b> — Step onto platform');
      return;
    }

    if ((this.state.step === 1 || this.state.step === 2) && d > off) {
      // Only hide if we are the current owner (don't fight other guides).
      this._hideGuideIfOwner();
      this.state.step = 0;
      return;
    }

    if (this.state.step === 1) {
      // If already standing on platform, promote to step 2 automatically.
      if (d <= this.data.boardDist) {
        this.state.step = 2;
        this._showGuide('On platform.<br><b>F</b> — Activate lift (loads next level)');
      }
    }
  },

  _hideGuideIfOwner: function () {
    if (!this.guide) return;
    const owner = this.guide.getAttribute('data-owner');
    if (owner && owner !== this.state.owner) return;
    this.guide.style.opacity = 0;
    this.guide.setAttribute('data-owner', '');
  },

  _showGuide: function (html) {
    if (!this.guide || !this.guideBody) return;
    this.guide.setAttribute('data-owner', this.state.owner);
    this.guideBody.innerHTML = html;
    this.guide.style.opacity = 1;
  },

  _captureShaftLights: function () {
    if (this._shaftLights) return;
    const out = [];
    const add = (el) => {
      if (!el) return;
      const l = el.getAttribute && el.getAttribute('light');
      if (!l) return;
      const inten = (typeof l.intensity === 'number') ? l.intensity : 1.0;
      out.push({ el, intensity: inten });
    };

    add(this._oculusSpotEl);

    if (this._moonlightEl && this._moonlightEl.querySelectorAll) {
      this._moonlightEl.querySelectorAll('[light]').forEach(add);
    }

    this._shaftLights = out;
  },

  _setShaftLightsEnabled: function (enabled) {
    this._captureShaftLights();
    if (!this._shaftLights || !this._shaftLights.length) return;

    const wantOff = !enabled;
    if (this._shaftLightsOff === wantOff) return;

    this._shaftLights.forEach((s) => {
      try {
        s.el.setAttribute('light', 'intensity', enabled ? s.intensity : 0.0);
      } catch (e) {}
    });

    this._shaftLightsOff = wantOff;
  },


  _boardPlatform: function () {
    const p = this.data.platform;
    const panel = this.data.panel;
    if (!p || !this.rig) return;

    // If already close enough, just switch to step 2.
    this.cam.object3D.getWorldPosition(this._a);
    p.object3D.getWorldPosition(this._b);
    if (this._a.distanceTo(this._b) <= this.data.boardDist) {
      this.state.step = 2;
      this._showGuide('On platform.<br><b>F</b> — Activate lift (loads next level)');
      return;
    }

    this.state.autopilot = true;

    // Temporarily stop movement
    const rw = this.rig.components && this.rig.components['rig-walk'];
    if (rw) {
      this.state.originalSpeed = rw.data && typeof rw.data.speed === 'number' ? rw.data.speed : null;
      try { this.rig.setAttribute('rig-walk', 'speed', 0.0); } catch (e) {}
      if (rw.keys) Object.keys(rw.keys).forEach(k => rw.keys[k] = false);
    }

    // Target rig xz to platform center (keep current rig y).
    const rigStart = this.rig.object3D.position.clone();
    const worldTarget = new THREE.Vector3();
    p.object3D.getWorldPosition(worldTarget);

    const rigTarget = new THREE.Vector3(worldTarget.x, rigStart.y, worldTarget.z);

    // Face the panel (or center) at end.
    const faceTarget = new THREE.Vector3(worldTarget.x, rigStart.y, worldTarget.z);
    if (panel && panel.object3D) {
      panel.object3D.getWorldPosition(faceTarget);
    }

    const duration = this.data.autopilotDurationMs;
    const t0 = performance.now();

    // Make autopilot collision-aware and route through the handrail opening (toward tunnel_06 at +X).
    const desired = new THREE.Vector3();
    const center = new THREE.Vector3(worldTarget.x, rigStart.y, worldTarget.z);

    // Direction to the portal opening (fallback: +X).
    const portalEl = document.querySelector('#end_chamber_06_portal') || document.querySelector('#end_chamber_06_rim');
    const portalPos = new THREE.Vector3();
    if (portalEl && portalEl.object3D) portalEl.object3D.getWorldPosition(portalPos);
    else portalPos.set(worldTarget.x + 1, rigStart.y, worldTarget.z);

    const dir = new THREE.Vector3(portalPos.x - worldTarget.x, 0, portalPos.z - worldTarget.z);
    if (dir.lengthSq() < 1e-8) dir.set(1, 0, 0);
    dir.normalize();

    // Match endchamber_handrail_colliders radius (~1.48).
    const handR = 1.48;

    // Two waypoints: outside the handrail at the opening, then inside the opening, then center.
    const wpOutside = new THREE.Vector3(center.x + dir.x * (handR + 0.70), rigStart.y, center.z + dir.z * (handR + 0.70));
    const wpInside  = new THREE.Vector3(center.x + dir.x * (handR - 0.55), rigStart.y, center.z + dir.z * (handR - 0.55));

    const startToCenter = new THREE.Vector3(rigStart.x - center.x, 0, rigStart.z - center.z).length();
    const needsGate = startToCenter > (handR + 0.10);

    const pts = needsGate ? [rigStart.clone(), wpOutside, wpInside, rigTarget.clone()] : [rigStart.clone(), rigTarget.clone()];
    const segs = pts.length - 1;

    const easeInOutQuad = (u) => (u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2)/2);

    const step = () => {
      const t = performance.now();
      const u = Math.min(1, (t - t0) / duration);
      const uu = easeInOutQuad(u);

      if (segs <= 1) {
        desired.lerpVectors(pts[0], pts[1], uu);
      } else {
        const tt = uu * segs;
        const i = Math.min(segs - 1, Math.floor(tt));
        const lt = tt - i;
        desired.lerpVectors(pts[i], pts[i + 1], lt);
      }

      // Apply + collision resolve (XZ). Keep y constant.
      this.rig.object3D.position.set(desired.x, rigStart.y, desired.z);
      if (rw && typeof rw._resolveCollisions === 'function') {
        rw._resolveCollisions(this.rig.object3D.position);
        this.rig.object3D.position.y = rigStart.y;
      }

      if (u < 1) {
        requestAnimationFrame(step);
      } else {
        // Set yaw toward faceTarget
        const dx = faceTarget.x - this.rig.object3D.position.x;
        const dz = faceTarget.z - this.rig.object3D.position.z;
        const yaw = Math.atan2(dx, dz) * 180/Math.PI;
        this.rig.object3D.rotation.y = THREE.MathUtils.degToRad(yaw);

        // Restore movement
        if (rw && this.state.originalSpeed != null) {
          try { this.rig.setAttribute('rig-walk', 'speed', this.state.originalSpeed); } catch (e) {}
        }

        this.state.autopilot = false;
        this.state.step = 2;
        this._showGuide('On platform.<br><b>F</b> — Activate lift (loads next level)');
      }
    };

    requestAnimationFrame(step);
  },

  _activateLift: function () {
    // Explicit loading moment is OK (per user request).
    this._showGuide('Activating lift…<br><span style="opacity:.9">Loading next level…</span>');

    try { sessionStorage.setItem('spawn', 'end_chamber'); } catch (e) {}

    // Small delay so the guide update is seen.
    setTimeout(() => {
      window.location.href = this.data.nextUrl;
    }, 450);
  }
});
/* --- end endchamber-lift --- */

AFRAME.registerComponent('endchamber-ascent-test', {
  schema: {
    platform:  { type: 'selector' },
    inner:     { type: 'selector' },
    outer:     { type: 'selector' },

    triggerDist:{ type: 'number', default: 3.0 },
    boardDist: { type: 'number', default: 2.1 },

    targetPlatformY: { type: 'number', default: 8.25 },   // local Y (end_chamber_06 space)
    durationMs:      { type: 'number', default: 6200 }
  },

  init: function () {
    this.rig = document.querySelector('#rig');
    this.cam = document.querySelector('#playerCam');

    this.guide = document.getElementById('userGuide');
    this.guideBody = document.getElementById('userGuideBody');

    this._a = new THREE.Vector3();
    this._b = new THREE.Vector3();

    this.state = {
      step: 0,          // 0 none, 1 near platform, 2 boarded/ready
      running: false,
      owner: 'endchamber-ascent-test',
      originalSpeed: null,

      // During ascent: constrain look so user can only look forward/up (no down).
      lookLockActive: false,
      lookLeveling: false,
      lookLevelT0: 0,
      lookLevelDur: 1400,
      lookPitchFrom: 0,
      lookYawCenter: 0
    };

    // Platform material toggle: kill specular/env reflections only when above ground.
    this._platformMatSnapshot = null;
    this._platformMatte = false;

    // Platform reflection fade (PBR-safe): gradually reduce env/spec response near the same band used for lunar light fade.
    // This avoids any visible "material swap" or snap if the user looks down during ascent.
    this._platformPbrSnapshot = null;
    this._platformFadeFactor = 1;
    this._platformRoughBoost = 0.28; // added roughness at full fade
    this._platformMetalCut = 0.18;   // reduced metalness at full fade

    // Track above-ground state so we can enforce the matte swap even if the mesh appears late.
    this._aboveGround = false;
    this._onPlatformObject3DSet = null;
    const p0 = this.data.platform;
    if (p0) {
      this._onPlatformObject3DSet = (evt) => {
        if (!evt || !evt.detail || evt.detail.type !== 'mesh') return;
        // Re-snapshot now that the primitive mesh exists.
        this._platformMatSnapshot = null;
        this._platformMatte = false;
        this._platformPbrSnapshot = null;

        // Re-apply the current fade state if the mesh appeared late.
        // Policy: keep the *final* (above-ground) platform reflection state at all times.
        this._applyPlatformReflectionFade(1);
      };
      p0.addEventListener('object3dset', this._onPlatformObject3DSet);
    }

    // Shaft lights inside the end chamber (these can create an unwanted specular 'blob' on the platform when above).
    this._oculusSpotEl = document.getElementById('endchamber_oculus_spot');
    this._oculusSpotBaseI = 0;
    if (this._oculusSpotEl) {
      const _l = this._oculusSpotEl.getAttribute('light');
      this._oculusSpotBaseI = _l && typeof _l.intensity === 'number' ? _l.intensity : 0;
    }
    this._moonlightEl = document.getElementById('endchamber_moonlight');
    this._shaftLights = null;
    this._shaftLightsOff = false;
    // --- Outside lunar lights (must not affect underground) ---
    this._lunarDirEl = document.getElementById('lia_lunar_light');
    this._lunarHemiEl = document.getElementById('lia_lunar_skyfill');
    this._lunarDirI = 0;
    this._lunarHemiI = 0;
    this._lunarFadeRAF = 0;
    this._lunarFadeT0 = 0;
    this._lunarFadeDur = 450; // ms
    // Height band (in meters) around the swap threshold where we fade the outside lunar lights.
    // Start slightly *before* the swap so it feels like light gradually filtering in during ascent.
    this._lunarFadeStart = 3.0; // meters below swapY
    this._lunarFadeEnd = 0.25;  // meters above swapY
    this._lunarFadeK = 0.12;    // smoothing factor per update
    this._lunarFactor = 0;
    this._lunarFromDir = 0;
    this._lunarFromHemi = 0;
    this._lunarToDir = 0;
    this._lunarToHemi = 0;
    this._lunarEnabled = null;
    this._ascentStartYWorld = null; // world-space Y where ascent begins (for lunar ramp)


    if (this._lunarDirEl) {
      const l = this._lunarDirEl.getAttribute('light');
      this._lunarDirI = l && typeof l.intensity === 'number' ? l.intensity : 0;
    }
    if (this._lunarHemiEl) {
      const l = this._lunarHemiEl.getAttribute('light');
      this._lunarHemiI = l && typeof l.intensity === 'number' ? l.intensity : 0;
    }


    // If this test file starts with the platform already above ground, apply the same above-ground policy immediately.
    const _syncAboveOnce = () => { try { this._syncAboveGroundState(); } catch (e) {} };

  _normAngle: function (a) {

  _syncAboveGroundState: function () {

  // --- Outside lunar lights gating ---
  _setOutsideLunarFactor: function (target) {

    if (target < 0) target = 0;
    if (target > 1) target = 1;

    const k = (this._lunarFadeK != null) ? this._lunarFadeK : 0.12;

    const next = this._lunarFactor + (target - this._lunarFactor) * k;

    const hemiEl = this._lunarHemiEl;

    const dirVal = this._lunarDirI * this._lunarFactor;
    const hemiVal = this._lunarHemiI * this._lunarFactor;

// --- Shaft light capture/toggle (used to kill platform highlights when above ground) ---
_captureShaftLights: function () {
  if (this._shaftLights) return;
  const out = [];
  const add = (el) => {
    if (!el) return;
    const l = el.getAttribute && el.getAttribute('light');

    const inten = (typeof l.intensity === 'number') ? l.intensity : 1.0;
    out.push({ el, intensity: inten });

  add(this._oculusSpotEl);

  // Any point lights under the moonlight group

_setShaftLightsEnabled: function (enabled) {

// --- Platform reflection fade (no material swaps) ---
_capturePlatformPbrSnapshot: function () {
  const p = this.data.platform;
  if (!p) return;

  const mesh = p.getObject3D && p.getObject3D('mesh');
  if (!mesh) return;

  const snap = [];
  mesh.traverse((o) => {
    if (!o.isMesh || !o.material) return;

    const captureMat = (mat) => {
      if (!mat || (typeof mat !== 'object')) return;
      // Capture only if the property exists on this material type.
      const hasEnv = ('envMapIntensity' in mat) && (typeof mat.envMapIntensity === 'number');
      const hasRough = ('roughness' in mat) && (typeof mat.roughness === 'number');
      const hasMetal = ('metalness' in mat) && (typeof mat.metalness === 'number');

      // If it's not a PBR-ish material, there's nothing to fade.
      if (!hasEnv && !hasRough && !hasMetal) return;

      snap.push({
        mat,
        hasEnv, hasRough, hasMetal,
        env0: hasEnv ? mat.envMapIntensity : null,
        rough0: hasRough ? mat.roughness : null,
        metal0: hasMetal ? mat.metalness : null

    };

    if (Array.isArray(o.material)) o.material.forEach(captureMat);
    else captureMat(o.material);
  });

  this._platformPbrSnapshot = snap.length ? snap : null;

_applyPlatformReflectionFade: function (factor) {
  // factor: 0..1 (0 = original PBR response; 1 = maximum suppression)
  if (factor == null) factor = 0;
  if (factor < 0) factor = 0;
  if (factor > 1) factor = 1;

  this._platformFadeFactor = factor;

  if (!this._platformPbrSnapshot) this._capturePlatformPbrSnapshot();
  const snap = this._platformPbrSnapshot;
  if (!snap) return;

  const lerp = (a, b, t) => a + (b - a) * t;

  const roughBoost = (this._platformRoughBoost != null) ? this._platformRoughBoost : 0.28;
  const metalCut = (this._platformMetalCut != null) ? this._platformMetalCut : 0.18;

  snap.forEach((s) => {
    const m = s.mat;
    if (!m) return;

    if (s.hasEnv) {
      m.envMapIntensity = lerp(s.env0, 0.0, factor);
    }
    if (s.hasRough) {
      const r1 = Math.min(1.0, s.rough0 + roughBoost);
      m.roughness = lerp(s.rough0, r1, factor);
    }
    if (s.hasMetal) {
      const mm1 = Math.max(0.0, s.metal0 - metalCut);
      m.metalness = lerp(s.metal0, mm1, factor);
    }
  });
},


  _capturePlatformMaterials: function () {
    const p = this.data.platform;
    if (!p) return;

    // NOTE: platform is a primitive entity (a-cylinder). We intentionally only touch its own mesh,
    // not child entities (handrail/panel), so we call getObject3D('mesh') on THIS entity.
    const mesh = p.getObject3D && p.getObject3D('mesh');
    if (!mesh) return;

    const snap = [];
    mesh.traverse((o) => {
      if (!o.isMesh || !o.material) return;

      if (Array.isArray(o.material)) {
        o.material.forEach((m, idx) => {
          if (!m || (typeof m !== 'object')) return;
          snap.push({
            obj: o,
            idx,
            origMat: m,
            // basicMat will be created lazily on first toggle.
            basicMat: null
          });
        });
      } else {
        const m = o.material;
        if (!m || (typeof m !== 'object')) return;
        snap.push({
          obj: o,
          idx: null,
          origMat: m,
          basicMat: null

  _setPlatformMatteAboveGround: function (on) {

            transparent: !!orig.transparent,
            opacity: (typeof orig.opacity === 'number') ? orig.opacity : 1.0,
            side: (typeof orig.side === 'number') ? orig.side : THREE.FrontSide,
            alphaTest: (typeof orig.alphaTest === 'number') ? orig.alphaTest : 0

          if (typeof orig.fog === 'boolean') bm.fog = orig.fog;
          s.basicMat = bm;

          s.obj.material[s.idx] = s.basicMat;

      this._platformMatte = true;
      return;

    if (!on && this._platformMatte) {

      snap.forEach((s) => {

          s.obj.material[s.idx] = s.origMat;
        } else {

        }

  _boardPlatform: function () {

    const platformTopY = wp.y + 0.08;

    this._showGuide('On platform.<br><b>F</b> — Ascend (test)');

  _activateAscent: function () {
    const p = this.data.platform;
    const inner = this.data.inner;
    const outer = this.data.outer;

    if (!p || !this.rig) return;
    if (this.state.running) return;

    this.state.running = true;
    // Record ascent start height so the outside lunar ramp can begin immediately when ascent starts.
    try {
      const _pW = new THREE.Vector3();
      if (p.object3D) { p.object3D.getWorldPosition(_pW); this._ascentStartYWorld = _pW.y; }
    } catch (e) {}

    try {
      const _panelLight = document.querySelector('#endchamber_panel_light');
      if (_panelLight) _panelLight.emit('ascent-blink');
    } catch (e) {}

    // During ascent: allow mouse look but prevent looking down (and keep view within a forward arc).
    this._enableAscentLookLock();

    // Disable walking while riding.
    const rw = this.rig.components && this.rig.components['rig-walk'];
    if (rw) {
      this.state.originalSpeed = rw.data && typeof rw.data.speed === 'number' ? rw.data.speed : null;
      try { this.rig.setAttribute('rig-walk', 'speed', 0.0); } catch (e) {}
      if (rw.keys) Object.keys(rw.keys).forEach(k => rw.keys[k] = false);
    }

    // Restore oculus spotlight for ascent lighting (it may have been faded off at the previous arrival).
    if (this._oculusSpotEl) {
      const baseI = (typeof this._oculusSpotBaseI === 'number') ? this._oculusSpotBaseI : 0;
      try { this._oculusSpotEl.setAttribute('light', 'intensity', baseI); } catch (e) {}
    }

    // Shell policy: hide outer while below, then swap near the oculus to avoid double-layer reads.
    if (outer) outer.setAttribute('visible', false);
    if (inner) inner.setAttribute('visible', true);

    const sceneObj = this.el.sceneEl.object3D;
    const platformObj = p.object3D;

    // Attach rig to platform so it rides cleanly.
    platformObj.attach(this.rig.object3D);

    const y0 = platformObj.position.y;
    const y1 = this.data.targetPlatformY;
    const t0 = performance.now();
    const dur = Math.max(600, this.data.durationMs);

    const ease = (u) => (u < 0.5) ? (4 * u * u * u) : (1 - Math.pow(-2 * u + 2, 3) / 2);

    const step = (t) => {
      const u = Math.min(1, (t - t0) / dur);

      platformObj.position.y = y;

      // While riding: constrain view (front/up only).
      this._applyAscentLookLock();

      // Swap shells ONLY after we are actually outside the dome.
      // Important: end_chamber_06_outer is front-sided (meant to be seen from outside),
      // so enabling it while the camera is still inside makes the shell "disappear".
      const oculusRef = document.querySelector('#end_chamber_06_oculus_cutref');
      const oculusY = oculusRef ? oculusRef.object3D.getWorldPosition(new THREE.Vector3()).y : 5.55;
      const swapY = oculusY + 1.10; // a bit above the ceiling plane

      // Compare in WORLD space (platform local Y is relative to end_chamber_06).
      this._tmpVec3 = this._tmpVec3 || new THREE.Vector3();
      const yWorld = platformObj.getWorldPosition(this._tmpVec3).y;

      const isAbove = (yWorld >= swapY);
      this._aboveGround = isAbove;

      // Outside lunar lights must never lift underground lighting.
      const fadeStartY = (this._ascentStartYWorld != null ? this._ascentStartYWorld : (swapY - this._lunarFadeStart));
      const fadeEndY = swapY + this._lunarFadeEnd;
      let f = (yWorld - fadeStartY) / (fadeEndY - fadeStartY);
      if (f < 0) f = 0; else if (f > 1) f = 1;
      f = f * f * (3 - 2 * f);
      this._setOutsideLunarFactor(f);

      // Fade platform reflections in the *same* band as the lunar light fade (no snap, no material swap).
      this._applyPlatformReflectionFade(1);

      // Above ground: disable the end chamber shaft lights to prevent a visible highlight on the platform.
      this._setShaftLightsEnabled(true);
      if (isAbove) {
        if (outer) outer.setAttribute('visible', true);
        if (inner) inner.setAttribute('visible', false);
        // Above ground: platform should not show glossy/IBL reflections.
        this._setPlatformMatteAboveGround(true);
      } else {
        if (outer) outer.setAttribute('visible', false);
        if (inner) inner.setAttribute('visible', true);
        this._setPlatformMatteAboveGround(false);
      }

        requestAnimationFrame(step);
      } else {
        // Detach rig back to scene, preserving world transform.
        sceneObj.attach(this.rig.object3D);

        // While movement is still locked, fade out the oculus spotlight so the user never notices
        // the switch when they arrive at the lunar surface (removes the hotspot when looking down).
        const spotEl = this._oculusSpotEl;
        const baseI = (typeof this._oculusSpotBaseI === 'number') ? this._oculusSpotBaseI : 0;

        const finishArrival = () => {
          // Unlock view limits only once travel is complete (and arrival lighting has settled).
          this._disableAscentLookLock();
          // Restore speed (unlock WASD) only after the spotlight has been faded off.
          if (this.state.originalSpeed !== null) {
            try { this.rig.setAttribute('rig-walk', 'speed', this.state.originalSpeed); } catch (e) {}
          }

          // Panel indicator: stop blinking once ascent travel completes.
          try {
            const _panelLight = document.querySelector('#endchamber_panel_light');
            if (_panelLight) {
              _panelLight.emit('ascent-stop');
              _panelLight.setAttribute('material', 'emissiveIntensity', 0.0);
            }
          } catch (e) {}

          this._hideGuideIfOwner();
          this.state.step = 0;
          this.state.running = false;
        };

        if (spotEl && baseI > 0) {
          let startI = baseI;
          try {
            const l = spotEl.getAttribute('light');
            if (l && typeof l.intensity === 'number') startI = l.intensity;
          } catch (e) {}

          const fadeMs = 360; // short, perceptually invisible during arrival lock
          const tFade0 = performance.now();

          const fadeStep = () => {
            const now = performance.now();
            const u2 = Math.min(1, (now - tFade0) / fadeMs);
            // Smoothstep so it feels like exposure settling, not a switch.
            const s = u2 * u2 * (3 - 2 * u2);

            try { spotEl.setAttribute('light', 'intensity', inten); } catch (e) {}

            if (u2 < 1) {
              requestAnimationFrame(fadeStep);
            } else {
              try { spotEl.setAttribute('light', 'intensity', 0.0); } catch (e) {}
              finishArrival();
            }
          };

          requestAnimationFrame(fadeStep);
        } else {
          // No spotlight to fade — just finish normally.
          finishArrival();
        }

AFRAME.registerComponent('merge-align', {

// Organic tunnel "sand" sculpt: creates a non-centered, irregular mound with noisy edges and real volume,

    (function () {

      function hash2(x, y, seed){

        const n00 = hash2(xi,   yi,   seed);

        const n01 = hash2(xi,   yi+1, seed);
        const n11 = hash2(xi+1, yi+1, seed);

        const nx1 = lerp(n01, n11, u);
        return lerp(nx0, nx1, v); // [0,1)

AFRAME.registerComponent('torch-light-pool', {
  schema: {
    rig: { type: 'selector' },

  },

  init: function () {
    this._torches = [];
    this._next = 0;
    this._rigPos = new THREE.Vector3();
    this._camPos = new THREE.Vector3();
    this._camDir = new THREE.Vector3();
    this._tmp = new THREE.Vector3();
    this._flamePos = new THREE.Vector3();

    const scene = this.el.sceneEl;
    const collect = () => {
      this._torches.length = 0;
      const nodes = (scene && scene.querySelectorAll) ? scene.querySelectorAll(this.data.selector) : [];
      nodes.forEach(n => {
        // Prefer the futuristic flame child as the anchor point.
        let flame = n.querySelector('[futuristic-flame]');
        if (!flame) {
          // Fallback: an entity with id ending in _flame or containing flame_core.
          flame = n.querySelector('[id$="_flame"], #torch_flame_core');
        }
        this._torches.push({ el: n, flame: flame || n });
      });
    };

    collect();
    // Re-collect after scene settles (imported DOM etc)
    setTimeout(collect, 500);
    setTimeout(collect, 1500);
  },

  tick: function (time) {
    const hz = Math.max(2, this.data.updateHz || 12);
    const step = 1000 / hz;
    if (time < this._next) return;
    this._next = time + step;

    const rig = this.data.rig;
    const camEl = this.data.camera;
    const lightEl = this.data.light;
    if (!rig || !camEl || !lightEl) return;

    const lightObj = lightEl.getObject3D('light');
    if (!lightObj) return;

    // World positions
    rig.object3D.getWorldPosition(this._rigPos);
    const camObj = camEl.getObject3D('camera') || camEl.object3D;
    camObj.getWorldPosition(this._camPos);
    camObj.getWorldDirection(this._camDir);

    // Find nearest torch in range.
    let best = null;
    let bestD2 = Infinity;

    for (let i = 0; i < this._torches.length; i++) {
      const t = this._torches[i];
      if (!t || !t.flame) continue;
      t.flame.object3D.getWorldPosition(this._flamePos);
      const d2 = this._flamePos.distanceToSquared(this._rigPos);
      if (d2 < bestD2) {
        bestD2 = d2;
        best = t;
      }
    }

    const maxD = this.data.maxDistance;
    if (!best || bestD2 > (maxD * maxD)) {
      lightObj.intensity = 0.0;
      return;
    }

    // FOV-ish gating: only when roughly in front of camera.
    best.flame.object3D.getWorldPosition(this._flamePos);
    this._tmp.copy(this._flamePos).sub(this._camPos).normalize();
    const dot = this._tmp.dot(this._camDir);
    if (dot < this.data.fovDot) {
      lightObj.intensity = 0.0;
      return;
    }

    // Position the pooled light at the torch flame.
    lightEl.object3D.position.copy(this._flamePos);

    // Distance-based intensity curve (smooth and stable).
    const d = Math.sqrt(bestD2);
    const x = Math.max(0, 1 - (d / maxD));
    lightObj.intensity = this.data.baseIntensity * (0.35 + 0.65 * x * x);
  }
});

// Simple volumetric-ish dust motes as subtle particles inside a cone.
AFRAME.registerComponent('beam-dust', {
  schema: {
    count: { default: 360 },
    coneAngle: { default: 28 },   // degrees
    length: { default: 6.0 },
    radius: { default: 1.2 },     // max radius at length
    speed: { default: 0.18 },
    size: { default: 0.012 },
    opacity: { default: 0.04 }
  },
  init: function () {
    const d = this.data;
    const geom = new THREE.BufferGeometry();
    const positions = new Float32Array(d.count * 3);

    this._vel = new Float32Array(d.count * 3);
    const ang = THREE.MathUtils.degToRad(d.coneAngle);

    for (let i = 0; i < d.count; i++) {
      // Place inside a cone pointing down -Z
      const z = -Math.random() * d.length;
      const rMax = (Math.abs(z) / d.length) * d.radius;
      const r = Math.sqrt(Math.random()) * rMax;
      const th = Math.random() * Math.PI * 2;

      const x = r * Math.cos(th);
      const y = r * Math.sin(th);

      positions[i * 3 + 0] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      // Slow drift, mostly upward + slight forward/back
      this._vel[i * 3 + 0] = (Math.random() - 0.5) * 0.02;
      this._vel[i * 3 + 1] = (Math.random() * 0.06 + 0.01);
      this._vel[i * 3 + 2] = (Math.random() - 0.5) * 0.03;
    }

    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const mat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: d.size,
      transparent: true,
      opacity: d.opacity,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    this._geom = geom;
    this._mat = mat;
    this._pts = new THREE.Points(geom, mat);
    this._pts.frustumCulled = false;

    this.el.object3D.add(this._pts);
  },
  tick: function (ms, dt) {
    const d = this.data;
    const t = ms * 0.001;
    const pos = this._geom.attributes.position.array;
    const v = this._vel;

    const len = d.length;

    for (let i = 0; i < d.count; i++) {
      const ix = i * 3;

      pos[ix + 0] += v[ix + 0] * dt * 0.001;
      pos[ix + 1] += v[ix + 1] * d.speed * dt * 0.001;
      pos[ix + 2] += v[ix + 2] * dt * 0.001;

      // slight swirling
      pos[ix + 0] += 0.002 * Math.sin(t * 0.9 + i);
      pos[ix + 1] += 0.0015 * Math.cos(t * 1.1 + i * 0.7);

      // wrap within cone volume
      if (pos[ix + 2] > -0.15) pos[ix + 2] = -len;
      if (pos[ix + 2] < -len) pos[ix + 2] = -0.15;

      // keep inside radius envelope
      const z = pos[ix + 2];
      const rMax = (Math.abs(z) / len) * d.radius;
      const r2 = pos[ix + 0] * pos[ix + 0] + pos[ix + 1] * pos[ix + 1];
      if (r2 > rMax * rMax) {
        const r = Math.sqrt(r2) + 1e-6;
        const k = (rMax / r) * 0.98;
        pos[ix + 0] *= k;
        pos[ix + 1] *= k;
      }
    }

    this._geom.attributes.position.needsUpdate = true;
  },
  remove: function () {
    try { if (this._pts) this.el.object3D.remove(this._pts); } catch (e) {}
    try { if (this._geom) this._geom.dispose(); } catch (e) {}
    try { if (this._mat) this._mat.dispose(); } catch (e) {}
  }
});
