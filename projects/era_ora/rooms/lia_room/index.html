<script>



const PRIMAL_SCENE_CFG = {
  CX: 25,
  CZ: 0,
  GY: 0.055,
  poolLX: 1.5,
  poolLZ: 0.0,
  bermRadiusX: 14.8,
  bermRadiusZ: 9.4,
  gapCenter: Math.PI,
  gapHalf: 0.42,
};

function primalSmoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function primalAngleDelta(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

function primalRidged(sn, x, y) {
  const n = sn(x, y);
  const r = 1 - Math.abs(n);
  return r * r;
}

function primalBaseGroundHeight(worldX, worldZ, sn) {
  const { GY, CX, CZ } = PRIMAL_SCENE_CFG;
  const lx = worldX - CX;
  const lz = worldZ - CZ;

  let h = 0;
  h += (sn(worldX * 0.020 + 14.0, worldZ * 0.020 - 9.0) * 0.5 + 0.5) * 0.22;
  h += (sn(worldX * 0.050 - 2.0, worldZ * 0.050 + 11.0) * 0.5 + 0.5) * 0.10;
  h += primalRidged(sn, worldX * 0.095 + 7.0, worldZ * 0.095 - 5.0) * 0.07;
  h += primalRidged(sn, worldX * 0.180 - 4.0, worldZ * 0.180 + 6.0) * 0.035;

  const approachSoftener = Math.exp(-(((lx + 12.0) / 18.0) ** 2 + (lz / 13.0) ** 2));
  h *= 1.0 - approachSoftener * 0.45;

  const poolEx = (lx - 1.5) / 23.0;
  const poolEz = lz / 16.0;
  const poolBlend = Math.exp(-(poolEx * poolEx + poolEz * poolEz));
  h *= 1.0 - poolBlend * 0.65;

  return GY + h * 0.9;
}

function primalOverlayRawHeight(localX, localZ, sn) {
  const { poolLX, poolLZ, bermRadiusX, bermRadiusZ, gapCenter, gapHalf } = PRIMAL_SCENE_CFG;
  const px = localX - poolLX;
  const pz = localZ - poolLZ;

  const ex = px / bermRadiusX;
  const ez = pz / bermRadiusZ;
  const er = Math.sqrt(ex * ex + ez * ez);
  const ang = Math.atan2(pz, px);
  const gapDelta = Math.abs(primalAngleDelta(ang, gapCenter));
  const gapMask = primalSmoothstep(gapHalf - 0.10, gapHalf + 0.16, gapDelta);
  const sideBoost = primalSmoothstep(gapHalf + 0.02, gapHalf + 0.18, gapDelta);

  const ringNoiseA = (sn(px * 0.080 + 4.0, pz * 0.080 - 9.0) * 0.5 + 0.5);
  const ringNoiseB = primalRidged(sn, px * 0.120 - 8.0, pz * 0.120 + 3.0);
  const ringNoiseC = (sn(px * 0.220 + 1.0, pz * 0.220 - 6.0) * 0.5 + 0.5);
  const angularBias = 0.72 + 0.24 * Math.cos(ang - 0.30) + 0.10 * Math.cos(ang * 2.0 + 1.1);
  const ringCenter = 1.02 + angularBias * 0.12 + (ringNoiseA - 0.5) * 0.10;
  const ringWidth = 0.12 + ringNoiseC * 0.035;

  const bermCore = Math.exp(-Math.pow((er - ringCenter) / ringWidth, 2.0));
  const bermOuter = Math.exp(-Math.pow((er - (ringCenter + 0.12 + ringNoiseB * 0.05)) / (0.18 + ringNoiseA * 0.05), 2.0));
  const innerShelf = Math.exp(-Math.pow((er - 0.84) / 0.18, 2.0));
  const basinFalloff = Math.exp(-Math.pow(er / 0.92, 2.4));

  let h = 0;
  h += bermCore * (1.10 + ringNoiseB * 0.42) * gapMask;
  h += bermOuter * (0.44 + ringNoiseA * 0.16) * gapMask;
  h += innerShelf * (0.12 + ringNoiseC * 0.06) * gapMask;

  const landingMask = Math.exp(-(((px - 0.35) / 7.2) ** 2 + (pz / 4.9) ** 2));
  const cragDamp = 1.0 - landingMask * 0.78;
  const approachDamp = 1.0 - landingMask * 0.58;

  const cragA = primalRidged(sn, px * 0.22 + 11.0, pz * 0.22 - 2.0) * 0.34 * cragDamp;
  const cragB = primalRidged(sn, px * 0.38 - 7.0, pz * 0.38 + 5.0) * 0.18 * cragDamp;
  const facets = Math.max(0, sn(px * 0.42 + 2.0, pz * 0.42 - 4.0)) * 0.12 * cragDamp;
  h += bermCore * (cragA + cragB + facets) * gapMask;

  const mouthNorth = Math.exp(-(((px + 12.0) / 3.8) ** 2 + ((pz - 5.7) / 2.2) ** 2));
  const mouthSouth = Math.exp(-(((px + 12.0) / 3.8) ** 2 + ((pz + 5.7) / 2.2) ** 2));
  const flankNorth = Math.exp(-(((px - 1.5) / 7.2) ** 2 + ((pz - 10.2) / 2.8) ** 2));
  const flankSouth = Math.exp(-(((px - 1.2) / 7.0) ** 2 + ((pz + 10.0) / 2.8) ** 2));
  const backRise = Math.exp(-(((px - 13.0) / 4.2) ** 2 + (pz / 5.2) ** 2));
  h += (mouthNorth * 0.78 + mouthSouth * 0.78 + flankNorth * 0.36 + flankSouth * 0.34 + backRise * 0.24) * approachDamp;
  h += sideBoost * bermCore * 0.22;

  h -= basinFalloff * 0.10;

  const poolRadiusX = 7.4, poolRadiusZ = 4.6;
  const poolEx = px / poolRadiusX;
  const poolEz = pz / poolRadiusZ;
  const poolEr = Math.sqrt(poolEx * poolEx + poolEz * poolEz);
  const poolLip = Math.exp(-Math.pow((poolEr - 1.0) / 0.12, 2.0));
  const walkShelf = Math.exp(-Math.pow((er - 0.66) / 0.16, 2.0));
  const beamClear = Math.exp(-(((px - 0.15) / 5.8) ** 2 + (pz / 3.7) ** 2));
  h += walkShelf * 0.05;
  h += poolLip * 0.035;
  h *= 1.0 - beamClear * 0.18;
  h -= beamClear * 0.035;
  h -= Math.exp(-Math.pow(poolEr / 0.92, 2.6)) * 0.15;

  const fadeX = primalSmoothstep(20.6, 15.4, Math.abs(localX));
  const fadeZ = primalSmoothstep(15.4, 11.2, Math.abs(localZ));
  const terrainFade = Math.min(fadeX, fadeZ);

  return h * terrainFade;
}

function primalOverlayHeight(localX, localZ, sn) {
  const raw = primalOverlayRawHeight(localX, localZ, sn);
  const px = localX - PRIMAL_SCENE_CFG.poolLX;
  const pz = localZ - PRIMAL_SCENE_CFG.poolLZ;
  const warpGuard = Math.exp(-(((px - 0.35) / 6.8) ** 2 + (pz / 4.6) ** 2));
  if (warpGuard < 0.001) return raw;

  const step = 0.34;
  const avg = (
    raw * 4.0 +
    primalOverlayRawHeight(localX - step, localZ, sn) +
    primalOverlayRawHeight(localX + step, localZ, sn) +
    primalOverlayRawHeight(localX, localZ - step, sn) +
    primalOverlayRawHeight(localX, localZ + step, sn)
  ) / 8.0;

  return raw * (1.0 - warpGuard * 0.72) + avg * (warpGuard * 0.72);
}

function primalSceneHeight(worldX, worldZ, sn) {
  const localX = worldX - PRIMAL_SCENE_CFG.CX;
  const localZ = worldZ - PRIMAL_SCENE_CFG.CZ;
  return primalBaseGroundHeight(worldX, worldZ, sn) + primalOverlayHeight(localX, localZ, sn);
}

AFRAME.registerComponent('primal-anchor', {
  schema: {
    x: { type: 'number', default: 0 },
    z: { type: 'number', default: 0 },
    yOffset: { type: 'number', default: 0 }
  },
  init: function () {
    this._place = this._place.bind(this);
    this.el.sceneEl.addEventListener('loaded', this._place);
    this._place();
  },
  update: function () {
    this._place();
  },
  _place: function () {
    const sn = (window._snoise && window._snoise.simplex2) ? window._snoise.simplex2 : () => 0;
    const y = primalSceneHeight(this.data.x, this.data.z, sn) + this.data.yOffset;
    this.el.object3D.position.set(this.data.x, y, this.data.z);
  },
  remove: function () {
    if (this.el.sceneEl) this.el.sceneEl.removeEventListener('loaded', this._place);
  }
});

AFRAME.registerComponent('face-point-y', {
  schema: {
    x: { type: 'number', default: 0 },
    z: { type: 'number', default: 0 },
    yawOffset: { type: 'number', default: 0 }
  },
  init: function () {
    this._face = this._face.bind(this);
    this.el.sceneEl.addEventListener('loaded', this._face);
    this.el.addEventListener('model-loaded', this._face);
    this._face();
  },
  update: function () {
    this._face();
  },
  _face: function () {
    const pos = this.el.object3D.position;
    const dx = this.data.x - pos.x;
    const dz = this.data.z - pos.z;
    const yaw = THREE.MathUtils.radToDeg(Math.atan2(dx, dz)) + this.data.yawOffset;
    this.el.object3D.rotation.set(0, THREE.MathUtils.degToRad(yaw), 0);
  },
  remove: function () {
    if (!this.el.sceneEl) return;
    this.el.sceneEl.removeEventListener('loaded', this._face);
    this.el.removeEventListener('model-loaded', this._face);
  }
});

AFRAME.registerComponent('play-gltf-clip', {
  schema: {
    clip: { type: 'string', default: '' },
    clipIndex: { type: 'int', default: 0 },
    randomStart: { type: 'boolean', default: true },
    seed: { type: 'number', default: 0 }
  },
  init: function () {
    this.mixer = null;
    this.action = null;
    this._onModelLoaded = (e) => {
      const model = this.el.getObject3D('mesh');
      if (!model) return;
      const clips = (model.animations && model.animations.length) ? model.animations : ((e.detail && e.detail.model && e.detail.model.animations) || []);
      if (!clips || !clips.length) return;
      let clip = null;
      if (this.data.clip) clip = clips.find((c) => c && c.name === this.data.clip) || null;
      if (!clip) clip = clips[Math.max(0, Math.min(clips.length - 1, this.data.clipIndex))] || clips[0];
      if (!clip) return;
      this.mixer = new THREE.AnimationMixer(model);
      this.action = this.mixer.clipAction(clip);
      this.action.reset();
      this.action.setLoop(THREE.LoopRepeat, Infinity);
      this.action.play();
      if (this.data.randomStart && clip.duration > 0) {
        const normalizedSeed = Math.abs(this.data.seed % 1);
        this.action.time = normalizedSeed * clip.duration;
      }
    };
    this.el.addEventListener('model-loaded', this._onModelLoaded);
  },
  tick: function (t, dt) {
    if (this.mixer) this.mixer.update((dt || 0) / 1000);
  },
  remove: function () {
    this.el.removeEventListener('model-loaded', this._onModelLoaded);
    if (this.action) {
      this.action.stop();
      this.action = null;
    }
    this.mixer = null;
  }
});

AFRAME.registerComponent('play-gltf-anim', {
  init: function () {
    this.mixer = null;
    this.actions = [];
    this.el.addEventListener('model-loaded', (e) => {
      const model = this.el.getObject3D('mesh');
      if (!model) return;
      const clips = (model.animations && model.animations.length) ? model.animations : ((e.detail && e.detail.model && e.detail.model.animations) || []);
      if (!clips || !clips.length) return;
      this.mixer = new THREE.AnimationMixer(model);
      this.actions = clips.map((clip) => {
        const a = this.mixer.clipAction(clip);
        a.reset();
        a.setLoop(THREE.LoopRepeat, Infinity);
        a.play();
        a.time = Math.random() * clip.duration;
        return a;
      });
    });
  },
  tick: function (t, dt) {
    if (this.mixer) this.mixer.update((dt || 0) / 1000);
  }
});

AFRAME.registerComponent('hand-clamp', {
  schema: {
    minY:    { type: 'number',  default: 0.84  },
    smooth:  { type: 'number',  default: 0.92  },
    fingers: { type: 'boolean', default: true   }
  },
  init: function () {
    this._handBones   = [];
    this._fingerBones = [];
    this._wP = new THREE.Vector3();
    const find = () => {
      this._handBones   = [];
      this._fingerBones = [];
      const mesh = this.el.getObject3D('mesh');
      if (!mesh) return;
      mesh.traverse((n) => {
        if (!n.isBone || !n.name) return;
        const nm = n.name;
        if (/^(mixamorig:?)?(Left|Right)Hand$/i.test(nm)) {
          this._handBones.push(n);
          return;
        }
        if (this.data.fingers && /(Thumb|Index|Middle|Ring|Little|Pinky)\d/i.test(nm) &&
            /(Left|Right)/i.test(nm)) {
          this._fingerBones.push(n);
        }
      });
    };
    this.el.addEventListener('model-loaded', find);
  },
  tick: function () {
    const minY = this.data.minY;
    const sm   = this.data.smooth;
    const wp   = this._wP;
    for (let i = 0; i < this._handBones.length; i++) {
      const b = this._handBones[i];
      b.getWorldPosition(wp);
      if (wp.y < minY) b.position.y += (minY - wp.y) * sm;
    }
    if (this.data.fingers) {
      for (let i = 0; i < this._fingerBones.length; i++) {
        const b = this._fingerBones[i];
        b.getWorldPosition(wp);
        if (wp.y < minY) b.position.y += (minY - wp.y) * sm;
      }
    }
  }
});


// ── Loading overlay with progress bar ────────────────────────────────────────
(function () {
  const overlay = document.getElementById('fadeIn');
  const fill = document.getElementById('loadingBarFill');
  const status = document.getElementById('loadingStatus');
  const percent = document.getElementById('loadingPercent');
  const scene = document.querySelector('a-scene');
  const assets = document.getElementById('sceneAssets');
  if (!overlay || !fill || !status || !percent) return;

  const MIN_VISIBLE_MS = 700;
  const startedAt = performance.now();
  let sceneReady = false;
  let faded = false;

  const trackedAssets = assets ? Array.from(assets.children).filter(el => {
    if (!el || !el.tagName) return false;
    const tag = el.tagName.toLowerCase();
    return tag === 'img' || tag === 'audio' || tag === 'video' || tag === 'a-asset-item';
  }) : [];
  const total = Math.max(trackedAssets.length, 1);
  let done = 0;
  const seen = new WeakSet();

  function setProgress(value, label){
    const clamped = Math.max(0, Math.min(100, value));
    fill.style.width = clamped + '%';
    percent.textContent = Math.round(clamped) + '%';
    if (label) status.textContent = label;
  }

  function markDone(el){
    if (!el || seen.has(el)) return;
    seen.add(el);
    done += 1;
    const progress = (done / total) * 100;
    setProgress(progress, done >= total ? 'Finalizing scene' : `Loading assets ${done}/${total}`);
    maybeFinish();
  }

  function watchAsset(el){
    if (!el) return;
    const tag = (el.tagName || '').toLowerCase();
    if (tag === 'img' && el.complete) return markDone(el);
    if ((tag === 'audio' || tag === 'video') && el.readyState >= 1) return markDone(el);
    if (tag === 'a-asset-item' && el.hasLoaded) return markDone(el);

    const onReady = () => markDone(el);
    el.addEventListener('load', onReady, { once: true });
    el.addEventListener('loadeddata', onReady, { once: true });
    el.addEventListener('canplaythrough', onReady, { once: true });
    el.addEventListener('loaded', onReady, { once: true });
    el.addEventListener('error', onReady, { once: true });
  }

  function fade(){
    if (faded) return;
    faded = true;
    setProgress(100, 'Ready');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      overlay.classList.add('done');
      setTimeout(() => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 1100);
    }));
  }

  function maybeFinish(){
    if (!sceneReady || done < total) return;
    const elapsed = performance.now() - startedAt;
    const wait = Math.max(0, MIN_VISIBLE_MS - elapsed);
    window.setTimeout(fade, wait);
  }

  setProgress(0, 'Preparing assets');
  trackedAssets.forEach(watchAsset);
  if (!trackedAssets.length) done = total;

  if (scene) {
    if (scene.hasLoaded) sceneReady = true;
    else scene.addEventListener('loaded', () => { sceneReady = true; maybeFinish(); }, { once: true });
  } else {
    window.addEventListener('load', () => { sceneReady = true; maybeFinish(); }, { once: true });
  }

  // Keep the user informed during long loads and fail open if one asset stalls.
  window.setTimeout(() => {
    if (done < total) setProgress((done / total) * 100, 'Still loading large assets');
  }, 2500);
  window.setTimeout(() => {
    if (done < total) {
      done = total;
      setProgress(96, 'Starting scene');
      maybeFinish();
    }
  }, 45000);

  maybeFinish();
})();

// ── Quit UI — matches aya.dev ─────────────────────────────────────────────────
(function () {
  const QUIT    = document.getElementById('quitBtn');
  const QC      = document.getElementById('quitConfirm');
  const Q_CANCEL= document.getElementById('quitCancel');
  const Q_OK    = document.getElementById('quitConfirmBtn');

  function openQuitConfirm()  { if (!QC) return; QC.classList.add('show');    QC.setAttribute('aria-hidden','false'); }
  function closeQuitConfirm() { if (!QC) return; QC.classList.remove('show'); QC.setAttribute('aria-hidden','true');  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && QC && QC.classList.contains('show')) closeQuitConfirm();
  }, { passive: true });

  if (QUIT)     QUIT.addEventListener('click', openQuitConfirm);
  if (Q_CANCEL) Q_CANCEL.addEventListener('click', closeQuitConfirm);
  if (QC)       QC.addEventListener('click', (e) => { if (e.target === QC) closeQuitConfirm(); });
  if (Q_OK)     Q_OK.addEventListener('click', () => { window.location.href = 'https://www.enricopoli.com/pagex'; });
})();
</script>

<script>
(function(){
  const EMPTY_STATIONS = ['station_SE_01','station_SW_01','station_NW_02','station_NE_03','station_SW_03'];
  const LIA_IFRAME_SRC = './lia_1_0_experience.html';
  const state = { mode:'idle', active:null, overlayOpen:false, saved:null, anim:0 };
  const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
  const qA = new THREE.Quaternion();
  let scene, rig, cam, guide, guideMain, guideSub, overlay, frame;
  let terminals = [];

  function $(id){ return document.getElementById(id); }
  function init(){
    scene = document.querySelector('a-scene');
    rig = $('rig');
    cam = $('playerCam');
    guide = $('terminalGuide'); guideMain = $('terminalGuideMain'); guideSub = $('terminalGuideSub');
    overlay = $('liaOverlay'); frame = $('liaOverlayFrame');
    if (!scene || !rig || !cam) return;
    collectTerminals();
    window.addEventListener('keydown', onKeyDown, {passive:false});
    window.addEventListener('message', onMessage);
    requestAnimationFrame(tick);
  }

  function collectTerminals(){
    terminals = [];
    EMPTY_STATIONS.forEach(id=>{
      const station = $(id);
      if (!station) return;
      const computer = station.querySelector('.computer');
      if (!computer) return;
      terminals.push({ id, station, computer });
    });
  }

  function showGuide(main, sub=''){
    if (!guide) return;
    guideMain.textContent = main || '';
    guideSub.textContent = sub || '';
    guide.classList.add('show');
  }
  function hideGuide(){ if (guide) guide.classList.remove('show'); }

  function getYawPitchObjects(){
    const lc = cam.components && cam.components['look-controls'];
    return lc ? { lc, yaw: lc.yawObject, pitch: lc.pitchObject } : null;
  }
  function getCamWorldPos(){ return cam.object3D.getWorldPosition(vA.clone()); }
  function getTerminalWorldPoint(t){
    return t.computer.object3D.getWorldPosition(vA.clone());
  }
  function getSeatWorldPoint(t){
    return t.station.object3D.localToWorld(new THREE.Vector3(0,0,0.95));
  }
  function yawToFace(from, to){
    const dx = to.x - from.x, dz = to.z - from.z;
    return Math.atan2(-dx, -dz);
  }
  function pitchToFace(camY, fromXZ, to, eyeHeight){
    const dx = to.x - fromXZ.x, dz = to.z - fromXZ.z;
    const dy = (to.y) - (camY + eyeHeight);
    const horiz = Math.max(0.001, Math.hypot(dx,dz));
    return Math.max(-1.1, Math.min(0.45, Math.atan2(dy, horiz)));
  }
  function nearestTerminal(){
    const rp = rig.object3D.position;
    let best=null, bestD=1e9;
    for (const t of terminals){
      const seat = getSeatWorldPoint(t);
      const d = Math.hypot(seat.x-rp.x, seat.z-rp.z);
      if (d < bestD){ bestD = d; best = t; }
    }
    if (!best || bestD > 2.1) return null;
    return { term: best, dist: bestD };
  }

  function isFacingActive(){
    if (!state.active) return false;
    const camPos = getCamWorldPos();
    const target = getTerminalWorldPoint(state.active);
    const dir = target.sub(camPos).setY(0).normalize();
    const yp = getYawPitchObjects();
    const lcYaw = yp && yp.yaw ? yp.yaw.rotation.y : 0;
    const totalYaw = lcYaw + rig.object3D.rotation.y;
    vB.set(-Math.sin(totalYaw), 0, -Math.cos(totalYaw)).normalize();
    return dir.dot(vB) > 0.84;
  }

  function onKeyDown(e){
    if (state.overlayOpen){
      if (e.code === 'Escape'){ e.preventDefault(); closeOverlay(); }
      return;
    }
    if (state.mode === 'near' && e.code === 'KeyE'){
      e.preventDefault(); startSit(); return;
    }
    if (state.mode === 'seated'){
      if (e.code === 'Escape'){ e.preventDefault(); standUp(); return; }
      if (e.code === 'KeyF' && isFacingActive()){ e.preventDefault(); openOverlay(); return; }
    }
    if (state.mode === 'autopilot' && e.code === 'Escape'){ e.preventDefault(); standUp(true); }
  }

  function pauseWalk(pause){
    const rw = rig.components && rig.components['rig-walk'];
    if (!rw) return;
    if (pause && rw.pause) rw.pause();
    if (!pause && rw.play) rw.play();
  }

  function startSit(){
    if (!state.active || state.mode === 'autopilot') return;
    const yp = getYawPitchObjects(); if (!yp) return;
    const rp = rig.object3D.position;
    state.saved = {
      rigX: rp.x, rigY: rp.y, rigZ: rp.z,
      yaw: yp.yaw ? yp.yaw.rotation.y : 0,
      pitch: yp.pitch ? yp.pitch.rotation.x : 0,
      camY: cam.object3D.position.y
    };
    const seat = getSeatWorldPoint(state.active);
    const target = getTerminalWorldPoint(state.active);
    const start = { x: rp.x, z: rp.z, y: cam.object3D.position.y, yaw: state.saved.yaw, pitch: state.saved.pitch };
    const rigYaw = rig.object3D.rotation.y;
    const end = {
      x: seat.x, z: seat.z, y: 1.18,
      yaw: yawToFace({x:seat.x,z:seat.z}, target) - rigYaw,
      pitch: pitchToFace(rig.object3D.position.y, {x:seat.x,z:seat.z}, target, 1.18)
    };
    state.mode = 'autopilot';
    pauseWalk(true);
    animate(900, (k)=>{
      const s = k*k*(3-2*k);
      rig.object3D.position.x = start.x + (end.x-start.x)*s;
      rig.object3D.position.z = start.z + (end.z-start.z)*s;
      cam.object3D.position.y = start.y + (end.y-start.y)*s;
      if (yp.yaw) yp.yaw.rotation.y = lerpAngle(start.yaw,end.yaw,s);
      if (yp.pitch) yp.pitch.rotation.x = start.pitch + (end.pitch-start.pitch)*s;
    }, ()=>{
      state.mode = 'seated';
    });
  }

  function standUp(fromAuto){
    if (!state.saved) { state.mode = 'idle'; state.active = null; pauseWalk(false); hideGuide(); return; }
    const yp = getYawPitchObjects(); if (!yp) return;
    const rp = rig.object3D.position;
    const start = { x: rp.x, z: rp.z, y: cam.object3D.position.y, yaw: yp.yaw?yp.yaw.rotation.y:0, pitch: yp.pitch?yp.pitch.rotation.x:0 };
    const end = { x: state.saved.rigX, z: state.saved.rigZ, y: state.saved.camY, yaw: state.saved.yaw, pitch: state.saved.pitch };
    state.mode = 'autopilot';
    animate(fromAuto ? 300 : 500, (k)=>{
      const s = k*k*(3-2*k);
      rig.object3D.position.x = start.x + (end.x-start.x)*s;
      rig.object3D.position.z = start.z + (end.z-start.z)*s;
      cam.object3D.position.y = start.y + (end.y-start.y)*s;
      if (yp.yaw) yp.yaw.rotation.y = lerpAngle(start.yaw,end.yaw,s);
      if (yp.pitch) yp.pitch.rotation.x = start.pitch + (end.pitch-start.pitch)*s;
    }, ()=>{
      pauseWalk(false);
      state.mode = 'idle';
      state.active = null;
      hideGuide();
    });
  }

  function animate(ms, step, done){
    cancelAnimationFrame(state.anim);
    const t0 = performance.now();
    function loop(now){
      const k = Math.min(1, (now-t0)/ms);
      step(k);
      if (k < 1) state.anim = requestAnimationFrame(loop); else { state.anim = 0; if (done) done(); }
    }
    state.anim = requestAnimationFrame(loop);
  }
  function lerpAngle(a,b,t){
    let d = b-a; while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2; return a + d*t;
  }

  function openOverlay(){
    if (!overlay || !frame) return;
    state.overlayOpen = true;
    if (document.pointerLockElement) document.exitPointerLock?.();
    if (!frame.dataset.loaded){ frame.src = LIA_IFRAME_SRC; frame.dataset.loaded='1'; }
    overlay.classList.add('show');
    hideGuide();
  }
  function closeOverlay(){
    if (!overlay) return;
    state.overlayOpen = false;
    overlay.classList.remove('show');
    state.mode = 'seated';
  }
  function onMessage(ev){
    if (!ev || !ev.data) return;
    const t = ev.data.type;
    if (t === 'LIA_EXIT') closeOverlay();
    if (t === 'LIA_RESTART' && frame){
      try { frame.contentWindow.location.reload(); } catch(_) { frame.src = LIA_IFRAME_SRC; }
    }
  }

  function tick(){
    if (!scene || !rig || !cam) { requestAnimationFrame(tick); return; }
    if (!state.overlayOpen && state.mode !== 'autopilot') {
      if (state.mode === 'seated') {
        if (isFacingActive()) showGuide('Press F to initiate experience', 'Press ESC to stand up');
        else showGuide('Face the computer', 'Press ESC to stand up');
      } else {
        const near = nearestTerminal();
        if (near) {
          state.mode = 'near';
          state.active = near.term;
          showGuide('Press E to sit down', 'Available terminal');
        } else {
          state.mode = 'idle';
          state.active = null;
          hideGuide();
        }
      }
    }
    requestAnimationFrame(tick);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>



<script>
(function(){
  const videoIds = [
    'lia_video_monolith_04',
    'lia_video_monolith_01',
    'lia_video_monolith_02',
    'lia_video_monolith_03',
    'lia_video_monolith_05',
    'lia_video_monolith_06',
    'lia_video_monolith_07',
    'lia_video_monolith_08',
    'lia_video_monolith_09'
  ];

  const spatialCfg = {
    volume: 0.16,
    refDistance: 1.1,
    maxDistance: 8,
    rolloffFactor: 4.2,
    distanceModel: 'exponential',
    coneInner: 38,
    coneOuter: 82,
    coneOuterGain: 0.01
  };

  let initialized = false;

  function resumeAudioContext() {
    const sceneEl = document.querySelector('a-scene');
    const ctx = sceneEl && sceneEl.audioListener && sceneEl.audioListener.context;
    if (ctx && ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
  }

  function prepareMediaElements() {
    videoIds.forEach(id => {
      const v = document.getElementById(id);
      if (!v) return;
      v.loop = true;
      v.volume = 1.0;
      v.muted = true;
      v.defaultMuted = true;
      v.setAttribute('muted', 'muted');
      v.setAttribute('playsinline', 'playsinline');
      const p = v.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    });
  }

  function attachSpatialAudio() {
    document.querySelectorAll('a-video[id^="monolith_"]').forEach(vPlane => {
      try {
        if (vPlane.dataset.spatialReady === '1') return;
        const src = vPlane.getAttribute('src');
        if (!src) return;

        vPlane.removeAttribute('sound');
        vPlane.setAttribute('sound', [
          `src: ${src}`,
          'autoplay: true',
          'loop: true',
          'positional: true',
          `volume: ${spatialCfg.volume}`,
          `refDistance: ${spatialCfg.refDistance}`,
          `maxDistance: ${spatialCfg.maxDistance}`,
          `rolloffFactor: ${spatialCfg.rolloffFactor}`,
          `distanceModel: ${spatialCfg.distanceModel}`
        ].join('; '));

        const finalize = () => {
          const soundCmp = vPlane.components && vPlane.components.sound;
          const positional = soundCmp && soundCmp.pool && soundCmp.pool.children && soundCmp.pool.children[0];
          if (!positional) return false;
          if (typeof positional.setDirectionalCone === 'function') {
            positional.setDirectionalCone(spatialCfg.coneInner, spatialCfg.coneOuter, spatialCfg.coneOuterGain);
          }
          if (positional.gain && positional.gain.gain) positional.gain.gain.value = spatialCfg.volume;
          if (soundCmp && typeof soundCmp.playSound === 'function') soundCmp.playSound();
          vPlane.dataset.spatialReady = '1';
          return true;
        };

        if (!finalize()) {
          setTimeout(finalize, 0);
          setTimeout(finalize, 200);
          setTimeout(finalize, 600);
        }
      } catch (e) {}
    });
  }

  function initSpatialVideos() {
    resumeAudioContext();
    prepareMediaElements();
    attachSpatialAudio();
    initialized = true;
  }

  function startOnce() {
    if (!initialized) initSpatialVideos();
    else {
      resumeAudioContext();
      prepareMediaElements();
      document.querySelectorAll('a-video[id^="monolith_"]').forEach(vPlane => {
        try {
          const soundCmp = vPlane.components && vPlane.components.sound;
          if (soundCmp && typeof soundCmp.playSound === 'function') soundCmp.playSound();
        } catch (e) {}
      });
    }
  }

  document.addEventListener('DOMContentLoaded', startOnce, { once: true });
  window.addEventListener('load', () => setTimeout(startOnce, 250), { once: true });
  ['click','touchstart','keydown'].forEach(evt => {
    window.addEventListener(evt, startOnce, { once: true, passive: true });
  });
})();
</script>
