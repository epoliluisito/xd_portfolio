    if (mesh && mesh.material && mesh.material.userData && mesh.material.userData.__segClip) {
      this._setUniforms(mesh.material);
    }
  },
  apply: function () {
    if (this._applied) return;
    const mesh = this.el.getObject3D('mesh');
    if (!mesh || !mesh.material) return;

    const material = mesh.material;
    // Some entities can have an array of materials; handle both.
    const mats = Array.isArray(material) ? material : [material];

    mats.forEach((mat) => {
      if (!mat || mat.userData.__segClip) return;

      mat.userData.__segClip = true;

      mat.onBeforeCompile = (shader) => {
        // Declare varyings + uniforms
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            '#include <common>\nvarying vec3 vSegClipWorldPos;'
          )
          .replace(
            '#include <worldpos_vertex>',
            '#include <worldpos_vertex>\nvSegClipWorldPos = worldPosition.xyz;'
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            '#include <common>\n' +
            'varying vec3 vSegClipWorldPos;\n' +
            'uniform mat4 uSegClipInvModel;\n' +
            'uniform vec4 uSegClipAngles; // phiStart, phiEnd, thetaStart, thetaEnd (radians)\n' +
            'const float SEGCLIP_PI = 3.141592653589793;\n'
          )
          .replace(
            '#include <clipping_planes_fragment>',
            '#include <clipping_planes_fragment>\n' +
            'vec3 lp = (uSegClipInvModel * vec4(vSegClipWorldPos, 1.0)).xyz;\n' +
            'vec3 pn = normalize(lp);\n' +
            'float theta = acos(clamp(pn.y, -1.0, 1.0));\n' +
            'float phi = atan(pn.z, pn.x);\n' +
            'if (phi < 0.0) phi += 2.0 * SEGCLIP_PI;\n' +
            'if (phi < uSegClipAngles.x || phi > uSegClipAngles.y || theta < uSegClipAngles.z || theta > uSegClipAngles.w) discard;\n'
          );

        // Uniforms
        shader.uniforms.uSegClipInvModel = { value: new THREE.Matrix4() };
        shader.uniforms.uSegClipAngles   = { value: new THREE.Vector4() };

        // Store for updates (e.g., if renderer recompiles)
        mat.userData.__segClipShader = shader;

        // Set initial values
        this._setUniforms(mat);
      };

      // Force recompile
      mat.needsUpdate = true;
    });

    this._applied = true;
  },
  _setUniforms: function (mat) {
    const shader = mat.userData.__segClipShader;
    if (!shader) return;

    // Inverse model matrix (local from world)
    const mesh = this.el.getObject3D('mesh');
    mesh.updateMatrixWorld(true);
    const invModel = new THREE.Matrix4().copy(mesh.matrixWorld).invert();
    shader.uniforms.uSegClipInvModel.value.copy(invModel);

    // Angles (degrees -> radians)
    const d = this.data;
    const toRad = THREE.MathUtils.degToRad;
    const phiStart  = toRad(d.phiStart);
    const phiEnd    = toRad(d.phiStart + d.phiLength);
    const thetaStart= toRad(d.thetaStart);
    const thetaEnd  = toRad(d.thetaStart + d.thetaLength);
    shader.uniforms.uSegClipAngles.value.set(phiStart, phiEnd, thetaStart, thetaEnd);
  }
});


// Additional clip: discards fragments inside a cylinder volume (used to "punch" a tunnel hole without geometry booleans).
// Designed to compose with other onBeforeCompile modifiers (e.g., spherical-segment-clip).
AFRAME.registerComponent('cylindrical-clip', {
  schema: {
    target:     { type: 'selector' },
    radius:     { type: 'number', default: 1.0 },
    halfLength: { type: 'number', default: 2.0 } // along local X
  },
  init: function () {
    this._applied = false;
    this._inv = new THREE.Matrix4();
    this._mats = [];
    this._apply = this._apply.bind(this);

    this.el.addEventListener('object3dset', (e) => {
      if (e.detail && e.detail.type === 'mesh') this._apply();
    });

    // Attempt immediately; if materials aren't ready, tick will retry.
    this._apply();
  },
  remove: function () {},
  _apply: function () {
    if (this._applied) return;

    const mesh = this.el.getObject3D('mesh');
    if (!mesh || !mesh.material) return;

    const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];

    mats.forEach((mat) => {
      if (!mat || mat.userData.__cylClip) return;
      mat.userData.__cylClip = true;

      const prev = mat.onBeforeCompile;

      mat.onBeforeCompile = (shader) => {
        if (typeof prev === 'function') prev(shader);

        // Vertex: worldpos varying
        if (shader.vertexShader.indexOf('vCylClipWorldPos') === -1) {
          shader.vertexShader = shader.vertexShader
            .replace('#include <common>', '#include <common>\nvarying vec3 vCylClipWorldPos;')
            .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvCylClipWorldPos = worldPosition.xyz;');
        }

        // Fragment: uniforms + discard
        if (shader.fragmentShader.indexOf('vCylClipWorldPos') === -1) {
          shader.fragmentShader = shader.fragmentShader
            .replace(
              '#include <common>',
              '#include <common>\n' +
              'varying vec3 vCylClipWorldPos;\n' +
              'uniform mat4 uCylClipInv;\n' +
              'uniform vec2 uCylClipParams; // radius, halfLength\n'
            );
        }

        // Insert discard test after clipping planes block (composes cleanly with existing discards).
        if (shader.fragmentShader.indexOf('uCylClipInv') !== -1 &&
            shader.fragmentShader.indexOf('CylClip_TEST') === -1) {
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <clipping_planes_fragment>',
            '#include <clipping_planes_fragment>\n' +
            '// CylClip_TEST\n' +
            'vec3 cp = (uCylClipInv * vec4(vCylClipWorldPos, 1.0)).xyz;\n' +
            'float cylR = uCylClipParams.x;\n' +
            'float cylHL = uCylClipParams.y;\n' +
            'if (abs(cp.x) <= cylHL && length(cp.yz) <= cylR) discard;\n'
          );
        }

        shader.uniforms.uCylClipInv = { value: new THREE.Matrix4() };
        shader.uniforms.uCylClipParams = { value: new THREE.Vector2(this.data.radius, this.data.halfLength) };

        mat.userData.__cylClipShader = shader;
      };

      mat.needsUpdate = true;
      this._mats.push(mat);
    });

    this._applied = true;
  },
  tick: function () {
    if (!this._applied) this._apply();

    const tgt = this.data.target;
    if (!tgt || !tgt.object3D) return;

    tgt.object3D.updateMatrixWorld(true);
    const inv = this._inv.copy(tgt.object3D.matrixWorld).invert();

    for (let i = 0; i < this._mats.length; i++) {
      const mat = this._mats[i];
      const sh = mat && mat.userData && mat.userData.__cylClipShader;
      if (!sh) continue;
      sh.uniforms.uCylClipInv.value.copy(inv);
      sh.uniforms.uCylClipParams.value.set(this.data.radius, this.data.halfLength);
    }
  }
});


// Seam cover: tiny sand clumps (instanced) to break up a floor seam edge.
// IMPORTANT: This is purely visual (no collider class) and intentionally lightweight (single InstancedMesh).

// Cylindrical clip (MULTI): punch multiple cylindrical bores (same radius/halfLength) into a mesh.
// Usage: cylindrical-clip-multi="targets: #cutA, #cutB, #cutC; radius: 1.34; halfLength: 4.20"
AFRAME.registerComponent('cylindrical-clip-multi', {
  schema: {
    targets:    { type: 'string', default: '' },  // comma-separated selectors
    radius:     { type: 'number', default: 1.0 },
    halfLength: { type: 'number', default: 2.0 }  // along local X
  },

  init: function () {
    this._applied = false;
    this._inv = new THREE.Matrix4();
    this._mats = [];
    this._targets = [];
    this._apply = this._apply.bind(this);
    this._parseTargets();

    this.el.addEventListener('object3dset', (e) => {
      if (e.detail && e.detail.type === 'mesh') this._apply();
    });

    this._apply();
  },

  update: function () {
    this._parseTargets();
  },

  _parseTargets: function () {
    const raw = (this.data.targets || '').trim();
    const parts = raw ? raw.split(',').map(s => s.trim()).filter(Boolean) : [];
    const scene = this.el.sceneEl;
    this._targets = parts.slice(0, 3).map(sel => scene && scene.querySelector ? scene.querySelector(sel) : document.querySelector(sel)).filter(Boolean);
  },

  _apply: function () {
    if (this._applied) return;

    const mesh = this.el.getObject3D('mesh');
    if (!mesh || !mesh.material) return;

    const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];

    mats.forEach((mat) => {
      if (!mat || mat.userData.__cylClipMulti) return;
      mat.userData.__cylClipMulti = true;

      const prev = mat.onBeforeCompile;

      mat.onBeforeCompile = (shader) => {
        if (typeof prev === 'function') prev(shader);

        // Vertex: worldpos varying
        if (shader.vertexShader.indexOf('vCylClipWorldPos') === -1) {
          shader.vertexShader = shader.vertexShader
            .replace('#include <common>', '#include <common>\nvarying vec3 vCylClipWorldPos;')
            .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvCylClipWorldPos = worldPosition.xyz;');
        }

        // Fragment: uniforms + discard tests
        if (shader.fragmentShader.indexOf('vCylClipWorldPos') === -1) {
          shader.fragmentShader = shader.fragmentShader
            .replace(
              '#include <common>',
              '#include <common>\n' +
              'varying vec3 vCylClipWorldPos;\n' +
              'uniform mat4 uCylClipInv[3];\n' +
              'uniform vec2 uCylClipParams[3]; // radius, halfLength\n' +
              'uniform int uCylClipCount;\n'
            );
        }

        if (shader.fragmentShader.indexOf('CylClipMulti_TEST') === -1) {
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <clipping_planes_fragment>',
            '#include <clipping_planes_fragment>\n' +
            '// CylClipMulti_TEST\n' +
            'if (uCylClipCount > 0) {\n' +
            '  vec3 cp0 = (uCylClipInv[0] * vec4(vCylClipWorldPos, 1.0)).xyz;\n' +
            '  if (abs(cp0.x) <= uCylClipParams[0].y && length(cp0.yz) <= uCylClipParams[0].x) discard;\n' +
            '}\n' +
            'if (uCylClipCount > 1) {\n' +
            '  vec3 cp1 = (uCylClipInv[1] * vec4(vCylClipWorldPos, 1.0)).xyz;\n' +
            '  if (abs(cp1.x) <= uCylClipParams[1].y && length(cp1.yz) <= uCylClipParams[1].x) discard;\n' +
            '}\n' +
            'if (uCylClipCount > 2) {\n' +
            '  vec3 cp2 = (uCylClipInv[2] * vec4(vCylClipWorldPos, 1.0)).xyz;\n' +
            '  if (abs(cp2.x) <= uCylClipParams[2].y && length(cp2.yz) <= uCylClipParams[2].x) discard;\n' +
            '}\n'
          );
        }

        shader.uniforms.uCylClipInv = { value: [ new THREE.Matrix4(), new THREE.Matrix4(), new THREE.Matrix4() ] };
        shader.uniforms.uCylClipParams = { value: [ new THREE.Vector2(), new THREE.Vector2(), new THREE.Vector2() ] };
        shader.uniforms.uCylClipCount = { value: 0 };

        mat.userData.__cylClipMultiShader = shader;
      };

      mat.needsUpdate = true;
      this._mats.push(mat);
    });

    this._applied = true;
  },

  tick: function () {
    if (!this._applied) this._apply();

    // If DOM wasn't ready at init, re-try a few times.
    if ((!this._targets || !this._targets.length) && this.data.targets) this._parseTargets();

    const count = Math.min(3, (this._targets && this._targets.length) ? this._targets.length : 0);

    for (let i = 0; i < this._mats.length; i++) {
      const mat = this._mats[i];
      const sh = mat && mat.userData && mat.userData.__cylClipMultiShader;
      if (!sh) continue;

      sh.uniforms.uCylClipCount.value = count;

      for (let k = 0; k < 3; k++) {
        sh.uniforms.uCylClipParams.value[k].set(this.data.radius, this.data.halfLength);

        if (k >= count) {
          sh.uniforms.uCylClipInv.value[k].identity();
          continue;
        }

        const tgt = this._targets[k];
        if (!tgt || !tgt.object3D) {
          sh.uniforms.uCylClipInv.value[k].identity();
          continue;
        }

        tgt.object3D.updateMatrixWorld(true);
        const inv = this._inv.copy(tgt.object3D.matrixWorld).invert();
        sh.uniforms.uCylClipInv.value[k].copy(inv);
      }
    }
  }
});

// === Three.js layers helpers (to keep "outside" light strictly outside) ===
// Usage:
//  - three-layer="layer: 2" on meshes/lights you want isolated
//  - camera-enable-layer="layer: 2" on the camera entity to render that layer
AFRAME.registerComponent('three-layer', {
  schema: { layer: { type: 'int', default: 0 } },
  init: function () {
    const apply = () => {
      const layer = this.data.layer | 0;
      this.el.object3D.traverse((o) => {
        if (o && o.layers) o.layers.set(layer);
      });
    };
    this.el.addEventListener('object3dset', apply);
    // lights/cameras are also object3D children; apply immediately and after load.
    if (this.el.sceneEl && !this.el.sceneEl.hasLoaded) {
      this.el.sceneEl.addEventListener('loaded', () => setTimeout(apply, 0));
    }
    setTimeout(apply, 0);
  }
});

AFRAME.registerComponent('camera-enable-layer', {
  schema: { layer: { type: 'int', default: 2 } },
  init: function () {
    const apply = () => {
      const cam = this.el.getObject3D('camera');
      if (cam && cam.layers) cam.layers.enable(this.data.layer | 0);
    };
    this.el.addEventListener('object3dset', (e) => {
      if (e.detail && e.detail.type === 'camera') apply();
    });
    setTimeout(apply, 0);
  }
});


AFRAME.registerComponent('seam-grain-fringe', {
  schema: {
    // Copy the material maps from this element (usually #aya_dome_sand_floor)
    source: { type: 'selector' },

    // Elliptical band (in this entity's local XZ plane)
    radiusX: { type: 'number', default: 1.55 },
    radiusZ: { type: 'number', default: 2.90 },
    inward:  { type: 'number', default: 0.06 },
    outward: { type: 'number', default: 0.18 },

    // Distribution
    count: { type: 'int', default: 900 },
    seed:  { type: 'int', default: 931 },
    y:     { type: 'number', default: 0.014 },
    yJitter: { type: 'number', default: 0.010 },

    // Size (meters)
    scaleMin: { type: 'number', default: 0.008 },
    scaleMax: { type: 'number', default: 0.022 },
    heroEvery: { type: 'int', default: 65 },
    heroScaleMin: { type: 'number', default: 0.026 },
    heroScaleMax: { type: 'number', default: 0.038 }
  },

  init: function () {
    this._built = false;
    this._build = this._build.bind(this);

    // Build once the scene is ready (materials exist).
    if (this.el.sceneEl && this.el.sceneEl.hasLoaded) {
      setTimeout(this._build, 0);
    } else {
      this.el.sceneEl.addEventListener('loaded', () => setTimeout(this._build, 0));
    }
  },

  remove: function () {
    const mesh = this.el.getObject3D('mesh');
    if (mesh) {
      this.el.removeObject3D('mesh');
      mesh.geometry && mesh.geometry.dispose && mesh.geometry.dispose();
      mesh.material && mesh.material.dispose && mesh.material.dispose();
    }
  },

  _build: function () {
    if (this._built) return;
    this._built = true;

    const THREE = AFRAME.THREE;
    const d = this.data;

    // Deterministic RNG
    let s = (d.seed | 0) >>> 0;
    const rnd = () => {
      // xorshift32
      s ^= (s << 13) >>> 0;
      s ^= (s >>> 17) >>> 0;
      s ^= (s << 5) >>> 0;
      return (s >>> 0) / 4294967296;
    };

    // Borrow floor maps if available (keeps sand hue consistent).
    let srcMat = null;
    const srcEl = d.source || document.querySelector('#aya_dome_sand_floor');
    if (srcEl) {
      const srcMesh = srcEl.getObject3D('mesh');
      if (srcMesh && srcMesh.material) {
        srcMat = Array.isArray(srcMesh.material) ? srcMesh.material[0] : srcMesh.material;
      }
    }

    const mat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      metalness: srcMat && srcMat.metalness != null ? srcMat.metalness : 0.0,
      roughness: srcMat && srcMat.roughness != null ? srcMat.roughness : 1.0
    });

    // Copy maps when possible; geometry has UVs.
    if (srcMat) {
      if (srcMat.map) mat.map = srcMat.map;
      if (srcMat.normalMap) mat.normalMap = srcMat.normalMap;
      if (srcMat.roughnessMap) mat.roughnessMap = srcMat.roughnessMap;
      // aoMap requires uv2; our spheres don't have uv2, so we skip it intentionally.
      if (srcMat.envMapIntensity != null) mat.envMapIntensity = srcMat.envMapIntensity;
      if (srcMat.normalScale) {
        if (typeof srcMat.normalScale.clone === "function") {
          mat.normalScale = srcMat.normalScale.clone();
        } else if (srcMat.normalScale.x != null && srcMat.normalScale.y != null) {
          mat.normalScale = new THREE.Vector2(srcMat.normalScale.x, srcMat.normalScale.y);
        }
      }
    }

    mat.side = THREE.FrontSide;
    mat.polygonOffset = true;
    mat.polygonOffsetFactor = -1;
    mat.polygonOffsetUnits = -1;
    mat.needsUpdate = true;

    // Small sphere clumps read like micro-grains at scale, but keep UVs for texture continuity.
    const geo = new THREE.SphereGeometry(1, 6, 4);
    const inst = new THREE.InstancedMesh(geo, mat, Math.max(1, d.count));
    inst.frustumCulled = true;
    inst.castShadow = false;
    inst.receiveShadow = true;

    const m = new THREE.Matrix4();
    const pos = new THREE.Vector3();
    const quat = new THREE.Quaternion();
    const sca = new THREE.Vector3();

    const rx = Math.max(0.05, d.radiusX);
    const rz = Math.max(0.05, d.radiusZ);

    for (let i = 0; i < d.count; i++) {
      const a = rnd() * Math.PI * 2;
      const ca = Math.cos(a);
      const sa = Math.sin(a);

      // Base ellipse
      let x = ca * rx;
      let z = sa * rz;

      // Approx outward normal for ellipse boundary
      let nx = ca / Math.max(1e-6, rx);
      let nz = sa / Math.max(1e-6, rz);
      const nlen = 1.0 / Math.max(1e-6, Math.sqrt(nx * nx + nz * nz));
      nx *= nlen; nz *= nlen;

      // Radial offset: a little inward, mostly outward
      const rad = (rnd() * (d.outward + d.inward)) - d.inward;
      x += nx * rad;
      z += nz * rad;

      // Tangential jitter (breaks up the “ring” look)
      const tx = -nz;
      const tz = nx;
      const tJ = (rnd() - 0.5) * 0.10;
      x += tx * tJ;
      z += tz * tJ;

      // Height and scale
      const y = d.y + (rnd() - 0.5) * d.yJitter;
      const t = rnd();
      let r = d.scaleMin + (d.scaleMax - d.scaleMin) * (t * t);
      if (d.heroEvery > 0 && (i % d.heroEvery) === 0) {
        const ht = rnd();
        r = d.heroScaleMin + (d.heroScaleMax - d.heroScaleMin) * ht;
      }

      pos.set(x, y, z);
      sca.set(r, r * (0.72 + rnd() * 0.56), r);
      quat.setFromEuler(new THREE.Euler(rnd() * Math.PI, rnd() * Math.PI, rnd() * Math.PI));

      m.compose(pos, quat, sca);
      inst.setMatrixAt(i, m);
    }

    inst.instanceMatrix.needsUpdate = true;
    this.el.setObject3D('mesh', inst);
  }
});
})();
</script>
<script>
/* -------------------------------------------------------------------------
   ion-wind-field (NDE dome)
   Beauty-first “ion wind” columns + charged dust.
   Notes:
   - Uses additive translucent shader curtains (multi-plane columns) for volumetric feel.
   - Adds a dense but slow charged dust field inside the dome for “medium presence”.
--------------------------------------------------------------------------- */
AFRAME.registerComponent('ion-wind-field', {
  schema: {
    columns:    {type: 'int',    default: 33},
    radius:     {type: 'number', default: 6.4},
    height:     {type: 'number', default: 9.6},
    columnWidth:{type:'number',  default: 1.25},
    layers:     {type: 'int',    default: 6},   // planes per column
    opacity:    {type: 'number', default: 0.56},
    dustCount:  {type: 'int',    default: 2400},
    dustRadius: {type: 'number', default: 8.8},
    dustHeight: {type: 'number', default: 7.6},
    seed:       {type: 'int',    default: 9102}
  },

  init: function () {
    const THREE = AFRAME.THREE;
    const root = this.el.object3D;
    this._t0 = performance.now();
    this._rng = this._mulberry32(this.data.seed >>> 0);

    // ---------- Shader helpers (instanced) ----------
    const vtx = `
      attribute float aSeed;
      attribute float aOpacity;
      attribute float aRotY;
      attribute vec3  aOffset;
      attribute float aScaleY;

      varying vec2 vUv;
      varying float vY;
      varying float vSeed;
      varying float vOp;

      uniform float uTime;
      uniform float uSway;
      uniform float uHeight;

      vec3 rotY(vec3 p, float a){
        float s = sin(a), c = cos(a);
        return vec3(c*p.x + s*p.z, p.y, -s*p.x + c*p.z);
      }

      void main() {
        vUv = uv;
        vSeed = aSeed;
        vOp = aOpacity;

        vec3 p = position;

        // per-instance height variance
        p.y *= aScaleY;

        // Soft sway (stronger near the top).
        float yN = clamp(p.y / max(0.001, uHeight), 0.0, 1.0);
        float sway = (sin((p.y*0.18) + uTime*0.55 + aSeed) + sin((p.y*0.07) - uTime*0.35 + aSeed*1.7)) * 0.5;
        p.x += sway * uSway * smoothstep(0.0, 1.0, yN);
        p.z += cos((p.y*0.11) + uTime*0.42 + aSeed) * (uSway*0.75) * smoothstep(0.0, 1.0, yN);

        vY = p.y;

        // Rotate instance and translate to its world position
        p = rotY(p, aRotY);
        p += aOffset;

        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }
    `;

    // Lightweight hash / noise (no textures).
    const frag = `
      precision highp float;
      varying vec2 vUv;
      varying float vY;
      varying float vSeed;
      varying float vOp;

      uniform float uTime;
      uniform vec3  uTint;

      float hash12(vec2 p) {
        vec3 p3  = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        float a = hash12(i);
        float b = hash12(i + vec2(1.0, 0.0));
        float c = hash12(i + vec2(0.0, 1.0));
        float d = hash12(i + vec2(1.0, 1.0));
        vec2 u = f*f*(3.0-2.0*f);
        return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.55;
        mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
        for(int i=0;i<4;i++){
          v += a * noise(p);
          p = m * p;
          a *= 0.55;
        }
        return v;
      }

      void main() {
        float t = uTime;

        // UV helpers
        float x = vUv.x;
        float y = vUv.y;

        // Vertical streaks (thin, layered)
        float n1 = fbm(vec2(x*10.0 + vSeed*1.7, y*2.8 - t*0.12));
        float stri = smoothstep(0.58, 0.98, n1);
        stri = pow(stri, 2.0);

        // Internal filaments (thin bright lines)
        float fil = fbm(vec2(x*18.0 + n1*2.0, y*6.0 - t*0.22) + vSeed*2.1);
        fil = pow(smoothstep(0.52, 0.92, fil), 2.0);

        // Coherence knots (rare)
        float knot = fbm(vec2(x*3.2 - t*0.05, y*3.2 + t*0.05) + vSeed*3.3);
        knot = pow(smoothstep(0.78, 0.98, knot), 3.0);

        // Edge feather (avoid hard rectangle)
        float edge = smoothstep(0.0, 0.18, x) * smoothstep(0.0, 0.18, 1.0-x);

        // Floor fade + top fade
        float floorFade = smoothstep(0.03, 0.16, y);
        float topFade   = smoothstep(1.0, 0.70, y);

        float a = (0.55*stri + 0.30*fil + 0.55*knot) * edge * floorFade * topFade;

        // Subtle “spark mist” inside the column (not glittery)
        float mist = fbm(vec2(x*9.0, y*9.0 + t*0.18) + vSeed*0.7);
        mist = smoothstep(0.62, 0.95, mist) * 0.18;

        a = clamp(a + mist, 0.0, 1.0);

        // Soft intensity curve + per-instance opacity
        a = pow(a, 1.25) * vOp;

        gl_FragColor = vec4(uTint, a);
      }
    `;

    // Shared material for ALL layers/columns (single uniform update => subtle motion works).
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime:   {value: 0},
        uSway:   {value: 0.22},
        uHeight: {value: Math.max(0.001, this.data.height)},
        uTint:   {value: new THREE.Color(0.92, 0.96, 1.0)}
      },
      vertexShader: vtx,
      fragmentShader: frag,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide
    });
    this._mat = mat;

    // ---------- Build columns (GPU instanced) ----------
    const cols = Math.max(6, this.data.columns|0);
    const layers = Math.max(2, this.data.layers|0);
    const R = this.data.radius;
    const H = this.data.height;
    const W = this.data.columnWidth;

    const geo = new THREE.PlaneGeometry(W, H, 12, 48);
    geo.translate(0, H*0.5, 0);

    const instanceCount = cols * layers;
    const inst = new THREE.InstancedMesh(geo, mat, instanceCount);
    inst.frustumCulled = true;

    // Instanced attributes
    const aSeed = new Float32Array(instanceCount);
    const aOpacity = new Float32Array(instanceCount);
    const aRotY = new Float32Array(instanceCount);
    const aOffset = new Float32Array(instanceCount * 3);
    const aScaleY = new Float32Array(instanceCount);

    // Even distribution: fast min-distance dart throwing inside a disc (Poisson-ish).
    const minDist = Math.max(0.95, W * 0.90);
    const minD2 = minDist * minDist;
    const pts = [];
    const rnd = this._rng;

    const pick = () => {
      const a = rnd() * Math.PI * 2.0;
      const rr = Math.sqrt(rnd()) * R;
      return {x: Math.cos(a) * rr, z: Math.sin(a) * rr};
    };

    const maxTries = cols * 140;
    let tries = 0;
    while (pts.length < cols && tries < maxTries) {
      tries++;
      const p = pick();
      let ok = true;
      for (let i = 0; i < pts.length; i++) {
        const dx = p.x - pts[i].x;
        const dz = p.z - pts[i].z;
        if (dx*dx + dz*dz < minD2) { ok = false; break; }
      }
      if (ok) pts.push(p);
    }
    while (pts.length < cols) pts.push(pick());

    // Keep instanceMatrix identity; transforms are done in shader via attributes.
    const ident = new THREE.Matrix4();
    for (let i = 0; i < instanceCount; i++) inst.setMatrixAt(i, ident);

    let idx = 0;
    for (let i = 0; i < cols; i++) {
      const base = pts[i];
      const baseYaw = rnd() * Math.PI * 2.0;

      for (let k = 0; k < layers; k++) {
        const ry = baseYaw + (k / layers) * Math.PI + (rnd() - 0.5) * 0.35;
        aRotY[idx] = ry;

        const ox = base.x + (rnd() - 0.5) * 0.22;
        const oz = base.z + (rnd() - 0.5) * 0.22;
        aOffset[idx*3+0] = ox;
        aOffset[idx*3+1] = 0.0;
        aOffset[idx*3+2] = oz;

        aSeed[idx] = rnd() * 100.0;

        const op = this.data.opacity * (0.85 + rnd()*0.55) / Math.sqrt(layers);
        aOpacity[idx] = op;

        aScaleY[idx] = 0.92 + rnd() * 0.20;

        idx++;
      }
    }

    inst.geometry.setAttribute('aSeed', new THREE.InstancedBufferAttribute(aSeed, 1));
    inst.geometry.setAttribute('aOpacity', new THREE.InstancedBufferAttribute(aOpacity, 1));
    inst.geometry.setAttribute('aRotY', new THREE.InstancedBufferAttribute(aRotY, 1));
    inst.geometry.setAttribute('aOffset', new THREE.InstancedBufferAttribute(aOffset, 3));
    inst.geometry.setAttribute('aScaleY', new THREE.InstancedBufferAttribute(aScaleY, 1));

    this._inst = inst;
    root.add(inst);

    // ---------- Charged dust (Points) ----------
    const dustN = Math.max(600, this.data.dustCount|0);
    const dGeo = new THREE.BufferGeometry();
    const pos = new Float32Array(dustN*3);

    for (let i=0;i<dustN;i++){
      const rr = this.data.dustRadius * Math.sqrt(rnd());
      const aa = rnd()*Math.PI*2.0;
      const y  = rnd()*this.data.dustHeight + 0.30;
      pos[i*3+0] = Math.cos(aa)*rr;
      pos[i*3+1] = y;
      pos[i*3+2] = Math.sin(aa)*rr;
    }
    dGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

    // Subtle dust shimmer, very cheap (no per-point CPU updates).
    const dustMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: {value: 0},
        uOpacity: {value: 0.16},
        uSize: {value: 0.010}
      },
      vertexShader: `
        uniform float uTime;
        uniform float uSize;
        varying float vA;
        void main() {
          vec3 p = position;

          // Gentle volumetric drift (adds life without CPU updates).
          float dx = 0.06 * sin(uTime*0.12 + position.y*0.27 + position.x*0.09);
          float dz = 0.06 * cos(uTime*0.10 + position.y*0.21 + position.z*0.11);
          p.x += dx;
          p.z += dz;

          // Vertical bob + shimmer.
          p.y += 0.03 * sin(uTime*0.35 + position.x*0.35 + position.z*0.22);
          vA = 0.65 + 0.35 * sin(uTime*0.55 + position.x*0.18 + position.y*0.21);

          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = uSize * (300.0 / -gl_Position.z);
        }
      `,
      fragmentShader: `
        precision highp float;
        uniform float uOpacity;
        varying float vA;
        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          float d = dot(uv, uv);
          float a = smoothstep(0.25, 0.0, d);
          gl_FragColor = vec4(1.0, 1.0, 1.0, a * uOpacity * vA);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    this._dustMat = dustMat;

    const dust = new THREE.Points(dGeo, dustMat);
    dust.frustumCulled = false;
    this._dust = dust;
    root.add(dust);
  },

  tick: function (t) {
    const tt = (t - this._t0) * 0.001;
    if (this._mat && this._mat.uniforms) this._mat.uniforms.uTime.value = tt;
    if (this._dustMat && this._dustMat.uniforms) this._dustMat.uniforms.uTime.value = tt;

    // Very slow swirl to keep the dust from feeling "pinned".
    if (this._dust) this._dust.rotation.y = tt * 0.03;
  },

  remove: function () {
    const root = this.el.object3D;
    if (this._inst) root.remove(this._inst);
    if (this._dust) root.remove(this._dust);

    try { if (this._inst && this._inst.geometry) this._inst.geometry.dispose(); } catch(e){}
    try { if (this._mat) this._mat.dispose(); } catch(e){}
    try { if (this._dust && this._dust.geometry) this._dust.geometry.dispose(); } catch(e){}
    try { if (this._dustMat) this._dustMat.dispose(); } catch(e){}
  },

  _mulberry32: function(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
});
</script>

<script>
/* -------------------------------------------------------------------------
   adaptive-resolution
   - Dynamically adjusts renderer pixel ratio to keep motion playable.
   - Helps when GPU becomes the bottleneck (big shiny surfaces + bloom).
--------------------------------------------------------------------------- */
AFRAME.registerComponent('adaptive-resolution', {
  schema: {
    startScale: {type: 'number', default: 0.90},
    minScale:   {type: 'number', default: 0.75},
    maxScale:   {type: 'number', default: 1.00},
    dprCap:     {type: 'number', default: 1.25},
    adjustEveryMs: {type: 'int', default: 650},
    downStep:   {type: 'number', default: 0.06},
    upStep:     {type: 'number', default: 0.03},
    downFps:    {type: 'number', default: 45},
    upFps:      {type: 'number', default: 58}
  },

  init: function () {
    this._q = this._clamp(this.data.startScale, this.data.minScale, this.data.maxScale);

    // Smoothed frametime + spike catcher (better than raw FPS averages for stutter).
    this._emaDt = 16.6;
    this._accMs = 0;
    this._frames = 0;

    // Patched postFX targets (EffectComposer + bloom) when present.
    this._patched = false;
    this._scaleRef = { scale: this._q };
    this._lastAppliedQ = -1;

    this._apply(true);
  },

  _clamp: function (v, a, b) {
    return Math.max(a, Math.min(b, v));
  },

  _getRenderer: function () {
    const sceneEl = this.el.sceneEl;
    return sceneEl && sceneEl.renderer;
  },

  _getPostFX: function () {
    const sceneEl = this.el.sceneEl;
    return (sceneEl && sceneEl.components && sceneEl.components['realism-postfx']) || null;
  },

  _ensurePatched: function () {
    if (this._patched) return;

    const postfx = this._getPostFX();
    if (!postfx || !postfx.composer) return;

    const composer = postfx.composer;
    const bloom = postfx._bloom;

    // Patch composer.setSize so any existing resize handlers keep respecting our scale.
    if (!composer.__adaptiveOrigSetSize) {
      composer.__adaptiveOrigSetSize = composer.setSize.bind(composer);
      const scaleRef = this._scaleRef;
      composer.setSize = function (w, h) {
        let ww = w, hh = h;
        // Be tolerant if something passes a Vector2-like object.
        if (w && typeof w === 'object' && 'x' in w && 'y' in w) {
          ww = w.x; hh = w.y;
        }
        const s = Math.max(0.35, Math.min(1.0, scaleRef.scale || 1.0));
        return composer.__adaptiveOrigSetSize(
          Math.max(1, Math.floor(ww * s)),
          Math.max(1, Math.floor(hh * s))
        );
      };
    }

    // Patch bloom.setSize as well (some builds call it on resize).
    if (bloom && bloom.setSize && !bloom.__adaptiveOrigSetSize) {
      bloom.__adaptiveOrigSetSize = bloom.setSize.bind(bloom);
      const scaleRef = this._scaleRef;
      bloom.setSize = function (w, h) {
        const s = Math.max(0.35, Math.min(1.0, scaleRef.scale || 1.0));
        return bloom.__adaptiveOrigSetSize(
          Math.max(1, Math.floor(w * s)),
          Math.max(1, Math.floor(h * s))
        );
      };
    }

    this._patched = true;
  },

  _apply: function (force) {
    const renderer = this._getRenderer();
    if (!renderer) return;

    const q = this._clamp(this._q, this.data.minScale, this.data.maxScale);

    // Avoid noisy updates.
    if (!force && Math.abs(q - this._lastAppliedQ) < 0.015) return;
    this._lastAppliedQ = q;
    this._scaleRef.scale = q;

    // If we have postFX, controlling composer target size is the big win.
    // (Composer render targets are often the real GPU bottleneck, more than renderer DPR.)
    this._ensurePatched();
    const postfx = this._getPostFX();

    try {
      const dpr = Math.min(window.devicePixelRatio || 1, this.data.dprCap);

      // Cap canvas DPR to reduce final full-screen pass cost on high-DPR screens.
      // (Does not change scene content; only internal render resolution.)
      const canvasPR = (q > 0.98) ? dpr : Math.min(dpr, 1.0);
      renderer.setPixelRatio(canvasPR);

      if (postfx && postfx.composer) {
        // Trigger a resize through the existing handler path (now scaled).
        const size = renderer.getSize(new THREE.Vector2());
        postfx.composer.setSize(size.x, size.y);

        if (postfx._bloom && postfx._bloom.setSize) {
          postfx._bloom.setSize(Math.floor(size.x * 0.65), Math.floor(size.y * 0.65));
        }
      }
    } catch (e) {}
  },

  tick: function (time, dt) {
    dt = dt || 16;
    // EMA of dt (stable, reacts to spikes).
    this._emaDt = this._emaDt * 0.92 + dt * 0.08;

    this._accMs += dt;
    this._frames += 1;

    // Fast path: catch ugly spikes immediately.
    if (dt > 34 && this._q > this.data.minScale) {
      this._q = this._clamp(this._q - this.data.downStep * 1.35, this.data.minScale, this.data.maxScale);
      this._apply(false);
      return;
    }

    if (this._accMs < this.data.adjustEveryMs) return;

    const fpsAvg = (this._frames / this._accMs) * 1000;
    const fpsSmooth = 1000 / Math.max(8, this._emaDt);

    this._accMs = 0;
    this._frames = 0;

    // Adjust conservatively to avoid visible pumping, but make downshifts decisive.
    const fps = Math.min(fpsAvg, fpsSmooth);

    if (fps < this.data.downFps && this._q > this.data.minScale) {
      this._q = this._clamp(this._q - this.data.downStep, this.data.minScale, this.data.maxScale);
      this._apply(false);
    } else if (fps > this.data.upFps && this._q < this.data.maxScale) {
      this._q = this._clamp(this._q + this.data.upStep, this.data.minScale, this.data.maxScale);
      this._apply(false);
    }
  }
});


// Freeze world transforms for heavy static geometry (no visual change, reduces per-frame matrix work).
AFRAME.registerComponent('freeze-static-mesh', {
  schema: {
    // If true, also freezes non-mesh nodes (rarely needed). Keep false by default.
    deep: { type: 'boolean', default: false }
  },

  init: function () {
    // Safety: don't freeze entities that are animated / procedurally updated.
    const names = (this.el.getAttributeNames ? this.el.getAttributeNames() : []);
    const hasAnim = names.some(n => n === 'animation' || n.indexOf('animation__') === 0);
    if (hasAnim) return;

    this._frozen = false;

    const tryFreeze = () => {
      if (this._frozen) return;
      const obj = this.el.object3D;
      if (!obj) return;

      // If this entity is a glTF container, wait until the model is present.
      const gltf = this.el.getObject3D('mesh');
      if (this.el.hasAttribute('gltf-model') && !gltf) return;

      const freezeNode = (node) => {
        // Only freeze renderable nodes (meshes/lines/points) by default.
        const isRenderable = node.isMesh || node.isLine || node.isPoints;
        if (!isRenderable && !this.data.deep) return;

        node.matrixAutoUpdate = false;
        node.updateMatrix();
        node.updateMatrixWorld(true);
        // Keep culling enabled (default true), but ensure bounds exist for static meshes.
        if (node.geometry && !node.geometry.boundingSphere) {
          try { node.geometry.computeBoundingSphere(); } catch (e) {}
        }
      };

      obj.traverse(freezeNode);
      obj.matrixAutoUpdate = false;
      obj.updateMatrix();
      obj.updateMatrixWorld(true);

      this._frozen = true;
    };

    // Try immediately and also after model/light/geometry attachment.
    tryFreeze();
    this.el.addEventListener('model-loaded', tryFreeze);
    this.el.addEventListener('object3dset', tryFreeze);

    // One extra defer for primitives created slightly later.
    requestAnimationFrame(() => requestAnimationFrame(tryFreeze));
  }
});

// ========== ZONE-BASED PROGRESSIVE LOADING SYSTEM (ULTRA-SAFE) ==========
// Strategy: Load almost everything at start, keep it loaded, never risk freezing
// Only unload if extremely far away (100m+)

AFRAME.registerComponent('zone-manager', {
  schema: {
    playerRig: { type: 'selector', default: '#rig' },
    debugMode: { type: 'boolean', default: false }
  },

  init: function () {
    this.zones = new Map();
    this.loadedZones = new Set();
    this.everLoaded = new Set(); // Track what we've loaded to avoid reloading
    
    // Zone positions and preload distances
    const zoneConfig = {
      tunnel_04: { preloadDist: 999 },
      tunnel_05: { preloadDist: 999 },
      junction_dome: { preloadDist: 999 }, // Always loaded - prevents freezing
      tunnel_06: { preloadDist: 60 },
      end_chamber_06: { preloadDist: 60 }
    };

    // Discover zones
    Object.keys(zoneConfig).forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        this.zones.set(id, {
          id: id,
          element: el,
          position: new THREE.Vector3(),
          preloadDist: zoneConfig[id].preloadDist
        });
        el.object3D.getWorldPosition(this.zones.get(id).position);
      } else if (this.data.debugMode) {
        console.warn(`[zone-manager] Zone not found: ${id}`);
      }
    });
    
    // Initialize: Load EVERYTHING in first half of level
    this._initializeZones();
    
    this._checkInterval = 0;
  },

  _initializeZones: function () {
    // Start everything unloaded
    this.zones.forEach((zone, id) => {
      zone.element.object3D.visible = false;
    });
    
    // Load the entire first half of the level immediately
    // This ensures smooth experience in the most traversed areas
    const initialLoad = ['tunnel_04',      // Include these too for safety
      'tunnel_05',
      'junction_dome'   // Load junction early with all optimizations
    ];
    
    if (this.data.debugMode) {
      console.log('[zone-manager] Loading initial zones:', initialLoad);
    }
    
    initialLoad.forEach(id => this._loadZone(id));
  },

  _loadZone: function (zoneId) {
    const zone = this.zones.get(zoneId);
    if (!zone) return;
    
    // Already loaded? Skip
    if (this.loadedZones.has(zoneId)) return;
    
    // Mark as ever loaded to prevent reload stutters
    this.everLoaded.add(zoneId);
    
    zone.element.object3D.visible = true;
    this.loadedZones.add(zoneId);
    
    if (this.data.debugMode) {
      console.log(`[zone-manager] LOADED: ${zoneId} (total loaded: ${this.loadedZones.size})`);
    }
  },

  _unloadZone: function (zoneId) {
    const zone = this.zones.get(zoneId);
    if (!zone) return;
    
    // Don't unload if it's in the "always loaded" set
    if (zone.preloadDist === 999) return;
    
    zone.element.object3D.visible = false;
    this.loadedZones.delete(zoneId);
    
    if (this.data.debugMode) {
      console.log(`[zone-manager] UNLOADED: ${zoneId}`);
    }
  },

  tick: function (time, dt) {
    if (!this.data.playerRig) return;
    
    // Check frequently to catch proximity early
    this._checkInterval += dt;
    if (this._checkInterval < 100) return;
    this._checkInterval = 0;
    
    const playerPos = new THREE.Vector3();
    this.data.playerRig.object3D.getWorldPosition(playerPos);
    
    // Check each zone
    this.zones.forEach((zone, id) => {
      const dist = playerPos.distanceTo(zone.position);
      
      // Load if within preload distance
      if (dist < zone.preloadDist) {
        this._loadZone(id);
      }
      
      // Only unload if EXTREMELY far (100m+) and not in "always loaded" set
      if (dist > 100 && zone.preloadDist !== 999) {
        this._unloadZone(id);
      }
    });
  }
});

<script id="quitUiScript">
(function () {
  const QUIT = document.getElementById('quitBtn');
  const QC = document.getElementById('quitConfirm');
  const Q_CANCEL = document.getElementById('quitCancel');
  const Q_OK = document.getElementById('quitConfirmBtn');

  function openQuitConfirm(){
    if (!QC) return;
    QC.classList.add('show');
    QC.setAttribute('aria-hidden','false');
  }
  function closeQuitConfirm(){
    if (!QC) return;
    QC.classList.remove('show');
    QC.setAttribute('aria-hidden','true');
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (QC && QC.classList.contains('show')) closeQuitConfirm();
    }
  }, { passive: true });

  if (QUIT) QUIT.addEventListener('click', openQuitConfirm);
  if (Q_CANCEL) Q_CANCEL.addEventListener('click', closeQuitConfirm);
  if (QC) QC.addEventListener('click', (e) => { if (e.target === QC) closeQuitConfirm(); });
  if (Q_OK) Q_OK.addEventListener('click', () => { window.location.href = 'https://www.enricopoli.com/pagex'; });
})();
</script>
