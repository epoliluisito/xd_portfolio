<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Lia Room</title>
<script src="../../vendor/aframe/aframe-1.5.0.min.js"></script>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }

    /* Flash fix: cover the canvas immediately at the CSS level before JS runs */
    a-scene { background: #000; }

    /* Loading overlay: covers the initial black frame and shows progress */
    #fadeIn {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 900ms ease;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #fadeIn.done { opacity: 0; }
    #loadingCard {
      width: min(420px, calc(100vw - 56px));
      padding: 18px 18px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.03);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      color: rgba(255,255,255,0.92);
    }
    #loadingTitle {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.84;
      margin-bottom: 10px;
    }
    #loadingBar {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.10);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    }
    #loadingBarFill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(255,255,255,0.60), rgba(255,255,255,0.95));
      transition: width 180ms ease;
    }
    #loadingMeta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 9px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.68);
    }

    /* ── Quit button — matches aya.dev exactly ── */
    #quitShell {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 220;
    }
    #quitBtn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.35);
      color: rgba(255,255,255,0.85);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    #quitBtn:hover { border-color: rgba(255,255,255,0.32); color: rgba(255,255,255,0.95); }

    #quitConfirm {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.62);
      z-index: 230;
    }
    #quitConfirm.show { display: flex; }
    #quitCard {
      width: min(420px, calc(100vw - 48px));
      background: rgba(0,0,0,0.78);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 14px;
      padding: 18px;
      color: rgba(255,255,255,0.92);
      box-shadow: 0 22px 70px rgba(0,0,0,0.62);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #quitCard h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    #quitCard p {
      margin: 0 0 14px 0;
      font-size: 13px;
      opacity: 0.85;
      line-height: 1.35;
    }
    #quitActions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .qbtn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.92);
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .qbtn.primary {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.32);
      color: rgba(255,255,255,0.96);
    }
  </style>
<script>
    // ── Components ────────────────────────────────────────────────────────────

    // Disable fog on specific meshes (earth sphere)
    AFRAME.registerComponent('no-fog', {
      init: function () {
        const apply = (obj) => {
          if (!obj || !obj.traverse) return;
          obj.traverse((n) => {
            if (!n.material) return;
            const mats = Array.isArray(n.material) ? n.material : [n.material];
            mats.forEach((m) => {
              if (m && Object.prototype.hasOwnProperty.call(m, 'fog')) {
                m.fog = false;
                m.needsUpdate = true;
              }
            });
          });
        };
        apply(this.el.object3D);
        this.el.addEventListener('object3dset', () => apply(this.el.object3D));
      }
    });

    // Improved earth texture sampling
    AFRAME.registerComponent('earth-texture-quality', {
      init: function () {
        const apply = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.traverse((n) => {
            if (!n.isMesh || !n.material) return;
            const mats = Array.isArray(n.material) ? n.material : [n.material];
            mats.forEach((m) => {
              if (m.map) {
                m.map.anisotropy = 4;
                m.map.minFilter = THREE.LinearMipmapLinearFilter;
                m.map.magFilter = THREE.LinearFilter;
                m.map.needsUpdate = true;
              }
              m.needsUpdate = true;
            });
          });
        };
        apply();
        this.el.addEventListener('object3dset', apply);
      }
    });

    // Improved lunar ground texture sampling
    AFRAME.registerComponent('lunar-ground-quality', {
      init: function () {
        const apply = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.traverse((n) => {
            if (!n.isMesh || !n.material) return;
            const mats = Array.isArray(n.material) ? n.material : [n.material];
            mats.forEach((m) => {
              ['map','normalMap','roughnessMap','aoMap'].forEach((key) => {
                if (m[key]) {
                  m[key].anisotropy = Math.max(16, m[key].anisotropy || 0);
                  m[key].minFilter = THREE.LinearMipmapLinearFilter;
                  m[key].magFilter = THREE.LinearFilter;
                  m[key].needsUpdate = true;
                }
              });
              m.needsUpdate = true;
            });
          });
        };
        apply();
        this.el.addEventListener('object3dset', apply);
      }
    });

    // Pitch clamp
    AFRAME.registerComponent('pitch-clamp', {
      schema: { min: { type: 'number', default: -80 }, max: { type: 'number', default: 80 } },
      tick: function () {
        const lc = this.el.components && this.el.components['look-controls'];
        if (!lc || !lc.pitchObject) return;
        const minR = this.data.min * Math.PI / 180;
        const maxR = this.data.max * Math.PI / 180;
        const p = lc.pitchObject.rotation.x;
        if (p < minR) lc.pitchObject.rotation.x = minR;
        if (p > maxR) lc.pitchObject.rotation.x = maxR;
      }
    });

    // IBL: scene-level env map driving all PBR metalness/roughness — must match aya.dev
    // aya.dev uses simple-ibl="intensity: 0.35; color: #e4ebf4" on the a-scene
    AFRAME.registerComponent('simple-ibl', {
      schema: { intensity: { type: 'number', default: 0.95 }, color: { type: 'color', default: '#dfe6ef' } },
      init: function () {
        const sceneObj = this.el.sceneEl.object3D;
        const mkCanvas = () => {
          const cv = document.createElement('canvas'); cv.width = cv.height = 2;
          const ctx = cv.getContext('2d');
          const g = ctx.createLinearGradient(0,0,2,2);
          g.addColorStop(0, this.data.color);
          g.addColorStop(1, '#aeb7c3');
          ctx.fillStyle = g; ctx.fillRect(0,0,2,2);
          return cv;
        };
        const cube = new THREE.CubeTexture([mkCanvas(),mkCanvas(),mkCanvas(),mkCanvas(),mkCanvas(),mkCanvas()]);
        cube.needsUpdate = true;
        sceneObj.environment = cube;
        const applyIntensity = () => {
          sceneObj.traverse(o => {
            if (!o || !o.isMesh) return;
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            mats.forEach(m => {
              if (m && m.isMeshStandardMaterial && !(m.userData && m.userData.isNPC)) { m.envMapIntensity = this.data.intensity; m.needsUpdate = true; }
            });
          });
        };
        applyIntensity();
        this.el.sceneEl.addEventListener('object3dset', applyIntensity);
      }
    });
    
    // Fix Mixamo/GLB NPC materials: opaque, matte, stable depth sorting
    AFRAME.registerComponent('mixamo-mat-fix', {
      init: function () {
        this._apply = this._apply.bind(this);
        this.el.addEventListener('model-loaded', this._apply);
        this.el.addEventListener('object3dset', this._apply);
        this._apply();
      },
      _apply: function () {
        const root = this.el.getObject3D('mesh') || this.el.object3D;
        if (!root || !root.traverse) return;
        root.traverse((n) => {
          if (!n || !n.isMesh || !n.material) return;
          n.castShadow = false;
          n.receiveShadow = false;
          const mats = Array.isArray(n.material) ? n.material : [n.material];
          mats.forEach((m) => {
            if (!m) return;
            const wasTransparent = !!m.transparent || (typeof m.opacity === 'number' && m.opacity < 0.999);
            m.transparent = false;
            m.opacity = 1.0;
            m.depthWrite = true;
            m.depthTest = true;
            m.side = THREE.FrontSide;
            const likelyCutout = wasTransparent || !!m.alphaMap || /hair|lash|brow|card|alpha/i.test((m.name || ''));
            m.alphaTest = likelyCutout ? Math.max(m.alphaTest || 0, 0.35) : 0;
            if ('premultipliedAlpha' in m) m.premultipliedAlpha = false;
            // Swap to Lambert — zero specular, purely diffuse
            var lam = new THREE.MeshLambertMaterial();
            if (m.map) lam.map = m.map;
            if (m.color) lam.color = m.color.clone();
            if (m.alphaMap) lam.alphaMap = m.alphaMap;
            lam.alphaTest = m.alphaTest || 0;
            lam.transparent = false;
            lam.opacity = 1.0;
            lam.depthWrite = true;
            lam.depthTest = true;
            lam.side = THREE.FrontSide;
            lam.userData = lam.userData || {};
            lam.userData.isNPC = true;
            if (Array.isArray(n.material)) {
              var idx = n.material.indexOf(m);
              if (idx >= 0) n.material[idx] = lam;
            } else {
              n.material = lam;
            }
          });
        });
      },
      remove: function () {
        this.el.removeEventListener('model-loaded', this._apply);
        this.el.removeEventListener('object3dset', this._apply);
      }
    });

AFRAME.registerComponent('rig-walk', {
      schema: {
        speed: { type: 'number', default: 2.6 },
        radius: { type: 'number', default: 0.28 },
        height: { type: 'number', default: 1.6 },
        collidableSelector: { type: 'string', default: '.solid' },
        refreshMs: { type: 'number', default: 250 }
      },
      init: function () {
        this.keys = Object.create(null);

        const MOVE = new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight']);
        this._onKeyDown = (e) => { if (MOVE.has(e.code)) e.preventDefault(); this.keys[e.code] = true; };
        this._onKeyUp   = (e) => { if (MOVE.has(e.code)) e.preventDefault(); this.keys[e.code] = false; };
        this._clearKeys = () => { for (const k in this.keys) this.keys[k] = false; };

        window.addEventListener('keydown', this._onKeyDown, { passive: false });
        window.addEventListener('keyup',   this._onKeyUp,   { passive: false });
        window.addEventListener('blur', this._clearKeys);
        document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement) this._clearKeys(); });

        this._colliderEls = [];
        this._lastRefresh = -Infinity;

        // Scratch objects to avoid GC
        this._playerBox = new THREE.Box3();
        this._tmpBox = new THREE.Box3();
        this._tmpV3 = new THREE.Vector3();

        this._smoothstep = (a, b, x) => {
          const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
          return t * t * (3 - 2 * t);
        };
        this._angleDelta = (a, b) => {
          let d = a - b;
          while (d > Math.PI) d -= Math.PI * 2;
          while (d < -Math.PI) d += Math.PI * 2;
          return d;
        };
        this._primalBermHeightAt = (x, z) => {
          const sn = (window._snoise && window._snoise.simplex2) ? window._snoise.simplex2 : () => 0;
          return primalSceneHeight(x, z, sn);
        };
        this._primalOverlayAt = (x, z) => {
          const sn = (window._snoise && window._snoise.simplex2) ? window._snoise.simplex2 : () => 0;
          return primalOverlayHeight(x - PRIMAL_SCENE_CFG.CX, z - PRIMAL_SCENE_CFG.CZ, sn);
        };
        this._primalBermBlocksAt = (x, z) => {
          const threshold = 0.24;
          const r = this.data.radius + 0.08;
          const samples = [
            [0, 0],
            [r, 0], [-r, 0], [0, r], [0, -r],
            [r * 0.707, r * 0.707], [r * 0.707, -r * 0.707],
            [-r * 0.707, r * 0.707], [-r * 0.707, -r * 0.707]
          ];
          for (let i = 0; i < samples.length; i++) {
            const sx = x + samples[i][0];
            const sz = z + samples[i][1];
            if (this._primalOverlayAt(sx, sz) >= threshold) return true;
          }
          return false;
        };

        this._refreshColliders = () => {
          const scene = this.el.sceneEl;
          if (!scene) return;
          this._colliderEls = Array.from(scene.querySelectorAll(this.data.collidableSelector));
          this._lastRefresh = performance.now();
        };

        // Refresh once scene loads, then whenever models finish loading
        this.el.sceneEl.addEventListener('loaded', this._refreshColliders);
        this.el.sceneEl.addEventListener('model-loaded', this._refreshColliders);
      },

      _intersectsAt: function (x, z) {
        const r = this.data.radius;
        const y = this.el.object3D.position.y;
        const h = this.data.height;

        this._playerBox.min.set(x - r, y, z - r);
        this._playerBox.max.set(x + r, y + h, z + r);

        for (let i = 0; i < this._colliderEls.length; i++) {
          const el = this._colliderEls[i];
          if (!el || !el.object3D) continue;

          // If collider has no visible mesh yet, skip
          // (Box3.setFromObject handles empty groups, but guard anyway)
          this._tmpBox.setFromObject(el.object3D);
          if (!isFinite(this._tmpBox.min.x) || !isFinite(this._tmpBox.max.x)) continue;

          if (this._tmpBox.intersectsBox(this._playerBox)) return true;
        }

        if (this._primalBermBlocksAt(x, z)) return true;
        return false;
      },

      tick: function (t, dt) {
        // Periodically refresh collider list in case DOM changes
        if ((t - this._lastRefresh) > this.data.refreshMs) this._refreshColliders();

        const w = !!this.keys['KeyW'] || !!this.keys['ArrowUp'];
        const s = !!this.keys['KeyS'] || !!this.keys['ArrowDown'];
        const a = !!this.keys['KeyA'] || !!this.keys['ArrowLeft'];
        const d = !!this.keys['KeyD'] || !!this.keys['ArrowRight'];
        if (!w && !s && !a && !d) return;

        const dtS = Math.min(0.05, dt / 1000);
        const cam = this.el.querySelector('[camera]');
        if (!cam) return;

        const lc = cam.components && cam.components['look-controls'];
        const yaw = lc && lc.yawObject ? lc.yawObject.rotation.y : 0;
        const totalYaw = yaw + (this.el.object3D.rotation.y || 0);

        let mx = 0, mz = 0;
        if (w) { mx -= Math.sin(totalYaw); mz -= Math.cos(totalYaw); }
        if (s) { mx += Math.sin(totalYaw); mz += Math.cos(totalYaw); }
        if (a) { mx -= Math.cos(totalYaw); mz += Math.sin(totalYaw); }
        if (d) { mx += Math.cos(totalYaw); mz -= Math.sin(totalYaw); }

        const len = Math.sqrt(mx*mx + mz*mz);
        if (len <= 0) return;

        const step = this.data.speed * dtS;
        const dx = (mx / len) * step;
        const dz = (mz / len) * step;

        const pos = this.el.object3D.position;
        const x0 = pos.x;
        const z0 = pos.z;

        // Try X movement (slide)
        const x1 = x0 + dx;
        if (!this._intersectsAt(x1, z0)) pos.x = x1;

        // Try Z movement (slide)
        const z1 = pos.z + dz;
        if (!this._intersectsAt(pos.x, z1)) pos.z = z1;
      },

      remove: function () {
        window.removeEventListener('keydown', this._onKeyDown);
        window.removeEventListener('keyup',   this._onKeyUp);
        window.removeEventListener('blur', this._clearKeys);
      }
    });


    AFRAME.registerComponent('starry-sky', {
      init: function () {
        const size = 2048;
        const cv = document.createElement('canvas');
        cv.width = size; cv.height = size;
        const ctx = cv.getContext('2d');

        // Pure black base
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, size, size);

        // Generate star positions
        const stars = [];
        const layers = [
          { count: 2000, minR: 0.2, maxR: 0.45, minA: 0.15, maxA: 0.4  },
          { count: 450,  minR: 0.3, maxR: 0.6,  minA: 0.3,  maxA: 0.6  },
          { count: 70,   minR: 0.5, maxR: 0.8,  minA: 0.5,  maxA: 0.8  },
          { count: 12,   minR: 0.7, maxR: 1.0,  minA: 0.7,  maxA: 0.95 }
        ];

        for (const layer of layers) {
          for (let i = 0; i < layer.count; i++) {
            const x = Math.random() * size;
            const y = Math.random() * size;
            const r = layer.minR + Math.random() * (layer.maxR - layer.minR);
            const a = layer.minA + Math.random() * (layer.maxA - layer.minA);
            const hue = Math.random();
            let cr = 255, cg = 255, cb = 255;
            if (hue > 0.85 && hue < 0.92) { cr = 210; cg = 220; cb = 255; }
            else if (hue > 0.92) { cr = 255; cg = 245; cb = 220; }
            stars.push({ x: x, y: y, r: r, a: a, cr: cr, cg: cg, cb: cb });
          }
        }

        // Draw constellation lines FIRST (behind stars)
        // Only connect brighter stars, very thin, very faint
        const brightStars = stars.filter(function(s) { return s.a > 0.35; });
        const maxDist = 90;
        ctx.lineWidth = 0.3;
        for (let i = 0; i < brightStars.length; i++) {
          let connections = 0;
          for (let j = i + 1; j < brightStars.length; j++) {
            if (connections >= 2) break;
            const dx = brightStars[i].x - brightStars[j].x;
            const dy = brightStars[i].y - brightStars[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < maxDist) {
              const t = 1 - dist / maxDist;
              const lineAlpha = t * 0.06 * (brightStars[i].a + brightStars[j].a) * 0.5;
              if (lineAlpha > 0.005) {
                ctx.beginPath();
                ctx.moveTo(brightStars[i].x, brightStars[i].y);
                ctx.lineTo(brightStars[j].x, brightStars[j].y);
                ctx.strokeStyle = 'rgba(180,210,255,' + lineAlpha + ')';
                ctx.stroke();
                connections++;
              }
            }
          }
        }

        // Draw stars on top
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          ctx.fillStyle = 'rgba(' + s.cr + ',' + s.cg + ',' + s.cb + ',' + s.a + ')';
          ctx.fillRect(Math.floor(s.x), Math.floor(s.y), Math.ceil(s.r), Math.ceil(s.r));
        }

        const tex = new THREE.CanvasTexture(cv);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        tex.needsUpdate = true;
        const apply = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.traverse((n) => {
            if (n.material) {
              n.material.map = tex;
              n.material.color = new THREE.Color(0xffffff);
              n.material.needsUpdate = true;
            }
          });
        };
        apply();
        this.el.addEventListener('object3dset', apply);
      }
    });


    // ── Snow: cinematic wind-driven particles ──────────────────────────────────
    AFRAME.registerComponent('snow', {
      schema: {
        count:       { type: 'number', default: 4000 },
        areaWidth:   { type: 'number', default: 80 },
        areaDepth:   { type: 'number', default: 80 },
        ceiling:     { type: 'number', default: 25 },
        floor:       { type: 'number', default: 0.1 },
        fallSpeed:   { type: 'number', default: 1.2 },
        fallVar:     { type: 'number', default: 0.6 },
        windX:       { type: 'number', default: 0.8 },
        windZ:       { type: 'number', default: 0.3 },
        gustStr:     { type: 'number', default: 0.4 },
        gustFreq:    { type: 'number', default: 0.15 },
        rampTime:    { type: 'number', default: 30 },
        size:        { type: 'number', default: 0.06 }
      },
      init: function () {
        const d = this.data;
        const N = d.count;
        this._officeCX = 0; this._officeCZ = -75;
        this._platClearR = 8.0;
        this._sn = (window._snoise && window._snoise.simplex2) ? window._snoise.simplex2 : function(){ return 0; };

        this._fallSpeeds = new Float32Array(N);
        this._driftX = new Float32Array(N);
        this._driftZ = new Float32Array(N);
        this._spawnDelay = new Float32Array(N);
        this._phase = new Float32Array(N);
        this._swirlR = new Float32Array(N);
        this._swirlSpd = new Float32Array(N);
        this._turbScale = new Float32Array(N);
        const positions = new Float32Array(N * 3);

        for (let i = 0; i < N; i++) {
          this._spawnDelay[i] = Math.pow(Math.random(), 1.6) * d.rampTime;
          positions[i*3] = positions[i*3+1] = positions[i*3+2] = 9999;
          this._fallSpeeds[i] = d.fallSpeed * (0.3 + Math.random()*1.0);
          this._driftX[i] = (Math.random()-0.5)*0.5;
          this._driftZ[i] = (Math.random()-0.5)*0.5;
          this._phase[i] = Math.random()*Math.PI*2;
          this._swirlR[i] = 0.015+Math.random()*0.12;
          this._swirlSpd[i] = (0.7+Math.random()*2.5)*(Math.random()<0.5?1:-1);
          this._turbScale[i] = 0.4+Math.random()*1.0;
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Soft glowing flake sprite
        const cv = document.createElement('canvas');
        cv.width=64; cv.height=64;
        const ctx = cv.getContext('2d');
        const grad = ctx.createRadialGradient(32,32,0,32,32,32);

        const FROST_HALF_D=30;
        const ftS=512;
        const fCv=document.createElement('canvas');fCv.width=ftS;fCv.height=ftS;
        const fCtx=fCv.getContext('2d');
        const fid=fCtx.createImageData(ftS,ftS);const fp=fid.data;
        for(let py=0;py<ftS;py++){
          for(let px=0;px<ftS;px++){
            const idx=(py*ftS+px)*4;
            const wx=FIELD_CX + (px/ftS-0.5)*FROST_HALF_W*2;
            const wz=FIELD_CZ + (py/ftS-0.5)*FROST_HALF_D*2;
            let fm=frostMask(wx,wz);
            fm*=0.6+0.4*(sn(wx*0.08+50,wz*0.08-50)*0.5+0.5);
            fm*=0.85+0.15*(sn(wx*0.5+200,wz*0.5-200)*0.5+0.5);
            const alpha=Math.max(0,Math.min(255,fm*130));
            fp[idx]=248;fp[idx+1]=252;fp[idx+2]=255;fp[idx+3]=Math.floor(alpha);
          }
        }
        fCtx.putImageData(fid,0,0);
        const frostTex=new THREE.CanvasTexture(fCv);
        frostTex.magFilter=THREE.LinearFilter;
        frostTex.minFilter=THREE.LinearMipmapLinearFilter;

        const fnS=256;
        const fnCv=document.createElement('canvas');fnCv.width=fnS;fnCv.height=fnS;
        const fnCtx=fnCv.getContext('2d');
        const fnd=fnCtx.createImageData(fnS,fnS);const fnp=fnd.data;
        for(let py=0;py<fnS;py++){
          for(let px=0;px<fnS;px++){
            const idx=(py*fnS+px)*4;
            const nx=px/fnS*30,ny=py/fnS*30;
            const dx2=sn(nx*4+10,ny*4)*0.28+sn(nx*12+5,ny*12)*0.18+sn(nx*25,ny*25+3)*0.12;
            const dy2=sn(nx*4,ny*4+20)*0.28+sn(nx*12,ny*12+8)*0.18+sn(nx*25+7,ny*25)*0.12;
            fnp[idx]=Math.floor((dx2*0.5+0.5)*255);
            fnp[idx+1]=Math.floor((dy2*0.5+0.5)*255);
            fnp[idx+2]=220;fnp[idx+3]=255;
          }
        }
        fnCtx.putImageData(fnd,0,0);
        const frostNorm=new THREE.CanvasTexture(fnCv);
        frostNorm.wrapS=frostNorm.wrapT=THREE.RepeatWrapping;
        frostNorm.repeat.set(40,40);

        const frostMat=new THREE.MeshStandardMaterial({
          color:0xd0dde8,transparent:true,map:frostTex,
          normalMap:frostNorm,normalScale:new THREE.Vector2(0.22,0.22),
          roughness:0.35,metalness:0.08,depthWrite:false,side:THREE.FrontSide,
          envMapIntensity:0.2,blending:THREE.NormalBlending,
          polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-2
        });
        const frostGeom=new THREE.PlaneGeometry(FROST_HALF_W*2,FROST_HALF_D*2,1,1);
        frostGeom.rotateX(-Math.PI/2);
        const frostMesh=new THREE.Mesh(frostGeom,frostMat);
        frostMesh.position.y=GROUND_Y+0.004;
        frostMesh.frustumCulled=false;

        const frostEntity=document.createElement('a-entity');
        frostEntity.setAttribute('id','frost-underlayer');
        frostEntity.setAttribute('class','clickable');
        frostEntity.object3D.position.set(FIELD_CX,0,FIELD_CZ);
        frostEntity.setObject3D('mesh', frostMesh);
        this.el.sceneEl.appendChild(frostEntity);
        this._frostEntity=frostEntity;

        // ══════════════════════════════════════════════════════════════
        //  LAYER 2 — SNOW (smooth displaced mesh)
        // ══════════════════════════════════════════════════════════════
        const snowGeom=new THREE.PlaneGeometry(FIELD_HALF_W*2,FIELD_HALF_D*2,SEG_X,SEG_Z);
        snowGeom.rotateX(-Math.PI/2);
        const pos=snowGeom.getAttribute('position');

        const wAng=Math.atan2(0.45,1.05),wdX=Math.cos(wAng),wdZ=Math.sin(wAng);

        for(let i=0;i<pos.count;i++){
          const x=pos.getX(i),z=pos.getZ(i);
          const worldX = x + FIELD_CX;
          const worldZ = z + FIELD_CZ;
          const edgeU = Math.abs(x) / FIELD_HALF_W;
          const edgeV = Math.abs(z) / FIELD_HALF_D;
          const edgeN = Math.max(edgeU, edgeV);
          if(edgeN>0.992){pos.setY(i,-1.5);continue;}

          const m=snowMask(worldX,worldZ);

          // ── Drift height: gentle rolling (visual detail via normal map) ──
          let drift=0;
          // Very large gentle terrain rolls
          drift+=(sn(worldX*0.012+3,worldZ*0.012-5)*0.5+0.5)*0.25;
          // Medium undulations
          drift+=(sn(worldX*0.032+20,worldZ*0.032-8)*0.5+0.5)*0.14;
          // Gentle sastrugi
          const saX=worldX*wdX+worldZ*wdZ,saZ=-worldX*wdZ+worldZ*wdX;
          drift+=(sn(saX*0.07,saZ*0.025)*0.5+0.5)*0.07;
          // Subtle fine variation (won't cause visible faceting)
          drift+=(sn(worldX*0.1+3,worldZ*0.1-2)*0.5+0.5)*0.03;

          // ── Wall accumulation: snow banks against outer building surfaces ──
          if(!isIndoor(worldX,worldZ)){
            const dw=distToWalls(worldX,worldZ);
            // Drift tapering over 12m, thickest right at wall
            const wallDrift=smootherstep(12,0,dw);
            // Organic variation along wall face
            const wallNoise=0.5+0.5*(sn(worldX*0.15+4,worldZ*0.15-6)*0.5+0.5);
            drift+=wallDrift*0.78*wallNoise;
            // Extra bank right at base (0-1.2m)
            const baseDrift=smootherstep(1.2,0,dw);
            drift+=baseDrift*0.28;
          }

          // ── Corridor approach berms: natural snow banks flanking each entrance lane ──
          // ── Corridor approach berms: natural snow banks flanking each entrance lane ──
          {
            // North corridor: berm peaks at ±(hw+1.0) from lane centre, fades inward & outward
            const cx=4.5, hw=1.8, zEntry=-56.5;
            const dz=worldZ-zEntry;
            if(dz>0 && dz<10.0){
              const pathLen=smootherstep(10.0,0.0,dz);
              const xAbs=Math.abs(worldX-cx);
              const berm=Math.exp(-((xAbs-(hw+0.9))*(xAbs-(hw+0.9)))/(2*0.7*0.7));
              drift+=0.22*berm*pathLen;
            }
          }
          {
            // South exit: same logic, lane grows southward
            const cx=-4.5, hw=1.1, zEntry=-81.5;
            const dz=zEntry-worldZ;
            if(dz>0 && dz<10.0){
              const pathLen=smootherstep(10.0,0.0,dz);
              const xAbs=Math.abs(worldX-cx);
              const berm=Math.exp(-((xAbs-(hw+0.9))*(xAbs-(hw+0.9)))/(2*0.7*0.7));
              drift+=0.22*berm*pathLen;
            }
          }

          // ── Wall-edge drift taper ──
          // Taper all drift to zero within ~1.2m of the indoor boundary (outdoor side).
          // This ensures the vertex just outside the exclusion zone has near-zero height,
          // so the HIDDEN_Y→outdoor step is tiny and the cliff artifact disappears.
          if(!isIndoor(x,z)){
            const dIn = distToAnyInterior(x,z);
            const edgeTaper = smoothstep(0.0, 1.2, dIn);
            drift *= edgeTaper;
          }

          // ── Coverage lift ──
          // Keep the localized snow convincingly above the rock surface so the rock
          // does not poke through in the main accumulation zone. This is strongest in
          // the filled snow mass and fades toward the irregular perimeter.
          drift += 0.12 * smoothstep(0.22, 0.92, m);

          drift*=(1-smootherstep(0.78,0.97,edgeN));

          // ── Canyon channel: carve a slot at ground level through the snow field ──
          // chSup = 0 in the channel centre (drift zeroed → flat snow floor at GROUND_Y)
          //       = 1 everywhere else (full drift, natural walls)
          // mFinal boosted to 1.0 in channel ONLY for outdoor points — indoor vertices
          // must stay at HIDDEN_Y or the corridor floor z-fights at GROUND_Y.
          const chSup=channelDriftSuppress(worldX,worldZ);
          drift*=chSup;
          const mFinal = isIndoor(worldX,worldZ) ? m : Math.max(m, 1.0-chSup);

          // ── Continuous blend: hidden → ground → snow ──
          const snowSurface=GROUND_Y+Math.max(0,drift);
          const northSink=smootherstep(-45,-32,worldZ);
          const effectiveHiddenY=HIDDEN_Y-northSink*0.2;
          const y=effectiveHiddenY+(snowSurface-effectiveHiddenY)*mFinal;
          pos.setY(i,y);
        }

        pos.needsUpdate=true;
        snowGeom.computeVertexNormals();
        // ── PBR textures (repo'd in ./assets/textures) ──
        // AO requires uv2 in Three.js
        if (snowGeom.getAttribute('uv') && !snowGeom.getAttribute('uv2')) {
          const uv = snowGeom.getAttribute('uv');
          snowGeom.setAttribute('uv2', new THREE.BufferAttribute(new Float32Array(uv.array), 2));
        }

        const texLoader = new THREE.TextureLoader();
        const texAniso = 4;
        const snowColorTex = texLoader.load('./assets/textures/snow_basecolor.webp');
        const snowNormalTex = texLoader.load('./assets/textures/snow_normal_gl.webp');
        const snowRoughTex = texLoader.load('./assets/textures/snow_roughness.jpg');
        const snowAoTex = texLoader.load('./assets/textures/snow_ao.jpg');

        [snowColorTex, snowNormalTex, snowRoughTex, snowAoTex].forEach((t) => {
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(12, 12);
          t.anisotropy = texAniso;
        });

        snowColorTex.colorSpace = THREE.SRGBColorSpace;

        const snowMat=new THREE.MeshStandardMaterial({
          color:0xffffff,
          map:snowColorTex,
          normalMap:snowNormalTex,
          roughnessMap:snowRoughTex,
          aoMap:snowAoTex,
          normalScale:new THREE.Vector2(0.45,0.45),
          roughness:0.95,
          metalness:0.0,
          aoMapIntensity:0.35,
          envMapIntensity:0.07,
          side:THREE.FrontSide,
          depthWrite:true,
          polygonOffset:true,
          polygonOffsetFactor:-2,
          polygonOffsetUnits:-2
        });
        const snowMesh=new THREE.Mesh(snowGeom,snowMat);
        snowMesh.receiveShadow=true;
        snowMesh.frustumCulled=false;

        const snowEntity=document.createElement('a-entity');
        snowEntity.setAttribute('id','snow-ground-field');
        snowEntity.setAttribute('class','clickable');
        snowEntity.object3D.position.set(FIELD_CX,0,FIELD_CZ);
        snowEntity.setObject3D('mesh', snowMesh);
        this.el.sceneEl.appendChild(snowEntity);

        const FIELD_MIN_X = FIELD_CX - FIELD_HALF_W;
        const FIELD_MAX_X = FIELD_CX + FIELD_HALF_W;
        const FIELD_MIN_Z = FIELD_CZ - FIELD_HALF_D;
        const FIELD_MAX_Z = FIELD_CZ + FIELD_HALF_D;

        const makeExtensionPatch = (cfg) => {
          const patchRes = cfg.res || 180;
          const alphaSize = 512;
          const alphaCv = document.createElement('canvas');
          alphaCv.width = alphaSize;
          alphaCv.height = alphaSize;
          const alphaCtx = alphaCv.getContext('2d');
          const alphaImg = alphaCtx.createImageData(alphaSize, alphaSize);
          const ap = alphaImg.data;

          const geom = new THREE.PlaneGeometry(cfg.w, cfg.d, patchRes, patchRes);
          geom.rotateX(-Math.PI / 2);
          const pos = geom.attributes.position;
          const uv = geom.attributes.uv;
          const seamOverlap = cfg.seamOverlap || 2.6;
          const seamBlend = cfg.seamBlend || 2.8;
          const sideFade = cfg.sideFade || 0.22;
          const outerFadeStart = cfg.outerFadeStart || 0.82;
          const outerFadeEnd = cfg.outerFadeEnd || 1.02;
          const rockClearance = cfg.rockClearance || 0.05;
          const seamDrop = cfg.seamDrop || 0.014;
          const perimeterSoftness = cfg.perimeterSoftness || 0.22;
          const silhouetteInset = cfg.silhouetteInset || 0.15;

          function getPatchAxes(u, v) {
            let outward, lateral;
            if (cfg.dir === 'north') { outward = 1 - v; lateral = Math.abs(u - 0.5) * 2; }
            else if (cfg.dir === 'south') { outward = v; lateral = Math.abs(u - 0.5) * 2; }
            else if (cfg.dir === 'east') { outward = u; lateral = Math.abs(v - 0.5) * 2; }
            else { outward = 1 - u; lateral = Math.abs(v - 0.5) * 2; }
            return { outward, lateral };
          }

          function getSeamDistance(worldX, worldZ) {
            if (cfg.dir === 'north') return worldZ - FIELD_MAX_Z;
            if (cfg.dir === 'south') return FIELD_MIN_Z - worldZ;
            if (cfg.dir === 'east') return worldX - FIELD_MAX_X;
            return FIELD_MIN_X - worldX;
          }

          function patchMask(worldX, worldZ, u, v) {
            const axes = getPatchAxes(u, v);
            const outward = axes.outward;
            const lateral = axes.lateral;
            const seamDist = getSeamDistance(worldX, worldZ);

            const nShapeA = sn(worldX * 0.040 + cfg.seedA * 1.37, worldZ * 0.040 - cfg.seedB * 1.11) * 0.5 + 0.5;
            const nShapeB = sn(worldX * 0.090 - cfg.seedB * 0.73, worldZ * 0.090 + cfg.seedA * 0.91) * 0.5 + 0.5;
            const nShapeC = sn(worldX * 0.16 + cfg.seedB * 0.29, worldZ * 0.16 - cfg.seedA * 0.33) * 0.5 + 0.5;
            const laneNoise = sn(
              (cfg.dir === 'north' || cfg.dir === 'south' ? worldX : worldZ) * 0.055 + cfg.seedA * 0.61,
              (cfg.dir === 'north' || cfg.dir === 'south' ? worldZ : worldX) * 0.022 - cfg.seedB * 0.37
            ) * 0.5 + 0.5;
            const breakup = 0.90 + 0.10 * nShapeB;

            const outerNoise = (nShapeA - 0.5) * 0.10 + (nShapeB - 0.5) * 0.06;
            const sideNoise = (nShapeB - 0.5) * 0.09 + (nShapeC - 0.5) * 0.05 + (laneNoise - 0.5) * 0.08;
            const tipNoise = (nShapeA - 0.5) * 0.09 + (nShapeC - 0.5) * 0.07;
            const perimeterNoise =
              (nShapeA - 0.5) * 0.11 +
              (nShapeB - 0.5) * 0.08 +
              (nShapeC - 0.5) * 0.05 +
              (laneNoise - 0.5) * 0.06;

            const sidePull = Math.pow(Math.max(0, outward), 1.05) * (0.18 + 0.11 * nShapeA + 0.05 * laneNoise);
            const sideThreshold = Math.max(
              0.34,
              1.0 - sideFade - silhouetteInset + perimeterSoftness - sidePull + sideNoise - 0.06
            );
            const sideCore = 1 - smootherstep(sideThreshold, sideThreshold + 0.22, lateral);

            const roundnessWarp =
              outward +
              lateral * (0.16 + 0.08 * nShapeA) +
              Math.pow(lateral, 2.0) * (0.24 + 0.12 * nShapeB);
            const tipThreshold = outerFadeStart - 0.03 + outerNoise + tipNoise * 0.42;
            const core = 1 - smootherstep(tipThreshold, outerFadeEnd + outerNoise + 0.11, roundnessWarp);

            const bulb = 1 - smootherstep(
              0.68 + outerNoise * 0.22,
              0.98 + outerNoise * 0.28,
              outward + lateral * (0.13 + 0.06 * nShapeA) + Math.pow(lateral, 2.0) * (0.19 + 0.09 * nShapeC)
            );
            const capWarp = Math.sqrt(
              Math.pow(outward * (0.98 + 0.10 * nShapeA), 2.0) +
              Math.pow(lateral * (0.78 + 0.12 * nShapeB), 2.0)
            );
            const roundedCap = 1 - smootherstep(0.88 + outerNoise * 0.10, 1.08 + outerNoise * 0.12, capWarp);

            const radialOut = outward * 2.0 - 1.0;
            const radialLat = lateral * 2.0 - 1.0;
            const ellipse = Math.sqrt(
              Math.pow(radialOut * (0.92 + 0.06 * nShapeA), 2.0) +
              Math.pow(radialLat * (0.88 + 0.08 * nShapeB), 2.0)
            );
            const circularEdge = 1 - smootherstep(0.86 + perimeterNoise * 0.12, 1.03 + perimeterNoise * 0.16, ellipse);

            const scallop = sn(
              (cfg.dir === 'north' || cfg.dir === 'south' ? worldX : worldZ) * 0.11 + cfg.seedA * 0.37,
              (cfg.dir === 'north' || cfg.dir === 'south' ? worldZ : worldX) * 0.11 - cfg.seedB * 0.29
            ) * 0.5 + 0.5;
            const scallopBand = 1 - smootherstep(0.58, 0.96, Math.max(outward, lateral));
            const irregularFeather = 1 - smootherstep(0.90 + (scallop - 0.5) * 0.22, 1.03 + (scallop - 0.5) * 0.24, ellipse + (scallop - 0.5) * 0.12 * scallopBand);

            const seamSolid = 1 - smootherstep(seamOverlap + 0.35, seamOverlap + seamBlend + 1.25, seamDist);
            const innerSideClamp = 1 - smootherstep(0.94, 1.02, lateral);

            let m = Math.max(
              core * sideCore * breakup * Math.max(bulb, roundedCap) * Math.max(circularEdge, irregularFeather),
              seamSolid * innerSideClamp
            );
            m *= 0.92 + 0.08 * snowMask(worldX, worldZ);
            return Math.max(0, Math.min(1, m));
          }

          for (let i = 0; i < pos.count; i++) {
            const lx = pos.getX(i);
            const lz = pos.getZ(i);
            const worldX = cfg.cx + lx;
            const worldZ = cfg.cz + lz;
            const u = uv.getX(i);
            const v = uv.getY(i);
            const axes = getPatchAxes(u, v);
            const outward = axes.outward;
            const baseMask = patchMask(worldX, worldZ, u, v);
            const seamDist = getSeamDistance(worldX, worldZ);
            const seamUnderlap = 1 - smootherstep(0.0, seamOverlap + seamBlend, seamDist);
            const nBig = sn(worldX * 0.05 + cfg.seedA, worldZ * 0.05 - cfg.seedB) * 0.5 + 0.5;
            const nMid = sn(worldX * 0.14 - cfg.seedB, worldZ * 0.14 + cfg.seedA) * 0.5 + 0.5;
            const nSmall = sn(worldX * 0.24 + cfg.seedB, worldZ * 0.24 - cfg.seedA) * 0.5 + 0.5;

            const innerBias = 1 - smootherstep(0.0, 0.78, outward);
            const bodyLift = (0.10 + 0.16 * innerBias) * baseMask;
            const shoulderLift = (0.038 + 0.018 * nBig) * (1 - smootherstep(0.05, 0.52, outward)) * baseMask;
            const edgeFeatherLift = 0.020 * (1 - smootherstep(0.48, 0.96, outward)) * baseMask;
            let y = GROUND_Y + bodyLift + shoulderLift + edgeFeatherLift + nBig * 0.024 + nMid * 0.015 + nSmall * 0.008;
            y -= smootherstep(0.72, 1.02, outward) * (0.012 + 0.008 * nMid);
            y += (channelDriftSuppress(worldX, worldZ) - 1.0) * 0.012;

            const edgeSupport = 1 - smootherstep(0.55, 1.02, outward);
            const seamSupport = 1 - smootherstep(seamOverlap + 0.15, seamOverlap + seamBlend + 0.9, seamDist);
            const lateralSupport = 1 - smootherstep(0.62, 1.02, Math.abs(axes.lateral));
            const perimeterSupport = Math.max(edgeSupport, lateralSupport);
            const minSnowSurface = GROUND_Y + (rockClearance + 0.050 * perimeterSupport + 0.032 * seamSupport) * baseMask;
            y = Math.max(y, minSnowSurface);

            if (seamUnderlap > 0.0) {
              const buriedY = GROUND_Y + rockClearance * 0.25 - seamDrop;
              y = y * (1 - seamUnderlap) + buriedY * seamUnderlap;
            }

            if (baseMask < 0.008) y = HIDDEN_Y;
            pos.setY(i, y);
          }
          pos.needsUpdate = true;
          geom.computeVertexNormals();
          geom.computeBoundingSphere();

          for (let py = 0; py < alphaSize; py++) {
            for (let px = 0; px < alphaSize; px++) {
              const idx = (py * alphaSize + px) * 4;
              const u = px / (alphaSize - 1);
              const v = py / (alphaSize - 1);
              const worldX = cfg.cx + (u - 0.5) * cfg.w;
              const worldZ = cfg.cz + (v - 0.5) * cfg.d;
              const m = patchMask(worldX, worldZ, u, v);
              const a = Math.floor(Math.max(0, Math.min(255, m * 255)));
              ap[idx] = 255; ap[idx+1] = 255; ap[idx+2] = 255; ap[idx+3] = a;
            }
          }
          alphaCtx.putImageData(alphaImg, 0, 0);
          const alphaTex = new THREE.CanvasTexture(alphaCv);
          alphaTex.wrapS = alphaTex.wrapT = THREE.ClampToEdgeWrapping;
          alphaTex.magFilter = THREE.LinearFilter;
          alphaTex.minFilter = THREE.LinearMipmapLinearFilter;

          const mat = snowMat.clone();
          mat.transparent = true;
          mat.alphaMap = alphaTex;
          mat.depthWrite = true;
          mat.alphaTest = 0.10;
          mat.polygonOffset = true;
          mat.polygonOffsetFactor = -3;
          mat.polygonOffsetUnits = -3;
          mat.needsUpdate = true;

          const mesh = new THREE.Mesh(geom, mat);
          mesh.receiveShadow = true;
          mesh.frustumCulled = false;

          const entity = document.createElement('a-entity');
          entity.setAttribute('id', cfg.id);
          entity.setAttribute('class', 'clickable');
          entity.object3D.position.set(cfg.cx, 0, cfg.cz);
          entity.setObject3D('mesh', mesh);
          this.el.sceneEl.appendChild(entity);
          this._meshes.push(mesh);
          this._extensionEntities = this._extensionEntities || [];
          this._extensionEntities.push(entity);
        };

        makeExtensionPatch({ id:'snow-ground-north', dir:'north', cx:0, cz:-35.0, w:67.5, d:27.0, seedA:11, seedB:29, sideFade:0.08, seamOverlap:3.9, seamBlend:4.8, rockClearance:0.135, perimeterSoftness:0.40, silhouetteInset:0.06, outerFadeStart:0.76, outerFadeEnd:1.02, res:224 });
        makeExtensionPatch({ id:'snow-ground-south', dir:'south', cx:0, cz:-115.0, w:67.5, d:27.5, seedA:37, seedB:7, sideFade:0.08, seamOverlap:3.9, seamBlend:4.8, rockClearance:0.135, perimeterSoftness:0.40, silhouetteInset:0.06, outerFadeStart:0.76, outerFadeEnd:1.03, res:224 });
        makeExtensionPatch({ id:'snow-ground-east', dir:'east', cx:44.75, cz:-75, w:29.5, d:64.5, seedA:19, seedB:41, sideFade:0.08, seamOverlap:3.9, seamBlend:4.8, rockClearance:0.135, perimeterSoftness:0.39, silhouetteInset:0.06, outerFadeStart:0.76, outerFadeEnd:1.02, res:224 });
        makeExtensionPatch({ id:'snow-ground-west', dir:'west', cx:-44.75, cz:-75, w:29.5, d:64.5, seedA:53, seedB:17, sideFade:0.08, seamOverlap:3.9, seamBlend:4.8, rockClearance:0.135, perimeterSoftness:0.39, silhouetteInset:0.06, outerFadeStart:0.76, outerFadeEnd:1.02, res:224 });

        this._snowEntity=snowEntity;
      },
      remove: function(){
        this._meshes.forEach(function(m){
          if(m.parent)m.parent.remove(m);
          m.geometry.dispose();
          if(m.material.map)m.material.map.dispose();
          if(m.material.normalMap)m.material.normalMap.dispose();
          if(m.material.roughnessMap)m.material.roughnessMap.dispose();
          if(m.material.aoMap)m.material.aoMap.dispose();
          m.material.dispose();
        });
        if(this._frostEntity){
          this._frostEntity.removeObject3D('mesh');
          if(this._frostEntity.parentNode)this._frostEntity.parentNode.removeChild(this._frostEntity);
          this._frostEntity=null;
        }
        if(this._snowEntity){

    // ── Main rock ground (selectable A-Frame entity) ───────────────────────────
    AFRAME.registerComponent('rock-ground', {
      schema: {
        x: {type: 'number', default: 25},
        y: {type: 'number', default: -0.002},
        z: {type: 'number', default: 0}
      },
      init: function () {
        const sn = (window._snoise && window._snoise.simplex2) ? window._snoise.simplex2 : () => 0;
        this._textures = [];
        this._materials = [];
        this._mesh = null;

        const CX = this.data.x;
        const CZ = this.data.z;
        const GY = 0.055;

        const smoothstep = (a, b, x) => {
          const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
          return t * t * (3 - 2 * t);
        };
        const ridged = (x, y) => {
          const n = sn(x, y);
          const r = 1 - Math.abs(n);
          return r * r;
        };
        const inBox2D = (x, z, b) => x >= b.x1 && x <= b.x2 && z >= b.z1 && z <= b.z2;
        const distToBoxOuter2D = (x, z, b) => {
          const dx = x < b.x1 ? (b.x1 - x) : (x > b.x2 ? (x - b.x2) : 0);
          const dz = z < b.z1 ? (b.z1 - z) : (z > b.z2 ? (z - b.z2) : 0);
          return Math.hypot(dx, dz);
        };

        const officeSnowBoxes = [
          { x1:-7.00, x2:7.00, z1:-81.50, z2:-68.50 },
          { x1: 2.18, x2:6.82, z1:-68.68, z2:-56.32 },
          { x1:-6.82, x2:-2.18, z1:-94.00, z2:-81.30 },
          { x1:-38.5, x2:38.5, z1:-53.5, z2:-13.0 },
          { x1:-38.5, x2:38.5, z1:-137.0, z2:-96.5 },
          { x1:27.0, x2:69.5, z1:-112.0, z2:-38.0 },
          { x1:-69.5, x2:-27.0, z1:-112.0, z2:-38.0 },
          { x1:-42.0, x2:42.0, z1:-56.5, z2:-10.5 },
          { x1:-42.0, x2:42.0, z1:-139.5, z2:-93.5 },
          { x1:24.5, x2:72.5, z1:-115.0, z2:-35.0 },
          { x1:-72.5, x2:-24.5, z1:-115.0, z2:-35.0 }
        ];
        const officeSnowSuppression = (x, z) => {
          let d = Infinity;
          let inside = false;
          for (const b of officeSnowBoxes) {
            if (inBox2D(x, z, b)) inside = true;
            d = Math.min(d, distToBoxOuter2D(x, z, b));
          }
          if (inside) return 1.0;
          return smoothstep(18.0, 1.5, d);
        };

        const tl = new THREE.TextureLoader();
        const mkTex = (path, repeat, isColor) => {
          const t = tl.load(path);
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(repeat, repeat);
          t.anisotropy = 4;
          if (isColor) t.colorSpace = THREE.SRGBColorSpace;
          this._textures.push(t);
          return t;
        };

        const rockPath = './assets/cave_wall/';
        const rockRepeat = 21.0;
        const diff  = mkTex(rockPath + 'moon_diffuse.webp', rockRepeat, true);
        const norm  = mkTex(rockPath + 'moon_normal.webp', rockRepeat, false);
        const rough = mkTex(rockPath + 'moon_rough.png', rockRepeat, false);
        const ao    = mkTex(rockPath + 'moon_ao.png', rockRepeat, false);

        const fieldW = 500, fieldD = 500, fieldSeg = 320;
        const geom = new THREE.PlaneGeometry(fieldW, fieldD, fieldSeg, fieldSeg);
        geom.rotateX(-Math.PI / 2);
        const pos = geom.getAttribute('position');
        for (let i = 0; i < pos.count; i++) {
          const lx = pos.getX(i), lz = pos.getZ(i);
          const wx = CX + lx, wz = CZ + lz;
          const ex = Math.abs(lx) / (fieldW * 0.5);
          const ez = Math.abs(lz) / (fieldD * 0.5);
          const edge = smoothstep(1.0, 0.82, Math.max(ex, ez));

          let h = 0;
          h += (sn(wx * 0.020 + 14.0, wz * 0.020 - 9.0) * 0.5 + 0.5) * 0.22;
          h += (sn(wx * 0.050 - 2.0, wz * 0.050 + 11.0) * 0.5 + 0.5) * 0.10;
          h += ridged(wx * 0.095 + 7.0, wz * 0.095 - 5.0) * 0.07;
          h += ridged(wx * 0.180 - 4.0, wz * 0.180 + 6.0) * 0.035;

          const approachSoftener = Math.exp(-(((lx + 12.0) / 18.0) ** 2 + (lz / 13.0) ** 2));
          h *= 1.0 - approachSoftener * 0.45;

          const poolEx = (lx - 1.5) / 23.0;
          const poolEz = lz / 16.0;
          const poolBlend = Math.exp(-(poolEx * poolEx + poolEz * poolEz));
          h *= 1.0 - poolBlend * 0.65;

          const officeKeepSnow = officeSnowSuppression(wx, wz);
          h *= 1.0 - officeKeepSnow * 0.98;

          pos.setY(i, GY + h * edge * 0.9);
        }
        pos.needsUpdate = true;
        geom.computeVertexNormals();
        const uv = geom.getAttribute('uv');
        geom.setAttribute('uv2', new THREE.BufferAttribute(new Float32Array(uv.array), 2));

        const mat = new THREE.MeshStandardMaterial({
          color: 0xd7dde4,
          map: diff, normalMap: norm, roughnessMap: rough, aoMap: ao,
          roughness: 0.965, metalness: 0, aoMapIntensity: 0.94,
          normalScale: new THREE.Vector2(1.95, 1.95),
          polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2,
        });
        this._materials.push(mat);

        const mesh = new THREE.Mesh(geom, mat);
        mesh.receiveShadow = true;
        mesh.frustumCulled = false;
        this._mesh = mesh;
        this.el.setObject3D('mesh', mesh);
        this.el.object3D.position.set(CX, this.data.y, CZ);
      },
      remove: function () {
        this.el.removeObject3D('mesh');
        if (this._mesh) {
          if (this._mesh.geometry) this._mesh.geometry.dispose();
          this._mesh = null;
        }
        this._materials.forEach((m) => m.dispose());
        this._textures.forEach((t) => t.dispose());
      }
    });

    // ── Primal Scene ─────────────────────────────────────────────────────────
    AFRAME.registerComponent('primal-scene', {
      init: function () {
        const sn = (window._snoise && window._snoise.simplex2) ? window._snoise.simplex2 : () => 0;
        this._meshes = [];
        this._materials = [];
        this._textures = [];
        this._root = new THREE.Group();
        this._root.name = 'primal-scene-root';
        this.el.setObject3D('mesh', this._root);

        const CX = PRIMAL_SCENE_CFG.CX, CZ = PRIMAL_SCENE_CFG.CZ;

        const tl = new THREE.TextureLoader();
        const mkTex = (path, repeat, isColor) => {
          const t = tl.load(path);
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(repeat, repeat);
          t.anisotropy = 4;
          if (isColor) t.colorSpace = THREE.SRGBColorSpace;
          this._textures.push(t);
          return t;
        };

        const groundPath = './assets/moon_ground/';
        const rockPath = './assets/cave_wall/';
        const tDiff  = mkTex(rockPath + 'moon_diffuse.webp', 5.2, true);
        const tNorm  = mkTex(rockPath + 'moon_normal.webp', 5.2, false);
        const tRough = mkTex(rockPath + 'moon_rough.png', 5.2, false);
        const tAO    = mkTex(rockPath + 'moon_ao.png', 5.2, false);
        const bDiff  = mkTex(rockPath + 'moon_diffuse.webp', 2.3, true);
        const bNorm  = mkTex(rockPath + 'moon_normal.webp', 2.3, false);
        const bRough = mkTex(rockPath + 'moon_rough.png', 2.3, false);
        const bAO    = mkTex(rockPath + 'moon_ao.png', 2.3, false);
        const mDiff  = mkTex(rockPath + 'moon_diffuse.webp', 10.5, true);
        const mNorm  = mkTex(rockPath + 'moon_normal.webp', 10.5, false);
        const mRough = mkTex(rockPath + 'moon_rough.png', 10.5, false);
        const mAO    = mkTex(rockPath + 'moon_ao.png', 10.5, false);
        const fDiff  = mkTex(rockPath + 'moon_diffuse.webp', 7.8, true);
        const fNorm  = mkTex(rockPath + 'moon_normal.webp', 7.8, false);
        const fRough = mkTex(rockPath + 'moon_rough.png', 7.8, false);
        const fAO    = mkTex(rockPath + 'moon_ao.png', 7.8, false);

        // Primal floor now derives directly from the shared base terrain + berm height field.

        // ── Rocky berm around the pool: emergent terrain, not object-boulders ──
        const boulderMat = new THREE.MeshStandardMaterial({
          color: 0xd7dde4,
          map: bDiff, normalMap: bNorm, roughnessMap: bRough, aoMap: bAO,
          roughness: 0.96, metalness: 0, aoMapIntensity: 0.92,
          normalScale: new THREE.Vector2(1.85, 1.85),
          polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -2,
        });
        this._materials.push(boulderMat);

        const bermW = 42.0, bermD = 32.0, bermSeg = 220;
        const bermGeom = new THREE.PlaneGeometry(bermW, bermD, bermSeg, bermSeg);
        bermGeom.rotateX(-Math.PI / 2);
        const bp = bermGeom.getAttribute('position');

        for (let i = 0; i < bp.count; i++) {
          const lx = bp.getX(i), lz = bp.getZ(i);
          const wx = CX + lx, wz = CZ + lz;
          let y = primalSceneHeight(wx, wz, sn);

          // Bury the berm perimeter slightly under the shared rock ground so the
          // overlay mesh cannot reveal its triangulated boundary or z-fight seam.
          const edgeDistX = bermW * 0.5 - Math.abs(lx);
          const edgeDistZ = bermD * 0.5 - Math.abs(lz);
          const edgeDist = Math.min(edgeDistX, edgeDistZ);
          const t = Math.max(0, Math.min(1, 1.0 - edgeDist / 4.2));
          const bury = t * t * (3 - 2 * t);
          y -= bury * 0.22;

          bp.setY(i, y);
        }

        bp.needsUpdate = true;
        bermGeom.computeVertexNormals();
        const buv = bermGeom.getAttribute('uv');
        bermGeom.setAttribute('uv2', new THREE.BufferAttribute(new Float32Array(buv.array), 2));
        const bermMesh = new THREE.Mesh(bermGeom, boulderMat);
        bermMesh.name = 'primal-rock-berm';
        bermMesh.position.set(CX, 0, CZ);
        this._root.add(bermMesh); this._meshes.push(bermMesh);



      },

      remove: function () {
        this._meshes.forEach(m => {
          if (m.parent) m.parent.remove(m);
          if (m.geometry) m.geometry.dispose();
        });
        if (this._root) {
          this.el.removeObject3D('mesh');
          this._root = null;
        }
        (this._materials || []).forEach(m => m && m.dispose && m.dispose());
        (this._textures || []).forEach(t => t && t.dispose && t.dispose());
      }
    });


    AFRAME.registerComponent('primal-mountains', {
      init: function () {
        const sn = (window._snoise && window._snoise.simplex2) ? window._snoise.simplex2 : () => 0;
        this._meshes = [];
        this._materials = [];
        this._textures = [];
        this._root = new THREE.Group();
        this._root.name = 'primal-mountains-root';
        this.el.setObject3D('mesh', this._root);

        const smoothstep = (a, b, x) => {
          const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
          return t * t * (3 - 2 * t);
        };
        const angleDelta = (a, b) => {
          let d = a - b;
          while (d > Math.PI) d -= Math.PI * 2;
          while (d < -Math.PI) d += Math.PI * 2;
          return d;
        };
        const ridged = (x, y) => {
          const n = sn(x, y);
          const r = 1 - Math.abs(n);
          return r * r;
        };

        const tl = new THREE.TextureLoader();
        const mkTex = (path, repeat, isColor) => {
          const t = tl.load(path);
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(repeat, repeat);
          t.anisotropy = 4;
          if (isColor) t.colorSpace = THREE.SRGBColorSpace;
          this._textures.push(t);
          return t;
        };

        const rockPath = './assets/cave_wall/';
        const mDiff  = mkTex(rockPath + 'moon_diffuse.webp', 10.5, true);
        const mNorm  = mkTex(rockPath + 'moon_normal.webp', 10.5, false);
        const mRough = mkTex(rockPath + 'moon_rough.png', 10.5, false);
        const mAO    = mkTex(rockPath + 'moon_ao.png', 10.5, false);

        const mtnMat = new THREE.MeshStandardMaterial({
          color: 0xd5dbe2,
          map: mDiff, normalMap: mNorm, roughnessMap: mRough, aoMap: mAO,
          roughness: 0.98, metalness: 0, aoMapIntensity: 0.88,
          normalScale: new THREE.Vector2(1.7, 1.7),
          side: THREE.DoubleSide,
        });
        this._materials.push(mtnMat);

        const GAP_CENTER = Math.PI * 0.5;
        const GAP_SIZE = 1.08;
        const OVERLAP = 0.09;
        const TOTAL_START = GAP_CENTER + GAP_SIZE * 0.5;
        const TOTAL_END = GAP_CENTER + Math.PI * 2 - GAP_SIZE * 0.5;
        const TOTAL_SPAN = TOTAL_END - TOTAL_START;
        const NUM_SECTORS = 8;

        for (let s = 0; s < NUM_SECTORS; s++) {
          const segA0 = TOTAL_START + (TOTAL_SPAN / NUM_SECTORS) * s - OVERLAP;
          const segA1 = TOTAL_START + (TOTAL_SPAN / NUM_SECTORS) * (s + 1) + OVERLAP;
          const segSpan = segA1 - segA0;
          const arcLen = 265 * segSpan;
          const radialDepth = 126;
          const geom = new THREE.PlaneGeometry(arcLen, radialDepth, 144, 38);
          geom.rotateX(-Math.PI / 2);
          const p = geom.getAttribute('position');

          for (let i = 0; i < p.count; i++) {
            const lx = p.getX(i);
            const lz = p.getZ(i);
            const u = (lx / arcLen) + 0.5;
            const v = (lz / radialDepth) + 0.5;
            const angle = segA0 + u * segSpan;

            const angleX = Math.cos(angle);
            const angleZ = Math.sin(angle);
            const gapFade = smoothstep(GAP_SIZE * 0.5 + 0.03, GAP_SIZE * 0.5 + 0.34, Math.abs(angleDelta(angle, GAP_CENTER)));
            const sideFade = smoothstep(0.0, 0.09, u) * smoothstep(0.0, 0.09, 1 - u);

            const angleFieldA = sn(angleX * 1.8 + 1.7, angleZ * 1.8 - 2.4) * 0.5 + 0.5;
            const angleFieldB = sn(angleX * 3.7 - 8.0, angleZ * 3.7 + 5.0) * 0.5 + 0.5;
            const inwardAdvance = (angleFieldA * 34.0 + angleFieldB * 18.0) * gapFade;
            const retreat = (sn(angleX * 2.5 + 11.0, angleZ * 2.5 - 6.0) * 0.5 + 0.5) * 11.0;
            const localInner = 232 - inwardAdvance + retreat;
            const localOuter = localInner + 94 + angleFieldB * 30.0 + (1 - angleFieldA) * 8.0;
            const radius = localInner + v * (localOuter - localInner);
            const wx = Math.cos(angle) * radius;
            const wz = Math.sin(angle) * radius;

            const radialRise = smoothstep(0.10, 0.34, v);
            const innerHold = 0.12 + 0.88 * smoothstep(0.18, 0.58, v);
            const skylineBias = 0.64 + angleFieldA * 0.78 + Math.max(0, sn(angleX * 5.8 + 3.0, angleZ * 5.8 - 1.0)) * 0.42;

            const broad = (sn(wx*0.009, wz*0.009) * 0.5 + 0.5) * 9.2;
            const broad2 = (sn(wx*0.015 + 20.0, wz*0.015 - 13.0) * 0.5 + 0.5) * 7.6;
            const ridgeA = ridged(wx*0.029 - 5.0, wz*0.029 + 8.0) * 11.8;
            const ridgeB = ridged(wx*0.046 + 11.0, wz*0.046 - 7.0) * 8.0;
            const ridgeC = ridged(wx*0.072 - 9.0, wz*0.072 + 4.0) * 4.4;
            const cliffs = Math.max(0, sn(wx*0.090 - 3.0, wz*0.090 + 2.0)) * 4.0;
            const saddles = Math.max(0, sn(wx*0.022 + 4.0, wz*0.022 - 6.0)) * 3.2;

            let h = 1.0 + radialRise * innerHold * skylineBias * (broad + broad2 + ridgeA + ridgeB + ridgeC + cliffs);
            h -= saddles * radialRise * (0.65 + angleFieldB * 0.35);
            h *= gapFade * sideFade;

            p.setXYZ(i, wx, -2.7 + h, wz);
          }

          p.needsUpdate = true;
          geom.computeVertexNormals();
          const uv = geom.getAttribute('uv');
          geom.setAttribute('uv2', new THREE.BufferAttribute(new Float32Array(uv.array), 2));
          const mesh = new THREE.Mesh(geom, mtnMat);
          mesh.name = `primal-mountain-sector-${s}`;
          this._root.add(mesh);
          this._meshes.push(mesh);
        }
      },

      remove: function () {
        this._meshes.forEach(m => {
          if (m.parent) m.parent.remove(m);
          if (m.geometry) m.geometry.dispose();
        });
        if (this._root) {
          this.el.removeObject3D('mesh');
          this._root = null;
        }
        (this._materials || []).forEach(m => m && m.dispose && m.dispose());
        (this._textures || []).forEach(t => t && t.dispose && t.dispose());
      }
    });
</script>
