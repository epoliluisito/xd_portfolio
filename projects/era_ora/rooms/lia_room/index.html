<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Lia Room</title>
<script src="../../vendor/aframe/aframe-1.5.0.min.js"></script>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }

    /* Flash fix: cover the canvas immediately at the CSS level before JS runs */
    a-scene { background: #000; }

    /* Fade-in overlay: starts opaque black, fades out once scene is ready */
    #fadeIn {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 1;
      pointer-events: none;
      transition: opacity 900ms ease;
      z-index: 9999;
    }
    #fadeIn.done { opacity: 0; }

    /* ── Quit button — matches aya.dev exactly ── */
    #quitShell {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 220;
    }
    #quitBtn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.35);
      color: rgba(255,255,255,0.85);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    #quitBtn:hover { border-color: rgba(255,255,255,0.32); color: rgba(255,255,255,0.95); }

    #quitConfirm {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.62);
      z-index: 230;
    }
    #quitConfirm.show { display: flex; }
    #quitCard {
      width: min(420px, calc(100vw - 48px));
      background: rgba(0,0,0,0.78);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 14px;
      padding: 18px;
      color: rgba(255,255,255,0.92);
      box-shadow: 0 22px 70px rgba(0,0,0,0.62);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #quitCard h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    #quitCard p {
      margin: 0 0 14px 0;
      font-size: 13px;
      opacity: 0.85;
      line-height: 1.35;
    }
    #quitActions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .qbtn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.92);
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .qbtn.primary {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.32);
      color: rgba(255,255,255,0.96);
    }
  </style>
<script>
    // ── Components ────────────────────────────────────────────────────────────

    // Disable fog on specific meshes (earth sphere)
    AFRAME.registerComponent('no-fog', {
      init: function () {
        const apply = (obj) => {
          if (!obj || !obj.traverse) return;
          obj.traverse((n) => {
            if (!n.material) return;
            const mats = Array.isArray(n.material) ? n.material : [n.material];
            mats.forEach((m) => {
              if (m && Object.prototype.hasOwnProperty.call(m, 'fog')) {
                m.fog = false;
                m.needsUpdate = true;
              }
            });
          });
        };
        apply(this.el.object3D);
        this.el.addEventListener('object3dset', () => apply(this.el.object3D));
      }
    });

    // Improved earth texture sampling
    AFRAME.registerComponent('earth-texture-quality', {
      init: function () {
        const apply = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.traverse((n) => {
            if (!n.isMesh || !n.material) return;
            const mats = Array.isArray(n.material) ? n.material : [n.material];
            mats.forEach((m) => {
              if (m.map) {
                m.map.anisotropy = 4;
                m.map.minFilter = THREE.LinearMipmapLinearFilter;
                m.map.magFilter = THREE.LinearFilter;
                m.map.needsUpdate = true;
              }
              m.needsUpdate = true;
            });
          });
        };
        apply();
        this.el.addEventListener('object3dset', apply);
      }
    });

    // Pitch clamp
    AFRAME.registerComponent('pitch-clamp', {
      schema: { min: { type: 'number', default: -80 }, max: { type: 'number', default: 80 } },
      tick: function () {
        const lc = this.el.components && this.el.components['look-controls'];
        if (!lc || !lc.pitchObject) return;
        const minR = this.data.min * Math.PI / 180;
        const maxR = this.data.max * Math.PI / 180;
        const p = lc.pitchObject.rotation.x;
        if (p < minR) lc.pitchObject.rotation.x = minR;
        if (p > maxR) lc.pitchObject.rotation.x = maxR;
      }
    });

    // IBL: scene-level env map driving all PBR metalness/roughness — must match aya.dev
    // aya.dev uses simple-ibl="intensity: 0.35; color: #e4ebf4" on the a-scene
    AFRAME.registerComponent('simple-ibl', {
      schema: { intensity: { type: 'number', default: 1.25 }, color: { type: 'color', default: '#dfe6ef' } },
      init: function () {
        const sceneObj = this.el.sceneEl.object3D;
        const mkCanvas = () => {
          const cv = document.createElement('canvas'); cv.width = cv.height = 2;
          const ctx = cv.getContext('2d');
          const g = ctx.createLinearGradient(0,0,2,2);
          g.addColorStop(0, this.data.color);
          g.addColorStop(1, '#aeb7c3');
          ctx.fillStyle = g; ctx.fillRect(0,0,2,2);
          return cv;
        };
        const cube = new THREE.CubeTexture([mkCanvas(),mkCanvas(),mkCanvas(),mkCanvas(),mkCanvas(),mkCanvas()]);
        cube.needsUpdate = true;
        sceneObj.environment = cube;
        const applyIntensity = () => {
          sceneObj.traverse(o => {
            if (!o || !o.isMesh) return;
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            mats.forEach(m => {
              if (m && m.isMeshStandardMaterial && !(m.userData && m.userData.isNPC)) { m.envMapIntensity = this.data.intensity; m.needsUpdate = true; }
            });
          });
        };
        applyIntensity();
        this.el.sceneEl.addEventListener('object3dset', applyIntensity);
      }
    });
    
    // Fix Mixamo/GLB NPC materials: opaque, matte, stable depth sorting
    AFRAME.registerComponent('mixamo-mat-fix', {
      init: function () {
        this._apply = this._apply.bind(this);
        this.el.addEventListener('model-loaded', this._apply);
        this.el.addEventListener('object3dset', this._apply);
        this._apply();
      },
      _apply: function () {
        const root = this.el.getObject3D('mesh') || this.el.object3D;
        if (!root || !root.traverse) return;
        root.traverse((n) => {
          if (!n || !n.isMesh || !n.material) return;
          n.castShadow = false;
          n.receiveShadow = false;
          const mats = Array.isArray(n.material) ? n.material : [n.material];
          mats.forEach((m) => {
            if (!m) return;
            const wasTransparent = !!m.transparent || (typeof m.opacity === 'number' && m.opacity < 0.999);
            m.transparent = false;
            m.opacity = 1.0;
            m.depthWrite = true;
            m.depthTest = true;
            m.side = THREE.FrontSide;
            const likelyCutout = wasTransparent || !!m.alphaMap || /hair|lash|brow|card|alpha/i.test((m.name || ''));
            m.alphaTest = likelyCutout ? Math.max(m.alphaTest || 0, 0.35) : 0;
            if ('premultipliedAlpha' in m) m.premultipliedAlpha = false;
            // Swap to Lambert — zero specular, purely diffuse
            var lam = new THREE.MeshLambertMaterial();
            if (m.map) lam.map = m.map;
            if (m.color) lam.color = m.color.clone();
            if (m.alphaMap) lam.alphaMap = m.alphaMap;
            lam.alphaTest = m.alphaTest || 0;
            lam.transparent = false;
            lam.opacity = 1.0;
            lam.depthWrite = true;
            lam.depthTest = true;
            lam.side = THREE.FrontSide;
            lam.userData = lam.userData || {};
            lam.userData.isNPC = true;
            if (Array.isArray(n.material)) {
              var idx = n.material.indexOf(m);
              if (idx >= 0) n.material[idx] = lam;
            } else {
              n.material = lam;
            }
          });
        });
      },
      remove: function () {
        this.el.removeEventListener('model-loaded', this._apply);
        this.el.removeEventListener('object3dset', this._apply);
      }
    });

AFRAME.registerComponent('rig-walk', {
      schema: {
        speed: { type: 'number', default: 2.6 },
        radius: { type: 'number', default: 0.28 },
        height: { type: 'number', default: 1.6 },
        collidableSelector: { type: 'string', default: '.solid' },
        refreshMs: { type: 'number', default: 250 }
      },
      init: function () {
        this.keys = Object.create(null);

        const MOVE = new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight']);
        this._onKeyDown = (e) => { if (MOVE.has(e.code)) e.preventDefault(); this.keys[e.code] = true; };
        this._onKeyUp   = (e) => { if (MOVE.has(e.code)) e.preventDefault(); this.keys[e.code] = false; };
        this._clearKeys = () => { for (const k in this.keys) this.keys[k] = false; };

        window.addEventListener('keydown', this._onKeyDown, { passive: false });
        window.addEventListener('keyup',   this._onKeyUp,   { passive: false });
        window.addEventListener('blur', this._clearKeys);
        document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement) this._clearKeys(); });

        this._colliderEls = [];
        this._lastRefresh = -Infinity;

        // Scratch objects to avoid GC
        this._playerBox = new THREE.Box3();
        this._tmpBox = new THREE.Box3();
        this._tmpV3 = new THREE.Vector3();

        this._refreshColliders = () => {
          const scene = this.el.sceneEl;
          if (!scene) return;
          this._colliderEls = Array.from(scene.querySelectorAll(this.data.collidableSelector));
          this._lastRefresh = performance.now();
        };

        // Refresh once scene loads, then whenever models finish loading
        this.el.sceneEl.addEventListener('loaded', this._refreshColliders);
        this.el.sceneEl.addEventListener('model-loaded', this._refreshColliders);
      },

      _intersectsAt: function (x, z) {
        const r = this.data.radius;
        const y = this.el.object3D.position.y;
        const h = this.data.height;

        this._playerBox.min.set(x - r, y, z - r);
        this._playerBox.max.set(x + r, y + h, z + r);

        for (let i = 0; i < this._colliderEls.length; i++) {
          const el = this._colliderEls[i];
          if (!el || !el.object3D) continue;

          // If collider has no visible mesh yet, skip
          // (Box3.setFromObject handles empty groups, but guard anyway)
          this._tmpBox.setFromObject(el.object3D);
          if (!isFinite(this._tmpBox.min.x) || !isFinite(this._tmpBox.max.x)) continue;

          if (this._tmpBox.intersectsBox(this._playerBox)) return true;
        }
        return false;
      },

      tick: function (t, dt) {
        // Periodically refresh collider list in case DOM changes
        if ((t - this._lastRefresh) > this.data.refreshMs) this._refreshColliders();

        const w = !!this.keys['KeyW'] || !!this.keys['ArrowUp'];
        const s = !!this.keys['KeyS'] || !!this.keys['ArrowDown'];
        const a = !!this.keys['KeyA'] || !!this.keys['ArrowLeft'];
        const d = !!this.keys['KeyD'] || !!this.keys['ArrowRight'];
        if (!w && !s && !a && !d) return;

        const dtS = Math.min(0.05, dt / 1000);
        const cam = this.el.querySelector('[camera]');
        if (!cam) return;

        const lc = cam.components && cam.components['look-controls'];
        const yaw = lc && lc.yawObject ? lc.yawObject.rotation.y : 0;
        const totalYaw = yaw + (this.el.object3D.rotation.y || 0);

        let mx = 0, mz = 0;
        if (w) { mx -= Math.sin(totalYaw); mz -= Math.cos(totalYaw); }
        if (s) { mx += Math.sin(totalYaw); mz += Math.cos(totalYaw); }
        if (a) { mx -= Math.cos(totalYaw); mz += Math.sin(totalYaw); }
        if (d) { mx += Math.cos(totalYaw); mz -= Math.sin(totalYaw); }

        const len = Math.sqrt(mx*mx + mz*mz);
        if (len <= 0) return;

        const step = this.data.speed * dtS;
        const dx = (mx / len) * step;
        const dz = (mz / len) * step;

        const pos = this.el.object3D.position;
        const x0 = pos.x;
        const z0 = pos.z;

        // Try X movement (slide)
        const x1 = x0 + dx;
        if (!this._intersectsAt(x1, z0)) pos.x = x1;

        // Try Z movement (slide)
        const z1 = pos.z + dz;
        if (!this._intersectsAt(pos.x, z1)) pos.z = z1;
      },

      remove: function () {
        window.removeEventListener('keydown', this._onKeyDown);
        window.removeEventListener('keyup',   this._onKeyUp);
        window.removeEventListener('blur', this._clearKeys);
      }
    });


    AFRAME.registerComponent('starry-sky', {
      init: function () {
        const size = 2048;
        const cv = document.createElement('canvas');
        cv.width = size; cv.height = size;
        const ctx = cv.getContext('2d');

        // Pure black base
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, size, size);

        // Generate star positions
        const stars = [];
        const layers = [
          { count: 2000, minR: 0.2, maxR: 0.45, minA: 0.15, maxA: 0.4  },
          { count: 450,  minR: 0.3, maxR: 0.6,  minA: 0.3,  maxA: 0.6  },
          { count: 70,   minR: 0.5, maxR: 0.8,  minA: 0.5,  maxA: 0.8  },
          { count: 12,   minR: 0.7, maxR: 1.0,  minA: 0.7,  maxA: 0.95 }
        ];

        for (const layer of layers) {
          for (let i = 0; i < layer.count; i++) {
            const x = Math.random() * size;
            const y = Math.random() * size;
            const r = layer.minR + Math.random() * (layer.maxR - layer.minR);
            const a = layer.minA + Math.random() * (layer.maxA - layer.minA);
            const hue = Math.random();
            let cr = 255, cg = 255, cb = 255;
            if (hue > 0.85 && hue < 0.92) { cr = 210; cg = 220; cb = 255; }
            else if (hue > 0.92) { cr = 255; cg = 245; cb = 220; }
            stars.push({ x: x, y: y, r: r, a: a, cr: cr, cg: cg, cb: cb });
          }
        }

        // Draw constellation lines FIRST (behind stars)
        // Only connect brighter stars, very thin, very faint
        const brightStars = stars.filter(function(s) { return s.a > 0.35; });
        const maxDist = 90;
        ctx.lineWidth = 0.3;
        for (let i = 0; i < brightStars.length; i++) {
          let connections = 0;
          for (let j = i + 1; j < brightStars.length; j++) {
            if (connections >= 2) break;
            const dx = brightStars[i].x - brightStars[j].x;
            const dy = brightStars[i].y - brightStars[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < maxDist) {
              const t = 1 - dist / maxDist;
              const lineAlpha = t * 0.06 * (brightStars[i].a + brightStars[j].a) * 0.5;
              if (lineAlpha > 0.005) {
                ctx.beginPath();
                ctx.moveTo(brightStars[i].x, brightStars[i].y);
                ctx.lineTo(brightStars[j].x, brightStars[j].y);
                ctx.strokeStyle = 'rgba(180,210,255,' + lineAlpha + ')';
                ctx.stroke();
                connections++;
              }
            }
          }
        }

        // Draw stars on top
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          ctx.fillStyle = 'rgba(' + s.cr + ',' + s.cg + ',' + s.cb + ',' + s.a + ')';
          ctx.fillRect(Math.floor(s.x), Math.floor(s.y), Math.ceil(s.r), Math.ceil(s.r));
        }

        const tex = new THREE.CanvasTexture(cv);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        tex.needsUpdate = true;
        const apply = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.traverse((n) => {
            if (n.material) {
              n.material.map = tex;
              n.material.color = new THREE.Color(0xffffff);
              n.material.needsUpdate = true;
            }
          });
        };
        apply();
        this.el.addEventListener('object3dset', apply);
      }
    });


    // ── Snow: cinematic wind-driven particles ──────────────────────────────────
    AFRAME.registerComponent('snow', {
      schema: {
        count:       { type: 'number', default: 4000 },
        areaWidth:   { type: 'number', default: 80 },
        areaDepth:   { type: 'number', default: 80 },
        ceiling:     { type: 'number', default: 25 },
        floor:       { type: 'number', default: 0.1 },
        fallSpeed:   { type: 'number', default: 1.2 },
        fallVar:     { type: 'number', default: 0.6 },
        windX:       { type: 'number', default: 0.8 },
        windZ:       { type: 'number', default: 0.3 },
        gustStr:     { type: 'number', default: 0.4 },
        gustFreq:    { type: 'number', default: 0.15 },
        rampTime:    { type: 'number', default: 30 },
        size:        { type: 'number', default: 0.06 }
      },
      init: function () {
        const d = this.data;
        const N = d.count;
        this._officeCX = 0; this._officeCZ = -75;
        this._platClearR = 8.0;
        this._sn = (window._snoise && window._snoise.simplex2) ? window._snoise.simplex2 : function(){ return 0; };

        this._fallSpeeds = new Float32Array(N);
        this._driftX = new Float32Array(N);
        this._driftZ = new Float32Array(N);
        this._spawnDelay = new Float32Array(N);
        this._phase = new Float32Array(N);
        this._swirlR = new Float32Array(N);
        this._swirlSpd = new Float32Array(N);
        this._turbScale = new Float32Array(N);
        const positions = new Float32Array(N * 3);

        for (let i = 0; i < N; i++) {
          this._spawnDelay[i] = Math.pow(Math.random(), 1.6) * d.rampTime;
          positions[i*3] = positions[i*3+1] = positions[i*3+2] = 9999;
          this._fallSpeeds[i] = d.fallSpeed * (0.3 + Math.random()*1.0);
          this._driftX[i] = (Math.random()-0.5)*0.5;
          this._driftZ[i] = (Math.random()-0.5)*0.5;
          this._phase[i] = Math.random()*Math.PI*2;
          this._swirlR[i] = 0.015+Math.random()*0.12;
          this._swirlSpd[i] = (0.7+Math.random()*2.5)*(Math.random()<0.5?1:-1);
          this._turbScale[i] = 0.4+Math.random()*1.0;
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Soft glowing flake sprite
        const cv = document.createElement('canvas');
        cv.width=64; cv.height=64;
        const ctx = cv.getContext('2d');
        const grad = ctx.createRadialGradient(32,32,0,32,32,32);
        grad.addColorStop(0,'rgba(255,255,255,1.0)');
        grad.addColorStop(0.12,'rgba(255,255,255,0.85)');
        grad.addColorStop(0.4,'rgba(240,248,255,0.35)');
        grad.addColorStop(0.7,'rgba(220,238,255,0.10)');
        grad.addColorStop(1,'rgba(200,225,255,0)');
        ctx.fillStyle=grad; ctx.fillRect(0,0,64,64);
        const spriteTex = new THREE.CanvasTexture(cv);

        const mat = new THREE.PointsMaterial({
          map:spriteTex, size:d.size, transparent:true, opacity:0.9,
          depthWrite:false, blending:THREE.NormalBlending, sizeAttenuation:true, color:0xffffff
        });

        this._points = new THREE.Points(geom, mat);
        this._points.frustumCulled = false;
        this.el.sceneEl.object3D.add(this._points);

        this._elapsed = 0;
        this._posAttr = geom.getAttribute('position');
        this._spawned = new Uint8Array(N);
        this._ws = { x:d.windX, z:d.windZ, tx:d.windX, tz:d.windZ, timer:0 };
      },

      _isIndoor: function(x,z){
        // Outer shells — no particles inside walls or rooms
        if(x>-7.15 && x<7.15 && z>-81.65 && z<-68.35) return true;
        if(x>2.25 && x<6.75 && z>-68.5 && z<-56.5) return true;
        if(x>-6.75 && x<-2.25 && z>-96.5 && z<-84.5) return true;
        // Doorway bridge zones
        if(x>3.15 && x<5.85 && z>-69.2 && z<-67.8) return true;
        if(x>-5.85 && x<-3.15 && z>-82.2 && z<-80.8) return true;
        return false;
      },

      _nearPlatform: function(x,z){ return Math.sqrt(x*x+z*z)<this._platClearR; },

      _zoneMask: function(x,z){
        const sn=this._sn;
        const dx=x-this._officeCX, dz=z-this._officeCZ;
        const r=Math.sqrt(dx*dx+dz*dz);

        // Platform
        const pd=Math.sqrt(x*x+z*z);
        if(pd<this._platClearR-1) return 0;
        let pf=1;
        if(pd<this._platClearR+2){
          pf=(pd-this._platClearR+1)/3;
          pf=Math.max(0,Math.min(1,pf)); pf=pf*pf*(3-2*pf);
        }

        const nA=sn(x*0.05,z*0.05)*6.5;
        const nB=sn(x*0.11+22,z*0.11-9)*2.5;
        const outerR=36+nA+nB;
        const innerFull=12+sn(x*0.08-30,z*0.08+17)*1.5;

        let m=(outerR-r)/Math.max(0.001,(outerR-innerFull));
        m=Math.max(0,Math.min(1,m)); m=m*m*(3-2*m);

        const sr=Math.sqrt(x*x+z*z);
        let sf=(sr-18)/30; sf=Math.max(0,Math.min(1,sf)); sf=sf*sf*(3-2*sf);
        m*=sf;

        const fb=Math.max(0,(z+75)/75);
        m*=(1-0.55*fb);
        m*=pf;
        return Math.max(0,Math.min(1,m));
      },

      _respawn: function(i){
        const d=this.data, arr=this._posAttr.array;
        let x,z,tries=0;
        do{
          x=this._officeCX+(Math.random()-0.5)*80;
          z=this._officeCZ+(Math.random()-0.5)*80;
          tries++;
          var mask=this._zoneMask(x,z);
          if(mask>0.02 && !this._isIndoor(x,z) && !this._nearPlatform(x,z) && Math.random()<mask) break;
        }while(tries<25);

        if(tries>=25||this._isIndoor(x,z)||this._nearPlatform(x,z)||mask<=0.02){
          arr[i*3]=arr[i*3+1]=arr[i*3+2]=9999; return;
        }
        arr[i*3]=x; arr[i*3+1]=d.ceiling+Math.random()*10; arr[i*3+2]=z;
        this._phase[i]=Math.random()*Math.PI*2;
      },

      tick: function(t,dt){
        if(!dt) return;

        const texAniso = 4;
        const snowColorTex = texLoader.load('./assets/textures/snow_basecolor.webp');
        const snowNormalTex = texLoader.load('./assets/textures/snow_normal_gl.webp');
        const snowRoughTex = texLoader.load('./assets/textures/snow_roughness.jpg');
        const snowAoTex = texLoader.load('./assets/textures/snow_ao.jpg');

        [snowColorTex, snowNormalTex, snowRoughTex, snowAoTex].forEach((t) => {
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(12, 12);
          t.anisotropy = texAniso;
        });

        snowColorTex.colorSpace = THREE.SRGBColorSpace;

        const snowMat=new THREE.MeshStandardMaterial({
          color:0xffffff,
          map:snowColorTex,
          normalMap:snowNormalTex,
          roughnessMap:snowRoughTex,
          aoMap:snowAoTex,
          normalScale:new THREE.Vector2(0.45,0.45),
          roughness:0.95,
          metalness:0.0,
          aoMapIntensity:0.35,
          envMapIntensity:0.07,
          side:THREE.FrontSide,
          depthWrite:true
        });
        const snowMesh=new THREE.Mesh(snowGeom,snowMat);
        snowMesh.receiveShadow=true;snowMesh.frustumCulled=false;
        this.el.sceneEl.object3D.add(snowMesh);
        // ── Snow skirts: vertical seals along keepout boundaries ──
        // Fixes the visible "floating" edge where the snow plane meets corridor/office walls.
        const makeSkirts = (boxes) => {
          const SKIRT_TOP = GROUND_Y + 1.25;
          const SKIRT_BOT = HIDDEN_Y - 0.02;
          const skirtH = (SKIRT_TOP - SKIRT_BOT);
          const midY = (SKIRT_TOP + SKIRT_BOT) * 0.5;
          const EPS = 0.02;
          const skirtMat = snowMat.clone();
          skirtMat.side = THREE.DoubleSide;
          skirtMat.polygonOffset = true;
          skirtMat.polygonOffsetFactor = -1;
          skirtMat.polygonOffsetUnits = -1;

          const addPlane = (w, x, z, rotY) => {
            const g = new THREE.PlaneGeometry(w, skirtH, 1, 1);
            const mesh = new THREE.Mesh(g, skirtMat);
            mesh.position.set(x, midY, z);
            mesh.rotation.set(0, rotY, 0);
            mesh.frustumCulled = false;
            this.el.sceneEl.object3D.add(mesh);
            this._meshes.push(mesh);
          };

          for (let i=0;i<boxes.length;i++){
            const b=boxes[i];
            // X faces
            addPlane((b.z2-b.z1), b.x1-EPS, (b.z1+b.z2)/2,  Math.PI/2);
            addPlane((b.z2-b.z1), b.x2+EPS, (b.z1+b.z2)/2, -Math.PI/2);
            // Z faces
            addPlane((b.x2-b.x1), (b.x1+b.x2)/2, b.z1-EPS, 0);
            addPlane((b.x2-b.x1), (b.x1+b.x2)/2, b.z2+EPS, Math.PI);
          }
        };
        if (keepouts && keepouts.length) makeSkirts(keepouts);

        this._meshes.push(snowMesh);
      },
      remove: function(){
        this._meshes.forEach(function(m){
          if(m.parent)m.parent.remove(m);
          m.geometry.dispose();
          if(m.material.map)m.material.map.dispose();
          if(m.material.normalMap)m.material.normalMap.dispose();
          if(m.material.roughnessMap)m.material.roughnessMap.dispose();
          if(m.material.aoMap)m.material.aoMap.dispose();
          m.material.dispose();
        });
      }
    });
</script>

      const model = this.el.getObject3D('mesh');
      if (!model) return;
      const clips = (model.animations && model.animations.length) ? model.animations : ((e.detail && e.detail.model && e.detail.model.animations) || []);
      if (!clips || !clips.length) return;
      this.mixer = new THREE.AnimationMixer(model);
      this.actions = clips.map((clip) => {
        const a = this.mixer.clipAction(clip);
        a.reset();
        a.setLoop(THREE.LoopRepeat, Infinity);
        a.play();
        a.time = Math.random() * clip.duration;
        return a;
      });
    });
  },
  tick: function (t, dt) {
    if (this.mixer) this.mixer.update((dt || 0) / 1000);
  }
});

AFRAME.registerComponent('hand-clamp', {
  schema: {
    minY:    { type: 'number',  default: 0.84  },
    smooth:  { type: 'number',  default: 0.92  },
    fingers: { type: 'boolean', default: true   }
  },
  init: function () {
    this._handBones   = [];
    this._fingerBones = [];
    this._wP = new THREE.Vector3();
    const find = () => {
      this._handBones   = [];
      this._fingerBones = [];
      const mesh = this.el.getObject3D('mesh');
      if (!mesh) return;
      mesh.traverse((n) => {
        if (!n.isBone || !n.name) return;
        const nm = n.name;
        if (/^(mixamorig:?)?(Left|Right)Hand$/i.test(nm)) {
          this._handBones.push(n);
          return;
        }
        if (this.data.fingers && /(Thumb|Index|Middle|Ring|Little|Pinky)\d/i.test(nm) &&
            /(Left|Right)/i.test(nm)) {
          this._fingerBones.push(n);
        }
      });
    };
    this.el.addEventListener('model-loaded', find);
  },
  tick: function () {
    const minY = this.data.minY;
    const sm   = this.data.smooth;
    const wp   = this._wP;
    for (let i = 0; i < this._handBones.length; i++) {
      const b = this._handBones[i];
      b.getWorldPosition(wp);
      if (wp.y < minY) b.position.y += (minY - wp.y) * sm;
    }
    if (this.data.fingers) {
      for (let i = 0; i < this._fingerBones.length; i++) {
        const b = this._fingerBones[i];
        b.getWorldPosition(wp);
        if (wp.y < minY) b.position.y += (minY - wp.y) * sm;
      }
    }
  }
});


// ── Fade in from black ────────────────────────────────────────────────────────
// Flash fix: overlay is already covering everything via CSS (opacity:1 in <style>).
// We wait for the scene `loaded` event so the first rendered frame is the real scene.
(function () {
  const overlay = document.getElementById('fadeIn');
  if (!overlay) return;

  const fade = () => {
    // Two rAF passes ensure at least one real frame has been drawn before fading
    requestAnimationFrame(() => requestAnimationFrame(() => {
      overlay.classList.add('done');
      setTimeout(() => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 1100);
    }));
  };

  const scene = document.querySelector('a-scene');
  if (scene) {
    if (scene.hasLoaded) fade();
    else scene.addEventListener('loaded', fade, { once: true });
  } else {
    window.addEventListener('load', fade, { once: true });
  }
})();

// ── Quit UI — matches aya.dev ─────────────────────────────────────────────────
(function () {
  const QUIT    = document.getElementById('quitBtn');
  const QC      = document.getElementById('quitConfirm');
  const Q_CANCEL= document.getElementById('quitCancel');
  const Q_OK    = document.getElementById('quitConfirmBtn');

  function openQuitConfirm()  { if (!QC) return; QC.classList.add('show');    QC.setAttribute('aria-hidden','false'); }
  function closeQuitConfirm() { if (!QC) return; QC.classList.remove('show'); QC.setAttribute('aria-hidden','true');  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && QC && QC.classList.contains('show')) closeQuitConfirm();
  }, { passive: true });

  if (QUIT)     QUIT.addEventListener('click', openQuitConfirm);
  if (Q_CANCEL) Q_CANCEL.addEventListener('click', closeQuitConfirm);
  if (QC)       QC.addEventListener('click', (e) => { if (e.target === QC) closeQuitConfirm(); });
  if (Q_OK)     Q_OK.addEventListener('click', () => { window.location.href = 'https://www.enricopoli.com/pagex'; });
})();
</script>

<script>
(function(){
  const EMPTY_STATIONS = ['station_SE_01','station_SW_01','station_NW_02','station_NE_03','station_SW_03'];
  const LIA_IFRAME_SRC = './lia_1_0_experience.html';
  const state = { mode:'idle', active:null, overlayOpen:false, saved:null, anim:0 };
  const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
  const qA = new THREE.Quaternion();
  let scene, rig, cam, guide, guideMain, guideSub, overlay, frame;
  let terminals = [];

  function $(id){ return document.getElementById(id); }
  function init(){
    scene = document.querySelector('a-scene');
    rig = $('rig');
    cam = $('playerCam');
    guide = $('terminalGuide'); guideMain = $('terminalGuideMain'); guideSub = $('terminalGuideSub');
    overlay = $('liaOverlay'); frame = $('liaOverlayFrame');
    if (!scene || !rig || !cam) return;
    collectTerminals();
    window.addEventListener('keydown', onKeyDown, {passive:false});
    window.addEventListener('message', onMessage);
    requestAnimationFrame(tick);
  }

  function collectTerminals(){
    terminals = [];
    EMPTY_STATIONS.forEach(id=>{
      const station = $(id);
      if (!station) return;
      const computer = station.querySelector('.computer');
      if (!computer) return;
      terminals.push({ id, station, computer });
    });
  }

  function showGuide(main, sub=''){
    if (!guide) return;
    guideMain.textContent = main || '';
    guideSub.textContent = sub || '';
    guide.classList.add('show');
  }
  function hideGuide(){ if (guide) guide.classList.remove('show'); }

  function getYawPitchObjects(){
    const lc = cam.components && cam.components['look-controls'];
    return lc ? { lc, yaw: lc.yawObject, pitch: lc.pitchObject } : null;
  }
  function getCamWorldPos(){ return cam.object3D.getWorldPosition(vA.clone()); }
  function getTerminalWorldPoint(t){
    return t.computer.object3D.getWorldPosition(vA.clone());
  }
  function getSeatWorldPoint(t){
    return t.station.object3D.localToWorld(new THREE.Vector3(0,0,0.95));
  }
  function yawToFace(from, to){
    const dx = to.x - from.x, dz = to.z - from.z;
    return Math.atan2(-dx, -dz);
  }
  function pitchToFace(camY, fromXZ, to, eyeHeight){
    const dx = to.x - fromXZ.x, dz = to.z - fromXZ.z;
    const dy = (to.y) - (camY + eyeHeight);
    const horiz = Math.max(0.001, Math.hypot(dx,dz));
    return Math.max(-1.1, Math.min(0.45, Math.atan2(dy, horiz)));
  }
  function nearestTerminal(){
    const rp = rig.object3D.position;
    let best=null, bestD=1e9;
    for (const t of terminals){
      const seat = getSeatWorldPoint(t);
      const d = Math.hypot(seat.x-rp.x, seat.z-rp.z);
      if (d < bestD){ bestD = d; best = t; }
    }
    if (!best || bestD > 2.1) return null;
    return { term: best, dist: bestD };
  }

  function isFacingActive(){
    if (!state.active) return false;
    const camPos = getCamWorldPos();
    const target = getTerminalWorldPoint(state.active);
    const dir = target.sub(camPos).setY(0).normalize();
    const yp = getYawPitchObjects();
    const lcYaw = yp && yp.yaw ? yp.yaw.rotation.y : 0;
    const totalYaw = lcYaw + rig.object3D.rotation.y;
    vB.set(-Math.sin(totalYaw), 0, -Math.cos(totalYaw)).normalize();
    return dir.dot(vB) > 0.84;
  }

  function onKeyDown(e){
    if (state.overlayOpen){
      if (e.code === 'Escape'){ e.preventDefault(); closeOverlay(); }
      return;
    }
    if (state.mode === 'near' && e.code === 'KeyE'){
      e.preventDefault(); startSit(); return;
    }
    if (state.mode === 'seated'){
      if (e.code === 'Escape'){ e.preventDefault(); standUp(); return; }
      if (e.code === 'KeyF' && isFacingActive()){ e.preventDefault(); openOverlay(); return; }
    }
    if (state.mode === 'autopilot' && e.code === 'Escape'){ e.preventDefault(); standUp(true); }
  }

  function pauseWalk(pause){
    const rw = rig.components && rig.components['rig-walk'];
    if (!rw) return;
    if (pause && rw.pause) rw.pause();
    if (!pause && rw.play) rw.play();
  }

  function startSit(){
    if (!state.active || state.mode === 'autopilot') return;
    const yp = getYawPitchObjects(); if (!yp) return;
    const rp = rig.object3D.position;
    state.saved = {
      rigX: rp.x, rigY: rp.y, rigZ: rp.z,
      yaw: yp.yaw ? yp.yaw.rotation.y : 0,
      pitch: yp.pitch ? yp.pitch.rotation.x : 0,
      camY: cam.object3D.position.y
    };
    const seat = getSeatWorldPoint(state.active);
    const target = getTerminalWorldPoint(state.active);
    const start = { x: rp.x, z: rp.z, y: cam.object3D.position.y, yaw: state.saved.yaw, pitch: state.saved.pitch };
    const rigYaw = rig.object3D.rotation.y;
    const end = {
      x: seat.x, z: seat.z, y: 1.18,
      yaw: yawToFace({x:seat.x,z:seat.z}, target) - rigYaw,
      pitch: pitchToFace(rig.object3D.position.y, {x:seat.x,z:seat.z}, target, 1.18)
    };
    state.mode = 'autopilot';
    pauseWalk(true);
    animate(900, (k)=>{
      const s = k*k*(3-2*k);
      rig.object3D.position.x = start.x + (end.x-start.x)*s;
      rig.object3D.position.z = start.z + (end.z-start.z)*s;
      cam.object3D.position.y = start.y + (end.y-start.y)*s;
      if (yp.yaw) yp.yaw.rotation.y = lerpAngle(start.yaw,end.yaw,s);
      if (yp.pitch) yp.pitch.rotation.x = start.pitch + (end.pitch-start.pitch)*s;
    }, ()=>{
      state.mode = 'seated';
    });
  }

  function standUp(fromAuto){
    if (!state.saved) { state.mode = 'idle'; state.active = null; pauseWalk(false); hideGuide(); return; }
    const yp = getYawPitchObjects(); if (!yp) return;
    const rp = rig.object3D.position;
    const start = { x: rp.x, z: rp.z, y: cam.object3D.position.y, yaw: yp.yaw?yp.yaw.rotation.y:0, pitch: yp.pitch?yp.pitch.rotation.x:0 };
    const end = { x: state.saved.rigX, z: state.saved.rigZ, y: state.saved.camY, yaw: state.saved.yaw, pitch: state.saved.pitch };
    state.mode = 'autopilot';
    animate(fromAuto ? 300 : 500, (k)=>{
      const s = k*k*(3-2*k);
      rig.object3D.position.x = start.x + (end.x-start.x)*s;
      rig.object3D.position.z = start.z + (end.z-start.z)*s;
      cam.object3D.position.y = start.y + (end.y-start.y)*s;
      if (yp.yaw) yp.yaw.rotation.y = lerpAngle(start.yaw,end.yaw,s);
      if (yp.pitch) yp.pitch.rotation.x = start.pitch + (end.pitch-start.pitch)*s;
    }, ()=>{
      pauseWalk(false);
      state.mode = 'idle';
      state.active = null;
      hideGuide();
    });
  }

  function animate(ms, step, done){
    cancelAnimationFrame(state.anim);
    const t0 = performance.now();
    function loop(now){
      const k = Math.min(1, (now-t0)/ms);
      step(k);
      if (k < 1) state.anim = requestAnimationFrame(loop); else { state.anim = 0; if (done) done(); }
    }
    state.anim = requestAnimationFrame(loop);
  }
  function lerpAngle(a,b,t){
    let d = b-a; while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2; return a + d*t;
  }

  function openOverlay(){
    if (!overlay || !frame) return;
    state.overlayOpen = true;
    if (document.pointerLockElement) document.exitPointerLock?.();
    if (!frame.dataset.loaded){ frame.src = LIA_IFRAME_SRC; frame.dataset.loaded='1'; }
    overlay.classList.add('show');
    hideGuide();
  }
  function closeOverlay(){
    if (!overlay) return;
    state.overlayOpen = false;
    overlay.classList.remove('show');
    state.mode = 'seated';
  }
  function onMessage(ev){
    if (!ev || !ev.data) return;
    const t = ev.data.type;
    if (t === 'LIA_EXIT') closeOverlay();
    if (t === 'LIA_RESTART' && frame){
      try { frame.contentWindow.location.reload(); } catch(_) { frame.src = LIA_IFRAME_SRC; }
    }
  }

  function tick(){
    if (!scene || !rig || !cam) { requestAnimationFrame(tick); return; }
    if (!state.overlayOpen && state.mode !== 'autopilot') {
      if (state.mode === 'seated') {
        if (isFacingActive()) showGuide('Press F to initiate experience', 'Press ESC to stand up');
        else showGuide('Face the computer', 'Press ESC to stand up');
      } else {
        const near = nearestTerminal();
        if (near) {
          state.mode = 'near';
          state.active = near.term;
          showGuide('Press E to sit down', 'Available terminal');
        } else {
          state.mode = 'idle';
          state.active = null;
          hideGuide();
        }
      }
    }
    requestAnimationFrame(tick);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
