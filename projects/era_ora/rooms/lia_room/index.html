AFRAME.registerComponent('cave-displace', {
  schema: {
    amp:   { type: 'number', default: 0.22 },  // displacement amplitude (meters)
    freq:  { type: 'number', default: 1.15 },  // base noise frequency
    seed:  { type: 'number', default: 13 },    // per-mesh seed
    oct:   { type: 'number', default: 4 },     // octaves
    lac:   { type: 'number', default: 2.0 },   // lacunarity
    gain:  { type: 'number', default: 0.52 },  // amplitude falloff per octave
    // optional extra "macro" shaping so the cave reads as large, soft bulges + small chisel detail
    macroFreq: { type: 'number', default: 0.42 },
    macroAmp:  { type: 'number', default: 0.65 }
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },

  // ---- Smooth value noise (trilinear interpolation) ----
  _hash11: function (n) {
    // deterministic pseudo-random in [0,1)
    const s = Math.sin(n) * 43758.5453123;
    return s - Math.floor(s);
  },
  _randLattice: function (ix, iy, iz, seed) {
    // lattice random in [-1,1]
    const n = ix * 127.1 + iy * 311.7 + iz * 74.7 + seed * 19.19;
    return this._hash11(n) * 2.0 - 1.0;
  },
  _fade: function (t) { return t * t * (3.0 - 2.0 * t); },
  _lerp: function (a, b, t) { return a + (b - a) * t; },
  _noise3: function (x, y, z, seed) {
    // value noise in [-1,1]
    const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
    const fx = x - ix, fy = y - iy, fz = z - iz;

    const u = this._fade(fx), v = this._fade(fy), w = this._fade(fz);

    const n000 = this._randLattice(ix,     iy,     iz,     seed);
    const n100 = this._randLattice(ix + 1, iy,     iz,     seed);
    const n010 = this._randLattice(ix,     iy + 1, iz,     seed);
    const n110 = this._randLattice(ix + 1, iy + 1, iz,     seed);

    const n001 = this._randLattice(ix,     iy,     iz + 1, seed);
    const n101 = this._randLattice(ix + 1, iy,     iz + 1, seed);
    const n011 = this._randLattice(ix,     iy + 1, iz + 1, seed);
    const n111 = this._randLattice(ix + 1, iy + 1, iz + 1, seed);

    const nx00 = this._lerp(n000, n100, u);
    const nx10 = this._lerp(n010, n110, u);
    const nx01 = this._lerp(n001, n101, u);
    const nx11 = this._lerp(n011, n111, u);

    const nxy0 = this._lerp(nx00, nx10, v);
    const nxy1 = this._lerp(nx01, nx11, v);

    return this._lerp(nxy0, nxy1, w);
  },
  _fbm: function (x, y, z, seed, oct, freq, lac, gain) {
    let a = 1.0, f = freq, sum = 0.0, norm = 0.0;
    for (let i = 0; i < oct; i++) {
      sum += a * this._noise3(x * f, y * f, z * f, seed + i * 101.7);
      norm += a;
      a *= gain;
      f *= lac;
    }
    return (norm > 0) ? (sum / norm) : 0;
  },

  _apply: function () {
    const obj = this.el.getObject3D('mesh');
    if (!obj) return;

    const meshes = [];
    obj.traverse(o => { if (o && o.isMesh && o.geometry) meshes.push(o); });
    if (!meshes.length) return;

    const d = this.data;

    for (let m = 0; m < meshes.length; m++) {
      const mesh = meshes[m];
      const geom = mesh.geometry;
      if (!geom || !geom.attributes || !geom.attributes.position) continue;

      // Avoid double-applying.
      if (geom.userData && geom.userData._caveDisplaced) continue;

      const g = geom.clone();
      const pos = g.attributes.position;

      if (!g.attributes.normal) g.computeVertexNormals();
      const normals = g.attributes.normal;

      const v = new THREE.Vector3();
      const nrm = new THREE.Vector3();

      // Two-layer noise: broad bulges (macro) + surface chiseling (micro)
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        nrm.fromBufferAttribute(normals, i);

        const macro = this._fbm(v.x, v.y, v.z, d.seed + 17.0, d.oct, d.macroFreq, d.lac, d.gain);
        const micro = this._fbm(v.x, v.y, v.z, d.seed,        d.oct, d.freq,      d.lac, d.gain);

        const w = (macro * d.macroAmp) + (micro * (1.0 - d.macroAmp));

        v.addScaledVector(nrm, w * d.amp);
        pos.setXYZ(i, v.x, v.y, v.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      g.userData = g.userData || {};
      g.userData._caveDisplaced = true;

      mesh.geometry = g;
    }
  }
});


// Pulls the lowest edge of the cave shell down to meet the floor (world Y), with a smooth falloff upward.
// This alters the *main dome mesh* (no extra skirt meshes) and keeps the upper coverage essentially unchanged.
AFRAME.registerComponent('cave-floor-seal', {
  schema: {
    floorY:       { type: 'number', default: 0 },     // world-space floor Y to touch
    anchorHeight: { type: 'number', default: 0.75 },  // in meters above the shell's current lowest point where deformation fades to 0
    retries:      { type: 'int',    default: 6 }      // wait for cave-displace to finish
  },
  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },
  remove: function () { this.el.removeEventListener('object3dset', this._apply); },

  _smoothstep: function (t) { return t * t * (3.0 - 2.0 * t); },

  _apply: function () {
    const obj = this.el.getObject3D('mesh');
    if (!obj) return;

    const meshes = [];
    obj.traverse(o => { if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) meshes.push(o); });
    if (!meshes.length) return;

    const d = this.data;

    // If cave-displace is present, wait until it has tagged geometry as displaced.
    // This prevents double-cloning and avoids racing the displacement step.
    const needsDisplace = this.el.hasAttribute('cave-displace');
    if (needsDisplace) {
      let allDisplaced = true;
      for (const m of meshes) {
        if (!(m.geometry.userData && m.geometry.userData._caveDisplaced)) { allDisplaced = false; break; }
      }
      if (!allDisplaced) {
        if (d.retries > 0) {
          this.el.setAttribute('cave-floor-seal', { retries: d.retries - 1 });
          setTimeout(this._apply, 25);
        }
        return;
      }
    }

    // Find the current lowest vertex in WORLD space.
    let minY = Infinity;
    const _v = new THREE.Vector3();

    obj.updateMatrixWorld(true);
    obj.traverse(m => { if (m && m.isMesh) m.updateMatrixWorld(true); });

    for (const mesh of meshes) {
      const pos = mesh.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        _v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
        if (_v.y < minY) minY = _v.y;
      }
    }

    const delta = d.floorY - minY; // negative means we need to pull DOWN
    if (delta >= 0) return; // already touching or below

    const anchorY = minY + Math.max(0.05, d.anchorHeight);
    const _w = new THREE.Vector3();
    const _local = new THREE.Vector3();
    const _inv = new THREE.Matrix4();

    for (const mesh of meshes) {
      // Avoid double-applying.
      if (mesh.geometry.userData && mesh.geometry.userData._floorSealed) continue;

      // Clone so we don't mutate shared geometry.
      const g = mesh.geometry.clone();
      const pos = g.attributes.position;

      _inv.copy(mesh.matrixWorld).invert();

      for (let i = 0; i < pos.count; i++) {
        _local.fromBufferAttribute(pos, i);
        _w.copy(_local).applyMatrix4(mesh.matrixWorld);

        if (_w.y >= anchorY) continue;

        const t = (_w.y - minY) / (anchorY - minY); // 0..1
        const s = this._smoothstep(Math.min(1, Math.max(0, t)));
        const wgt = 1.0 - s;

        _w.y += delta * wgt;

        _local.copy(_w).applyMatrix4(_inv);
        pos.setXYZ(i, _local.x, _local.y, _local.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      g.userData = g.userData || {};
      g.userData._floorSealed = true;

      mesh.geometry = g;
    }
  }
});

// 2) Adds low-frequency, non-axis-symmetric irregularity so the interior feels less mathematically perfect.

  _randLattice: function (ix, iy, iz, seed) {

    const nxy1 = this._lerp(nx01, nx11, v);

  },

  _smoothstep: function (t) { return t * t * (3.0 - 2.0 * t); },

  _apply: function () {
    const obj = this.el.getObject3D('mesh');

    const meshes = [];
    let allReady = true;

    obj.traverse(o => {
      if (o && o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) {

        // --- Seam softening at the flat wall plane (local z ~= seamZ) ---
        const dz = Math.abs(v.z - d.seamZ);
        const t = 1.0 - Math.min(1.0, dz / Math.max(1e-6, d.seamBand));
        const w = this._smoothstep(t); // 0..1

        if (w > 0.0) {
          // Noise evaluated in seam plane so it's irregular around the ring.
          const sx = v.x * d.seamNoiseFreq;
          const sy = v.y * d.seamNoiseFreq;
          const sn = this._noise3(sx, sy, 0.0, seedA + 27.0); // [-1,1]

          // Push seam slightly behind wall (negative Z) with jitter so it's not a perfect circle line.
          // Extra weighting near the bottom of the dome so the seam doesn't read as a perfect hard circle.
          const bottomT = 1.0 - Math.min(1.0, Math.max(0.0, (v.y - (minY + bottomBandY)) / bottomBandY));
          const wBottom = this._smoothstep(bottomT) * w;
          const inset = d.seamInset * (w + 0.75 * wBottom) * (0.65 + 0.35 * (sn * 0.5 + 0.5));
          v.z -= inset;

          // Radial chip (in/out along normal) to break the circular precision.
          const chip = d.seamRadAmp * (w + 0.85 * wBottom) * sn;
          v.addScaledVector(n, chip);
        }

        pos.setXYZ(i, v.x, v.y, v.z);
      }

      pos.needsUpdate = true;
      g.computeVertexNormals();
      g.userData = g.userData || {};
      g.userData._domeNaturalized = true;

      mesh.geometry = g;

      // Re-seat the bottom edge to the floor after the irregularity pass.
      const seal = this.el.components['cave-floor-seal'];
      if (seal && typeof seal._apply === 'function') {
        // Clear the flag so the seal will run again.
        g.userData._floorSealed = false;
        setTimeout(() => seal._apply(), 0);
      }
    }
  }
});

AFRAME.registerComponent('floor-seam-sculpt', {
  schema: {
    // Back wall seam Z in WORLD space
    wallZ: {type: 'number', default: 0.49},

    // Elliptical footprint of the dome on the floor in WORLD space:
    // (x - cx)^2 / a^2 + (z - cz)^2 / b^2 = 1
    domeCenter: {type: 'vec3', default: {x: 0, y: 1.92, z: 0.49}},
    domeA: {type: 'number', default: 3.34},
    domeB: {type: 'number', default: 4.58},

    // Blend band widths in METERS (how far from the seam we start ramping up)
    domeBand: {type: 'number', default: 0.85},
    wallBand: {type: 'number', default: 0.95},

    // Max vertical rise (meters)
    maxRise: {type: 'number', default: 0.12},

    // Noise controls
    noiseScale: {type: 'number', default: 0.70},   // meters per noise feature (bigger = smoother)
    noiseAmp:   {type: 'number', default: 0.85},   // 0..1-ish
    edgeJitter: {type: 'number', default: 0.14},   // meters of seam wobble
    seed: {type: 'int', default: 11},

    // Keep the elevator cab + doorway area flat (meters)
    elevatorClearX: {type: 'number', default: 1.45},
    elevatorClearZ: {type: 'number', default: 1.10},

    // Whether to recompute normals (slightly costlier once, but improves realism)
    recomputeNormals: {type: 'boolean', default: true}
  },

  init: function () {
    this._applied = false;
    this._inv = new THREE.Matrix4();
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    setTimeout(this._apply, 0);
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
  },

  _smoothstep: function (e0, e1, x) {
    const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  },

  _hash2: function (x, y, seed) {
    // integer hash -> [0,1)
    let n = (x * 374761393 + y * 668265263 + seed * 1442695041) | 0;
    n = (n ^ (n >> 13)) | 0;
    n = (n * 1274126177) | 0;
    return ((n ^ (n >> 16)) >>> 0) / 4294967296;
  },

  _noise2: function (x, y, seed) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;

    const a = this._hash2(xi, yi, seed);
    const b = this._hash2(xi + 1, yi, seed);
    const c = this._hash2(xi, yi + 1, seed);
    const d = this._hash2(xi + 1, yi + 1, seed);

    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const ab = a + (b - a) * u;
    const cd = c + (d - c) * u;
    return ab + (cd - ab) * v; // ~[0,1]
  },

  _fbm: function (x, y, seed) {
    let amp = 0.58;
    let sum = 0.0;
    let freq = 1.0;
    for (let i = 0; i < 4; i++) {
      sum += amp * this._noise2(x * freq, y * freq, seed + i * 13);
      freq *= 2.03;
      amp *= 0.52;
    }
    return sum; // ~[0,1]
  },

  _apply: function () {
    if (this._applied) return;

    const mesh = this.el.getObject3D('mesh');
    if (!mesh || !mesh.geometry || !mesh.geometry.attributes || !mesh.geometry.attributes.position) return;

    // Clone once so we don't mutate shared geometry.
    const geom = mesh.geometry.clone();
    mesh.geometry = geom;

    const pos = geom.attributes.position;

    // Compute LOCAL up (for displacing along the floor normal even if the plane rotates).
    const qWorld = new THREE.Quaternion();
    mesh.getWorldQuaternion(qWorld);
    const invQ = qWorld.clone().invert();
    const upLocal = new THREE.Vector3(0, 1, 0).applyQuaternion(invQ).normalize();

    const tmpLocal = new THREE.Vector3();
    const tmpWorld = new THREE.Vector3();

    const d = this.data;
    const cx = d.domeCenter.x, cz = d.domeCenter.z;
    const a = Math.max(1e-6, d.domeA), b = Math.max(1e-6, d.domeB);

    const wallBand = Math.max(0.05, d.wallBand);
    const domeBand = Math.max(0.05, d.domeBand);
    const noiseScale = Math.max(0.05, d.noiseScale);

    // Convert ellipse seam distance to meters (approx, good enough visually)
    const avgR = 0.5 * (a + b);

    for (let i = 0; i < pos.count; i++) {
      tmpLocal.fromBufferAttribute(pos, i);
      tmpWorld.copy(tmpLocal);
      mesh.localToWorld(tmpWorld);

      // Keep elevator interior / doorway region flat.
      const inElevatorClear =
        (Math.abs(tmpWorld.x) <= d.elevatorClearX) &&
        (tmpWorld.z <= (d.wallZ + d.elevatorClearZ));

      if (inElevatorClear) continue;

      // Seam wobble (breaks the "perfect line" read)
      const seamJ = (this._noise2(tmpWorld.x * 0.55, 0.0, d.seed + 31) * 2.0 - 1.0);
      const wallZJ = d.wallZ + d.edgeJitter * 0.55 * seamJ;

      // --- Influence 1: back wall seam (distance in meters) ---
      const dWall = Math.abs(tmpWorld.z - wallZJ);
      let wWall = 1.0 - this._smoothstep(0.0, wallBand, dWall);
      wWall = Math.pow(Math.max(0, wWall), 0.65);

      // --- Influence 2: dome footprint seam (distance in meters, approx) ---
      const dx = (tmpWorld.x - cx) / a;
      const dz = (tmpWorld.z - cz) / b;
      const r = Math.sqrt(dx * dx + dz * dz);

      // jitter the ellipse "radius" slightly so it doesn't read like math
      const rJ = 1.0 + (d.edgeJitter / Math.max(1e-6, avgR)) * 0.75 *
        (this._noise2(tmpWorld.x * 0.40, tmpWorld.z * 0.40, d.seed + 13) * 2.0 - 1.0);

      const dDomeMeters = Math.abs(r - rJ) * avgR;
      let wDome = 1.0 - this._smoothstep(0.0, domeBand, dDomeMeters);
      wDome = Math.pow(Math.max(0, wDome), 0.65);

      // Tri-junction boost: where both seam influences exist (use min)
      let wTri = Math.min(wWall, wDome);
      wTri = Math.pow(wTri, 0.55);

      // Combine: broad berm from max + extra lumpy lift at tri-junction
      let w = Math.max(wWall, wDome);
      if (w < 1e-5) continue;

      // Multi-scale noise in WORLD meters (fast, non-repeating enough for this use)
      const n = this._fbm(tmpWorld.x / noiseScale, tmpWorld.z / noiseScale, d.seed); // 0..1
      const nSigned = (n * 2.0 - 1.0); // -1..1
      const ridge = 1.0 - Math.abs(nSigned); // 0..1 (chunkier clumps)

      const amp = 1.0 + d.noiseAmp * (0.55 * nSigned + 0.25 * (ridge - 0.5));
      const micro = 0.010 * d.noiseAmp * (this._noise2(tmpWorld.x * 7.5, tmpWorld.z * 7.5, d.seed + 19) * 2.0 - 1.0);

      const rise = (d.maxRise * w * amp) + (d.maxRise * 0.55 * wTri * (1.0 + 0.60 * d.noiseAmp * nSigned)) + micro * w;

      tmpLocal.addScaledVector(upLocal, rise);
      pos.setXYZ(i, tmpLocal.x, tmpLocal.y, tmpLocal.z);
    }

    pos.needsUpdate = true;
    if (d.recomputeNormals) geom.computeVertexNormals();

    this._applied = true;
  }
});


AFRAME.registerComponent('dust-decal-alpha', {
  schema: {
    width: {type: 'number', default: 14},
    height: {type: 'number', default: 14},
    centerZ: {type: 'number', default: 3.50},

    wallZ: {type: 'number', default: 0.49},
    domeCenter: {type: 'vec3', default: {x: 0, y: 1.92, z: 0.49}},
    domeA: {type: 'number', default: 3.34},
    domeB: {type: 'number', default: 4.58},

    wallBand: {type: 'number', default: 1.15},
    domeBand: {type: 'number', default: 1.05},

    strength: {type: 'number', default: 0.85},

    // Noise controls (meters)
    noiseScale: {type: 'number', default: 0.55},
    noiseAmount: {type: 'number', default: 0.55},

    // Keep elevator interior clean (in WORLD space around the doorway plane)
    elevatorClearX: {type: 'number', default: 1.45},
    elevatorClearZ: {type: 'number', default: 1.10}
  },

  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    this.el.addEventListener('materialtextureloaded', this._apply);
    this._apply();
  },

  // Smoothstep
  _smooth: function (edge0, edge1, x) {
    const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
    return t * t * (3 - 2 * t);
  },

  // Hash + value noise (fast, deterministic, no external assets)
  _hash2: function (x, y) {
    // 2D integer hash -> [0,1)
    let n = (x * 374761393 + y * 668265263) | 0;
    n = (n ^ (n >> 13)) | 0;
    n = (n * 1274126177) | 0;
    return ((n ^ (n >> 16)) >>> 0) / 4294967296;
  },

  _noise2: function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;

    const a = this._hash2(xi, yi);
    const b = this._hash2(xi + 1, yi);
    const c = this._hash2(xi, yi + 1);
    const d = this._hash2(xi + 1, yi + 1);

    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);

    const ab = a + (b - a) * u;
    const cd = c + (d - c) * u;
    return ab + (cd - ab) * v;
  },

  _fbm: function (x, y) {
    let amp = 0.55;
    let sum = 0.0;
    let freq = 1.0;
    for (let i = 0; i < 4; i++) {
      sum += amp * this._noise2(x * freq, y * freq);
      freq *= 2.02;
      amp *= 0.52;
    }
    return sum; // ~[0,1]
  },

  _apply: function () {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    const mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
    if (!mat) return;

    // Build a non-repeating alpha mask in UV space that matches the floor plane mapping.
    const N = 1024; // good balance: crisp seams without long startup
    const canvas = document.createElement('canvas');
    canvas.width = N;
    canvas.height = N;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(N, N);
    const data = img.data;

    const d = this.data;
    const w = d.width, h = d.height, cz = d.centerZ;
    const wallZ = d.wallZ;
    const cx = d.domeCenter.x, czD = d.domeCenter.z;
    const a = Math.max(0.001, d.domeA), b = Math.max(0.001, d.domeB);
    const avgR = 0.5 * (a + b);

    // Convert band widths (meters) to ellipse-normalized thickness
    const bandWall = Math.max(0.02, d.wallBand);
    const bandDomeN = Math.max(0.02, d.domeBand / avgR);

    const baseStrength = Math.max(0, d.strength);
    const noiseScale = Math.max(0.05, d.noiseScale);

    for (let j = 0; j < N; j++) {
      const v = j / (N - 1);
      const worldZ = (v - 0.5) * h + cz;

      for (let i = 0; i < N; i++) {
        const u = i / (N - 1);
        const worldX = (u - 0.5) * w;

        // Keep elevator interior clean (no dust overlay intruding inside the cab view)
        if (Math.abs(worldX) < d.elevatorClearX && Math.abs(worldZ - wallZ) < d.elevatorClearZ) {
          const idx = (j * N + i) * 4;
          data[idx + 0] = 255;
          data[idx + 1] = 255;
          data[idx + 2] = 255;
          data[idx + 3] = 0;
          continue;
        }

        // Wall seam weight (strong near wall, fades outward)
        const dW = Math.abs(worldZ - wallZ);
        let wWall = 1.0 - this._smooth(0.0, bandWall, dW);
        wWall = Math.pow(Math.max(0, wWall), 0.75);

        // Dome footprint seam weight (ellipse in world space)
        const dx = (worldX - cx) / a;
        const dz = (worldZ - czD) / b;
        const r = Math.sqrt(dx * dx + dz * dz);
        const dDN = Math.abs(r - 1.0);
        let wDome = 1.0 - this._smooth(0.0, bandDomeN, dDN);
        wDome = Math.pow(Math.max(0, wDome), 0.75);

        // Tri-junction: where both seam influences exist (use min)
        let wTri = Math.min(wWall, wDome);
        wTri = Math.pow(wTri, 0.55);

        // Global light dust everywhere (very subtle, no footprints)
        let wBase = 0.08;

        // Combine (edge deposits dominate, tri junction gets a bit more)
        let wComb = Math.max(wWall, wDome);
        wComb = Math.pow(wComb, 0.70);
        wComb = Math.max(wComb, wTri * 1.05);

        // Non-repeating clumpy noise in WORLD meters (helps hide perfect math edges)
        const n = this._fbm(worldX / noiseScale, worldZ / noiseScale); // 0..1
        const n2 = (n * 2.0 - 1.0); // -1..1

        // Break up into deposits (clumps) without making it look like dots
        const clump = Math.pow(Math.max(0, n), 1.55); // bias toward sparse clumps
        const breakup = Math.max(0.0, 1.0 + n2 * d.noiseAmount);

        let alpha = baseStrength * (wBase + wComb * 0.92) * breakup;

        // Extra "powder" pockets near seams (not footprints)
        alpha *= (0.78 + 0.22 * clump);

        // Clamp + soft ceiling so it never looks painted on
        alpha = Math.min(0.78, Math.max(0.0, alpha));

        const idx = (j * N + i) * 4;
        data[idx + 0] = 255;
        data[idx + 1] = 255;
        data[idx + 2] = 255;
        data[idx + 3] = Math.floor(alpha * 255);
      }
    }

    ctx.putImageData(img, 0, 0);

    const alphaTex = new THREE.CanvasTexture(canvas);
    alphaTex.wrapS = THREE.ClampToEdgeWrapping;
    alphaTex.wrapT = THREE.ClampToEdgeWrapping;
    alphaTex.needsUpdate = true;

    // Assign to material
    mat.transparent = true;
    mat.depthWrite = false;         // crucial: makes it feel like deposited dust, not a second floor
    mat.alphaMap = alphaTex;
    mat.opacity = mat.opacity != null ? mat.opacity : 0.55;
    mat.polygonOffset = true;
    mat.polygonOffsetFactor = -1;
    mat.polygonOffsetUnits = -1;

    // Make it feel like dust: slightly brighten, soften normals, push roughness up
    // (we do it gently to keep the base floor PBR doing most of the work)
    mat.color.setRGB(1.0, 1.0, 1.0);
    if (mat.normalScale) {
      if (typeof mat.normalScale.set === "function") mat.normalScale.set(0.18, 0.18);
      else if (mat.normalScale && typeof mat.normalScale === "object") { mat.normalScale.x = 0.18; mat.normalScale.y = 0.18; }
    }
    mat.roughness = 1.0;
    mat.metalness = 0.0;

    mesh.renderOrder = 10;
    mat.needsUpdate = true;
  }
});

    const u = xf * xf * (3 - 2 * xf);

    const ab = a + (b - a) * u;
    const cd = c + (d - c) * u;
    return ab + (cd - ab) * v;
  },

  _fbm: function (x, y) {
    let amp = 0.58;
    let sum = 0.0;
    let freq = 1.0;
    for (let i = 0; i < 4; i++) {
      sum += amp * this._noise2(x * freq, y * freq);
      freq *= 2.03;
      amp *= 0.52;
    }
    return sum; // ~[0,1]
  },

  _apply: function () {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    const mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
    if (!mat) return;

    const N = 768; // subtle band; slightly lower than dust for perf
    const canvas = document.createElement('canvas');
    canvas.width = N;
    canvas.height = N;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(N, N);
    const data = img.data;

    const d = this.data;
    const w = d.width, h = d.height, cz = d.centerZ;
    const wallZ = d.wallZ;
    const cx = d.domeCenter.x, czD = d.domeCenter.z;
    const a = Math.max(0.001, d.domeA), b = Math.max(0.001, d.domeB);
    const avgR = 0.5 * (a + b);

    const bandWall = Math.max(0.05, d.wallBand);
    const bandDomeN = Math.max(0.05, d.domeBand / avgR);
    const noiseScale = Math.max(0.05, d.noiseScale);
    const strength = Math.max(0, d.strength);

    for (let j = 0; j < N; j++) {
      const v = j / (N - 1);
      const worldZ = (v - 0.5) * h + cz;

      for (let i = 0; i < N; i++) {
        const u = i / (N - 1);
        const worldX = (u - 0.5) * w;

        // Keep elevator interior clean
        if (Math.abs(worldX) < d.elevatorClearX && Math.abs(worldZ - wallZ) < d.elevatorClearZ) {
          const idx = (j * N + i) * 4;
          data[idx + 0] = 255;
          data[idx + 1] = 255;
          data[idx + 2] = 255;
          data[idx + 3] = 0;
          continue;
        }

        // Wall seam weight
        const dW = Math.abs(worldZ - wallZ);
        let wWall = 1.0 - this._smooth(0.0, bandWall, dW);
        wWall = Math.pow(Math.max(0, wWall), 0.80);

        // Dome footprint seam weight (ellipse)
        const dx = (worldX - cx) / a;
        const dz = (worldZ - czD) / b;
        const r = Math.sqrt(dx * dx + dz * dz);
        const dDN = Math.abs(r - 1.0);

        let wDome = 1.0 - this._smooth(0.0, bandDomeN, dDN);
        wDome = Math.pow(Math.max(0, wDome), 0.80);

        let wComb = Math.max(wWall, wDome);
        // Slightly favor the tri-junction area
        const wTri = Math.pow(Math.min(wWall, wDome), 0.65);
        wComb = Math.max(wComb, wTri * 1.08);

        // Subtle mottling so it reads like dampness, not a painted stripe
        const n = this._fbm(worldX / noiseScale, worldZ / noiseScale);
        const nSigned = (n * 2.0 - 1.0);
        const breakup = Math.max(0.0, 1.0 + nSigned * d.noiseAmount);

        // Dampness: strong right at seam, falls off quickly
        let alpha = strength * Math.pow(wComb, 1.15) * breakup;

        // Keep it restrained
        alpha = Math.min(0.55, Math.max(0.0, alpha));

        const idx = (j * N + i) * 4;
        data[idx + 0] = 255;
        data[idx + 1] = 255;
        data[idx + 2] = 255;
        data[idx + 3] = Math.floor(alpha * 255);
      }
    }

    ctx.putImageData(img, 0, 0);

    const alphaTex = new THREE.CanvasTexture(canvas);
    alphaTex.wrapS = THREE.ClampToEdgeWrapping;
    alphaTex.wrapT = THREE.ClampToEdgeWrapping;
    alphaTex.needsUpdate = true;

    mat.transparent = true;
    mat.depthWrite = false;
    mat.alphaMap = alphaTex;
    mat.polygonOffset = true;
    mat.polygonOffsetFactor = -2;
    mat.polygonOffsetUnits = -2;
    mesh.renderOrder = 8;
    mat.needsUpdate = true;
  }
});


AFRAME.registerComponent('seam-rubble-skirt', {
  schema: {
    domeCenter: {type: 'vec3', default: {x: 0, y: 1.92, z: 0.49}},
    domeA: {type: 'number', default: 3.34},
    domeB: {type: 'number', default: 4.58},

    y: {type: 'number', default: 0.02},

    // Counts (keep reasonable)
    count: {type: 'int', default: 140},
    heroCount: {type: 'int', default: 7},

    // How far inward from the seam we place rubble (meters)
    bandWidth: {type: 'number', default: 0.55},

    // Randomness
    seed: {type: 'int', default: 77},
    tangentJitter: {type: 'number', default: 0.10},
    yJitter: {type: 'number', default: 0.03},

    // Scale in meters (rock radius-ish)
    scaleMin: {type: 'number', default: 0.05},
    scaleMax: {type: 'number', default: 0.14},
    heroScaleMin: {type: 'number', default: 0.22},
    heroScaleMax: {type: 'number', default: 0.38},

    // Look
    color1: {type: 'color', default: '#1a1a1a'},
    color2: {type: 'color', default: '#2a2a2a'},
    roughness: {type: 'number', default: 0.98},
    metalness: {type: 'number', default: 0.02}
  },

  init: function () {
    const THREE = AFRAME.THREE;
    const d = this.data;


    // Procedural micro normal map to give the black rocks readable surface under light (no external textures).
    function makeRockNormalTexture(seed, size) {
      size = size || 128;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const img = ctx.createImageData(size, size);
      const data = img.data;

      function hash(x, y) {
        let n = (x * 374761393 + y * 668265263 + (seed | 0) * 1447) | 0;
        n = (n ^ (n >> 13)) | 0;
        n = (n * 1274126177) | 0;
        return ((n ^ (n >> 16)) >>> 0) / 4294967296;
      }

      function smoothstep(t) { return t * t * (3 - 2 * t); }

      function noise(x, y) {
        const xi = Math.floor(x), yi = Math.floor(y);
        const xf = x - xi, yf = y - yi;
        const a = hash(xi, yi);
        const b = hash(xi + 1, yi);
        const c = hash(xi, yi + 1);
        const d0 = hash(xi + 1, yi + 1);
        const u = smoothstep(xf);
        const v = smoothstep(yf);
        const ab = a + (b - a) * u;
        const cd = c + (d0 - c) * u;
        return ab + (cd - ab) * v; // 0..1
      }

      function fbm(x, y) {
        let f = 0.0;
        let amp = 0.55;
        let freq = 1.0;
        for (let i = 0; i < 4; i++) {
          f += amp * noise(x * freq, y * freq);
          freq *= 2.03;
          amp *= 0.52;
        }
        return f; // ~0..1
      }

      const H = new Float32Array(size * size);
      for (let j = 0; j < size; j++) {
        for (let i = 0; i < size; i++) {
          const u = i / size;
          const v = j / size;
          // Clumpy field (bias toward pockets / pits)
          let h = fbm(u * 6.0, v * 6.0);
          h = Math.pow(Math.max(0.0, h), 1.45);
          H[j * size + i] = h;
        }
      }

      const getH = (i, j) => H[((j + size) % size) * size + ((i + size) % size)];
      const strength = 2.2; // normal intensity

      for (let j = 0; j < size; j++) {
        for (let i = 0; i < size; i++) {
          const hx = getH(i + 1, j) - getH(i - 1, j);
          const hy = getH(i, j + 1) - getH(i, j - 1);

          let nx = -hx * strength;
          let ny = -hy * strength;
          let nz = 1.0;

          const inv = 1.0 / Math.sqrt(nx * nx + ny * ny + nz * nz);
          nx *= inv; ny *= inv; nz *= inv;

          const idx = (j * size + i) * 4;
          data[idx + 0] = Math.floor((nx * 0.5 + 0.5) * 255);
          data[idx + 1] = Math.floor((ny * 0.5 + 0.5) * 255);
          data[idx + 2] = Math.floor((nz * 0.5 + 0.5) * 255);
          data[idx + 3] = 255;
        }
      }

      ctx.putImageData(img, 0, 0);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      tex.anisotropy = 1;
      // Normal maps must be linear / non-color data
      if (tex.colorSpace !== undefined && THREE.NoColorSpace !== undefined) tex.colorSpace = THREE.NoColorSpace;

      return tex;
    }

    const cx = d.domeCenter.x, cz = d.domeCenter.z;
    const a = Math.max(0.001, d.domeA), b = Math.max(0.001, d.domeB);

    // Low-poly but shaded rocks
    const geo = new THREE.IcosahedronGeometry(1, 1);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(d.color1),
      // Restore a touch of highlight response without going back to "wet" shine.
      // Keep mostly matte, but allow slightly less roughness + a tiny env contribution.
      // Slightly less rough to bring back a subtle reflective read under lights.
      roughness: Math.max(0.84, d.roughness),
      metalness: Math.min(0.02, d.metalness),
      envMapIntensity: 0.12,
      vertexColors: true,
      flatShading: true,
      normalMap: makeRockNormalTexture(d.seed, 128),
      normalScale: new THREE.Vector2(0.55, 0.55)
    });

    const count = Math.max(0, d.count | 0);
    const inst = new THREE.InstancedMesh(geo, mat, count);
    inst.castShadow = true;
    inst.receiveShadow = true;

    // Instance colors supported in modern Three.
    if (inst.instanceColor === null) inst.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(count * 3), 3);

    const colA = new THREE.Color(d.color1);
    const colB = new THREE.Color(d.color2);

    const m = new THREE.Matrix4();
    const p = new THREE.Vector3();
    const q = new THREE.Quaternion();
    const s = new THREE.Vector3();

    const up = new THREE.Vector3(0, 1, 0);
    const dir = new THREE.Vector3();
    const tan = new THREE.Vector3();

    function rand01(i) {
      // deterministic-ish [0,1)
      const t = Math.sin((i + 1) * 133.7 + d.seed * 17.3) * 43758.5453123;
      return t - Math.floor(t);
    }

    for (let i = 0; i < count; i++) {
      const r0 = rand01(i);
      const r1 = rand01(i + 19);
      const r2 = rand01(i + 41);

      // Spread around the ellipse seam with slight jitter
      const theta = (i / count) * Math.PI * 2.0 + (r0 - 0.5) * 0.35;

      const ex = cx + a * Math.cos(theta);
      const ez = cz + b * Math.sin(theta);

      // Ellipse outward normal (gradient of implicit ellipse)
      dir.set((ex - cx) / (a * a), (ez - cz) / (b * b), 0); // temp in x,z
      // remap into x,z
      const nx = dir.x, nz = dir.y;
      dir.set(nx, 0, nz).normalize();

      tan.set(-dir.z, 0, dir.x).normalize();

      // Inward offset + a little tangential jitter to avoid "perfect ring"
      const inward = -d.bandWidth * (0.35 + 0.65 * r1);
      const tJ = d.bandWidth * d.tangentJitter * (r2 - 0.5);

      p.set(ex, d.y + (r2 - 0.5) * d.yJitter, ez);
      p.addScaledVector(dir, inward);
      p.addScaledVector(tan, tJ);

      // Slight random orientation (mostly upright)
      q.setFromAxisAngle(up, r0 * Math.PI * 2.0);
      const tiltX = (r1 - 0.5) * 0.35;
      const tiltZ = (r2 - 0.5) * 0.35;
      q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), tiltX));
      q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), tiltZ));

      // Scale
      const sc = d.scaleMin + (d.scaleMax - d.scaleMin) * Math.pow(r0, 1.6);
      s.set(sc, sc * (0.65 + 0.70 * r1), sc);

      m.compose(p, q, s);
      inst.setMatrixAt(i, m);

      // Color lerp
      const c = colA.clone().lerp(colB, r2);
      inst.setColorAt(i, c);
    }

    inst.instanceMatrix.needsUpdate = true;
    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;

    // A few larger "hero" rocks to break silhouette (non-instanced, still cheap)
    const heroes = new THREE.Group();
    const heroCount = Math.max(0, d.heroCount | 0);

    for (let i = 0; i < heroCount; i++) {
      const r0 = rand01(900 + i);
      const r1 = rand01(930 + i);
      const r2 = rand01(960 + i);

      const theta = r0 * Math.PI * 2.0;

      const ex = cx + a * Math.cos(theta);
      const ez = cz + b * Math.sin(theta);

      dir.set((ex - cx) / (a * a), (ez - cz) / (b * b), 0);
      const nx = dir.x, nz = dir.y;
      dir.set(nx, 0, nz).normalize();
      tan.set(-dir.z, 0, dir.x).normalize();

      const inward = -d.bandWidth * (0.20 + 0.55 * r1);
      const tJ = d.bandWidth * 0.20 * (r2 - 0.5);

      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      mesh.position.set(ex, d.y + (r1 - 0.5) * d.yJitter, ez);
      mesh.position.addScaledVector(dir, inward);
      mesh.position.addScaledVector(tan, tJ);

      mesh.rotation.set((r1 - 0.5) * 0.45, r0 * Math.PI * 2.0, (r2 - 0.5) * 0.45);

      const sc = d.heroScaleMin + (d.heroScaleMax - d.heroScaleMin) * Math.pow(r2, 1.3);
      mesh.scale.set(sc, sc * (0.70 + 0.55 * r1), sc);

      // Tint a bit
      mesh.material = mat.clone();
      mesh.material.color = colA.clone().lerp(colB, r0);
      heroes.add(mesh);
    }

    this.el.object3D.add(inst);
    this.el.object3D.add(heroes);
  }
});

    for (let k = 0; k < patchCount; k++) {

      let side = (rand01(8100 + k) < 0.62) ? lastSide : (1 - lastSide);
      if (rand01(8200 + k) < 0.18) side = 1 - side;
      patchSide[k] = side;
      lastSide = side;

      // Cluster extents (compact, but each patch differs).
      patchXSpread[k] = d.patchSpread * (0.36 + 0.46 * rand01(8600 + k));
      patchZSpread[k] = (0.07 + 0.11 * rand01(8700 + k)) * (0.85 + 0.35 * rand01(8720 + k));

      // Place each cluster near an "edge" of the floor, but pulled inward so it stays on the floor material.
      // Then offset each cluster differently so nothing reads as a parallel staged lineup.
      const dir = (side === 0) ? 1 : -1; // 0 -> push toward +z, 1 -> push toward -z
      const edgePos = (side === 0) ? zFloorMin : zFloorMax;
      let inward = (0.05 + 0.18 * Math.pow(rand01(8300 + k), 1.55));
      if (rand01(8500 + k) < 0.28) inward += (0.14 + 0.18 * rand01(8510 + k)); // occasional cluster sits more inward
      const drift = (rand01(8400 + k) - 0.5) * 0.22;
      patchZCenter[k] = clamp(edgePos + dir * inward + drift, zFloorMin + 0.05, zFloorMax - 0.05);

      // Subtle mound height at the heart of each cluster (prevents "flat" reading).
      patchMound[k] = 0.010 + 0.018 * rand01(8800 + k);

      // Keep the first two clusters untouched; refine later tunnel clusters:
      // smaller rocks + slightly tighter patches + pushed a bit closer to the side edges.
      if (k >= 2) {
        // Later tunnel clumps: sit slightly on the floor sides, spread along depth, never pile up.
        patchXSpread[k] *= 1.45;   // more longitudinal spread (X)
        patchZSpread[k] *= 0.68;   // tighter side band (Z)
        patchMound[k]  *= 0.48;    // flatter, less "blob"

        const edgeTarget = (side === 0) ? zFloorMin : zFloorMax;
        patchZCenter[k] = clamp(
          patchZCenter[k] + (edgeTarget - patchZCenter[k]) * 0.62,
          zFloorMin + 0.04,
          zFloorMax - 0.04
        );
      }

      // Make the last two clusters (from the dome: clusters 4+) less cluttered and more naturally distributed.
      // IMPORTANT: first two clusters remain untouched.
      if (k >= 3) {
        // Very late clumps: looser along depth, still tucked to the side, minimal mound.
        patchXSpread[k] *= 1.18;
        patchZSpread[k] *= 0.85;
        patchMound[k]  *= 0.70;

        const edgeTarget2 = (side === 0) ? zFloorMin : zFloorMax;
        patchZCenter[k] = clamp(
          patchZCenter[k] + (edgeTarget2 - patchZCenter[k]) * 0.22,
          zFloorMin + 0.04,
          zFloorMax - 0.04
        );
      }
    }

    // Track placements per patch so rocks get tight but never touch.
    const placed = new Array(patchCount);
    for (let k = 0; k < patchCount; k++) placed[k] = [];
    const up = new THREE.Vector3(0, 1, 0);

    for (let i = 0; i < count; i++) {
      const r0 = rand01(i);

      // Lock each rock to one longitudinal clump.
      const k0 = Math.floor(r0 * patchCount);
      const k = clamp(k0, 0, patchCount - 1);

      // Match later tunnel clumps to the first two: keep clump #3 similar, but make clumps #4-#5 looser.
      const latePatch = (k >= 2);
      const veryLatePatch = (k >= 3);

      // Thin later patches (keeps first two identical). Stronger thinning for later clumps to avoid clutter.
      if (latePatch) {
        // Patch #3: light thinning. Patch #4+: stronger thinning.
        const drop = veryLatePatch ? 0.80 : 0.68;
        if (rand01(5000 + i) < drop) continue;
      }

      // Footprint: late clumps should read elegant (elongated in depth, tucked to the side).
      const xSpread = patchXSpread[k] * (latePatch ? (veryLatePatch ? 1.15 : 1.08) : 1.0);
      const zSpread = patchZSpread[k] * (latePatch ? (veryLatePatch ? 0.95 : 0.92) : 1.0);

      // Stronger dimension variety (still dome-like).
      const sR0 = rand01(i + 19);
      const sR1 = rand01(i + 41);
      const sR2 = rand01(i + 73);
      const sR3 = rand01(i + 97);

      let sc = d.scaleMin + (d.scaleMax - d.scaleMin) * Math.pow(sR0, 1.35);

      // Late patches: stronger size tiering (tiny → big) for nicer variety, without clutter.
      if (latePatch) {
        sc *= (veryLatePatch ? 0.66 : 0.70);

        const tierR = rand01(i + 707);
        if (tierR < 0.18) sc *= 0.55;        // very tiny
        else if (tierR < 0.55) sc *= 0.85;   // small
        else if (tierR < 0.85) sc *= 1.15;   // medium
        else sc *= 1.45;                     // bigger accent
      }

      let sx = (0.58 + 0.92 * sR1);
      let sy = (0.78 + 0.98 * sR2);
      let sz = (0.58 + 0.92 * sR3);
      if (latePatch) {
        // Wider non-uniformity to break "samey" silhouettes.
        sx = (0.40 + 1.28 * sR1);
        sy = (0.50 + 1.40 * sR2);
        sz = (0.38 + 1.30 * sR3);
      }
      s.set(sc * sx, sc * sy, sc * sz);

      // Approx radius for separation checks.
      const rad = Math.max(s.x, s.y, s.z) * 0.58;

      // Hard containment: clamp using the rock radius so the *entire* rock stays inside the tunnel bounds.
      // This prevents any rock (especially large ones) from sticking outside the tunnel or clipping nearby geometry.
      const xBoundMin = x0 + rad;
      const xBoundMax = x1 - rad;
      const zBoundMin = (zFloorMin + 0.03) + rad;
      const zBoundMax = (zFloorMax - 0.03) - rad;

      // Guard against degenerate bands (extreme scales). Fall back to midpoints.
      const xMinR = (xBoundMin <= xBoundMax) ? xBoundMin : (x0 + x1) * 0.5;
      const xMaxR = (xBoundMin <= xBoundMax) ? xBoundMax : (x0 + x1) * 0.5;
      const zMinR = (zBoundMin <= zBoundMax) ? zBoundMin : (zFloorMin + zFloorMax) * 0.5;
      const zMaxR = (zBoundMin <= zBoundMax) ? zBoundMax : (zFloorMin + zFloorMax) * 0.5;

      let x = 0, z = 0, y = 0;
      let placedOk = false;

      // Rejection sampling inside a clump so rocks sit close, but never touch.
      for (let a = 0; a < 16; a++) {
        const rr1 = rand01(i + 101 + a * 97);
        const rr2 = rand01(i + 131 + a * 113);
        const rr3 = rand01(i + 163 + a * 139);
        const rr4 = rand01(i + 197 + a * 151);
        const rr5 = rand01(i + 233 + a * 173);
        const rr6 = rand01(i + 271 + a * 191);
        const rr7 = rand01(i + 311 + a * 211);
        const rr8 = rand01(i + 347 + a * 223);

        // Compact, organic cluster footprint: centered distribution (not "scatter").
        x = patchCenters[k]
          + (rr1 - rr2) * xSpread
          + (rr3 - rr4) * (xSpread * 0.35);
        x = clamp(x, xMinR, xMaxR);

        z = patchZCenter[k]
          + (rr5 - rr6) * zSpread
          + (rr7 - rr8) * (zSpread * 0.22);
        z = clamp(z, zMinR, zMaxR);

        // Pull late-patch rocks slightly closer to the side edge (keeps clusters off-center).
        if (latePatch) {
          const edgeZ = (patchSide[k] === 0) ? zFloorMin : zFloorMax;
          z = z + (edgeZ - z) * (veryLatePatch ? 0.22 : 0.16);
        }

        // Vertical relief: slight "mound" at the heart of each cluster + size-dependent embed.
        const dxn = (x - patchCenters[k]) / (xSpread + 0.0001);
        const dzn = (z - patchZCenter[k]) / (zSpread + 0.0001);
        const dn = Math.sqrt(dxn * dxn + dzn * dzn);
        const mound = Math.pow(Math.max(0.0, 1.0 - dn), 2.0) * patchMound[k];
        const sink = rad * (0.18 + 0.18 * rr2);
        y = d.y + (rr2 - 0.5) * d.yJitter + mound - sink;


        const list = placed[k];
        let ok = true;
        for (let j = 0; j < list.length; j++) {
          const dx = x - list[j].x;
          const dz = z - list[j].z;
          const extraGap = latePatch ? (veryLatePatch ? 0.060 : 0.040) : 0.0;
          const minD = rad + list[j].r + d.gap + extraGap;
          if (dx * dx + dz * dz < minD * minD) { ok = false; break; }
        }

        if (ok) {
          list.push({x: x, z: z, r: rad});
          placedOk = true;
          break;
        }
      }

      if (!placedOk) {
        placed[k].push({x: x, z: z, r: rad});
      }

      p.set(x, y, z);

      // Orientation (mostly upright, small tilts)
      q.setFromAxisAngle(up, rand01(i + 17) * Math.PI * 2.0);
      const tiltX = (rand01(i + 311) - 0.5) * 0.55;
      const tiltZ = (rand01(i + 347) - 0.5) * 0.55;
      q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), tiltX));
      q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), tiltZ));

      m.compose(p, q, s);
      inst.setMatrixAt(i, m);

      const c = colA.clone().lerp(colB, rand01(i + 401));
      inst.setColorAt(i, c);
    }

    inst.instanceMatrix.needsUpdate = true;
    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;

    // Larger hero rocks (break rhythm, still natural)
    const heroes = new THREE.Group();
    const heroCount = Math.max(0, d.heroCount | 0);

    for (let i = 0; i < heroCount; i++) {
      const r0 = rand01(900 + i);
      const r1 = rand01(930 + i);
      const r2 = rand01(960 + i);
      const r3 = rand01(990 + i);

      const k = Math.floor(r0 * patchCount);

      // Keep hero rocks only in the first two clumps (later clumps read too heavy)
      if (k >= 2) continue;
      let x = patchCenters[k] + (r1 - 0.5) * (d.patchSpread * 1.15);
      x = clamp(x, x0, x1);

      // Heroes live inside the same cluster footprint (keeps the read as small "masses", not single props).
      let z = patchZCenter[k]
        + (r2 - r1) * (patchZSpread[k] * 0.85)
        + (r3 - 0.5) * 0.04;
      z = clamp(z, zFloorMin + 0.03, zFloorMax - 0.03);

      // Compute hero scale early so we can clamp by radius and guarantee full containment.
      const sc = d.heroScaleMin + (d.heroScaleMax - d.heroScaleMin) * Math.pow(r2, 1.3);
      const hSx = sc * (0.80 + 0.40 * r1);
      const hSy = sc * (0.60 + 0.50 * r2);
      const hSz = sc * (0.80 + 0.40 * r3);
      const radH = Math.max(hSx, hSy, hSz) * 0.58;

      const xBoundMinH = x0 + radH;
      const xBoundMaxH = x1 - radH;
      const zBoundMinH = (zFloorMin + 0.03) + radH;
      const zBoundMaxH = (zFloorMax - 0.03) - radH;

      const xMinH = (xBoundMinH <= xBoundMaxH) ? xBoundMinH : (x0 + x1) * 0.5;
      const xMaxH = (xBoundMinH <= xBoundMaxH) ? xBoundMaxH : (x0 + x1) * 0.5;
      const zMinH = (zBoundMinH <= zBoundMaxH) ? zBoundMinH : (zFloorMin + zFloorMax) * 0.5;
      const zMaxH = (zBoundMinH <= zBoundMaxH) ? zBoundMaxH : (zFloorMin + zFloorMax) * 0.5;

      x = clamp(x, xMinH, xMaxH);
      z = clamp(z, zMinH, zMaxH);

      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      {
      const dxn = (x - patchCenters[k]) / (patchXSpread[k] + 0.0001);
      const dzn = (z - patchZCenter[k]) / (patchZSpread[k] + 0.0001);
      const dn = Math.sqrt(dxn * dxn + dzn * dzn);
      const mound = Math.pow(Math.max(0.0, 1.0 - dn), 2.0) * patchMound[k];

      // Size-dependent embed so heroes feel weighty (not floating), plus a touch of mound lift.
      const sink = sc * (0.20 + 0.16 * r1);

      const yHero = d.y + (r3 - 0.5) * d.yJitter + mound - sink;
      mesh.position.set(x, yHero, z);
      }
      mesh.rotation.set((r1 - 0.5) * 0.45, r0 * Math.PI * 2.0, (r2 - 0.5) * 0.45);

            mesh.scale.set(hSx, hSy, hSz);

      mesh.material = mat.clone();
      mesh.material.color = colA.clone().lerp(colB, r0);
      heroes.add(mesh);
    }

    this.el.object3D.add(inst);
    this.el.object3D.add(heroes);
  }
});

AFRAME.registerComponent('procedural-pebble-decal', {
  schema: {
    seed: {type: 'int', default: 1},
    density: {type: 'number', default: 1.0},
    edgeFade: {type: 'number', default: 0.85}
  },

  init: function () {
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    this._apply();
  },

  _rand: function (n) {
    const s = Math.sin(n) * 43758.5453123;
    return s - Math.floor(s);
  },

  _apply: function () {
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;

    const mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
    if (!mat) return;

    const N = 256;
    const canvas = document.createElement('canvas');
    canvas.width = N; canvas.height = N;
    const ctx = canvas.getContext('2d');

    // Base: transparent
    ctx.clearRect(0, 0, N, N);

    // Soft edge fade (kills hard decal rectangle)
    const grd = ctx.createRadialGradient(N*0.5, N*0.5, N*0.05, N*0.5, N*0.5, N*0.55);
    grd.addColorStop(0.0, 'rgba(255,255,255,1)');
    grd.addColorStop(this.data.edgeFade, 'rgba(255,255,255,0.85)');
    grd.addColorStop(1.0, 'rgba(255,255,255,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, N, N);

    // Pebbles (small dark specs)
    const baseCount = Math.floor(120 * Math.max(0.2, this.data.density));
    for (let i = 0; i < baseCount; i++) {
      const r0 = this._rand((i + 1) * 17.17 + this.data.seed * 31.3);
      const r1 = this._rand((i + 2) * 91.73 + this.data.seed * 7.7);
      const r2 = this._rand((i + 3) * 53.11 + this.data.seed * 19.9);

      const x = r0 * N;
      const y = r1 * N;
      const rad = 0.8 + r2 * 2.4;

      // draw pebble as soft circle in ALPHA only (white RGB)
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      const a = 0.10 + 0.22 * r2;
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fill();
    }

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.needsUpdate = true;

    mat.transparent = true;
    mat.depthWrite = false;
    mat.alphaMap = tex;
    mat.map = tex;                 // keep RGB white so material color dominates, but reuse alpha
    mat.polygonOffset = true;
    mat.polygonOffsetFactor = -3;
    mat.polygonOffsetUnits = -3;
    mesh.renderOrder = 12;
    mat.needsUpdate = true;
  }
});

/**
 * Triplanar world-space projection for the *diffuse/basecolor map only* on MeshStandardMaterial.
 * This removes UV pole "convergence" artifacts on sphere/ellipsoid ceilings without touching
 * the rest of the PBR pipeline (normal/roughness/AO remain unchanged for stability).
 *
 * Usage:
 */
AFRAME.registerComponent('triplanar-diffuse', {
  schema: {
    // Repeats per meter in world space.
    scale: {type: 'number', default: 0.35},
    // Blend sharpness between projections (higher = crisper).
    sharpness: {type: 'number', default: 4.0}
  },

  init: function () {
    this._applied = false;
    this._inv = new THREE.Matrix4();
    this._apply = this._apply.bind(this);
    this.el.addEventListener('object3dset', this._apply);
    this.el.addEventListener('model-loaded', this._apply);
    setTimeout(this._apply, 0);
  },

  update: function () {
    this._applied = false;
    this._apply();
  },

  remove: function () {
    this.el.removeEventListener('object3dset', this._apply);
    this.el.removeEventListener('model-loaded', this._apply);
  },

  _apply: function () {
    if (this._applied) return;

    const root = this.el.getObject3D('mesh');
    if (!root) return;

    const scale = this.data.scale;
    const sharpness = this.data.sharpness;

    const patchOne = (mat) => {
      if (!mat || !mat.isMeshStandardMaterial) return;
      if (mat.userData && mat.userData._triDiffusePatched) return;

      mat.userData = mat.userData || {};
      mat.userData._triDiffusePatched = true;

      if (mat.map) {
        mat.map.wrapS = THREE.RepeatWrapping;
        mat.map.wrapT = THREE.RepeatWrapping;
        mat.map.needsUpdate = true;
      }

      const prevOnBeforeCompile = mat.onBeforeCompile;
      mat.onBeforeCompile = function (shader) {
        if (prevOnBeforeCompile) prevOnBeforeCompile(shader);

        shader.uniforms.triScale = { value: scale };
        shader.uniforms.triSharpness = { value: sharpness };

        // Vertex: add world position + world normal varyings.
        if (shader.vertexShader.indexOf('varying vec3 vTriWorldPos;') === -1) {
          shader.vertexShader = shader.vertexShader.replace(
            '#include <common>',
            '#include <common>\nvarying vec3 vTriWorldPos;\nvarying vec3 vTriWorldNormal;'
          );

          shader.vertexShader = shader.vertexShader.replace(
            '#include <begin_vertex>',
            '#include <begin_vertex>\nvec4 triWorldPos = modelMatrix * vec4( transformed, 1.0 );\nvTriWorldPos = triWorldPos.xyz;'
          );

          shader.vertexShader = shader.vertexShader.replace(
            '#include <beginnormal_vertex>',
            '#include <beginnormal_vertex>\nvTriWorldNormal = normalize( mat3( modelMatrix ) * objectNormal );'
          );
        }

        // Fragment: helpers + replace the map sampling line in <map_fragment>.
        if (shader.fragmentShader.indexOf('vec4 triSampleColor') === -1) {
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <common>',
            '#include <common>\n' +
            'varying vec3 vTriWorldPos;\n' +
            'varying vec3 vTriWorldNormal;\n' +
            'uniform float triScale;\n' +
            'uniform float triSharpness;\n' +
            'vec3 triWeights(vec3 n){\n' +
            '  vec3 an = abs(n);\n' +
            '  an = pow(an, vec3(triSharpness));\n' +
            '  return an / (an.x + an.y + an.z + 1e-5);\n' +
            '}\n' +
            'vec4 triSampleColor(sampler2D tex, vec3 p, vec3 n){\n' +
            '  vec3 w = triWeights(n);\n' +
            '  vec2 uvx = p.yz * triScale;\n' +
            '  vec2 uvy = p.zx * triScale;\n' +
            '  vec2 uvz = p.xy * triScale;\n' +
            '  return texture2D(tex, uvx) * w.x + texture2D(tex, uvy) * w.y + texture2D(tex, uvz) * w.z;\n' +
            '}\n'
          );

          // Replace the sampledDiffuseColor assignment (keeps the rest of the chunk intact).
          shader.fragmentShader = shader.fragmentShader.replace(
            /vec4\s+sampledDiffuseColor\s*=\s*texture2D\(\s*map\s*,\s*vUv\s*\)\s*;/,
            'vec4 sampledDiffuseColor = triSampleColor( map, vTriWorldPos, normalize(vTriWorldNormal) );'
          );
        }
      };

      mat.needsUpdate = true;
    };

    root.traverse((o) => {
      if (!o || !o.isMesh || !o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(patchOne);
    });

    this._applied = true;
  }
});

/**
 * Clips a mesh in fragment shader to a spherical segment (phi/theta ranges),
 * avoiding UV-pole pinching artifacts by allowing us to use an icosahedron dome.
 *
 * Angles are in DEGREES to match A-Frame sphere geometry params.
 */
AFRAME.registerComponent('spherical-segment-clip', {
  schema: {
    phiStart:   {type: 'number', default: 0},
    phiLength:  {type: 'number', default: 360},
    thetaStart: {type: 'number', default: 0},
    thetaLength:{type: 'number', default: 180}
  },
  init: function () {
    this._applied = false;
    this._inv = new THREE.Matrix4();
    this._onSet = (e) => {
      if (e.detail && e.detail.type === 'mesh') this.apply();
    };
    this.el.addEventListener('object3dset', this._onSet);
    // In case mesh already exists.
    this.apply();
  },
  remove: function () {
    this.el.removeEventListener('object3dset', this._onSet);
  },
  update: function () {
    // Re-apply uniforms if already applied.
