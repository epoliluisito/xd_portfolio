<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: Arial, sans-serif; 
            overflow: hidden; 
            background: #000;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }

        #rotateOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10000; color: white; text-align: center; padding: 20px;
        }
        #rotateOverlay.hidden { display: none; }
        .rotate-icon { font-size: 80px; margin-bottom: 20px; }

        #guideOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); 
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; 
            z-index: 9000;
            color: white; padding: 30px; text-align: center;
            touch-action: auto;
        }
        #guideOverlay.hidden { display: none; }
        #guideOverlay h1 { font-size: 32px; margin-bottom: 30px; color: #667eea; }
        .guide-item { 
            margin: 15px 0; padding: 15px; 
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px; max-width: 400px;
        }
        .guide-item h3 { font-size: 18px; margin-bottom: 8px; color: #a0aeff; }
        
        #startButton {
            padding: 20px 60px; 
            font-size: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-weight: bold;
            margin-top: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.6);
            touch-action: manipulation;
            -webkit-tap-highlight-color: rgba(255,255,255,0.3);
        }
        #startButton:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.4);
        }

        #joystickContainer {
            position: fixed; bottom: 30px; left: 30px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%; z-index: 1000; display: none;
            touch-action: none;
        }
        #joystickContainer.visible { display: block; }
        #joystickKnob {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%; transition: all 0.1s;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="rotateOverlay">
        <div class="rotate-icon">📱</div>
        <h2>Please Rotate to Landscape</h2>
        <p>Turn your device sideways</p>
    </div>

    <div id="guideOverlay">
        <h1>🎮 Welcome!</h1>
        <div class="guide-item">
            <h3>👆 Look Around</h3>
            <p>Touch and drag to look</p>
        </div>
        <div class="guide-item">
            <h3>🕹️ Movement</h3>
            <p>Use joystick to move</p>
        </div>
        <div class="guide-item">
            <h3>🌍 Explore</h3>
            <p>Walk around the world!</p>
        </div>
        <button id="startButton">TAP TO START</button>
    </div>

    <div id="joystickContainer">
        <div id="joystickKnob"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const rotateOverlay = document.getElementById('rotateOverlay');
        const guideOverlay = document.getElementById('guideOverlay');
        const startButton = document.getElementById('startButton');
        const canvas = document.getElementById('gameCanvas');
        const joystickContainer = document.getElementById('joystickContainer');
        const joystickKnob = document.getElementById('joystickKnob');

        let gameStarted = false;
        let scene, camera, renderer, touchControls;

        // Orientation check
        function checkOrientation() {
            const isLandscape = window.innerWidth > window.innerHeight;
            
            if (!gameStarted) {
                if (isLandscape) {
                    rotateOverlay.classList.add('hidden');
                    guideOverlay.classList.remove('hidden');
                } else {
                    rotateOverlay.classList.remove('hidden');
                    guideOverlay.classList.add('hidden');
                }
            } else {
                rotateOverlay.classList.toggle('hidden', isLandscape);
            }
        }

        window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 100));
        window.addEventListener('resize', () => {
            checkOrientation();
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // Start game function
        function startGame() {
            if (gameStarted) return; // Prevent double-start
            
            console.log('Starting game...');
            gameStarted = true;
            guideOverlay.classList.add('hidden');
            joystickContainer.classList.add('visible');
            
            // Small delay to ensure UI updates
            setTimeout(() => {
                initGame();
            }, 100);
        }

        // Multiple event listeners for better compatibility
        startButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startButton.style.transform = 'scale(0.95)';
        });

        startButton.addEventListener('touchend', (e) => {
            e.preventDefault();
            startButton.style.transform = 'scale(1)';
            startGame();
        });

        startButton.addEventListener('click', (e) => {
            e.preventDefault();
            startGame();
        });

        // Touch Controls
        class TouchControls {
            constructor(camera) {
                this.camera = camera;
                this.rotationX = 0;
                this.rotationY = 0;
                this.moveX = 0;
                this.moveZ = 0;

                this.setupLookControls();
                this.setupJoystick();
            }

            setupLookControls() {
                let touchStartX = 0;
                let touchStartY = 0;

                canvas.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                    }
                }, { passive: true });

                canvas.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 1) {
                        const deltaX = e.touches[0].clientX - touchStartX;
                        const deltaY = e.touches[0].clientY - touchStartY;

                        this.rotationY -= deltaX * 0.003;
                        this.rotationX -= deltaY * 0.003;
                        this.rotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, this.rotationX));

                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                    }
                }, { passive: true });
            }

            setupJoystick() {
                let joystickActive = false;
                let joystickCenterX, joystickCenterY;

                joystickContainer.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    joystickActive = true;
                    const rect = joystickContainer.getBoundingClientRect();
                    joystickCenterX = rect.left + rect.width / 2;
                    joystickCenterY = rect.top + rect.height / 2;
                }, { passive: false });

                joystickContainer.addEventListener('touchmove', (e) => {
                    if (!joystickActive) return;
                    e.preventDefault();

                    const touch = e.touches[0];
                    const deltaX = touch.clientX - joystickCenterX;
                    const deltaY = touch.clientY - joystickCenterY;

                    const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                    const maxDistance = 35;
                    const clampedDistance = Math.min(distance, maxDistance);

                    const angle = Math.atan2(deltaY, deltaX);
                    const knobX = Math.cos(angle) * clampedDistance;
                    const knobY = Math.sin(angle) * clampedDistance;

                    joystickKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;

                    this.moveX = deltaX / maxDistance;
                    this.moveZ = deltaY / maxDistance;
                }, { passive: false });

                joystickContainer.addEventListener('touchend', () => {
                    joystickActive = false;
                    joystickKnob.style.transform = 'translate(-50%, -50%)';
                    this.moveX = 0;
                    this.moveZ = 0;
                });
            }

            update(delta) {
                const euler = new THREE.Euler(this.rotationX, this.rotationY, 0, 'YXZ');
                this.camera.quaternion.setFromEuler(euler);

                if (Math.abs(this.moveX) > 0.1 || Math.abs(this.moveZ) > 0.1) {
                    const speed = 5.0;
                    const direction = new THREE.Vector3(-this.moveX, 0, -this.moveZ);
                    direction.normalize();
                    direction.applyQuaternion(this.camera.quaternion);
                    direction.y = 0;
                    direction.normalize();
                    this.camera.position.addScaledVector(direction, speed * delta);
                }
                
                this.camera.position.y = 1.6;
            }
        }

        // Initialize Game
        function initGame() {
            console.log('Initializing Three.js scene...');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5);

            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: false,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Add colorful cubes
            for (let i = 0; i < 15; i++) {
                const geometry = new THREE.BoxGeometry(1, 2, 1);
                const material = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.set((Math.random() - 0.5) * 40, 1, (Math.random() - 0.5) * 40);
                cube.castShadow = true;
                scene.add(cube);
            }

            touchControls = new TouchControls(camera);

            let lastTime = performance.now();
            
            function animate() {
                requestAnimationFrame(animate);
                const currentTime = performance.now();
                const delta = (currentTime - lastTime) / 1000;
                lastTime = currentTime;

                if (touchControls) touchControls.update(delta);
                renderer.render(scene, camera);
            }

            animate();
            console.log('Game running!');
        }

        // Prevent default behaviors
        document.addEventListener('touchmove', (e) => {
            if (gameStarted) e.preventDefault();
        }, { passive: false });

        // Initialize
        checkOrientation();
    </script>
</body>
</html>
