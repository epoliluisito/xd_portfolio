<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Mobile Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            background: #000;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Rotate Screen Overlay */
        #rotateOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: white;
            text-align: center;
            padding: 20px;
        }
        #rotateOverlay.hidden {
            display: none;
        }
        .rotate-icon {
            font-size: 80px;
            animation: rotate 2s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        /* User Guide Overlay */
        #guideOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9000;
            color: white;
            padding: 30px;
            text-align: center;
        }
        #guideOverlay.hidden {
            display: none;
        }
        #guideOverlay h1 {
            font-size: 32px;
            margin-bottom: 30px;
            color: #667eea;
        }
        .guide-item {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            max-width: 400px;
        }
        .guide-item h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #a0aeff;
        }
        #startButton {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            margin-top: 20px;
        }
        #startButton:active {
            transform: scale(0.95);
        }

        /* Joystick */
        #joystickContainer {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            z-index: 1000;
            display: none;
        }
        #joystickContainer.visible {
            display: block;
        }
        #joystickKnob {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transition: all 0.1s;
        }
    </style>
</head>
<body>
    <!-- Rotate Screen Overlay -->
    <div id="rotateOverlay">
        <div class="rotate-icon">📱</div>
        <h2>Please Rotate Your Device</h2>
        <p>This experience works best in landscape mode</p>
    </div>

    <!-- User Guide Overlay -->
    <div id="guideOverlay">
        <h1>🎮 Welcome!</h1>
        <div class="guide-item">
            <h3>👆 Look Around</h3>
            <p>Touch and drag to look around</p>
        </div>
        <div class="guide-item">
            <h3>🕹️ Movement</h3>
            <p>Use the joystick to move</p>
        </div>
        <div class="guide-item">
            <h3>🌍 Explore</h3>
            <p>Explore the environment!</p>
        </div>
        <button id="startButton">Start Experience</button>
    </div>

    <!-- Joystick -->
    <div id="joystickContainer">
        <div id="joystickKnob"></div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // UI Elements
        const rotateOverlay = document.getElementById('rotateOverlay');
        const guideOverlay = document.getElementById('guideOverlay');
        const startButton = document.getElementById('startButton');
        const canvas = document.getElementById('gameCanvas');
        const joystickContainer = document.getElementById('joystickContainer');
        const joystickKnob = document.getElementById('joystickKnob');

        let gameStarted = false;
        let scene, camera, renderer;
        let touchControls;

        // Orientation Check
        function checkOrientation() {
            const isLandscape = window.innerWidth > window.innerHeight;
            
            if (!gameStarted) {
                rotateOverlay.classList.toggle('hidden', isLandscape);
                guideOverlay.classList.toggle('hidden', !isLandscape);
            } else {
                rotateOverlay.classList.toggle('hidden', isLandscape);
            }
        }

        window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 100));
        window.addEventListener('resize', () => {
            checkOrientation();
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // Start Game
        startButton.addEventListener('click', () => {
            gameStarted = true;
            guideOverlay.classList.add('hidden');
            joystickContainer.classList.add('visible');
            initGame();
        });

        // Touch Controls
        class TouchControls {
            constructor(camera) {
                this.camera = camera;
                this.rotationX = 0;
                this.rotationY = 0;
                this.velocity = new THREE.Vector3();
                this.moveX = 0;
                this.moveZ = 0;

                this.setupLookControls();
                this.setupJoystick();
            }

            setupLookControls() {
                let touchStartX = 0;
                let touchStartY = 0;

                canvas.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                    }
                }, { passive: true });

                canvas.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 1) {
                        const deltaX = e.touches[0].clientX - touchStartX;
                        const deltaY = e.touches[0].clientY - touchStartY;

                        this.rotationY -= deltaX * 0.003;
                        this.rotationX -= deltaY * 0.003;
                        this.rotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, this.rotationX));

                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                    }
                }, { passive: true });
            }

            setupJoystick() {
                let joystickActive = false;
                let joystickCenterX, joystickCenterY;

                joystickContainer.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    joystickActive = true;
                    const rect = joystickContainer.getBoundingClientRect();
                    joystickCenterX = rect.left + rect.width / 2;
                    joystickCenterY = rect.top + rect.height / 2;
                });

                joystickContainer.addEventListener('touchmove', (e) => {
                    if (!joystickActive) return;
                    e.preventDefault();

                    const touch = e.touches[0];
                    const deltaX = touch.clientX - joystickCenterX;
                    const deltaY = touch.clientY - joystickCenterY;

                    const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                    const maxDistance = 35;
                    const clampedDistance = Math.min(distance, maxDistance);

                    const angle = Math.atan2(deltaY, deltaX);
                    const knobX = Math.cos(angle) * clampedDistance;
                    const knobY = Math.sin(angle) * clampedDistance;

                    joystickKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;

                    this.moveX = deltaX / maxDistance;
                    this.moveZ = deltaY / maxDistance;
                });

                joystickContainer.addEventListener('touchend', () => {
                    joystickActive = false;
                    joystickKnob.style.transform = 'translate(-50%, -50%)';
                    this.moveX = 0;
                    this.moveZ = 0;
                });
            }

            update(delta) {
                // Update camera rotation
                const euler = new THREE.Euler(this.rotationX, this.rotationY, 0, 'YXZ');
                this.camera.quaternion.setFromEuler(euler);

                // Update movement
                if (this.moveX !== 0 || this.moveZ !== 0) {
                    const speed = 5.0;
                    const direction = new THREE.Vector3(-this.moveX, 0, -this.moveZ);
                    direction.normalize();
                    direction.applyQuaternion(this.camera.quaternion);
                    direction.y = 0;
                    direction.normalize();

                    this.camera.position.addScaledVector(direction, speed * delta);
                }
                
                this.camera.position.y = 1.6; // Keep at eye level
            }
        }

        // Initialize Game
        function initGame() {
            console.log('Initializing game...');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 1.6, 5);

            // Renderer
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: false,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Ground
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x228B22,
                roughness: 0.8
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Add objects
            for (let i = 0; i < 15; i++) {
                const geometry = new THREE.BoxGeometry(1, 2, 1);
                const material = new THREE.MeshStandardMaterial({
                    color: Math.random() * 0xffffff
                });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.set(
                    (Math.random() - 0.5) * 40,
                    1,
                    (Math.random() - 0.5) * 40
                );
                cube.castShadow = true;
                scene.add(cube);
            }

            // Initialize controls
            touchControls = new TouchControls(camera);

            // Start animation
            let lastTime = performance.now();
            
            function animate() {
                requestAnimationFrame(animate);

                const currentTime = performance.now();
                const delta = (currentTime - lastTime) / 1000;
                lastTime = currentTime;

                if (touchControls) {
                    touchControls.update(delta);
                }

                renderer.render(scene, camera);
            }

            animate();
            console.log('Game initialized!');
        }

        // Prevent scrolling
        document.addEventListener('touchmove', (e) => {
            if (gameStarted) e.preventDefault();
        }, { passive: false });

        // Initial check
        checkOrientation();
    </script>
</body>
</html>
