<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BATCH 2/3</title>
<style>
  :root {
    --pink: #f4b9c4;
    --grey: #d2d2d2;
    --bar: 46px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: var(--bar); }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #111;
    padding-top: var(--bar);
    scroll-snap-type: y proximity;
  }

  /* ---- top menu bar ---- */
  .bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--bar);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: #fff;
    border-bottom: 1px solid rgba(0,0,0,.09);
    z-index: 500;
  }
  .bar__label {
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #111;
    opacity: .5;
  }
  .bar__nav { display: flex; gap: 6px; }
  .bar__nav a {
    display: block;
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.25);
    text-indent: -9999px;
    overflow: hidden;
  }
  .bar__nav a:nth-child(1) { background: #fff; }
  .bar__nav a:nth-child(2) { background: var(--pink); border-color: transparent; }
  .bar__nav a:nth-child(3) { background: var(--grey); border-color: transparent; }

  /* ---- page blocks ---- */
  .block {
    height: calc(100vh - var(--bar));
    display: flex;
    flex-direction: column;
    padding: 22px 34px 26px;
    scroll-snap-align: start;
  }
  .block--white { background: #ffffff; }
  .block--pink  { background: var(--pink); }
  .block--grey  { background: var(--grey); }

  .title {
    flex: 0 0 auto;
    font-size: clamp(22px, 3.4vw, 46px);
    line-height: 1;
    letter-spacing: -0.02em;
    font-weight: 800;
    text-transform: uppercase;
    margin: 0 0 16px;
  }
  .block--white .title { color: var(--pink); }
  .block--pink  .title { color: #ffffff; }
  .block--grey  .title { color: var(--pink); }

  .gridwrap { flex: 1 1 auto; min-height: 0; }
  .grid {
    display: grid;
    gap: 10px;
    height: 100%;
    align-content: start;
    justify-content: start;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .16s ease;
  }
  .cell--full { cursor: zoom-in; }
  .cell--full:hover { transform: scale(1.07); }
  .cell img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }

  /* ---- overlay ---- */
  .ov {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.55);
    z-index: 999;
  }
  .ov.open { display: flex; }
  .ov__panel {
    position: relative;
    width: 84vw;
    height: 84vh;
    border-radius: 6px;
    box-shadow: 0 30px 80px rgba(0,0,0,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 52px;
    background: #fff;
  }
  .ov__panel img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
  .ov__close {
    position: absolute;
    top: 10px; right: 12px;
    width: 40px; height: 40px;
    border: none; background: transparent;
    font-size: 30px; line-height: 1;
    cursor: pointer; color: #111; opacity: .55;
  }
  .ov__close:hover { opacity: 1; }
  .ov__nav {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 44px; height: 64px;
    border: none; background: transparent;
    font-size: 34px; cursor: pointer; color: #111; opacity: .3;
  }
  .ov__nav:hover { opacity: .9; }
  .ov__prev { left: 6px; }
  .ov__next { right: 6px; }
  .ov__cap {
    position: absolute;
    bottom: 14px; left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    opacity: .45;
  }

  @media (max-width: 640px) {
    .block { padding: 16px 16px 20px; }
    .grid { gap: 6px; }
    .ov__panel { width: 94vw; height: 80vh; padding: 28px; }
  }
</style>
</head>
<body>

<div class="bar">
  <span class="bar__label">Plusso &middot; Batch 2/3</span>
  <nav class="bar__nav">
    <a href="#b1">White</a>
    <a href="#b2">Pink</a>
    <a href="#b3">Grey</a>
  </nav>
</div>

<section class="block block--white" id="b1">
  <h1 class="title">Batch 2/3</h1>
  <div class="gridwrap"><div class="grid" data-bg="#ffffff"></div></div>
</section>

<section class="block block--pink" id="b2">
  <h1 class="title">Batch 2/3</h1>
  <div class="gridwrap"><div class="grid" data-bg="#f4b9c4"></div></div>
</section>

<section class="block block--grey" id="b3">
  <h1 class="title">Batch 2/3</h1>
  <div class="gridwrap"><div class="grid" data-bg="#d2d2d2"></div></div>
</section>

<div class="ov" id="ov">
  <div class="ov__panel" id="ovPanel">
    <button class="ov__close" id="ovClose" aria-label="Close">&times;</button>
    <button class="ov__nav ov__prev" id="ovPrev" aria-label="Previous">&#8249;</button>
    <img id="ovImg" src="" alt="">
    <button class="ov__nav ov__next" id="ovNext" aria-label="Next">&#8250;</button>
    <div class="ov__cap" id="ovCap"></div>
  </div>
</div>

<script>
const ITEMS = [
  {
    "src": "assets/amused_V2.png",
    "thumb": "assets/_thumbs/amused_V2.png",
    "name": "amused_V2"
  },
  {
    "src": "assets/curious_V2.png",
    "thumb": "assets/_thumbs/curious_V2.png",
    "name": "curious_V2"
  },
  {
    "src": "assets/end_card_01_V2.png",
    "thumb": "assets/_thumbs/end_card_01_V2.png",
    "name": "end_card_01_V2"
  },
  {
    "src": "assets/happy2_V2.png",
    "thumb": "assets/_thumbs/happy2_V2.png",
    "name": "happy2_V2"
  },
  {
    "src": "assets/hero%20angry_V2.png",
    "thumb": "assets/_thumbs/hero%20angry_V2.png",
    "name": "hero angry_V2"
  },
  {
    "src": "assets/hero%20laugh_V2.png",
    "thumb": "assets/_thumbs/hero%20laugh_V2.png",
    "name": "hero laugh_V2"
  },
  {
    "src": "assets/landscape_phone_01_V2.png",
    "thumb": "assets/_thumbs/landscape_phone_01_V2.png",
    "name": "landscape_phone_01_V2"
  },
  {
    "src": "assets/plusso%20arms%20crossed%202.png",
    "thumb": "assets/_thumbs/plusso%20arms%20crossed%202.png",
    "name": "plusso arms crossed 2"
  },
  {
    "src": "assets/plusso%20arms%20crossed.png",
    "thumb": "assets/_thumbs/plusso%20arms%20crossed.png",
    "name": "plusso arms crossed"
  },
  {
    "src": "assets/plusso%20celebration.png",
    "thumb": "assets/_thumbs/plusso%20celebration.png",
    "name": "plusso celebration"
  },
  {
    "src": "assets/plusso%20confused.png",
    "thumb": "assets/_thumbs/plusso%20confused.png",
    "name": "plusso confused"
  },
  {
    "src": "assets/plusso%20eyebrow%20thumbs%20up.png",
    "thumb": "assets/_thumbs/plusso%20eyebrow%20thumbs%20up.png",

  },
  {

  {

  },
  {
    "src": "assets/plusso%20thumbs%20up%201.png",
    "thumb": "assets/_thumbs/plusso%20thumbs%20up%201.png",
    "name": "plusso thumbs up 1"
  },
  {
    "src": "assets/portrait_phone_01_V2.png",
    "thumb": "assets/_thumbs/portrait_phone_01_V2.png",
    "name": "portrait_phone_01_V2"
  },
  {
    "src": "assets/scared%202_V2.png",
    "thumb": "assets/_thumbs/scared%202_V2.png",
    "name": "scared 2_V2"
  },
  {
    "src": "assets/Scared_V2.png",
    "thumb": "assets/_thumbs/Scared_V2.png",
    "name": "Scared_V2"
  },
  {
    "src": "assets/Smile%201_V2.png",
    "thumb": "assets/_thumbs/Smile%201_V2.png",
    "name": "Smile 1_V2"
  },
  {
    "src": "assets/waving12_V2.png",
    "thumb": "assets/_thumbs/waving12_V2.png",
    "name": "waving12_V2"
  }
];
const SLOTS = 36;   // places reserved per block

/* build the cells: real images first, empty placeholders after */
document.querySelectorAll('.grid').forEach(grid => {
  for (let i = 0; i < SLOTS; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    if (i < ITEMS.length) {
      cell.classList.add('cell--full');
      cell.dataset.index = i;
      cell.dataset.bg = grid.dataset.bg;
      const img = document.createElement('img');
      img.src = ITEMS[i].thumb;
      img.alt = ITEMS[i].name;
      img.loading = 'lazy';
      cell.appendChild(img);
    }
    grid.appendChild(cell);
  }
});

/* choose the column count that makes the cells as large as possible
   while all SLOTS still fit inside one screen-height block */
function layout() {
  document.querySelectorAll('.grid').forEach(grid => {
    const wrap = grid.parentElement;
    const W = wrap.clientWidth, H = wrap.clientHeight;
    if (!W || !H) return;
    const gap = parseFloat(getComputedStyle(grid).gap) || 10;
    let best = { size: 0, cols: 1 };
    for (let c = 1; c <= SLOTS; c++) {
      const r = Math.ceil(SLOTS / c);
      const cw = (W - gap * (c - 1)) / c;
      const ch = (H - gap * (r - 1)) / r;
      const size = Math.min(cw, ch);
      if (size > best.size) best = { size, cols: c };
    }
    grid.style.gridTemplateColumns = 'repeat(' + best.cols + ', ' + best.size + 'px)';
    grid.style.gridAutoRows = best.size + 'px';
  });
}
layout();
window.addEventListener('resize', layout);

/* ---- overlay ---- */
const ov = document.getElementById('ov');
const ovPanel = document.getElementById('ovPanel');
const ovImg = document.getElementById('ovImg');
const ovCap = document.getElementById('ovCap');
let cur = 0;

function show(i) {
  if (!ITEMS.length) return;
  cur = (i + ITEMS.length) % ITEMS.length;
  ovImg.src = ITEMS[cur].src;
  ovCap.textContent = ITEMS[cur].name;
}
function openOv(i, bg) {
  ovPanel.style.background = bg || '#fff';
  show(i);
  ov.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeOv() {
  ov.classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('click', e => {
  const cell = e.target.closest('.cell--full');
  if (cell) openOv(+cell.dataset.index, cell.dataset.bg);
});
document.getElementById('ovClose').addEventListener('click', closeOv);
document.getElementById('ovPrev').addEventListener('click', e => { e.stopPropagation(); show(cur - 1); });
document.getElementById('ovNext').addEventListener('click', e => { e.stopPropagation(); show(cur + 1); });
ov.addEventListener('click', e => { if (e.target === ov) closeOv(); });
document.addEventListener('keydown', e => {
  if (!ov.classList.contains('open')) return;
  if (e.key === 'Escape') closeOv();
  if (e.key === 'ArrowLeft') show(cur - 1);
  if (e.key === 'ArrowRight') show(cur + 1);
});
</script>
</body>
</html>
